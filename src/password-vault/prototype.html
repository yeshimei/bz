<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>密码本 · 原型预览（真行为单源）</title>
<!--
  ┌────────────────────────────────────────────────────────────────────────┐
  │ 本文件 = 密码本域 UI 的评审壳（行为单源版，issue 251/ADR-0106，          │
  │ 范式随 clipbook 适配）。                                                │
  │ 组件样式零内联，全部来自（与 build-css SOURCES 同序）：                  │
  │   ../core/styles.css → ../core/ui/tokens.css → ../core/ui/components.css │
  │   → ./styles.css                                                        │
  │ markup 单源（ADR-0104）：面板骨架/平台行/账号卡/锁屏/弹层 HTML 出自       │
  │   ./render.ts（构建产物 prototype-render.js 在 git，但壳不自绘渲染——      │
  │   两侧 markup 均由真 ui.ts 消费同一份）。                                │
  │ 行为单源（issue 251/ADR-0106）：交互逻辑全部是插件同款 ui.ts 依赖链——     │
  │   经 ./prototype-behavior.js（src/password-vault/fake-sim.ts 构建，       │
  │   alias obsidian→公共假层）在下方两个 iframe 视图里跑真行为；             │
  │   桌面 iframe 1200px 宽视口 = 桌面 1060 居中卡本体；移动 iframe 396px =  │
  │   styles.css 移动全屏单列态。数据 = localStorage fake vault（演示库：     │
  │   主密码 demo；.safe.enc + 密文镜像由真 SafeManager 加密链离线生成，      │
  │   双 iframe 共享同一数据源）。锁屏安全机制（冷却/首设确认）真码运行。     │
  │ 壳内只允许：外景容器样式、评审徽牌、演示钩子与自检。                      │
  └────────────────────────────────────────────────────────────────────────┘
-->
<link rel="stylesheet" href="../core/styles.css">
<link rel="stylesheet" href="../core/ui/tokens.css">
<link rel="stylesheet" href="../core/ui/components.css">
<link rel="stylesheet" href="./styles.css">
<!-- 数据/图标必须在 head 内就绪：iframe 随 body 解析即启动，若数据脚本放 body 尾，
     iframe boot 时 window.PWV_DATA 还是 undefined，种子静默空跑（评审壳时序坑） -->
<script src="./prototype-icons.js"></script>
<script src="./prototype-data.js"></script>
<style>
  /* ===== 以下全部是演示壳，禁止放组件样式 ===== */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; gap: 28px; padding: 32px 24px;
    background: #e3e0d8; font-family: system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif; }
  /* 模拟 Obsidian 宿主变量（core/styles.css 的弹层/通知取值用；插件内由主题提供） */
  body {
    --background-primary: #fbf9f3; --background-secondary: #f2efe6; --background-modifier-hover: rgba(23,21,18,.06);
    --background-modifier-border: rgba(23,21,18,.12);
    --text-normal: #171512; --text-muted: #8b8474; --text-faint: #b3ab99;
    --text-error: #b3564d; --color-green: #3d8f5d;
  }
  * { scrollbar-width: none; } *::-webkit-scrollbar { display: none; }

  /* 桌面外景（真行为 iframe：面板 append iframe body，本体 1060 居中卡来自 styles.css） */
  .demo-dt { flex: none; width: 1200px; height: 800px; }
  /* 移动外景：396px iframe → 全屏单列态铺满即手机框尺寸 */
  .demo-mob { width: 396px; height: 780px; border-radius: 26px; overflow: hidden; flex: none;
    border: 1px solid #d8d1c0; box-shadow: 0 8px 30px rgba(0,0,0,.14); background: #f5f2ec; }
  .demo-frame { width: 100%; height: 100%; border: 0; display: block; }

  /* 评审徽牌（演示壳自用） */
  .vbadge { position: fixed; right: 16px; bottom: 12px; font-size: 11px; color: #9a917d; display: flex; gap: 10px; align-items: center;
    background: rgba(255,255,255,.9); border: 1px solid #d8d1c0; padding: 3px 8px; z-index: 900; }
  .vbadge button { border: none; background: none; color: #b3564d; font: 11px 'Microsoft YaHei'; cursor: pointer; }
  .vbadge .ok { color: #3d8f5d; }
  .vbadge .bad { color: #b3564d; }
</style>
</head>
<body class="theme-light"> <!-- 模拟 Obsidian 宿主：色彩 token 挂 theme-light/dark，壳内必须补一类才不透明 -->
  <div id="dtHost" class="demo-dt"><iframe class="demo-frame" src="./prototype-view.html" title="密码本·桌面"></iframe></div>
  <div id="mobHost" class="demo-mob"><iframe class="demo-frame" src="./prototype-view.html?mob=1" title="密码本·移动"></iframe></div>

  <div class="vbadge">密码本 · 真行为单源预览（桌面=真 ui.ts 跑在 1200px，移动=396px）· 演示库主密码 demo
    <button id="mobToggle">隐藏移动端</button>
    <button id="reset">重置演示数据</button>
    <span id="stResult"></span>
  </div>

<script>
(function () {
  /* ==================== 壳基座（仅外景）：两个真行为 iframe ====================
   * 行为全部在 iframe 内跑真 ui.ts（prototype-behavior.js）；本页只做：
   *  - 种子：iframe 内 fake-sim 首启自查 SEED_MARK 直写（本页持有 PWV_DATA 供父页读取；
   *    密文直写幂等，双 iframe 同时种子无竞态）
   *  - 重置演示数据（清 bz-sim:* 后重载 iframe）
   *  - 自检（?selftest=1）：经 iframe contentWindow 访问真 DOM
   */
  const dtFrame = () => document.querySelector('#dtHost iframe');
  const mobFrame = () => document.querySelector('#mobHost iframe');
  const dtDoc = () => dtFrame().contentDocument;
  const mobDoc = () => mobFrame().contentDocument;
  // 轮询现取 contentDocument：iframe 加载前后 document 引用会替换（about:blank → 真实文档），
  // 不能缓存旧引用等面板——每次现查，跨文档访问本身同源安全。
  const waitFrame = (getDoc, sel) => new Promise((res, rej) => {
    const started = Date.now();
    const tries = () => {
      try {
        const doc = getDoc();
        if (doc && doc.querySelector(sel)) return res(doc);
        if (Date.now() - started > 25000) return rej(new Error('iframe 面板超时'));
        setTimeout(tries, 150);
      } catch (e) { setTimeout(tries, 150); }
    };
    tries();
  });

  document.querySelector('#mobToggle').addEventListener('click', () => {
    const m = document.querySelector('#mobHost');
    const hidden = m.style.display === 'none';
    m.style.display = hidden ? '' : 'none';
    document.querySelector('#mobToggle').textContent = hidden ? '隐藏移动端' : '显示移动端';
  });

  document.querySelector('#reset').addEventListener('click', () => {
    const kill = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith('bz-sim:')) kill.push(k);
    }
    kill.forEach((k) => localStorage.removeItem(k));
    location.reload();
  });

  /* ==================== 自检（?selftest=1）：真行为 DOM 断言（经 iframe） ==================== */
  if (location.search.includes('selftest')) {
    window.__st = { pass: 0, fail: [] };
    const t = (name, cond) => cond ? window.__st.pass++ : window.__st.fail.push(name);
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    (async () => {
      const res = document.querySelector('#stResult');
      try {
        // 自检判脏 = 「运行标记」：自检会删平台/加条目改演示库，标记在场说明上一轮跑过，
        // 清 bz-sim:* 后带 reset=1 重载一次；标记不在场（headless 全新 profile / 首轮）直接跑。
        const MARK = 'bz-sim:__pwv-selftest-ran';
        if (localStorage.getItem(MARK) && !location.search.includes('reset=1')) {
          const kill = [];
          for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (k && k.startsWith('bz-sim:')) kill.push(k);
          }
          kill.forEach((k) => localStorage.removeItem(k));
          location.search = '?selftest=1&reset=1';
          return;
        }
        localStorage.setItem(MARK, '1');
        // 等两端锁屏（SafeManager.exists 异步判定首设后渲染）
        const dd = await waitFrame(dtDoc, '.bz-password-vault-lock.open');
        const md = await waitFrame(mobDoc, '.bz-password-vault-lock.open');
        res.textContent = '…';
        const dt = (sel) => dd.querySelector(sel);
        const mob = (sel) => md.querySelector(sel);

        // —— 0. CSS 生效断言（评审壳链路 ../../ 404 曾全绿假象——样式必须真加载）：
        // 根遮罩底色 = --background-modifier-cover rgba(30,26,18,.42)
        const cover = getComputedStyle(dd.querySelector('.bz-password-vault')).backgroundColor;
        t('桌面遮罩宿主变量生效（CSS 链）', cover === 'rgba(30, 26, 18, 0.42)');
        t('移动 desk 隐藏（媒体查询生效）', getComputedStyle(md.querySelector('.bz-password-vault-desk')).display === 'none');

        // —— 1. 锁屏（清单已存在 → 非首设态；金色印章 + 主密码输入）
        t('桌面锁屏开（非首设）', dt('[data-lock-title]')?.textContent === '输入主密码' && !!dt('.bz-password-vault-lock .seal'));
        t('移动锁屏开', mob('[data-lock-title]')?.textContent === '输入主密码');
        const unlock = (doc) => {
          const p1 = doc.querySelector('[data-lock-p1]');
          p1.value = 'demo';
          doc.querySelector('[data-lock-go]').click();
        };
        unlock(dd);
        await sleep(500);
        t('桌面解锁：锁屏关', !dd.querySelector('.bz-password-vault-lock.open'));
        t('桌面平台聚合行 = 9', dd.querySelectorAll('[data-act] , .bz-password-vault-plrow').length >= 9 && dd.querySelectorAll('.bz-password-vault-plrow').length === 9);
        t('导航计数=15（种子账号数）', dt('[data-cnt="all"]')?.textContent === '15');
        t('品牌名=密码本', dt('.bz-password-vault-logo .name')?.textContent.startsWith('密码本') || false);

        // —— 2. 平台行点击 → 详情（GitHub 3 账号）
        const ghRow = [...dd.querySelectorAll('.bz-password-vault-plrow')].find((r) => r.textContent.includes('GitHub'));
        ghRow.click();
        await sleep(150);
        t('详情标题=GitHub', dt('.bz-password-vault-detail h2')?.textContent.includes('GitHub') || false);
        t('详情账号卡 = 3', dd.querySelectorAll('.bz-password-vault-acctcard').length === 3);

        // —— 3. 密码眼睛：掩码 ↔ 明文
        const pwEl = dt('.bz-password-vault-acctcard .pw');
        const maskedBefore = pwEl.classList.contains('mask');
        dt('.bz-password-vault-acctcard [data-act="eye"]').click();
        await sleep(150);
        const pwAfter = dt('.bz-password-vault-acctcard .pw');
        t('密码眼睛切换掩码', maskedBefore && !pwAfter.classList.contains('mask') && pwAfter.textContent.length >= 4);

        // —— 4. 添加弹窗（平台详情 → 新增账号；生成器预填）
        dt('.bz-password-vault-detail [data-act="plat-add"]').click();
        await sleep(120);
        const modal = dt('.bz-password-vault-modal.open');
        t('添加弹窗开', !!modal);
        const pwdVal = modal?.querySelector('[data-f="password"]')?.value || '';
        t('生成器预填密码', pwdVal.length === 16);
        modal.querySelector('[data-act="cancel"]').click();
        await sleep(80);
        t('取消关弹窗', !dd.querySelector('.bz-password-vault-modal.open'));

        // —— 5. 右键菜单（bz 统一 item-actions）+ 删除平台确认链
        const wbRow = [...dd.querySelectorAll('.bz-password-vault-plrow')].find((r) => r.textContent.includes('微博'));
        wbRow.dispatchEvent(new MouseEvent('contextmenu', { clientX: 300, clientY: 300, bubbles: true, cancelable: true }));
        await sleep(150);
        const menu = dd.querySelector('.bz-item-menu');
        t('右键菜单开', !!menu);
        t('菜单含新增/编辑/删除', !!menu && menu.textContent.includes('在该平台新增账号') && menu.textContent.includes('编辑平台信息') && menu.textContent.includes('删除整个平台'));
        if (menu) {
          const r = menu.getBoundingClientRect();
          const mk = (type) => new MouseEvent(type, { clientX: r.left + 10, clientY: r.top + 10, bubbles: true, cancelable: true });
          const delBtn = [...menu.querySelectorAll('.bz-item-menu-item')].find((b) => b.textContent.includes('删除整个平台'));
          delBtn.dispatchEvent(mk('mousedown'));
          delBtn.dispatchEvent(mk('mouseup'));
          delBtn.dispatchEvent(mk('click'));
          await sleep(200);
          const pop = dt('.bz-password-vault-pop2.open');
          t('删除确认框开', !!pop && pop.textContent.includes('不可撤销'));
          // 确定钮走完整鼠标序列（菜单关闭后 swallowNextClick 已布防——裸 click() 会被
          // capture 吞掉；mousedown 先行撤防，与真用户点击同构）
          const okBtn = pop.querySelector('.ok');
          const okr = okBtn.getBoundingClientRect();
          const okEv = (type) => new MouseEvent(type, { clientX: okr.left + 4, clientY: okr.top + 4, bubbles: true, cancelable: true });
          okBtn.dispatchEvent(okEv('mousedown'));
          okBtn.dispatchEvent(okEv('mouseup'));
          okBtn.dispatchEvent(okEv('click'));
          await sleep(500);
          t('平台删除落盘（9→8）', dd.querySelectorAll('.bz-password-vault-plrow').length === 8);
        }

        // —— 6. 搜索（180ms 防抖）：展平账号行
        const searchInput = dt('.bz-password-vault-search input');
        searchInput.value = 'demo@bz.dev';
        searchInput.dispatchEvent(new Event('input', { bubbles: true }));
        await sleep(420);
        const hitRows = dd.querySelectorAll('.bz-password-vault-row');
        t('搜索展平命中 2 行（GitHub+Notion 同账号）', hitRows.length === 2);
        t('搜索计数 2 条匹配', dt('.bz-password-vault-count')?.textContent.includes('2') || false);
        searchInput.value = '';
        searchInput.dispatchEvent(new Event('input', { bubbles: true }));
        await sleep(420);

        // —— 7. 移动端（独立实例：各自解锁）
        unlock(md);
        await sleep(500);
        t('移动解锁：锁屏关', !md.querySelector('.bz-password-vault-lock.open'));
        t('移动平台卡 = 8（同库已删微博）', md.querySelectorAll('.bz-password-vault-mobcard').length === 8);
        mob('.bz-password-vault-fab').click();
        await sleep(120);
        t('移动 FAB → 添加弹窗', !!mob('.bz-password-vault-modal.open'));
        mob('.bz-password-vault-modal.open [data-act="cancel"]').click();
        await sleep(80);
        const mobCard = [...md.querySelectorAll('.bz-password-vault-mobcard')].find((c) => c.textContent.includes('GitHub'));
        mobCard.click();
        await sleep(150);
        t('移动详情页开（页标题=GitHub）', md.querySelector('.bz-password-vault-mobpage')?.classList.contains('open') && mob('.bz-password-vault-mobpage .head .t')?.textContent === 'GitHub');
        t('移动账号段在场', md.querySelectorAll('.bz-password-vault-seg').length === 3);
        mob('.bz-password-vault-back').click();
        await sleep(120);
        t('移动返回列表', !md.querySelector('.bz-password-vault-mobpage')?.classList.contains('open'));

        document.title = window.__st.fail.length
          ? 'SELFTEST FAIL ' + window.__st.fail.join(',')
          : `SELFTEST OK ${window.__st.pass}/${window.__st.pass + window.__st.fail.length}`;
        res.textContent = window.__st.fail.length ? '自检失败' : `自检通过 ${window.__st.pass}`;
        res.className = window.__st.fail.length ? 'bad' : 'ok';
      } catch (err) {
        document.title = 'SELFTEST ERR ' + (err && err.message || err);
        res.textContent = '自检异常';
        res.className = 'bad';
      }
    })();
  }
})();
</script>
</body>
</html>
