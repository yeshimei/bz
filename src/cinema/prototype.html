<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>影院 · 原型预览（午夜场完整功能版 · 与 src/cinema/styles.css 共用同一份 CSS）</title>
<!--
  ┌────────────────────────────────────────────────────────────────────┐
  │ 本文件 = 影院域 UI 的评审壳。组件样式零内联，全部来自（与            │
  │ build-css SOURCES 同序的 core 链 +）同目录 ./styles.css。            │
  │ 改样式只改 styles.css，刷新本页即见，插件构建自动带走。              │
  │ 本文件只允许写：演示壳（页面底/风格切换条）与演示逻辑（JS）。        │
  │                                                                    │
  │ 午夜场 = 完整功能版：主列表 / 详情弹窗 / 添加·编辑表单 / 右键菜单 /   │
  │ 长按抽屉 / 删除确认 / AI 荐片页（含等待·失败·换一批）/ 观影分析页     │
  │ （19 板块真实统计）/ 设置弹窗 / toast / 空态。                        │
  │ 数据：50 部真实 vault 导出，增删改写 localStorage 持久化。            │
  └────────────────────────────────────────────────────────────────────┘
-->
<link rel="stylesheet" href="../core/styles.css">
<link rel="stylesheet" href="../core/ui/tokens.css">
<link rel="stylesheet" href="../core/ui/components.css">
<link rel="stylesheet" href="./styles.css">
<style>
  /* ===== 以下全部是演示壳，禁止放组件样式 ===== */
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;padding:0 24px 56px;background:#e3e0d8;font-family:system-ui,'Segoe UI','Microsoft YaHei',sans-serif}
  body.theme-dark{background:#1e1b18}
  body.theme-light{background:#e3e0d8}
  *{scrollbar-width:none}*::-webkit-scrollbar{display:none}
  .demo-bar{position:sticky;top:0;z-index:99;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:10px 14px;margin:0 -24px 18px;background:#d9d5c9ee;border-bottom:1px solid #bdb7a5;
    backdrop-filter:blur(6px);font-size:12px;color:#6b6558}
  body.theme-dark .demo-bar{background:#262219ee;border-bottom-color:#3a362c;color:#8a8271}
  .demo-bar b{font-size:13px;letter-spacing:.12em;color:#4a4436}
  body.theme-dark .demo-bar b{color:#cfc7b2}
  .demo-bar .sp{flex:1}
  .demo-btn{border:1px solid #b5ad99;background:none;border-radius:7px;padding:5px 12px;font-size:12px;color:#6b6558;cursor:pointer;font-family:inherit}
  body.theme-dark .demo-btn{border-color:#3a362c;color:#8a8271}
  .demo-btn.on{background:#4a4436;border-color:#4a4436;color:#f4efe4}
  body.theme-dark .demo-btn.on{background:#cfc7b2;border-color:#cfc7b2;color:#262219}
  .demo-sec{display:none}
  .demo-sec.on{display:block}
  .demo-sec-title{font-size:12px;letter-spacing:.2em;color:#8a8271;margin:0 0 10px 2px}
  body.theme-dark .demo-sec-title{color:#6d6656}
  .demo-pair{display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap}
  .demo-dt{flex:none}
  .mob-wrap{flex:none}
  .mob-label{font-size:11px;letter-spacing:.2em;color:#98917f;margin:0 0 8px 4px}
  body.theme-dark .mob-label{color:#6d6656}
</style>
</head>
<body>
<div class="demo-bar">
  <b>影院 · 域内评审壳</b>
  <span id="styleBtns"></span>
  <span class="sp"></span>
  <button class="demo-btn" id="resetBtn" title="清空演示数据的本地改动">还原数据</button>
  <button class="demo-btn" id="themeBtn">暗 / 亮</button>
</div>
<div id="secs"></div>

<script src="./prototype-data.js"></script>
<script>
/* ==================== 演示逻辑（壳层） ==================== */
const CINEMA_STYLES = [
  { id: 'midnight', label: '午夜场', en: 'MIDNIGHT' },
  { id: 'gazette',  label: '场刊',   en: 'GAZETTE'  },
  { id: 'booth',    label: '放映室', en: 'BOOTH'    },
];
const GROUPS = ['电影', '剧集', '动漫', '纪录片', '公开课', '其他'];
const GROUP_SUBS = { 电影: [], 剧集: ['国产剧','美剧','英剧','德剧','日剧','韩剧','哥伦比亚剧'], 动漫: ['日漫','国漫','美漫'], 纪录片: [], 公开课: ['公开课','TED'], 其他: [] };
const ALL_TAGS = GROUPS.flatMap(g => GROUP_SUBS[g].length ? GROUP_SUBS[g] : [g]);
const TYPE_C = { 电影:'#e6951d', 剧集:'#3d7bd6', 动漫:'#d64d8f', 纪录片:'#45a35c', 公开课:'#9b6dd4', 其他:'#8a8578' };
const tagColor = t => TYPE_C[GROUP_SUBS['电影'].includes(t)?'电影':GROUP_SUBS['剧集'].includes(t)?'剧集':GROUP_SUBS['动漫'].includes(t)?'动漫':GROUP_SUBS['纪录片'].includes(t)?'纪录片':GROUP_SUBS['公开课'].includes(t)?'公开课':'其他'];
const groupOfTag = t => GROUPS.find(g => g==='其他' || GROUP_SUBS[g].includes(t)) || '其他';
const ST_C = { '想看': '#98917f', '在看': '#d97c1d', '已看': '#4a9a5c' };
const ST = { '想看': ['待映', '#9a917c'], '在看': ['放映中', '#d97c1d'], '已看': ['已放映', '#4a9a5c'] };
const esc = s => (s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const stars = s => { if (!s) return ''; const n = Math.round(s / 2); return '★'.repeat(n) + '☆'.repeat(5 - n); };
const nowStr = () => { const d = new Date(), p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; };

/* ---------- 数据层：真实 50 部，增删改持久化 localStorage ---------- */
let DB;
try { DB = JSON.parse(localStorage.getItem('bz-cinema-proto-db')) || null; } catch { DB = null; }
if (!Array.isArray(DB) || !DB.length) DB = JSON.parse(JSON.stringify(window.CINEMA_DATA));
const saveDB = () => localStorage.setItem('bz-cinema-proto-db', JSON.stringify(DB));
const byName = n => DB.find(x => x.name === n);
const SET_KEY = 'bz-cinema-proto-set';
let SET = { cols: 5, sort: 'watch', st: '', mobFull: false };
try { Object.assign(SET, JSON.parse(localStorage.getItem(SET_KEY)) || {}); } catch {}
const saveSet = () => localStorage.setItem(SET_KEY, JSON.stringify(SET));

const SVG = {
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M12 5v14"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  grid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',
  ai:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3z"/><path d="M19 15l.9 2.4L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.6L19 15z"/></svg>',
  stat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 16v-5M12 16V8M17 16v-3"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 4h-8m-5 0H3M21 12h-3m-6 0H3M21 20h-11m-4 0H3"/><circle cx="11" cy="4" r="1.6"/><circle cx="16" cy="12" r="1.6"/><circle cx="8" cy="20" r="1.6"/></svg>',
  eye:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="6 3 20 12 6 21 6 3"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>',
  globe:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>',
  pencil:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>',
  link:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>',
  warn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4M12 17h.01"/></svg>',
  film:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 8.5h4M3 15.5h4M17 8.5h4M17 15.5h4M7 12h10"/></svg>',
};

/* ---------- 午夜场状态 ---------- */
const M = { view: 'list', g: '全部', st: null, sort: SET.sort || 'watch', q: '', ai: { phase: 'idle', results: [], err: '', base: '' } };
let GRID_COLS = Math.min(12, Math.max(2, parseInt(SET.cols, 10) || 5));

/* ==================== 午夜场：主列表 ==================== */
function items() { let a = DB.filter(x => (M.g === '全部' || x.group === M.g) && (!M.st || x.status === M.st));
  if (M.q) { const t = M.q.toLowerCase(); a = a.filter(x => (x.name + (x.director || '') + (x.actors || '') + (x.review || '')).toLowerCase().includes(t)); }
  if (M.sort === 'watch') a = [...a].sort((a, b) => (b.watchDate || '').localeCompare(a.watchDate || ''));
  else if (M.sort === 'rating') a = [...a].sort((a, b) => (b.rating || 0) - (a.rating || 0));
  return a; }
function counts() { const g = { '全部': DB.length }, c = { '想看': 0, '在看': 0, '已看': 0 };
  DB.forEach(x => { g[x.group] = (g[x.group] || 0) + 1; c[x.status]++; }); return { g, c }; }
const day = w => (w || '').slice(0, 10);

function card(x) { const r = x.rating;
  return `<div class="pcard" data-name="${esc(x.name)}"><div class="pw">${x.poster ? `<img loading="lazy" src="${x.poster}" onerror="this.outerHTML='<div class=\\'ph\\'>${esc(x.name[0])}</div>'">` : `<div class="ph">${esc(x.name[0])}</div>`}
    ${x.status !== '已看' ? `<span class="badge" style="background:${ST_C[x.status]}">${x.status}</span>` : ''}</div>
    <div class="pname">${esc(x.name)}</div>
    <div class="pmeta">${esc(x.year || '')}${x.year && x.director ? ' · ' : ''}${esc(x.director || '')}</div>
    <div class="pstars">${r ? stars(r) + `<span class="num">${r.toFixed(1)}</span>` : '<span style="opacity:.35">未评分</span>'}</div></div>`; }

function listHeadHTML() { const t = M.view === 'list' ? (M.g + (M.st ? ` · ${M.st}` : '')) : M.view === 'ai' ? 'AI 荐片' : '观影分析';
  const cnt = M.view === 'list' ? `· ${items().length} 部` : M.view === 'ai' ? '' : `· ${DB.filter(x=>x.status==='已看').length} 部已看`;
  return `<div class="d-head"><h2 class="j-title">${esc(t)}</h2><span class="cnt j-cnt">${cnt}</span>
    <button class="add j-add">${SVG.plus}添加影片</button></div>`; }
function listToolsHTML() {
  return `<div class="d-tools">
    <label class="d-search">${SVG.search}<input class="j-q" placeholder="搜索影视（名称、类型、影评）..." value="${esc(M.q)}"></label>
    <div class="seg j-sort">
      <button data-k="watch" class="${M.sort === 'watch' ? 'is-on' : ''}">最近观看</button>
      <button data-k="created" class="${M.sort === 'created' ? 'is-on' : ''}">加入先后</button>
      <button data-k="rating" class="${M.sort === 'rating' ? 'is-on' : ''}">按评分</button>
    </div></div>`; }
function viewBodyHTML() {
  if (M.view === 'ai') return aiPageHTML();
  if (M.view === 'stat') return statPageHTML();
  const a = items();
  if (!a.length) { const filtered = M.g !== '全部' || M.st || M.q;
    return `<div class="cn-empty-page"><div class="big">${filtered ? '无匹配影片' : '影片空空如也'}</div>
      ${filtered ? '<button class="dm-btn j-clear" style="margin-top:6px">清空筛选</button>' : '<span style="font-size:11.5px">点右上「添加影片」开始记录</span>'}</div>`; }
  return `<div class="d-scroll"><div class="grid" style="grid-template-columns:repeat(${GRID_COLS},1fr)">${a.map(card).join('')}</div></div>`; }
function midnightShell() { const { g, c } = counts();
  const railRow = (on, attr, dot, name, n) => `<button class="rail-item${on ? ' is-on' : ''}" ${attr}>${dot}${name}<span class="n">${n}</span></button>`;
  return { desk: `<section class="bz-cinema--midnight">
    <div class="d-body">
      <aside class="d-rail">
        <div class="rail-brand"><h1>影院</h1><div class="en">CINEMA CLUB</div></div>
        <div class="rail-sec">
          <div class="rail-label">类 型</div>
          <div class="j-groups">${railRow(M.g === '全部' && !M.st, 'data-g="全部"', '<span class="dot" style="background:var(--gold)"></span>', '全部', g['全部']) +
            GROUPS.map(x => railRow(M.g === x && !M.st, `data-g="${x}"`, `<span class="dot" style="background:${TYPE_C[x]}"></span>`, x, g[x] || 0)).join('')}</div>
          <div class="rail-label" style="padding-top:14px">状 态</div>
          <div class="j-status">${['想看', '在看', '已看'].map(x => railRow(M.st === x, `data-s="${x}"`, `<span class="dot" style="background:${ST_C[x]}"></span>`, x, c[x])).join('')}</div>
        </div>
        <div class="rail-foot">
         <button class="rail-item j-tool" data-tool="ai">${SVG.ai}AI 荐片</button>
          <button class="rail-item j-tool" data-tool="stat">${SVG.stat}观影分析</button>
        </div>
      </aside>
      <div class="d-main j-view"></div>
    </div>
  </section>`,
  mob: `<section class="mob bz-cinema--midnight">
    <div class="m-head"><h2 class="j-mtitle">全部</h2><span class="cnt j-mcnt"></span>
      <span class="m-acts">
        <button class="m-tool j-mai" title="AI 荐片">${SVG.ai}</button>
        <button class="m-tool j-mstat" title="观影分析">${SVG.stat}</button>
        <button class="m-tool j-mgear" title="影院设置">${SVG.gear}</button>
        <button class="add j-madd">${SVG.plus}</button>
      </span>
    </div>
    <div class="m-chips j-chips"></div>
    <label class="m-search">${SVG.search}<input class="j-mq" placeholder="搜索片名 / 导演…"></label>
    <div class="m-scroll j-mview"></div>
  </section>` }; }
function midnightRefresh(sec) {
  syncRail(sec);
  const view = sec.querySelector('.j-view');
  view.innerHTML = M.view === 'list' ? listHeadHTML() + listToolsHTML() + viewBodyHTML()
    : `<div class="sp-head"><button class="sp-back j-back">${SVG.back}</button><span class="sp-title">${M.view === 'ai' ? 'AI 荐片' : '观影分析'}</span><span class="sp-cnt j-spcnt"></span></div><div class="sp-body j-spbody">${viewBodyHTML()}</div>`;
  if (M.view === 'ai') { sec.querySelector('.j-spcnt').textContent = M.ai.results.length ? `· ${M.ai.results.length} 部` : ''; }
  if (M.view === 'stat') { sec.querySelector('.j-spcnt').textContent = `· ${DB.filter(x=>x.status==='已看').length} 部已看`; }
  const addBtn = sec.querySelector('.j-add');
  if (addBtn) addBtn.addEventListener('click', () => openForm(sec));
  const q = sec.querySelector('.j-q');
  if (q) q.addEventListener('input', ev => { M.q = ev.target.value; refreshList(sec); });
  const sort = sec.querySelector('.j-sort');
  if (sort) sort.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return;
    M.sort = b.dataset.k; sec.querySelectorAll('.j-sort button').forEach(x => x.classList.toggle('is-on', x === b)); refreshList(sec); });
  const clr = sec.querySelector('.j-clear');
  if (clr) clr.addEventListener('click', () => { M.g = '全部'; M.st = null; M.q = ''; syncRail(sec); midnightRefresh(sec); });
  const back = sec.querySelector('.j-back');
  if (back) back.addEventListener('click', () => { M.view = 'list'; syncRail(sec); midnightRefresh(sec); });
  midnightRefreshMob(sec);
}
function refreshList(sec) { /* 输入时只刷列表与计数，保焦点 */
  const view = sec.querySelector('.j-view');
  const body = view.querySelector('.d-scroll'), head = view.querySelector('.d-head');
  if (!body) { midnightRefresh(sec); return; }
  head.querySelector('.j-cnt').textContent = `· ${items().length} 部`;
  const a = items();
  body.querySelector('.grid').innerHTML = a.length ? a.map(card).join('') : '';
  if (!a.length) midnightRefresh(sec);
  midnightRefreshMob(sec);
  const el = sec.querySelector('.j-q'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }
function syncRail(sec) { sec.querySelectorAll('.rail-item[data-g],.rail-item[data-s]').forEach(i => i.classList.toggle('is-on',
  !!((i.dataset.g === M.g && !i.dataset.s) || (i.dataset.s && i.dataset.s === M.st))));
  sec.querySelectorAll('.j-tool').forEach(b => b.classList.toggle('is-on', b.dataset.tool === M.view)); }
function midnightRefreshMob(sec) {
  const a = items(), t = M.view === 'list' ? (M.g + (M.st ? ` · ${M.st}` : '')) : M.view === 'ai' ? 'AI 荐片' : '观影分析';
  sec.querySelector('.j-mtitle').textContent = t;
  sec.querySelector('.j-mcnt').textContent = M.view === 'list' ? `· ${a.length}` : '';
  const mv = sec.querySelector('.j-mview');
  if (M.view === 'list') { mv.className = 'm-scroll j-mview';
    mv.innerHTML = `<div class="m-grid">${a.map(card).join('')}</div>`; }
  else if (M.view === 'ai') { mv.className = 'sp-body j-mview'; mv.innerHTML = aiPageHTML(); }
  else { mv.className = 'sp-body j-mview'; mv.innerHTML = statPageHTML(); }
  attachLongPressInit(sec);
  sec.querySelector('.j-chips').innerHTML =
    `<button class="chip${M.g === '全部' && !M.st ? ' is-on' : ''}" data-c="all">${SVG.grid}全部</button>` +
    GROUPS.map(x => `<button class="chip${M.g === x && !M.st ? ' is-on' : ''}" data-c="${x}">${x}</button>`).join('') +
    ['想看', '在看', '已看'].map(x => `<button class="chip${M.st === x ? ' is-on' : ''}" data-s="${x}">${x}</button>`).join('');
  mv.querySelectorAll('.j-clear').forEach(b => b.addEventListener('click', () => { M.g = '全部'; M.st = null; M.q = ''; syncRail(sec); midnightRefresh(sec); }));
  const mq = sec.querySelector('.j-mq');
  if (mq) { mq.value = M.q; mq.oninput = ev => { M.q = ev.target.value; midnightRefreshMob(sec); const el2 = sec.querySelector('.j-mq'); if (el2) { el2.focus(); el2.setSelectionRange(el2.value.length, el2.value.length); } }; } }
function midnightBind(sec) {
  sec.addEventListener('click', e => {
    const aiBtn = e.target.closest('.j-ai-start,.j-ai-more,.j-simfail,.rec-add');
    if (aiBtn) { aiAct(sec, aiBtn); return; }
    const tool = e.target.closest('.j-tool,[data-tool]');
    if (tool && tool.dataset.tool) { M.view = M.view === tool.dataset.tool ? 'list' : tool.dataset.tool; syncRail(sec); midnightRefresh(sec); return; }
    const mb = e.target.closest('.j-mai,.j-mstat,.j-mgear');
    if (mb) { if (mb.classList.contains('j-mgear')) { openSet(sec); } else { M.view = mb.classList.contains('j-mai') ? 'ai' : 'stat'; syncRail(sec); midnightRefresh(sec); } return; }
    const b = e.target.closest('[data-g],[data-s]');
    if (b) { if (M.view !== 'list') { M.view = 'list'; }

    `<button class="chip${B.g === '全部' && !B.st ? ' is-on' : ''}" data-c="all">全部</button>` +
    GROUPS.map(x => `<button class="chip${B.g === x && !B.st ? ' is-on' : ''}" data-c="${x}">${x}</button>`).join('') +
    ['想看', '在看', '已看'].map(x => `<button class="chip${B.st === x ? ' is-on' : ''}" data-s="${x}">${ST[x][0]}</button>`).join(''); }
function boothBind(sec) {
  sec.addEventListener('click', e => { const b = e.target.closest('[data-g],[data-s]'); if (!b) return;
    if (b.dataset.g) { B.g = b.dataset.g; B.st = null; } else { B.st = B.st === b.dataset.s ? null : b.dataset.s; }
    sec.querySelectorAll('.rail-item').forEach(i => i.classList.toggle('is-on',
      (i.dataset.g === B.g && !i.dataset.s) || (i.dataset.s && i.dataset.s === B.st)));
    boothRefresh(sec); });
  sec.querySelector('.j-sort').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return;
    B.sort = b.dataset.k; sec.querySelectorAll('.j-sort button').forEach(x => x.classList.toggle('is-on', x === b)); boothRefresh(sec); });
  sec.querySelector('.j-chips').addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return;
    if (b.dataset.c) { B.g = b.dataset.c === 'all' ? '全部' : b.dataset.c; B.st = null; } else { B.st = B.st === b.dataset.s ? null : b.dataset.s; }
    boothRefresh(sec); });
  sec.querySelectorAll('.j-q,.j-mq').forEach(el => el.addEventListener('input', ev => { B.q = ev.target.value; boothRefresh(sec); })); }

/* ==================== 壳：渲染 / 切换 / 主题 ==================== */
const BUILD = { midnight: { shell: midnightShell, refresh: midnightRefresh, bind: midnightBind },
  gazette: { shell: gazetteShell, refresh: gazetteRefresh, bind: gazetteBind },
  booth: { shell: boothShell, refresh: boothRefresh, bind: boothBind } };
const state = { style: 'midnight' };
function buildStyle(id) { const sec = document.getElementById('sec-' + id), b = BUILD[id], parts = b.shell();
  sec.innerHTML = `<div class="demo-sec-title"></div><div class="demo-pair"><div class="demo-dt">${parts.desk}</div>
    <div class="mob-wrap"><div class="mob-label">移动端 · 396×780</div>${parts.mob}</div></div>`;
  b.bind(sec); b.refresh(sec);
  const st = CINEMA_STYLES.find(s => s.id === id);
  sec.querySelector('.demo-sec-title').textContent = `风格 ${st.label} ${st.en} · 桌面 900×620${id === 'midnight' ? ' · 完整功能版' : ''}`; }
function syncChrome() {
  document.querySelectorAll('#styleBtns .demo-btn').forEach(b => b.classList.toggle('on', b.dataset.style === state.style));
  document.querySelectorAll('.demo-sec').forEach(s => s.classList.toggle('on', s.id === 'sec-' + state.style));
  const cur = CINEMA_STYLES.find(s => s.id === state.style);
  document.title = `影院 · ${cur.label} · 原型预览`;
  localStorage.setItem('bz-cinema-proto', JSON.stringify({ style: state.style })); }
(function chrome() {
  document.getElementById('styleBtns').innerHTML = CINEMA_STYLES.map(s => `<button class="demo-btn" data-style="${s.id}">${s.label}</button>`).join('');
  document.getElementById('styleBtns').addEventListener('click', e => { const b = e.target.closest('[data-style]'); if (!b) return;
    state.style = b.dataset.style; syncChrome(); });
  document.getElementById('themeBtn').addEventListener('click', () => {
    const dark = document.body.classList.toggle('theme-dark');
    document.body.classList.toggle('theme-light', !dark);
    localStorage.setItem('bz-cinema-proto-theme', dark ? 'dark' : 'light'); });
  document.getElementById('resetBtn').addEventListener('click', () => {
    localStorage.removeItem('bz-cinema-proto-db'); location.reload(); });
})();
(function init() {
  const secs = document.getElementById('secs');
  secs.innerHTML = CINEMA_STYLES.map(s => `<section class="demo-sec" id="sec-${s.id}"></section>`).join('');
  CINEMA_STYLES.forEach(s => buildStyle(s.id));
  const q = new URLSearchParams(location.search);
  if (CINEMA_STYLES.some(s => s.id === q.get('style'))) state.style = q.get('style');
  else { const saved = JSON.parse(localStorage.getItem('bz-cinema-proto') || '{}');
    if (CINEMA_STYLES.some(s => s.id === saved.style)) state.style = saved.style; }
  const themeQ = q.get('theme') || localStorage.getItem('bz-cinema-proto-theme');
  document.body.classList.add(themeQ === 'dark' ? 'theme-dark' : 'theme-light');
  syncChrome();
})();
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeMenus(); closeSheets();
  document.querySelectorAll('.cn-ovl').forEach(o => o.remove()); } });
</script>
</body>
