<script>
(function () {
  /* ==================== 壳基座（仅外景）：两个真行为 iframe + storage 桥 ==================== */
  const seedKeys = () => Object.keys(localStorage).filter((k) => k.startsWith('bz-sim:'));
  const resetData = () => { for (const k of seedKeys()) localStorage.removeItem(k); location.reload(); };
  document.querySelector('#mobToggle').addEventListener('click', () => {
    const m = document.querySelector('#mobHost');
    const hidden = m.style.display === 'none';
    m.style.display = hidden ? '' : 'none';
    document.querySelector('#mobToggle').textContent = hidden ? '隐藏移动端' : '显示移动端';
  });
  document.querySelector('#reset').addEventListener('click', resetData);

  const dtFrame = () => document.querySelector('#dtHost iframe');
  const mobFrame = () => document.querySelector('#mobHost iframe');
  const dtDoc = () => dtFrame().contentDocument;
  const mobDoc = () => mobFrame().contentDocument;
  // 轮询现取 contentDocument：iframe 加载前后 document 引用会替换——每次现查（同源安全）
  const waitFrame = (getDoc, sel) => new Promise((res, rej) => {
    const started = Date.now();
    const tries = () => {
      try {
        const doc = getDoc();
        if (doc && doc.querySelector(sel)) return res(doc);
        if (Date.now() - started > 30000) return rej(new Error('iframe 面板超时：' + sel));
        setTimeout(tries, 150);
      } catch (e) { setTimeout(tries, 150); }
    };
    tries();
  });

  /* ==================== 自检（?selftest=1）：真行为 DOM 断言（经 iframe） ==================== */
  if (location.search.includes('selftest')) {
    const R = window.BZR_review;
    window.__st = { pass: 0, fail: [] };
    const t = (name, cond) => cond ? window.__st.pass++ : window.__st.fail.push(name);
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    (async () => {
      const res = document.querySelector('#stResult');
      try {
        // 数据基线：种子应为 15 条。残留脏数据则重置重载一次（运行标记防循环）。
        const pre = (() => { try { return JSON.parse(localStorage.getItem('bz-sim:CONFIG/STORAGE/review.json') || 'null'); } catch { return null; } })();
        const dirty = !pre || !Array.isArray(pre) || pre.length !== 15;
        if (dirty && !location.search.includes('reset=1')) {
          for (const k of seedKeys()) localStorage.removeItem(k);
          location.search = '?selftest=1&reset=1';
          return;
        }
        const dd = await waitFrame(dtDoc, '.bz-q-view');
        const md = await waitFrame(mobDoc, '.bz-q-view');
        res.textContent = '…';
        const dt = (sel) => dd.querySelector(sel);
        const dts = (sel) => [...dd.querySelectorAll(sel)];
        const mobAll = (sel) => [...md.querySelectorAll(sel)];

        t('渲染包在库（BZR_review.queueViewHtml）', !!R && typeof R.queueViewHtml === 'function');
        t('桌面面板开', !!dt('.bz-q-view'));
        t('移动面板开', !!mobAll('.bz-q-view').length);
        t('三区列在位', dts('.bz-q-col').length === 3 && mobAll('.bz-q-col').length === 3);
        const colNames = dts('.bz-q-col-head .name').map((e) => e.textContent);
        t('列名=已逾期/今天到期/未来', JSON.stringify(colNames) === JSON.stringify(['已逾期', '今天到期', '未来']));

        // 分区计数：逾期3 · 今天3（间隔重复/主动回忆/松果体提前）· 未来6
        //（挂起（missing）归 done 列 = partitionQueue ticket 098 语义，归档视图可见）
        const cnts = dts('.bz-q-col-head .cnt').map((e) => Number(e.textContent));
        t('计数=3/3/6', JSON.stringify(cnts) === JSON.stringify([3, 3, 6]));
        // 挂起：弗洛伊德（文件缺失）→ done 列（partitionQueue ticket 098），归档视图可见
        // V1 增量：列内排序 置顶→R升序→到期——逾期首位=艾宾浩斯（R 低者先），未来首位=置顶罗马尼亚 770
        t('逾期首位=艾宾浩斯（R升序）', dts('.bz-q-col.danger .bz-q-card-title')[0]?.textContent === '艾宾浩斯遗忘曲线');
        t('艾宾浩斯挂 R 低档 tag', !!dts('.bz-q-col.danger .bz-q-tag.is-r.r-low').length);
        t('未来首位=置顶罗马尼亚770', dts('.bz-q-col.future .bz-q-card-title')[0]?.textContent === '罗马尼亚 770 法令');
        // V1 增量：待重做红 tag（无助，未来列）
        t('待重做红 tag 在位', !!dts('.bz-q-tag.is-redo').length && dts('.bz-q-tag.is-redo')[0].textContent === '待重做');
        // 提前卡：松果体落今天列 + 不可单点（.no）
        const pineCard = dts('.bz-q-col.warn .bz-q-card').find((c) => c.textContent.includes('松果体'));
        t('松果体提前卡落今天列且 .no', !!pineCard && pineCard.classList.contains('no') && !!pineCard.querySelector('.is-early'));
        // 开始本轮条（红点 + 今日3篇到期 · 逾期3篇顺延）
        t('开始本轮条文案', dt('.bz-q-strip')?.textContent.includes('今日 3 篇到期') && dt('.bz-q-strip').textContent.includes('逾期 3 篇顺延'));
        t('底部信息行（累计/连续）', dt('.bz-q-footer')?.textContent.includes('累计') && dt('.bz-q-footer').textContent.includes('连续'));

        // 归档切换（V1 增量：绿点「已完成复习」；挂起卡也在 done 列）
        dt('[data-act="arch"]').click();
        await sleep(300);
        t('归档列切换', dts('.bz-q-col').length === 1 && dt('.bz-q-col-head .name')?.textContent === '已完成');
        t('归档状态条=已完成复习（V1）', dt('.bz-q-strip')?.textContent.includes('已完成复习') && !!dt('.bz-q-strip-dot.ok'));
        t('归档3条（已完成2+挂起1）', Number(dt('.bz-q-col-head .cnt')?.textContent) === 3);
        const frdCard = dts('.bz-q-card').find((c) => c.textContent.includes('弗洛伊德'));
        t('挂起卡=文件缺失+挂起（done 列）', !!frdCard && !!frdCard.querySelector('.is-missing') && frdCard.querySelector('.bz-q-card-stage').textContent === '挂起');
        dt('[data-act="arch"]').click();
        await sleep(300);

        // 搜索（防抖 180ms）
        const q = dt('#bz-q-search');
        q.value = '松果体'; q.dispatchEvent(new Event('input'));
        await sleep(400);
        t('搜索过滤=仅松果体', dts('.bz-q-card').length === 1 && dts('.bz-q-col-head .cnt').map((e) => e.textContent).join(',') === '0,1,0');
        q.value = ''; q.dispatchEvent(new Event('input'));
        await sleep(400);

        /* ===== 全流程做题：开始本轮 → 待重做重做(2题) + 本轮6篇(12题) 全对 → 结算 → 回队列 ===== */
        const bank = window.RVW.SEED.quizBank;
        const findQ = (text) => { for (const qs of Object.values(bank)) { const hit = qs.find((x) => x.question === text); if (hit) return hit; } return null; };
        dt('[data-act="begin"]').click();
        await waitFrame(() => dtDoc(), '.bz-sprint-head');
        t('冲刺头行开（做题冲刺）', dt('.bz-sprint-title')?.textContent === '做题冲刺');
        t('右栏本轮队列在位', !!dt('.bz-sprint-queue') && dt('.bz-sq-head')?.textContent.includes('本轮队列'));

        let sawResult = false, sawSummary = false;
        for (let i = 0; i < 60; i++) {
          if (dt('.bz-q-view')) break;
          const questionText = dt('.bz-sprint-qtext')?.textContent || '';
          const known = questionText ? findQ(questionText) : null;
          if (questionText) t('题目来自种子题库（' + questionText.slice(0, 10) + '…）', !!known);
          const opts = dts('.bz-sprint-opt:not(.is-disabled)');
          if (opts.length && known) {
            for (const idx of known.correctIndices) {
              const el = dt('.bz-sprint-opt[data-i="' + idx + '"]');
              if (el && !el.classList.contains('is-disabled') && !el.classList.contains('is-correct')) { el.click(); await sleep(160); }
            }
            const submit = dt('[data-action="submit"]');
            if (submit) { submit.click(); await sleep(250); }
            await sleep(1000); // 答对亮绿 0.8s 自动进
            continue;
          }
          if (dt('.bz-result')) sawResult = true;
          if (dt('.bz-summary')) sawSummary = true;
          const done = dt('[data-action="done"]');
          const next = dt('[data-action="next"]');
          const note = dt('[data-action="note"]');
          if (done && sawSummary) { done.click(); await sleep(500); continue; }
          if (next) { next.click(); await sleep(450); continue; }
          if (note) { note.click(); await sleep(450); continue; }
          await sleep(300);
        }
        t('结果卡出现过（通过态）', sawResult);
        t('结算屏出现过', sawSummary);
        t('回队列（冲刺结束）', !!dt('.bz-q-view'));

        // 全对通过后：待重做已解除；逾期归零；阶梯短档（1d/6h）重排回今天=2；长档/FSRS 移入未来=10
        //（挂起（missing）在 done 列不入三区 → 15 = done3 + today2 + future10）
        await sleep(400);
        t('待重做已解除（无红 tag）', dts('.bz-q-tag.is-redo').length === 0);
        const finalCnts = dts('.bz-q-col-head .cnt').map((e) => Number(e.textContent));
        t('全通过后逾期归零', finalCnts[0] === 0);
        t('短间隔重排今日2篇（阶梯1天档）', finalCnts[1] === 2);
        t('长间隔/FSRS 移入未来10篇', finalCnts[2] === 10);

        document.title = window.__st.fail.length
          ? 'SELFTEST FAIL ' + window.__st.fail.join(',')
          : `SELFTEST OK ${window.__st.pass}/${window.__st.pass + window.__st.fail.length}`;
        res.textContent = window.__st.fail.length ? '自检失败' : `自检通过 ${window.__st.pass}`;
        res.className = window.__st.fail.length ? 'bad' : 'ok';
      } catch (err) {
        document.title = 'SELFTEST ERR ' + (err && err.message || err);
        res.textContent = '自检异常';
        res.className = 'bad';
      }
    })();
  }
})();
</script>
</body>
</html>
