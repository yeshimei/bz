<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>收藏本 · 原型预览（与 src/favorites/styles.css 共用同一份 CSS）</title>
<!--
  ┌────────────────────────────────────────────────────────────────────┐
  │ 本文件 = 收藏本域 UI 的评审壳。组件样式零内联，全部来自（与          │
  │ build-css SOURCES 同序的 core 链 +）同目录 ./styles.css（与插件构建  │
  │ 同一份源文件）。改样式只改 styles.css，刷新本页即见，插件构建自动    │
  │ 带走——不存在二次同步。                                              │
  │ 本文件只允许写：演示壳（页面底/手机框/评审徽牌）与演示逻辑（JS）。   │
  └────────────────────────────────────────────────────────────────────┘
-->
<!-- core 链与 build-css.mjs SOURCES 同序（参照 belongings 原型）：评审壳内复现
     reset/组件基线与本域样式的级联对抗，避免「壳里看不出来」的选择器脆弱性 -->
<link rel="stylesheet" href="../core/styles.css">
<link rel="stylesheet" href="../core/ui/tokens.css">
<link rel="stylesheet" href="../core/ui/components.css">
<link rel="stylesheet" href="./styles.css">
<style>
  /* ===== 以下全部是演示壳，禁止放组件样式 ===== */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; gap: 56px; padding: 32px 24px;
    background: #e3e0d8; font-family: system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif; }
  body.theme-dark { background: #1e1b18; }
  * { scrollbar-width: none; } *::-webkit-scrollbar { display: none; }

  /* 桌面面板外景（组件本体 900×620 来自 styles.css） */
  .demo-dt { flex: none; }

  /* 移动端手机框：把全屏态（.bz-fav-mob 100vw/100vh）缩进 396×780 演示框 */
  .demo-mob { width: 396px !important; height: 780px !important; max-width: none !important;
    position: relative; border: 1px solid #d8d1c0; border-radius: 26px; overflow: hidden; flex: none;
    box-shadow: 0 8px 30px rgba(0,0,0,.14); }
  /* 抽屉遮罩插件里挂 body（fixed 全屏）；评审壳内收进手机框 */
  .demo-mob .bz-fav-sheet-mask { position: absolute; }

  /* 评审徽牌 / 主题钮（演示壳自用） */
  .vbadge { position: fixed; right: 16px; bottom: 12px; font-size: 11px; color: #9a917d; display: flex; gap: 10px; align-items: center;
    background: rgba(255,255,255,.9); border: 1px solid #d8d1c0; padding: 3px 8px; }
  .vbadge button { border: none; background: none; color: #b3564d; font: 11px 'Microsoft YaHei'; cursor: pointer; }
  .theme-toggle { position: fixed; right: 16px; top: 14px; width: 34px; height: 34px; border-radius: 50%; cursor: pointer;
    border: 1px solid #d8d1c0; background: rgba(255,255,255,.9); color: #6d6455; display: flex; align-items: center; justify-content: center; }
  body.theme-dark .theme-toggle { background: rgba(53,49,42,.9); border-color: #3a352d; color: #cfc7b4; }
</style>
</head>
<body>
  <button class="theme-toggle" id="themeBtn" title="亮/暗切换"></button>

  <div class="bz-fav-panel bz-fav-scope demo-dt" id="dtPanel">
    <div class="bz-fav-head"><h1>收藏本</h1></div>
    <div class="bz-fav-tags" id="dtTags"></div>
    <div class="bz-fav-board" id="dtBoard"></div>
  </div>

  <div class="bz-fav-panel bz-fav-scope bz-fav-mob demo-mob" id="mobPanel">
    <div class="bz-fav-head"><h1>收藏本</h1><button class="bz-fav-mob-close" data-fav-close title="关闭" id="mobClose"></button></div>
    <div class="bz-fav-tags" id="mobTags"></div>
    <div class="bz-fav-board" id="mobBoard"></div>
    <div class="bz-fav-sheet-mask" id="sheetMask"><div class="bz-fav-sheet" id="sheet"></div></div>
  </div>

  <div class="vbadge">收藏本 · 原型预览（共用 styles.css）· 真实 51 条 <button id="reset">重置演示数据</button></div>

<script src="./prototype-icons.js"></script>
<script src="./prototype-data.js"></script>
<script>
(function () {
  const { TAGS, esc, icon, hueOf } = FAV;
  const LS = 'bz-fav-c5-shared-v1';
  const LS_THEME = 'bz-fav-c5-theme';
  let items;
  try {
    const saved = JSON.parse(localStorage.getItem(LS) || 'null');
    items = Array.isArray(saved) && saved.length ? saved : FAV.ITEMS.map((x) => ({ ...x }));
  } catch (e) { items = FAV.ITEMS.map((x) => ({ ...x })); }
  const M = { archived: false, tag: null };

  const byId = (id) => items.find((i) => i.id === id);
  const save = () => { try { localStorage.setItem(LS, JSON.stringify(items)); } catch (e) { } };
  const localNow = () => {
    const d = new Date(), p = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  };
  const relTime = (s) => {
    if (!s) return '';
    const d = new Date(s.replace(' ', 'T'));
    if (isNaN(d)) return s;
    const diff = Date.now() - d.getTime(), m = 60000, h = 3600000, day = 86400000;
    if (diff < m) return '刚刚';
    if (diff < h) return Math.floor(diff / m) + ' 分钟前';
    if (diff < day) return Math.floor(diff / h) + ' 小时前';
    if (diff < 7 * day) return Math.floor(diff / day) + ' 天前';
    const p = (n) => String(n).padStart(2, '0');
    return `${d.getMonth() + 1}-${p(d.getDate())}`;
  };
  const curList = () => items.filter((i) =>
    !M.archived && M.tag === null ? !i.archived : M.archived ? !!i.archived : !i.archived && (i.tags || []).includes(M.tag));

  /* ==================== 标签磁贴行（与 ui.ts renderTags 同构） ==================== */
  function renderTagsInto(mount, mobile) {
    const mk = (label, ic, cnt, active, grey) =>
      `<button class="bz-fav-chip${active ? ' bz-fav-on' : ''}${grey ? ' bz-fav-chip--grey' : ''}" data-fav-tag="${esc(label)}">${ic ? icon(ic, 12) : ''}<span>${esc(label)} ${cnt}</span></button>`;
    const add = `<button class="bz-fav-chip-add" data-fav-add title="添加收藏">${icon('plus', 12)}<span>新收藏</span></button>`;
    const chips =
      mk('全部', '', items.filter((i) => !i.archived).length, !M.archived && M.tag === null) +
      mk('已归档', 'archive', items.filter((i) => i.archived).length, M.archived, true) +
      TAGS.map((t) => {
        const n = items.filter((i) => !i.archived && (i.tags || []).includes(t.label)).length;
        return n ? mk(t.label, t.ic, n, !M.archived && M.tag === t.label) : '';
      }).join('');
    mount.innerHTML = mobile ? add + chips : chips + add;
  }

  /* ==================== 卡片（与 ui.ts cardHtml 同构） ==================== */
  function cardHtml(it) {
    const i = items.indexOf(it);
    const hue = hueOf((it.tags || [])[0] || '');
    const tape = 'bz-fav-tape' + (i % 3 ? [' bz-fav-tape--r', ' bz-fav-tape--g'][i % 3 - 1] : '');
    return `<div class="bz-fav-card${it.pinned ? ' bz-fav-pinc' : ''}${it.archived ? ' bz-fav-arch' : ''}" data-fav-id="${esc(it.id)}">
      <span class="${tape}"></span>
      <span class="bz-fav-dot" style="--c:hsl(${hue} 52% 58%)"></span>
      <h3>${esc(it.title || '无标题')}</h3>
      <p>${esc(it.description || '（这张卡只写了个名字）')}</p>
      <div class="bz-fav-ft"><span class="bz-fav-tags-row">${(it.tags || []).map((t) => {
        const h = hueOf(t);
        const ic = (TAGS.find((x) => x.label === t) || { ic: '' }).ic;
        return `<span class="bz-fav-tagb" style="background:hsl(${h} 70% 95%);color:hsl(${h} 45% 42%)">${ic ? icon(ic, 11) : ''}<span>${esc(t)}</span></span>`;
      }).join('')}</span>
        <span>${esc(relTime(it.created))}</span></div>
    </div>`;
  }
  const sorted = (list) => list.slice().sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || (b.created || '').localeCompare(a.created || ''));

  function renderAll() {
    renderTagsInto(document.getElementById('dtTags'), false);
    renderTagsInto(document.getElementById('mobTags'), true);
    const list = sorted(curList());
    const html = list.length ? list.map(cardHtml).join('') : '<div class="bz-fav-empty">这块板上还没有卡片</div>';
    document.getElementById('dtBoard').innerHTML = html;
    document.getElementById('mobBoard').innerHTML = html;
  }

  /* ==================== 行操作集（与 ui.ts buildActions 同构） ==================== */
  function buildActs(it) {
    const acts = [];
    if ((it.url || '').trim()) acts.push({ ic: 'external-link', label: '打开', run: () => window.open(it.url, '_blank') });
    acts.push({ ic: it.pinned ? 'pin-off' : 'pin', label: it.pinned ? '取消置顶' : '置顶', run: () => { it.pinned = !it.pinned; save(); renderAll(); } });
    acts.push({ ic: 'pencil', label: '编辑', run: () => openForm(it) });
    acts.push(it.archived
      ? { ic: 'archive-restore', label: '取消归档', run: () => { it.archived = false; it.archivedAt = null; save(); renderAll(); toast(`已取消归档，「${it.title}」回到主列表`); } }
      : { ic: 'archive', label: '归档', run: () => confirmDlg('归档收藏', `确定归档收藏「${it.title}」吗？归档后不在主列表显示（数据保留），可在通知中撤销。`, '归档', () => {
          it.archived = true; it.archivedAt = localNow(); save(); renderAll();
          toast(`已归档收藏「${it.title}」`, '撤销', () => { it.archived = false; it.archivedAt = null; save(); renderAll(); });
        }) });
    acts.push({ ic: 'trash-2', label: '删除', danger: true, run: () => confirmDlg('删除收藏', `确定删除收藏「${it.title}」吗？删除后可在通知中撤销。`, '删除', () => {
      const idx = items.indexOf(it);
      items.splice(idx, 1); save(); renderAll();
      toast(`已删除收藏「${it.title}」`, '撤销', () => { items.splice(Math.min(idx, items.length), 0, it); save(); renderAll(); });
    }) });
    return acts;
  }

  /* ==================== 桌面右键菜单（.bz-fav-ctx） ==================== */
  let menuEl = null;
  function closeMenu() { if (menuEl) { menuEl.remove(); menuEl = null; } }
  function openMenu(it, x, y) {
    closeMenu();
    const acts = buildActs(it);
    menuEl = document.createElement('div');
    menuEl.className = 'bz-fav-ctx bz-fav-scope';
    menuEl.innerHTML = acts.map((a, k) => {
      const last = k === acts.length - 1;
      const btn = `<button data-k="${k}"${a.danger ? ' class="bz-fav-danger"' : ''}>${icon(a.ic, 14)}<span>${esc(a.label)}</span></button>`;
      return last ? `<div class="bz-fav-ctx-sep"></div>${btn}` : btn;
    }).join('');
    menuEl.addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      closeMenu(); acts[+b.dataset.k].run();
    });
    document.body.appendChild(menuEl);
    const r = menuEl.getBoundingClientRect();
    menuEl.style.left = Math.min(x, innerWidth - r.width - 8) + 'px';
    menuEl.style.top = Math.min(y, innerHeight - r.height - 8) + 'px';
  }
  document.addEventListener('click', (e) => { if (menuEl && !menuEl.contains(e.target)) closeMenu(); });
  document.getElementById('dtBoard').addEventListener('contextmenu', (e) => {
    const card = e.target.closest('.bz-fav-card'); if (!card) return;
    e.preventDefault();
    const it = byId(card.dataset.favId);
    if (it) openMenu(it, e.clientX, e.clientY);
  });
  document.getElementById('dtBoard').addEventListener('click', (e) => {
    const card = e.target.closest('.bz-fav-card'); if (!card) return;
    const it = byId(card.dataset.favId); if (!it) return;
    if ((it.url || '').trim()) window.open(it.url, '_blank');
  });

  /* ==================== 移动端底部抽屉（.bz-fav-sheet） ==================== */
  const sheetMask = document.getElementById('sheetMask');
  function openSheet(it) {
    const hue = hueOf((it.tags || [])[0] || '');
    const acts = buildActs(it);
    const sheet = document.getElementById('sheet');
    sheet.innerHTML = `
      <div class="bz-fav-sh-head"><span class="bz-fav-sh-dot" style="--c:hsl(${hue} 52% 58%)"></span>
        <div><div class="bz-fav-sh-title">${esc(it.title || '无标题')}</div>
        <div class="bz-fav-sh-meta">${esc(relTime(it.created))}${it.pinned ? ' · 已置顶' : ''}${it.archived ? ' · 已归档' : ''}</div></div></div>
      <div class="bz-fav-sh-acts">${acts.map((a, k) =>
        `<button data-k="${k}"${a.danger ? ' class="bz-fav-danger"' : ''}>${icon(a.ic, 15)}<span>${esc(a.label)}</span></button>`).join('')}</div>`;
    sheet.onclick = (e) => {
      const b = e.target.closest('button'); if (!b) return;
      closeSheet(); acts[+b.dataset.k].run();
    };
    sheetMask.classList.add('bz-fav-show');
  }
  function closeSheet() { sheetMask.classList.remove('bz-fav-show'); }
  sheetMask.addEventListener('click', (e) => { if (e.target === sheetMask) closeSheet(); });
  document.getElementById('mobBoard').addEventListener('click', (e) => {
    const card = e.target.closest('.bz-fav-card'); if (!card) return;
    const it = byId(card.dataset.favId); if (it) openSheet(it);
  });
  const mobClose = document.getElementById('mobClose');
  mobClose.innerHTML = icon('x', 12);
  mobClose.onclick = () => toast('评审壳：插件内此处关闭全屏面板');

  /* ==================== 磁贴行点击（两端委托，与 ui.ts 同语义） ==================== */
  function bindTags(mountId) {
    document.getElementById(mountId).addEventListener('click', (e) => {
      if (e.target.closest('[data-fav-add]')) { openForm(null); return; }
      const chip = e.target.closest('[data-fav-tag]');
      if (!chip) return;
      const label = chip.dataset.favTag;
      if (label === '全部') { M.tag = null; M.archived = false; }
      else if (label === '已归档') { M.tag = null; M.archived = !M.archived; }
      else { M.archived = false; M.tag = M.tag === label ? null : label; }
      closeMenu(); renderAll();
    });
  }
  bindTags('dtTags'); bindTags('mobTags');

  /* ==================== 确认框 / toast（插件侧走 core flow-dialog/notice，演示壳自绘） ==================== */
  function confirmDlg(title, msg, okLabel, onOk) {
    const mask = document.createElement('div');
    mask.className = 'bz-fav-form-mask bz-fav-scope';
    mask.innerHTML = `<div class="bz-fav-form" style="width:320px;padding:20px 22px 16px">
      <h2 style="font-size:14.5px;margin-bottom:9px">${esc(title)}</h2>
      <p style="font-size:12.5px;line-height:1.7;color:var(--pop-mut);margin-bottom:16px">${esc(msg)}</p>
      <div class="bz-fav-btns"><button data-a="c">取消</button><button data-a="ok" class="bz-fav-pri">${esc(okLabel)}</button></div></div>`;
    const done = () => mask.remove();
    mask.addEventListener('click', (e) => {
      if (e.target === mask || e.target.dataset.a === 'c') return done();
      if (e.target.dataset.a === 'ok') { done(); onOk(); }
    });
    document.body.appendChild(mask);
  }
  let toastEl = null, toastTimer = 0;
  function toast(msg, undoLabel, onUndo) {
    if (toastEl) toastEl.remove();
    clearTimeout(toastTimer);
    toastEl = document.createElement('div');
    toastEl.style.cssText = 'position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:700;display:flex;align-items:center;gap:14px;background:#4a443a;color:#f3efe4;font-size:12.5px;padding:10px 16px;border-radius:99px;box-shadow:0 8px 24px rgba(0,0,0,.28)';
    toastEl.innerHTML = `<span>${esc(msg)}</span>` + (undoLabel ? `<button style="border:none;background:none;color:#e0b73a;font:700 12.5px 'Microsoft YaHei';cursor:pointer">${esc(undoLabel)}</button>` : '');
    if (undoLabel) toastEl.querySelector('button').onclick = () => { toastEl.remove(); toastEl = null; onUndo(); };
    document.body.appendChild(toastEl);
    toastTimer = setTimeout(() => { toastEl && toastEl.remove(); toastEl = null; }, 5000);
  }

  /* ==================== 添加 / 编辑表单（.bz-fav-form，与 ui.ts openForm 同构） ==================== */
  function openForm(it) {
    const editing = !!it;
    const mask = document.createElement('div');
    mask.className = 'bz-fav-form-mask bz-fav-scope';
    mask.innerHTML = `<div class="bz-fav-form">
      <h2>${editing ? '编辑收藏' : '添加收藏'}</h2>
      <div class="bz-fav-fld"><label>标题</label><input id="fz-title" value="${esc(it ? it.title : '')}" placeholder="如：某篇好文"></div>
      <div class="bz-fav-fld"><label>链接</label><input id="fz-url" value="${esc(it ? it.url : '')}" placeholder="https://…"></div>
      <div class="bz-fav-fld"><label>简介</label><textarea id="fz-desc" placeholder="一句话记住它…">${esc(it ? it.description || '' : '')}</textarea></div>
      <div class="bz-fav-fld"><label>标签（可多选）</label><div class="bz-fav-pick" id="fz-tags"></div></div>
      <div class="bz-fav-fld bz-fav-inline"><span class="bz-fav-sw${it && it.pinned ? ' bz-fav-on' : ''}" id="fz-pin"></span><span class="bz-fav-fld-desc">置顶后恒排最前</span></div>
      <div class="bz-fav-err" id="fz-err"></div>
      <div class="bz-fav-btns"><button type="button" id="fz-ai" class="bz-fav-ai-btn">${icon('star', 12)} <span>AI 整理</span></button><button type="button" data-fz-cancel>取消</button><button type="button" id="fz-save" class="bz-fav-pri">${editing ? '更新' : '保存'}</button></div>
    </div>`;
    document.body.appendChild(mask);
    const form = mask.querySelector('.bz-fav-form');
    const sel = new Set((it ? it.tags : []) || []);
    const pick = form.querySelector('#fz-tags');
    const drawPick = () => {
      pick.innerHTML = '';
      TAGS.forEach((t) => {
        const b = document.createElement('button');
        b.type = 'button'; b.innerHTML = `${icon(t.ic, 12)}<span>${t.label}</span>`;
        if (sel.has(t.label)) b.classList.add('bz-fav-on');
        b.onclick = () => { sel.has(t.label) ? sel.delete(t.label) : sel.add(t.label); drawPick(); };
        pick.appendChild(b);
      });
    };
    drawPick();
    form.querySelector('#fz-pin').onclick = (e) => e.currentTarget.classList.toggle('bz-fav-on');
    const titleInp = form.querySelector('#fz-title'), urlInp = form.querySelector('#fz-url');
    titleInp.addEventListener('paste', (e) => {
      const text = (e.clipboardData || window.clipboardData)?.getData('text')?.trim() || '';
      if (!/^https?:\/\/\S+$/i.test(text)) return;
      e.preventDefault();
      if (!urlInp.value.trim()) urlInp.value = text;
      setTimeout(() => titleInp.focus(), 0);
    });
    const aiBtn = form.querySelector('#fz-ai');
    aiBtn.onclick = () => {
      const g = (id) => form.querySelector(id)?.value.trim() || '';
      if (!g('#fz-title') && !g('#fz-url') && !g('#fz-desc')) { form.querySelector('#fz-err').textContent = '请至少输入标题、链接或简介中的一项，以便 AI 参考'; return; }
      form.querySelector('#fz-err').textContent = '';
      aiBtn.disabled = true;
      aiBtn.querySelector('span').textContent = 'AI 整理中…';
      toast('AI 分析中…');
      setTimeout(() => {
        const url = g('#fz-url');
        const gh = url.match(/github\.com\/([^\/?#]+)\/([^\/?#]+)/);
        const setVal = (id, v) => { const el = form.querySelector(id); if (el && !el.value.trim() && v) el.value = String(v); };
        if (gh) setVal('#fz-title', gh[2]);
        else if (!g('#fz-title')) {
          try { setVal('#fz-title', new URL(/^https?:\/\//.test(url) ? url : 'https://' + url).hostname.replace(/^www\./, '').split('.')[0]); } catch (e) { }
        }
        const guess = [];
        if (/github\.com\//.test(url)) guess.push('GitHub');
        const hay = (g('#fz-title') + ' ' + g('#fz-desc')).toLowerCase();
        TAGS.forEach((t) => { if (t.label !== 'GitHub' && hay.includes(t.label.toLowerCase())) guess.push(t.label); });
        guess.forEach((t) => sel.add(t));
        drawPick();
        aiBtn.disabled = false;
        aiBtn.querySelector('span').textContent = 'AI 整理';
        toast('AI 整理完成（评审壳为模拟，插件内为真实 AI 调用）');
      }, 1200);
    };
    mask.addEventListener('click', (e) => {
      if (e.target === mask || e.target.closest('[data-fz-cancel]')) return mask.remove();
      if (!e.target.closest('#fz-save')) return;
      const title = titleInp.value.trim();
      if (!title) { form.querySelector('#fz-err').textContent = '标题不能为空'; return; }
      const tags = TAGS.map((t) => t.label).filter((l) => sel.has(l));
      const patch = { title, url: urlInp.value.trim(), description: form.querySelector('#fz-desc').value.trim(), tags, type: tags[0] || '', pinned: form.querySelector('#fz-pin').classList.contains('bz-fav-on') };
      if (editing) Object.assign(it, patch);
      else items.unshift({ id: String(Date.now()), created: localNow(), ...patch });
      save(); renderAll(); mask.remove();
      toast(editing ? `已更新「${title}」` : `已添加「${title}」`);
    });
    titleInp.focus();
  }

  /* ==================== 主题切换（body.theme-dark ↔ .theme-dark .bz-fav-scope） ==================== */
  const themeBtn = document.getElementById('themeBtn');
  function applyTheme(dark) {
    document.body.classList.toggle('theme-dark', dark);
    themeBtn.innerHTML = icon(dark ? 'sun' : 'eye', 16);
    try { localStorage.setItem(LS_THEME, dark ? 'dark' : 'light'); } catch (e) { }
  }
  let dark = false;
  try { dark = localStorage.getItem(LS_THEME) === 'dark'; } catch (e) { }
  themeBtn.onclick = () => applyTheme(!document.body.classList.contains('theme-dark'));
  applyTheme(dark);

  /* ==================== Esc / 重置 ==================== */
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (menuEl) return closeMenu();
    if (sheetMask.classList.contains('bz-fav-show')) return closeSheet();
    const mask = document.querySelector('.bz-fav-form-mask');
    if (mask) mask.remove();
  });
  document.getElementById('reset').onclick = () => {
    confirmDlg('重置演示数据', '丢弃本页所有改动，恢复为 vault 里的真实收藏数据。', '重置', () => {
      localStorage.removeItem(LS);
      items = FAV.ITEMS.map((x) => ({ ...x }));
      M.tag = null; M.archived = false;
      save(); renderAll(); toast('已恢复真实数据');
    });
  };

  renderAll();
})();
</script>
</body>
</html>
