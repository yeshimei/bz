<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>归物本 · 原型预览（与 src/belongings/styles.css 共用同一份 CSS）</title>
<!--
  ┌────────────────────────────────────────────────────────────────────┐
  │ 本文件 = 归物本域 UI 的评审壳 = 拍板原型 p20-full.html 的域内定稿。  │
  │ 组件样式零内联，全部来自（与 build-css SOURCES 同序）：              │
  │   ../core/styles.css → ../core/ui/tokens.css                        │
  │   → ../core/ui/components.css → ./styles.css                        │
  │ 方向铁律：p20-full（.zcode）是视觉基准 → 先改这里评审 → 同步 styles  │
  │ /ui.ts；禁止拿域现状反向改写本文件（issue 230 教训）。               │
  │ 移动端判定：真实端 = 视口/面板 ≤768（容器查询）；评审壳 = .demo-mob。│
  └────────────────────────────────────────────────────────────────────┘
-->
<link rel="stylesheet" href="../core/styles.css">
<link rel="stylesheet" href="../core/ui/tokens.css">
<link rel="stylesheet" href="../core/ui/components.css">
<link rel="stylesheet" href="./styles.css">
<style>
  /* ===== 以下全部是演示壳，禁止放组件样式 ===== */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; gap: 56px; padding: 32px 24px;
    background: #dcd8cd; font-family: system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif; }
  /* 模拟 Obsidian 宿主变量（core/styles.css 的右键菜单/底部抽屉取值用；插件内由主题提供） */
  body {
    --background-primary: #fbf9f3; --text-normal: #171512; --text-muted: #8b8474; --text-faint: #b3ab99;
    --text-error: #b3564d; --background-modifier-hover: rgba(23,21,18,.06); --color-green: #3d8f5d;
  }
  * { scrollbar-width: none; } *::-webkit-scrollbar { display: none; }

  /* 桌面面板外景（组件本体 920×640 来自 styles.css） */
  .demo-dt { flex: none; }

  /* 移动端手机框：面板（全屏态 100vw/100vh）缩进 396×780 演示框，
     并把面板自身变成 396px 容器 → styles.css @container 移动端规则生效 */
  .demo-mob { width: 396px; height: 780px; position: relative; overflow: hidden; flex: none;
    border: 1px solid #b8b0a0; border-radius: 26px; background: #f5f2ec; box-shadow: 0 8px 30px rgba(0,0,0,.16); }
  .demo-mob .bz-bel-panel { width: 100% !important; height: 100% !important;
    max-width: none !important; max-height: none !important; border: none; box-shadow: none; }
  /* 插件把浮层遮罩挂 body（fixed 全屏）；评审壳内收进手机框 */
  .demo-mob .bz-overlay-mask, .demo-mob .bz-item-sheet-mask { position: absolute; }
  .demo-mob .bz-item-sheet { position: absolute; } /* 抽屉本体在 core 是 fixed 钉视口，壳内钉手机框 */

  /* 评审徽牌（演示壳自用）；P20 纸面双主题恒定，无亮暗切换 */
  .vbadge { position: fixed; right: 16px; bottom: 12px; font-size: 11px; color: #8b8474; display: flex; gap: 10px; align-items: center;
    background: rgba(255,255,255,.92); border: 1px solid #c9c2b2; padding: 3px 8px; z-index: 900; }
  .vbadge button { border: none; background: none; color: #b3564d; font: 11px 'Microsoft YaHei'; cursor: pointer; }
</style>
</head>
<body class="theme-light"> <!-- 模拟 Obsidian 宿主：色彩 token 挂 theme-light/dark，壳内必须补一类才不透明 -->
  <div id="dtHost" class="demo-dt"></div>
  <div id="mobHost" class="demo-mob"></div>

  <div class="vbadge">归物本 · 原型预览（共用 styles.css）· 真实 65 件
    <button id="mobToggle">隐藏移动端</button>
    <button id="reset">重置演示数据</button>
  </div>

<script src="./prototype-icons.js"></script>
<script src="./prototype-data.js"></script>
<script>
(function () {
  /* ==================== 壳基座：转义 / 图标 / mountIcons（对齐 core/ui icons.ts） ==================== */
  const ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  const esc2 = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ESC_MAP[c]);
  const icon = (name, extra) => `<i data-lucide="${name}" class="bz-ic${extra ? ' ' + extra : ''}"></i>`;
  const ICONS = window.BLG_ICONS || {};
  function mountIcons(root) {
    if (!root) return;
    root.querySelectorAll('i[data-lucide]').forEach((el) => {
      const d = ICONS[el.dataset.lucide];
      if (d && !el.firstChild) {
        el.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
      }
    });
  }

  /* ==================== 与 ui.ts 同构的常量 / 小工具 ==================== */
  const ICON = { add: 'plus', search: 'search', close: 'x', del: 'trash-2', empty: 'package', chevR: 'chevron-right' };
  const STATUS = {
    using: { label: '使用中', key: 'using', ic: 'check-circle' },
    idle: { label: '闲置', key: 'idle', ic: 'package' },
    sold: { label: '已转卖', key: 'sold', ic: 'banknote' },
    discard: { label: '已丢弃', key: 'discard', ic: 'archive' },
  };
  const STATUS_LABELS = ['使用中', '闲置', '已转卖', '已丢弃'];
  const STATUS_ORDER = [
    { key: 'using', label: '使用中' }, { key: 'idle', label: '闲置' },
    { key: 'sold', label: '已转卖' }, { key: 'discard', label: '已丢弃' },
  ];

  const money = (n) => '￥' + (Number(n) || 0).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const moneyShort = (n) => '￥' + (Number(n) || 0).toLocaleString('zh-CN', { maximumFractionDigits: 0 });
  function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }
  /** 分类 emoji（取首段 emoji；无 emoji 显示首字）——与 ui.ts catEmoji 同构（分类 emoji 属数据保留） */
  function catEmoji(cat) {
    const m = String(cat || '').match(/^(\p{Extended_Pictographic})/u);
    return m ? m[1] : String(cat || '')[0] || '📦';
  }
  function catNameOf(cat) { return String(cat || '').replace(/^\p{Extended_Pictographic}\s*/u, ''); }
  function statusKeyOf(label) { const s = STATUS_ORDER.find((x) => x.label === label); return s ? s.key : label; }
  function statusOf(keyOrLabel) {
    return STATUS_ORDER.find((s) => s.key === keyOrLabel) || STATUS_ORDER.find((s) => s.label === keyOrLabel) || { key: 'using', label: '使用中' };
  }

  /* ==================== 数据 / 状态 ==================== */
  const LS = 'bz-bel-p20-shared-v1';
  let items;
  try {
    const saved = JSON.parse(localStorage.getItem(LS) || 'null');
    items = Array.isArray(saved) && saved.length ? saved : BLG.ITEMS.map((x) => ({ ...x }));
  } catch (e) { items = BLG.ITEMS.map((x) => ({ ...x })); }
  const save = () => { try { localStorage.setItem(LS, JSON.stringify(items)); } catch (e) { } };
  const M = { status: null, year: '', q: '', sort: 'recent' };

  const itemList = () => items;
  const isExited = (it) => it.current_status === '已转卖' || it.current_status === '已丢弃';
  const exitDateOf = (it) => (isExited(it) ? (it.exit_date || null) : null);
  function daysUsed(it) {
    const raw = it.purchase_date || '';
    if (!raw) return 0;
    const [y, m, d] = String(raw).slice(0, 10).split('-').map(Number);
    if (!y || !m || !d) return 0;
    const start = new Date(y, m - 1, d);
    const ex = exitDateOf(it);
    let end = new Date();
    if (ex) {
      const p = String(ex).slice(0, 10).split('-').map(Number);
      if (p[0] && p[1] && p[2]) end = new Date(p[0], p[1] - 1, p[2]);
    }
    return Math.max(0, Math.floor((end - start) / 864e5));
  }
  const dailyCostOf = (it) => { const days = daysUsed(it), price = Number(it.purchase_price) || 0; return days > 0 ? price / days : price; };
  const inStock = (it) => it.current_status === '使用中' || it.current_status === '闲置';
  const totalAssets = () => itemList().filter(inStock).reduce((s, i) => s + (Number(i.purchase_price) || 0), 0);
  function avgDailyCost() {
    let cost = 0, days = 0;
    for (const it of itemList()) {
      cost += Number(it.purchase_price) || 0;
      if (it.current_status === '已转卖' && Number(it.sold_price) > 0) cost -= Number(it.sold_price);
      days += daysUsed(it);
    }
    return days ? cost / days : 0;
  }
  const statusCount = (label) => itemList().filter((i) => i.current_status === label).length;
  const stockCount = () => itemList().filter(inStock).length;
  const itemById = (id) => items.find((i) => i.id === id);
  function filtered() {
    return itemList()
      .filter((i) => {
        if (!M.status) return true;
        if (M.status === 'asset') return inStock(i);
        return i.current_status === statusOf(M.status).label;
      })
      .filter((i) => (M.year ? String(i.purchase_date || '').startsWith(M.year) : true))
      .filter((i) => {
        if (!M.q) return true;
        const q = M.q.toLowerCase();
        return [i.name, i.category, i.description].join(' ').toLowerCase().includes(q);
      })
      .sort((a, b) => {
        if (M.sort === 'price') return (Number(b.purchase_price) || 0) - (Number(a.purchase_price) || 0);
        if (M.sort === 'daily') return dailyCostOf(b) - dailyCostOf(a);
        return String(b.purchase_date || '').localeCompare(String(a.purchase_date || '')) || String(a.name || '').localeCompare(String(b.name || ''), 'zh');
      });
  }
  function yearsAvailable() {
    const set = new Set();
    itemList().forEach((i) => { const y = String(i.purchase_date || '').slice(0, 4); if (y) set.add(y); });
    return [...set].sort().reverse();
  }
  function heroTitleText() {
    if (!M.status) return '全部';
    if (M.status === 'asset') return '资产';
    return statusOf(M.status).label;
  }

  /* ==================== 面板骨架（与 ui.ts panelHtml 逐字同构） ==================== */
  function panelHtml() {
    return `<div class="bz-bel-panel bz-panel-frame bz-panel-mtop bz-bel--poster">
  <div class="bz-bel-body">
    <div class="bz-bel-hero">
      <div class="bz-bel-hero-text">
        <div class="bz-bel-hero-title" data-bel-herotitle>全部</div>
        <div class="bz-bel-hero-sub" data-bel-herosub></div>
      </div>
      <div class="bz-bel-kpis" data-bel-kpis></div>
      <div class="bz-bel-mobhead">
        <div class="bz-bel-stamp"><b data-bel-stampn>0</b><span>在库</span></div>
        <div class="bz-bel-mobhead-tx">
          <div class="bz-bel-mobhead-t">归物本</div>
          <div class="bz-bel-mobhead-sub" data-bel-mobstats></div>
        </div>
        <button class="bz-icon-btn bz-icon-btn--lg bz-touch-target bz-bel-mob-only" data-bel-close title="关闭">${icon(ICON.close)}</button>
      </div>
    </div>
    <div class="bz-bel-chips" data-bel-chips></div>
    <div class="bz-toolrow bz-bel-toolrow">
      <div class="bz-search">${icon(ICON.search)}<input class="bz-input" type="text" data-bel-search placeholder="搜索名称 / 分类…"></div>
      <div class="bz-bel-yearsel">
        <select class="bz-bel-select" data-bel-year></select>
        ${icon(ICON.chevR, 'bz-bel-select-chev')}
      </div>
      <div class="bz-bel-yearsel bz-bel-mobsortsel-wrap">
        <select class="bz-bel-select" data-bel-mobsortsel></select>
        ${icon(ICON.chevR, 'bz-bel-select-chev')}
      </div>
      <div class="bz-bel-sort" data-bel-sort></div>
      <button class="bz-btn bz-btn--md bz-bel-addbtn" data-bel-add>${icon(ICON.add, 'bz-ic--sm')} 记一笔</button>
    </div>
    <div class="bz-mobstrip" data-bel-mobstatus></div>
    <div class="bz-bel-content" data-bel-content></div>
    <button class="bz-btn bz-btn--md bz-bel-mobadd" data-bel-add>${icon(ICON.add, 'bz-ic--sm')} 记一笔</button>
  </div>
</div>`;
  }

  /* ==================== 渲染（与 ui.ts renderAll 族同构，双面板共用） ==================== */
  function renderHero(p) {
    p.q('[data-bel-herotitle]').textContent = heroTitleText();
    p.q('[data-bel-herosub]').textContent = M.status
      ? `归物本 — ${filtered().length} 件在列 · FILTERED VIEW`
      : '归物本 — BELONGINGS · NOTHING MORE, NOTHING LESS';
  }
  function renderChips(p) {
    const defs = [
      { key: '__all', label: '全部', cnt: itemList().length },
      { key: 'asset', label: '资产', cnt: stockCount() },
      ...STATUS_ORDER.map((s) => ({ key: s.key, label: s.label, cnt: statusCount(s.label) })),
    ];
    // 桌面 chips（p20 .chip 方角墨框；uiChip 皮 = bz-chip / bz-chip--on / bz-chip-cnt，无图标）
    p.q('[data-bel-chips]').innerHTML = defs.map((d) => {
      const active = d.key === '__all' ? M.status === null : M.status === d.key;
      return `<button type="button" class="bz-chip${active ? ' bz-chip--on' : ''}" data-bel-st="${d.key}"><span>${esc2(d.label)}</span><span class="bz-chip-cnt">${d.cnt}</span></button>`;
    }).join('');
    // 移动横滑 chips（p20 m-chips：纯文字+计数，无图标；用户拍板去资产+缩小，五枚放一行）
    p.q('[data-bel-mobstatus]').innerHTML = (() => {
      const defs = [
        { key: '__all', label: '全部', cnt: itemList().length },
        ...STATUS_ORDER.map((s) => ({ key: s.key, label: s.label, cnt: statusCount(s.label) })),
      ];
      return defs.map((d) => {
        const active = d.key === '__all' ? M.status === null : M.status === d.key;
        return `<button class="bz-mobstrip-chip${active ? ' is-on' : ''}" data-bel-st="${d.key}"><span>${esc2(d.label)}</span><span class="bz-chip-cnt">${d.cnt}</span></button>`;
      }).join('');
    })();
  }
  function renderYears(p) {
    const ys = yearsAvailable();
    if (M.year && !ys.includes(M.year)) M.year = '';
    p.q('[data-bel-year]').innerHTML = '<option value="">全部年份</option>' + ys.map((y) => `<option value="${y}"${M.year === y ? ' selected' : ''}>${y}</option>`).join('');
  }
  function renderKpis(p) {
    const gone = itemList().filter(isExited);
    const recover = gone.reduce((s, i) => s + (Number(i.sold_price) || 0), 0);
    const stampN = p.q('[data-bel-stampn]');
    if (stampN) stampN.textContent = String(stockCount());
    const mobStats = p.q('[data-bel-mobstats]');
    if (mobStats) mobStats.textContent = `投入 ${moneyShort(totalAssets())} · 日均 ${avgDailyCost().toFixed(2)}`;
    const kpi = (num, label, opts = {}) =>
      `<div class="bz-bel-kpi${opts.hero ? ' bz-bel-kpi--hero' : ''}${opts.click ? ' bz-bel-kpi--click' : ''}"${opts.click ? ' data-bel-statclick="asset" title="只看在库（使用中与闲置）"' : ''}><b>${num}</b><span>${esc2(label)}</span></div>`;
    p.q('[data-bel-kpis]').innerHTML =
      kpi(String(stockCount()), '在库件数', { hero: true, click: true }) +
      kpi(moneyShort(totalAssets()), '在库投入', { click: true }) +
      kpi('￥' + avgDailyCost().toFixed(2), '日均成本') +
      kpi(`${gone.length} 件 · ${moneyShort(recover)}`, '已离场 · 回收');
  }
  function cellHtml(it, idx) {
    const gone = isExited(it);
    const idle = it.current_status === '闲置';
    const days = daysUsed(it);
    const daily = dailyCostOf(it);
    const key = statusKeyOf(it.current_status);
    const exitNote = gone
      ? `${it.exit_date ? ' → ' + esc2(String(it.exit_date).slice(0, 10)) : ''}${it.current_status === '已转卖' && Number(it.sold_price) > 0 ? ' · 售出 ' + moneyShort(Number(it.sold_price)) : ''}`
      : '';
    const dailyStr = daily < 0.01 ? daily.toFixed(4) : daily.toFixed(2).replace(/(\.\d*?)0+$/, '$1').replace(/\.$/, '');
    const mut = gone
      ? `${esc2(String(it.purchase_date || '').slice(0, 10) || '日期未知')} 起 · 陪伴 ${days || '—'} 天${exitNote}`
      : `${esc2(String(it.purchase_date || '').slice(0, 10) || '日期未知')} 起 · ${days || '—'} 天 · 日均 ￥${dailyStr}`;
    return `<div class="bz-bel-cell${gone ? ' bz-bel-cell--gone' : ''}${idle ? ' bz-bel-cell--idle' : ''}" data-bel-id="${esc2(it.id)}">
    <span class="bz-bel-cell-idx">NO.${String(idx + 1).padStart(2, '0')} — ${esc2(catNameOf(it.category) || '未分类')}</span>
    <span class="bz-bel-tag bz-bel-tag--${key}">${icon(STATUS[key] ? STATUS[key].ic : 'box', 'bz-ic--sm')}${esc2(it.current_status)}</span>
    <span class="bz-bel-cell-em">${esc2(catEmoji(it.category))}</span>
    <span class="bz-bel-name">${esc2(it.name)}</span>
    <span class="bz-bel-price">${moneyShort(Number(it.purchase_price) || 0)}</span>
    <span class="bz-bel-mut">${mut}</span>
  </div>`;
  }
  function renderContent(p) {
    const content = p.q('[data-bel-content]');
    const list = filtered();
    if (!list.length) {
      const noMatch = !!M.q || M.status !== null || M.year !== '';
      content.innerHTML = `<div class="bz-empty">${icon(ICON.empty, 'bz-empty-ic')}<div class="bz-empty-title">${noMatch ? '没有符合条件的物品' : '这里还没有物品'}</div><div class="bz-empty-desc">${noMatch ? '换个筛选条件，或清除搜索' : '点「记一笔」登记第一个物品'}</div></div>`;
      mountIcons(content);
      return;
    }
    content.innerHTML = `<div class="bz-bel-grid" data-bel-grid>${list.map(cellHtml).join('')}</div>`;
    // 末行空位补纸面 filler（列数入 DOM 后量，与 ui.ts renderContent 同语义）
    const gridEl = content.querySelector('[data-bel-grid]');
    const cols = (((getComputedStyle(gridEl).gridTemplateColumns) || '').split(' ').filter(Boolean).length) || 1;
    const rem = list.length % cols;
    if (rem) gridEl.insertAdjacentHTML('beforeend', `<div class="bz-bel-filler" style="grid-column:span ${cols - rem}"></div>`);
    mountIcons(content);
  }
  const SORT_OPTS = [
    { v: 'recent', label: '最近购入' }, { v: 'price', label: '投入最高' }, { v: 'daily', label: '日均最高' },
  ];
  function drawSort(p) {
    // 桌面段（移动端无 seg）+ 移动下拉值回填（用户拍板：移动排序 = 同年份样式的下拉）
    const host = p.q('[data-bel-sort]');
    if (host) host.innerHTML = `<div class="bz-segmented" role="radiogroup" aria-label="排序">${SORT_OPTS.map((o) =>
      `<button type="button" class="bz-segmented-btn${M.sort === o.v ? ' is-on' : ''}" data-k="${o.v}" role="radio" aria-checked="${M.sort === o.v}">${o.label}</button>`).join('')}</div>`;
    const sel = p.q('[data-bel-mobsortsel]');
    if (sel && sel.options.length) sel.value = M.sort;
  }
  function renderAll() {
    PANELS.forEach((p) => {
      renderHero(p); renderChips(p); renderYears(p); renderKpis(p); drawSort(p); renderContent(p);
    });
  }

  /* ==================== 面板装配 / 事件（与 ui.ts openPanelInner 同语义；mobile=演示端标记） ==================== */
  const PANELS = [];
  function buildPanel(host, mobile) {
    host.innerHTML = panelHtml();
    const el = host.querySelector('.bz-bel-panel');
    const p = { host, el, mobile, q: (sel) => el.querySelector(sel) };
    mountIcons(el);

    el.addEventListener('click', (e) => {
      const t = e.target;
      if (t.closest('[data-bel-add]')) { openForm(null, p); return; }
      if (t.closest('[data-bel-close]')) { host.style.display = 'none'; syncMobBtn(); toast('评审壳：插件内此处关闭全屏面板'); return; }
      const kpi = t.closest('[data-bel-statclick]');
      if (kpi) { M.status = M.status === 'asset' ? null : 'asset'; renderAll(); return; }
      const seg = t.closest('.bz-segmented-btn');
      if (seg) { M.sort = seg.dataset.k; renderAll(); return; }
      const chip = t.closest('[data-bel-st]');
      if (chip) { applyStatusFilter(chip.dataset.belSt); return; }
    });
    const yearSel = p.q('[data-bel-year]');
    yearSel.addEventListener('change', () => { M.year = yearSel.value; renderAll(); });
    // 移动排序下拉（同年份样式；双向同步）
    const mobSortSel = p.q('[data-bel-mobsortsel]');
    mobSortSel.innerHTML = SORT_OPTS.map((o) => `<option value="${o.v}">${o.label}</option>`).join('');
    mobSortSel.value = M.sort;
    mobSortSel.addEventListener('change', () => { M.sort = mobSortSel.value; renderAll(); });
    const bindSearch = (inp) => {
      inp.addEventListener('input', () => {
        clearTimeout(inp._belDeb);
        inp._belDeb = setTimeout(() => { M.q = inp.value.trim(); PANELS.forEach((x) => { renderKpis(x); renderContent(x); }); }, 180);
      });
    };
    bindSearch(p.q('[data-bel-search]'));
    const content = p.q('[data-bel-content]');
    content.addEventListener('click', (e) => {
      const cell = e.target.closest('[data-bel-id]');
      if (!cell) return;
      const it = itemById(cell.dataset.belId);
      if (!it) return;
      // 桌面点卡 = 详情弹窗；移动点卡 = 底部抽屉（与 ui.ts 同语义）
      if (p.mobile) openMobSheet(it, p); else openBelDetail(it, p);
    });
    content.addEventListener('contextmenu', (e) => {
      const cell = e.target.closest('[data-bel-id]');
      if (!cell || p.mobile) return;
      e.preventDefault();
      const it = itemById(cell.dataset.belId);
      if (it) openRowMenuAt(it, e.clientX, e.clientY, p);
    });
    PANELS.push(p);
    return p;
  }
  function applyStatusFilter(k) {
    if (k === '__all') M.status = null;
    else M.status = M.status === k ? null : k;
    renderAll();
  }

  /* ==================== 流转 / 删除（与 ui.ts applyFlowWithUndo / deleteItem 同构） ==================== */
  async function applyFlowWithUndo(it, s) {
    const cur = itemById(it.id);
    if (!cur) { toast('该物品已被外部变更删除，列表已刷新'); renderAll(); return; }
    const prevStatus = cur.current_status;
    cur.current_status = s;
    if (isExited(cur)) cur.exit_date = todayStr();
    else if (cur.exit_date != null) cur.exit_date = null;
    cur.last_updated = new Date().toISOString();
    save(); renderAll();
    toast(`「${cur.name}」已标记为${s}`, '撤销', () => {
      const now = itemById(it.id);
      if (!now) { toast('该物品已被外部变更删除，无法撤销'); return; }
      now.current_status = prevStatus;
      if (now.exit_date != null) now.exit_date = null;
      now.last_updated = new Date().toISOString();
      save(); renderAll();
      toast(`已撤销，「${now.name}」回到${prevStatus}`);
    });
  }
  async function deleteItem(it, p) {
    confirmDlg('删除物品', `确定要删除物品「${it.name}」吗？删除后可在通知中撤销。`, '删除', () => {
      const idx = items.findIndex((i) => i.id === it.id);
      if (idx < 0) { toast('该物品已被外部变更删除，列表已刷新'); renderAll(); return; }
      const snapshot = { ...items[idx] };
      items.splice(idx, 1);
      closeBelDetail();
      save(); renderAll();
      toast(`已删除「${it.name}」`, '撤销', () => {
        if (itemById(snapshot.id)) { toast(`已存在同 id 物品（${snapshot.id}），跳过恢复`); return; }
        items.splice(Math.min(idx, items.length), 0, snapshot);
        save(); renderAll();
        toast(`已恢复「${snapshot.name}」`);
      });
    });
  }

  /* ==================== 行操作集（与 ui.ts buildActions 同构；插件走 core/item-actions） ==================== */
  function buildActions(it, rebuild, p) {
    const acts = [];
    const iconOf = { 使用中: 'check-circle', 闲置: 'package', 已转卖: 'banknote', 已丢弃: 'archive' };
    STATUS_LABELS.forEach((s) => {
      if (s === it.current_status) return;
      acts.push({ icon: iconOf[s], label: `标记为${s}`, keepOpen: true, onClick: () => { applyFlowWithUndo(it, s).then(rebuild); } });
    });
    acts.push({ icon: 'pencil', label: '编辑', keepOpen: true, onClick: () => openForm(it, p) });
    acts.push({ icon: 'trash-2', label: '删除', kind: 'danger', onClick: () => deleteItem(it, p) });
    return acts;
  }
  function sheetHeadOf(it) {
    const catName = catNameOf(it.category);
    const days = daysUsed(it);
    return `<div class="bz-item-sheet-entry"><div class="bz-bel-sheet-head">
      <span class="bz-item-sheet-emoji">${esc2(catEmoji(it.category) || '📦')}</span>
      <div class="bz-bel-sheet-info"><div class="bz-item-sheet-title">${esc2(it.name)}</div>
      <div class="bz-item-sheet-sub">${esc2(catName)} · ${money(Number(it.purchase_price) || 0)} · 已用 ${days} 天</div></div></div></div>`;
  }
  function sheetActsHtml(acts) {
    return acts.map((a) =>
      `<button type="button" class="bz-item-sheet-item${a.kind === 'danger' ? ' bz-item-sheet-item--danger' : ''}"><span class="bz-item-sheet-icon">${icon(a.icon)}</span><span class="bz-item-sheet-label">${esc2(a.label)}</span></button>`).join('');
  }
  function openMobSheet(it, p) {
    closeMobSheet();
    const mask = document.createElement('div');
    mask.className = 'bz-item-sheet-mask';
    const rebuild = () => {
      const it2 = itemById(it.id);
      if (!it2) { closeMobSheet(); return; }
      mask.querySelector('.bz-item-sheet-body').innerHTML = sheetActsHtml(buildActions(it2, rebuild, p));
      mountIcons(mask);
    };
    mask.innerHTML = `<div class="bz-item-sheet">
      <div class="bz-item-sheet-head">${sheetHeadOf(it)}</div>
      <div class="bz-item-sheet-body">${sheetActsHtml(buildActions(it, rebuild, p))}</div>
    </div>`;
    mask.addEventListener('click', (e) => {
      if (e.target === mask) return closeMobSheet();
      const b = e.target.closest('.bz-item-sheet-item');
      if (!b) return;
      const acts = buildActions(itemById(it.id) || it, rebuild, p);
      const idx = [...mask.querySelectorAll('.bz-item-sheet-item')].indexOf(b);
      const a = acts[idx];
      if (!a) return;
      if (!a.keepOpen) closeMobSheet();
      a.onClick();
    });
    p.host.appendChild(mask);
    mountIcons(mask);
  }
  function closeMobSheet() { document.getElementById('mobHost').querySelector('.bz-item-sheet-mask')?.remove(); }

  /* ==================== 桌面右键菜单（core .bz-item-menu + 海报皮 bz-bel-menu 同构） ==================== */
  let menuEl = null;
  function closeMenu() { if (menuEl) { menuEl.remove(); menuEl = null; } }
  function openRowMenuAt(it, x, y, p) {
    closeMenu();
    const rebuild = () => {
      const it2 = itemById(it.id);
      if (it2) refreshMenu(it2, p);
    };
    const acts = buildActions(it, rebuild, p);
    menuEl = document.createElement('div');
    menuEl.className = 'bz-item-menu bz-bel-menu';
    menuEl.innerHTML = acts.map((a) =>
      `<button type="button" class="bz-item-menu-item${a.kind === 'danger' ? ' bz-item-menu-item--danger' : ''}"><span class="bz-item-menu-icon">${icon(a.icon)}</span><span class="bz-item-menu-label">${esc2(a.label)}</span></button>`).join('');
    menuEl.addEventListener('click', (e) => {
      const b = e.target.closest('.bz-item-menu-item');
      if (!b) return;
      const idx = [...menuEl.querySelectorAll('.bz-item-menu-item')].indexOf(b);
      const a = acts[idx];
      closeMenu();
      if (a) a.onClick();
    });
    document.body.appendChild(menuEl);
    mountIcons(menuEl);
    const r = menuEl.getBoundingClientRect();
    menuEl.style.left = Math.min(x, innerWidth - r.width - 8) + 'px';
    menuEl.style.top = Math.min(y, innerHeight - r.height - 8) + 'px';
  }
  function refreshMenu(it, p) { if (menuEl) { const r = menuEl.getBoundingClientRect(); openRowMenuAt(it, r.left, r.top, p); } }
  document.addEventListener('click', (e) => { if (menuEl && !menuEl.contains(e.target)) closeMenu(); });

  /* ==================== 详情弹窗（与 ui.ts openBelDetail 同构） ==================== */
  function closeBelDetail() { document.querySelector('.bz-bel-detail-mask')?.remove(); }
  function openBelDetail(it, p) {
    closeBelDetail();
    const mask = document.createElement('div');
    mask.className = 'bz-overlay-mask bz-bel-detail-mask';
    const gone = isExited(it);
    const key = statusKeyOf(it.current_status);
    mask.innerHTML = `<div class="bz-bel-detail">
    <div class="bz-bel-detail-head">
      <div class="bz-bel-detail-title">${esc2(it.name)}</div>
      <button class="bz-icon-btn" data-bd-close title="关闭">${icon(ICON.close)}</button>
    </div>
    <div class="bz-bel-detail-idrow">
      <span class="bz-bel-cell-em">${esc2(catEmoji(it.category))}</span>
      <div class="bz-bel-detail-idinfo">
        <div class="bz-bel-detail-cat">${esc2(it.category || '未分类')}</div>
        <div class="bz-bel-detail-desc">${esc2(it.description || '无备注')}</div>
      </div>
      <span class="bz-bel-tag bz-bel-tag--${key}">${icon(STATUS[key] ? STATUS[key].ic : 'box', 'bz-ic--sm')}${esc2(it.current_status)}</span>
    </div>
    <div class="bz-bel-detail-fields">
      <div class="bz-bel-dfield"><span>购买价</span><b>${money(Number(it.purchase_price) || 0)}</b></div>
      <div class="bz-bel-dfield"><span>购买日期</span><b>${esc2(String(it.purchase_date || '').slice(0, 10) || '—')} · ${daysUsed(it)} 天</b></div>
      <div class="bz-bel-dfield"><span>日均成本</span><b>￥${dailyCostOf(it).toFixed(2)}${gone ? '（已封口）' : '/天 · 越用越便宜'}</b></div>
      ${gone ? `<div class="bz-bel-dfield"><span>出离日期</span><b>${esc2(it.exit_date || '—')}${it.current_status === '已转卖' && Number(it.sold_price) > 0 ? ' · 售出 ' + money(Number(it.sold_price)) : ''}</b></div>` : ''}
      <div class="bz-bel-dfield"><span>录入 / 更新</span><b>${esc2(String(it.created_date || '').slice(0, 10))} / ${esc2(String(it.last_updated || '').slice(0, 10))}</b></div>
    </div>
    <div class="bz-bel-detail-acts" data-bd-acts></div>
    <div class="bz-btn-row bz-bel-detail-btns">
      <div class="bz-bel-form-spacer"></div>
      <button type="button" class="bz-btn bz-btn--ghost" data-bd-edit>${icon('pencil', 'bz-ic--sm')} 编辑</button>
      <button type="button" class="bz-btn bz-btn--primary bz-bel-delbtn" data-bd-del>${icon(ICON.del, 'bz-ic--sm')} 删除</button>
    </div>
  </div>`;
    (p && p.mobile ? p.host : document.body).appendChild(mask);
    mountIcons(mask);

    const acts = mask.querySelector('[data-bd-acts]');
    const drawActs = () => {
      const cur = itemById(it.id);
      if (!cur) return;
      acts.innerHTML = STATUS_LABELS.map((s) =>
        `<button type="button" class="bz-bel-flowbtn${s === cur.current_status ? ' is-cur' : ''}${s === '闲置' ? ' bz-bel-c2' : ''}" data-bd-flow="${esc2(s)}">${esc2(s)}</button>`).join('');
    };
    drawActs();
    acts.addEventListener('click', (e) => {
      const b = e.target.closest('[data-bd-flow]');
      if (!b) return;
      const cur = itemById(it.id);
      if (!cur) { closeBelDetail(); return; }
      applyFlowWithUndo(cur, b.dataset.bdFlow).then(() => {
        const now = itemById(it.id);
        if (!now) { closeBelDetail(); return; }
        drawActs();
        openBelDetail(now, p); // 详情头行字段同步（状态徽章/出离行随流转刷新）
      });
    });
    mask.addEventListener('mousedown', (e) => { if (e.target === mask) closeBelDetail(); });
    mask.querySelector('[data-bd-close]').addEventListener('click', closeBelDetail);
    mask.querySelector('[data-bd-edit]').addEventListener('click', () => {
      const cur = itemById(it.id);
      if (cur) openForm(cur, p);
    });
    mask.querySelector('[data-bd-del]').addEventListener('click', () => {
      const cur = itemById(it.id);
      if (cur) deleteItem(cur, p);
    });
  }

  /* ==================== 表单（与 ui.ts openForm 同构：字段/校验/出离行/联想） ==================== */
  function openForm(it, p) {
    const editing = !!it;
    const mask = document.createElement('div');
    mask.className = 'bz-overlay-mask bz-bel-form-mask';
    const priceVal = it ? String(it.purchase_price ?? '') : '';
    const dateVal = it ? String(it.purchase_date || '').slice(0, 10) : todayStr();
    const catVal = it ? (it.category ?? '') : ''; // 新记不回填默认分类（issue 202）
    const descVal = it ? (it.description ?? '') : '';
    const exitDateVal = it && it.exit_date ? String(it.exit_date).slice(0, 10) : todayStr();
    const soldPriceVal = it && it.sold_price != null && Number.isFinite(Number(it.sold_price)) ? String(it.sold_price) : '';
    const exitedInit = !!it && isExited(it);
    mask.innerHTML = `
  <div class="bz-bel-form">
    <div class="bz-bel-form-title">${editing ? '编辑物品' : '记一笔'}</div>
    <div class="bz-bel-form-body">
      <div class="bz-field"><span class="bz-field-label">名称</span><input class="bz-input" id="bm-name" value="${esc2(it ? it.name : '')}" placeholder="如：iPhone 15 Pro"></div>
      <div class="bz-field"><span class="bz-field-label">分类</span><input class="bz-input" id="bm-cat" value="${esc2(catVal)}" placeholder="输入或选择分类" autocomplete="off"></div>
      <div class="bz-bel-form-row">
        <div class="bz-field"><span class="bz-field-label">购买价格（元）</span><input class="bz-input" id="bm-price" type="number" min="0" step="0.01" value="${esc2(priceVal)}" placeholder="0.00"></div>
        <div class="bz-field"><span class="bz-field-label">购买日期</span><input class="bz-input" id="bm-date" type="date" value="${esc2(dateVal)}"></div>
      </div>
      <div class="bz-field"><span class="bz-field-label">状态</span><span class="bz-bel-statuspick" id="bm-status"></span></div>
      <div class="bz-bel-form-row" id="bm-exit"${exitedInit ? '' : ' hidden'}>
        <div class="bz-field"><span class="bz-field-label">出离日期</span><input class="bz-input" id="bm-exitdate" type="date" value="${esc2(exitDateVal)}"></div>
        <div class="bz-field" id="bm-soldfield"${it && it.current_status === '已转卖' ? '' : ' hidden'}><span class="bz-field-label">转卖售价（可选）</span><input class="bz-input" id="bm-soldprice" type="number" min="0" step="0.01" value="${esc2(soldPriceVal)}" placeholder="留空不记售价"></div>
      </div>
      <div class="bz-field"><span class="bz-field-label">描述（可选）</span><textarea class="bz-input" id="bm-desc" placeholder="规格、颜色、购买原因等…">${esc2(descVal)}</textarea></div>
      <div class="bz-bel-form-err" id="bm-err"></div>
      <div class="bz-btn-row bz-bel-form-actions">
        <div class="bz-bel-form-spacer"></div>
        <button type="button" class="bz-btn bz-btn--ghost" data-bm-cancel>取消</button>
        <button type="button" class="bz-btn bz-btn--primary" id="bm-save">${editing ? '更新' : '保存'}</button>
      </div>
    </div>
  </div>`;
    (p && p.mobile ? p.host : document.body).appendChild(mask);
    mountIcons(mask);

    // 分类联想（与 core uiSuggest 同语义：聚焦/输入惰性弹出、子串过滤、外点收起、Esc 只收下拉）
    const catInput = mask.querySelector('#bm-cat');
    let layer = null, skipNextOpen = false;
    const closeSug = () => { if (layer) { layer.remove(); layer = null; document.removeEventListener('mousedown', onDocDown, true); } };
    const onDocDown = (e) => {
      if (!catInput.isConnected) { closeSug(); return; }
      if (layer && (layer.contains(e.target) || catInput.contains(e.target))) return;
      closeSug();
    };
    const drawSug = () => {
      if (!layer) return;
      const cur = catInput.value.trim();
      const q = cur.toLowerCase();
      const matched = BLG.CATS.filter((s) => (!q || s.toLowerCase().includes(q))).slice(0, 60);
      if (!matched.length) { closeSug(); return; }
      layer.replaceChildren();
      matched.forEach((raw) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'bz-popover-item' + (raw === cur ? ' is-on' : '');
        b.setAttribute('role', 'option');
        b.innerHTML = `<span class="bz-suggest-ic">${esc2(catEmoji(raw))}</span><span>${esc2(catNameOf(raw))}</span>`;
        b.addEventListener('click', () => {
          catInput.value = raw;
          closeSug();
          if (document.activeElement !== catInput) { skipNextOpen = true; catInput.focus(); }
        });
        layer.appendChild(b);
      });
    };
    const openSug = () => {
      if (skipNextOpen) { skipNextOpen = false; return; }
      if (layer) { drawSug(); return; }
      layer = document.createElement('div');
      layer.className = 'bz-popover';
      layer.setAttribute('role', 'listbox');
      (catInput.parentElement || catInput).appendChild(layer);
      document.addEventListener('mousedown', onDocDown, true);
      drawSug();
    };
    catInput.addEventListener('focus', openSug);
    catInput.addEventListener('input', openSug);
    catInput.addEventListener('keydown', (e) => { if (e.key === 'Escape' && layer) { e.stopPropagation(); closeSug(); } });

    // 状态单选（p20 .choice 平铺四格 + 闲置 c2）+ 出离行联动（ADR-0089）
    const statusPick = mask.querySelector('#bm-status');
    const exitRow = mask.querySelector('#bm-exit');
    const soldField = mask.querySelector('#bm-soldfield');
    let curStatus = it ? it.current_status || '使用中' : '使用中';
    const syncExitRow = () => {
      const exited = curStatus === '已转卖' || curStatus === '已丢弃';
      exitRow.hidden = !exited;
      soldField.hidden = curStatus !== '已转卖';
    };
    const drawStatus = () => {
      statusPick.innerHTML = STATUS_LABELS.map((s) =>
        `<button type="button" class="bz-choice-btn${s === curStatus ? ' is-on' : ''}${s === '闲置' ? ' bz-bel-c2' : ''}" data-status="${esc2(s)}">${icon(STATUS[statusKeyOf(s)].ic, 'bz-ic--sm')}${esc2(s)}</button>`).join('');
      mountIcons(statusPick);
      statusPick.querySelectorAll('[data-status]').forEach((b) => b.addEventListener('click', () => {
        curStatus = b.dataset.status;
        drawStatus();
      }));
      syncExitRow();
    };
    drawStatus();

    const errEl = mask.querySelector('#bm-err');
    const fail = (msg) => { errEl.textContent = msg; };
    const saveBtn = mask.querySelector('#bm-save');
    let saving = false;
    const requestClose = () => mask.remove(); // 评审壳省 confirmDiscard（插件走 core）
    mask.addEventListener('mousedown', (e) => { if (e.target === mask) requestClose(); });
    mask.querySelector('[data-bm-cancel]').addEventListener('click', requestClose);
    saveBtn.addEventListener('click', () => {
      if (saving) return;
      const name = mask.querySelector('#bm-name').value.trim();
      const price = parseFloat(mask.querySelector('#bm-price').value);
      const date = mask.querySelector('#bm-date').value;
      if (!name) { fail('请输入物品名称'); return; }
      if (isNaN(price) || price < 0) { fail('请输入有效的价格'); return; }
      if (!date) { fail('请选择购买日期'); return; }
      const category = catInput.value.trim();
      if (!category) { fail('请选择或输入分类'); return; }
      const exited = curStatus === '已转卖' || curStatus === '已丢弃';
      const exitVal = exited ? mask.querySelector('#bm-exitdate').value : '';
      const soldRaw = curStatus === '已转卖' ? mask.querySelector('#bm-soldprice').value.trim() : '';
      let soldPrice = null;
      if (soldRaw !== '') {
        const sp = parseFloat(soldRaw);
        if (isNaN(sp) || sp < 0) { fail('请输入有效的售价'); return; }
        soldPrice = Math.round(sp * 100) / 100;
      }
      const desc = mask.querySelector('#bm-desc').value.trim();
      saving = true;
      saveBtn.disabled = true;
      saveBtn.textContent = '保存中…';
      setTimeout(() => {
        if (editing) {
          const cur = itemById(it.id);
          if (!cur) { toast('该物品已被外部变更删除，本次保存未写入'); mask.remove(); return; }
          cur.name = name;
          cur.category = category;
          cur.purchase_price = Math.round(price * 100) / 100;
          cur.purchase_date = date;
          cur.current_status = curStatus;
          cur.description = desc;
          if (exited) cur.exit_date = exitVal || todayStr();
          else if (cur.exit_date != null) cur.exit_date = null;
          if (curStatus === '已转卖') cur.sold_price = soldPrice;
          else if (cur.sold_price != null) cur.sold_price = null;
          cur.last_updated = new Date().toISOString();
          toast(`物品「${name}」已更新`);
        } else {
          const nowIso = new Date().toISOString();
          items.push({
            id: 'item_' + Date.now(), name, category,
            purchase_price: Math.round(price * 100) / 100, purchase_date: date,
            current_status: curStatus, description: desc,
            created_date: nowIso, last_updated: nowIso,
            ...(exited ? { exit_date: exitVal || todayStr() } : {}),
            ...(curStatus === '已转卖' ? { sold_price: soldPrice } : {}),
          });
          toast(`物品「${name}」已添加`);
        }
        save(); renderAll(); mask.remove();
      }, 60);
    });
    setTimeout(() => mask.querySelector('#bm-name').focus(), 100);
  }

  /* ==================== 确认框 / toast（插件侧走 core flow-dialog/notice，演示壳自绘） ==================== */
  function confirmDlg(title, msg, okLabel, onOk) {
    const mask = document.createElement('div');
    mask.className = 'bz-overlay-mask';
    mask.style.zIndex = 950;
    mask.innerHTML = `<div class="bz-bel-form" style="width:340px">
      <div class="bz-bel-form-title" style="font-size:16px;border-width:2px;padding-bottom:8px">${esc2(title)}</div>
      <p style="font-size:13px;line-height:1.8;color:var(--bz-text-2);margin:14px 0 4px">${esc2(msg)}</p>
      <div class="bz-btn-row bz-bel-form-actions" style="margin-top:12px"><div class="bz-bel-form-spacer"></div>
      <button type="button" class="bz-btn bz-btn--ghost" data-a="c">取消</button>
      <button type="button" class="bz-btn bz-btn--primary bz-bel-delbtn" data-a="ok">${esc2(okLabel)}</button></div></div>`;
    const done = () => mask.remove();
    mask.addEventListener('click', (e) => {
      if (e.target === mask || e.target.closest('[data-a="c"]')) return done();
      if (e.target.closest('[data-a="ok"]')) { done(); onOk(); }
    });
    document.body.appendChild(mask);
  }
  let toastEl = null, toastTimer = 0;
  function toast(msg, undoLabel, onUndo) {
    if (toastEl) toastEl.remove();
    clearTimeout(toastTimer);
    toastEl = document.createElement('div');
    toastEl.style.cssText = 'position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:960;display:flex;align-items:center;gap:14px;background:#171512;color:#f0ece4;font-size:12.5px;padding:10px 16px;box-shadow:4px 4px 0 rgba(23,21,18,.3)';
    toastEl.innerHTML = `<span>${esc2(msg)}</span>` + (undoLabel ? `<button style="border:none;background:none;color:#e8481f;font:700 12.5px 'Microsoft YaHei';cursor:pointer">${esc2(undoLabel)}</button>` : '');
    if (undoLabel) toastEl.querySelector('button').onclick = () => { toastEl.remove(); toastEl = null; onUndo(); };
    document.body.appendChild(toastEl);
    toastTimer = setTimeout(() => { if (toastEl) { toastEl.remove(); toastEl = null; } }, 5000);
  }

  /* ==================== Esc 分层（详情 → 表单 → 抽屉 → 菜单 → 联想） ==================== */
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (menuEl) return closeMenu();
    if (document.querySelector('.bz-bel-detail-mask')) return closeBelDetail();
    const fm = document.querySelector('.bz-bel-form-mask');
    if (fm) return fm.remove();
    const sm = document.querySelector('.bz-item-sheet-mask');
    if (sm) return sm.remove();
  });

  /* ==================== 启动 ==================== */
  buildPanel(document.getElementById('dtHost'), false);
  buildPanel(document.getElementById('mobHost'), true);
  const mobHost = document.getElementById('mobHost');
  const mobBtn = document.getElementById('mobToggle');
  function syncMobBtn() { mobBtn.textContent = mobHost.style.display === 'none' ? '显示移动端' : '隐藏移动端'; }
  mobBtn.onclick = () => {
    mobHost.style.display = mobHost.style.display === 'none' ? '' : 'none';
    syncMobBtn();
  };
  document.getElementById('reset').onclick = () => {
    confirmDlg('重置演示数据', '丢弃本地修改，还原为真实库数据（65 件）？', '还原', () => {
      try { localStorage.removeItem(LS); } catch (e) { }
      items = BLG.ITEMS.map((x) => ({ ...x }));
      M.status = null; M.year = ''; M.q = ''; M.sort = 'recent';
      renderAll();
      toast('已还原为真实数据');
    });
  };
  renderAll();

  /* ==================== 演示钩子（?demo=idle/detail/form/menu/mobsheet） ==================== */
  if (location.search.includes('demo=')) {
    const d = location.search.split('demo=')[1].split('&')[0];
    setTimeout(() => {
      if (d === 'idle') document.querySelector('#dtHost [data-bel-st="idle"]').click();
      if (d === 'detail') document.querySelector('#dtHost [data-bel-id]').click();
      if (d === 'form') document.querySelector('#dtHost [data-bel-add]').click();
      if (d === 'menu') {
        const c = document.querySelector('#dtHost [data-bel-id]');
        const r = c.getBoundingClientRect();
        c.dispatchEvent(new MouseEvent('contextmenu', { clientX: r.left + 60, clientY: r.top + 80, bubbles: true, cancelable: true }));
      }
      if (d === 'mobsheet') document.querySelector('#mobHost [data-bel-id]').click();
    }, 120);
  }

  /* ==================== 自检（?selftest=1） ==================== */
  if (location.search.includes('selftest')) {
    window.__st = { pass: 0, fail: [] };
    const t = (name, cond) => cond ? window.__st.pass++ : window.__st.fail.push(name);
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    const dtCells = () => document.querySelectorAll('#dtHost .bz-bel-cell').length;
    (async () => {
      try {
        t('初始65件', items.length === 65);
        t('网格65行', dtCells() === 65);
        t('KPI在库', document.querySelector('#dtHost [data-bel-kpis] .bz-bel-kpi--hero b').textContent === String(stockCount()));
        t('总投入≈71706', Math.abs(totalAssets() - 71706.48) < 1);
        t('无页脚残留', !document.querySelector('.bz-bel-foot, [data-bel-footnote], .bz-bel-mobsort'));

        document.querySelector('#dtHost [data-bel-st="idle"]').click();
        t('闲置筛选7', dtCells() === 7);
        t('标题=闲置', document.querySelector('#dtHost [data-bel-herotitle]').textContent === '闲置');
        document.querySelector('#dtHost [data-bel-st="idle"]').click();
        t('再点回全部', dtCells() === 65);

        const q = document.querySelector('#dtHost [data-bel-search]');
        q.value = '松下'; q.dispatchEvent(new Event('input'));
        await sleep(260);
        t('搜索松下6', dtCells() === 6);
        q.value = ''; q.dispatchEvent(new Event('input'));
        await sleep(260);

        document.querySelector('#dtHost [data-k="price"]').click();
        t('投入排序首位=松下s5', document.querySelector('#dtHost .bz-bel-name').textContent === '松下s5');
        document.querySelector('#dtHost [data-k="recent"]').click();

        t('chips 无图标', document.querySelectorAll('#dtHost [data-bel-chips] .bz-chip i, #dtHost [data-bel-chips] .bz-chip svg').length === 0);
        t('移动chips五枚无资产', document.querySelectorAll('#mobHost [data-bel-mobstatus] .bz-mobstrip-chip').length === 5 && !document.querySelector('#mobHost [data-bel-mobstatus] [data-bel-st="asset"]'));
        t('移动排序下拉3项', document.querySelectorAll('#mobHost [data-bel-mobsortsel] option').length === 3 && document.querySelector('#mobHost [data-bel-mobsortsel]').value === 'recent');
        t('使用中徽章图标=check-circle', !!document.querySelector('#dtHost .bz-bel-tag--using i[data-lucide="check-circle"]'));

        document.querySelector('#dtHost [data-bel-add]').click();
        await sleep(60);
        document.querySelector('#bm-name').value = '测试物品';
        document.querySelector('#bm-cat').value = '💡 落地灯';
        document.querySelector('#bm-price').value = '100';
        document.querySelector('#bm-save').click();
        await sleep(120);
        t('新增后66件', items.length === 66 && dtCells() === 66);
        const nu = items.find((i) => i.name === '测试物品');
        t('新增在首位(最近)', filtered()[0].name === '测试物品');

        document.querySelector(`#dtHost [data-bel-id="${nu.id}"]`).dispatchEvent(new MouseEvent('contextmenu', { clientX: 300, clientY: 300, bubbles: true, cancelable: true }));
        t('右键菜单开', !!document.querySelector('.bz-item-menu.bz-bel-menu'));
        [...document.querySelectorAll('.bz-item-menu .bz-item-menu-item')].find((b) => b.textContent.includes('闲置')).click();
        await sleep(60);
        t('流转闲置生效', nu.current_status === '闲置');
        t('闲置数=8', items.filter((i) => i.current_status === '闲置').length === 8);

        document.querySelector(`#dtHost [data-bel-id="${nu.id}"]`).click();
        await sleep(60);
        t('详情开', !!document.querySelector('.bz-bel-detail-mask'));
        t('详情流转条4档', document.querySelectorAll('.bz-bel-flowbtn').length === 4);
        document.querySelector('.bz-bel-detail-mask [data-bd-close]').click();
        await sleep(30);
        t('详情关', !document.querySelector('.bz-bel-detail-mask'));

        document.querySelector(`#dtHost [data-bel-id="${nu.id}"]`).dispatchEvent(new MouseEvent('contextmenu', { clientX: 300, clientY: 300, bubbles: true, cancelable: true }));
        [...document.querySelectorAll('.bz-item-menu .bz-item-menu-item')].find((b) => b.textContent.includes('删除')).click();
        await sleep(30);
        document.querySelector('.bz-overlay-mask [data-a="ok"]').click();
        await sleep(60);
        t('删除后65件', items.length === 65);
        toastEl.querySelector('button').click();
        await sleep(60);
        t('撤销后66件', items.length === 66);
        items = items.filter((i) => i.name !== '测试物品'); save(); renderAll();

        document.querySelector('#mobHost [data-bel-id]').click();
        await sleep(60);
        t('移动抽屉开', !!document.querySelector('.bz-item-sheet-mask'));
        document.querySelector('.bz-item-sheet-mask').click();
        await sleep(30);
        t('移动抽屉关', !document.querySelector('.bz-item-sheet-mask'));
        t('移动记一笔存在', !!document.querySelector('#mobHost .bz-bel-mobadd'));

        document.title = window.__st.fail.length
          ? 'SELFTEST FAIL ' + window.__st.fail.join(',')
          : `SELFTEST OK ${window.__st.pass}/${window.__st.pass + window.__st.fail.length}`;
      } catch (err) { document.title = 'SELFTEST ERR ' + (err && err.message || err); }
    })();
  }
})();
</script>
</body>
</html>
