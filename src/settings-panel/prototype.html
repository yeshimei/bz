<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>设置面板 · 原型预览（真行为单源）</title>
<!--
  ┌────────────────────────────────────────────────────────────────────────┐
  │ 本文件 = 设置面板域 UI 的评审壳（行为单源版，issue 245/ADR-0106，          │
  │ 范式随 belongings 试点；2026-09-07 拍板推翻 4b068bb「原型 app.js 为真理」  │
  │ 方向——行为唯一真理 = 域 ui.ts，本壳退化为双 iframe 评审壳，                │
  │ prototype.app.js / prototype-data.js 退役删除）。                         │
  │ 组件样式零内联，全部来自（与 build-css SOURCES 同序）：                    │
  │   ../core/styles.css → ../core/ui/tokens.css → ../core/ui/components.css │
  │   → ./styles.css                                                        │
  │ 行为单源：交互逻辑全部是插件同款 ui.ts / renderer.ts / dir-picker.ts        │
  │   依赖链——经 ./prototype-behavior.js（src/settings-panel/fake-sim.ts       │
  │   构建，alias obsidian→公共假层）在下方两个 iframe 视图里跑真行为；          │
  │   桌面 iframe 1120px 宽视口 = 桌面 B 侧栏工作台（本体 min(1080px,94vw)）；  │
  │   移动 iframe 396px = M1 命令面板 + 域设置弹窗（fake Platform ≤768 判定）。 │
  │ 数据 = schema 全真（ui.ts schemaLoaders 调各域真实 xxxSettingsSchema()）；  │
  │   设置 = localStorage 内存单例（fake-sim 注入，键直绑改动可持久）；          │
  │   vault 目录面 = localStorage 种子树（dir-picker 真聚合 + adapter 补齐）。  │
  │ 壳内只允许：外景容器样式、评审徽牌、重置与自检。                            │
  └────────────────────────────────────────────────────────────────────────┘
-->
<link rel="stylesheet" href="../core/styles.css">
<link rel="stylesheet" href="../core/ui/tokens.css">
<link rel="stylesheet" href="../core/ui/components.css">
<link rel="stylesheet" href="./styles.css">
<style>
  /* ===== 以下全部是演示壳，禁止放组件样式 ===== */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; gap: 28px; padding: 32px 24px;
    background: #e3e0d8; font-family: system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif; }
  /* 模拟 Obsidian 宿主变量（core/styles.css 的弹层/通知取值用；插件内由主题提供） */
  body {
    --background-primary: #fbf9f3; --text-normal: #171512; --text-muted: #8b8474; --text-faint: #b3ab99;
    --text-error: #b3564d; --background-modifier-hover: rgba(23,21,18,.06); --color-green: #3d8f5d;
  }
  * { scrollbar-width: none; } *::-webkit-scrollbar { display: none; }

  /* 桌面外景（真行为 iframe：面板 append iframe body，本体 min(1080px,94vw) 来自 styles.css） */
  .demo-dt { flex: none; width: 1120px; height: 720px; }
  /* 移动外景：396px iframe → M1 命令面板真全屏态即手机框尺寸 */
  .demo-mob { width: 396px; height: 780px; border-radius: 26px; overflow: hidden; flex: none;
    border: 1px solid #d8d1c0; box-shadow: 0 8px 30px rgba(0,0,0,.14); background: #f5f2ec; }
  .demo-frame { width: 100%; height: 100%; border: 0; display: block; }

  /* 评审徽牌（演示壳自用） */
  .vbadge { position: fixed; right: 16px; bottom: 12px; font-size: 11px; color: #9a917d; display: flex; gap: 10px; align-items: center;
    background: rgba(255,255,255,.9); border: 1px solid #d8d1c0; padding: 3px 8px; z-index: 900; }
  .vbadge button { border: none; background: none; color: #b3564d; font: 11px 'Microsoft YaHei'; cursor: pointer; }
  .vbadge .ok { color: #3d8f5d; }
  .vbadge .bad { color: #b3564d; }
</style>
</head>
<body class="theme-light"> <!-- 模拟 Obsidian 宿主：色彩 token 挂 theme-light/dark，壳内必须补一类才不透明 -->
  <div id="dtHost" class="demo-dt"><iframe class="demo-frame" src="./prototype-view.html" title="设置面板·桌面"></iframe></div>
  <div id="mobHost" class="demo-mob"><iframe class="demo-frame" src="./prototype-view.html?mob=1" title="设置面板·移动"></iframe></div>

  <div class="vbadge">设置面板 · 真行为单源预览（桌面=真 ui.ts 跑在 1120px，移动=396px M1 命令面板）
    <button id="mobToggle">隐藏移动端</button>
    <button id="reset">重置演示数据</button>
    <span id="stResult"></span>
  </div>

<script src="./prototype-icons.js"></script>
<script>
(function () {
  /* ==================== 壳基座（仅外景）：两个真行为 iframe + 重置 ====================
   * 行为全部在 iframe 内跑真 ui.ts（prototype-behavior.js）；本页只做：
   *  - 重置演示数据（清 bz-sim:* 后重载 iframe——设置单例/vault 种子由 fake-sim 重播）
   *  - 自检（?selftest=1）：经 iframe contentWindow 访问真 DOM
   */
  const SIM_SETTINGS_KEY = 'bz-sim:bz-settings.json';
  const clearSim = () => {
    const doomed = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith('bz-sim:')) doomed.push(k);
    }
    doomed.forEach((k) => localStorage.removeItem(k));
  };

  const dtFrame = () => document.querySelector('#dtHost iframe');
  const mobFrame = () => document.querySelector('#mobHost iframe');
  const dtDoc = () => dtFrame().contentDocument;
  const mobDoc = () => mobFrame().contentDocument;
  // 轮询现取 contentDocument：iframe 加载前后 document 引用会替换（about:blank → 真实文档），
  // 不能缓存旧引用等面板——每次现查，跨文档访问本身同源安全。
  const waitFrame = (getDoc, sel) => new Promise((res, rej) => {
    const started = Date.now();
    const tries = () => {
      try {
        const doc = getDoc();
        if (doc && doc.querySelector(sel)) return res(doc);
        if (Date.now() - started > 25000) return rej(new Error('iframe 面板超时'));
        setTimeout(tries, 150);
      } catch (e) { setTimeout(tries, 150); }
    };
    tries();
  });

  document.querySelector('#mobToggle').addEventListener('click', () => {
    const m = document.querySelector('#mobHost');
    const hidden = m.style.display === 'none';
    m.style.display = hidden ? '' : 'none';
    document.querySelector('#mobToggle').textContent = hidden ? '隐藏移动端' : '显示移动端';
  });

  document.querySelector('#reset').addEventListener('click', () => {
    clearSim();
    location.reload();
  });

  /* ==================== 自检（?selftest=1）：真行为 DOM 断言（经 iframe） ==================== */
  if (location.search.includes('selftest')) {
    window.__st = { pass: 0, fail: [] };
    const t = (name, cond) => cond ? window.__st.pass++ : window.__st.fail.push(name);
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    /** 轮询断言面出现（防异步渲染时序脆断）：ok() 返回真值即通过 */
    const waitFor = (ok, ms = 6000) => new Promise((res) => {
      const started = Date.now();
      const tries = () => {
        let v = null;
        try { v = ok(); } catch { v = null; }
        if (v) return res(v);
        if (Date.now() - started > ms) return res(null);
        setTimeout(tries, 100);
      };
      tries();
    });
    (async () => {
      const res = document.querySelector('#stResult');
      try {
        // 基线检查：自检会改设置（diarySkin/diaryDirectory/cinemaSortMode/belongingsMobileDefaultFullscreen）。
        // 残留上次运行（键在）则清 bz-sim:* 重载一次。headless 全新 profile 天然干净；
        // 浏览器手动重复跑 selftest 也能自清理（壳可重复）。
        const dirtyKeys = ['diarySkin', 'diaryDirectory', 'cinemaSortMode', 'belongingsMobileDefaultFullscreen'];
        let base = {};
        try { base = JSON.parse(localStorage.getItem(SIM_SETTINGS_KEY) || '{}'); } catch { base = {}; }
        if (dirtyKeys.some((k) => k in base)) {
          if (!location.search.includes('reset=1')) {
            clearSim();
            location.search = '?selftest=1&reset=1';
            return;
          }
        }
        const dd = await waitFrame(dtDoc, '.bz-sp-desk');
        const md = await waitFrame(mobDoc, '.bz-sp-mobile');
        res.textContent = '…';
        const dt = (sel) => dd.querySelector(sel);
        const mob = (sel) => md.querySelector(sel);
        const sim = () => dtFrame().contentWindow.BZW_settings_panel.__simSettings();
        // 移动 iframe 是独立 JS realm：自己的设置内存单例（经 localStorage 持久层与桌面同源共享）
        const simMob = () => mobFrame().contentWindow.BZW_settings_panel.__simSettings();
        const dtAll = (sel) => [...dd.querySelectorAll(sel)];
        const mobAll = (sel) => [...md.querySelectorAll(sel)];
        const badgeOf = (id) => dt(`.bz-sp-nav-item[data-sp-domain="${id}"] .bz-sp-nav-count`)?.textContent || '';
        const waitPaneGroups = (min) => waitFor(() => {
          const gs = dtAll('.bz-sp-pane .bz-sp-group');
          return gs.length >= min ? gs : null;
        });

        /* ---------- CSS 生效（壳四链防 404 再犯）：外链表已加载、规则非空、域样式真命中 ---------- */
        const sheetsOf = (doc) => [...doc.styleSheets].filter((s) => s.href).length;
        const rulesOf = (doc) => [...doc.styleSheets].reduce((n, s) => { try { return n + s.cssRules.length; } catch { return n; } }, 0);
        t('桌面CSS外链≥4', sheetsOf(dd) >= 4);
        t('桌面CSS规则非空', rulesOf(dd) > 50);
        t('桌面面板底色非透明（域 tokens 命中）', getComputedStyle(dt('.bz-sp-desk')).backgroundColor !== 'rgba(0, 0, 0, 0)');
        t('移动CSS外链≥4', sheetsOf(md) >= 4);
        t('移动CSS规则非空', rulesOf(md) > 50);
        t('移动面板底色非透明', getComputedStyle(mob('.bz-sp-mobile')).backgroundColor !== 'rgba(0, 0, 0, 0)');

        /* ---------- 桌面：壳结构 + 徽标（schema 预载回填）+ 默认域 ---------- */
        t('桌面面板开', !!dt('#bz-settings-panel-popup.bz-sp-desk'));
        t('桌面导航域≥16', dtAll('.bz-sp-nav-item').length >= 16);
        t('导航图标兑现（fake setIcon SVG）', !!dt('.bz-sp-nav-item .bz-sp-nav-ic svg'));
        t('头行搜索框在场', !!dt('.bz-sp-search .bz-input'));
        await waitFor(() => badgeOf('global') !== '·' && badgeOf('global') !== '');
        t('通用徽标=1', badgeOf('global') === '1');
        t('设置徽标=2（外观独立域）', badgeOf('appearance') === '2');
        // AI=9：4 常显（服务商/模型名称/上下文/最大输出）+ deepseek 密钥行（seed aiProvider=deepseek，
        // visibleWhen 门控放行）+ 采样参数组 4
        t('AI徽标=9（含 seed deepseek 密钥行门控放行）', badgeOf('ai') === '9');
        t('归物本徽标=3（移动端组桌面门控不计）', badgeOf('belongings') === '3');
        t('默认域=通用（数据存储路径组）', await waitFor(() => dt('.bz-sp-pane .bz-sp-group-name')?.textContent === '数据存储路径') !== null);
        t('通用路径行选择按钮（自绘 bz-sp-btn）', !!dt('.bz-sp-pane .bz-sp-path-btn.bz-sp-btn'));

        /* ---------- 桌面：搜索过滤域导航 ---------- */
        const searchIn = dt('.bz-sp-search .bz-input');
        searchIn.value = '番茄';
        searchIn.dispatchEvent(new Event('input', { bubbles: true }));
        t('搜索过滤域导航', dtAll('.bz-sp-nav-item').length === 1 && dt('.bz-sp-nav-item').textContent.includes('番茄钟'));
        searchIn.value = '';
        searchIn.dispatchEvent(new Event('input', { bubbles: true }));

        /* ---------- 桌面：「设置」域外观组（经纬/晨昏 各一卡） ---------- */
        dt('.bz-sp-nav-item[data-sp-domain="appearance"]').click();
        await waitPaneGroups(1);
        const apPicks = () => dtAll('.bz-sp-pane .bz-sp-cardpick');
        await waitFor(() => apPicks().length === 2 && apPicks()[0].querySelectorAll('.bz-sp-cardpick-card').length === 1);
        t('设置域外观组两卡组', apPicks().length === 2);
        t('布局卡=经纬', apPicks()[0].textContent.includes('经纬'));
        t('主题卡=晨昏', apPicks()[1].textContent.includes('晨昏'));
        t('空值回退首卡选中', apPicks()[0].querySelector('.bz-sp-cardpick-card').classList.contains('is-on') &&
          apPicks()[1].querySelector('.bz-sp-cardpick-card').classList.contains('is-on'));

        /* ---------- 桌面：日记本——choiceCards 联动过滤 + 键直绑 + dir-picker 真聚合 ---------- */
        dt('.bz-sp-nav-item[data-sp-domain="diary"]').click();
        await waitPaneGroups(3);
        const diaryPicks = () => dtAll('.bz-sp-pane .bz-sp-cardpick');
        await waitFor(() => diaryPicks().length === 2);
        t('日记主题卡被布局联动过滤为空（diarySkin 未设）', diaryPicks()[1].querySelectorAll('.bz-sp-cardpick-card').length === 0);
        diaryPicks()[0].querySelector('.bz-sp-cardpick-card').click();
        t('布局卡键直绑落内存设置（diarySkin=default）', sim().diarySkin === 'default');
        // choiceCards 不热重渲（真行为口径）：切走再切回，联动过滤放行主题单卡
        dt('.bz-sp-nav-item[data-sp-domain="ai"]').click();
        dt('.bz-sp-nav-item[data-sp-domain="diary"]').click();
        await waitPaneGroups(3);
        await waitFor(() => diaryPicks().length === 2 && diaryPicks()[1].querySelectorAll('.bz-sp-cardpick-card').length === 1);
        t('布局落盘后主题行单卡（象牙白放行）', diaryPicks()[1].querySelector('.bz-sp-cardpick-card')?.textContent.includes('象牙白') === true);

        // dir-picker：日记目录 → 打开（先快速首渲染后 adapter 补齐）
        const diaryRow = () => dtAll('.bz-sp-pane .bz-sp-set-row').find((r) => r.querySelector('.bz-sp-set-name')?.textContent === '日记目录');
        await waitFor(() => diaryRow());
        diaryRow().querySelector('.bz-sp-path-btn').click();
        const pickerRows = () => dtAll('.bz-sp-picker-mask .bz-sp-picker-row');
        await waitFor(() => dt('.bz-sp-picker-mask'));
        t('dir-picker 打开（挂 body 弹层）', !!dt('.bz-sp-picker-mask .bz-sp-picker'));
        t('dir-picker 空选面包屑（未设置）', dt('.bz-sp-picker-crumb')?.textContent.includes('未设置') === true);
        await waitFor(() => pickerRows().length >= 10 && pickerRows().some((r) => r.textContent.includes('信件')));
        t('dir-picker 降级聚合目录（库根+文件父目录+adapter 补齐）',
          pickerRows().length >= 10 && pickerRows().some((r) => r.textContent.includes('（库根目录）')) &&
          pickerRows().some((r) => r.textContent.includes('信件')) &&
          pickerRows().some((r) => r.textContent.includes('.ENCRYPT')));
        pickerRows().find((r) => r.textContent.includes('日记') && r.textContent.includes('我的 /')).click();
        t('dir-picker 点选高亮+面包屑跟随', dt('.bz-sp-picker-crumb').textContent.includes('我的') && dt('.bz-sp-picker-crumb').textContent.includes('日记'));
        dt('.bz-sp-picker-mask .bz-sp-picker-foot .bz-sp-btn--primary').click();
        await waitFor(() => diaryRow().querySelector('.bz-sp-chip'));
        t('dir-picker 选用落 chip', diaryRow().querySelector('.bz-sp-chip')?.textContent === '我的/日记');
        t('路径键直绑落内存设置（diaryDirectory）', sim().diaryDirectory === '我的/日记');
        t('dir-picker 已关', !dt('.bz-sp-picker-mask'));

        /* ---------- 桌面：影院——下拉键直绑 + 主题联动单卡（seed cinemaStyle=midnight） ---------- */
        dt('.bz-sp-nav-item[data-sp-domain="cinema"]').click();
        await waitPaneGroups(1);
        await waitFor(() => dtAll('.bz-sp-pane .bz-sp-cardpick').length === 2);
        t('影院主题卡联动单卡（夜幕）', dtAll('.bz-sp-pane .bz-sp-cardpick')[1].querySelectorAll('.bz-sp-cardpick-card').length === 1 &&
          dtAll('.bz-sp-pane .bz-sp-cardpick')[1].textContent.includes('夜幕'));
        const sortRow = () => dtAll('.bz-sp-pane .bz-sp-set-row').find((r) => r.querySelector('.bz-sp-set-name')?.textContent === '默认排序');
        await waitFor(() => sortRow());
        sortRow().querySelector('.bz-select').dispatchEvent(new MouseEvent('click', { bubbles: true }));
        const rateOpt = await waitFor(() => dtAll('.bz-select-menu').map((m) => [...m.querySelectorAll('.bz-select-item')]).flat().find((o) => o.textContent.includes('按评分')));
        rateOpt.dispatchEvent(new MouseEvent('click', { bubbles: true }));
        t('下拉键直绑落内存设置（cinemaSortMode=rating）', sim().cinemaSortMode === 'rating');
        t('下拉触发器值跟随', sortRow().querySelector('.bz-select-val')?.textContent === '按评分');

        /* ---------- 移动：M1 命令面板 + 域设置弹窗 + 移动端组沉底 ---------- */
        t('移动面板开', !!mob('#bz-settings-panel-popup.bz-sp-mobile'));
        t('移动头行关闭钮图标兑现', !!mob('.bz-sp-mob-close svg'));
        t('移动分组列表（基础/记录/媒体与知识/工具）', mobAll('.bz-sp-mob-sec').filter((s) => ['基础', '记录', '媒体与知识', '工具'].includes(s.textContent)).length === 4);
        const mobBelItem = () => mobAll('.bz-sp-mob-item').find((b) => b.querySelector('.bz-sp-mob-name')?.textContent === '归物本');
        mobBelItem().click();
        await waitFor(() => md.querySelector('.bz-sp-mob-modal'));
        const mobGroups = () => [...md.querySelectorAll('.bz-sp-mob-modal .bz-sp-group')];
        await waitFor(() => mobGroups().length >= 3);
        t('移动弹窗渲染归物本全部组（含移动端组）', mobGroups().length === 3);
        t('移动端组沉底（弹窗末组）', mobGroups()[mobGroups().length - 1].querySelector('.bz-sp-group-name')?.textContent === '移动端');
        const mfsSw = mobGroups()[mobGroups().length - 1].querySelector('.bz-sw');
        mfsSw.dispatchEvent(new MouseEvent('click', { bubbles: true }));
        t('移动端开关键直绑落内存（移动 realm 设置单例）', simMob().belongingsMobileDefaultFullscreen === true);
        const mobMask = md.querySelector('.bz-sp-mob-modal').previousElementSibling;
        mobMask.dispatchEvent(new MouseEvent('click', { bubbles: true }));
        t('移动弹窗遮罩点击关闭', !md.querySelector('.bz-sp-mob-modal'));

        // 移动搜索：域段 + 设置项段（schemaRowCache 预载）
        const mobSearch = mob('.bz-sp-mob-search .bz-input');
        mobSearch.value = 'AI';
        mobSearch.dispatchEvent(new Event('input', { bubbles: true }));
        await waitFor(() => mobAll('.bz-sp-mob-sec').some((s) => s.textContent.startsWith('设置项')));
        t('移动搜索「设置项」段在场', mobAll('.bz-sp-mob-sec').some((s) => s.textContent.startsWith('设置项')));
        t('移动设置项命中行 kind 徽标', mobAll('.bz-sp-mob-kind').length > 0);

        document.title = window.__st.fail.length
          ? 'SELFTEST FAIL ' + window.__st.fail.join(',')
          : `SELFTEST OK ${window.__st.pass}/${window.__st.pass + window.__st.fail.length}`;
        res.textContent = window.__st.fail.length ? '自检失败' : `自检通过 ${window.__st.pass}`;
        res.className = window.__st.fail.length ? 'bad' : 'ok';
      } catch (err) {
        document.title = 'SELFTEST ERR ' + (err && err.message || err);
        res.textContent = '自检异常';
        res.className = 'bad';
      }
    })();
  }
})();
</script>
</body>
</html>
