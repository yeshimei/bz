<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>首页 · 头部×时间线分隔 5 版对照</title>
<!--
  头部单调 + 黑色竖线难看的对照原型：5 版成对设计（头部 + 时间线分隔一起换）。
  本页自包含（演示对照页，样式的赢家走 styles.css 回仓 + ui.ts 同步流程）。
  数据 = prototype.html 同款演示快照。
-->
<style>
  :root {
    --bg: #fafaf7; --card: #ffffff; --ink: #17150f; --dim: #8b8778; --line: #e5e2d6;
    --ok: #2f9e5f; --amber: #d98a1f; --red: #c74a2c; --ai: #7a5ce0; --ai-soft: #f2effc; --ai-line: #ddd4f4;
    --sans: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    --mono: "Cascadia Code", Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #e8e4d8; color: var(--ink); font-family: var(--sans); padding: 28px 24px 60px; display: flex; flex-direction: column; align-items: center; gap: 44px; }
  .stage-label { align-self: flex-start; margin-left: calc(50% - 440px); font-size: 12px; color: #7a7260; letter-spacing: .18em; }
  .frame { width: 880px; height: 580px; overflow: hidden; border: 1px solid #b8b0a0; border-radius: 12px; background: var(--bg); box-shadow: 0 10px 30px rgba(60,50,30,.14); display: flex; flex-direction: column; }

  /* ===== 共用骨架（与 prototype.html 同构） ===== */
  .body { flex: 1; min-height: 0; overflow: hidden; padding: 14px 16px 14px; }
  .grid { display: grid; grid-template-columns: 232px minmax(0,1fr) 224px; gap: 20px; height: 100%; }
  .sec-t { font-size: 11px; letter-spacing: .28em; color: var(--dim); margin: 0 0 10px; }
  .sec-t .n { letter-spacing: .05em; color: #a8a394; }
  .sec-t.ai { color: var(--ai); } .sec-t.ai::before { content: "✦ "; }
  .erow { display: flex; align-items: center; gap: 9px; padding: 7px 8px 7px 6px; border-radius: 8px; cursor: pointer; border: 0; border-bottom: 1px solid var(--line); background: none; font-family: inherit; color: inherit; width: 100%; text-align: left; }
  .erow:hover { background: #f0eee4; }
  .dot2 { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .dot2.off { background: none; border: 1.5px dashed #cfcabb; }
  .ic { display: inline-flex; flex: none; width: 17px; height: 17px; }
  .ic svg { width: 100%; height: 100%; }
  .erow .nm { font-size: 12.5px; font-weight: 600; }
  .erow .ct { margin-left: auto; font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .erow .go { opacity: 0; color: var(--dim); font-size: 11px; }
  .erow:hover .go { opacity: 1; }
  .ev { display: flex; gap: 16px; position: relative; }
  .ev .tm { font-family: var(--mono); font-size: 12px; color: var(--dim); width: 44px; flex: none; padding-top: 3px; }
  .ev .bd { flex: 1; min-width: 0; padding: 10px 0; }
  .ev .tx { font-size: 14.5px; line-height: 1.65; }
  .ev .dm { display: inline-flex; align-items: center; gap: 3px; font-size: 10.5px; color: #fff; padding: 1.5px 8px; border-radius: 8px; margin-right: 8px; vertical-align: 1.5px; }
  .ev .dm .ic { width: 10px; height: 10px; }
  .ev .note { margin-top: 6px; font-size: 12px; color: var(--ai); line-height: 1.6; }
  .ev .note::before { content: "✦ "; }
  .pr { background: var(--ai-soft); border: 1px solid var(--ai-line); border-radius: 11px; padding: 13px 16px; margin-bottom: 10px; font-size: 13px; line-height: 1.75; cursor: pointer; text-align: left; font-family: inherit; color: inherit; width: 100%; }
  .pr:hover { border-color: var(--ai); }
  .pr .h { font-size: 12.5px; font-weight: 700; color: var(--ai); margin-bottom: 3px; }
  .pr .h::before { content: "✦ "; }
  .pr .go { display: inline-block; margin-top: 7px; font-size: 11.5px; color: var(--ai); font-weight: 700; }
  .next { overflow-y: auto; scrollbar-width: none; }

  /* ══════════ V1 轻线 · 问候头 ══════════ */
  .v1 .head { display: flex; align-items: baseline; gap: 14px; padding: 14px 18px 12px; border-bottom: 1px solid var(--line); }
  .v1 .head h1 { font-size: 19px; font-weight: 800; letter-spacing: .12em; }
  .v1 .head .hello { font-size: 13px; color: var(--dim); }
  .v1 .head .dt { margin-left: auto; font-size: 12px; color: var(--dim); font-family: var(--mono); letter-spacing: .08em; }
  .v1 .flow { min-height: 0; overflow-y: auto; scrollbar-width: none; padding-left: 4px; }
  .v1 .ev { padding-left: 22px; }
  .v1 .ev::before { content: ""; position: absolute; left: 0; top: 15px; width: 9px; height: 9px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px var(--bg); }
  .v1 .ev.warn::before { background: var(--amber); }
  .v1 .flow::before { content: ""; position: absolute; margin-top: 4px; margin-bottom: 4px; }

  /* ══════════ V2 色带轨道 · 印章头 ══════════ */
  .v2 .head { display: flex; align-items: center; gap: 14px; padding: 12px 18px; border-bottom: 1px solid var(--line); }
  .v2 .seal { width: 40px; height: 40px; border-radius: 10px; background: var(--ink); color: #f2efe6; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
  .v2 .seal b { font-size: 16px; } .v2 .seal span { font-size: 8.5px; letter-spacing: .2em; opacity: .75; }
  .v2 .head h1 { font-size: 19px; font-weight: 800; letter-spacing: .12em; }
  .v2 .head .sub { font-size: 12px; color: var(--dim); }
  .v2 .head .dt { margin-left: auto; text-align: right; font-family: var(--mono); }
  .v2 .head .dt b { display: block; font-size: 15px; }
  .v2 .head .dt span { font-size: 10.5px; color: var(--dim); letter-spacing: .12em; }
  .v2 .flow { min-height: 0; overflow-y: auto; scrollbar-width: none; position: relative; padding-left: 24px; }
  .v2 .flow::before { content: ""; position: absolute; left: 4px; top: 6px; bottom: 6px; width: 4px; border-radius: 2px; background: var(--line); }
  .v2 .ev::before { content: ""; position: absolute; left: -1px; top: 14px; width: 14px; height: 14px; border-radius: 50%; background: var(--ok); border: 3px solid var(--bg); box-shadow: 0 0 0 1px var(--line); }
  .v2 .ev.warn::before { background: var(--amber); }

  /* ══════════ V3 无线留白 · 大字头 ══════════ */
  .v3 .head { display: flex; align-items: baseline; gap: 16px; padding: 18px 20px 14px; }
  .v3 .head h1 { font-size: 26px; font-weight: 900; letter-spacing: .2em; }
  .v3 .head .sub { font-size: 12.5px; color: var(--dim); }
  .v3 .head .dt { margin-left: auto; font-size: 12px; color: var(--dim); font-family: var(--mono); }
  .v3 .grid { margin-top: 2px; border-top: 1px solid var(--line); padding-top: 16px; height: calc(100% - 62px); }
  .v3 .flow { min-height: 0; overflow-y: auto; scrollbar-width: none; padding: 0 4px 0 2px; }
  .v3 .ev { margin-bottom: 2px; }
  .v3 .ev .bd { background: none; border-radius: 10px; border-left: 0; }
  .v3 .ev::before { content: none; }
  .v3 .ev .tm { color: var(--ink); font-weight: 700; width: 52px; }
  .v3 .ev + .ev .bd { border-top: 1px dashed var(--line); }

  /* ══════════ V4 虚线卡槽 · 层压头 ══════════ */
  .v4 .head { display: flex; align-items: center; gap: 12px; padding: 12px 18px; background: linear-gradient(180deg, #f4f1e8, var(--bg)); border-bottom: 2px solid var(--ink); }
  .v4 .head h1 { font-size: 18px; font-weight: 800; letter-spacing: .12em; }
  .v4 .head .cnt { font-size: 11px; color: var(--dim); border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 2px 10px; letter-spacing: .1em; }
  .v4 .head .dt { margin-left: auto; font-size: 12px; color: var(--dim); font-family: var(--mono); }
  .v4 .flowcard { min-height: 0; overflow-y: auto; scrollbar-width: none; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 6px 14px 6px 22px; height: 100%; }
  .v4 .flowcard .sec-t { margin-top: 6px; }
  .v4 .ev::before { content: ""; position: absolute; left: -14px; top: 16px; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 2.5px var(--card), 0 0 0 3.5px var(--line); }
  .v4 .ev.warn::before { background: var(--amber); }
  .v4 .flowcard .timeline { position: relative; }
  .v4 .flowcard .timeline::before { content: ""; position: absolute; left: -10.5px; top: 8px; bottom: 8px; border-left: 2px dashed var(--line); }

  /* ══════════ V5 周历头 · 渐隐线 ══════════ */
  .v5 .head { display: flex; align-items: center; gap: 16px; padding: 12px 18px 10px; border-bottom: 1px solid var(--line); }
  .v5 .head h1 { font-size: 18px; font-weight: 800; letter-spacing: .12em; }
  .v5 .week { display: flex; gap: 5px; }
  .v5 .wk { width: 22px; text-align: center; font-family: var(--mono); font-size: 9.5px; color: var(--dim); display: flex; flex-direction: column; gap: 2px; }
  .v5 .wk i { display: block; height: 22px; border-radius: 6px; background: #efede3; }
  .v5 .wk.hit i { background: var(--ok); opacity: .8; }
  .v5 .wk.today i { background: var(--ink); }
  .v5 .wk.today { color: var(--ink); font-weight: 700; }
  .v5 .head .dt { margin-left: auto; font-size: 12px; color: var(--dim); font-family: var(--mono); }
  .v5 .flowwrap { min-height: 0; overflow-y: auto; scrollbar-width: none; position: relative; padding-left: 24px;
    mask-image: linear-gradient(180deg, transparent 0, #000 26px, #000 calc(100% - 10px), transparent 100%); }
  .v5 .flowwrap::before { content: ""; position: absolute; left: 5px; top: 0; bottom: 0; width: 2px; background: linear-gradient(180deg, transparent, var(--line) 8%, var(--line) 92%, transparent); }
  .v5 .ev::before { content: ""; position: absolute; left: -14px; top: 15px; width: 10px; height: 10px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px var(--bg); }
  .v5 .ev.warn::before { background: var(--amber); }
</style>
</head>
<body>
<div id="hosts"></div>

<script>
const DOMAINS = [
  { id: 'diary', name: '日记本', ct: '522 篇', icon: '📝', dot: '#e67341', st: 'ok' },
  { id: 'cinema', name: '影院', ct: '想看 25 · 在看 4', icon: '🎬', dot: '#e6951d', st: 'off' },
  { id: 'review', name: '复习计划', ct: '9 张 · 逾期 1', icon: '🔁', dot: '#7c5cd6', st: 'hot' },
  { id: 'pomodoro', name: '番茄钟', ct: '累计在册', icon: '⏱', dot: '#e5534b', st: 'off' },
  { id: 'favorites', name: '收藏本', ct: '48 条', icon: '⭐', dot: '#f0b429', st: 'off' },
  { id: 'clipping', name: '剪藏本', ct: '未读 55 篇', icon: '✂️', dot: '#2f9e5f', st: 'off' },
  { id: 'literature', name: '文献盒', ct: '笔记与录入', icon: '🎓', dot: '#c2559d', st: 'off' },
  { id: 'bookshelf', name: '书库', ct: '在读 9 · 读完 151', icon: '📖', dot: '#3d7bd6', st: 'ok' },
  { id: 'wall', name: '回忆墙', ct: '522 格', icon: '🖼', dot: '#7c8cf8', st: 'off' },
  { id: 'belongings', name: '归物本', ct: '登记 65 件', icon: '📦', dot: '#45a35c', st: 'off' },
  { id: 'attach', name: '移动附件', ct: '工具', icon: '📁', dot: '#8a8f99', st: 'off' },
  { id: 'encrypt', name: '保险库', ct: '••• 上锁', icon: '🔒', dot: '#8a8f99', st: 'off' },
  { id: 'settings', name: '设置', ct: '20 域', icon: '⚙️', dot: '#8a8f99', st: 'off' },
];
const EVENTS = [
  { t: '07:42', dm: '书库', c: '#3d7bd6', tx: '《三体》读到 62%', note: '今天第一笔动静在 07:42，比昨天早了 48 分钟，好开头。' },
  { t: '09:10', dm: 'todo', c: '#8a8f99', tx: '完成『给 obsidian 提 issue』' },
  { t: '12:31', dm: '剪藏本', c: '#2f9e5f', tx: '剪藏 3 篇' },
  { t: '21:05', dm: '影院', c: '#e6951d', tx: '标记《百年孤独》已看 · ★★★★☆' },
  { t: '22:40', dm: '日记本', c: '#e67341', tx: '新增 4 条', warn: true, note: '晚上效率回来了——但日记还空着，×5 连击在等你。' },
];
const PREVIEWS = [
  { h: '还有 1 张逾期卡', b: '逾期是唯一会随时间变贵的债。约 4 分钟一张，还掉最划算。', go: '去还卡 →' },
  { h: '剪藏还压 55 篇', b: '挑 1 篇放进明早：通勤读一篇，保持进出平衡。', go: '挑一篇放明早 →' },
  { h: '日记连击 ×5 待续', b: '写三行也算数。今晚补上，明天它自己接着长。', go: '去写日记 →' },
];

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const entries = () => DOMAINS.map((d) =>
  `<button type="button" class="erow"><span class="dot2 ${d.st === 'off' ? 'off' : ''}" ${d.st !== 'off' ? `style="background:${d.st === 'hot' ? 'var(--red)' : d.st === 'warn' ? 'var(--amber)' : 'var(--ok)'}"` : ''}></span>`
  + `<span class="ic" style="color:${d.dot}">${d.icon}</span><span class="nm">${esc(d.name)}</span>`
  + `<span class="ct">${esc(d.ct)}</span><span class="go">→</span></button>`).join('');
const flow = () => EVENTS.map((e) =>
  `<div class="ev${e.warn ? ' warn' : ''}"><span class="tm">${esc(e.t)}</span><div class="bd">`
  + `<div class="tx"><span class="dm" style="background:${e.c}">${esc(e.dm)}</span>${esc(e.tx)}</div>`
  + (e.note ? `<div class="note">${esc(e.note)}</div>` : '') + '</div></div>').join('');
const next = () => '<div class="sec-t ai">明 天 预 告</div>'
  + PREVIEWS.map((p) => `<button type="button" class="pr"><div class="h">${esc(p.h)}</div><div>${esc(p.b)}</div><span class="go">${esc(p.go)}</span></button>`).join('');

const HEADS = {
  v1: `<div class="head"><h1>首 页</h1><span class="hello">晚上好，包仔</span><span class="dt">2026-09-07 周一 · 21:36</span></div>`,
  v2: `<div class="head"><div class="seal"><b>09</b><span>SEPT</span></div><div><h1>首 页</h1><span class="sub">今天有 5 笔动静 · 读了 1 本书的前进一步</span></div><div class="dt"><b>09-07</b><span>周一 · 21:36</span></div></div>`,
  v3: `<div class="head"><h1>首 页</h1><span class="sub">今天 5 笔动静 · 比昨天早 48 分钟动手</span><span class="dt">2026-09-07 周一 · 21:36</span></div>`,
  v4: `<div class="head"><h1>首 页</h1><span class="cnt">今天 5 笔 · 昨日 8 笔</span><span class="dt">2026-09-07 周一 · 21:36</span></div>`,
  v5: `<div class="head"><h1>首 页</h1><div class="week">${[1, 2, 3, 4, 5, 6, 7].map((d, i) =>
      `<span class="wk${[2, 4, 6].includes(d) ? ' hit' : ''}${d === 7 ? ' today' : ''}"><i></i>${['一', '二', '三', '四', '五', '六', '日'][i]}</span>`).join('')}</div><span class="dt">09-07 周一 · 21:36</span></div>`,
};
const FLOW_BODY = {
  v1: `<div class="flow"><div class="sec-t" style="padding-left:22px">时 间 线 · 今 天</div>${flow()}</div>`,
  v2: `<div class="flow"><div class="sec-t" style="padding-left:24px">时 间 线 · 今 天</div>${flow()}</div>`,
  v3: `<div class="flow"><div class="sec-t">时 间 线 · 今 天</div>${flow()}</div>`,
  v4: `<div class="flowcard"><div class="sec-t" style="padding-left:0">时 间 线 · 今 天</div><div class="timeline">${flow()}</div></div>`,
  v5: `<div class="flowwrap"><div class="sec-t" style="padding-left:24px">时 间 线 · 今 天</div>${flow()}</div>`,
};
const NAMES = {
  v1: 'V1 轻线 · 问候头（黑线→浅细线，头部加问候）',
  v2: 'V2 色带轨道 · 印章头（浅色圆角轨道+大彩点，日期印章块）',
  v3: 'V3 无线留白 · 大字头（去线，时刻加粗+虚线分隔，报头一句话）',
  v4: 'V4 虚线卡槽 · 层压头（时间线整体成白卡+虚线，头部纸纹渐变）',
  v5: 'V5 周历头 · 渐隐线（头部本周 7 格动静历，线两端渐隐）',
};

document.getElementById('hosts').innerHTML = ['v1', 'v2', 'v3', 'v4', 'v5'].map((v) =>
  `<div class="stage-label">${NAMES[v]}</div><div class="frame ${v}">${HEADS[v]}<div class="body"><div class="grid">`
  + `<div class="entries">${entries()}</div>${FLOW_BODY[v]}<div class="next">${next()}</div></div></div></div>`).join('');
</script>
</body>
</html>
