e>bz-attach-move</code>）（src/main.ts:228, src/attach/index.ts:11-16）。</li>\n</ol>\n<p><strong>入口 B — 文件右键</strong></p>\n<ol>\n<li>在文件树里对一篇 <code>.md</code> 笔记右键。</li>\n<li>选择 <strong>「搬移此笔记附件」</strong>（src/attach/index.ts:31-33）。</li>\n</ol>\n<p><strong>后续统一流程：</strong></p>\n<ol>\n<li>插件先扫描该笔记引用的附件：</li>\n</ol>\n<ul>\n<li>若<strong>没有任何可搬附件</strong>，直接提示「当前笔记没有可搬移的附件」并结束（src/attach/ui.ts:517-520）。</li>\n<li>若附件<strong>已全部位于上次目标文件夹</strong>，会弹「无需搬移」提示，可选「换个文件夹」继续，或「不用了」结束（src/attach/ui.ts:524-536）。</li>\n</ul>\n<ol>\n<li>弹出<strong>统一路径选择器</strong>，选择目标文件夹：</li>\n</ol>\n<ul>\n<li>支持搜索、卡片选择（src/attach/ui.ts:537-545）。</li>\n<li>「（库根目录）」= 直接搬移到 vault 根目录（空串语义）（src/attach/ui.ts:78-81, src/attach/ui.ts:167-168）。</li>\n<li>若已设置过目标文件夹，会自动高亮「上次文件夹」（src/attach/ui.ts:521-544）。</li>\n<li>若所选目录下附件都已存在，提示「附件已全部在目标文件夹」并结束（src/attach/ui.ts:550-552）。</li>\n</ul>\n<ol>\n<li>弹出<strong>可勾选预览清单</strong>（src/attach/ui.ts:325-485）：</li>\n</ol>\n<ul>\n<li>逐行显示 <code>原路径 → 目标路径</code>，复选框<strong>默认全选</strong>。</li>\n<li>目标已存在同名文件时，该行标「将改名」徽标（会自动改名为 <code>原名 (N).ext</code>）。</li>\n<li>可取消勾选个别不想动的附件；顶部有「全选 / 全不选」工具条（src/attach/ui.ts:403-423）。</li>\n<li>确认按钮显示「搬移 N 个」；可用 <code>Ctrl/⌘+Enter</code> 直接提交（src/attach/ui.ts:459-466, src/attach/ui.ts:482-483）。</li>\n<li>若有取消勾选项未提交就按 ESC/点遮罩，会先弹「放弃确认」（src/attach/ui.ts:476-479）。</li>\n<li>「跳过预览直接搬（本会话）」按钮：本次照常执行，并开启<strong>跳过预览模式</strong>，本会话内后续搬移选完文件夹直接执行、不再弹预览（插件重载后复位）（src/attach/ui.ts:447-458）。</li>\n</ul>\n<ol>\n<li>执行搬移：</li>\n</ol>\n<ul>\n<li>附件数 <strong>≥ 10</strong> 时显示进度通知（「正在搬移附件 i/N」），可点「中止」按钮中途停止——已搬移的部分照常出汇总并提供撤销（src/attach/ui.ts:49, src/attach/ui.ts:201-225）。</li>\n<li>成功后弹出汇总通知，并带「撤销」按钮（src/attach/ui.ts:260-262）。</li>\n</ul>\n<h2>全部设置项</h2>\n<p><strong>无。</strong></p>\n<p>原因：本域在设置面板中登记为 <code>noSettings: true</code>，不提供任何用户可调选项（src/settings-panel/ui.ts:182）。唯一的持久化字段 <code>attachLastFolder</code> 是运行期记忆（记录上次目标文件夹，用于选择器初始高亮），由插件自动写入，不暴露给用户、不可手动设置（src/settings.ts:71-73）。</p>\n<h2>全部命令</h2>\n<p>没有独立的「设置命令」。可用入口如下：</p>\n<ul>\n<li><strong>命令面板命令</strong>：「搬移附件」，命令 ID <code>bz-attach-move</code>，由 <code>main.ts</code> 裸注册，回调 <code>openAttachMove(getApp())</code>（src/main.ts:228, src/attach/index.ts:11-16）。</li>\n<li><strong>文件右键菜单</strong>：<code>.md</code> 笔记右键的「搬移此笔记附件」，通过 <code>ensureAttachFileMenu</code> 在插件加载时注册到 <code>file-menu</code> 事件（src/attach/index.ts:23-40, src/main.ts:335）。</li>\n</ul>\n<blockquote>注：设置面板里虽有「附件搬移」导航项，但它只是占位（无设置内容），真正的入口只有上面的命令与右键菜单。</blockquote>\n<h2>边界、限制与坑（重点：动了真实文件，写清风险）</h2>\n<ul>\n<li><strong>会真正移动磁盘文件</strong>：本功能通过 Obsidian 内建 <code>app.fileManager.renameFile</code>（或回退 <code>vault.rename</code>）实际改写文件路径，不是预览或模拟。误操作请用「撤销」恢复（见下）。</li>\n<li><strong>引用自动改写，但依赖 fileManager</strong>：移动走 <code>app.fileManager.renameFile</code>，会<strong>自动更新全库</strong>中引用这些附件的内部链接（src/attach/data.ts:7-8, src/attach/ui.ts:217）。若运行环境缺少 <code>fileManager</code>（异常环境），会回退 <code>vault.rename</code>——此时<strong>链接不会被更新</strong>，并会发出 warning 通知（src/attach/ui.ts:218, src/attach/ui.ts:259）。</li>\n<li><strong>搬哪些文件有口径限制</strong>：</li>\n<li>只收「库内、非 <code>.md</code>」的被引用文件；扩展名解析命中 <code>.md</code> 不会搬（src/attach/data.ts:200-206）。</li>\n<li><strong>外链不搬</strong>：<code>http:</code>/<code>https:</code>/<code>data:</code>/<code>file:</code> 开头的链接被跳过（src/attach/data.ts:147）。</li>\n<li>代码块（``` / ~~~）、行内反引号、HTML 注释（&lt;!-- --&gt;）内的「链接」不算引用，不会被收集；但 <strong>frontmatter 里的链接算真引用</strong>，会被收集（src/attach/data.ts:54-86）。</li>\n<li>收集优先用 <code>metadataCache</code> 的 embeds/links/frontmatterLinks；缓存缺失时才退化到正则兜底（src/attach/ui.ts:89-103）。</li>\n<li><strong>同名冲突改名</strong>：仅当目标文件夹已存在同名文件（或同名子文件夹）时才改名，格式 <code>原名 (N).ext</code>，<code>N</code> 递增（src/attach/data.ts:255-274）。不是「覆盖」也不是「报错中止」。</li>\n<li><strong>重复搬会被跳过/提前终止</strong>：已在目标文件夹的附件在规划阶段就被排除（src/attach/data.ts:261）；全部已在目标时直接结束并提示（src/attach/ui.ts:550-552）；全部已在「上次文件夹」时会先弹「无需搬移」（src/attach/ui.ts:524-536）。因此同一笔记对同一目标重复执行是安全的、幂等的。</li>\n<li><strong>一次只能有一个搬移在跑</strong>：<code>moveInFlight</code> 防重入，并行触发会提示「附件搬移进行中，请稍候」（src/attach/ui.ts:136, src/attach/ui.ts:173-177, src/attach/ui.ts:497-500）。</li>\n<li><strong>大批量有渲染护栏</strong>：预览清单只渲染前 300 行，超出部分仍默认勾选、一并提交（src/attach/ui.ts:54, src/attach/ui.ts:395-400）。</li>\n<li><strong>目标文件夹不存在会自动创建</strong>（非库根时）：<code>vault.createFolder</code>（src/attach/ui.ts:197）。</li>\n</ul>\n<h2>常见问题</h2>\n<p><strong>Q1. 搬完之后，别的笔记里指向这些附件的链接会失效吗？</strong></p>\n<p>不会。移动走 <code>app.fileManager.renameFile</code>，全库引用这些附件的内部链接会被自动改指向新路径（src/attach/data.ts:7-8, src/attach/ui.ts:217）。仅当环境缺 <code>fileManager</code> 回退 <code>vault.rename</code> 时链接不更新并会告警（src/attach/ui.ts:218, src/attach/ui.ts:259）。</p>\n<p><strong>Q2. 搬错了怎么办 / 怎么恢复？</strong></p>\n<p>成功后通知带「撤销」按钮，点击后按逆序把已移动附件 <code>renameFile</code> 回原路径，链接同样由 Obsidian 自动回改（src/attach/ui.ts:262, src/attach/ui.ts:285-311）。注意：撤销只回滚本次真正移动过的文件；若原位置已被占用，个别会撤销失败并提示（src/attach/ui.ts:309）。</p>\n<p><strong>Q3. 目标文件夹里已经有同名文件会怎样？</strong></p>\n<p>不会覆盖。自动改名为 <code>原名 (N).ext</code>（<code>N</code> 从 1 递增），预览清单里该行会标「将改名」徽标（src/attach/data.ts:255-274, src/attach/ui.ts:376-385）。</p>\n<p><strong>Q4. 为什么有的「链接」没被搬？</strong></p>\n<p>以下情况不算被引用、不会收集：库外/外链（<code>http:</code>/<code>https:</code>/<code>data:</code>/<code>file:</code>）、代码块/行内代码/HTML 注释里的写法；以及扩展名解析为 <code>.md</code> 的目标（src/attach/data.ts:147, src/attach/data.ts:54-86, src/attach/data.ts:200-206）。frontmatter 里的链接是会被收集的（src/attach/data.ts:57-58）。</p>\n<p><strong>Q5. 怎么只搬一部分附件、不动其余的？</strong></p>\n<p>预览清单里取消勾选不想动的附件即可；顶部「全选 / 全不选」可批量切换。确认时只移动勾选项（src/attach/ui.ts:403-423, src/attach/ui.ts:187-190）。</p>\n<p><strong>Q6. 执行到一半卡住或想停，会留半成品吗？</strong></p>\n<p>附件数 ≥ 10 时进度通知带「中止」按钮，点「中止」后已移动的部分照常出汇总并提供撤销，未移动的保持原位（src/attach/ui.ts:201-225）。整体还有 <code>try/catch</code> 兜底， catastrophic 失败会提示「原文件未改动」（src/attach/ui.ts:271-274）。</p>\n<p><strong>Q7. 为什么设置面板里「附件搬移」点进去什么都没有？</strong></p>\n<p>该域登记为 <code>noSettings: true</code>，本身没有可调设置；唯一持久化的 <code>attachLastFolder</code> 是运行期记忆、不暴露给用户（src/settings-panel/ui.ts:182, src/settings.ts:71-73）。真正的操作入口是命令面板「搬移附件」与 <code>.md</code> 笔记右键菜单。</p>","no":27},{"id":"pomodoro","title":"番茄钟","group":"工具","tags":["tool","pomodoro"],"domain":"pomodoro","html":"<blockquote>专注 / 短休 / 长休三段计时，带强制专注与自动循环</blockquote>\n<h2>什么时候用它</h2>\n<p>想在 Obsidian 里做专注时用它。核心循环：<strong>专注 → 短休息 →（几个循环后）长休息</strong>，每一段的时长、要不要自动接下一段、要不要响铃都可以配。</p>\n<p>它还带一个<strong>强制专注模式</strong>：开了之后，专注进行中连暂停都不行 —— 给真想认真工作的人用的。</p>\n<h2>数据放在哪</h2>\n<table><thead><tr><th>文件</th><th>位置</th><th>里面是什么</th></tr></thead><tbody><tr><td><code>pomodoro.json</code></td><td>数据存储路径（默认 <code>CONFIG/STORAGE</code>，<code>src/pomodoro/data.ts:17</code>）</td><td>计时记录（history）</td></tr></tbody></table>\n<p>记录会在落盘前<strong>裁剪</strong>，history 不会无限膨胀（<code>src/pomodoro/data.ts:38</code>）。</p>\n<h2>跑一个番茄</h2>\n<ol>\n<li>「番茄钟」命令打开面板（<code>bz-pomodoro-open</code>），或直接执行「开始/重置专注」（<code>bz-pomodoro-focus-toggle</code>）。</li>\n<li>主按钮是「开始 / 暂停 / 继续」三合一：没开始就显示开始、计时中显示暂停、暂停中显示继续（<code>src/pomodoro/ui.ts:810</code>）。</li>\n<li><strong>重置 / 跳过不弹确认框</strong>，改成按钮内二次确认（先点一次进入待确认态，再点才执行；点主按钮会撤销待确认，防误触连击，<code>src/pomodoro/ui.ts:824</code>）。</li>\n<li>休息阶段用「跳过休息」（<code>bz-pomodoro-skip</code>）直接进下一段；空闲状态下跳过按钮是禁用的。</li>\n<li>暂停用「暂停/继续专注」（<code>bz-pomodoro-pause</code>）。</li>\n</ol>\n<h2>时间方案</h2>\n<p>选一个<strong>预设方案</strong>就是现成的三段组合，共 11 个（<code>src/pomodoro/config.ts:13</code>）：</p>\n<table><thead><tr><th>预设</th><th>专注 / 短休 / 长休（分钟）</th></tr></thead><tbody><tr><td>经典标准</td><td>25 / 5 / 15</td></tr><tr><td>神经专注</td><td>30 / 7 / 20</td></tr><tr><td>深度心流</td><td>50 / 10 / 25</td></tr><tr><td>创意激发</td><td>40 / 12 / 20</td></tr><tr><td>初学入门</td><td>15 / 5 / 12</td></tr><tr><td>高效学习</td><td>30 / 5 / 15</td></tr><tr><td>敏捷冲刺</td><td>20 / 4 / 12</td></tr><tr><td>马拉松式</td><td>45 / 15 / 30</td></tr><tr><td>疲劳恢复</td><td>20 / 10 / 20</td></tr><tr><td>高强度</td><td>50 / 5 / 15</td></tr><tr><td>平衡模式</td><td>35 / 7 / 18</td></tr></tbody></table>\n<p>选「自定义」后才会出现<strong>工作时长 / 短休息时长 / 长休息时长</strong>三行（<code>src/pomodoro/ui.ts:745</code>）。<strong>长休息间隔</strong>独立于预设，始终可调：每隔几个专注进一次长休息（默认 4，1–20）。</p>\n<h2>全部设置项</h2>\n<h3>外观</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>面板布局</td><td><code>pomodoroSkin</code></td><td>卡片选择</td><td>default</td><td>切换面板布局</td></tr><tr><td>面板主题</td><td><code>pomodoroSkinTheme</code></td><td>卡片选择</td><td>—</td><td>切换面板主题（多套皮肤主题可选，改完即时重渲染，<code>src/pomodoro/ui.ts:724</code>）</td></tr></tbody></table>\n<h3>时间方案</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>预设方案</td><td><code>pomodoroPreset</code></td><td>下拉</td><td>—</td><td>上表 11 个预设 + 自定义</td></tr><tr><td>工作时长</td><td><code>pomodoroWorkMin</code></td><td>数字</td><td>25</td><td>自定义方案才有（1–120）</td></tr><tr><td>短休息时长</td><td><code>pomodoroShortBreakMin</code></td><td>数字</td><td>5</td><td>自定义方案才有（1–60）</td></tr><tr><td>长休息时长</td><td><code>pomodoroLongBreakMin</code></td><td>数字</td><td>15</td><td>自定义方案才有（1–60）</td></tr><tr><td>长休息间隔</td><td><code>pomodoroLongBreakInterval</code></td><td>数字</td><td>4</td><td>每隔几个专注进一次长休息（1–20）</td></tr></tbody></table>\n<h3>行为</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>强制专注模式</td><td>—</td><td>开关</td><td>—</td><td><strong>专注进行中无法暂停、跳过或重置</strong>，只能等它走完；还没开始时想启动不受限。命令面板里的同名操作同样被挡</td></tr><tr><td>自动循环</td><td><code>pomodoroAutoCycle</code></td><td>开关</td><td>—</td><td>阶段结束后自动开始下一阶段</td></tr><tr><td>自动跳过休息</td><td><code>pomodoroAutoSkipBreak</code></td><td>开关</td><td>—</td><td>专注结束后直接进下一个专注</td></tr><tr><td>声音提醒</td><td>—</td><td>开关</td><td>—</td><td>阶段切换时播放提示音</td></tr><tr><td>倒数滴答</td><td>—</td><td>开关</td><td>—</td><td>倒计时最后十秒的轻响</td></tr><tr><td>提示音音量</td><td>—</td><td>滑杆</td><td>—</td><td>提示音的音量大小</td></tr><tr><td>打开时恢复方式</td><td><code>pomodoroRestoreMode</code></td><td>下拉</td><td>background</td><td>插件启动遇未走完的倒计时：<code>background</code> 后台继续（默认，静默接着走）/ <code>popup</code> 自动弹出计时盘（<code>src/pomodoro/ui.ts:801</code>）</td></tr></tbody></table>\n<h2>全部命令</h2>\n<table><thead><tr><th>命令</th><th>名称</th><th>做什么</th></tr></thead><tbody><tr><td><code>bz-pomodoro-open</code></td><td>番茄钟</td><td>打开计时盘面板</td></tr><tr><td><code>bz-pomodoro-focus-toggle</code></td><td>开始/重置专注</td><td>主按钮：开始专注；再按暂停/继续；重置走按钮内二次确认</td></tr><tr><td><code>bz-pomodoro-skip</code></td><td>跳过休息</td><td>跳过当前休息段（空闲态禁用；强制专注下被拦）</td></tr><tr><td><code>bz-pomodoro-pause</code></td><td>暂停/继续专注</td><td>暂停或继续当前专注（强制专注下被拦）</td></tr></tbody></table>\n<h2>边界、限制与坑</h2>\n<ul>\n<li><strong>强制专注是真的强制</strong>：开了之后专注中连暂停都做不了，只有等走完 —— 没想清楚别开。</li>\n<li><strong>重置 / 跳过是\"按钮内二次确认\"</strong>：不是弹窗，点一次变待确认态、再点才执行；这个设计是 2026-09-24 拍板的。</li>\n<li><strong>三段时长只在「自定义」预设下可调</strong>：选了预设，这三行连改都改不了（被隐藏）。</li>\n<li><strong>长休息间隔是全局的</strong>：不跟预设走，换预设后它保持你设的值。</li>\n<li><strong>自动循环 + 强制专注一起开会一直转</strong>：休息也会自动接，专注中不可打断 —— 想中途退出只能等。</li>\n<li><strong>关掉 Obsidian 倒计时不会丢</strong>：下次启动按「打开时恢复方式」处理（默认后台继续）。</li>\n<li><strong><code>pomodoro.json</code> 会自动瘦身</strong>：history 落盘前裁剪，不会无限膨胀。</li>\n</ul>\n<h2>常见问题</h2>\n<p><strong>专注做到一半想停怎么办？</strong></p>\n<p>没开「强制专注模式」就按暂停或重置；开了就只能等走完 —— 这就是它的用途。</p>\n<p><strong>长休息怎么触发？</strong></p>\n<p>按你设的「长休息间隔」自动出现：默认每 4 个专注后进一次长休息，其余进短休息。</p>\n<p><strong>为什么跳过按钮是灰的？</strong></p>\n<p>空闲状态下跳过没有意义，按钮被禁用（<code>src/pomodoro/ui.ts:828</code>）。</p>\n<p><strong>重启 Obsidian 后倒计时还在吗？</strong></p>\n<p>在。恢复方式二选一：后台继续（默认，不打扰）或自动弹窗（把计时盘推到眼前）。</p>\n<p><strong>提示音太吵 / 太轻？</strong></p>\n<p>关「声音提醒」或调「提示音音量」；「倒数滴答」是最后十秒的轻响，可单独关。</p>\n<p><strong> skins 能换吗？</strong></p>\n<p>面板主题有多套可选，改完立即生效；面板布局当前一种。</p>","no":28},{"id":"smartcat","title":"小橘陪伴猫","group":"工具","tags":["tool","smartcat"],"domain":"smartcat","html":"<blockquote>库里养一只会说话的猫：读你的笔记、记得你、偶尔主动搭话</blockquote>\n<h2>什么时候用它</h2>\n<p>想要一个「住在库里」的陪伴角色时用它。小橘不是普通聊天窗：它有<strong>记忆库</strong>（把你指定的目录读进记忆）、<strong>行为流</strong>（记录你库里发生的事）、<strong>心情与性格成长</strong>（PAD 模型），还会按活跃时段主动跟你说话。</p>\n<p>它跟「第二大脑对话」的分工：第二大脑是<strong>检索工具</strong>（找笔记、带材料回答）；小橘是<strong>角色</strong>（有记忆、有性格，聊天时可能会想起你笔记里的事）。</p>\n<h2>数据放在哪</h2>\n<table><thead><tr><th>文件</th><th>位置</th><th>里面是什么</th></tr></thead><tbody><tr><td><code>smartcat.json</code></td><td>数据存储路径</td><td>配置默认值 + PAD 心情 + 性格成长 + 记忆流的兜底结构（<code>src/smartcat/data.ts:81</code>）</td></tr><tr><td><code>smartcat-memory.json</code></td><td>数据存储路径</td><td>记忆流（它记住的事）</td></tr><tr><td><code>smartcat-memory-vectors.vec</code></td><td>数据存储路径</td><td>记忆向量（<strong>二进制</strong>，供语义检索记忆用）</td></tr><tr><td><code>smartcat-behavior.json</code></td><td>数据存储路径</td><td>行为流（你在库里干了什么，带保留天数与条数上限）</td></tr></tbody></table>\n<p><strong>记忆文件夹</strong>里那些目录的笔记会进记忆库；<strong>从名单里移除一个目录，它已建立的那部分记忆会一起清掉</strong>。</p>\n<h2>怎么唤起、怎么收起来</h2>\n<ul>\n<li>「小橘」命令（<code>bz-smartcat-open</code>）唤起；「隐藏小橘」（<code>bz-smartcat-hide</code>）收起来。</li>\n<li>「小橘聊天」（<code>bz-smartcat-chat</code>）直接开聊天。</li>\n<li>「小橘数据面板」（<code>bz-smartcat-dashboard</code>）看它的状态。</li>\n</ul>\n<p>聊天走 AI 面板配的 LLM 通道 —— <strong>没配 AI 就聊不了</strong>，这是前置条件。</p>\n<h2>聊天与记忆</h2>\n<p><strong>记忆怎么进库</strong></p>\n<ol>\n<li>在「记忆来源 → 记忆文件夹」里加目录（可多个）；</li>\n<li>插件装上<strong>记忆目录增量同步器</strong>（ADR-0069）：目录笔记按分块进记忆，<code>分块字符上限</code>（200–6000 字）决定长笔记怎么切；</li>\n<li>之后笔记有改动会<strong>增量</strong>同步，不用全量重扫。</li>\n</ol>\n<p><strong>记忆怎么被用上</strong>：聊天时它按语义从记忆向量里翻相关记忆，配合短期记忆（最近对话轮数）与上下文字数限制一起组织回答。</p>\n<p><strong>记忆怎么清</strong></p>\n<ul>\n<li>从「记忆文件夹」移除目录 → 该目录的记忆随之清掉；</li>\n<li>想全部重来：删掉 <code>smartcat-memory.json</code> 与 <code>smartcat-memory-vectors.vec</code>，再重新同步记忆目录。</li>\n</ul>\n<h2>全部设置项</h2>\n<h3>外观</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>面板皮肤</td><td>—</td><td>卡片选择</td><td>—</td><td>小橘的外观皮肤</td></tr></tbody></table>\n<h3>互动</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>小橘对我的称呼</td><td><code>smartcatUserName</code></td><td>文本</td><td>—</td><td>它提到你时怎么叫你</td></tr><tr><td>自言自语间隔</td><td><code>speakInterval</code></td><td>数字</td><td>—</td><td>主动说话的间隔分钟数（1–60）</td></tr><tr><td>说话概率</td><td><code>speakProbability</code></td><td>数字</td><td>—</td><td>到点后真的开口的概率（0.1–1）</td></tr><tr><td>主动关心</td><td><code>proactiveCare</code></td><td>开关</td><td>—</td><td>每周按你的活跃时段主动搭话</td></tr></tbody></table>\n<h3>记忆</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>短期记忆量</td><td><code>shortTermMemory</code></td><td>数字</td><td>—</td><td>短期记忆保留的对话轮数（50–200）</td></tr><tr><td>上下文字数限制</td><td><code>contextLength</code></td><td>数字</td><td>—</td><td>上下文最大字数（0–1000）；<strong>0 = 仅取当前行</strong></td></tr><tr><td>上下文分布比例</td><td><code>contextSplitRatio</code></td><td>数字</td><td>—</td><td>上下文在记忆/对话间的分配比例（0.1–0.9）</td></tr><tr><td>记忆打分范围</td><td>—</td><td>数字区间</td><td>—</td><td>记忆重要性的打分区间</td></tr><tr><td>向量化模型</td><td>—</td><td>文本（只读跟随）</td><td>—</td><td><strong>跟着 AI 面板的嵌入模型走，这里单独改不生效</strong>；换模型后要重建：删记忆向量文件、重扫记忆目录（<code>src/smartcat/ui.ts:292</code>）</td></tr><tr><td>分块字符上限</td><td><code>smartcatChunkLimitChars</code></td><td>数字</td><td>—</td><td>长笔记分块的最大字符数（200–6000）</td></tr></tbody></table>\n<h3>记忆来源</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>记忆文件夹</td><td><code>memoryDirectories</code></td><td>路径（多值）</td><td>空</td><td>哪些目录的笔记进记忆库；移除目录 = 清掉那部分记忆</td></tr></tbody></table>\n<h3>存储与记忆</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>行为流保留天数</td><td><code>behaviorMaxDays</code></td><td>数字</td><td>—</td><td>行为流条目保留多久（1–365）</td></tr><tr><td>行为流最大条数</td><td><code>behaviorMaxCount</code></td><td>数字</td><td>—</td><td>行为流最多存多少条（100–10000）</td></tr></tbody></table>\n<h3>数据面板</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>打开数据面板</td><td>—</td><td>按钮</td><td>—</td><td>打开小橘的数据面板</td></tr><tr><td>显示行为日志</td><td><code>showBehaviorLog</code></td><td>开关</td><td>—</td><td>数据面板里是否显示行为日志页签</td></tr></tbody></table>\n<h2>全部命令</h2>\n<table><thead><tr><th>命令</th><th>名称</th><th>做什么</th></tr></thead><tbody><tr><td><code>bz-smartcat-open</code></td><td>小橘</td><td>唤起小橘</td></tr><tr><td><code>bz-smartcat-chat</code></td><td>小橘聊天</td><td>直接开聊天</td></tr><tr><td><code>bz-smartcat-hide</code></td><td>隐藏小橘</td><td>收起来</td></tr><tr><td><code>bz-smartcat-dashboard</code></td><td>小橘数据面板</td><td>打开数据面板</td></tr></tbody></table>\n<h2>边界、限制与坑</h2>\n<ul>\n<li><strong>没配 AI 就聊不了</strong>：聊天走 LLM 通道，AI 面板必须先配好。</li>\n<li><strong>「向量化模型」是只读的</strong>：它显示 AI 面板的嵌入模型；在这里改没有用。换了嵌入模型，记忆向量必须重建（删 <code>smartcat-memory-vectors.vec</code> + 重扫记忆目录）。</li>\n<li><strong>移除记忆目录 = 删记忆</strong>：不是「不再更新」，而是已建的那部分记忆被清掉；想恢复得重新加回来重扫。</li>\n<li><strong>上下文字数限制填 0 的含义特殊</strong>：0 不是「不限」，是「只取当前行」。</li>\n<li><strong>行为流有双上限</strong>（天数 + 条数）：超了自动裁，别把它当永久档案 —— 首页时间线吃的也是这个流。</li>\n<li><strong>主动说话由间隔 × 概率共同决定</strong>：间隔到了还要掷一次「说话概率」，不是到点必说。</li>\n<li>首页的「小橘点评」来自行为流里的星级评价 —— 关掉小橘不影响已有点评。</li>\n</ul>\n<h2>常见问题</h2>\n<p><strong>小橘怎么知道我笔记里的事？</strong></p>\n<p>把目录加进「记忆文件夹」，笔记分块后进记忆库；聊天时按语义翻相关记忆。</p>\n<p><strong>换电脑后它还认识我吗？</strong></p>\n<p><code>smartcat-memory.json</code> 与 <code>smartcat-memory-vectors.vec</code> 跟库走就认得；换过嵌入模型的话要重建向量。</p>\n<p><strong>它一直不主动说话？</strong></p>\n<p>查三件事：「自言自语间隔」是不是太长、「说话概率」是不是太低、「主动关心」有没有开。</p>\n<p><strong>怎么让它忘掉某些事？</strong></p>\n<p>从「记忆文件夹」移除对应目录（那部分记忆会被清掉），或者删掉两个记忆文件重新来。</p>\n<p><strong>它跟第二大脑什么关系？</strong></p>\n<p>引擎上共用了嵌入模型那套，但定位不同：第二大脑是检索工具，小橘是带记忆与性格的角色。</p>","no":29},{"id":"encrypt","title":"保险库","group":"安全","tags":["safe","encrypt"],"domain":"encrypt","html":"<blockquote>用主密码把笔记连同附件加密成密文，钥匙不对就打不开</blockquote>\n<h2>什么时候用它</h2>\n<p>有<strong>真的不想被别人看到</strong>的内容时用它：私密日记、证件信息、账号备注。加密后原文从库里消失，留下的是一份密文镜像与一条清单记录。</p>\n<p>它用的是成熟做法：口令经 <strong>PBKDF2 派生（10 万次迭代）</strong>，正文与附件用 <strong>AES-256-GCM</strong> 加密（<code>src/encrypt/vault-assets-view.ts:99</code>）。每个附件独立 salt、独立派生。</p>\n<p><strong>必须先接受的一件事</strong>：主密码<strong>不存储、也无法找回</strong>。忘了就是永久打不开，笔记与附件一起丢（面板里那条提醒是原话）。别把它当成「忘了还能重置」的东西。</p>\n<h2>数据放在哪</h2>\n<table><thead><tr><th>位置</th><th>里面是什么</th></tr></thead><tbody><tr><td><code>&lt;数据存储路径&gt;/.ENCRYPT/</code></td><td>密文根目录，<strong>固定</strong>在这里（<code>src/core/storage.ts:71</code>）。点前缀目录在 Obsidian 侧栏不可见，防误删</td></tr><tr><td>同目录下的清单</td><td>加密条目记录（标题镜像等），用于列表面板；标题镜像读的是原始密文串，不解密（<code>src/encrypt/data.ts:1332</code>）</td></tr><tr><td>同目录下的密文镜像</td><td>正文与附件的密文</td></tr><tr><td><code>CONFIG/.ENCRYPT/</code>（旧位置）</td><td>老版本的默认位置 —— 「保险库根文件夹」设置行已退役，不再提供修改</td></tr></tbody></table>\n<p>和密码本的关系：两者<strong>同锁同库</strong>（密码本条目是保险库里的 <code>kind=password-vault</code> 条目）。锁定保险库，密码本一起锁。</p>\n<h2>第一次使用（设置主密码）</h2>\n<ol>\n<li>执行「保险库」（<code>bz-encrypt-open</code>）打开面板。</li>\n<li>第一次会要求设主密码。设完有一个必须确认的提醒：<strong>主密码无法找回，遗忘将导致密文永久无法恢复</strong>（<code>src/encrypt/ui.ts:1320</code>）。</li>\n<li>建议立刻把主密码记进密码管理器 —— 这不是套话，是唯一的补救手段。</li>\n</ol>\n<h2>加密一篇笔记</h2>\n<ol>\n<li>打开要加密的笔记。</li>\n<li>执行「加密当前笔记」（<code>bz-encrypt-lock</code>）—— 面板顶部也有这个按钮。</li>\n<li>插件把正文与附件加密写进 <code>.ENCRYPT</code>，原标题变成密文条目；解密需要主密码。</li>\n<li>想手动上锁，执行「锁定保险库」（<code>bz-encrypt-lock-vault</code>）。</li>\n</ol>\n<p>附件加密是<strong>并行</strong>的（同时 3 个 blob），写盘由队列兜底（<code>src/encrypt/data.ts:229</code>）。加密期间别继续编辑那篇笔记 —— 插件会删前重读比对，但那段时间的改动有风险。</p>\n<h2>看加密的图片与视频</h2>\n<p>两种方式，取舍不同：</p>\n<table><thead><tr><th>方式</th><th>代价</th></tr></thead><tbody><tr><td><strong>压缩预览</strong>（需开「生成压缩预览」）</td><td>加密时就生成一份压缩缩略图，之后<strong>不解密</strong>就能看 —— 快，但画质是压缩过的</td></tr><tr><td><strong>预览自动加载原图</strong></td><td>打开预览时自动解密原图替换缩略图，画质最好；代价是打开那一刻<strong>所有原图一起解密</strong>，明显变慢，且明文以 Blob URL 短暂驻留内存，关闭预览时统一 <code>revokeObjectURL</code> 回收（<code>src/encrypt/ui.ts:483</code>）</td></tr></tbody></table>\n<h2>全部设置项</h2>\n<h3>外观</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>面板布局</td><td><code>encryptSkin</code></td><td>卡片选择</td><td>default</td><td>切换面板布局（当前只有「三栏」）</td></tr><tr><td>面板主题</td><td><code>encryptSkinTheme</code></td><td>卡片选择</td><td>steel</td><td>切换面板主题（当前只有「钢灰」）</td></tr></tbody></table>\n<h3>安全</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>安全模式</td><td><code>securityMode</code> / <code>encryptSecurityMode</code></td><td>开关</td><td>—</td><td>打开后<strong>关闭保险库窗口立即自动上锁</strong>。历史上有两个键，读取时取两者之一为真、写入时两个一起写（老配置兼容，<code>src/encrypt/ui.ts:451</code>）；改完要重载插件</td></tr></tbody></table>\n<p>「保险库根文件夹」这一行<strong>已退役</strong> —— 密文根目录固定为 <code>&lt;数据存储路径&gt;/.ENCRYPT</code>，面板不再暴露（见「通用」章的数据存储路径）。</p>\n<h3>预览</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>生成压缩预览</td><td><code>encryptPreviewEnabled</code></td><td>开关</td><td>开</td><td>加密图片视频时顺手生成压缩预览层，之后不解密就能看缩略图。<strong>下面三行是它的子项</strong>，关掉一起隐藏；改完要重载</td></tr><tr><td>预览长边</td><td><code>encryptPreviewSize</code></td><td>数字</td><td>384</td><td>预览图目标长边像素（64–1024，步进 16）；改完要重载（子项）</td></tr><tr><td>预览质量</td><td><code>encryptPreviewQuality</code></td><td>数字</td><td>0.5</td><td>JPEG 压缩质量（0.1–1）；改完要重载（子项）</td></tr><tr><td>预览自动加载原图</td><td><code>encryptAutoLoadOriginal</code></td><td>开关</td><td><strong>关</strong></td><td>开了打开预览即解密全部原图，明显变慢；明文短暂驻留内存，关闭时回收（子项）</td></tr></tbody></table>\n<h2>全部命令</h2>\n<table><thead><tr><th>命令</th><th>名称</th><th>做什么</th></tr></thead><tbody><tr><td><code>bz-encrypt-open</code></td><td>保险库</td><td>打开保险库面板</td></tr><tr><td><code>bz-encrypt-lock</code></td><td>加密当前笔记</td><td>把当前笔记（含附件）加密进库。<strong>注意 id 是 <code>-lock</code> 但功能是「加密」</strong>，历史遗留的命名错位（<code>src/main.ts:233</code> 注释）</td></tr><tr><td><code>bz-encrypt-lock-vault</code></td><td>锁定保险库</td><td>立即上锁，需要密码才能再进</td></tr></tbody></table>\n<p>密码本那三条命令（快速取密 / 快速生成密码 / 打开密码本）见「密码本」章；其中「快速取密」在复制密码后 <strong>60 秒自动清空剪贴板</strong>、不弹明文、不开面板（<code>src/main.ts:238</code>）。</p>\n<h2>边界、限制与坑</h2>\n<ul>\n<li><strong>主密码丢了就是永久丢失</strong>：不存储、无找回、无后门。这是设计，不是缺陷。</li>\n<li><strong>密文目录跟着数据存储路径走</strong>：改「数据存储路径」等于改了密文位置 —— <strong>已有密文不会自动搬迁</strong>，改之前先想好旧 <code>.ENCRYPT</code> 怎么处理。</li>\n<li><strong>旧版本密文位置不同</strong>：如果你曾在老版本用过默认的 <code>CONFIG/.ENCRYPT</code>，升级后新规则只在 <code>&lt;数据存储路径&gt;/.ENCRYPT</code> 找密文，保险库可能显示为空 —— 手工把旧目录密文移过去即可。</li>\n<li><strong>加密期间别编辑</strong>：附件加密与派生都要时间，这段窗口里对原文的改动有丢失风险。</li>\n<li><strong>预览的两种取向只能选一个</strong>：要快就用压缩预览，要清晰就开自动加载原图（并接受变慢与内存驻留）。</li>\n<li><strong>改预览相关设置要重载插件</strong>（三条子项都标了「改完要重载」）。</li>\n<li><strong>安全模式只防「忘锁」</strong>：它管的是关窗自动上锁，不管其他层面。</li>\n<li>「保险库」与「密码本」是同一个库、同一把锁，关一个不会只锁一半。</li>\n<li>外观两行目前各只有一个选项。</li>\n</ul>\n<h2>常见问题</h2>\n<p><strong>密码忘了还有救吗？</strong></p>\n<p>没有。请立刻确认是否有别的备份（加密前的原文副本、导出的备份）。这也是为什么面板第一条提醒就要你确认这一点。</p>\n<p><strong>加密后原笔记去哪了？</strong></p>\n<p>原文被密文替代（写进 <code>.ENCRYPT</code>）；要读就得先解锁保险库。</p>\n<p><strong>能不能只加密图片？</strong></p>\n<p>可以。附件是逐个加密的（各自独立 salt），图片视频都能进密文镜像；加密后靠压缩预览或解密原图来看。</p>\n<p><strong>为什么打开预览很慢？</strong></p>\n<p>看「预览自动加载原图」是不是开着 —— 它会一次性解密全部原图。介意就关掉它、改用压缩预览。</p>\n<p><strong>换电脑要注意什么？</strong></p>\n<p>把 <code>.ENCRYPT</code> 目录连同库一起复制过去，并且记住主密码。忘了密码，换多少台机器都打不开。</p>\n<p><strong>「安全模式」和手动锁定有什么区别？</strong></p>\n<p>安全模式是「关窗自动锁」，手动锁定（<code>bz-encrypt-lock-vault</code>）是「立刻锁」。两者可以一起用。</p>","no":30},{"id":"password-vault","title":"密码本","group":"安全","tags":["safe","password"],"domain":"password-vault","html":"<blockquote>存账号密码，跟保险库同一把锁；快速取密不用开面板</blockquote>\n<h2>什么时候用它</h2>\n<p>想把手上的账号密码收在一处、又不想交给第三方密码管理器时用它。它跟「保险库」是<strong>同一个库、同一把锁</strong>：条目存在保险库的加密清单里，锁定保险库时密码本一起锁。</p>\n<p>日常最常用的是<strong>快速取密</strong>：不解锁面板、不开窗口，搜到就复制到剪贴板（复制后 60 秒自动清空）。</p>\n<h2>数据放在哪</h2>\n<p>密码条目<strong>不是独立文件</strong>，是保险库清单里 <code>kind='password-vault'</code> 的条目（<code>src/password-vault/data.ts:8</code>）：</p>\n<table><thead><tr><th>字段</th><th>含义</th></tr></thead><tbody><tr><td><code>id</code></td><td>条目标识</td></tr><tr><td><code>platform</code></td><td>平台 / 站点名（同平台可有多条账号）</td></tr><tr><td><code>url</code></td><td>网址</td></tr><tr><td><code>account</code></td><td>账号</td></tr><tr><td><code>password</code></td><td>密码</td></tr><tr><td><code>note</code></td><td>备注</td></tr><tr><td><code>createdAt</code></td><td>创建时间</td></tr><tr><td><code>fav</code></td><td>是否收藏（旧数据缺这个字段时按 false 处理）</td></tr></tbody></table>\n<p>所以：<strong>密文在 <code>&lt;数据存储路径&gt;/.ENCRYPT/</code></strong>，主密码忘了同样永久打不开（见「保险库」章）。</p>\n<h2>第一次使用与解锁</h2>\n<ol>\n<li>第一次用要先在<strong>保险库</strong>里设主密码（见「保险库」章）。</li>\n<li>打开「密码本」（<code>bz-password-vault-open</code>）时输入主密码解锁；锁定后用「锁定」（<code>bz-password-vault-lock</code>）立刻上锁。</li>\n<li>开了「安全模式」，<strong>关闭密码本窗口就立即自动上锁</strong>。</li>\n</ol>\n<h2>存一条密码 / 找回一条密码</h2>\n<p>存：</p>\n<ol>\n<li>打开密码本面板 → 新增条目；</li>\n<li>填平台、网址、账号、密码、备注；想让它在列表里靠前，勾上收藏（<code>fav</code>）。</li>\n</ol>\n<p>找：</p>\n<ol>\n<li><strong>要快</strong>：用「快速取密」（<code>bz-password-vault-gen</code>）—— 模糊搜索现有密码，命中即复制、<strong>没有命中就直接生成一条新的</strong>（ADR-0158 统一流）；</li>\n<li><strong>要稳</strong>：打开面板，按平台或账号搜；</li>\n<li>复制后的剪贴板会在 <strong>60 秒</strong>后被清空，期间不弹明文、不开面板（<code>src/main.ts:238</code>）。</li>\n</ol>\n<h2>生成密码</h2>\n<p>两处入口，规则同一套：</p>\n<ul>\n<li><strong>快速生成密码</strong>（<code>bz-password-vault-quick-gen</code>）：不解锁、不开面板，直接生成并复制，同时记下「待存」状态 —— 下次解锁密码本时会自动弹出录入窗并预填这条密码；</li>\n<li><strong>快速取密</strong>里没命中时也会走生成。</li>\n</ul>\n<p>生成规则（「生成」组设置）：</p>\n<ul>\n<li><strong>字符集</strong> <code>passwordCharset</code>：默认是</li>\n</ul>\n<p><code>0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ~!@$%^&amp;*()_+</code></p>\n<p>—— 数字 + 大小写字母 + 一批符号（<strong>刻意不含 <code>-</code> <code>{</code> <code>}</code> 这类容易在表单里出问题的字符</strong>，<code>src/password-vault/data.ts:26</code>）；</p>\n<ul>\n<li><strong>长度</strong> <code>passwordLength</code>：默认 <strong>16</strong>，可填 4–128。</li>\n</ul>\n<h2>全部设置项</h2>\n<h3>外观</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>面板布局</td><td><code>passwordVaultSkin</code></td><td>卡片选择</td><td>default</td><td>切换面板布局（当前只有「三栏」）</td></tr><tr><td>面板主题</td><td><code>passwordVaultSkinTheme</code></td><td>卡片选择</td><td>gold</td><td>切换面板主题（当前只有「金印」）</td></tr></tbody></table>\n<h3>生成</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>密码生成字符集</td><td><code>passwordCharset</code></td><td>文本</td><td>见上（数字+大小写+符号）</td><td>随机生成密码用的字符集；改完要重载插件</td></tr><tr><td>密码生成长度</td><td><code>passwordLength</code></td><td>数字</td><td>16</td><td>生成多少个字符（4–128）；改完要重载插件</td></tr></tbody></table>\n<h3>安全</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>安全模式</td><td><code>securityMode</code> / <code>encryptSecurityMode</code></td><td>开关</td><td>—</td><td><strong>关闭密码本窗口立即自动上锁</strong>。与保险库共用同一对历史键（读时取其一为真，写时两个一起写）</td></tr></tbody></table>\n<h2>全部命令</h2>\n<table><thead><tr><th>命令</th><th>名称</th><th>做什么</th></tr></thead><tbody><tr><td><code>bz-password-vault-open</code></td><td>密码本</td><td>打开密码本面板（需解锁）</td></tr><tr><td><code>bz-password-vault-gen</code></td><td>快速取密</td><td>模糊搜现有密码：命中即复制；没命中就生成一条并复制。60 秒后清空剪贴板</td></tr><tr><td><code>bz-password-vault-quick-gen</code></td><td>快速生成密码</td><td>不解锁不开面板，直接生成并复制，并记下待存状态（下次解锁自动预填录入窗）</td></tr><tr><td><code>bz-password-vault-lock</code></td><td>锁定密码本</td><td>立即上锁</td></tr></tbody></table>\n<p><strong>注意 id 的坑</strong>：<code>bz-password-vault-gen</code> 是「快速取密」（搜到就复制），<code>bz-password-vault-quick-gen</code> 才是「快速生成」—— 两条命令只差一个 <code>quick</code>。</p>\n<h2>边界、限制与坑</h2>\n<ul>\n<li><strong>主密码忘了就全没了</strong>：跟保险库同一把锁、同一套密文，不存储、无找回。</li>\n<li><strong>锁是共享的</strong>：锁定保险库 = 锁定密码本；反过来也一样。</li>\n<li><strong>快速取密会\"搜不到就生成\"</strong>：没命中不是报错，而是直接给你一条新密码并记待存 —— 想只查不生成，就老老实实打开面板搜。</li>\n<li><strong>剪贴板 60 秒后自动清空</strong>：在这之前粘到别处是可以的，超时就没了。</li>\n<li><strong>字符集改了要重载插件</strong>：<code>passwordCharset</code> 与 <code>passwordLength</code> 都标了「改完要重载」。</li>\n<li><strong>字符集里别塞特殊符号</strong>：这是给各种表单用的，<code>-</code> <code>{}</code> 这类符号容易在注册页被判不合法。</li>\n<li><strong>收藏只影响排序</strong>：<code>fav</code> 不改变条目归属。</li>\n<li>外观两行目前各只有一个选项。</li>\n</ul>\n<h2>常见问题</h2>\n<p><strong>密码存在哪？是明文吗？</strong></p>\n<p>不是明文。它是保险库里的加密条目（<code>kind='password-vault'</code>），密文在数据存储路径的 <code>.ENCRYPT</code> 子目录里。</p>\n<p><strong>能不能只复制密码，不打开面板？</strong></p>\n<p>能，用「快速取密」—— 搜到就复制，不用开面板也不弹明文。</p>\n<p><strong>快速取密搜不到我的账号？</strong></p>\n<p>它会退化成\"给你生成一条新的\"（这是设计）。想精确找，就打开面板搜；也可以先把常用条目勾上收藏，列表里更好找。</p>\n<p><strong>生成的密码为什么没有 <code>-</code> 或 <code>{}</code>？</strong></p>\n<p>字符集刻意避开了这些容易在注册表单里出问题的符号。要别的字符集可以在「生成」组改，改完重载插件。</p>\n<p><strong>换电脑后密码还在吗？</strong></p>\n<p>在，只要 <code>.ENCRYPT</code> 目录跟库一起复制过去，并且记得主密码。</p>","no":31}];

      const frag = i<0 ? '' : t.slice(Math.max(0,i-24), i+40);
      return `<button class="bk-hit" data-go="${c.no-1}"><div>${c.title} <span class="where">${c.group}</span></div>` +
             (frag ? `<div class="where">…${esc(frag)}…</div>` : '') + '</button>';
    }).join('');
    $('#toc').insertAdjacentHTML('afterbegin', `<div class="bk-hits">${box||'<div class="where" style="padding:0 8px">没有命中</div>'}</div>`);
  }
  bind();
}
function match(c){ return (c.title + ' ' + textOf(c)).toLowerCase().includes(q.toLowerCase()); }
function bind(){
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => open(+b.dataset.go));
  document.querySelectorAll('[data-tag]').forEach(b => b.onclick = () => { tag = b.dataset.tag; renderToc(); });
}
function hl(html){
  if(!q) return html;
  return html.replace(new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')','gi'), '<mark>$1</mark>');
}
function open(i){
  cur = i; const c = CHAPTERS[i];
  $('#page').innerHTML = `<h1>${c.title}</h1>` + hl(c.html) +
    `<div class="bk-foot">第 ${c.no} / ${CHAPTERS.length} 章 · ${c.group}${c.tags.length?' · 标签：'+c.tags.join(' / '):''}</div>`;
  $('#page').scrollTop = 0;
  renderToc();
}
function prog(){
  const p = $('#page'), max = p.scrollHeight - p.clientHeight;
  $('#prog').style.width = (max<=0?100:Math.round(p.scrollTop/max*100)) + '%';
}
document.addEventListener('DOMContentLoaded', () => {
  $('#page').addEventListener('scroll', prog);
  $('#q').addEventListener('input', e => { q = e.target.value.trim(); renderToc(); });
  $('#theme').onclick = e => {
    const dark = document.documentElement.classList.toggle('theme-dark');
    e.target.textContent = dark ? '亮皮' : '暗皮';
    try { localStorage.setItem('bz-manual-theme', dark ? 'dark' : 'light'); } catch(_){}
  };
  try { if (localStorage.getItem('bz-manual-theme') === 'dark'){
    document.documentElement.classList.add('theme-dark'); $('#theme').textContent = '亮皮'; } } catch(_){}
  renderToc(); open(0);
});
</script>
</body>
</html>
