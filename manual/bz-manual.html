t;/&lt;联系人&gt;/voice.json</code></td><td>语音转写表（兼容兜底：正常情况下 <code>chat.json</code> 已回填转写，没有才读这个）</td></tr><tr><td><code>&lt;数据根目录&gt;/&lt;联系人&gt;/image_desc.json</code></td><td>图片描述表（同上，兼容兜底）</td></tr><tr><td><code>&lt;数据根目录&gt;/&lt;联系人&gt;/avatar.&lt;扩展名&gt;</code></td><td>头像文件</td></tr></tbody></table>\n<p><strong>一个联系人一个目录，聊天记录文件放在里面。</strong> 这份原始数据始终留在库外，插件只读它、不搬它。</p>\n<h3>库里存的是什么</h3>\n<p>脸谱的数据<strong>全部存在保险库里</strong> —— 每个联系人一条加密记录，里面装着这个人的：人物卡、聊天数据、生成任务进度、以及头像附件。</p>\n<p>这带来三个后果，用之前先想清楚：</p>\n<ul>\n<li><strong>它跟保险库、密码本共用同一把锁、同一个主密码。</strong> 保险库解锁时脸谱可读；一上锁，明文缓存立刻清空，什么都看不到。</li>\n<li><strong>主密码忘了 = 这些数据永久拿不回来。</strong> 没有找回通道，没有后门。想用脸谱，先把主密码记牢。</li>\n<li><strong>库里没有明文的人物文件了</strong>，所以没法用文本编辑器「打开看看」，一切都得在面板里看。</li>\n</ul>\n<blockquote><strong>媒体本体不进库</strong> —— 图片、语音、视频文件留在你的外部数据目录里，加密记录里只存消息文本和路径；唯一例外是头像，它以密文附件跟着记录走，显示时才在内存里解出来，<strong>不会在库里落成明文图片</strong>。所以「清空聊天数据」不会碰你的原始导出。</blockquote>\n<h2>可以调什么（设置项）</h2>\n<h3>数据源</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>数据根目录</td><td>空</td><td>导出工具产出的联系人数据根目录，<strong>粘贴完整路径</strong>（数据在库外，没有浏览按钮）。<strong>留空则面板上不显示数据源入口</strong>。换了目录要重新开数据源弹窗扫描，不会自动重扫</td></tr><tr><td>微信账号目录</td><td>空</td><td>数据目录下有多个微信账号文件夹时，指定用哪个；<strong>留空自动探测</strong></td></tr><tr><td>群聊纳入列表</td><td>关</td><td>打开后群聊会话（多位发送者）也进勾选列表</td></tr></tbody></table>\n<h3>聊天仓</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>语音转写</td><td>开</td><td>语音消息用转写出的文本进预览；关掉就不显示</td></tr><tr><td>图片描述</td><td>文件描述</td><td>有描述的图片以描述文本进时间线；选「仅标签」就只计数不打标签</td></tr><tr><td>视频标签</td><td>开</td><td>视频消息以时长标签进预览</td></tr><tr><td>系统消息</td><td>开</td><td>撤回、打招呼这类系统消息是否保留</td></tr></tbody></table>\n<h3>隐私</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>清空聊天数据</td><td>按钮</td><td>清掉各加密记录里的消息数据，<strong>要先解锁保险库</strong>；不动已经生成好的脸谱，也不动外部原始数据</td></tr></tbody></table>\n<h2>有哪些命令</h2>\n<table><thead><tr><th>命令名（去命令面板搜这个）</th><th>做什么</th></tr></thead><tbody><tr><td>脸谱</td><td>打开脸谱面板</td></tr><tr><td>脸谱数据源</td><td>扫描数据文件夹，弹出联系人勾选与导入</td></tr></tbody></table>\n<h2>要注意的地方</h2>\n<ul>\n<li><strong>数据根目录留空 = 面板上没有数据源入口</strong>。很多人以为「点了导入没反应」，其实是这一行还没填。</li>\n<li><strong>主密码就是脸谱的钥匙</strong>：它跟保险库、密码本共用一把锁。忘了主密码，所有脸谱数据永久拿不回来 —— 用之前先确认主密码有地方能查到。</li>\n<li><strong>上锁即清空</strong>：保险库一上锁，面板上的明文立即清掉，得重新解锁才看得到。</li>\n<li><strong>换目录要重扫</strong>：改了「数据根目录」不会自动重读，得重新开一次数据源弹窗。</li>\n<li><strong>画像不自动生成</strong>：导入完要在弹窗里点「画脸谱」，而且这一步要走 AI，消耗真实调用。</li>\n<li><strong>长记录是抽样提炼的</strong>：素材采集有字数与条数的上限、批数也有封顶，所以特别长的聊天记录是抽样后提炼的，不是逐条全文通读。</li>\n<li><strong>语音转写和图片描述依赖导出侧</strong>：基本靠你的导出工具预先回填好；没回填时它才会去找 <code>voice.json</code> / <code>image_desc.json</code> 兜底。</li>\n<li><strong>群聊默认不纳入</strong>：想导入群聊，先去设置里打开「群聊纳入列表」。</li>\n</ul>\n<h2>常见问题</h2>\n<p><strong>点了导入没反应 / 看不到数据源入口？</strong></p>\n<p>「数据根目录」是空的 —— 留空时面板不显示数据源入口。先把它填上（粘贴导出目录的完整路径）。</p>\n<p><strong>头像没显示出来？</strong></p>\n<p>头像是跟着加密记录走的密文附件。如果保险库上着锁，或者这个人是从旧版本迁过来的、当时没有头像文件，就显示不出来。重新导入一次通常就好了。</p>\n<p><strong>清空聊天数据会把聊天记录删掉吗？</strong></p>\n<p>不会。清的是加密记录里的消息数据；原始导出文件在你的外部目录里，重新导入就能再生成。而且这一步要先解锁保险库才能做。</p>\n<p><strong>保险库上了锁，脸谱打不开？</strong></p>\n<p>这是设计如此 —— 脸谱的数据就住在保险库里。先解锁保险库再看脸谱。</p>\n<p><strong>画像里的话是编的吗？</strong></p>\n<p>不是凭空编的：提炼阶段先采集素材（包含<strong>原话</strong>和场景），画像阶段才做归纳。但它是 AI 的归纳结果，仍建议当作参考，别当成事实记录。</p>\n<p><strong>清空预览会把聊天记录删掉吗？</strong></p>\n<p>不会。清的是库内的预览缓存；原始数据在你的外部目录里，重新导入就能再生成。</p>\n<p><strong>群聊里人太多，只想看个别几个？</strong></p>\n<p>导入是勾选制的，不勾就不进。群聊默认不纳入，得先打开「群聊纳入列表」。</p>\n<p><strong>换了新手机重新导出，怎么更新？</strong></p>\n<p>覆盖外部数据目录里的文件，然后重新执行一次导入。</p>\n<p><strong>为什么导入完了还没有画像？</strong></p>\n<p>画像是手动触发的 —— 导入完成后在弹窗里点<strong>画脸谱</strong>。这一步要走 AI，所以也要先确认「AI」页已经配好。</p>","no":17},{"id":"auto-summary","title":"自动摘要","group":"收集","tags":["collect","ai"],"domain":"auto-summary","html":"<blockquote>每篇新剪藏自动带一段摘要和几个标签 —— 以后扫列表就知道这篇讲的啥，不用点进去</blockquote>\n<h2>什么时候用它</h2>\n<p>剪藏的文章攒多了，想「每篇都有个摘要可以扫一眼」时开它。</p>\n<p>它是<strong>剪藏本的附属能力</strong>：开关在剪藏本的设置里，产物写在剪藏笔记的最上面。所以它只对<strong>剪藏进来的文章</strong>生效，你自己写的笔记不受影响。</p>\n<p>唯一的代价：<strong>每生成一篇就消耗一次 AI 调用</strong>。一次导入 50 篇就是 50 次。</p>\n<p>它跟「剪藏阅读报告」的分工：自动摘要是<strong>给单篇文章</strong>写摘要；阅读报告是<strong>统计你读了多少、读了什么</strong>。</p>\n<h2>怎么用</h2>\n<ol>\n<li>打开<strong>设置面板</strong> → 收集 → <strong>剪藏本</strong>，往下找到<strong>自动摘要</strong>这一组。</li>\n<li>打开<strong>自动摘要</strong>开关（默认是关的）。打开后下面四行会展开。</li>\n<li>选<strong>摘要长度</strong>：简短（50–100 字）/ 标准（150–250 字）/ 详细（300–400 字）。</li>\n<li>选<strong>摘要时机</strong>（见下面那张表，这一条最影响你的账单）。</li>\n<li>想让文章带标签就把<strong>生成标签</strong>打开，标签个数用<strong>标签数量</strong>写成区间，比如 <code>3-6</code>。</li>\n<li>完事。之后新进来的剪藏会自己带摘要。</li>\n</ol>\n<p><strong>改了设置立刻生效</strong>，不用重启插件。</p>\n<h3>摘要时机怎么选</h3>\n<table><thead><tr><th>时机</th><th>什么时候生成</th><th>适合谁</th></tr></thead><tbody><tr><td>保存后立刻</td><td>文章一进库就生成</td><td>剪藏量不大、想进库就有摘要</td></tr><tr><td>懒触发（打开时）</td><td>你<strong>打开那篇文章</strong>时才生成</td><td>经常批量导入，不想一进库就烧一堆调用</td></tr></tbody></table>\n<h3>给旧文章补摘要</h3>\n<p>开关打开之前就已经在库里的文章，不会自动补。想补就：打开那篇文章，命令面板搜 <strong>重新生成当前剪藏摘要</strong>。</p>\n<p>这条命令是<strong>强制重写</strong>：不管原来有没有摘要，都会把 <code>summary</code> 和 <code>tags</code> 重新生成一遍。你手写的<strong>标题不会被改动</strong>。</p>\n<h2>数据放在哪</h2>\n<p>摘要写在哪？写在<strong>剪藏笔记最开头的信息区</strong>（就是笔记最上面 <code>---</code> 之间那几行）。它只动这三个字段：</p>\n<table><thead><tr><th>字段</th><th>是什么</th><th>你要留意什么</th></tr></thead><tbody><tr><td><code>title</code></td><td>标题</td><td>手动重跑也<strong>不会动你手写的标题</strong></td></tr><tr><td><code>summary</code></td><td>摘要正文</td><td>手动重跑会被覆盖</td></tr><tr><td><code>tags</code></td><td>生成的中文标签</td><td>手动重跑会被覆盖</td></tr></tbody></table>\n<p><strong>别的字段它一个都不碰。</strong> 你在信息区里写的其他内容，连同它们的附属行，都会原样保留。</p>\n<h2>可以调什么（设置项）</h2>\n<p>设置都在「剪藏本 → 自动摘要」这一组里 —— <strong>这一域没有独立的设置页</strong>，这是刻意安排的，别去找单独的「自动摘要」页面。</p>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>自动摘要</td><td>关</td><td>总开关。关掉时下面四行一起收起</td></tr><tr><td>摘要长度</td><td>标准（150–250 字）</td><td>简短（50–100 字）/ 标准（150–250 字）/ 详细（300–400 字）。只影响<strong>新生成</strong>的，已有的不变</td></tr><tr><td>生成标签</td><td>开</td><td>要不要顺带生成中文标签</td></tr><tr><td>标签数量</td><td><code>3-6</code></td><td>生成几个标签，写成区间。只有打开了「生成标签」才显示</td></tr><tr><td>摘要时机</td><td>保存后立刻</td><td>保存后立刻 / 懒触发（打开时）。<strong>切换即时生效</strong>，不用重启</td></tr></tbody></table>\n<h2>有哪些命令</h2>\n<table><thead><tr><th>命令名（去命令面板搜这个）</th><th>做什么</th></tr></thead><tbody><tr><td>重新生成当前剪藏摘要</td><td>对当前打开的剪藏笔记强制重建摘要与标签（只动 <code>summary</code> / <code>tags</code>，不动标题）</td></tr></tbody></table>\n<h2>要注意的地方</h2>\n<ul>\n<li><strong>它只管新进来的文章。</strong> 开开关之前已在库里的剪藏不会自动补，得逐篇手动重跑。</li>\n<li><strong>「保存后立刻」这一档会烧调用</strong>：批量导入前想清楚 —— 一次导 50 篇就是 50 次调用。不确定就先用「懒触发」。</li>\n<li><strong>手动重跑会覆盖旧摘要</strong>，这是它的本意（跳过「已有就不动」的检查直接重写）。</li>\n<li><strong>标题永远不动</strong>，哪怕重跑也保持你手写的值。</li>\n<li><strong>正文太短不生成</strong>：不足 100 字会跳过；如果是你手动点的重跑，会提示你「正文过短」。</li>\n<li><strong>批量跑完会给一条汇总通知</strong>，不是静悄悄的。</li>\n</ul>\n<h2>常见问题</h2>\n<p><strong>开了开关但旧文章没摘要？</strong></p>\n<p>正常 —— 它只管新进来的。旧文章打开后手动执行「重新生成当前剪藏摘要」。</p>\n<p><strong>摘要时机选哪个好？</strong></p>\n<p>导入量大选「懒触发（打开时）」；少量精选选「保存后立刻」。</p>\n<p><strong>生成的标签能改吗？</strong></p>\n<p>能。标签就是笔记最上面信息区里的 <code>tags</code>，直接编辑就行；但下次手动重跑会被覆盖。</p>\n<p><strong>摘要太长 / 太短？</strong></p>\n<p>调「摘要长度」三档。它只影响新生成的，已有的摘要不变。</p>\n<p><strong>会把我信息区里别的字段冲掉吗？</strong></p>\n<p>不会。它只认 <code>title</code> / <code>summary</code> / <code>tags</code> 三个字段，其余原样保留。</p>\n<p><strong>为什么有些文章一直没有摘要？</strong></p>\n<p>先确认它是不是剪藏笔记（自己写的笔记不归它管），再看正文是不是太短（不足 100 字会跳过）。</p>","no":18},{"id":"clipping","title":"剪藏本","group":"收集","tags":["collect","clipping"],"domain":"clipping","html":"<blockquote>每天自动喂你一批能读的东西：先在未读流里翻，中意的再存成剪藏笔记</blockquote>\n<h2>什么时候用它</h2>\n<p>不想自己到处找东西看的时候用它。四个来源按你设的间隔自动抓，抓回来的先进<strong>未读流</strong>；你在里面翻，看着中意的存成正式剪藏笔记，其余标记已读或直接删掉。</p>\n<p>不适合：想精确控制每篇文章原文的场景 —— 它存的是标题、摘要、链接和正文转写，不是全文抓取器。</p>\n<p>一句话对比：<strong>收藏本是你手动攒的工具抽屉，剪藏本是自动上门的读物。</strong></p>\n<h2>怎么用</h2>\n<p><strong>收 → 读 → 存 → 清流 → 看报告</strong>，五步：</p>\n<ol>\n<li><strong>收</strong>：到点自动抓（间隔由「抓取间隔」决定）。想马上来一轮，就执行 <strong>「剪藏本抓取新文章」</strong>。</li>\n<li><strong>读</strong>：打开 <strong>「剪藏本」</strong> 面板，左栏选来源，中栏选条目，右侧是阅读面。嫌字小或太大，去设置里改「阅读字号」，改完立刻生效。</li>\n<li><strong>存</strong>：在条目上「保存到剪藏本」→ 生成正式的剪藏笔记（正文里的图片按需同步存到图片文件夹）。</li>\n<li><strong>清流</strong>：「标记为已读」让它不再出现在未读流；不想看就删除。想一次清干净，用 <strong>「未读全部标为已读」</strong>。</li>\n<li><strong>看成绩</strong>：执行 <strong>「剪藏阅读报告」</strong> 看看自己读了些什么。</li>\n</ol>\n<p>条目上的常用动作：打开笔记、复制双链、复制原文链接、重新生成摘要（已经存成笔记的那些）、删除。</p>\n<h2>四个抓取源</h2>\n<table><thead><tr><th>来源</th><th>抓什么</th><th>要不要配置</th><th>你要留意什么</th></tr></thead><tbody><tr><td>知乎日报</td><td>每日文章</td><td>不用</td><td>只看最近 24 小时窗口内的文章</td></tr><tr><td>果壳科学人</td><td>最新文章</td><td>不用</td><td>同样是 24 小时窗口</td></tr><tr><td>B站 UP 动态</td><td>名单里每位 UP 主最近的动态</td><td>需要填名单</td><td>抓的是「动态」不是视频本体；每位抓多少由「B站抓取条数」定。被风控或抓取失败会弹通知告诉你，不会默默失败</td></tr><tr><td>RSS 订阅</td><td>每个订阅源最近的文章</td><td>需要填订阅源</td><td>每个源最多保留最近 30 条</td></tr></tbody></table>\n<p><strong>名单为空的源就整路跳过</strong>，不算报错。去重口径是「网址 + 标题」双去重，每条都带上抓取时间。</p>\n<h2>数据放在哪</h2>\n<table><thead><tr><th>位置</th><th>里面是什么</th><th>你要留意什么</th></tr></thead><tbody><tr><td>数据目录下的 <code>news.json</code></td><td><strong>未读流</strong>：抓回来待读的条目（来源、标题、链接、抓取时间），以及源开关、UP 名单、抓取间隔这些配置</td><td>这个是本域的主数据文件，备份时别漏了</td></tr><tr><td>数据目录下的 <code>clipbook.json</code></td><td><strong>侧写</strong>：条目的覆盖信息、保存过的图片记录、待升级文献笔记的记录、阅读流水</td><td>它装的是「正文之外的补充状态」</td></tr><tr><td>剪藏文件夹（默认 <code>归档/网页剪藏</code>）</td><td>正式剪藏笔记，一篇一个 <code>.md</code> 文件</td><td>这些是普通笔记，你随时可以自己编辑</td></tr><tr><td>图片文件夹（默认 <code>&lt;剪藏文件夹&gt;/assets</code>）</td><td>保存正文图片时的落地点</td><td>留空就落到剪藏文件夹下的 <code>assets</code></td></tr></tbody></table>\n<p>三者的分工很好记：<code>news.json</code> 是<strong>还没读的</strong>，剪藏笔记是<strong>你决定留下的</strong>，<code>clipbook.json</code> 是<strong>这两者之外的补充状态</strong>。</p>\n<h2>可以调什么（设置项）</h2>\n<h3>外观</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>面板布局</td><td>编辑部</td><td>只有这一档，暂无别的可选</td></tr><tr><td>面板主题</td><td>新闻纸</td><td>只有这一档，暂无别的可选</td></tr></tbody></table>\n<h3>显示</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>阅读字号</td><td>中（另有小 / 大）</td><td>桌面端右侧阅读面的正文字号，改完立即生效</td></tr></tbody></table>\n<h3>目录</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>剪藏文件夹</td><td><code>归档/网页剪藏</code></td><td>正式剪藏笔记落在哪。<strong>改了不搬旧笔记</strong>，老的还留在原目录</td></tr><tr><td>图片文件夹</td><td>空</td><td>网页图片存哪。留空就落到「剪藏文件夹」下的 <code>assets</code></td></tr></tbody></table>\n<h3>自动摘要</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>自动摘要</td><td>开</td><td>新入库的文章自动跑一遍 AI 摘要。关掉之后，下面四行会一起收起来（它们只在开着时才有意义）</td></tr><tr><td>摘要长度</td><td>标准（150–250 字）</td><td>另有简短（50–100 字）和详细（300–400 字）</td></tr><tr><td>生成标签</td><td>开</td><td>顺便为剪藏生成中文标签</td></tr><tr><td>标签数量</td><td><code>3-6</code></td><td>填一个区间，比如 <code>3-6</code>。只在打开了「生成标签」时出现</td></tr><tr><td>摘要时机</td><td>保存后立刻</td><td>另有「懒触发（打开时）」。改了即时生效，不用重启插件</td></tr></tbody></table>\n<h3>数据源</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>立即抓取</td><td>按钮</td><td>点「抓取」立刻跑一轮，不用等间隔。范围是所有启用的源，名单为空的源跳过。这步只发网络请求、不调 AI，不产生费用</td></tr><tr><td>抓取间隔</td><td>30 分钟</td><td>自动抓取的最小间隔。另有 1 小时 / 2 小时 / 6 小时</td></tr><tr><td>知乎日报</td><td>开</td><td>关掉就不抓这个源</td></tr><tr><td>果壳科学人</td><td>开</td><td>关掉就不抓这个源</td></tr><tr><td>UP 主名单</td><td>按钮「管理」</td><td>点进去增删 B站 UP 主，行描述里显示当前跟踪了几位</td></tr><tr><td>RSS 订阅源</td><td>按钮「管理」</td><td>点进去增删订阅源，行描述里显示当前订阅了几个</td></tr><tr><td>B站抓取条数</td><td>10</td><td>每位 UP 主抓多少条动态，范围 1–50</td></tr><tr><td>文章保留天数</td><td>30 天</td><td>已读文章的数据保留多久，范围 1–3650 天</td></tr></tbody></table>\n<h2>有哪些命令</h2>\n<table><thead><tr><th>命令名（去命令面板搜这个）</th><th>做什么</th></tr></thead><tbody><tr><td>剪藏本</td><td>打开剪藏本面板</td></tr><tr><td>剪藏本抓取新文章</td><td>立刻跑一轮抓取，不用等间隔</td></tr><tr><td>未读全部标为已读</td><td>清空未读流（条目不删，只是不再算未读）</td></tr><tr><td>剪藏阅读报告</td><td>打开「我读了什么」的报告层</td></tr></tbody></table>\n<h2>要注意的地方</h2>\n<ul>\n<li><strong>知乎和果壳只看最近 24 小时。</strong> 窗口外的旧文章不会补抓 —— 所以好几天没开 Obsidian，这段时间的日报就漏了，没法回头补。</li>\n<li><strong>B站抓的是「动态」，不是视频本体。</strong> 想要完整视频内容的别在这儿找。</li>\n<li><strong>每个 RSS 源只留最近 30 条。</strong> 更新特别快的源，早于窗口的会被裁掉。</li>\n<li><strong>改剪藏文件夹不搬旧笔记。</strong> 新笔记进新目录，老的留在原地。</li>\n<li><strong>「标记为已读」和「删除」是两回事。</strong> 已读只是不再出现在未读流，数据还留着（留多久看「文章保留天数」）；删除是真的从流里去掉。</li>\n<li><strong>被风控会通知你。</strong> 豆瓣、B站这类拦截不会默默失败，会弹出来提醒。</li>\n<li><strong>抓取不等人。</strong> 间隔到点就抓；「文章保留天数」只管已读数据能留多久，它跟抓取窗口没关系。</li>\n<li>外观那两项目前各自只有一个选项。</li>\n</ul>\n<h2>常见问题</h2>\n<p><strong>怎么抓不到新文章了？</strong></p>\n<p>按顺序查：① 「抓取间隔」是不是还没到（急着看就点「立即抓取」）；② 对应的源开关打开没有；③ 是 B站／RSS 的话，名单是不是空的（空名单 = 整路跳过）；④ B站的话看有没有收到风控通知，有的话去配 B站 Cookie。</p>\n<p><strong>保存下来的笔记在哪？</strong></p>\n<p>在「剪藏文件夹」里，默认是 <code>归档/网页剪藏</code>。想换个地方，去设置改这一行 —— 但已经存好的不会自己搬。</p>\n<p><strong>自动摘要会不会覆盖我手写的摘要？</strong></p>\n<p>不会。它只管新进来的文章，已经有摘要的不受影响。</p>\n<p><strong>阅读报告统计的是什么？</strong></p>\n<p>统计的是你读过的剪藏文章和书签文章的阅读流水。跟书库那边的「阅读分析报告」（统计的是书）不是一回事。</p>\n<p><strong>「文章保留天数」设成 1 天会怎样？</strong></p>\n<p>已读数据只留一天，报告里的历史会明显变短。未读流里的条目不受它影响。</p>\n<p><strong>自动摘要要不要花钱？</strong></p>\n<p>开着的时候，每一篇新入库的文章会消耗一次 AI 调用。不想花就关掉「自动摘要」那一行；之后再想要，可以在单篇上手动重新生成。</p>","no":19},{"id":"favorites","title":"收藏本","group":"收集","tags":["collect","favorites"],"domain":"favorites","html":"<blockquote>自己攒的一个链接／条目抽屉：打自定义标签、能置顶、能归档</blockquote>\n<h2>什么时候用它</h2>\n<p>想攒一份「以后肯定还要用」的清单时用它 —— 常去的工具网址、反复用到的软件、想分门别类收着的东西。</p>\n<p>它和剪藏本的分工很清楚：</p>\n<table><thead><tr><th></th><th>收藏本</th><th>剪藏本</th></tr></thead><tbody><tr><td>谁加的</td><td>你手动加（也可以关联笔记）</td><td>自动从四个源抓回来</td></tr><tr><td>长什么样</td><td>卡片 + 自定义标签</td><td>未读流 + 存成剪藏笔记</td></tr><tr><td>适合放</td><td>工具网址、要反复用的东西、想分类的东西</td><td>每天要读的文章</td></tr></tbody></table>\n<p>一句话：<strong>想攒工具网址用收藏本，想读新闻用剪藏本。</strong></p>\n<h2>怎么用</h2>\n<ol>\n<li>打开命令面板，搜 <strong>「收藏本」</strong>，打开面板。</li>\n<li>搜 <strong>「加收藏」</strong> 新增一条；也可以从别的域往这儿塞（关联笔记的路径会自动记下来）。</li>\n<li>每张卡片上可以：打开、复制网址、置顶／取消置顶、编辑、归档／取消归档、删除。</li>\n<li>顶部的标签磁贴用来筛选：</li>\n</ol>\n<ul>\n<li><strong>全部</strong> ／ <strong>已归档</strong>；</li>\n<li>你自己建的那些标签磁贴；</li>\n<li>「记住上次」这一档 —— 选了它，下次打开会回到你上次看的那个标签。</li>\n</ul>\n<ol>\n<li>排序有三种：最新收藏 / 最早收藏 / 按标题。<strong>但置顶的条目永远排在最前面</strong>，跟排序方式无关。</li>\n</ol>\n<h3>标签怎么弄</h3>\n<p>标签是这个域的灵魂，管理入口在设置里：</p>\n<ol>\n<li>打开设置 →「收藏本」→「标签管理」组（这一行是域内自己画的管理列表，不是普通的下拉框）。</li>\n<li>在里面<strong>增、删、改名、调顺序</strong>。</li>\n<li>改完定义，面板上的筛选磁贴立刻跟着变。</li>\n<li>没有自定义过标签时，它会先用内置的九类默认标签。</li>\n</ol>\n<p>有一点要留意：<strong>条目的归类由它身上的第一个标签决定。</strong> 想挪一串卡片的组，调标签顺序最直接。</p>\n<h2>数据放在哪</h2>\n<table><thead><tr><th>位置</th><th>里面是什么</th><th>你要留意什么</th></tr></thead><tbody><tr><td>数据目录下的 <code>favorites.json</code></td><td>全部收藏条目</td><td>备份、换电脑时带走这一个文件就够了</td></tr></tbody></table>\n<p>每条收藏大致记着：标题、说明、网址、标签、是否置顶、创建时间、是否归档和归档时间，以及可选的关联笔记。</p>\n<h2>可以调什么（设置项）</h2>\n<h3>外观</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>面板布局</td><td>标签工作台</td><td>只有这一档，暂无别的可选</td></tr><tr><td>面板主题</td><td>亚麻</td><td>只有这一档，暂无别的可选</td></tr></tbody></table>\n<h3>显示</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>打开默认筛选</td><td>全部</td><td>打开面板时默认停在哪个标签上。另有「记住上次」，以及你自定义的每个标签</td></tr><tr><td>默认排序</td><td>最新收藏</td><td>另有「最早收藏」「按标题」可选</td></tr></tbody></table>\n<h3>标签管理</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>标签管理</td><td>内置九类默认标签</td><td>在这里增删改排序标签定义。选项会直接变成面板上的筛选磁贴</td></tr></tbody></table>\n<h2>有哪些命令</h2>\n<table><thead><tr><th>命令名（去命令面板搜这个）</th><th>做什么</th></tr></thead><tbody><tr><td>收藏本</td><td>打开收藏本面板</td></tr><tr><td>加收藏</td><td>新增一条收藏</td></tr></tbody></table>\n<h2>要注意的地方</h2>\n<ul>\n<li><strong>置顶比排序更优先。</strong> 不管你选哪种排序方式，置顶的条目都压在最前面。</li>\n<li><strong>删标签不等于删数据。</strong> 标签被删掉后，条目里残留的旧标签名还在数据里，只是面板上没有对应磁贴了 —— 想彻底清掉，得在条目上改标签。</li>\n<li><strong>标签顺序会影响卡片归组和磁贴排列</strong>，想调整就去「标签管理」里拖。</li>\n<li><strong>「记住上次」是个特殊档</strong>：选了它，下次打开会回到上次停的那个标签，而不是「全部」。</li>\n<li><strong>归档是冷存。</strong> 归档后的条目不再出现在正常视图里，要从「已归档」入口翻。</li>\n</ul>\n<h2>常见问题</h2>\n<p><strong>收藏和剪藏到底有什么区别？</strong></p>\n<p>收藏是你手动攒的清单（网址、条目都行），剪藏是自动抓回来的文章。一个「我要留着」，一个「我还没读」。</p>\n<p><strong>怎么给收藏分类？</strong></p>\n<p>先去设置 →「标签管理」建好标签，然后在条目上选标签。记住：第一个标签决定它归在哪一组。</p>\n<p><strong>删掉一个标签，已经用上的条目会怎样？</strong></p>\n<p>条目上的标签名还在数据里，但面板找不到对应的筛选磁贴了。想彻底清干净，得逐条改标签。</p>\n<p><strong>怎么把一条收藏关联到某篇笔记？</strong></p>\n<p>从笔记那边发起收藏，会自动带上关联；收藏条目本身也存着关联笔记的字段。</p>\n<p><strong>标签顺序能调吗？</strong></p>\n<p>能。「标签管理」里支持排序，顺序既影响磁贴排列，也影响卡片归组。</p>\n<p><strong>换电脑收藏还在吗？</strong></p>\n<p>在，全在 <code>favorites.json</code> 里。跟着库同步过去就行。</p>","no":20},{"id":"bookshelf","title":"书库","group":"媒体与阅读","tags":["media","books"],"domain":"bookshelf","html":"<blockquote>把在读的书摆成一面封面墙，连 EPUB 的进度和划线一起看</blockquote>\n<h2>什么时候用它</h2>\n<p>想让「我在读什么 / 已经读完哪些」一目了然的时候用它。</p>\n<p>它读两类书：</p>\n<ul>\n<li><strong>普通书目笔记</strong>：书库目录里、开头信息区（就是笔记最上面 <code>---</code> 之间那几行）带书标签的笔记；</li>\n<li><strong>EPUB</strong>：读取 Weave 插件存在 <code>weave-data.json</code> 里的阅读数据（进度、划线、想法）。</li>\n</ul>\n<p>所以它自己不产生阅读数据 —— 只是把这些摆到一面墙上，并给「继续在读」这类动作提供入口。</p>\n<p>跟日记本的关系：书库里有读完日期或开读日期的书，会同时出现在日记本那面墙上。</p>\n<h2>怎么用</h2>\n<ol>\n<li>打开命令面板，搜 <strong>「书库」</strong>，打开书架墙（再执行一次是关闭）。</li>\n<li>墙上是书脊和封面；侧栏按状态筛（全部 / 在读 / 未读 / 已读），默认停在哪一格由「默认筛选」决定。</li>\n<li>点一本书进详情：基本信息、进度、划线（EPUB 的书能按章节看到划线和想法）。</li>\n<li>想直接回到正在读的那本，执行 <strong>「继续在读」</strong> —— 一本在读的都没有时会明确提示你。</li>\n<li>面板里还能切到阅读分析视图；用命令 <strong>「阅读分析报告」</strong> 也能直达。</li>\n</ol>\n<h3>加一本书</h3>\n<ol>\n<li>在书库文件夹里建一篇笔记，开头信息区写上 <code>tags</code>，标签里要有书标签（默认是 <code>book</code>），再补上书名、作者这些字段。</li>\n<li>想要封面，就在同一个目录放一张跟书同名的图片（<code>jpg</code> / <code>png</code> / <code>webp</code> / <code>gif</code> 都认）。</li>\n<li><strong>EPUB 不用手动加</strong>：你用 Weave 插件读，读完的数据落在 <code>weave-data.json</code>，书库自己就会在墙上显示出来。</li>\n</ol>\n<h3>读书与记笔记</h3>\n<ul>\n<li><strong>书目笔记</strong>：正常在笔记里写就行，划线、摘录、读后感都是笔记正文的一部分。</li>\n<li><strong>EPUB</strong>：划线和想法由 Weave 写进 <code>weave-data.json</code>，书库能直接<strong>按章节分组</strong>把它们在面板里渲染出来 —— 也就是说 EPUB 的读书笔记<strong>不会落成单独的 <code>.md</code> 文件</strong>，想长期留档得自己摘出来。</li>\n</ul>\n<h2>数据放在哪</h2>\n<table><thead><tr><th>位置</th><th>里面是什么</th><th>你要留意什么</th></tr></thead><tbody><tr><td>书库文件夹（默认 <code>书库</code>）</td><td>书目笔记，每本一篇 <code>.md</code></td><td>开头信息区的 <code>tags</code> 里<strong>必须有书标签</strong>（默认 <code>book</code>）才被认作书。目录本身写成一个笔记（比如 <code>书库.md</code>）也算数</td></tr><tr><td>书库目录内</td><td>封面图片</td><td>必须跟书同名，名字对不上就显示不出来</td></tr><tr><td>数据目录下的 <code>weave-data.json</code></td><td>EPUB 的阅读进度、划线、想法</td><td>这个文件是 <strong>Weave 插件写的</strong>，书库只读不改</td></tr></tbody></table>\n<p><strong>书的状态是从两个日期推出来的，不是单独记的：</strong></p>\n<table><thead><tr><th>条件</th><th>状态</th></tr></thead><tbody><tr><td>有开读日期、没有读完日期</td><td>在读</td></tr><tr><td>两个都有</td><td>已读</td></tr><tr><td>其他情况</td><td>未读</td></tr></tbody></table>\n<h2>可以调什么（设置项）</h2>\n<h3>外观</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>面板布局</td><td>书架墙</td><td>只有这一档，暂无别的可选</td></tr><tr><td>面板主题</td><td>雪松白</td><td>另有黑金夜曲 / 牛皮手帐 / 丝绒剧院 / 极简黑白，切换即时生效</td></tr></tbody></table>\n<h3>目录</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>书库文件夹</td><td><code>书库</code></td><td>书目笔记从这里读。<strong>改了不搬旧笔记</strong>，老的书留在原目录</td></tr></tbody></table>\n<h3>显示</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>默认筛选</td><td>全部</td><td>打开面板时侧栏选中的那格：全部 / 在读 / 未读 / 已读</td></tr><tr><td>默认排序</td><td>最近读完</td><td>另有「时长最长」「书名」可选</td></tr></tbody></table>\n<h2>有哪些命令</h2>\n<table><thead><tr><th>命令名（去命令面板搜这个）</th><th>做什么</th></tr></thead><tbody><tr><td>书库</td><td>打开／关闭书架墙</td></tr><tr><td>继续在读</td><td>直接跳到正在读的那本</td></tr><tr><td>阅读分析报告</td><td>打开书库墙里的阅读分析视图（见「阅读报告」章）</td></tr></tbody></table>\n<h2>要注意的地方</h2>\n<ul>\n<li><strong>没有书标签就不上墙。</strong> 笔记开头信息区的 <code>tags</code> 里没有书标签（默认 <code>book</code>），它就当这不是一本书。这是「我的书没出现」最常见的原因。</li>\n<li><strong>状态全靠两个日期推。</strong> 缺一个就判断偏：想让某本变成「在读」，就补上开读日期、把读完日期删掉。</li>\n<li><strong>EPUB 的数据归 Weave 管。</strong> 没装、没用 Weave，就没有 EPUB 条目 —— 书库这边无能为力。</li>\n<li><strong>EPUB 的划线想法不落 md。</strong> 它们按章节渲染在面板里，不会写进你的笔记。想留档得自己摘出来。</li>\n<li><strong>封面靠同名图片。</strong> 文件名对不上就只有占位。</li>\n<li><strong>改书库文件夹不搬笔记。</strong> 旧目录里的书不会自动过来。</li>\n</ul>\n<h2>常见问题</h2>\n<p><strong>我的书怎么没出现在墙上？</strong></p>\n<p>两步查：① 笔记在不在「书库文件夹」里；② 开头信息区的 <code>tags</code> 里有没有书标签（默认 <code>book</code>）。</p>\n<p><strong>状态怎么一直是「未读」？</strong></p>\n<p>状态是从「开读日期」和「读完日期」推出来的 —— 两个都没有就是未读。想标成在读，至少填个开读日期。</p>\n<p><strong>EPUB 怎么才会进书库？</strong></p>\n<p>用 Weave 插件读，阅读数据落进 <code>weave-data.json</code>，书库自动读到，不用你手动加。</p>\n<p><strong>「继续在读」说没有在读的书？</strong></p>\n<p>说明它筛出来的在读集合是空的。去检查：这些书填了开读日期吗？有没有误填了读完日期？</p>\n<p><strong>阅读报告在哪？</strong></p>\n<p>就在书架墙内的报告视图里，命令是「阅读分析报告」。注意它统计的是<strong>书</strong>，跟剪藏本那个统计文章的是两份报告。</p>\n<p><strong>书封面显示不出来怎么办？</strong></p>\n<p>在同目录放一张跟笔记同名的图片（如 <code>三体.png</code> 对 <code>三体.md</code>），名字必须严丝合缝。</p>","no":21},{"id":"cinema","title":"影院","group":"媒体与阅读","tags":["media","cinema"],"domain":"cinema","html":"<blockquote>把看过的影视做成一面海报墙：按季合成一张卡，选择困难时随机抽一部</blockquote>\n<h2>什么时候用它</h2>\n<p>想记「看过什么、打几分」，并且喜欢看海报墙的时候用它。</p>\n<p>数据就是一篇篇普通笔记，插件负责把它们读成条目、去豆瓣抓字段、按状态和评分组织成一面墙。</p>\n<p>适合：记录观影和追剧进度，攒一份能来回翻的观影史。</p>\n<p>不适合：只想列个待看清单 —— 那用备忘录更轻。</p>\n<p>跟日记本的关系：影视笔记写了影评或观影日期的，会同时出现在日记本那面墙上（两个域读同一个目录）。</p>\n<h2>怎么用</h2>\n<h3>录入一部片子</h3>\n<ol>\n<li>打开命令面板，执行 <strong>「加影视」</strong>。</li>\n<li>输入片名搜索 —— 搜到之后自动去抓豆瓣字段（评分、导演、主演、类型、地区、片长等）。</li>\n<li>抓回来的海报存进海报文件夹，笔记写进影视文件夹。</li>\n<li>想补自己的话，直接在笔记的 <code>影评</code> 那一行写。</li>\n</ol>\n<p>豆瓣字段的抓取需要凭据（在 AI 面板的「数据源凭据」组里填）：</p>\n<ul>\n<li><strong>ApiZero Key</strong>：用来补齐评分、导演、主演、类型、地区、片长这些字段。不填会走内置的演职员信息兜底，能取多少算多少。</li>\n<li><strong>豆瓣 Cookie</strong>：平时不用填；豆瓣开始拦搜索时才需要，被拦会弹通知告诉你。</li>\n</ul>\n<h3>打开海报墙</h3>\n<ol>\n<li>执行 <strong>「影院」</strong>，打开面板。主区就是海报墙，固定 <strong>5 列</strong>。</li>\n<li>顶部和侧边有：搜索、按状态筛选（想看 / 在看 / 已看）、排序。默认用哪套排序和筛选，在设置里配。</li>\n<li>点一张卡片进详情，能看到抓回来的字段和你写的影评。</li>\n<li><strong>「随机抽一部」</strong>：选择困难时用，从库里随缘挑一部。</li>\n<li><strong>「影视分析报告」</strong>：打开内嵌的一页统计，看过了多少、评分分布、片长和季集这些。</li>\n</ol>\n<h2>数据放在哪</h2>\n<table><thead><tr><th>位置</th><th>里面是什么</th><th>你要留意什么</th></tr></thead><tbody><tr><td>影视文件夹（默认 <code>我的/影视</code>）</td><td>影视条目，一部一来一篇笔记</td><td><strong>和日记本共用同一目录</strong>，两边一起变</td></tr><tr><td>海报文件夹</td><td>从豆瓣抓回来的海报图片</td><td>可以在设置里改位置</td></tr><tr><td>—</td><td>本域<strong>不写独立数据文件</strong></td><td>条目全部来自笔记本身</td></tr></tbody></table>\n<p>每篇笔记靠开头那几行信息区（<code>---</code> 之间）来表达，常用的字段有：</p>\n<table><thead><tr><th>信息区里的字段</th><th>是什么</th></tr></thead><tbody><tr><td><code>tags</code></td><td>类型标签，决定它归在哪一组</td></tr><tr><td><code>评分</code></td><td><strong>状态就是从它推出来的</strong></td></tr><tr><td><code>观影日期</code></td><td>什么时候看的</td></tr><tr><td><code>海报</code></td><td>海报路径</td></tr><tr><td><code>影评</code></td><td>你自己写的短评</td></tr><tr><td><code>类型</code> / <code>导演</code> / <code>主演</code> / <code>制片国家/地区</code></td><td>从豆瓣抓回来的字段</td></tr><tr><td><code>上映日期</code></td><td>年份显示取它的前四位</td></tr><tr><td><code>豆瓣评分</code> / <code>豆瓣链接</code></td><td>豆瓣来源信息（链接必须是 <code>http(s)://</code> 开头才认）</td></tr><tr><td><code>简介</code></td><td>剧情简介</td></tr><tr><td><code>片长</code> / <code>季集</code> / <code>热门短评</code></td><td>统计页和详情页会用到</td></tr></tbody></table>\n<p>片名从文件名里取，写成 <code>《名称》</code> 这种形式最稳。</p>\n<h2>可以调什么（设置项）</h2>\n<h3>外观</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>面板布局</td><td>午夜场</td><td>只有这一档，暂无别的可选</td></tr><tr><td>面板主题</td><td>夜幕</td><td>只有这一档，暂无别的可选</td></tr></tbody></table>\n<h3>目录</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>影视文件夹</td><td><code>我的/影视</code></td><td>影院从这里读笔记。<strong>日记本共用同一目录</strong>，改了那边一起变，旧笔记不搬家</td></tr><tr><td>海报文件夹</td><td>库内默认位置</td><td>豆瓣抓回来的海报存在这</td></tr></tbody></table>\n<h3>显示</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>默认排序</td><td>最近观看</td><td>另有「按创建时间」「按评分」</td></tr><tr><td>默认状态筛选</td><td>全部</td><td>打开面板时选中的那格：全部 / 想看 / 在看 / 已看</td></tr><tr><td>剧集按季合并</td><td>开</td><td>同一部剧有 2 季及以上时，在墙上合成一张卡，点进详情才展开各季。<strong>它只改海报墙怎么分组，不碰笔记、不改文件名、不动目录</strong>；关掉立刻变回每季一张卡</td></tr></tbody></table>\n<h2>有哪些命令</h2>\n<table><thead><tr><th>命令名（去命令面板搜这个）</th><th>做什么</th></tr></thead><tbody><tr><td>影院</td><td>打开海报墙面板</td></tr><tr><td>加影视</td><td>搜索 → 抓豆瓣字段 → 写成笔记</td></tr><tr><td>随机抽一部</td><td>从库里随缘挑一部</td></tr><tr><td>影视分析报告</td><td>打开内嵌的分析统计页</td></tr></tbody></table>\n<h2>要注意的地方</h2>\n<ul>\n<li><strong>状态没有独立的字段，全看「评分」。</strong> <code>-1</code> 是想看，<code>0</code> 是在看，没填或填了正的分数就是已看。想把「已看」改回「在看」，就把 <code>评分</code> 改成 <code>0</code> —— 改别的字段都没用。</li>\n<li><strong>完全没有标签的笔记会被跳过</strong>，海报墙上不会出现。</li>\n<li><strong>海报墙固定 5 列</strong>，设置里没有可改列数的选项了。</li>\n<li><strong>影视目录和日记本共用。</strong> 改路径两边一起改，而且旧目录里的笔记不会自动搬。</li>\n<li><strong>抓字段要靠凭据。</strong> 没填 ApiZero Key，字段会缺一块（走内置兜底）；豆瓣开始拦搜索时得填 Cookie，否则搜索一直失败（会收到通知）。</li>\n<li><strong>片名是从文件名里提取的。</strong> 文件名不规范会拿不到片名，用 <code>《名称》</code> 最稳。</li>\n</ul>\n<h2>常见问题</h2>\n<p><strong>加了一部片子，海报墙上怎么没有？</strong></p>\n<p>先看两件事：文件名里有没有片名（<code>《名称》</code> 最稳）、笔记开头信息区里有没有 <code>tags</code>（完全没有标签会被跳过）。两个都正常还不出现，再核对「影视文件夹」指向的目录对不对。</p>\n<p><strong>想把「已看」改回「在看」？</strong></p>\n<p>把笔记里的 <code>评分</code> 改成 <code>0</code>。想标成「想看」就填 <code>-1</code>。这是状态唯一的来源。</p>\n<p><strong>为什么抓不到评分和演员？</strong></p>\n<p>两种可能：没有配 ApiZero Key（那就只剩内置兜底信息），或者豆瓣在拦你的搜索 —— 后者会收到拦截通知，填上豆瓣 Cookie 就能恢复。</p>\n<p><strong>一部剧好几季怎么整理？</strong></p>\n<p>每季各写一篇笔记，保持「剧集按季合并」开着，墙上就会合成一张卡，详情里再分开列。「剧名：副标题」这类特别篇会在卡片详情里单列。</p>\n<p><strong>随机抽一部会不会抽到还没看的？</strong></p>\n<p>会。它按当前的筛选范围抽。想只抽已看的，先筛成「已看」再抽。</p>\n<p><strong>海报墙能变宽一点、多几列吗？</strong></p>\n<p>不能。列数固定 5，设置里已经没有这一项了。</p>","no":22},{"id":"gameshelf","title":"游戏库","group":"媒体与阅读","tags":["media","games"],"domain":"gameshelf","html":"<blockquote>把 Steam 库同步进 Obsidian：一个游戏一篇笔记，时长和封面自动管</blockquote>\n<h2>什么时候用它</h2>\n<p>想把 Steam 里的已购游戏、游玩时长、最近在玩、成就进度，变成库里能查、能写感受的笔记时用它。</p>\n<p>它的做法和影院是一路：<strong>游戏数据写在笔记开头的信息区里，Steam 同步负责维护那几个字段，你自己写的感想留在正文里，两边互不覆盖。</strong></p>\n<h2>怎么用</h2>\n<h3>第一次配置</h3>\n<ol>\n<li>到设置里填 <strong>SteamID64</strong>：17 位纯数字、固定以 <code>7656</code> 开头。<strong>格式不对就判定为未配置，一个请求都不会发出去。</strong></li>\n<li>填 <strong>Web API 密钥</strong>：在 Steam 官网开发者页免费申请，32 位串。这行是掩码显示的，点眼睛才显形。</li>\n<li>两样<strong>必须都填</strong>。缺任何一个，同步就停在「未配置」状态。</li>\n<li>想让打开面板时顺手补数据，把 <strong>自动同步</strong> 打开。</li>\n<li>手动跑一次：命令面板执行 <strong>「同步游戏库」</strong>。</li>\n</ol>\n<blockquote><strong>网络是这一域最大的门槛。</strong> Steam 接口直连经常被重置，需要挂系统代理。另外中文名的回填走的是另一条路径（商店接口），跟同步不是一回事 —— 所以<strong>同步成功不代表中文名马上就有</strong>。</blockquote>\n<h3>同步都拉些什么</h3>\n<table><thead><tr><th>阶段</th><th>拉什么</th></tr></thead><tbody><tr><td>库同步</td><td>已购游戏清单 + 累计游玩时长，外加最近玩过的</td></tr><tr><td>详情</td><td>商店信息和评价等补充字段</td></tr><tr><td>中文名回填</td><td>中文名单独走商店接口补 —— Steam 那边只给英文名</td></tr><tr><td>封面 / 图标</td><td>下载到本地的海报文件夹；远端地址也保留着，删了缓存能重下</td></tr></tbody></table>\n<ul>\n<li><strong>手动</strong>：执行「同步游戏库」。</li>\n<li><strong>自动</strong>：开着「自动同步」时，打开面板发现数据过期就拉一次。</li>\n<li><strong>失败</strong>：网络被重置是最常见的原因 —— 挂上系统代理再试。</li>\n</ul>\n<h3>看墙</h3>\n<ol>\n<li>执行 <strong>「游戏库」</strong> 打开面板，主区是游戏墙（封面 + 时长），可以搜、可以切视图。</li>\n<li>点开一部：看累计时长、最近游玩、成就进度这些同步来的数据。</li>\n<li>想写感想，直接编辑这篇笔记的<strong>正文</strong>（别写进那些由同步管辖的字段，见下面「注意」）。</li>\n<li>执行 <strong>「游戏库数据统计」</strong> 看总量、时长分布这类统计。</li>\n</ol>\n<h2>数据放在哪</h2>\n<table><thead><tr><th>位置</th><th>里面是什么</th><th>你要留意什么</th></tr></thead><tbody><tr><td>游戏文件夹（默认 <code>我的/游戏</code>）</td><td>一个游戏一篇 <code>.md</code> 笔记</td><td>靠 <code>appid</code> 跟 Steam 库对上</td></tr><tr><td>笔记开头的信息区</td><td>Steam 管辖的字段：<code>appid</code>、累计游玩分钟数、各平台分项分钟数、中文名、封面 / 封面源、图标 / 图标源、成就相关</td><td><strong>同步时会刷新，手改会被下次同步覆盖</strong></td></tr><tr><td>海报文件夹</td><td>封面和图标下载到本地的落点</td><td>可以在设置里改位置</td></tr><tr><td>—</td><td>本域<strong>不写独立数据文件</strong></td><td>数据就在笔记里</td></tr></tbody></table>\n<h2>可以调什么（设置项）</h2>\n<h3>外观</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>面板布局</td><td>海报墙</td><td>只有这一档，暂无别的可选</td></tr><tr><td>面板主题</td><td>墨黑</td><td>只有这一档，暂无别的可选</td></tr></tbody></table>\n<h3>目录</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>游戏文件夹</td><td><code>我的/游戏</code></td><td>游戏笔记从这里读</td></tr><tr><td>海报文件夹</td><td>空</td><td>封面和图标缓存到本地的目录</td></tr></tbody></table>\n<h3>Steam</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>SteamID64</td><td>空</td><td>Steam 的数字账号 ID，17 位纯数字、以 <code>7656</code> 开头。格式不对就当没配</td></tr><tr><td>Web API 密钥</td><td>空</td><td>在 Steam 官网开发者页免费申请。<strong>密钥是账号级的，必须跟上面的 ID 对上</strong> —— 配成别人的 ID，拉回来的就是别人的库</td></tr><tr><td>自动同步</td><td>开</td><td>打开面板时数据过期就自动拉一次</td></tr></tbody></table>\n<h2>有哪些命令</h2>\n<table><thead><tr><th>命令名（去命令面板搜这个）</th><th>做什么</th></tr></thead><tbody><tr><td>游戏库</td><td>打开游戏墙面板</td></tr><tr><td>同步游戏库</td><td>立刻拉一次 Steam 数据并写回笔记</td></tr><tr><td>游戏库数据统计</td><td>打开统计视图</td></tr></tbody></table>\n<h2>要注意的地方</h2>\n<ul>\n<li><strong>两个凭据缺一不可。</strong> 任一为空，同步就完全不跑。填了 ID 没填密钥，一样是「未配置」。</li>\n<li><strong>ID 格式卡得很死。</strong> 17 位纯数字、<code>7656</code> 开头。写成昵称、个人主页链接或商店地址，一律视为未配置。</li>\n<li><strong>密钥必须跟 ID 对应。</strong> 账号级密钥配别人的 ID，拉回来的是别人的库。</li>\n<li><strong>同步会刷新信息区里那些 Steam 字段。</strong> 你手改的 <code>appid</code>、时长、封面这几项，下次同步会被覆盖。<strong>感想写正文，别写进这些字段。</strong></li>\n<li><strong>中文名是另一条链路。</strong> 同步成功不等于中文名立刻有；它走商店接口单独回填，缺了也不影响别的字段。</li>\n<li><strong>库里没有的游戏不会自动出现。</strong> 同步只拉你 Steam 库里有的；想手动加，得自己建笔记并补上 <code>appid</code>。</li>\n</ul>\n<h2>常见问题</h2>\n<p><strong>同步没反应怎么办？</strong></p>\n<p>按顺序查：① SteamID64 格式对不对（17 位、<code>7656</code> 开头）；② 密钥填了没；③ 有没有挂系统代理 —— 直连被重置是最常见的原因。</p>\n<p><strong>时长显示 0？</strong></p>\n<p>这一部可能没同步到（新入库的或私有资料），跑一次手动同步；老笔记缺平台分项字段的，会按 0 显示。</p>\n<p><strong>中文名一直出不来？</strong></p>\n<p>中文名走独立的商店接口回填，跟同步是分开的。挂上代理后再同步一次，或等下一轮回填；它没有也不影响别的字段。</p>\n<p><strong>我能改游戏数据吗？</strong></p>\n<p>Steam 管的那些字段改不了，改了下次同步也会被覆盖。但你可以在正文里写自己的评测，同步不会动正文。</p>\n<p><strong>为什么有的游戏没进来？</strong></p>\n<p>同步只拉你 Steam 库里买过的。要手动加，自己建一篇笔记并补上 <code>appid</code>。</p>\n<p><strong>换台电脑游戏笔记还在吗？</strong></p>\n<p>在。数据就是普通笔记，跟着库走；海报缓存没了重新同步会再下。</p>","no":23},{"id":"knowledge","title":"知识盒","group":"媒体与阅读","tags":["media","knowledge"],"domain":"knowledge","html":"<blockquote>把书里、视频里、刷到的一段好文字，收进库里变成能检索、能互相串起来的文献笔记</blockquote>\n<h2>什么时候用它</h2>\n<p>看书、看视频、或者刷到一段想留下来的文字时用它。它干的是「把外部的东西搬进库」这件事，分三步：</p>\n<ol>\n<li><strong>录入</strong> —— 名词、段落、图片、视频四个入口，各自产出格式统一的文献笔记；</li>\n<li><strong>关联</strong> —— 卡片之间自动互相认亲（谁跟谁相关）；</li>\n<li><strong>挂载</strong> —— 把你自己写的卡片，挂到某篇文献的具体位置上。</li>\n</ol>\n<p>它跟「剪藏本」的分工：剪藏本收的是<strong>网页文章</strong>（整篇搬进来）；知识盒收的是<strong>你主动摘出来的东西</strong>（词、段落、图、视频），并且围绕它们建一个盒子体系。</p>\n<p>它跟「第二大脑」的关系：知识盒管<strong>收纳和组织</strong>，第二大脑管<strong>按意思检索</strong>。知识盒的三个文件夹同时也是第二大脑默认检索的范围。</p>\n<h2>怎么用</h2>\n<h3>四个录入入口</h3>\n<p>命令面板里搜这四个（前置条件都是<strong>先配好 AI</strong>，见「AI」章）：</p>\n<table><thead><tr><th>想录什么</th><th>搜这个命令</th><th>会发生什么</th></tr></thead><tbody><tr><td>一个名词 / 术语</td><td><strong>名词生成文献笔记</strong></td><td>生成一篇讲这个词的文献笔记</td></tr><tr><td>一段文字</td><td><strong>段落生成文献笔记</strong></td><td>生成一篇带出处的文献笔记（选中段落会自动进输入框）</td></tr><tr><td>一张图片</td><td><strong>图版生成文献笔记</strong></td><td>图片存进「图版图片文件夹」，再生成一篇文献笔记</td></tr><tr><td>一个视频</td><td><strong>影像生成文献笔记</strong></td><td>下载 / 转写，再生成一篇文献笔记（<strong>需要额外的本机环境</strong>，见下）</td></tr></tbody></table>\n<p>四个入口产出的格式是统一的，所以在库里能用同一套检索与关联。</p>\n<h3>名词 / 段落 / 图片：直接在弹窗里生成</h3>\n<ol>\n<li>执行对应命令，弹出录入面板。</li>\n<li>填内容（名词、或那段文字、或选一张图）。</li>\n<li>点生成。生成过程中正文会一段一段流出来；<strong>你在生成时手改过的字段，不会被后面的结果覆盖</strong>。</li>\n<li>确认没问题就写入。</li>\n</ol>\n<h3>视频：多一步前置条件</h3>\n<p>视频这条链路<strong>不是插件自己干的</strong> —— 插件只把任务交给电脑上安装的外部命令行工具 <code>bili-dl</code>，由它去下载和转文字。所以：</p>\n<ul>\n<li>你电脑上要装好 <code>bili-dl</code>（一个全局命令）；</li>\n<li>还要有能用的 Python 环境，以及对应的语音识别包（引擎在「AI」页的「语音转写」组里选）。</li>\n</ul>\n<p>这两样没准备好，视频这条路就走不通。好消息是名词、段落、图片三条路不受影响。</p>\n<p>跑起来是<strong>串行</strong>的：一批任务按列表顺序一个一个来，不并行。</p>\n<h3>看和维护</h3>\n<p>命令面板搜 <strong>知识盒</strong> 打开面板，左边导航切视图：</p>\n<ul>\n<li><strong>转文献任务列表</strong> —— 每行一条任务，行上可以打开文献笔记、复制视频路径、编辑、删除。处理完的任务进历史视图。</li>\n<li><strong>挂载树</strong> —— 看卡片挂在哪篇文献的什么位置上。</li>\n<li><strong>维护</strong> —— 清空历史、挂载建议开关、清空建议缓存。</li>\n</ul>\n<h2>数据放在哪</h2>\n<table><thead><tr><th>文件 / 目录</th><th>位置</th><th>里面是什么</th><th>你要留意什么</th></tr></thead><tbody><tr><td>文献文件夹（默认 <code>文献盒</code>）</td><td>库内，可改</td><td>录入生成的文献笔记</td><td>改名会连带影响第二大脑的检索范围</td></tr><tr><td>卡片文件夹（默认 <code>卡片盒</code>）</td><td>库内，可改</td><td>你自己写的卡片</td><td>同上</td></tr><tr><td>主题文件夹（默认 <code>主题盒</code>）</td><td>库内，可改</td><td>专题笔记</td><td>同上</td></tr><tr><td>图版图片文件夹</td><td>库内，可改</td><td>图版录入时保存的图片</td><td>留空就落到文献文件夹下的 assets</td></tr><tr><td><code>knowledge.json</code></td><td>数据目录</td><td>转文献的归档记录（笔记路径、视频路径、状态等）</td><td>「清空历史」清的就是它，<strong>不动已生成的笔记</strong></td></tr><tr><td><code>mount-suggest.json</code></td><td>数据目录</td><td>挂载建议的候选与缓存</td><td>「清空建议缓存」清的就是它，<strong>不动已挂好的关系</strong></td></tr><tr><td>视频文件</td><td>由「输出文件夹」决定，<strong>可以放库外</strong></td><td>下载 / 转录出来的视频</td><td>实际写盘的是外部工具，不是插件</td></tr></tbody></table>\n<p>这三个文件夹合称「三个盒子」，名字都能改 —— 但改了会连带影响第二大脑的检索范围（两者读的是同一份配置）。</p>\n<h2>可以调什么（设置项）</h2>\n<h3>外观</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>面板布局</td><td>词条</td><td>目前只有这一种，暂无可切换项</td></tr><tr><td>面板主题</td><td>牛皮纸</td><td>目前只有这一种，暂无可切换项</td></tr></tbody></table>\n<h3>目录与分类</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>文献文件夹</td><td><code>文献盒</code></td><td>文献笔记放哪，录入时扫的也是这里</td></tr><tr><td>图版图片文件夹</td><td>空（落到文献文件夹下的 assets）</td><td>图版录入的图片存哪</td></tr><tr><td>卡片文件夹</td><td><code>卡片盒</code></td><td>你自己写的卡片放哪</td></tr><tr><td>主题文件夹</td><td><code>主题盒</code></td><td>主题笔记放哪</td></tr><tr><td>领域词表</td><td>空</td><td>逗号分隔的领域词（如「物理,医学,计算机,经济」），录入时用来提示归类</td></tr></tbody></table>\n<h3>自动关联</h3>\n<p>笔记改动后自动建关联。范围<strong>固定是上面三个文件夹</strong>，设置里没有范围选项。</p>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>自动关联</td><td>开</td><td>总开关。<strong>改完要重载插件才生效</strong>（面板会提示）。关掉后下面六行一起收起</td></tr><tr><td>单篇候选数量 TopK</td><td>8</td><td>每篇取多少条近邻候选（1–50）</td></tr><tr><td>每篇关联上限</td><td>0</td><td>0 = 不限量，交给 AI 裁判自己决定</td></tr><tr><td>候选相似度下限</td><td>0.3</td><td>送 AI 裁判的门槛（0–1），0 = 不过滤</td></tr><tr><td>完成通知</td><td>开</td><td>处理完给一条通知</td></tr><tr><td>失效关联自动清理</td><td>开</td><td>自动清掉指向已不存在笔记的关联</td></tr><tr><td>已有关联不再建链</td><td>开</td><td>笔记已经有 <code>related</code> 就跳过，不重复建</td></tr></tbody></table>\n<h3>视频处理</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>详细进度提示</td><td>开</td><td>显示当前跑到哪一步、耗时多少。排查问题时先开它</td></tr><tr><td>保留视频原件</td><td>开</td><td>转成文献后是否把视频文件留着</td></tr><tr><td>下载清晰度</td><td>最高</td><td>最高 / 1080P / 720P</td></tr><tr><td>遇错即停</td><td>关</td><td>打开后第一条失败就停整批；关着则跳过失败继续跑后面的</td></tr><tr><td>输出文件夹</td><td>空</td><td>视频落在哪，填完整路径，<strong>可以填库外</strong>。留空就由外部工具自己决定放哪</td></tr><tr><td>视频压缩</td><td>开</td><td>转文字前先把视频压一遍</td></tr><tr><td>压缩质量 CRF</td><td>23</td><td>越小画质越高（18–28）</td></tr></tbody></table>\n<h3>维护</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>清空历史</td><td>按钮</td><td>清空转文献的归档记录，<strong>不动已生成的笔记</strong></td></tr><tr><td>挂载建议</td><td>开</td><td>打开挂载树时自动生成建议</td></tr><tr><td>清空建议缓存</td><td>按钮</td><td>清掉建议的候选与缓存，<strong>不动已挂好的关系</strong></td></tr></tbody></table>\n<h2>有哪些命令</h2>\n<table><thead><tr><th>命令名（去命令面板搜这个）</th><th>做什么</th></tr></thead><tbody><tr><td>知识盒</td><td>打开知识盒面板</td></tr><tr><td>名词生成文献笔记</td><td>输入一个名词 → 生成一篇文献笔记</td></tr><tr><td>段落生成文献笔记</td><td>输入一段文字 → 生成一篇带出处的文献笔记</td></tr><tr><td>图版生成文献笔记</td><td>输入一张图片 → 存档图片 + 生成文献笔记</td></tr><tr><td>影像生成文献笔记</td><td>输入视频 → 下载 / 转写 → 生成文献笔记</td></tr><tr><td>重跑当前笔记关联</td><td>对当前这篇笔记重跑一遍关联</td></tr><tr><td>为未关联笔记批量补链</td><td>给三个盒子里还缺关联的存量笔记批量补</td></tr><tr><td>看挂载树</td><td>打开挂载树视图（要先打开一张笔记，它作为主卡）</td></tr><tr><td>重跑挂载建议</td><td>重新生成挂载建议</td></tr></tbody></table>\n<h2>要注意的地方</h2>\n<ul>\n<li><strong>视频链路依赖你电脑上的外部工具</strong>：<code>bili-dl</code> 没装、Python 环境没配好，这条路就走不通 —— 插件只负责把任务发下去和收回结果。</li>\n<li><strong>Python 环境没配好的表现是「整批」失败</strong>：错误会报在转写环节（提示「未配置 pythonPath」），而不是某一条视频失败。</li>\n<li><strong>输出文件夹填错了，报错在外部那一侧</strong>：插件只是把路径传下去，落盘失败会表现为外部工具失败。</li>\n<li><strong>「自动关联」改完要重载插件</strong>：这个开关的监听是在插件启动那一刻注册的。</li>\n<li><strong>关联范围锁死在三个盒子</strong>：想让某篇笔记不参与，只能把它挪出这三个文件夹，设置里没有范围选项。</li>\n<li><strong>挂载建议只在卡片盒内找候选</strong>：它不会去文献盒里给你挑卡片。</li>\n<li><strong>「清空历史」和「清空建议缓存」都不动笔记</strong>：前者清归档记录，后者清候选缓存。挂载关系是写在笔记里的。</li>\n<li>外观两行目前各只有一个选项。</li>\n</ul>\n<h2>常见问题</h2>\n<p><strong>转视频一直失败怎么办？</strong></p>\n<p>看错误提示说的是哪一类：</p>\n<ul>\n<li>「未找到 bili-dl」—— 外部命令没装，去把它装上；</li>\n<li>「未配置 pythonPath」—— Python 环境没配好（连同语音识别包一起）；</li>\n<li>两类都不是 —— 打开「详细进度提示」，看它卡在哪一步。</li>\n</ul>\n<p><strong>关联一直没建起来？</strong></p>\n<p>按顺序查三件事：①「自动关联」开关是不是开着；② 改过设置后有没有<strong>重载插件</strong>；③ 笔记是不是在三个盒子里 —— 盒外不参与。</p>\n<p><strong>挂载建议是 AI 编的吗？</strong></p>\n<p>是 AI 生成的，但每条都要求带<strong>能回定位的锚点</strong>（标题原文或原文摘录）。正文里找不到对应位置时会退回片段锚点，也可能被否决。</p>\n<p><strong>「清空建议缓存」会删掉已挂好的关系吗？</strong></p>\n<p>不会。清的只是候选与缓存，挂载关系写在笔记里。</p>\n<p><strong>换电脑后视频这条链路还能用吗？</strong></p>\n<p>不能直接用。外部命令行工具、Python 环境都是本机环境的一部分，不跟着库走，新机器上要重新装一遍。</p>\n<p><strong>为什么我改了文献文件夹的名字，检索范围也跟着变了？</strong></p>\n<p>因为第二大脑默认检索的就是这三个盒子，两者读的是同一份配置。改之前想清楚。</p>","no":24},{"id":"reading-report","title":"阅读报告","group":"媒体与阅读","tags":["media","books"],"domain":"reading-report","html":"<blockquote>书架墙里的那一层统计：读了多少、读了多久、什么时候读的</blockquote>\n<h2>什么时候用它</h2>\n<p>想回顾「我这段时间到底读了点什么」的时候打开它。</p>\n<p>它不是独立的面板 —— <strong>是书库墙里的一层视图</strong>，借书库的数据做统计，自己没有独立的数据文件。</p>\n<p>跟「剪藏阅读报告」不是一回事，别弄混：</p>\n<table><thead><tr><th></th><th>阅读分析报告（本章）</th><th>剪藏阅读报告</th></tr></thead><tbody><tr><td>统计对象</td><td><strong>书</strong></td><td>剪藏的文章</td></tr><tr><td>入口命令</td><td>阅读分析报告</td><td>剪藏阅读报告</td></tr></tbody></table>\n<h2>怎么用</h2>\n<ol>\n<li>打开命令面板，执行 <strong>「阅读分析报告」</strong>。它会先切到书库，再落到报告这一层。</li>\n<li>报告按你书库里的数据汇总：读了多少本、累计多久、什么时候读的这条线。</li>\n<li>书目很多的时候，会先显示一个「统计中…」的占位，等算完自动换成内容 —— 这是正常的，不是卡住了。书目少的时候基本秒出。</li>\n<li>如果书库还没有可统计的书，会显示一个空态页明确告诉你，而不是给你一张全零的图。</li>\n</ol>\n<h2>数据从哪来</h2>\n<p>两类来源，都不在本域手里：</p>\n<table><thead><tr><th>来源</th><th>位置</th><th>贡献什么</th></tr></thead><tbody><tr><td>书目笔记</td><td>书库文件夹里的 <code>.md</code>（开头信息区的 <code>tags</code> 要带书标签）</td><td>书目、读完／在读状态、阅读日期</td></tr><tr><td>EPUB 阅读数据</td><td><code>weave-data.json</code>（Weave 插件写的）</td><td>阅读会话（开始／结束时间、时长）、进度百分比、字数</td></tr></tbody></table>\n<p>所以：<strong>想改报告的结果，要改的是数据本身</strong>（书目笔记的状态字段、Weave 里的阅读记录），这里没有任何开关可以调。</p>\n<p>几个统计口径，知道一下免得对不上：</p>\n<ul>\n<li>日期<strong>按你机器的本地时区</strong>算 —— 跨零点那次阅读算在哪一天，跟着你所在的时区走。</li>\n<li>会话时长由记录的开始和结束时间推出来；缺开始时间的话按 0 算。</li>\n<li><strong>页数是估的</strong>，按字数 ÷ 500 向下取整 —— 跟纸质书的页码对不上很正常，这不是真实页码。</li>\n</ul>\n<h2>数据放在哪</h2>\n<p>本域<strong>没有自己的数据文件</strong>，也不写盘。它是纯粹的统计视图，打开时临时从书库和 Weave 的数据里算出来。</p>\n<h2>可以调什么（设置项）</h2>\n<p><strong>没有。</strong> 它是纯统计视图，一项可配的都没有 —— 统计口径跟随书库和 Weave 的数据，想调整只能改数据本身。</p>\n<h2>有哪些命令</h2>\n<table><thead><tr><th>命令名（去命令面板搜这个）</th><th>做什么</th></tr></thead><tbody><tr><td>阅读分析报告</td><td>打开书库墙里的报告视图（先切到书库，再进报告）</td></tr></tbody></table>\n<h2>要注意的地方</h2>\n<ul>\n<li><strong>没有书就没有报告。</strong> 书库是空的，或者书都没带书标签，就只能看到空态页。</li>\n<li><strong>EPUB 的数据归 Weave。</strong> 没用 Weave 读过书，报告里就只有书目笔记那一部分。</li>\n<li><strong>页数是估算值</strong>，跟纸质书页码对不上很正常。</li>\n<li><strong>它统计「书」，不统计「文章」。</strong> 剪藏那边的阅读量看它们自己的报告。</li>\n<li><strong>不落任何文件。</strong> 想把报告留下来，只能截图或自己摘录。</li>\n</ul>\n<h2>常见问题</h2>\n<p><strong>报告是空的？</strong></p>\n<p>说明书库里没有可统计的书。去查三处：书库文件夹对不对、书有没有带书标签、书目笔记的状态字段（在读／已读日期）填没填。</p>\n<p><strong>EPUB 的阅读时长怎么对不上？</strong></p>\n<p>时长来自 Weave 记录的会话 —— 在 Weave 里读了多久就记多久，这边只做汇总，没法修正。</p>\n<p><strong>为什么和剪藏阅读报告的数字差那么多？</strong></p>\n<p>两个报告统计的对象不同：这个统计书，那个统计剪藏文章，本来就不该一样。</p>\n<p><strong>能导出报告吗？</strong></p>\n<p>不能。它是视图，不落文件。要留档自己截图或者抄下来。</p>\n<p><strong>统计很慢、一直在转？</strong></p>\n<p>书目多的时候确实要算一会儿，会先出「统计中…」占位。书目少就秒出。如果一直不动，先确认书库里到底有多少本书。</p>\n<p><strong>书库里某本书不想算进去怎么办？</strong></p>\n<p>报告没有排除开关。去处是在书库那边 —— 改它的状态字段或标签。</p>","no":25},{"id":"review","title":"复习计划","group":"媒体与阅读","tags":["media","review"],"domain":"review","html":"<blockquote>把笔记排进间隔重复：到点提醒你回头看，还能出题考你</blockquote>\n<h2>什么时候用它</h2>\n<p>想让读过的东西别忘掉，又不想自己排日程的时候用它。笔记排进计划后，插件按「先固定阶梯、后动态算法」的方式算下一次该什么时候看，到点了提醒你，你评一个「记住的程度」，它据此重新排期。</p>\n<p>适合：读书摘录、概念卡片、外语单词、要背的条目。</p>\n<p>不适合：纯流水账日记、一次性备忘 —— 这类排进复习只会变成噪音。</p>\n<h2>怎么用</h2>\n<h3>把笔记排进复习</h3>\n<p>三条途径：</p>\n<ol>\n<li><strong>监听文件夹（自动）</strong>：在设置里加一个或多个目录，之后放进目录的新笔记自动加入。</li>\n<li><strong>手动加入</strong>：打开那篇笔记，执行 <strong>「加入复习计划」</strong>。</li>\n<li><strong>去掉</strong>：不想复习了，执行 <strong>「移出复习计划」</strong>。</li>\n</ol>\n<h3>开始一轮复习</h3>\n<ol>\n<li>执行 <strong>「开始复习」</strong>。插件先取本轮队列：<strong>已经逾期 + 今天到期</strong>的笔记，按排序规则排好给你。</li>\n</ol>\n<ul>\n<li>到期的笔记超过「每日复习上限」时，只放行上限那几篇，并明确告诉你「本轮复习 N 篇，剩余 M 篇留到下次」。</li>\n<li>今天到期但具体时刻还没到的，也会提前纳入本轮，同时给一条提示。</li>\n</ul>\n<ol>\n<li>如果开着「用做题测难度」，本轮会<strong>先出题考你</strong>，再按正确率定这次的难度；关着的话就是普通的跳转复习。</li>\n<li>每条笔记看完之后评一个档：<strong>忘了 / 困难 / 一般 / 简单</strong>（面板按钮，或四条评级命令）。</li>\n<li>评级立刻生效并算出下一次排期。</li>\n</ol>\n<h3>看趋势</h3>\n<ul>\n<li><strong>「复习计划分析报告」</strong>：队列和完成情况。</li>\n<li><strong>「记忆分析」</strong>：记忆指标和趋势。</li>\n<li><strong>「跳转逾期复习」</strong>：直接进入积压的那一批。</li>\n</ul>\n<h2>排期是怎么算的</h2>\n<p>两段式，先粗排、后动态。</p>\n<p><strong>第一段 · 固定阶梯</strong>（默认从这里起步）</p>\n<p>一共 10 级，间隔固定：</p>\n<p>1 分钟 → 30 分钟 → 6 小时 → 1 天 → 3 天 → 7 天 → 15 天 → 30 天 → 60 天 → 120 天</p>\n<p>评级决定往上爬几级还是退回去（忘了退一级、困难原地不动、一般爬一级、简单爬两级），爬到顶就进入第二阶段。</p>\n<p><strong>第二段 · 动态算法</strong></p>\n<p>进去之后不再走这张固定表，改由「稳定度 / 难度」算出下一次的间隔。这时候 <strong>「复习间隔缩放」</strong> 才起作用：</p>\n<blockquote>间隔 = 算法算出的天数 × 缩放系数</blockquote>\n<p>注意：<strong>刚跨进第二阶段的那一次不乘这个系数。</strong></p>\n<p><strong>四个评级</strong></p>\n<p>忘了 / 困难 / 一般 / 简单 —— 分别对应算法里的四档，直接进历史，影响稳定度和难度。做题时第一次评成「忘了」或「困难」会打上待重做的标记；重做通过只是把标记清掉，不会额外再算一次算法。</p>\n<h2>数据放在哪</h2>\n<p>数据目录下有三个文件（默认就在你库里的数据目录里，改路径见「通用」章）：</p>\n<table><thead><tr><th>文件</th><th>里面是什么</th><th>你要留意什么</th></tr></thead><tbody><tr><td><code>review.json</code></td><td>复习条目和<strong>全部复习历史</strong></td><td>排期、评级、下一次日期都在这儿，换机器跟着库走就行</td></tr><tr><td><code>review-fit.json</code></td><td>自动拟合出来的记忆参数</td><td>这份丢了不影响使用，会按默认参数重新算</td></tr><tr><td><code>quiz.json</code></td><td>做题记录：题目、答案、答题结果</td><td>只在用做题功能时有内容</td></tr></tbody></table>\n<p>每条复习记录大致记着：对应哪篇笔记（路径和显示名）、当前在第几级、处在哪个阶段、下一次该复习的时间、上次复习时间和那次评的档、逐条历史，以及累计复习次数。</p>\n<p>另外有两个标记值得一提：列表里显示删除线的，说明那篇笔记在库里找不到了；永远排在逾期队列最前的，是你手动置顶的那些。</p>\n<h2>可以调什么（设置项）</h2>\n<h3>外观</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>面板布局</td><td>三区队列</td><td>预留，改了暂不生效</td></tr><tr><td>面板主题</td><td>苔绿</td><td>预留，改了暂不生效</td></tr></tbody></table>\n<h3>检查提醒</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>到期提醒</td><td>开</td><td>有笔记到期待复习时自动弹提醒</td></tr><tr><td>新笔记加入提醒</td><td>开</td><td>新笔记被自动加入时提示，多条会合并成一条</td></tr></tbody></table>\n<h3>做题家</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>用做题测难度</td><td>关</td><td>打开后「开始复习」先出题，再按正确率定本次难度。<strong>下面四行是它的子项，只在开着时出现</strong></td></tr><tr><td>允许多选题</td><td>开</td><td>关掉就只出单选题（子项）</td></tr><tr><td>每篇笔记出题数量</td><td>0（自动）</td><td>固定每篇出几道题，范围 0–100（子项）</td></tr><tr><td>打乱出题顺序</td><td>开</td><td>随机排列题目顺序（子项）</td></tr><tr><td>出题难度</td><td>随机</td><td>另有简单 / 中等 / 困难（子项）</td></tr></tbody></table>\n<h3>复习节奏</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>每日复习上限</td><td>0（不设上限）</td><td>一轮最多放行多少篇，范围 0–1000。超出部分留到下次，会告诉你还剩多少篇</td></tr><tr><td>复习间隔缩放</td><td>1</td><td>乘在<strong>动态</strong>间隔上的系数。范围 0.1–5：填 0.5 更勤、填 2 更宽松。<strong>固定阶梯那一段不受它影响</strong></td></tr><tr><td>R 目标阈值</td><td>0.9</td><td>记忆保留度（0–1，1 = 完全记得）低于它就允许提前复习。范围 0.5–0.99。<strong>它不改变排期间隔本身</strong></td></tr></tbody></table>\n<h3>记忆算法</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>参数自动拟合</td><td>开</td><td>用你的复习记录重新拟合记忆参数。<strong>样本少于 100 条直接跳过</strong>，100–300 条只拟合基础参数，300 条以上才全参</td></tr><tr><td>每 N 次复习重算</td><td>10</td><td>累计这么多次评级后自动重拟合一次。只在「参数自动拟合」开着时出现</td></tr></tbody></table>\n<h3>自动化</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>监听文件夹</td><td>空</td><td>目录里的新笔记自动加入。<strong>库根目录不支持监听</strong>；添加时会先问「目录里已有的笔记要不要一起收进来」，<strong>点取消 = 这个目录完全不加入</strong>（新老笔记都不收）</td></tr><tr><td>排除名单</td><td>空</td><td>自动加入时排除在外的笔记清单</td></tr></tbody></table>\n<h3>界面</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>文件树标记</td><td>开</td><td>在文件树里给复习中的笔记染色并挂阶段徽标。关掉只是不显示这些标记，排期和提醒都不受影响</td></tr></tbody></table>\n<h2>有哪些命令</h2>\n<table><thead><tr><th>命令名（去命令面板搜这个）</th><th>做什么</th></tr></thead><tbody><tr><td>复习计划</td><td>打开复习面板</td></tr><tr><td>开始复习</td><td>取本轮队列进入复习流程（开了做题就先出题）</td></tr><tr><td>加入复习计划</td><td>把当前打开的笔记加入计划</td></tr><tr><td>移出复习计划</td><td>把当前打开的笔记移出计划</td></tr><tr><td>跳转逾期复习</td><td>直接跳到已经逾期的那一批</td></tr><tr><td>选择复习难度</td><td>弹出评级对话框，手动选一个档</td></tr><tr><td>复习评级：忘了</td><td>按「忘了」评级并重新排期</td></tr><tr><td>复习评级：困难</td><td>按「困难」评级并重新排期</td></tr><tr><td>复习评级：一般</td><td>按「一般」评级并重新排期</td></tr><tr><td>复习评级：简单</td><td>按「简单」评级并重新排期</td></tr><tr><td>做题练习</td><td>打开做题练习面板（不等到期，随时练）</td></tr><tr><td>复习计划分析报告</td><td>打开队列与完成情况报告</td></tr><tr><td>记忆分析</td><td>打开记忆指标与趋势</td></tr></tbody></table>\n<h2>要注意的地方</h2>\n<ul>\n<li><strong>「复习间隔缩放」不是全局变速档。</strong> 固定阶梯那一段（1 分钟到 120 天那一串）完全不受它影响，它只对已经进入第二段之后的间隔生效。</li>\n<li><strong>「R 目标阈值」不改变排期间隔</strong>，只决定要不要提前安排一次。想整体松一点请调缩放系数。</li>\n<li><strong>拟合要够样本。</strong> 不足 100 条记录直接跳过，所以刚上手时「参数自动拟合」看着没差别，是正常的。</li>\n<li><strong>加监听目录时点「取消」是彻底的。</strong> 取消 = 这个目录根本没加入，之后的新笔记也不会自动进来。想要的话重新添加并确认。</li>\n<li><strong>库根目录不能作为监听目录。</strong></li>\n<li><strong>删文件会问一次。</strong> 计划内的笔记被删掉时会确认「要不要同步移除复习记录」；改名或移动则自动更新路径，不再打扰你。</li>\n<li><strong>评级没法回退。</strong> 评完立刻写盘并重排，错了只能再评一次（以最新一次为准）。</li>\n<li><strong>文件树标记只影响观感</strong>，关掉不影响排期、提醒和逾期判定。</li>\n<li>外观那两行是预留的，目前改了没有任何效果。</li>\n</ul>\n<h2>常见问题</h2>\n<p><strong>加入复习后什么时候开始看第一篇？</strong></p>\n<p>从阶梯第一步开始：1 分钟、30 分钟、6 小时、1 天这样往上爬。评「简单」爬得最快，评「忘了」会往回退一级。</p>\n<p><strong>一天积了一堆复习怎么办？</strong></p>\n<p>用「每日复习上限」限制每轮放行多少篇（超出部分留到下次，会明确告诉你还剩多少）。想让整体节奏松一点，把「复习间隔缩放」调到大于 1。</p>\n<p><strong>笔记为什么没进复习计划？</strong></p>\n<p>三种可能：它不在监听目录里；它在监听目录里但当初添加时你点了取消（那次取消等于整个目录都没加进来）；它被加进了排除名单。手动加入不受监听影响。</p>\n<p><strong>做题模式是必须的吗？</strong></p>\n<p>不是。「用做题测难度」关着就是普通的跳转复习；打开后「开始复习」才先出题，下面那四行设置也才出现。</p>\n<p><strong>文件树上的颜色和徽标是什么？</strong></p>\n<p>复习中 / 到期的笔记会在文件树里染色并带阶段徽标，颜色按当前拟合出的参数算。不想看可以在「界面」组关掉，排期不受影响。</p>\n<p><strong>换设备后复习记录还在吗？</strong></p>\n<p>在。排期和历史都写在 <code>review.json</code> 里，跟着库一起走；拟合出来的参数在 <code>review-fit.json</code>，一起复制过去就行。</p>\n<p><strong>对应的笔记被我删了，那条记录会怎么样？</strong></p>\n<p>列表里它会显示删除线，说明文件在库里已经找不到了。复习记录本身还在，你可以手动把它移出计划。</p>","no":26},{"id":"attach","title":"附件搬移","group":"工具","tags":["tool","attach"],"domain":"attach","html":"<blockquote>把笔记引用的附件批量挪到指定文件夹，全库里指向它们的链接自动改妥</blockquote>\n<h2>什么时候用它</h2>\n<p>想给某篇笔记「瘦身」「归档」「整理资源」的时候：比如把散落各处的图片、PDF、音频集中搬到 <code>assets/</code> 或 <code>附件/</code>。</p>\n<p>它搬的<strong>不是整篇笔记</strong>，而是<strong>当前这篇笔记引用到的那些附件</strong> —— 也就是笔记正文里以 Wikilink 或 Markdown 链接指向的、库内的非 <code>.md</code> 文件（包括 <code>![[...]]</code> 和 <code>![]()</code> 这种嵌入写法）。搬完之后，全库里引用这些附件的链接会自动改指向新位置。</p>\n<p>适用对象：</p>\n<ul>\n<li><strong>命令入口</strong>：你当前正在编辑／打开的那篇 Markdown 笔记。</li>\n<li><strong>右键入口</strong>：文件树里任意一篇 <code>.md</code> 笔记（右键菜单项只对 <code>.md</code> 出现，文件夹和其他类型不挂这个菜单）。</li>\n<li>在非 Markdown 文件上、或压根没开笔记时用，会提示「附件搬移适用于 Markdown 笔记，请在笔记上运行」。</li>\n</ul>\n<h2>怎么用</h2>\n<p>两种入口，后面的流程完全一样：</p>\n<p><strong>入口 A —— 命令面板</strong></p>\n<ol>\n<li>打开（或选中）一篇 Markdown 笔记。</li>\n<li>打开命令面板（<code>Ctrl/⌘ + P</code>），搜 <strong>「搬移附件」</strong>，回车。</li>\n</ol>\n<p><strong>入口 B —— 文件右键</strong></p>\n<ol>\n<li>在文件树里对一篇 <code>.md</code> 笔记右键。</li>\n<li>点 <strong>「搬移此笔记附件」</strong>。</li>\n</ol>\n<p><strong>接下来：</strong></p>\n<ol>\n<li>插件先扫一遍这篇笔记引用了哪些附件：</li>\n</ol>\n<ul>\n<li><strong>一个都没有</strong> → 直接提示「当前笔记没有可搬移的附件」，结束。</li>\n<li><strong>已经全在上次那个目标文件夹里</strong> → 弹「无需搬移」，你可以选「换个文件夹」继续，也可以「不用了」收工。</li>\n</ul>\n<ol>\n<li>弹出路径选择器，挑目标文件夹：</li>\n</ol>\n<ul>\n<li>支持搜索，挑起来是卡片易选的形式。</li>\n<li>选 <strong>「（库根目录）」</strong> = 直接搬到库的根目录。</li>\n<li>之前搬过的话，会自动高亮「上次文件夹」。</li>\n<li>如果选的目录里这些附件已经都在了，会提示「附件已全部在目标文件夹」并结束。</li>\n</ul>\n<ol>\n<li>弹出<strong>可勾选的预览清单</strong>：</li>\n</ol>\n<ul>\n<li>每行显示 <code>原路径 → 目标路径</code>，复选框<strong>默认全勾</strong>。</li>\n<li>目标位置已经有同名文件的那一行，会标一个「将改名」的徽标（搬过去自动变成 <code>原名 (N).ext</code>）。</li>\n<li>不想动某个附件就把它的勾取消；顶部有「全选 / 全不选」工具条。</li>\n<li>确认按钮上写着<strong>「搬移 N 个」</strong>，也可以直接按 <code>Ctrl/⌘ + Enter</code> 提交。</li>\n<li>取消勾选后有未提交的改动就按 ESC 或点遮罩，会先问你一句「放弃确认」。</li>\n<li>清单上还有 <strong>「跳过预览直接搬（本会话）」</strong>：点了这次照常执行，并且本会话里后续搬移选完文件夹就直接执行、不再弹预览 —— <strong>重载插件后恢复到正常</strong>。</li>\n</ul>\n<ol>\n<li>执行搬移：</li>\n</ol>\n<ul>\n<li>附件数在 <strong>10 个及以上</strong>时会有进度通知（「正在搬移附件 i/N」），带「中止」按钮可以中途停手 —— 已经搬过去的那部分照常出汇总，并提供撤销。</li>\n<li>搬完弹汇总通知，带上 <strong>「撤销」</strong> 按钮。</li>\n</ul>\n<h2>数据放在哪</h2>\n<p><strong>本域没有设置项。</strong> 设置面板里的「附件搬移」只是一个占位导航项，点进去没有实质内容 —— 真正的操作入口就是上面的命令和右键菜单。</p>\n<p>插件会自动记住一个东西：<strong>上次选择的目标文件夹</strong>，下次打开选择器时自动高亮它。它不出现在设置页里，也不提供手动编辑。</p>\n<h2>可以调什么（设置项）</h2>\n<p><strong>没有。</strong> 本域不提供任何用户可调的设置。</p>\n<h2>有哪些命令</h2>\n<table><thead><tr><th>命令名（去命令面板搜这个）</th><th>做什么</th></tr></thead><tbody><tr><td>搬移附件</td><td>对当前打开的那篇笔记扫描附件 → 挑目标文件夹 → 预览 → 搬移</td></tr><tr><td>（文件右键菜单）搬移此笔记附件</td><td>同上，对右键点到的那篇 <code>.md</code> 笔记执行</td></tr></tbody></table>\n<h2>要注意的地方</h2>\n<blockquote><strong>这一节要认真看 —— 这个功能会真的移动磁盘上的文件，不是预览也不是模拟。</strong></blockquote>\n<ul>\n<li><strong>文件真的会被挪走。</strong> 误操作请立刻点通知上的「撤销」。</li>\n<li><strong>全库链接会自动改写，但有前提。</strong> 正常情况走 Obsidian 自带的重命名通道，全库里指向这些附件的内部链接会一起改妥。极少数异常环境下会退化成「只改文件名、不改链接」，那种情况会发通知提醒你链接没更新。</li>\n<li><strong>搬哪些是有口径的：</strong></li>\n<li>只搬<strong>库内、非 <code>.md</code></strong> 的被引用文件。</li>\n<li><strong>外链不搬</strong>：<code>http:</code> / <code>https:</code> / <code>data:</code> / <code>file:</code> 开头的直接跳过。</li>\n<li>代码块、行内反引号、HTML 注释里的「链接」不算引用，不会被收集；但<strong>笔记开头信息区（frontmatter）里的链接算真引用</strong>，会被一起搬走。</li>\n<li>引用优先按 Obsidian 自己的链接索引来认；索引还没就绪时会退化成按正文规则兜底扫一遍，这时偶尔会漏掉非常规写法。</li>\n<li><strong>同名不是覆盖，是改名。</strong> 只在目标位置已有同名文件（或同名文件夹）时才改名，格式 <code>原名 (N).ext</code>，<code>N</code> 递增。既不覆盖原文件，也不报错中止。</li>\n<li><strong>重复搬是安全的。</strong> 已经在目标文件夹的附件在规划阶段就被排除掉了；全部都在时会直接结束并提示，不会产生任何动作。同一个笔记对同一个目标重复执行，结果不变。</li>\n<li><strong>一次只能有一个搬移在跑。</strong> 正在搬的时候再触发一次，会提示「附件搬移进行中，请稍候」。</li>\n<li><strong>附件特别多时有护栏。</strong> 预览清单只渲染前 300 行，超出的部分<strong>仍然默认勾选、会一并提交</strong> —— 所以如果你要取消勾选，得留意可能有没显示出来的行。</li>\n<li><strong>目标文件夹不存在会自动创建</strong>（选库根目录时不涉及）。</li>\n</ul>\n<h2>常见问题</h2>\n<p><strong>搬完之后，别的笔记里指向这些附件的链接会失效吗？</strong></p>\n<p>正常情况下不会 —— 全库里引用它们的内部链接会一起改指向新路径。只有在极少数异常环境（缺少 Obsidian 的重命名通道）下链接才不会更新，那时会发通知明确告诉你。</p>\n<p><strong>搬错了怎么恢复？</strong></p>\n<p>搬完的通知上就有 <strong>「撤销」</strong> 按钮，点一下会把已移动的文件按逆序搬回原路径，链接同样自动回改。注意：撤销只回滚这次真正移动过的那些；如果原位置已经被别的文件占用，个别可能会撤销失败并提示你。</p>\n<p><strong>目标文件夹里已经有同名文件会怎样？</strong></p>\n<p>不会覆盖，会自动改名为 <code>原名 (N).ext</code>（<code>N</code> 从 1 开始递增）。预览清单里那一行会标出「将改名」的徽标，你一眼能看见。</p>\n<p><strong>为什么有的「链接」没被搬？</strong></p>\n<p>这些不算被引用：库外的网络地址（<code>http:</code> / <code>https:</code> / <code>data:</code> / <code>file:</code> 开头）、写在代码块 / 行内代码 / HTML 注释里的写法，以及指向的目标本身就是 <code>.md</code> 笔记。反过来，笔记开头信息区里的链接是会算引用并被搬走的。</p>\n<p><strong>我只想搬一部分，其余不动，行吗？</strong></p>\n<p>行。在预览清单里把不想动的那些勾取消就行，顶部还有「全选 / 全不选」批量切换。确认时只移动勾上的那些。</p>\n<p><strong>执行到一半想停手，会留半成品吗？</strong></p>\n<p>附件数 ≥ 10 时进度通知带 <strong>「中止」</strong> 按钮。点了之后已经搬过去的部分照常出汇总并提供撤销，没搬的留在原地。整体还有兜底，万一整批失败会明确提示「原文件未改动」。</p>\n<p><strong>设置面板里「附件搬移」点进去怎么什么都没有？</strong></p>\n<p>它本来就没有可调的设置，只是占位的导航项。真正的入口是命令面板的「搬移附件」和 <code>.md</code> 笔记右键菜单里的「搬移此笔记附件」。</p>\n<p><strong>为什么选中时清单里行数看着比笔记里的图片少？</strong></p>\n<p>先看看是不是有的图片写成了外链（不会被搬），或者写在了代码块 / HTML 注释里 —— 那些不算引用。另外附件超过 300 行时清单只显示前 300 行，但超出的部分仍在勾选范围内、会一并提交。</p>","no":27},{"id":"pomodoro","title":"番茄钟","group":"工具","tags":["tool","pomodoro"],"domain":"pomodoro","html":"<blockquote>一个会自己往下走的计时盘：专注一会儿、休息一会儿，循环着来</blockquote>\n<h2>什么时候用它</h2>\n<p>想在 Obsidian 里专心做一阵事、又不想一直盯着时钟时用它。</p>\n<p>它管的是<strong>专注 → 休息</strong>这个循环：专注一段、休息一段，其中每过几个专注就换成一次长休息。每一段多久、结束时要不要自动接下一段、要不要响铃，都能自己配。</p>\n<p>如果你管不住自己去点暂停，它还有一个<strong>「强制专注模式」</strong>——开了之后专注进行中连暂停都点不动，只能等它走完。这是给真想逼自己一把的人准备的，没想清楚别开。</p>\n<h2>怎么用</h2>\n<h3>开始一个专注</h3>\n<ol>\n<li>打开命令面板（Obsidian 里按 <code>Ctrl/Cmd + P</code>），搜<strong>「番茄钟」</strong>，打开计时盘。</li>\n<li>点面板中间那颗<strong>主按钮</strong>开始专注。</li>\n</ol>\n<p>这颗主按钮是三合一的，看当前状态变字：</p>\n<table><thead><tr><th>现在的状态</th><th>按钮上写着</th><th>点了会怎样</th></tr></thead><tbody><tr><td>还没开始</td><td>开始</td><td>开始一轮专注</td></tr><tr><td>正在计时</td><td>暂停</td><td>暂停（可以再继续）</td></tr><tr><td>已经暂停</td><td>继续</td><td>接着走剩下的时间</td></tr></tbody></table>\n<p>不想开面板也行：直接搜<strong>「开始/重置专注」</strong>，一把就开始。</p>\n<p>面板聚焦时按<strong>空格键</strong>也能切换开始/暂停。</p>\n<h3>暂停、继续、跳过</h3>\n<ul>\n<li><strong>暂停/继续</strong>：点主按钮，或者搜<strong>「暂停/继续专注」</strong>。</li>\n<li><strong>跳过休息</strong>：休息中不想等了，搜<strong>「跳过休息」</strong>，直接进下一段。空闲状态下这颗按钮是灰的（没什么可跳）。</li>\n<li><strong>重置</strong>：把当前这轮作废、回到空闲。<strong>重置和跳过都是「点两次」</strong>——先点一次，按钮变成待确认的样子，再点一次才真的执行；中间点一下主按钮就能撤销，防手滑连击。</li>\n</ul>\n<h3>关掉 Obsidian，计时会丢吗？</h3>\n<p><strong>不会丢。</strong> 倒计时是记在时间上的，不是记在窗口上的。</p>\n<p>下次启动插件时，遇到没走完的倒计时，按设置里「打开时恢复方式」处理：</p>\n<ul>\n<li><strong>后台继续</strong>（默认）：静默接着走，不打扰你；</li>\n<li><strong>自动弹窗</strong>：把计时盘直接推到你眼前。</li>\n</ul>\n<h3>看统计</h3>\n<p>面板下方有统计，两档可切：<strong>近 7 天明细</strong> 和 <strong>近 6 个月趋势</strong>。</p>\n<h2>数据放在哪</h2>\n<table><thead><tr><th>文件</th><th>位置</th><th>里面是什么</th><th>你要留意什么</th></tr></thead><tbody><tr><td><code>pomodoro.json</code></td><td>数据存储路径下（默认在你的库里）</td><td>你的计时记录</td><td>记录会自动裁剪，不会无限膨胀</td></tr></tbody></table>\n<h2>时间方案</h2>\n<p>不想自己调，就直接选一个<strong>预设方案</strong>——现成的三段组合，共 11 个：</p>\n<table><thead><tr><th>预设</th><th>专注 / 短休 / 长休（分钟）</th></tr></thead><tbody><tr><td>经典标准</td><td>25 / 5 / 15</td></tr><tr><td>神经专注</td><td>30 / 7 / 20</td></tr><tr><td>深度心流</td><td>50 / 10 / 25</td></tr><tr><td>创意激发</td><td>40 / 12 / 20</td></tr><tr><td>初学入门</td><td>15 / 5 / 12</td></tr><tr><td>高效学习</td><td>30 / 5 / 15</td></tr><tr><td>敏捷冲刺</td><td>20 / 4 / 12</td></tr><tr><td>马拉松式</td><td>45 / 15 / 30</td></tr><tr><td>疲劳恢复</td><td>20 / 10 / 20</td></tr><tr><td>高强度</td><td>50 / 5 / 15</td></tr><tr><td>平衡模式</td><td>35 / 7 / 18</td></tr></tbody></table>\n<p>选<strong>「自定义」</strong>之后，才会出现「工作时长 / 短休息时长 / 长休息时长」三行让你填。</p>\n<p><strong>「长休息间隔」是独立的一项</strong>，不跟着预设走：它决定每隔几个专注进一次长休息，默认 4（也就是每 4 个专注后休息得久一点），可选 1–20。换预设不会改掉它。</p>\n<h2>可以调什么（设置项）</h2>\n<h3>外观</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>面板布局</td><td>计时盘</td><td>切换面板布局（目前只有这一种）</td></tr><tr><td>面板主题</td><td>番茄</td><td>切换面板主题，共 10 套：番茄 / 墨白 / 方格纸 / 苔原 / 海雾 / 暖沙 / 蜜柑 / 樱粉 / 咖啡 / 夜航。改完<strong>立刻</strong>生效，不用重载</td></tr></tbody></table>\n<h3>时间方案</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>预设方案</td><td>—</td><td>从上面 11 个预设里选，或选「自定义」自己填</td></tr><tr><td>工作时长</td><td>25</td><td>一轮专注多少分钟（1–120）。<strong>只有选了「自定义」才出现</strong></td></tr><tr><td>短休息时长</td><td>5</td><td>短休息多少分钟（1–60）。同上，只有自定义才出现</td></tr><tr><td>长休息时长</td><td>15</td><td>长休息多少分钟（1–60）。同上，只有自定义才出现</td></tr><tr><td>长休息间隔</td><td>4</td><td>每隔几个专注进一次长休息（1–20）。不跟预设走，始终可调</td></tr></tbody></table>\n<h3>行为</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>强制专注模式</td><td>关</td><td>打开后，<strong>专注进行中无法暂停、跳过或重置</strong>，命令面板里的同名操作也一样被挡；只能等它走完。还没开始时想启动不受影响</td></tr><tr><td>自动循环</td><td>—</td><td>一段结束后自动开始下一段</td></tr><tr><td>自动跳过休息</td><td>—</td><td>专注结束后直接进下一个专注，跳过休息</td></tr><tr><td>声音提醒</td><td>—</td><td>阶段切换时播放提示音</td></tr><tr><td>倒数滴答</td><td>—</td><td>倒计时最后十秒的轻响。嫌吵可以单独关它</td></tr><tr><td>提示音音量</td><td>100</td><td>提示音的音量大小，旁边有「试听」按钮可以先听一下</td></tr><tr><td>打开时恢复方式</td><td>后台继续</td><td>启动插件时遇到没走完的倒计时怎么办：<strong>后台继续</strong>（静默接着走）或 <strong>自动弹窗</strong>（把计时盘推到眼前）</td></tr></tbody></table>\n<h2>有哪些命令</h2>\n<table><thead><tr><th>命令名（去命令面板搜这个）</th><th>做什么</th></tr></thead><tbody><tr><td>番茄钟</td><td>打开计时盘面板</td></tr><tr><td>开始/重置专注</td><td>主按钮那颗：没开始就开跑；跑着就暂停/继续；重置走按钮内二次确认</td></tr><tr><td>跳过休息</td><td>跳过当前休息段，直接进下一段（空闲时不可用；强制专注下被拦）</td></tr><tr><td>暂停/继续专注</td><td>暂停或继续当前专注（强制专注下被拦）</td></tr></tbody></table>\n<h2>要注意的地方</h2>\n<ul>\n<li><strong>强制专注是真的强制</strong>。开了之后专注中连暂停都做不了，只有等它走完——所以开始之前请确认这轮时长是你扛得住的。</li>\n<li><strong>重置和跳过要「点两次」</strong>。不是弹确认框，是按钮自己变成待确认的样子，再点一下才执行；点主按钮可以撤销。</li>\n<li><strong>三段时长只有选「自定义」才能改</strong>。选了预设方案，那三行根本不出现。</li>\n<li><strong>「长休息间隔」不跟着预设走</strong>。换预设后它保持你自己设的值。</li>\n<li><strong>「自动循环」+「强制专注」一起开会一直转</strong>：休息也会自动接，专注中又不可打断，想中途退出只能等。</li>\n<li><strong>关掉 Obsidian 倒计时不会丢</strong>，下次启动按「打开时恢复方式」继续或弹窗。</li>\n<li>计时记录会自动瘦身，不会把文件撑大。</li>\n</ul>\n<h2>常见问题</h2>\n<p><strong>专注做到一半想停怎么办？</strong></p>\n<p>没开「强制专注模式」的话，点暂停或重置就行；开了就只能等它走完——这就是它存在的意义。</p>\n<p><strong>长休息什么时候来？</strong></p>\n<p>按你设的「长休息间隔」自动出现：默认每 4 个专注后进一次长休息，其余都是短休息。</p>\n<p><strong>为什么「跳过」按钮是灰的？</strong></p>\n<p>因为你当前是空闲状态（没在计时），跳过没有意义，按钮被禁用了。</p>\n<p><strong>重启 Obsidian 后倒计时还在吗？</strong></p>\n<p>在。默认「后台继续」，静默接着走；想让它主动提醒你，就把「打开时恢复方式」改成「自动弹窗」。</p>\n<p><strong>提示音太吵 / 太轻怎么办？</strong></p>\n<p>关掉「声音提醒」，或者拖「提示音音量」那个滑杆（旁边有「试听」可以先听）。如果只嫌最后十秒那阵轻响吵，单独关「倒数滴答」就行。</p>\n<p><strong>我想换个专注时长，为什么找不到输入框？</strong></p>\n<p>因为你选的是预设方案。把「预设方案」改成「自定义」，三行时长才会出现。</p>\n<p><strong>面板能换皮肤吗？</strong></p>\n<p>能，「面板主题」有 10 套可选，改完立即生效，不用重载插件。</p>\n<p><strong>怎么统计我做了多少个番茄？</strong></p>\n<p>打开番茄钟面板，下方有统计区，可以在「近 7 天明细」和「近 6 个月趋势」之间切换。</p>","no":28},{"id":"smartcat","title":"小橘陪伴猫","group":"工具","tags":["tool","smartcat"],"domain":"smartcat","html":"<blockquote>在你库里养一只会说话的猫 —— 它读你的笔记、记得你说过什么，偶尔主动来找你说话</blockquote>\n<h2>什么时候用它</h2>\n<p>想要一个「住在库里」的陪伴角色时用它。小橘不是普通的聊天窗：它可以把你指定的目录读进<strong>记忆库</strong>，记得你库里发生过什么，还会按你的活跃时段主动搭话。</p>\n<p>它跟「第二大脑对话」的分工：第二大脑是<strong>检索工具</strong>（找笔记、带材料回答）；小橘是<strong>角色</strong>（有记忆、有性格，聊天时可能会自己想起你笔记里的事）。想找东西用第二大脑，想有人陪着聊用<strong>小橘聊天</strong>。</p>\n<p>一个前置条件：<strong>聊天要先配好 AI</strong>（见「AI」章）—— 没配就聊不了。</p>\n<h2>怎么用</h2>\n<h3>唤出和收起</h3>\n<ul>\n<li>命令面板搜 <strong>小橘</strong> —— 唤出小橘。</li>\n<li>命令面板搜 <strong>小橘聊天</strong> —— 直接开聊天。</li>\n<li>命令面板搜 <strong>隐藏小橘</strong> —— 收起来。</li>\n<li>命令面板搜 <strong>小橘数据面板</strong> —— 看它的状态全貌。</li>\n</ul>\n<h3>让它认识你的笔记</h3>\n<ol>\n<li>打开小橘的设置页（设置面板 → 工具 → 小橘），找到<strong>记忆来源</strong>这一组。</li>\n<li>在<strong>记忆文件夹</strong>里加目录 —— 可以加多个。加进去的目录，里面的笔记就会进小橘的记忆库。</li>\n<li>之后这些笔记再有改动，它会<strong>自动增量</strong>同步，不用你手动重扫。</li>\n</ol>\n<h3>让它按你的习惯说话</h3>\n<ul>\n<li><strong>小橘对我的称呼</strong>：它提到你时怎么叫你（默认「包仔」）。</li>\n<li><strong>自言自语间隔</strong> × <strong>说话概率</strong>：这两个共同决定它多久主动说一次话 —— 间隔到了，它还要再「掷一次骰子」，概率没中就这次不说了。</li>\n<li><strong>主动关心</strong>：每周按你的活跃时段主动来搭话。</li>\n</ul>\n<h3>想让它忘掉某些事</h3>\n<ul>\n<li>从「记忆文件夹」里移除某个目录 —— 那个目录的记忆会一起清掉。</li>\n<li>想全部重来：删掉数据目录里的 <code>smartcat-memory.json</code> 和 <code>smartcat-memory-vectors.vec</code>，再重新同步记忆目录。</li>\n</ul>\n<h2>数据放在哪</h2>\n<p>全部在数据目录里（默认在你的库里，见「通用」章的数据存储路径）。</p>\n<table><thead><tr><th>文件</th><th>里面是什么</th><th>你要留意什么</th></tr></thead><tbody><tr><td><code>smartcat.json</code></td><td>小橘的配置、心情与性格</td><td>换电脑时跟着复制走</td></tr><tr><td><code>smartcat-memory.json</code></td><td><strong>记忆流</strong> —— 它记住的事</td><td>删了它就会「失忆」，重扫记忆目录可以重建</td></tr><tr><td><code>smartcat-memory-vectors.vec</code></td><td>记忆的检索数据（<strong>二进制</strong>）</td><td>打不开看。换了嵌入模型必须删掉它重建，否则还是旧的</td></tr><tr><td><code>smartcat-behavior.json</code></td><td><strong>行为流</strong> —— 你在库里干了什么</td><td>有保留天数和条数上限，超了自动裁掉最旧的</td></tr></tbody></table>\n<blockquote><strong>行为流不是永久档案</strong>，它有天数与条数两道上限。首页那条时间线吃的也是这个流。</blockquote>\n<h2>可以调什么（设置项）</h2>\n<h3>外观</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>面板皮肤</td><td>橘猫</td><td>13 种外观可选（橘猫 / 灰猫 / 黑猫 / 白猫 / 三花猫 / 霓虹灯 / 银河星空 / 液态金属 / 火焰 / 水晶透明 / 赛博朋克 / 彩虹渐变 / 全息投影），点一下立刻换</td></tr></tbody></table>\n<h3>互动</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>小橘对我的称呼</td><td>包仔</td><td>它提到你时用的称呼</td></tr><tr><td>自言自语间隔</td><td>5 分钟</td><td>主动说话的间隔（1–60 分钟）</td></tr><tr><td>说话概率</td><td>0.3</td><td>到点之后真开口的概率（0.1–1）。间隔到了还要掷这一次，不是到点必说</td></tr><tr><td>主动关心</td><td>开</td><td>每周按你的活跃时段主动搭话</td></tr></tbody></table>\n<h3>记忆</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>短期记忆量</td><td>50</td><td>短期记忆保留的对话轮数（50–200）</td></tr><tr><td>上下文字数限制</td><td>500</td><td>上下文最大字数（0–1000）。<strong>填 0 不是「不限」，是「只取当前行」</strong></td></tr><tr><td>上下文分布比例</td><td>0.5</td><td>上下文在「记忆」与「对话」之间怎么分配（0.1–0.9）</td></tr><tr><td>记忆打分范围</td><td>智能</td><td>智能 / 云端 / 日记 / 本地四档，决定它给记忆打分的口径</td></tr><tr><td>向量化模型</td><td>空</td><td><strong>这一行是只读跟随</strong> —— 它显示「AI」页里的嵌入模型，在这里单独填不生效</td></tr><tr><td>分块字符上限</td><td>800</td><td>长笔记切成多大一块进记忆（200–6000 字）。长笔记切得细，检索更准但条目更多</td></tr></tbody></table>\n<h3>记忆来源</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>记忆文件夹</td><td>空</td><td>哪些目录的笔记进它的记忆库，可多选。<strong>移除一个目录 = 那部分的记忆一起清掉</strong></td></tr></tbody></table>\n<h3>存储与记忆</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>行为流保留天数</td><td>60 天</td><td>行为流条目保留多久（1–365 天），超了自动丢最旧的</td></tr><tr><td>行为流最大条数</td><td>10000 条</td><td>行为流最多存多少条（100–10000），超了自动丢最旧的</td></tr></tbody></table>\n<h3>数据面板</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>打开数据面板</td><td>按钮</td><td>打开小橘的数据面板（状态全貌 + 每周懂你报告）</td></tr><tr><td>显示行为日志</td><td>开</td><td>数据面板里是否显示行为日志那一页</td></tr></tbody></table>\n<h2>有哪些命令</h2>\n<table><thead><tr><th>命令名（去命令面板搜这个）</th><th>做什么</th></tr></thead><tbody><tr><td>小橘</td><td>唤出小橘</td></tr><tr><td>小橘聊天</td><td>直接开聊天</td></tr><tr><td>隐藏小橘</td><td>收起来</td></tr><tr><td>小橘数据面板</td><td>打开它的数据面板</td></tr></tbody></table>\n<h2>要注意的地方</h2>\n<ul>\n<li><strong>没配 AI 就聊不了</strong>：聊天走的是「AI」页配的通道，这是硬前提。</li>\n<li><strong>「向量化模型」那一行改了没用</strong>：它只是显示 AI 页的嵌入模型。真换了嵌入模型，记忆数据必须重建 —— 删掉 <code>smartcat-memory-vectors.vec</code> 再重扫记忆目录。</li>\n<li><strong>移除记忆目录 = 删记忆</strong>：不是「以后不再更新」，而是已经建好的那部分被清掉。想恢复得重新加回去重扫。</li>\n<li><strong>「上下文字数限制」填 0 的含义特殊</strong>：0 不是不限，是只取当前行。</li>\n<li><strong>行为流有双上限</strong>（天数 + 条数），超了自动裁。别把它当永久档案。</li>\n<li><strong>主动说话由「间隔 × 概率」共同决定</strong>，不是到点必说。</li>\n<li>首页的「小橘点评」来自行为流里的星级评价 —— 把小橘收起来不影响已有的点评。</li>\n</ul>\n<h2>常见问题</h2>\n<p><strong>小橘怎么知道我笔记里的事？</strong></p>\n<p>把目录加进「记忆文件夹」，笔记分块后进它的记忆库；聊天时它按意思去记忆里翻相关的片段。</p>\n<p><strong>换电脑后它还认识我吗？</strong></p>\n<p>把 <code>smartcat-memory.json</code> 和 <code>smartcat-memory-vectors.vec</code> 跟着库一起复制过去就认得。中途换过嵌入模型的话，要删掉 <code>.vec</code> 重建一次。</p>\n<p><strong>它一直不主动说话？</strong></p>\n<p>查三件事：「自言自语间隔」是不是太长、「说话概率」是不是太低、「主动关心」有没有开。记住间隔到了还要掷一次概率，概率 0.3 意味着多数时候它不会开口。</p>\n<p><strong>怎么让它忘掉某些事？</strong></p>\n<p>从「记忆文件夹」移除对应目录（那部分记忆会被清掉），或者删掉两个记忆文件重新来。</p>\n<p><strong>它跟第二大脑什么关系？</strong></p>\n<p>底层共用同一套嵌入模型，但定位完全不同：第二大脑是检索工具，小橘是带记忆与性格的角色。</p>\n<p><strong>换了皮肤没变化？</strong></p>\n<p>皮肤是点一下立刻换的，不用重载插件。如果没变化，确认你点的是色块而不是旁边的空白。</p>","no":29},{"id":"encrypt","title":"保险库","group":"安全","tags":["safe","encrypt"],"domain":"encrypt","html":"<blockquote>给你的笔记配一把钥匙：锁进去以后，库里只剩一串谁也读不懂的乱码，没有这把钥匙就永远打不开</blockquote>\n<h2>什么时候用它</h2>\n<p>有<strong>真的不想被别人看到</strong>的内容时才用它：私密日记、证件信息、账号备注、合同扫描件。</p>\n<p>加密之后，原文会从你的库里消失，换成一个密文文件躺进保险库；笔记里的图片、附件也一起被加密。想读的时候必须先解锁，输入主密码。</p>\n<p>它和「密码本」是<strong>同一个库、同一把锁</strong>：密码本里存的账号密码，本质上就是保险库里的一种特殊条目。把保险库锁上，密码本也一起锁，不存在只锁一半的情况。</p>\n<p>加密用的是业界成熟的通行做法（口令经十万次迭代派生密钥，正文与附件用 AES-256-GCM 加密），安全性不用担心 —— 真正要你担心的是下面这件事。</p>\n<p>---</p>\n<h3>⚠️ 先接受这一条：主密码忘了，就永远打不开</h3>\n<p><strong>主密码不会被保存，也无法找回，没有任何后门。</strong></p>\n<ul>\n<li>插件自己不知道你的密码，只在你输入的那一刻用它解开密文；</li>\n<li>没有「找回密码」，没有「重置密码」，没有「安全问题」，没有客服能帮你解开；</li>\n<li><strong>忘了主密码 = 那批笔记和附件永久丢失</strong>，换多少台电脑、找谁都没用。</li>\n</ul>\n<p>这不是缺陷，正是加密能成立的前提：一把连软件作者都打不开的锁，才算真的锁住了。</p>\n<p>所以第一次设置主密码时，面板会让你勾选一句确认——「我已了解：主密码无法找回，遗忘将导致密文永久无法恢复」。<strong>这不是走过场。</strong> 勾完请立刻把密码记进你信任的密码管理器（面板原文的建议是 Bitwarden 这类），这是唯一的补救手段。</p>\n<p>另外，<strong>「重设主密码」不是找回</strong>：它会生成一份全新的空清单，旧密文从此永久无法解出。只有在你确定旧数据不要了时才用它。</p>\n<p>---</p>\n<h2>怎么用</h2>\n<h3>第一次：设置主密码</h3>\n<ol>\n<li>打开命令面板（Obsidian 里按 <code>Ctrl/Cmd + P</code>），搜<strong>「保险库」</strong>，回车。</li>\n<li>第一次打开会让你设一个主密码：<strong>至少 4 位</strong>，输两遍确认。</li>\n<li>屏幕上会出现那段红色提醒，读完勾选「我已了解……」，才算设完。</li>\n<li>设完立刻把密码存进密码管理器。</li>\n</ol>\n<p>以后每次打开保险库，都要先输这个密码解锁。</p>\n<h3>加密一篇笔记</h3>\n<ol>\n<li>在 Obsidian 里打开那篇要加密的笔记。</li>\n<li>打开命令面板，搜<strong>「加密当前笔记」</strong>——保险库面板顶部也有这个按钮。</li>\n<li>插件会把正文和里面引用的图片、附件逐个加密，写进保险库目录。</li>\n<li>加密完成后，<strong>原来的笔记文件会被删掉</strong>，库里只剩密文，笔记标题变成保险库里的一条记录。</li>\n<li>想读回来，就在保险库里解锁后打开它，或者「<strong>还原</strong>」（还原 = 解密、写回原来的位置，同时删掉这份密文）。</li>\n</ol>\n<p>两个细节要注意：</p>\n<ul>\n<li><strong>如果某张图片同时也被别的笔记引用</strong>，插件会保留这张原图不删，好让另一篇笔记不断链；密文照样入库。</li>\n<li><strong>加密过程中别去改那篇笔记</strong>。加密要跑一会儿（附件越多越久），这段时间里你新敲的字很可能不会进密文；插件检测到原文被改动时，会保留原文件不删，但你要重新加密一次才保险。</li>\n</ul>\n<h3>手动上锁</h3>\n<p>解锁后想立刻锁上，打开命令面板搜<strong>「锁定保险库」</strong>——一步就锁，不用进面板。</p>\n<p>如果开了「安全模式」（见下面的设置项），<strong>关掉保险库窗口就会自动上锁</strong>，不怕忘。</p>\n<h3>看加密后的图片和视频</h3>\n<p>加密进去的图片，看的方式有两种，各有取舍：</p>\n<table><thead><tr><th>方式</th><th>怎么用</th><th>代价</th></tr></thead><tbody><tr><td><strong>压缩预览</strong></td><td>默认就开着。加密时顺手生成一张压缩过的缩略图，之后<strong>不用解密</strong>就能看到</td><td>画质是压缩过的，不清晰</td></tr><tr><td><strong>自动加载原图</strong></td><td>在设置里打开「预览自动加载原图」</td><td>画质最好，但一打开预览就会把<strong>所有原图一起解密</strong>，明显变慢</td></tr></tbody></table>\n<p>默认方案是「压缩预览」：平时看缩略图够用，要看清细节再单独点开原图。</p>\n<h2>数据放在哪</h2>\n<table><thead><tr><th>位置</th><th>里面是什么</th><th>你要留意什么</th></tr></thead><tbody><tr><td><code>&lt;数据存储路径&gt;/.ENCRYPT/</code></td><td>所有密文：正文密文、附件密文、压缩预览、条目清单</td><td>目录名以点开头，Obsidian 侧栏里<strong>看不见</strong>（防误删）。里面的文件名都是随机名，看不出是哪篇笔记</td></tr><tr><td>同目录下的清单文件</td><td>加密条目的记录（标题、时间、指向哪个密文文件）</td><td>清单本身也是加密的，没有主密码打不开</td></tr></tbody></table>\n<p><strong>这个目录的位置是固定的</strong>，跟着「通用」里的「数据存储路径」走，不能在保险库里单独改。</p>\n<p><strong>换电脑 / 备份时</strong>：把 <code>.ENCRYPT</code> 整个目录跟库一起复制过去，并且——再说一遍——记住主密码。</p>\n<h2>可以调什么（设置项）</h2>\n<h3>外观</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>面板布局</td><td>三栏</td><td>切换面板布局（目前只有这一种）</td></tr><tr><td>面板主题</td><td>钢灰</td><td>切换面板主题（目前只有这一种）</td></tr></tbody></table>\n<h3>安全</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>安全模式</td><td>关</td><td>打开后，<strong>关掉保险库窗口就立刻自动上锁</strong>。改完要重载插件才生效</td></tr></tbody></table>\n<h3>预览</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>生成压缩预览</td><td>开</td><td>加密图片视频时顺手生成一张压缩缩略图，之后不解密就能看。下面两行是它的子项，关掉这行它们会一起隐藏</td></tr><tr><td>预览长边</td><td>384</td><td>缩略图的目标长边像素，可选 64–1024。调小打开更快、更糊</td></tr><tr><td>预览质量</td><td>0.5</td><td>缩略图的压缩质量（0.1–1）。调高更清晰、文件更大</td></tr><tr><td>预览自动加载原图</td><td>关</td><td>打开预览就自动解密全部原图，画质最好但明显变慢</td></tr></tbody></table>\n<blockquote>「生成压缩预览」「预览长边」「预览质量」「预览自动加载原图」这四行改完都要<strong>重载插件</strong>才生效。</blockquote>\n<h2>有哪些命令</h2>\n<table><thead><tr><th>命令名（去命令面板搜这个）</th><th>做什么</th></tr></thead><tbody><tr><td>保险库</td><td>打开保险库面板</td></tr><tr><td>加密当前笔记</td><td>把当前这篇笔记连附件一起加密进保险库</td></tr><tr><td>锁定保险库</td><td>立刻上锁，之后要输密码才能再进</td></tr></tbody></table>\n<p>密码本那几条命令（快速取密 / 快速生成密码 / 打开密码本 / 锁定密码本）见「密码本」章。</p>\n<h2>要注意的地方</h2>\n<ul>\n<li><strong>主密码忘了就是永久丢失</strong>。不存储、无找回、无后门。这是设计，不是 bug。如果你现在还没把密码存进别的地方，请先去存。</li>\n<li><strong>「重设主密码」= 放弃旧数据</strong>。它会生成全新空清单，旧密文从此解不开。别把它当成「改个密码」。</li>\n<li><strong>改「数据存储路径」等于改了密文位置</strong>。插件会去新位置找密文，<strong>已有的密文不会自动搬过去</strong> —— 改完保险库会看起来空了，需要你手工把旧的 <code>.ENCRYPT</code> 目录移过去。</li>\n<li><strong>老版本用户</strong>：如果你早年的密文在 <code>CONFIG/.ENCRYPT</code>，而你现在的数据存储路径不是这里，保险库可能显示为空——把旧目录的密文手工挪到新位置即可。</li>\n<li><strong>加密期间别编辑那篇笔记</strong>。附件加密需要时间，那段时间里对原文的改动有丢失风险。</li>\n<li><strong>预览的两种取向只能选一个</strong>：要快就用压缩预览，要清晰就开「自动加载原图」并接受变慢。</li>\n<li><strong>改预览相关设置要重载插件</strong>。</li>\n<li><strong>「安全模式」只管「忘锁」</strong>：它的作用是关窗自动上锁，不是额外的防护层。</li>\n<li>外观两行目前各只有一个选项，等于暂时没得换。</li>\n</ul>\n<h2>常见问题</h2>\n<p><strong>我把主密码忘了，还有救吗？</strong></p>\n<p>没有。这是唯一一个没有补救手段的问题。只能去找加密之前的原文副本，或者你自己的备份。</p>\n<p><strong>加密后原笔记去哪了？</strong></p>\n<p>原文件被删掉了，正文和附件都以密文形式存在 <code>.ENCRYPT</code> 里。想读回来就在保险库里解锁打开，或者点「<strong>还原</strong>」把它变回普通笔记。</p>\n<p><strong>我能只加密图片吗？</strong></p>\n<p>图片、视频这类附件是跟着笔记一起进密文的，不能脱离笔记单独挑一张图加密。反过来，附件是逐个独立加密的（各自一把派生密钥），所以互不影响。</p>\n<p><strong>为什么打开预览很慢？</strong></p>\n<p>看「预览自动加载原图」是不是开着 —— 它会一次性解密全部原图。介意就关掉它，改看压缩缩略图。</p>\n<p><strong>换电脑要做什么？</strong></p>\n<p>把 <code>.ENCRYPT</code> 目录连同库一起复制过去，并且记住主密码。忘了密码，换多少台机器都打不开。</p>\n<p><strong>「安全模式」和手动锁定有什么区别？</strong></p>\n<p>安全模式是「关窗自动锁」，「锁定保险库」是「立刻锁」。两个可以一起用。</p>\n<p><strong>保险库里能看到我的笔记标题吗？</strong></p>\n<p>能看到标题、时间这些条目信息 —— 它们和正文一样是加密存放的，解锁后才能读出来。密文文件名本身是随机的，看不出内容。</p>","no":30},{"id":"password-vault","title":"密码本","group":"安全","tags":["safe","password"],"domain":"password-vault","html":"<blockquote>一个塞在自己库里的账号密码抽屉 —— 跟保险库同一把锁，但取密码可以不开抽屉</blockquote>\n<h2>什么时候用它</h2>\n<p>想把散落各处的账号密码收在一处、又不想交给第三方密码管理器时用它。</p>\n<p>它和「保险库」的关系要记牢：<strong>同一个库、同一把锁</strong>。密码条目就存在保险库的加密清单里，锁上保险库，密码本一起锁；反过来也一样，不存在只锁一半的情况。</p>\n<p>日常最顺手的是<strong>「快速取密」</strong>：不用解锁、不用开面板、不用看窗口，在命令面板里搜一下就复制走了，60 秒后剪贴板自动清空。</p>\n<p>---</p>\n<h3>⚠️ 先接受这一条：主密码忘了，密码全没了</h3>\n<p>密码本没有自己的密码，用的是<strong>保险库的主密码</strong>。而主密码<strong>不存储、无法找回、没有后门</strong>。</p>\n<p>也就是说：<strong>忘了主密码 = 你存在这里的所有账号密码永久打不开</strong>，没有找回通道，没有重置按钮。</p>\n<p>这不是危言耸听——这是「插件作者也打不开」这件事的代价。在往里存任何东西之前，请确认主密码已经记在你信任的（最好是另一个）密码管理器里。详见「保险库」章。</p>\n<p>---</p>\n<h2>怎么用</h2>\n<h3>第一次使用</h3>\n<ol>\n<li>先到<strong>保险库</strong>里设好主密码（第一次打开保险库时会引导你设置）。</li>\n<li>打开命令面板搜<strong>「密码本」</strong>，输入主密码解锁，就能看到条目列表。</li>\n<li>想立刻锁上，搜<strong>「锁定密码本」</strong>。</li>\n<li>开了「安全模式」的话，<strong>关掉密码本窗口就自动上锁</strong>，不怕忘。</li>\n</ol>\n<h3>存一条密码</h3>\n<ol>\n<li>打开密码本面板，点新增条目。</li>\n<li>填：平台 / 站点名、网址、账号、密码、备注。</li>\n<li>常用条目可以勾上<strong>收藏</strong>。面板顶栏有「全部 / 收藏」两个分段，切到「收藏」就只看你标过的那些，找起来快。列表本身按创建时间排，收藏不改变顺序，也不改变条目归在哪一类。</li>\n</ol>\n<h3>找一条密码</h3>\n<p>两种方式，各有分工：</p>\n<table><thead><tr><th>想要什么</th><th>用哪条</th><th>会发生什么</th></tr></thead><tbody><tr><td><strong>快</strong></td><td>命令面板搜<strong>「快速取密」</strong></td><td>搜一下就直接复制到剪贴板，不弹明文、不开面板。<strong>搜不到时它会直接给你生成一条新密码</strong>（这是设计，不是出错）</td></tr><tr><td><strong>稳</strong></td><td>打开<strong>「密码本」</strong>面板</td><td>按平台或账号慢慢搜，看得见全文再复制</td></tr></tbody></table>\n<p>无论哪种方式，<strong>复制后 60 秒剪贴板会被自动清空</strong>——在这之前粘到别处是可以的，超时就没了。</p>\n<h3>生成一条新密码</h3>\n<p>两个入口，规则同一套：</p>\n<ul>\n<li><strong>「快速生成密码」</strong>：不解锁、不开面板，直接生成一条新密码并复制走。同时它会记住这条「待存」——<strong>下次你解锁密码本时，会自动弹出录入窗并把这条密码预填好</strong>，你只要补上平台和账号就行。</li>\n<li><strong>「快速取密」搜不到时</strong>，也会走生成。</li>\n</ul>\n<p>生成规则在设置里改（见下）：默认 16 位，字符从数字、大小写字母和一批符号里随机取。</p>\n<blockquote>默认字符集<strong>刻意避开了 <code>-</code> <code>{</code> <code>}</code> 这类符号</strong>——很多网站的注册表单会判它们不合法，省得你生成完还得改。</blockquote>\n<h2>数据放在哪</h2>\n<p>密码条目<strong>不是独立的文件</strong>，而是保险库加密清单里的一种特殊条目。</p>\n<table><thead><tr><th>位置</th><th>里面是什么</th><th>你要留意什么</th></tr></thead><tbody><tr><td><code>&lt;数据存储路径&gt;/.ENCRYPT/</code></td><td>你的全部密码条目（加密状态）</td><td>以点开头的目录在 Obsidian 侧栏里看不见，防误删。<strong>没有主密码打不开</strong></td></tr></tbody></table>\n<p>每条密码包含这些信息：平台 / 站点名、网址、账号、密码、备注、创建时间、是否收藏。</p>\n<p><strong>换电脑时</strong>：把 <code>.ENCRYPT</code> 目录连同库一起复制过去，并且记住主密码。</p>\n<h2>可以调什么（设置项）</h2>\n<h3>外观</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>面板布局</td><td>三栏</td><td>切换面板布局（目前只有这一种）</td></tr><tr><td>面板主题</td><td>金印</td><td>切换面板主题（目前只有这一种）</td></tr></tbody></table>\n<h3>生成</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>密码生成字符集</td><td>数字 + 大小写字母 + 一批符号</td><td>随机生成密码时用哪些字符。改完要重载插件</td></tr><tr><td>密码生成长度</td><td>16</td><td>生成多少个字符，可选 4–128。改完要重载插件</td></tr></tbody></table>\n<h3>安全</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>安全模式</td><td>关</td><td>打开后，<strong>关掉密码本窗口就立刻自动上锁</strong></td></tr></tbody></table>\n<blockquote>「安全模式」和保险库的那一行是<strong>同一件事</strong>：在保险库里打开，密码本这边也就开了；关掉也是两边一起关。</blockquote>\n<h2>有哪些命令</h2>\n<table><thead><tr><th>命令名（去命令面板搜这个）</th><th>做什么</th></tr></thead><tbody><tr><td>密码本</td><td>打开密码本面板（需要解锁）</td></tr><tr><td>快速取密</td><td>模糊搜现有密码：搜到就复制；搜不到就生成一条新的并复制。60 秒后清空剪贴板</td></tr><tr><td>快速生成密码</td><td>不解锁不开面板，直接生成并复制，并记住待存——下次解锁自动预填录入窗</td></tr><tr><td>锁定密码本</td><td>立刻上锁</td></tr></tbody></table>\n<blockquote><strong>别搜错</strong>：「快速取密」和「快速生成密码」名字很像，但前者是「先找、找不到才生成」，后者是「跳过查找直接出新密码」。</blockquote>\n<h2>要注意的地方</h2>\n<ul>\n<li><strong>主密码忘了就全没了</strong>。跟保险库同一把锁、同一套密文，不存储、无找回、无后门。</li>\n<li><strong>锁是共享的</strong>。锁定保险库 = 锁定密码本；反过来也一样。</li>\n<li><strong>「快速取密」搜不到会直接生成新密码</strong>，这不是报错。想只查不生成，就老老实实打开面板搜。</li>\n<li><strong>剪贴板 60 秒后自动清空</strong>。在这之前粘到别处是可以的，超时就清掉了。</li>\n<li><strong>字符集和长度改完要重载插件</strong>才生效。</li>\n<li><strong>别往字符集里塞奇怪符号</strong>。这是给各种网站注册表单用的，<code>-</code> <code>{}</code> 这类很容易被判不合法。</li>\n<li><strong>收藏是用来筛选的，不是用来排序的</strong>：切到「收藏」分段就只看收藏过的条目。列表顺序始终按创建时间，最新的在前。</li>\n<li>外观两行目前各只有一个选项。</li>\n</ul>\n<h2>常见问题</h2>\n<p><strong>我的密码存在哪？是明文吗？</strong></p>\n<p>不是明文。它是保险库里的一条加密条目，密文躺在数据存储路径的 <code>.ENCRYPT</code> 子目录里，没有主密码谁也读不出来。</p>\n<p><strong>能不能只复制密码，不打开面板？</strong></p>\n<p>能，用「快速取密」——搜到就复制到剪贴板，不开面板、也不把明文弹到屏幕上。</p>\n<p><strong>「快速取密」搜不到我的账号怎么办？</strong></p>\n<p>它会退化成「给你生成一条新的」，这是设计。想精确找，就打开密码本面板搜；常用的条目勾上收藏，之后切到「收藏」分段一眼就能看到。</p>\n<p><strong>生成的密码里为什么没有 <code>-</code> 或 <code>{}</code>？</strong></p>\n<p>字符集刻意避开了这些容易在注册表单里出问题的符号。想要别的字符集，去「生成」组改，改完重载插件。</p>\n<p><strong>「快速生成密码」生成的密码，我还没存呢，会丢吗？</strong></p>\n<p>不会。它会记住这条「待存」，等你下次解锁密码本时自动弹出录入窗并预填好，你补上平台和账号就行。但如果这期间你把它从剪贴板弄丢了（60 秒后会自动清空），那就只能再生成一次。</p>\n<p><strong>换电脑后密码还在吗？</strong></p>\n<p>在——只要 <code>.ENCRYPT</code> 目录跟库一起复制过去，并且你记得主密码。忘了主密码，复制到哪台机器都打不开。</p>","no":31}];
const GROUPS = ["开始", "基础", "智能", "记录", "收集", "媒体与阅读", "工具", "安全", "进阶"];
let cur = 0, q = '';
const $ = (s) => document.querySelector(s);

function esc(t){return t.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function textOf(c){ if(!c._t){ c._t = c.html.replace(/<[^>]+>/g,' ').replace(/\s+/g,' '); } return c._t; }

function renderToc(){
  let h = '';
  for (const g of GROUPS){
    const list = CHAPTERS.filter(c => c.group===g && (!q || match(c)));
    if (!list.length) continue;
    h += `<div class="bk-sec">${g}</div>`;
    for (const c of list){
      h += `<button class="bk-item${c.no-1===cur?' on':''}" data-go="${c.no-1}">${c.title}</button>`;
    }
  }
  $('#toc').innerHTML = h;
  if (q){
    const list = CHAPTERS.filter(match);
    const box = list.slice(0,12).map(c => {
      const t = textOf(c), i = t.indexOf(q);
      const frag = i<0 ? '' : t.slice(Math.max(0,i-24), i+40);
      return `<button class="bk-hit" data-go="${c.no-1}"><div>${c.title} <span class="where">${c.group}</span></div>` +
             (frag ? `<div class="where">…${esc(frag)}…</div>` : '') + '</button>';
    }).join('');
    $('#toc').insertAdjacentHTML('afterbegin', `<div class="bk-hits">${box||'<div class="where" style="padding:0 8px">没有命中</div>'}</div>`);
  }
  bind();
}
function match(c){ return (c.title + ' ' + textOf(c)).toLowerCase().includes(q.toLowerCase()); }
function bind(){
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => open(+b.dataset.go));
}
function hl(html){
  if(!q) return html;
  return html.replace(new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')','gi'), '<mark>$1</mark>');
}
/* 目录抽屉（移动端）：点 ☰ 开、点遮罩或选中条目关；桌面端这些类名/按钮都不生效
   （抽屉样式与 .bk-menu 的 display:flex 都在 ≤768px 里）。 */
function setDrawer(open){ document.body.classList.toggle('toc-open', !!open); }
function bindDrawer(){
  $('#menu').onclick = () => setDrawer(!document.body.classList.contains('toc-open'));
  $('#scrim').onclick = () => setDrawer(false);
}
function open(i){
  cur = i; const c = CHAPTERS[i];
  setDrawer(false); // 换章即收回抽屉，让正文立刻可见
  $('#page').innerHTML = `<h1>${c.title}</h1>` + hl(c.html) +
    `<div class="bk-foot">第 ${c.no} / ${CHAPTERS.length} 章 · ${c.group}${c.tags.length?' · 标签：'+c.tags.join(' / '):''}</div>`;
  $('#page').scrollTop = 0;
  renderToc();
}
function prog(){
  const p = $('#page'), max = p.scrollHeight - p.clientHeight;
  $('#prog').style.width = (max<=0?100:Math.round(p.scrollTop/max*100)) + '%';
}
document.addEventListener('DOMContentLoaded', () => {
  $('#page').addEventListener('scroll', prog);
  bindDrawer();
  $('#q').addEventListener('input', e => { q = e.target.value.trim(); renderToc(); });
  renderToc(); open(0);
});
</script>
</body>
</html>
