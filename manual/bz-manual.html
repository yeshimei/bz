<script>
const CHAPTERS = [{"id":"overview","title":"包仔是什么","group":"开始","tags":["getting-started"],"domain":"","html":"<p>包仔是一个跑在 Obsidian 里的插件：它把「记录、收集、阅读、复习、加密」这些事，做成 25 个各自独立又互相读得懂的功能域。你的笔记仍然是普通 Markdown，包仔只负责在你需要的时候把它整理好、查得到、记得住。</p>\n<blockquote>一句话：<strong>你的库还是你的库，包仔是长在库上的一层工具。</strong></blockquote>\n<h2>它由什么组成</h2>\n<table><thead><tr><th>层面</th><th>数量</th><th>说明</th></tr></thead><tbody><tr><td>功能域</td><td>25</td><td>每个域管一件事（日记、备忘录、脸谱、影院、复习计划…）</td></tr><tr><td>命令</td><td>72</td><td>命令面板里搜得到，可绑快捷键</td></tr><tr><td>设置键</td><td>148</td><td>集中在一个数据目录下，另有少量落在笔记 frontmatter</td></tr><tr><td>数据文件</td><td>19 个共享文件 + 若干目录</td><td>明文都是 JSON / Markdown，你随时能打开看</td></tr></tbody></table>\n<h2>你需要什么</h2>\n<ul>\n<li>Obsidian（桌面端或移动端都行；个别功能有端差异，见各域章节）</li>\n<li>想用 AI 相关功能（摘要、画像、检索、对话、转写）时，再配一条 AI 通道：DeepSeek、智谱 Plan 或本机 Ollama，任选其一</li>\n<li>想用知识盒的视频转文字时，另外要一个可用的 Python 环境（装好对应引擎的包）</li>\n</ul>\n<h2>三分钟上手</h2>\n<ol>\n<li><strong>打开设置面板</strong>：命令面板搜「设置面板」。左边是全部域，按基础 / 智能 / 记录 / 收集 / 媒体与阅读 / 工具 / 安全分七组。</li>\n<li><strong>确认数据放哪</strong>：进「通用」→ 看「数据存储路径」。默认在库内的 CONFIG/STORAGE 下，所有域的明文数据都写这里。</li>\n<li><strong>配一条 AI 通道</strong>（想用 AI 功能才需要）：进「AI」→「LLM」→ 选服务商、填密钥；模型名留空就用该服务商默认模型。</li>\n<li><strong>随便挑一个域试一件事</strong>：命令面板搜「写日记」写第一篇；或搜「加收藏」存一条链接。</li>\n<li><strong>想找东西时</strong>：命令面板搜「第二大脑参考」（需要先在 AI 里配好嵌入模型）。</li>\n</ol>\n<h2>遇到问题先做两件事</h2>\n<ol>\n<li><strong>命令面板搜「数据体检」</strong>：它只读扫描全部数据文件，报告缺失 / 损坏 / 孤儿项。</li>\n<li><strong>重载插件</strong>（把插件关掉再打开）：绝大多数「改了没生效」都是这个原因——监听、索引、控制器都在启动时注册。</li>\n</ol>\n<h2>本书怎么读</h2>\n<table><thead><tr><th>你的目的</th><th>去哪</th></tr></thead><tbody><tr><td>想先看看能干什么</td><td>往下读「界面与入口」，再挑感兴趣的域章节</td></tr><tr><td>已经知道要做什么</td><td>直接看对应域的章节（第七节起），或看「照着做：工作流示例」</td></tr><tr><td>想查某个命令 / 某个键</td><td>看「参考：命令、设置与数据」</td></tr><tr><td>出问题了</td><td>看「排查：症状与处置」</td></tr><tr><td>想看设计取舍</td><td>各域章节的「边界、限制与坑」一节</td></tr></tbody></table>\n<h2>术语表</h2>\n<table><thead><tr><th>词</th><th>含义</th></tr></thead><tbody><tr><td>域</td><td>一个功能模块（如「影院」「复习计划」）。每个域有自己的设置页、数据文件与命令</td></tr><tr><td>命令面板</td><td>Obsidian 的 <code>Ctrl/Cmd + P</code>；包仔的 72 条命令都在这里搜得到</td></tr><tr><td>设置面板</td><td>包仔自绘的设置界面（命令「设置面板」）；与插件 ⚙️ 设置页是同一份数据的两个入口</td></tr><tr><td>数据存储路径</td><td>所有域明文数据的根目录；默认库内 CONFIG/STORAGE，可改</td></tr><tr><td>重载插件</td><td>关闭再启用插件（或重启 Obsidian）。不是「刷新界面」</td></tr><tr><td>索引 / 向量</td><td>第二大脑与小橘把笔记变成的一串数字，用来按意思检索</td></tr><tr><td>召回 / 重排</td><td>检索两段：先向量召回一批候选，再用 rerank 模型重新排序</td></tr><tr><td>JEV</td><td>并存的「判定通道」：输入问题与状态，输出类型化答案与概率，不生成文本</td></tr><tr><td>前置条件</td><td>某个功能要先满足的条件（如填密钥、装 Python 包、选好目录）</td></tr><tr><td>frontmatter</td><td>Markdown 文件开头 <code>---</code> 之间的字段区，剪藏摘要、影视条目等写在这里</td></tr></tbody></table>","no":1},{"id":"interface","title":"界面与入口","group":"开始","tags":["interface"],"domain":"","html":"<p>包仔没有自己的独立窗口：它活在 Obsidian 里，通过三个入口和你打交道。先认清这三个入口，后面所有章节都只是它们的细节。</p>\n<h2>三个入口</h2>\n<table><thead><tr><th>入口</th><th>怎么打开</th><th>适合干什么</th></tr></thead><tbody><tr><td>命令面板</td><td><code>Ctrl/Cmd + P</code>，搜命令名</td><td>做一件事（写日记、加影视、开始复习）</td></tr><tr><td>设置面板</td><td>命令面板搜「设置面板」</td><td>改配置；左侧按域列出全部设置页</td></tr><tr><td>域面板</td><td>各域自己的打开命令（如「影院」「书库」「第二大脑面板」）</td><td>浏览、检索、批量操作</td></tr></tbody></table>\n<p>72 条命令的名称与 id 全表见「参考：命令、设置与数据」；每个域用到哪些命令，见该域章节。</p>\n<h2>设置面板怎么用</h2>\n<ol>\n<li><strong>左侧导航</strong>：按语义分成七组——基础、智能、记录、收集、媒体与阅读、工具、安全；最后一节是本书入口。</li>\n<li><strong>顶部搜索</strong>：同时匹配域名、域描述和设置行名；搜到设置项会直接带你去那一行。</li>\n<li><strong>设置行</strong>：名称后面若有一条很淡的下划线，说明这行有详细说明——<strong>鼠标停在标题上会浮出说明</strong>（触屏点标题）。</li>\n<li><strong>改动即存</strong>：多数行改完立刻生效并落盘；少数行标注了「需重载插件」。</li>\n<li><strong>移动端</strong>：形态不同但功能一致——先是一个全屏的域列表，点进某个域推入该域设置页，左上角返回。</li>\n</ol>\n<blockquote>插件自带的 ⚙️ 设置页与自绘面板是<strong>同一份设置的两种界面</strong>：在任一处改动，另一处刷新后即同步。</blockquote>\n<h2>域面板长什么样</h2>\n<p>各域面板风格统一（同一套皮肤、同一套滚动手感），但内容布局按用途不同：</p>\n<table><thead><tr><th>形态</th><th>用在哪些域</th><th>特征</th></tr></thead><tbody><tr><td>列表 / 流</td><td>剪藏本、备忘录、收藏本</td><td>条目流，可筛选、可勾选</td></tr><tr><td>墙 / 网格</td><td>影院、书库、游戏库</td><td>海报 / 封面墙，点开条目详情</td></tr><tr><td>时间轴</td><td>日记本</td><td>按时间排布，点开一篇</td></tr><tr><td>检索台</td><td>第二大脑</td><td>输入框 + 结果列表 + 对话</td></tr><tr><td>任务盘</td><td>番茄钟、小橘</td><td>常驻的小面板，状态实时变化</td></tr><tr><td>弹窗式</td><td>保险库、密码本、脸谱数据源</td><td>打开时先解锁或先选数据</td></tr></tbody></table>\n<h2>通知</h2>\n<p>所有操作反馈走统一的通知系统：右下（或你配的位置）滑入，几秒后自动消失。级别、时长、位置、最大同时可见数在「通知」域配置。</p>\n<ul>\n<li>通知正文不带 emoji，语义靠图标区分。</li>\n<li>批量任务（如批量导入、批量补链）会合并成一条进度通知，不会刷屏。</li>\n<li>把级别调高会连「已保存」这类回执一起过滤掉——排查问题时记得调回来。</li>\n</ul>\n<h2>报告类入口</h2>\n<p>几个域会把统计聚合成报告：归物本年度报告、影视分析报告、剪藏阅读报告、游戏库数据统计、复习计划分析报告、记忆分析、阅读分析报告、小橘数据面板。它们都是只读视图，不改数据；数据源分别在各自域章节里写明。</p>\n<h2>键盘与触屏</h2>\n<table><thead><tr><th>场景</th><th>桌面</th><th>触屏</th></tr></thead><tbody><tr><td>打开面板</td><td>命令面板或绑快捷键</td><td>命令面板（移动端手势）</td></tr><tr><td>设置行说明</td><td>悬停标题出浮窗，点击可钉住</td><td>点标题开合</td></tr><tr><td>关闭浮层</td><td><code>Esc</code>、点外面、滚动</td><td>点外面</td></tr><tr><td>面板内移动</td><td>搜索框输入即过滤</td><td>全屏列表滚动</td></tr></tbody></table>\n<h2>一致性约定（读到这里你会更少踩坑）</h2>\n<ul>\n<li><strong>命令 id 三段式</strong>：<code>bz-&lt;域&gt;-&lt;动作&gt;</code>，例如 <code>bz-diary-write</code>。排查或配快捷键时按这个规律找。</li>\n<li><strong>数据位置固定</strong>：明文在数据存储路径（默认 CONFIG/STORAGE），密文在 <code>&lt;数据存储路径&gt;/.ENCRYPT</code>，笔记类落在 vault 目录（如 我的/日记、我的/影视）。</li>\n<li><strong>改完要重载插件的行</strong>：面板会在该行给提示；常见于目录类、监听类、索引类设置。</li>\n</ul>","no":2},{"id":"configuration","title":"配置：数据、密钥与端差异","group":"进阶","tags":["config"],"domain":"","html":"<p>这一章讲「一次配好、之后少折腾」的几件事：数据放哪、密钥怎么填、加密怎么起、桌面与移动差在哪。</p>\n<h2>一、数据放哪</h2>\n<table><thead><tr><th>内容</th><th>位置</th><th>说明</th></tr></thead><tbody><tr><td>各域明文数据</td><td><code>&lt;数据存储路径&gt;/</code>（默认 <code>CONFIG/STORAGE/</code>）</td><td>一个域一份 JSON；<code>secondbrain.vec</code> 等是二进制</td></tr><tr><td>加密密文</td><td><code>&lt;数据存储路径&gt;/.ENCRYPT/</code></td><td>根目录固定跟着数据存储路径，不再单独配置</td></tr><tr><td>笔记类数据</td><td>vault 内目录</td><td>日记 <code>我的/日记</code>、影视 <code>我的/影视</code>、游戏 <code>我的/游戏</code>、书库 <code>书库</code>、剪藏归档 <code>归档/网页剪藏</code></td></tr><tr><td>外部数据</td><td>库外（可选）</td><td>例如脸谱的微信导出目录，放在库外可避免被同步</td></tr></tbody></table>\n<p><strong>换存储位置的正确顺序</strong>：</p>\n<ol>\n<li>关闭 Obsidian（或至少停用插件）。</li>\n<li>用文件管理器把旧目录<strong>整个</strong>移到新位置。</li>\n<li>打开插件，改「数据存储路径」。</li>\n<li>重载插件，再跑一次「数据体检」确认各域都读到了。</li>\n</ol>\n<blockquote>只改设置不搬文件 = 插件在新位置读不到数据，看起来像「数据全丢了」。</blockquote>\n<h2>二、AI 通道</h2>\n<p>包仔有三条通道，互不代替：</p>\n<table><thead><tr><th>通道</th><th>用途</th><th>在哪配</th></tr></thead><tbody><tr><td>生成通道（LLM）</td><td>摘要、人物画像、对话、转写后的整理</td><td>AI → LLM</td></tr><tr><td>嵌入通道（Embedding）</td><td>第二大脑与小橘的向量检索</td><td>AI → Embedding</td></tr><tr><td>判定通道（JEV）</td><td>知识盒的关联判定这类「判断题」</td><td>AI → JEV</td></tr></tbody></table>\n<p>每条通道可选的服务商：</p>\n<ul>\n<li><strong>LLM</strong>：DeepSeek、智谱 Plan、Ollama（本机或局域网）</li>\n<li><strong>JEV</strong>：Typesafe、博查</li>\n<li><strong>Embedding</strong>：走 Ollama 已安装的嵌入模型（如 bge-m3）</li>\n</ul>\n<p><strong>per-provider 分开存</strong>：密钥、模型名、最大输出 token、思考档位都是「每个服务商存一份」。切服务商不会丢别家的值，但面板上这几行会换成当前那家的。</p>\n<h3>填密钥的三种情况</h3>\n<table><thead><tr><th>情况</th><th>表现</th></tr></thead><tbody><tr><td>没填密钥</td><td>依赖它的功能失败或降级；插件不会偷偷换别家</td></tr><tr><td>密钥错</td><td>操作时报错（401 之类），错误会以通知给出</td></tr><tr><td>没填但用了 Ollama</td><td>本机放行，不需要密钥，只要地址通</td></tr></tbody></table>\n<h2>三、外部凭据（按需填）</h2>\n<table><thead><tr><th>凭据</th><th>关联功能</th><th>不填会怎样</th></tr></thead><tbody><tr><td>B站 Cookie</td><td>录入 B 站视频时解析可用清晰度</td><td>只能拿固定清晰度列表</td></tr><tr><td>豆瓣 Cookie</td><td>豆瓣搜索风控后继续检索</td><td>抓取失败；会有风控提示</td></tr><tr><td>ApiZero Key</td><td>影院补齐评分/导演/主演等字段</td><td>交内置演职员信息兜底，字段不全</td></tr></tbody></table>\n<p>桌面端「B站 Cookie」旁有「从 CLI 导入」，读本机已存的 cookie 文件；移动端没有这个按钮（读不到本机文件）。</p>\n<h2>四、加密</h2>\n<ul>\n<li>第一次进保险库时设置口令；之后进保险库、取密码都用这一把口令。</li>\n<li>密文与清单都在 <code>&lt;数据存储路径&gt;/.ENCRYPT/</code>。<strong>口令没有找回通道</strong>，请自己保存。</li>\n<li>想看加密的图片/视频缩略图：打开「生成压缩预览」（代价是加密慢一点、密文大一点）。</li>\n<li>想要原图画质：打开「预览自动加载原图」（代价是打开那一刻全部原图一起解密，会明显变慢）。</li>\n</ul>\n<h2>五、桌面与移动的差异</h2>\n<table><thead><tr><th>能力</th><th>桌面</th><th>移动</th></tr></thead><tbody><tr><td>全部域与命令</td><td>✅</td><td>✅</td></tr><tr><td>选择库外文件夹</td><td>✅ 系统目录对话框</td><td>受限（按宿主能力）</td></tr><tr><td>B站 Cookie「从 CLI 导入」</td><td>✅</td><td>❌（读不到本机文件）</td></tr><tr><td>本机 Ollama</td><td>用 <code>Ollama 本地 URL</code></td><td>读自动维护的远端地址键，别手填 localhost</td></tr><tr><td>知识盒视频转写（外部 Python）</td><td>✅</td><td>通常不可用（取决于宿主能否起外部进程）</td></tr></tbody></table>\n<h2>六、多库 / 多端</h2>\n<ul>\n<li>设置与数据都在库内时，换设备打开同一个库就带着走。</li>\n<li>数据库放在库外时，<strong>不会跟着 vault 同步</strong>，需要自己用同步工具处理（并且要保证两端路径都可访问）。</li>\n<li>加密数据与图片缓存等由插件管理的内容，建议整体备份数据存储路径，而不是挑单个文件。</li>\n</ul>\n<h2>一份「新机器上手」清单</h2>\n<ol>\n<li>装插件，打开设置面板 → 通用 → 确认数据存储路径指向你搬过来的数据目录。</li>\n<li>重载插件。</li>\n<li>AI → LLM 填密钥、确认模型名；Embedding 配好嵌入模型。</li>\n<li>需要影院字段/AI 检索的，补对应凭据（ApiZero / 豆瓣 / B站 Cookie）。</li>\n<li>跑「数据体检」看有没有缺失文件。</li>\n<li>试三个冒烟动作：写一篇日记、抓一次剪藏、搜一次第二大脑参考。</li>\n</ol>","no":3},{"id":"reference","title":"参考：命令、设置与数据","group":"进阶","tags":["reference"],"domain":"","html":"<p>三张总表：命令（全部 72 条）、设置键、数据文件。全部由源码提取，可直接用来配快捷键、写脚本或排查。</p>\n<h2>命令总表（按域）</h2>\n<p>命令面板（<code>Ctrl/Cmd + P</code>）里搜名称即可；id 用于配置快捷键或与通知对照。</p>\n<h3>首页（基础）</h3>\n<table><thead><tr><th>命令</th><th>名称</th></tr></thead><tbody><tr><td><code>bz-home-open</code></td><td>内容首页</td></tr></tbody></table>\n<h3>设置面板（基础）</h3>\n<table><thead><tr><th>命令</th><th>名称</th></tr></thead><tbody><tr><td><code>bz-settings-panel-open</code></td><td>设置面板</td></tr></tbody></table>\n<h3>数据体检（基础）</h3>\n<table><thead><tr><th>命令</th><th>名称</th></tr></thead><tbody><tr><td><code>bz-data-checkup-open</code></td><td>数据体检</td></tr></tbody></table>\n<h3>第二大脑（智能）</h3>\n<table><thead><tr><th>命令</th><th>名称</th></tr></thead><tbody><tr><td><code>bz-secondbrain-panel</code></td><td>第二大脑面板</td></tr><tr><td><code>bz-secondbrain-open</code></td><td>第二大脑参考</td></tr><tr><td><code>bz-secondbrain-chat</code></td><td>第二大脑对话</td></tr><tr><td><code>bz-secondbrain-rebuild-index</code></td><td>重建索引</td></tr><tr><td><code>bz-secondbrain-weekly</code></td><td>本周知识动态</td></tr></tbody></table>\n<h3>日记本（记录）</h3>\n<table><thead><tr><th>命令</th><th>名称</th></tr></thead><tbody><tr><td><code>bz-diary-open</code></td><td>日记本</td></tr><tr><td><code>bz-diary-write</code></td><td>写日记</td></tr></tbody></table>\n<h3>备忘录（记录）</h3>\n<table><thead><tr><th>命令</th><th>名称</th></tr></thead><tbody><tr><td><code>bz-memo-open</code></td><td>备忘录</td></tr><tr><td><code>bz-memo-add</code></td><td>加备忘录</td></tr><tr><td><code>bz-memo-note-binding</code></td><td>给当前笔记记一笔</td></tr></tbody></table>\n<h3>归物本（记录）</h3>\n<table><thead><tr><th>命令</th><th>名称</th></tr></thead><tbody><tr><td><code>bz-belongings-add</code></td><td>加物品</td></tr><tr><td><code>bz-belongings-open</code></td><td>归物本</td></tr><tr><td><code>bz-belongings-report</code></td><td>归物本年度报告</td></tr></tbody></table>\n<h3>脸谱（记录）</h3>\n<table><thead><tr><th>命令</th><th>名称</th></tr></thead><tbody><tr><td><code>bz-people-open</code></td><td>脸谱</td></tr><tr><td><code>bz-people-import</code></td><td>脸谱数据源</td></tr></tbody></table>\n<h3>剪藏本（收集）</h3>\n<table><thead><tr><th>命令</th><th>名称</th></tr></thead><tbody><tr><td><code>bz-clipbook-open</code></td><td>剪藏本</td></tr><tr><td><code>bz-clipbook-mark-all-read</code></td><td>未读全部标为已读</td></tr><tr><td><code>bz-clipbook-fetch-now</code></td><td>剪藏本抓取新文章</td></tr><tr><td><code>bz-clipbook-report</code></td><td>剪藏阅读报告</td></tr></tbody></table>\n<h3>收藏本（收集）</h3>\n<table><thead><tr><th>命令</th><th>名称</th></tr></thead><tbody><tr><td><code>bz-favorites-open</code></td><td>收藏本</td></tr><tr><td><code>bz-favorites-add</code></td><td>加收藏</td></tr></tbody></table>\n<h3>自动摘要（收集）</h3>\n<table><thead><tr><th>命令</th><th>名称</th></tr></thead><tbody><tr><td><code>bz-auto-summary-redo</code></td><td>重新生成当前剪藏摘要</td></tr></tbody></table>\n<h3>影院（媒体与阅读）</h3>\n<table><thead><tr><th>命令</th><th>名称</th></tr></thead><tbody><tr><td><code>bz-cinema-analysis</code></td><td>影视分析报告</td></tr><tr><td><code>bz-cinema-open</code></td><td>影院</td></tr><tr><td><code>bz-cinema-add</code></td><td>加影视</td></tr><tr><td><code>bz-cinema-random-pick</code></td><td>随机抽一部</td></tr></tbody></table>\n<h3>阅读报告（媒体与阅读）</h3>\n<table><thead><tr><th>命令</th><th>名称</th></tr></thead><tbody><tr><td><code>bz-reading-report-open</code></td><td>阅读分析报告</td></tr></tbody></table>\n<h3>书库（媒体与阅读）</h3>\n<table><thead><tr><th>命令</th><th>名称</th></tr></thead><tbody><tr><td><code>bz-bookshelf-open</code></td><td>书库</td></tr><tr><td><code>bz-bookshelf-continue</code></td><td>继续在读</td></tr></tbody></table>\n<h3>游戏库（媒体与阅读）</h3>\n<table><thead><tr><th>命令</th><th>名称</th></tr></thead><tbody><tr><td><code>bz-gameshelf-open</code></td><td>游戏库</td></tr><tr><td><code>bz-gameshelf-sync</code></td><td>同步游戏库</td></tr><tr><td><code>bz-gameshelf-stats</code></td><td>游戏库数据统计</td></tr></tbody></table>\n<h3>复习计划（媒体与阅读）</h3>\n<table><thead><tr><th>命令</th><th>名称</th></tr></thead><tbody><tr><td><code>bz-review-open</code></td><td>复习计划</td></tr><tr><td><code>bz-review-report</code></td><td>复习计划分析报告</td></tr><tr><td><code>bz-review-analysis</code></td><td>记忆分析</td></tr><tr><td><code>bz-review-start</code></td><td>开始复习</td></tr><tr><td><code>bz-review-quiz-open</code></td><td>做题练习</td></tr><tr><td><code>bz-review-add</code></td><td>加入复习计划</td></tr><tr><td><code>bz-review-remove</code></td><td>移出复习计划</td></tr><tr><td><code>bz-review-overdue</code></td><td>跳转逾期复习</td></tr><tr><td><code>bz-review-rate</code></td><td>选择复习难度</td></tr><tr><td><code>bz-review-again</code></td><td>复习评级：忘了</td></tr><tr><td><code>bz-review-hard</code></td><td>复习评级：困难</td></tr><tr><td><code>bz-review-good</code></td><td>复习评级：一般</td></tr><tr><td><code>bz-review-easy</code></td><td>复习评级：简单</td></tr></tbody></table>\n<h3>知识盒（媒体与阅读）</h3>\n<table><thead><tr><th>命令</th><th>名称</th></tr></thead><tbody><tr><td><code>bz-knowledge-open</code></td><td>知识盒</td></tr><tr><td><code>bz-knowledge-note-term</code></td><td>名词生成文献笔记</td></tr><tr><td><code>bz-knowledge-note-video</code></td><td>影像生成文献笔记</td></tr><tr><td><code>bz-knowledge-note-passage</code></td><td>段落生成文献笔记</td></tr><tr><td><code>bz-knowledge-note-image</code></td><td>图版生成文献笔记</td></tr><tr><td><code>bz-knowledge-relink</code></td><td>重跑当前笔记关联</td></tr><tr><td><code>bz-knowledge-link-all</code></td><td>为未关联笔记批量补链</td></tr><tr><td><code>bz-knowledge-mount-tree</code></td><td>看挂载树</td></tr><tr><td><code>bz-knowledge-mount-refresh</code></td><td>重跑挂载建议</td></tr></tbody></table>\n<h3>番茄钟（工具）</h3>\n<table><thead><tr><th>命令</th><th>名称</th></tr></thead><tbody><tr><td><code>bz-pomodoro-open</code></td><td>番茄钟</td></tr><tr><td><code>bz-pomodoro-focus-toggle</code></td><td>开始/重置专注</td></tr><tr><td><code>bz-pomodoro-skip</code></td><td>跳过休息</td></tr><tr><td><code>bz-pomodoro-pause</code></td><td>暂停/继续专注</td></tr></tbody></table>\n<h3>小橘陪伴猫（工具）</h3>\n<table><thead><tr><th>命令</th><th>名称</th></tr></thead><tbody><tr><td><code>bz-smartcat-open</code></td><td>小橘</td></tr><tr><td><code>bz-smartcat-chat</code></td><td>小橘聊天</td></tr><tr><td><code>bz-smartcat-hide</code></td><td>隐藏小橘</td></tr><tr><td><code>bz-smartcat-dashboard</code></td><td>小橘数据面板</td></tr></tbody></table>\n<h3>保险库（安全）</h3>\n<table><thead><tr><th>命令</th><th>名称</th></tr></thead><tbody><tr><td><code>bz-encrypt-open</code></td><td>保险库</td></tr><tr><td><code>bz-encrypt-lock</code></td><td>加密当前笔记</td></tr><tr><td><code>bz-encrypt-lock-vault</code></td><td>锁定保险库</td></tr></tbody></table>\n<h3>密码本（安全）</h3>\n<table><thead><tr><th>命令</th><th>名称</th></tr></thead><tbody><tr><td><code>bz-password-vault-open</code></td><td>密码本</td></tr><tr><td><code>bz-password-vault-gen</code></td><td>快速取密</td></tr><tr><td><code>bz-password-vault-quick-gen</code></td><td>快速生成密码</td></tr><tr><td><code>bz-password-vault-lock</code></td><td>锁定密码本</td></tr></tbody></table>\n<h2>设置键总索引</h2>\n<p>按域列出设置键与默认值（<code>—</code> 表示默认值为空）。这些键名可直接在数据文件里搜到。</p>\n<p><strong>通用</strong></p>\n<table><thead><tr><th>键</th><th>设置名</th><th>默认值</th></tr></thead><tbody><tr><td><code>storagePath</code></td><td>数据存储路径</td><td><code>—</code></td></tr><tr><td><code>noticeDuration</code></td><td>停留时长</td><td><code>standard</code></td></tr><tr><td><code>noticePosition</code></td><td>弹出位置< e>encryptPreviewSize</code></td><td>预览长边</td><td><code>384</code></td></tr><tr><td><code>encryptPreviewQuality</code></td><td>预览质量</td><td><code>0.5</code></td></tr><tr><td><code>encryptAutoLoadOriginal</code></td><td>预览自动加载原图</td><td><code>关</code></td></tr></tbody></table>\n<p><strong>密码本</strong></p>\n<table><thead><tr><th>键</th><th>设置名</th><th>默认值</th></tr></thead><tbody><tr><td><code>passwordVaultSkin</code></td><td>面板布局</td><td><code>—</code></td></tr><tr><td><code>passwordVaultSkinTheme</code></td><td>面板主题</td><td><code>gold</code></td></tr><tr><td><code>passwordCharset</code></td><td>密码生成字符集</td><td><code>—</code></td></tr><tr><td><code>passwordLength</code></td><td>密码生成长度</td><td><code>16</code></td></tr></tbody></table>\n<h2>数据文件</h2>\n<table><thead><tr><th>文件</th><th>归属</th></tr></thead><tbody><tr><td><code>secondbrain.vec</code> 等 <code>.vec</code></td><td>向量索引（二进制，别手动编辑）</td></tr><tr><td><code>belongings.json</code></td><td>belongings、checkup、home</td></tr><tr><td><code>clipbook.json</code></td><td>checkup</td></tr><tr><td><code>home.json</code></td><td>checkup、home</td></tr><tr><td><code>knowledge.json</code></td><td>checkup、knowledge</td></tr><tr><td><code>lock-stats.json</code></td><td>checkup、core</td></tr><tr><td><code>memo.json</code></td><td>checkup、home、memo、recap</td></tr><tr><td><code>news.json</code></td><td>checkup、clipbook、home</td></tr><tr><td><code>people-jobs.json</code></td><td>people</td></tr><tr><td><code>people-preview.json</code></td><td>people</td></tr><tr><td><code>people.json</code></td><td>people</td></tr><tr><td><code>pomodoro.json</code></td><td>checkup、pomodoro、recap</td></tr><tr><td><code>quiz.json</code></td><td>checkup、review</td></tr><tr><td><code>review-fit.json</code></td><td>checkup、review</td></tr><tr><td><code>review.json</code></td><td>checkup、home、review</td></tr><tr><td><code>secondbrain.json</code></td><td>checkup、home、secondbrain</td></tr><tr><td><code>secondbrain.vec</code></td><td>home、secondbrain</td></tr><tr><td><code>smartcat-behavior.json</code></td><td>checkup</td></tr><tr><td><code>smartcat-memory.json</code></td><td>checkup</td></tr><tr><td><code>smartcat.json</code></td><td>checkup</td></tr></tbody></table>\n<p>「数据体检」会扫描这些文件，缺任何一个都会报告：</p>\n<pre class=\"code\" data-lang=\"text\"><code>belongings.json  clipbook.json  home.json  knowledge.json  lock-stats.json  memo.json  news.json  pomodoro.json  quiz.json  review-fit.json  review.json  secondbrain.json  smartcat-behavior.json  smartcat-memory.json  smartcat.json</code></pre>","no":4},{"id":"troubleshooting","title":"排查：症状与处置","group":"进阶","tags":["troubleshooting"],"domain":"","html":"<p>先记住两把万能钥匙：<strong>① 命令面板搜「数据体检」</strong>（只读扫全域数据文件）；<strong>② 重载插件</strong>（关掉再打开）。下面按症状排。</p>\n<h2>一、设置改了没反应</h2>\n<table><thead><tr><th>症状</th><th>原因</th><th>处置</th></tr></thead><tbody><tr><td>换了目录，内容还是旧的</td><td>目录类设置在启动或特定时机读取</td><td>重载插件</td></tr><tr><td>「自动关联」改了没变化</td><td>关联监听在插件启动时注册</td><td>重载插件</td></tr><tr><td>换了嵌入模型，检索没变</td><td>旧索引还在用旧维度</td><td>用「重建索引」全量重嵌</td></tr><tr><td>面板看着没更新</td><td>面板是渲染快照</td><td>关掉面板重新打开</td></tr></tbody></table>\n<h2>二、数据看起来「不见了」</h2>\n<ol>\n<li>先确认「通用 → 数据存储路径」指向的还是那个目录。</li>\n<li>若刚改过路径：检查旧目录里的文件是否已搬到新目录（插件不会替你搬）。</li>\n<li>跑「数据体检」：它按当前路径扫描并报告缺失项。</li>\n<li>若文件确实不在：从备份恢复（建议整体备份数据存储路径）。</li>\n</ol>\n<h2>三、AI 相关不工作（报错 / 没反应）</h2>\n<table><thead><tr><th>症状</th><th>可能原因</th><th>处置</th></tr></thead><tbody><tr><td>操作报 401/403</td><td>密钥没填或填错</td><td>AI → LLM 补密钥，用行内「测试」验证</td></tr><tr><td>报 400、提示上限</td><td>最大输出 token 填得比模型官方档位大</td><td>清空该行（回落自动档位）或改小</td></tr><tr><td>模型名写错</td><td>该行是自由文本，不校验</td><td>用「获取模型名」从列表里选</td></tr><tr><td>换服务商后右边几行变了</td><td>配置按服务商分存</td><td>正常；切回去就是原来那份</td></tr><tr><td>移动端连不上本机 Ollama</td><td>移动端读的是自动维护的远端键</td><td>填桌面机的局域网地址，别填 localhost</td></tr><tr><td>JEV 判定不生效</td><td>没配 JEV 密钥</td><td>AI → JEV 填密钥；不填会用生成通道那套</td></tr></tbody></table>\n<h2>四、检索类问题（第二大脑 / 小橘）</h2>\n<table><thead><tr><th>症状</th><th>原因</th><th>处置</th></tr></thead><tbody><tr><td>搜不到某篇笔记</td><td>不在检索范围，或索引未建</td><td>检查三个盒子与「额外检索目录」；必要时重建索引</td></tr><tr><td>结果不相关</td><td>嵌入模型不合适 / TopK 太小</td><td>换更好的嵌入模型；调大参考结果数</td></tr><tr><td>开了重排但没效果</td><td>本地重排只在嵌入模型是 Qwen3-Embedding-8B 时生效</td><td>换该嵌入模型，或走 JEV 云端重排</td></tr><tr><td>重建很慢</td><td>笔记多</td><td>正常；重建期间周期性落盘，关掉窗口下次续建</td></tr><tr><td>小橘记不住东西</td><td>目录没进「记忆文件夹」，或换过模型没重建</td><td>加目录并重扫；换模型后删向量文件重扫</td></tr></tbody></table>\n<h2>五、抓取类问题（剪藏 / 影院 / 游戏库）</h2>\n<table><thead><tr><th>症状</th><th>可能原因</th><th>处置</th></tr></thead><tbody><tr><td>剪藏抓不到新文章</td><td>对应源名单为空 / 开关关着</td><td>检查 UP 主名单、RSS 订阅源是否非空</td></tr><tr><td>抓取失败、提示风控</td><td>豆瓣等站点拦截</td><td>补豆瓣 Cookie；稍后再试</td></tr><tr><td>影院字段缺评分/导演</td><td>没配 ApiZero Key</td><td>AI → 数据源凭据填 ApiZero Key</td></tr><tr><td>B站视频清晰度选项少</td><td>没配 B站 Cookie</td><td>填 Cookie；桌面端可从 CLI 导入</td></tr><tr><td>Steam 同步没反应</td><td>SteamID64 或 Web API 密钥缺一；或格式不对</td><td>两项都填；ID 必须是 17 位、7656 开头</td></tr><tr><td>Steam 请求失败</td><td>国内直连被重置</td><td>走系统代理</td></tr></tbody></table>\n<h2>六、脸谱（微信导入）</h2>\n<table><thead><tr><th>症状</th><th>原因</th><th>处置</th></tr></thead><tbody><tr><td>面板上没有数据源入口</td><td>「数据文件夹」留空</td><td>设置 → 脸谱 → 数据文件夹选目录</td></tr><tr><td>换了目录看不到新数据</td><td>换目录后不会自动重扫</td><td>打开「脸谱数据源」点刷新重扫</td></tr><tr><td>头像裂图</td><td>媒体文件夹选到了库外</td><td>改成库内目录（库外路径 Obsidian 加载不出图）</td></tr><tr><td>群聊不见了</td><td>群聊默认不进列表</td><td>打开「群聊纳入列表」</td></tr><tr><td>画像生成失败</td><td>没配 AI 通道或密钥</td><td>AI → LLM 配好再试</td></tr></tbody></table>\n<h2>七、复习计划</h2>\n<table><thead><tr><th>症状</th><th>原因</th><th>处置</th></tr></thead><tbody><tr><td>笔记没进复习</td><td>目录没加入监听 / 加入时点了取消</td><td>「取消」= 该目录根本不加入；重新加并确认收编</td></tr><tr><td>每天要复习的太多</td><td>R 阈值偏低或间隔缩放偏小</td><td>调高 R 阈值、把间隔缩放调大</td></tr><tr><td>刚用拟合没效果</td><td>样本不足（&lt;100 条会跳过）</td><td>正常；积累记录后再看</td></tr><tr><td>评级点错</td><td>评级会立刻改排期</td><td>再评一次，以最新一次为准</td></tr></tbody></table>\n<h2>八、保险库与密码本</h2>\n<table><thead><tr><th>症状</th><th>原因</th><th>处置</th></tr></thead><tbody><tr><td>提示保险库是空的</td><td>密文不在当前数据存储路径的 .ENCRYPT 下</td><td>确认路径；换过目录的话把 .ENCRYPT 整体搬过去</td></tr><tr><td>口令不对</td><td>记忆偏差</td><td>没有找回通道；确认大小写与输入法</td></tr><tr><td>预览很慢</td><td>开了「预览自动加载原图」</td><td>关掉它，改用压缩预览</td></tr><tr><td>密文没随库同步</td><td>数据存储路径在库外</td><td>移到库内，或自行同步该目录</td></tr></tbody></table>\n<h2>九、性能与卡顿</h2>\n<ul>\n<li><strong>批量任务（导入 / 补链 / 抓取 / 重建）</strong>会占用资源；同一时间只跑一个，别叠加。</li>\n<li><strong>抓取类走网络</strong>，弱网时感知明显；「立即抓取」在抓取中再点会提示稍候，不会叠请求。</li>\n<li><strong>大库首次建索引最慢</strong>，属一次性成本；之后是增量。</li>\n</ul>\n<h2>十、什么时候该看代码仓库</h2>\n<p>本手册的记录都以当前版本实现为准。如果某处表现与手册不符：</p>\n<ol>\n<li>先跑「数据体检」与重载插件排除环境问题。</li>\n<li>记下命令 id（如 <code>bz-review-start</code>）与通知原文，便于定位。</li>\n<li>再去看该域章节的「边界、限制与坑」——很多「不符合预期」其实是设计如此（例如强制专注模式故意不给暂停）。</li>\n</ol>","no":5},{"id":"examples","title":"照着做：工作流示例","group":"进阶","tags":["examples"],"domain":"","html":"<p>三个难度层：入门（单域一件事）、进阶（跨域组合）、高级（把整套流程串起来）。每例都写明前置条件与出错时的去处。</p>\n<h2>入门</h2>\n<h3>例 1：写下第一篇日记</h3>\n<ol>\n<li>命令面板搜「写日记」（<code>bz-diary-write</code>）。</li>\n<li>当天没有日记就新建一篇，有就接着写。</li>\n<li>想翻旧日记：命令面板搜「日记本」（<code>bz-diary-open</code>）。</li>\n</ol>\n<p><strong>预期</strong>：<code>我的/日记/</code> 下多了一篇当天日期的笔记。</p>\n<p><strong>出错</strong>：写了但找不到文件 → 通用 → 检查日记目录设置，并确认该目录在库内。</p>\n<h3>例 2：收一条新闻并读掉</h3>\n<ol>\n<li>设置 → 剪藏本：确认至少一个源开着，且对应名单非空（B站要 UP 主名单、RSS 要订阅源）。</li>\n<li>命令面板搜「剪藏本抓取新文章」（<code>bz-clipbook-fetch-now</code>）抓一轮。</li>\n<li>命令面板搜「剪藏本」（<code>bz-clipbook-open</code>）读；读完可以「未读全部标为已读」（<code>bz-clipbook-mark-all-read</code>）。</li>\n</ol>\n<p><strong>预期</strong>：未读流里出现新条目；读过的能标已读。</p>\n<p><strong>出错</strong>：抓不到 → 看通知是否有风控提示；豆瓣被拦就去 AI → 数据源凭据补豆瓣 Cookie。</p>\n<h3>例 3：记一件买的东西</h3>\n<ol>\n<li>命令面板搜「加物品」（<code>bz-belongings-add</code>）登记。</li>\n<li>年底或想复盘时搜「归物本年度报告」（<code>bz-belongings-report</code>）。</li>\n</ol>\n<p><strong>预期</strong>：条目进 <code>belongings.json</code>，报告按年份统计。</p>\n<p><strong>出错</strong>：报告里年份不对 → 检查条目日期。</p>\n<h2>进阶</h2>\n<h3>例 4：把微信聊天变成人物档案</h3>\n<ol>\n<li>拿到微信导出工具产出的目录（结构：一层一个联系人，里面是 <code>chat.json</code>）。</li>\n<li>设置 → 脸谱 → 数据文件夹：选中这个目录（可以填库外路径）。</li>\n<li>命令面板「脸谱数据源」（<code>bz-people-import</code>）→ 刷新重扫 → 勾选要导入的联系人。</li>\n<li>命令面板「脸谱」（<code>bz-people-open</code>）看人物与画像。</li>\n</ol>\n<p><strong>前置</strong>：画像需要 AI 通道可用（AI → LLM 配好密钥）。</p>\n<p><strong>注意</strong>：媒体文件夹只能选库内目录；只有头像会复制进库。</p>\n<p><strong>出错</strong>：导入后没变化 → 回数据源窗口刷新重扫；头像裂图 → 改媒体文件夹到库内。</p>\n<h3>例 5：让笔记按意思被搜到</h3>\n<ol>\n<li>AI → Embedding：配好嵌入模型（本机 Ollama 拉一个，如 bge-m3）。</li>\n<li>设置 → 第二大脑 → 额外检索目录：把三个盒子之外的目录也纳入（逗号分隔）。</li>\n<li>需要时命令面板「重建索引」（<code>bz-secondbrain-rebuild-index</code>）。</li>\n<li>平时用「第二大脑参考」（<code>bz-secondbrain-open</code>）检索；要聊用「第二大脑对话」（<code>bz-secondbrain-chat</code>）。</li>\n</ol>\n<p><strong>注意</strong>：换嵌入模型会换维度 → 必须重建索引。</p>\n<p><strong>调参</strong>：参考结果数 TopK 管召回量（重排之前），对话侧条数是另一个键。</p>\n<h3>例 6：把一本书读进复习</h3>\n<ol>\n<li>书库放好 EPUB 或建好藏书笔记，读的时候记录进度（「继续在读」用得着）。</li>\n<li>设置 → 复习计划 → 监听文件夹：加入你要复习的笔记目录。</li>\n<li>到期时命令面板「开始复习」（<code>bz-review-start</code>），逐条评四档（忘了/困难/一般/简单）。</li>\n<li>用「复习计划分析报告」「记忆分析」看趋势。</li>\n</ol>\n<p><strong>注意</strong>：加监听目录时会问要不要收编已有笔记；点取消 = 该目录根本不加入。</p>\n<p><strong>调节奏</strong>：复习间隔缩放（只作用于 FSRS 动态间隔）、R 目标阈值（只管提前安排）。</p>\n<h3>例 7：给一批文件上锁并用压缩预览翻看</h3>\n<ol>\n<li>设置 → 保险库：打开「生成压缩预览」（可选：调预览长边与质量）。</li>\n<li>对要加密的笔记用命令「加密当前笔记」（<code>bz-encrypt-note</code>）。</li>\n<li>命令「保险库」（<code>bz-encrypt-open</code>）浏览；看图片/视频时先看压缩预览（不解密）。</li>\n<li>需要原图画质时再开「预览自动加载原图」；离开时「锁定保险库」（<code>bz-encrypt-lock-vault</code>）。</li>\n</ol>\n<p><strong>代价</strong>：压缩预览让加密慢一点、密文大一点；自动加载原图会让打开预览变慢。</p>\n<p><strong>注意</strong>：口令没有找回通道。</p>\n<h2>高级</h2>\n<h3>例 8：一套「全域可检索」工作流</h3>\n<ol>\n<li><strong>入口统一</strong>：剪藏本自动收文章 + 自动摘要（immediate 或 lazy），保证新内容一进来就有文本。</li>\n<li><strong>纳入检索</strong>：第二大脑的额外检索目录把这些内容目录都加上（增量索引，不用重建）。</li>\n<li><strong>配好重排</strong>：想更准就开「启用重排」；走 JEV 云端或本地（本地要求嵌入模型是 Qwen3-Embedding-8B）。</li>\n<li><strong>喂给小橘</strong>：把关键目录加进「记忆文件夹」，聊天时它会带进来。</li>\n<li><strong>定期体检</strong>：跑「数据体检」，发现异常再重建索引。</li>\n</ol>\n<p><strong>判断标准</strong>：随便问一句「我以前在哪记过 X」，参考结果前几条是否相关。</p>\n<h3>例 9：影院字段与季合并</h3>\n<ol>\n<li>AI → 数据源凭据：填 ApiZero Key（补评分/导演/主演等），豆瓣 Cookie 备用（风控时）。</li>\n<li>录入片子用「加影视」（<code>bz-cinema-add</code>）→ 搜索 → 抓字段 → 写笔记。</li>\n<li>剧集多季：打开「剧集按季合并」，同一部剧 ≥2 季会合并成一张卡（点进去展开）。</li>\n<li>找片用「随机抽一部」（<code>bz-cinema-random-pick</code>）；统计用「影视分析报告」（<code>bz-cinema-analysis</code>）。</li>\n</ol>\n<p><strong>注意</strong>：合并只改海报墙显示，不动笔记与文件名。</p>\n<h3>例 10：备份与迁移到新机器</h3>\n<ol>\n<li><strong>备份</strong>：整体复制 <code>&lt;数据存储路径&gt;</code>（含 <code>.ENCRYPT</code>）与需要保留的 vault 目录（日记/影视/游戏/书库/剪藏归档）。</li>\n<li><strong>新机器</strong>：装插件 → 通用改数据存储路径到备份位置 → 重载插件。</li>\n<li><strong>补配</strong>：AI 密钥、外部凭据（ApiZero / 豆瓣 / B站 Cookie）、Steam 两项。</li>\n<li><strong>冒烟</strong>：「数据体检」→ 写一篇日记 → 抓一次剪藏 → 搜一次第二大脑参考 → 打开保险库确认密文可见。</li>\n</ol>\n<p><strong>注意</strong>：数据库放在库外时不会随 vault 同步；跨端使用要保证两端都能访问该路径。</p>","no":6},{"id":"checkup","title":"数据体检","group":"基础","tags":["basic","troubleshooting"],"domain":"checkup","html":"<blockquote>只读扫描各域数据文件，找出损坏、漂移与失效指向。</blockquote>\n<h2>什么时候用它</h2>\n<p>数据体检是<strong>全插件数据的只读巡检面板</strong>，面向所有 bz 插件使用者。它不依赖你使用某个具体功能，而是一次性把插件写在磁盘上的所有数据文件过一遍，回答三个问题：文件还打不打得开？字段形态跟约定一不一致？条目里指向库内文件的引用还在不在？</p>\n<p>建议在以下场景跑一次：</p>\n<ul>\n<li>怀疑某个功能数据「怪怪的」（备忘不显示、收藏跳笔记报错、剪藏残留清不掉）时，先来这里定位；</li>\n<li>迁移 / 改了「数据存储路径」设置之后，确认各文件是否按新路径被扫描到；</li>\n<li>同步盘（OneDrive / iCloud 等）冲突或过杀后，排查有没有文件被截断成坏 JSON；</li>\n<li>定期自检（例如换设备、重装前），把隐患提前暴露。</li>\n</ul>\n<p>体检<strong>本身不改数据</strong>（唯一的例外是下面「一键修复」那一小类失效引用，且可撤销）。发现坏文件时它<strong>不会</strong>当场重建，目的是保留现场、不毁掉你恢复的机会（src/checkup/files.ts:12、src/checkup/files.ts:70）。</p>\n<h2>数据放在哪</h2>\n<p>体检扫描的对象分两类：</p>\n<ol>\n<li><strong>清单内的各域数据 JSON</strong> —— 路径由 <code>jsonScanTargets()</code> 集中收敛（src/checkup/files.ts:38）。除特别说明外，它们都落在「数据存储路径」下，默认值 <code>CONFIG/STORAGE</code>（可在设置里改 <code>storagePath</code>，src/core/storage.ts:37、src/core/storage.ts:60）。</li>\n<li><strong>库内 Markdown 笔记里的引用</strong> —— 检查三（孤儿条目）会去读影院 / 书库 / 游戏库 / 剪藏目录里的笔记，核对 frontmatter 与侧写指向的文件是否还在。</li>\n</ol>\n<h3>清单内扫描的 JSON（共 17 个）</h3>\n<table><thead><tr><th>检查对象</th><th>默认位置</th><th>由谁产生</th></tr></thead><tbody><tr><td>备忘录</td><td><code>CONFIG/STORAGE/memo.json</code></td><td>备忘录</td></tr><tr><td>收藏本</td><td><code>CONFIG/STORAGE/favorites.json</code></td><td>收藏本</td></tr><tr><td>归物本</td><td><code>CONFIG/STORAGE/belongings.json</code></td><td>归物本</td></tr><tr><td>剪藏本侧写</td><td><code>CONFIG/STORAGE/clipbook.json</code></td><td>剪藏本</td></tr><tr><td>剪藏本（未读流）</td><td><code>CONFIG/STORAGE/news.json</code></td><td>剪藏本</td></tr><tr><td>番茄钟</td><td><code>CONFIG/STORAGE/pomodoro.json</code></td><td>番茄钟</td></tr><tr><td>复习计划</td><td><code>CONFIG/STORAGE/review.json</code></td><td>复习计划</td></tr><tr><td>复习拟合参数</td><td><code>CONFIG/STORAGE/review-fit.json</code></td><td>复习计划</td></tr><tr><td>内容首页</td><td><code>CONFIG/STORAGE/home.json</code></td><td>内容首页</td></tr><tr><td>小橘</td><td><code>CONFIG/STORAGE/smartcat.json</code></td><td>小橘</td></tr><tr><td>小橘记忆流</td><td><code>CONFIG/STORAGE/smartcat-memory.json</code></td><td>小橘</td></tr><tr><td>小橘行为流</td><td><code>CONFIG/STORAGE/smartcat-behavior.json</code></td><td>小橘</td></tr><tr><td>锁屏统计</td><td><code>CONFIG/STORAGE/lock-stats.json</code></td><td>锁屏</td></tr><tr><td>知识盒</td><td><code>CONFIG/STORAGE/knowledge.json</code></td><td>知识盒</td></tr><tr><td>第二大脑</td><td><code>CONFIG/STORAGE/secondbrain.json</code></td><td>第二大脑</td></tr><tr><td>复习做题</td><td><code>CONFIG/STORAGE/quiz.json</code></td><td>复习做题</td></tr><tr><td>EPUB 阅读数据</td><td>书架墙 Weave 插件数据路径（<code>weave-data.json</code>）</td><td>书架墙（外部 Weave 插件数据）</td></tr></tbody></table>\n<blockquote>清单来源：src/checkup/files.ts:40。实际路径会跟随你的「数据存储路径」设置（除收藏本走 <code>getStoragePath</code>、EPUB 走书架墙 Weave 解析外，都在同一存储目录下）。</blockquote>\n<h3>清单有意豁免的对象（不扫）</h3>\n<ul>\n<li><code>encrypt</code> 加密 manifest（<code>CONFIG/.ENCRYPT/</code> 密文域，由保险库域自己的体检覆盖，明文巡检不碰密文）；</li>\n<li><code>secondbrain.vec</code>（向量文件，非 JSON）；</li>\n<li><code>gameshelf</code>（数据在笔记 frontmatter，无根 JSON——其失效指向归检查三的孤儿面）(src/checkup/files.ts:34)。</li>\n</ul>\n<h3>检查三（孤儿）额外扫描的笔记范围</h3>\n<table><thead><tr><th>检查对象</th><th>位置</th><th>检查什么</th></tr></thead><tbody><tr><td>影视条目海报</td><td>影院目录笔记 frontmatter「海报」</td><td>指向的文件是否还在（src/checkup/checks-orphans.ts:45）</td></tr><tr><td>书目封面 / EPUB 文件</td><td>书架墙 md 书 + weave EPUB 条目</td><td>封面路径、EPUB 文件路径是否还在（src/checkup/checks-orphans.ts:67）</td></tr><tr><td>游戏封面 / 截图</td><td>游戏库目录笔记 frontmatter</td><td>cover / shots 本地路径是否还在（src/checkup/checks-orphans.ts:100）</td></tr><tr><td>剪藏残留 / 标注 / 待回写</td><td>剪藏目录笔记 + <code>clipbook.json</code> 侧写</td><td>侧写指向的剪藏笔记是否还在（src/checkup/checks-orphans.ts:131）</td></tr><tr><td>收藏关联笔记</td><td><code>favorites.json</code> 条目 <code>linkedNote</code></td><td>关联笔记是否还在（src/checkup/checks-orphans.ts:225）</td></tr><tr><td>知识盒任务引用</td><td><code>knowledge.json</code> 任务 <code>notePath</code> / <code>videoPath</code></td><td>文献笔记 / 视频文件是否还在（src/checkup/checks-orphans.ts:252）</td></tr></tbody></table>\n<h2>面板怎么用</h2>\n<p>两种入口：</p>\n<ul>\n<li><strong>命令</strong>：运行 <code>bz-data-checkup-open</code>（命令面板里显示名「数据体检」，图标听诊器，src/main.ts:254）；</li>\n<li><strong>设置面板</strong>：bz 设置 → 通用 →「数据存储路径」组末尾的「数据体检 · 打开体检」按钮（src/settings-panel/ui.ts:71）。</li>\n</ul>\n<p>打开后：</p>\n<ol>\n<li><strong>空态</strong>：第一次打开只有「开始体检」一个入口。点它开始跑（src/checkup/ui.ts:148）。</li>\n<li><strong>运行中</strong>：顶部进度条 + 四项检查清单（等待 / 进行 / 完成），大库中段进度也会插值推进，不会卡死（src/checkup/ui.ts:223、src/checkup/run.ts:75）。底部「取消体检」可随时中止（src/checkup/ui.ts:215）。</li>\n<li><strong>结果页</strong>：三态分组展示（src/checkup/ui.ts:314）：</li>\n</ol>\n<ul>\n<li><strong>红 · 需要处理</strong>：error 级（坏 JSON / 结构异常）；</li>\n<li><strong>黄 · 建议处理</strong>：warn + info 级（漂移 / 孤儿，含可修复项）；</li>\n<li><strong>绿 · 通过</strong>：无问题的检查项。</li>\n</ul>\n<p>每条问题带色点 + 文案；有「详情」的会显示「查看详情」展开路径与说明（src/checkup/ui.ts:421）。可修复项额外带修复按钮。</p>\n<ol>\n<li><strong>缓存提示</strong>：重开面板会显示上次结果。系统按各文件 mtime 指纹判断（src/checkup/run.ts:104）：文件都没变 → 标「此后数据未变化」；有变化或无法判定 → 标「数据可能已变化，重新体检」并就地给按钮（src/checkup/ui.ts:285）。</li>\n<li><strong>后台完成</strong>：体检时把面板关了，跑完仍会弹通知，带「查看」直达（src/checkup/ui.ts:195）。</li>\n<li><strong>重新体检</strong>：结果页底部「重新体检」再跑一遍，覆盖上次（src/checkup/ui.ts:170）。</li>\n</ol>\n<h2>全部设置项</h2>\n<p><strong>无。</strong></p>\n<p>数据体检域本身没有任何设置项。它只读 <code>settings.storagePath</code>（数据存储路径）来解析文件位置（src/checkup/files.ts:39），不新增任何自己的配置。它的入口挂在通用设置的「数据存储路径」组末尾（不是一个独立设置项，src/settings-panel/ui.ts:67）。</p>\n<h2>全部命令</h2>\n<table><thead><tr><th>命令 id</th><th>命令面板显示名</th><th>作用</th></tr></thead><tbody><tr><td><code>bz-data-checkup-open</code></td><td>数据体检</td><td>打开数据体检面板（src/main.ts:254）</td></tr></tbody></table>\n<p>（另有设置面板里的「数据体检 · 打开体检」按钮，功能等同，见上节。）</p>\n<h2>四类检查分别判什么</h2>\n<p>体检一次跑完四类检查，串行执行；任一类抛错不会拖垮整页，会降级成该项的一条红色问题（src/checkup/run.ts:81）。</p>\n<h3>一、数据文件可解析（json）</h3>\n<p>逐个只读直读清单里的每个 JSON，尝试解析（src/checkup/checks-json.ts:81）。每个文件判为四种状态之一（src/checkup/checks-json.ts:17）：</p>\n<ul>\n<li><strong>missing（不存在）</strong>：<strong>不算问题</strong>——首次使用前懒创建是常态（src/checkup/checks-json.ts:7）；</li>\n<li><strong>ok（可解析）</strong>：通过；</li>\n<li><strong>corrupt（解析失败）</strong>：红色问题，列出文件路径；若在 <code>CONFIG/.CORRUPT/</code> 下有历史留档，一并给出留档路径（src/checkup/checks-json.ts:46、src/checkup/files.ts:22）；</li>\n<li><strong>unreadable（文件在但读不动）</strong>：黄色提示——被占用 / 权限不足 / 同步盘瞬时 IO，既不是损坏也不是缺失，稍后重新体检即可（src/checkup/checks-json.ts:56）。</li>\n</ul>\n<blockquote>坏文件<strong>不会在体检时重建</strong>。但它在对应功能下次读取时，会先留档到 <code>CONFIG/.CORRUPT/</code> 再重建默认文件（D1 契约，src/checkup/checks-json.ts:65）。所以体检当下你看到的是「现场」，数据不会丢。</blockquote>\n<h3>二、字段漂移（drift）</h3>\n<p>对磁盘原文核对「约定字段集」，分条目级与段级（src/checkup/checks-drift.ts:80）。约定字段集与各域写侧形状单源锁死（契约见 <code>tests/checkup/contract.test.ts</code>）：</p>\n<ul>\n<li><strong>条目级</strong>：备忘录 14 字段、收藏 15 字段、番茄钟 history 3 字段（src/checkup/checks-drift.ts:14）；</li>\n<li><strong>段级</strong>：<code>clipbook</code> / <code>news</code> / <code>home</code> / <code>belongings</code> / <code>quiz</code> / <code>pomodoro</code> 根段（src/checkup/checks-drift.ts:51）。</li>\n</ul>\n<p>判出的问题（<strong>只报告不修</strong>，src/checkup/checks-drift.ts:7）：</p>\n<ul>\n<li>非对象条目混进数组 → 红色（读取链会中断）；</li>\n<li>约定外字段 / 约定外数据段 → 黄色（可能是旧版本残留或外部写入）；</li>\n<li>字段缺失 / 数据段缺失 / 旧纯数组形态 → 提示（读取时自动补默认值，旧数据常态）；</li>\n<li>收藏本根不是数组 → 黄色（读取链会失败）；</li>\n<li>部分可选字段（如收藏 <code>archived</code>、番茄钟 <code>task</code>）和可选段（如 <code>pomodoro.json</code> 的 <code>archived</code>）<strong>特意不计缺</strong>，避免噪音（src/checkup/checks-drift.ts:35、src/checkup/checks-drift.ts:45）。</li>\n</ul>\n<h3>三、孤儿条目（orphan）</h3>\n<p>域条目里指向库内文件的引用，指向的文件已不存在 = 孤儿（src/checkup/checks-orphans.ts:41）。覆盖上节表格里的全部范围。除 weave EPUB 外，分为：</p>\n<ul>\n<li><strong>只报告、不可修</strong>：影院海报、书库封面、游戏封面 / 截图、weave EPUB 文件（它们在你的笔记 frontmatter 或外部插件数据里，体检不改动，src/checkup/checks-orphans.ts:14）；</li>\n<li><strong>可修复</strong>（带修复按钮）：剪藏残留 / 划词标注 / 待回写来源、收藏关联笔记、知识盒任务引用（src/checkup/checks-orphans.ts:153、src/checkup/checks-orphans.ts:242、src/checkup/checks-orphans.ts:272）。</li>\n</ul>\n<h3>四、同源一致性（consistency，仅备忘录）</h3>\n<p>对 <code>memo.json</code> 做双链核对：把「归一口径快照」与 <code>memo/data.ts</code> 的 <code>normalizeItem</code> 实际归一逐键 <code>Object.is</code> 比对（src/checkup/checks-consistency.ts:44）。目的是抓字段归一链路的 bug（src/checkup/checks-consistency.ts:8）。还会抓（src/checkup/checks-consistency.ts:125）：</p>\n<ul>\n<li>文件不是条目数组 → 红色；</li>\n<li>两条读取链计数分叉 / 字段级归一分叉 → 红色（说明归一链路有 bug，请反馈）；</li>\n<li>非对象条目 → 红色；</li>\n<li>重复 id（完成 / 删除会同 id 联动误伤）→ 黄色；</li>\n<li>缺标题（列表空行）→ 黄色；</li>\n<li>缺 id（下次读取自动补）→ 提示。</li>\n</ul>\n<p><code>memo.json</code> 不存在或坏掉时该项跳过（坏 JSON 已由检查一报告，src/checkup/checks-consistency.ts:201）。</p>\n<h2>结果怎么分级</h2>\n<p>问题三档（src/checkup/types.ts:11）：</p>\n<ul>\n<li><strong>error（红）</strong>：必须处理——坏 JSON、结构异常、双链分叉；</li>\n<li><strong>warn（黄）</strong>：建议处理——漂移、孤儿（含可修复项）；</li>\n<li><strong>info（提示）</strong>：仅供参考——字段 / 段缺失等旧数据常态。</li>\n</ul>\n<p>结果页汇总文案（src/checkup/ui.ts:301）：有 error →「N 个问题需要处理」；只有 warn/info →「N 处建议处理」；全空 →「全部通过」。</p>\n<h2>发现问题后你该怎么办</h2>\n<table><thead><tr><th>问题类型</th><th>处理办法</th></tr></thead><tbody><tr><td>坏 JSON（红）</td><td>体检不动文件。坏文件会在对应功能下次读取时自动留档到 <code>CONFIG/.CORRUPT/</code> 并重建默认文件；也可从留档手工恢复原文（src/checkup/checks-json.ts:65）。<strong>不要</strong>指望体检帮你修好。</td></tr><tr><td>读不动（黄）</td><td>不是损坏也不是缺失，多半是同步盘 / 占用瞬时故障，稍后重新体检即可（src/checkup/checks-json.ts:56）。</td></tr><tr><td>漂移（黄 / 提示）</td><td>多数只报告不修；缺失字段读取时自动补默认值，无需处理；约定外字段多为旧版本或外部写入残留，不影响读取。</td></tr><tr><td>孤儿·可修复（黄）</td><td>用「一键修复」或单条「清除」清理失效指针（见下），条目本体保留。</td></tr><tr><td>孤儿·只报告（黄）</td><td>影院海报 / 书库封面 / 游戏封面 / EPUB 指向的文件没了。体检不改动它们。请补回文件，或在对应笔记里清空该 frontmatter 字段；EPUB 项请回到 Weave 插件重新导入或清理其数据。</td></tr><tr><td>双链分叉（红）</td><td>备忘录归一链路 bug，请反馈给开发者（src/checkup/checks-consistency.ts:144）。</td></tr></tbody></table>\n<h2>会不会自动修</h2>\n<ul>\n<li><strong>体检本体不写任何文件</strong>（只读，src/checkup/files.ts:12）。唯一动手的是下面「一键修复」，且仅限孤儿里的可修复子集。</li>\n<li><strong>坏 JSON 不在体检时修</strong>——保留现场，靠对应功能下次读取时自动留档 + 重建（src/checkup/checks-json.ts:65）。</li>\n<li><strong>漂移不修</strong>——约定缺失字段读取时自动补，约定外字段只报告（src/checkup/checks-drift.ts:7）。</li>\n</ul>\n<h3>一键修复（仅失效引用）</h3>\n<p>可修复项分三组域（src/checkup/ui.ts:326）：收藏本、剪藏本（合并残留 / 标注 / 待回写来源）、知识盒。修复<strong>只清数据文件里的失效指针，不删你的笔记，条目本体保留</strong>（src/checkup/run.ts:170、src/checkup/run.ts:389）。</p>\n<ul>\n<li><strong>单条修复</strong>：免确认，直达清除，并挂撤销链（src/checkup/ui.ts:481）；</li>\n<li><strong>批量（一键修复 / 按域分组）</strong>：弹确认框，写明将清除多少项（src/checkup/ui.ts:482）；</li>\n<li>清除后可在通知里<strong>撤销</strong>（undo 闭包，src/checkup/ui.ts:506），撤销后再自动重跑体检把报告收敛回去；</li>\n<li>修复完成后自动重新体检一次（src/checkup/ui.ts:532）；</li>\n<li>修复写盘窗口内面板全部按钮禁用、不可取消（src/checkup/ui.ts:216）。</li>\n</ul>\n<blockquote>撤销契约边界：撤销窗口内若你改了 <code>storagePath</code>，撤销可能写回旧路径（数据不丢、落点错位），见 run.ts 撤销落点注释（src/checkup/run.ts:20）。</blockquote>\n<h2>边界、限制与坑</h2>\n<ul>\n<li><strong>加密域、向量文件、游戏库根 JSON 不在清单</strong>：加密 manifest 由保险库域体检覆盖；<code>secondbrain.vec</code> 非 JSON；游戏库数据在笔记 frontmatter（src/checkup/files.ts:34）。</li>\n<li><strong>读不动 ≠ 损坏 ≠ 缺失</strong>：被占用 / 权限 / 同步盘瞬时 IO 会判成 unreadable（黄），重新体检通常就好，别当坏文件处理（src/checkup/checks-json.ts:56）。</li>\n<li><strong>缓存可能过期</strong>：重开面板看到的是上次报告，按 mtime 指纹判断可信度；标「数据可能已变化」时就该重新体检（src/checkup/run.ts:123）。</li>\n<li><strong>大库会分片让出主线程</strong>：中段时间也会推进进度条，不是卡死（src/checkup/run.ts:75）。</li>\n<li><strong>检查项抛错不拖垮整页</strong>：单类失败降级成该项一条红问题（src/checkup/run.ts:81）。</li>\n<li><strong>修复只清指针、可撤销</strong>：不会删你的真实笔记或条目，且撤销链在位（src/checkup/ui.ts:506）。</li>\n<li><strong>改存储路径后需重扫</strong>：清单路径跟随 <code>storagePath</code>，迁移后跑一次体检确认各文件按新路径被扫到。</li>\n</ul>\n<h2>常见问题</h2>\n<p><strong>1. 体检会改我的数据吗？</strong></p>\n<p>除「一键修复」清理失效引用外，体检本身只读，不改任何文件；坏文件也不会在体检时重建，留档在 <code>CONFIG/.CORRUPT/</code>（src/checkup/files.ts:12）。</p>\n<p><strong>2. 看到「数据文件无法解析（红）」怎么办？</strong></p>\n<p>体检当下不动文件。该文件会在对应功能下次读取时自动留档到 <code>CONFIG/.CORRUPT/</code> 并重建默认文件；你也可以从留档手工恢复原文（src/checkup/checks-json.ts:65）。</p>\n<p><strong>3. 「一键修复」会删我的笔记吗？</strong></p>\n<p>不会。只清除数据文件里失效的关联 / 残留指针（如收藏的关联笔记、剪藏残留），条目本体保留，且清除后可在通知里撤销（src/checkup/run.ts:170）。</p>\n<p><strong>4. 为什么有些问题只有「查看详情」没有修复按钮？</strong></p>\n<p>影院海报、书库封面、游戏封面、EPUB 指向的是你笔记 frontmatter 或 weave 插件数据，体检不改动它们，需要你补回文件或在笔记里清空对应字段（src/checkup/checks-orphans.ts:14）。</p>\n<p><strong>5. 重开面板看到的还是旧结果？</strong></p>\n<p>是缓存。面板按各文件 mtime 指纹判断：都没变标「此后数据未变化」，有变标「数据可能已变化，重新体检」（src/checkup/ui.ts:285）。</p>\n<p><strong>6. 「文件存在但读不动（黄）」是什么？</strong></p>\n<p>文件在但读取失败（被占用 / 权限不足 / 同步盘瞬时 IO），既不是损坏也不是缺失，稍后重新体检即可（src/checkup/checks-json.ts:56）。</p>","no":7},{"id":"global","title":"通用","group":"基础","tags":["basic","config"],"domain":"global","html":"<blockquote>跨域偏好：数据存哪、面板长什么样</blockquote>\n<h2>什么时候用它</h2>\n<p>只有三件事需要来这里改：</p>\n<ol>\n<li><strong>数据存哪</strong>（数据存储路径）—— 想把 json 数据挪出主目录、或放进同步盘时；</li>\n<li><strong>设置面板长什么样</strong>（布局 / 主题）；</li>\n<li><strong>下载 / 打开使用手册</strong>（使用手册按钮）。</li>\n</ol>\n<p>其他所有偏好都在各自域的面板页里，不在这一页。</p>\n<p>这一页<strong>没有命令</strong> —— 入口就是设置面板（<code>bz-settings-panel-open</code>）左侧的「通用」。</p>\n<h2>数据放在哪</h2>\n<p>这个域自己<strong>不产生数据文件</strong>；它管的恰恰是别人的数据放在哪。</p>\n<p><strong>数据存储路径</strong>下会出现的文件（默认 <code>CONFIG/STORAGE</code>，面板里都列了）：</p>\n<table><thead><tr><th>文件</th><th>归属</th></tr></thead><tbody><tr><td><code>belongings.json</code></td><td>归物本</td></tr><tr><td><code>clipbook.json</code></td><td>剪藏本侧写（含阅读流水）</td></tr><tr><td><code>news.json</code></td><td>剪藏未读流</td></tr><tr><td><code>favorites.json</code></td><td>收藏本</td></tr><tr><td><code>memo.json</code></td><td>备忘录</td></tr><tr><td><code>pomodoro.json</code></td><td>番茄钟</td></tr><tr><td><code>review.json</code> / <code>review-fit.json</code> / <code>quiz.json</code></td><td>复习计划 / 拟合参数 / 做题记录</td></tr><tr><td><code>knowledge.json</code> / <code>mount-suggest.json</code></td><td>知识盒 / 挂载建议缓存</td></tr><tr><td><code>secondbrain.json</code> / <code>secondbrain.vec</code></td><td>第二大脑（<strong><code>.vec</code> 是二进制，打不开看</strong>）</td></tr><tr><td><code>home.json</code></td><td>首页</td></tr><tr><td><code>smartcat.json</code> / <code>smartcat-memory.json</code> / <code>smartcat-memory-vectors.vec</code> / <code>smartcat-behavior.json</code></td><td>小橘</td></tr><tr><td><code>people.json</code> / <code>people-preview.json</code> / <code>people-jobs.json</code></td><td>脸谱（数据 / 预览缓存 / 导入任务）</td></tr><tr><td><code>lock-stats.json</code></td><td>锁屏统计</td></tr><tr><td><code>weave-data.json</code></td><td>书库阅读数据</td></tr><tr><td><code>.ENCRYPT/</code></td><td><strong>保险库密文</strong>（子目录，固定在这里）</td></tr></tbody></table>\n<p><strong>不在这个目录里的东西</strong>（容易误会，记一下）：</p>\n<ul>\n<li>剪藏存下来的<strong>网页图片</strong>等媒体 → 仍走 vault 的附件目录；</li>\n<li>影视 / 日记 / 游戏 / 书库 / 剪藏笔记这些<strong>笔记本体</strong> → 是库里的普通 <code>.md</code>，不走 json；</li>\n<li>脸谱的外部聊天数据 → 在你选的那个<strong>库外</strong>数据文件夹里。</li>\n</ul>\n<h2>面板怎么用</h2>\n<ol>\n<li>打开设置面板（命令 <code>bz-settings-panel-open</code> 或宿主设置页里的入口）。</li>\n<li>左导航最上面的「通用」页：</li>\n</ol>\n<ul>\n<li><strong>数据存储路径</strong>：点右侧按钮选择目录（库内路径），或直接粘路径。改完会弹一条<strong>警告级通知</strong>提醒你影响面（<code>src/core/settings-main-schema.ts:798</code>）。</li>\n<li><strong>布局 / 主题</strong>：卡片式选择，选了立即应用。</li>\n</ul>\n<ol>\n<li>顶部搜索能搜到本页的设置行名。</li>\n</ol>\n<h2>全部设置项</h2>\n<h3>外观</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>布局</td><td><code>settingsPanelLayout</code></td><td>卡片选择</td><td>jingwei</td><td>设置面板的布局（当前只有「经纬」一种）</td></tr><tr><td>主题</td><td><code>settingsPanelSkin</code></td><td>卡片选择</td><td>chenhun</td><td>设置面板的主题（当前只有「晨昏」一种）。<strong>晨昏 = 跟随 Obsidian 的亮暗</strong>，没有独立的亮暗策略键（<code>src/settings-panel/schema.ts:5</code>）</td></tr></tbody></table>\n<p>原「设置」域已撤销，这两行并入「通用」并排在最前（键与工厂名不变）。</p>\n<h3>使用手册</h3>\n<table><thead><tr><th>控件</th><th>说明</th></tr></thead><tbody><tr><td>使用手册（按钮）</td><td><strong>一个按钮，按状态分岔</strong>：手册还没下载时，点它从 GitHub 拉取手册页、写进<strong>插件安装目录</strong>（<code>&lt;配置目录&gt;/plugins/bz/bz-manual.html</code>），完成后自动在系统浏览器打开；已经下载过时，点它直接打开本地那份。下载走两条通道：GitHub raw 主、jsDelivr 备，两路都失败才报错（<code>src/core/manual.ts</code>）。手册不随插件构建分发 —— 想更新手册，删掉插件目录里那份再点一次即可</td></tr></tbody></table>\n<h3>数据存储路径</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>数据存储路径</td><td><code>storagePath</code></td><td>路径</td><td><code>CONFIG/STORAGE</code></td><td>全部 json 数据统一存放的目录。<strong>改动只改路径、不迁移旧数据</strong>，且<strong>要重载插件才生效</strong></td></tr></tbody></table>\n<h2>全部命令</h2>\n<p><strong>无。</strong> 这一页没有命令 —— 它只有设置。想打开设置面板用 <code>bz-settings-panel-open</code>。</p>\n<h2>边界、限制与坑</h2>\n<ul>\n<li><strong>改路径不搬数据</strong>：插件会去新位置读写，旧文件留在原地。要么手动移过去，要么改完记得旧目录还在 —— 不然在插件看来数据「没了」。</li>\n<li><strong>要重载插件</strong>：不重载还是读旧位置（面板的说明里就写了这一句）。</li>\n<li><strong>密文跟着走</strong>：<code>.ENCRYPT</code> 是数据存储路径的子目录，所以改路径等于改密文位置。<strong>已有密文不会自动搬</strong> —— 保险库会看起来是空的，手工移过去即可。</li>\n<li><strong><code>.vec</code> 是二进制</strong>：<code>secondbrain.vec</code> 与 <code>smartcat-memory-vectors.vec</code> 别手动编辑。</li>\n<li><strong>媒体不在这里</strong>：想统一管理图片附件得用附件相关设置，不是这一页。</li>\n<li><strong>两个外观项目前各只有一个选项</strong>：等于还没有可切换的皮肤。</li>\n<li>通知相关的四行已从这一页<strong>拆出去</strong>，单独成一页「通知」。</li>\n</ul>\n<h2>常见问题</h2>\n<p><strong>我的数据到底存在哪？</strong></p>\n<p>默认在 <code>CONFIG/STORAGE</code>（相对 vault 根）。要确认就看这一页的值；要搬家改这一行，但记得先把旧文件移过去。</p>\n<p><strong>改了路径，数据还在旧地方怎么办？</strong></p>\n<p>把旧目录里的文件复制到新目录，然后重载插件。插件不会替你搬。</p>\n<p><strong>为什么改完没反应？</strong></p>\n<p>路径类的改动要重载插件（把插件关掉再打开）才生效。</p>\n<p><strong>面板主题能跟着系统变暗吗？</strong></p>\n<p>能。「晨昏」就是跟随 Obsidian 的亮暗自动切换 —— 这就是它的定义，没有单独的亮暗开关。</p>\n<p><strong>这一页能重置所有设置吗？</strong></p>\n<p>不能。这一页只有手册下载、数据路径与外观三项；没有「一键重置全部设置」的入口。</p>\n<p><strong>「使用手册」按钮点了没反应 / 报下载失败？</strong></p>\n<p>下载要走 GitHub（raw.githubusercontent.com），网络不通时自动换 jsDelivr 备用通道再试一次；两路都失败会弹错误通知，里面带着失败原因。挂上代理后再点一次即可。</p>\n<p><strong>手册下载到哪里了？</strong></p>\n<p>插件安装目录：<code>&lt;配置目录&gt;/plugins/bz/bz-manual.html</code>（不是数据存储路径 —— 手册是程序资产，跟版本走，不跟你的数据混放）。</p>\n<p><strong>加密的笔记存在这个目录里吗？</strong></p>\n<p>在 —— 但在它的<strong>子目录</strong> <code>.ENCRYPT</code> 里，而且是密文。数据目录里看到 <code>.ENCRYPT</code> 就当它不存在，去保险库页管理。</p>","no":8},{"id":"home","title":"首页","group":"基础","tags":["basic","interface"],"domain":"home","html":"<blockquote>一条按时间排的「活动河」，加一排域入口和预告栏</blockquote>\n<h2>什么时候用它</h2>\n<p>想「一眼看到今天/这周库里发生了什么」时打开它。它是各域活动的<strong>汇总视图</strong>：一条按天排的时间线（活动河）、一栏预告、一排域入口。</p>\n<p>它自己不产生内容 —— 上面的记录来自别的域的动作（写日记、收剪藏、读完一本书、给影片打分这类）。</p>\n<h2>数据放在哪</h2>\n<table><thead><tr><th>文件</th><th>位置</th><th>里面是什么</th></tr></thead><tbody><tr><td><code>home.json</code></td><td>数据存储路径</td><td><strong>首页自己的状态</strong>：入口的排序与增删（<code>src/home/order.ts:47</code>）</td></tr><tr><td><code>smartcat-behavior.json</code></td><td>数据存储路径</td><td>小橘<strong>行为流</strong> —— 时间线的主要数据来源（<code>src/home/behavior-timeline.ts:138</code>）</td></tr><tr><td>其他域的数据</td><td>各自位置</td><td>时间线上的条目是各域动作的回声，这里不另存一份</td></tr></tbody></table>\n<p>时间线吃的是<strong>行为流</strong>（issue 305 / ADR-0132）：谁在什么时候做了什么由行为流统一记录，首页负责按天排出来。</p>\n<h2>面板怎么用</h2>\n<ol>\n<li>「内容首页」命令打开（<code>bz-home-open</code>）。</li>\n<li>三个区域：</li>\n</ol>\n<ul>\n<li><strong>时间线（活动河）</strong>：按天排的动作记录，每行可选显示时刻，字号有紧凑 / 标准 / 宽松三档；</li>\n<li><strong>预告栏</strong>：右侧的复习、剪藏与日记预告卡（可整栏关掉）；</li>\n<li><strong>入口区</strong>：域入口图标墙 —— 顺序与去留由设置里的「入口」组拖动决定。</li>\n</ul>\n<ol>\n<li>想回看别的日子：按「时间范围」选的回翻窗口（当天 / 最近 3 天 / 本周）翻。</li>\n</ol>\n<h2>全部设置项</h2>\n<h3>外观</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>面板布局</td><td><code>homeLayout</code></td><td>卡片选择</td><td>default</td><td>切换面板布局（当前只有「活动河」）</td></tr><tr><td>面板主题</td><td><code>homeSkin</code></td><td>卡片选择</td><td>cream</td><td>切换面板主题（当前只有「米白」）</td></tr></tbody></table>\n<h3>时间线</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>时间线字号</td><td><code>homeTimelineSize</code></td><td>下拉</td><td>—</td><td>紧凑 / 标准 / 宽松（信息密度）</td></tr><tr><td>时间范围</td><td><code>homeTimelineRange</code></td><td>下拉</td><td>—</td><td>周历可回翻多少：当天 / 最近 3 天 / 本周</td></tr><tr><td>默认打开日</td><td><code>homeDefaultDay</code></td><td>下拉</td><td>—</td><td>打开时定位到「今天」还是「最后有动静的那天」</td></tr><tr><td>显示时刻列</td><td><code>homeTimelineTime</code></td><td>开关</td><td>—</td><td>每行是否显示时刻</td></tr></tbody></table>\n<h3>内容过滤</h3>\n<p>只决定「哪些痕迹进时间线」，与长相无关：</p>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>产出动作</td><td><code>homeTimelineProduce</code></td><td>开关</td><td>—</td><td>写下的 / 收进的 / 读完的这类动作记录</td></tr><tr><td>状态推进</td><td><code>homeTimelineProgress</code></td><td>开关</td><td>—</td><td>加入片单、读到一半这类推进记录</td></tr><tr><td>小橘点评</td><td><code>homeTimelineNotes</code></td><td>开关</td><td>—</td><td>小橘的点评与影片星级记录（<code>src/home/settings.ts:102</code>）</td></tr><tr><td>跳过痕迹</td><td><code>homeTimelineSkipped</code></td><td>开关</td><td><strong>关</strong></td><td>聚合讯里跳过的文章记录 —— 默认关，因为量级大（<code>src/home/settings.ts:112</code>）</td></tr></tbody></table>\n<h3>预告栏</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>明天预告卡</td><td><code>homeNextCards</code></td><td>开关</td><td>—</td><td>右侧的复习、剪藏与日记预告栏</td></tr></tbody></table>\n<h3>入口</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>入口</td><td>存 <code>home.json</code></td><td>自绘编辑器</td><td>—</td><td>拖动排序、移除 / 加回域入口（<code>src/home/settings.ts:132</code>）</td></tr></tbody></table>\n<h2>全部命令</h2>\n<table><thead><tr><th>命令</th><th>名称</th><th>做什么</th></tr></thead><tbody><tr><td><code>bz-home-open</code></td><td>内容首页</td><td>打开首页面板</td></tr></tbody></table>\n<p>这一域只有一条命令 —— 它的定位就是「入口」，具体动作都在各域自己的命令里。</p>\n<h2>边界、限制与坑</h2>\n<ul>\n<li><strong>时间线不是自动日志</strong>：它显示<strong>行为流里已有的记录</strong>。某类动作不出现，先看「内容过滤」里对应开关是否打开。</li>\n<li><strong>「跳过痕迹」默认关</strong>：聚合讯里跳过的文章量大，默认不显示，想看得手动开。</li>\n<li><strong>入口顺序存在 <code>home.json</code></strong>：跟库一起同步；只复制部分数据时会回到默认顺序。</li>\n<li><strong>预告栏可以整栏关掉</strong>，关掉后右侧不留空位。</li>\n<li><strong>它不产生数据</strong>：删掉 <code>home.json</code> 只丢入口排序，不丢任何域的内容。</li>\n<li>外观两行目前各只有一个选项。</li>\n</ul>\n<h2>常见问题</h2>\n<p><strong>首页空空的？</strong></p>\n<p>两种可能：① 还没有任何域产生过动作（先去写条日记或收藏点东西）；② 「内容过滤」里对应开关全关着。</p>\n<p><strong>怎么调入口顺序？</strong></p>\n<p>设置 → 首页 →「入口」组，直接拖动；这个编辑器同时管移除与加回。</p>\n<p><strong>时间线能看上周吗？</strong></p>\n<p>看「时间范围」选的是哪个 —— 当天 / 最近 3 天 / 本周，超出窗口的翻不到。</p>\n<p><strong>「小橘点评」是什么？</strong></p>\n<p>小橘给出的点评与影片星级评分记录；不想看就在「内容过滤」里关掉。</p>\n<p><strong>首页会拖慢 Obsidian 吗？</strong></p>\n<p>只在打开面板时读行为流与各域数据，关掉不占资源。</p>","no":9},{"id":"notice","title":"通知","group":"基础","tags":["basic","notice"],"domain":"notice","html":"<blockquote>一句话：bz 自绘的轻提示（toast），告诉你操作成没成、后台跑没跑完，可设级别/时长/位置/条数上限。</blockquote>\n<h2>什么时候用它</h2>\n<p>通知是插件所有域共用的「最后兜底报告通道」：你点了一个按钮、后台自动跑完一个任务、或某处保存失败，结果都会以右上角（桌面）或顶部（移动端）的小卡片告诉你（src/core/notice.ts:1-2）。</p>\n<ul>\n<li><strong>你主动操作</strong>后：如删除/归档/移出，会弹一条带「撤销」的提示，给你反悔窗口（src/core/notice.ts:132-151）。</li>\n<li><strong>后台自动任务</strong>进行中：如自动摘要、加密进度，会弹一条带进度条（转圈）的常驻通知，跑完原地变结果（src/core/notice.ts:382-388、src/core/notice.ts:519-588）。</li>\n<li><strong>出错时</strong>：写盘失败、动作失败会用 error 红条明确告诉你「什么失败 + 原因 + 怎么重试」（src/core/notice.ts:157-178）。</li>\n<li>它不是 Obsidian 原生 Notice，是插件自绘，受下面四组设置控制（src/core/notice.ts:2、src/core/settings-main-schema.ts:810-812）。</li>\n</ul>\n<h2>数据放在哪</h2>\n<p>通知<strong>不写任何数据文件</strong>——它只是屏幕上的临时卡片，关掉/卸载就没了（src/core/notice.ts:417-428）。只有四项偏好被持久化：</p>\n<table><thead><tr><th>文件 / 位置</th><th>里面是什么</th></tr></thead><tbody><tr><td>插件 data.json 的 <code>noticeLevel</code> / <code>noticeDuration</code> / <code>noticePosition</code> / <code>noticeMaxVisible</code> 四键</td><td>通知的级别、停留档、位置、同屏上限偏好（src/settings.ts:833-836）</td></tr><tr><td>运行时 DOM 容器 <code>#bz-notice-container</code></td><td>当前存活的通知卡片；非持久，插件卸载时整体清空（src/core/notice.ts:276-284、src/core/notice.ts:417-428）</td></tr></tbody></table>\n<h2>面板怎么用</h2>\n<ol>\n<li>打开 <strong>bz 设置面板</strong>（设置键不再出现在 Obsidian 原生设置页，统一在 bz 面板里改，src/core/settings-main-schema.ts:872-879）。</li>\n<li>在左侧导航找到 <strong>「通知」</strong> 一页（图标为 bell，src/core/settings-main-schema.ts:816-818）。</li>\n<li>按需要改下面四项：<strong>通知级别 / 停留时长 / 弹出位置 / 同屏上限</strong>（均为下拉选择，src/core/settings-main-schema.ts:820-866）。</li>\n<li>改动即时生效（设置读取走 settings-provider，通知是兜底通道，读取失败也按缺省行为弹，不会让通知本身炸，src/core/notice.ts:207-216）。</li>\n</ol>\n<h2>全部设置项</h2>\n<table><thead><tr><th>设置名</th><th>默认值</th><th>作用</th><th>什么时候生效</th><th>注意</th></tr></thead><tbody><tr><td>通知级别</td><td><code>all</code>（全部）</td><td>决定哪些通知能弹：<code>all</code>=全部；<code>important</code>=只弹警告与错误；<code>error</code>=只弹错误（src/core/notice.ts:236-243、src/core/settings-main-schema.ts:825-829）</td><td>下次弹通知时</td><td>带操作按钮（撤销/查看等）和进度类通知<strong>永不静默</strong>，无论级别多低都弹（src/core/notice.ts:239-240）；被静默的调用等同未发生，不计入去重窗口（src/core/notice.ts:513-514）</td></tr><tr><td>停留时长</td><td><code>standard</code>（标准 3 秒）</td><td>未显式指定时长的通知停留多久：<code>quick</code>=2s、<code>standard</code>=3s、<code>relaxed</code>=5s、<code>persistent</code>=不自动消失、点了才关（src/core/notice.ts:218-226、src/core/settings-main-schema.ts:836-841）</td><td>下次弹通知时</td><td>错误类比常规多 2 秒（如 standard 下 error=5s，src/core/notice.ts:228-231）；撤销 6s、进度常驻等显式时长<strong>不缩放</strong>（src/core/notice.ts:130、src/core/notice.ts:382-388）；<code>persistent</code> 仅影响「未显式指定时长」的普通通知，显式给了时长仍按显式值计时（src/core/notice.ts:394-396）</td></tr><tr><td>弹出位置</td><td><code>top-right</code>（右上）</td><td>桌面端弹在哪角：<code>top-right</code>/<code>bottom-right</code>/<code>bottom-left</code>/<code>top-left</code>（src/core/notice.ts:245-257、src/core/settings-main-schema.ts:848-853）</td><td>下次弹通知时</td><td><strong>仅桌面（宽 &gt;768px）生效</strong>；移动端恒顶部居中、从上往下，位置设置无效（src/core/notice.ts:181-195、src/core/notice.ts:245-247）</td></tr><tr><td>同屏上限</td><td><code>5</code>（5 条）</td><td>同屏最多显示几条：<code>3</code>/<code>5</code>/<code>8</code>（src/core/notice.ts:89-95、src/core/settings-main-schema.ts:860-864）</td><td>同屏通知超过上限时</td><td>只认 <code>3</code> 和 <code>8</code>，填其它一律回落 5（src/core/notice.ts:92-95）；超出时挤掉最旧的非常驻帧，常驻/进度帧不被挤掉（src/core/notice.ts:314-328）</td></tr></tbody></table>\n<p><strong>四个停留档的实际差别（重点）</strong>：都是从「未显式指定时长」算起。常规三类（info/success/warning）按档位 base 停留；<code>error</code> 在 base 上 +2 秒；<code>persistent</code> 档不自动消失，需点击关闭。显式时长的通知（如撤销 6 秒、进度条）不受档位影响（src/core/notice.ts:218-231、src/core/notice.ts:370-401）。</p>\n<h2>全部命令</h2>\n<p>无。通知是横切偏好，没有可手动触发的命令；所有通知都由插件各域在运行时自动弹出（src/main.ts:8 仅导入 <code>notice</code>/<code>cleanupNotices</code> 供卸载清理，未注册任何 <code>notice</code> 命令，src/main.ts:328-330）。</p>\n<h2>边界、限制与坑</h2>\n<ul>\n<li><strong>图标语义（铁律）</strong>：每条通知左侧有一个类型图标（emoji），正文<strong>一律不带 emoji 前缀</strong>——图标即视觉前缀，重复了（src/core/notice.ts:13、src/core/notice.ts:347-352）。对应关系：info ℹ️ / success ✅ / warning ⚠️ / error ❌ / pause ⏸️ / delete 🗑️ / restore ↩️ / archive 📁；progress 用转圈动画（src/core/notice.ts:108-119）。</li>\n<li><strong>通知会被堆叠</strong>：同屏多条从上往下排，超过上限挤掉最旧（src/core/notice.ts:314-328）。</li>\n<li><strong>通知会被合并（去重键）</strong>：同一「去重键」的通知还活着时，再次触发会<strong>原地更新文字并重置计时</strong>，不新弹一条（连续任务单框语义，如自动摘要进度原地刷新，src/core/notice.ts:16-17、src/core/notice.ts:524-544）。</li>\n<li><strong>为什么某些操作只弹一次</strong>：后台自动事件带去重键，通知消失后 <strong>30 秒内</strong>同键再触发<strong>不新弹</strong>，防刷屏（如游戏架队列熔断两队列同窗先后触发只提示一次，src/core/notice.ts:97-98、src/core/notice.ts:545-547、src/core/gameshelf/backfill.ts:116-117）。注意：被级别静默的调用不登记去重，不会占用这 30 秒窗口（src/core/notice.ts:513-514）。</li>\n<li><strong>常驻帧不丢</strong>：进度条（progress）默认常驻不自动消失，且堆叠挤兑时<strong>不被驱逐</strong>；它跑完会原地切类型（如 progress→success）并补挂「查看」等出口（src/core/notice.ts:376-400、src/core/notice.ts:534-542）。</li>\n<li><strong>点本体即关闭</strong>：任意通知（含常驻帧）点一下本体就关；操作按钮（如「撤销」）点了执行回调并收起，且不会误触关闭（src/core/notice.ts:602-604、src/core/notice.ts:446-465）。</li>\n<li><strong>长文停留更久</strong>：未显式指定时长时，正文 ≤20 字用档位默认；&gt;20 字每多 1 字加 60ms，最长 15 秒（src/core/notice.ts:259-274）。</li>\n<li><strong>级别压不住交互出口</strong>：带操作按钮或进度类通知不受「通知级别」静默影响，永远弹得出（src/core/notice.ts:236-243）。</li>\n</ul>\n<h2>常见问题</h2>\n<p><strong>Q1：通知太多、刷屏怎么办？</strong></p>\n<p>把「通知级别」调到 <code>important</code>（仅警告与错误）或 <code>error</code>（仅错误），常规 info/success 会被静默；再把「同屏上限」调低（如 3 条）。注意带「撤销/查看」按钮的通知和进度条仍会弹（src/core/notice.ts:236-243、src/core/notice.ts:89-95）。</p>\n<p><strong>Q2：某个操作明明又触发了，为什么只弹了一次？</strong></p>\n<p>那是去重键的 30 秒抑制窗口在起作用——后台同类事件（如自动摘要批次、队列熔断）30 秒内重复触发只弹一条，防刷屏（src/core/notice.ts:97-98、src/core/notice.ts:545-547）。</p>\n<p><strong>Q3：常驻通知（如进度条）怎么关？</strong></p>\n<p>直接点通知本体任意处即可关闭，包括常驻帧（src/core/notice.ts:602-604）。「停留时长」设为 <code>persistent</code> 的普通通知同样点本体才关（src/core/notice.ts:218-226）。</p>\n<p><strong>Q4：移动端把位置设成「左下」为什么不生效？</strong></p>\n<p>位置设置仅桌面（宽 &gt;768px）有效；移动端恒顶部居中、从上往下，设置里的四角位置被忽略（src/core/notice.ts:181-195、src/core/notice.ts:245-247）。</p>\n<p><strong>Q5：删错了能反悔吗？</strong></p>\n<p>能。删除/移出/归档类操作落地后会弹一条带「撤销」按钮的通知，默认停留 6 秒，点「撤销」回滚（src/core/notice.ts:130、src/core/notice.ts:141-151）。此按钮属于交互出口，任何通知级别下都弹得出（src/core/notice.ts:239-240）。</p>\n<p><strong>Q6：通知文字很长，停留时间会变长吗？</strong></p>\n<p>会。只要调用方没写死时长，正文超过 20 字后每多 1 字加 60ms，最长 15 秒；≤20 字用档位默认（src/core/notice.ts:259-274）。显式指定了时长的（如撤销 6s）按显式值，不随字数变（src/core/notice.ts:370-391）。</p>","no":10},{"id":"settings-panel","title":"设置面板","group":"基础","tags":["basic","interface"],"domain":"settings-panel","html":"<blockquote>所有域设置的一个入口：左导航挑域，顶部搜索直达</blockquote>\n<h2>什么时候用它</h2>\n<p>改任何设置都从这里进。它把 23 个域的设置页收进一个面板：左边按语义分组的导航，右边当前域的设置页，顶部一个全文搜索。</p>\n<p>另外它自己也有两行设置（布局 / 主题），排在「通用」页最前面（见「通用」章）。</p>\n<h2>面板怎么用</h2>\n<ol>\n<li>命令「设置面板」（<code>bz-settings-panel-open</code>）打开，或从宿主设置页进。</li>\n<li><strong>左导航</strong>按语义分组（<code>src/settings-panel/ui.ts:192</code>）：基础 / 智能 / 记录 / 收集 / 媒体与阅读 / 工具 / 安全，最后还有一个「其他」尾组。</li>\n<li><strong>每项后面的徽标</strong>是动态算的：没设置的域显示 <code>—</code>，其余初始显示 <code>·</code>，<strong>该域的 schema 加载后回填成设置项总数</strong>（<code>src/settings-panel/ui.ts:254</code>）。</li>\n<li><strong>顶部搜索</strong>：输入即过滤导航；命中口径不区分大小写（输 <code>api</code>、<code>rss</code>、<code>deepseek</code> 的小写也能命中）。搜索范围包含<strong>域名、描述与设置行名/行描述</strong>。</li>\n<li>桌面面板宽 920；移动端是<strong>全屏推入式两页</strong>：首页（搜索 + 域列表）→ 推入某个域的设置页，返回弹回（<code>src/settings-panel/ui.ts:7</code>）。</li>\n<li>部分设置行标题<strong>带用法说明</strong>：鼠标停在标题上出浮窗（触屏点标题），写了 <code>help</code> 的行才有 —— 详见各章的说明。</li>\n</ol>\n<h2>与 ⚙️ 原生设置弹窗的关系</h2>\n<p>同一份设置有两种呈现：</p>\n<table><thead><tr><th>入口</th><th>形态</th></tr></thead><tbody><tr><td>设置面板（本章）</td><td>自绘面板，带搜索、分组、徽标</td></tr><tr><td>⚙️ 原生弹窗</td><td>各域面板里的「设置」按钮弹出的宿主风格弹窗</td></tr></tbody></table>\n<p>两者读的是<strong>同一份 schema</strong>，改哪边都一样；行级的 <code>help</code> 说明两条链共用（<code>src/core/settings-schema.ts</code> 的 <code>newRowSetting</code> 与面板自绘渲染器都挂）。</p>\n<h2>性能与缓存（影响你能感知到的速度）</h2>\n<ul>\n<li><strong>同一会话内每个域的 schema 只加载一次</strong>（会话级缓存，<code>src/settings-panel/ui.ts:206</code>）—— 像剪藏本、小橘、复习这类带磁盘读取的域不会反复重扫；</li>\n<li><strong>显隐条件实时求值</strong>：<code>visibleWhen</code> 行（比如「自动摘要」关掉时子行收起）在每次刷新时按当前设置重新判断，不是首载快照；</li>\n<li>徽标跟着显隐变化走，不只是首次打开时的数字。</li>\n</ul>\n<h2>全部设置项</h2>\n<p>本域自己的设置只有两行，位于「通用」页最前：</p>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>布局</td><td><code>settingsPanelLayout</code></td><td>卡片选择</td><td>jingwei</td><td>面板布局（当前只有「经纬」）</td></tr><tr><td>主题</td><td><code>settingsPanelSkin</code></td><td>卡片选择</td><td>chenhun</td><td>面板主题（当前只有「晨昏」，跟随 Obsidian 亮暗）</td></tr></tbody></table>\n<h2>全部命令</h2>\n<table><thead><tr><th>命令</th><th>名称</th><th>做什么</th></tr></thead><tbody><tr><td><code>bz-settings-panel-open</code></td><td>设置面板</td><td>打开设置面板</td></tr></tbody></table>\n<h2>边界、限制与坑</h2>\n<ul>\n<li><strong>搜索是即时的</strong>：每敲一键都会重建导航与列表（有防抖），域多时略有跳动是正常的。</li>\n<li><strong>徽标的数字要等域加载</strong>：没进过的域先显示 <code>·</code>，进一次（或预载后）才变成具体数量。</li>\n<li><strong>移动端没有桌面那套左右布局</strong>：是推入式两页，返回键的行为是「弹回上一页」。</li>\n<li><strong>「其他」尾组</strong>：不在七个语义组里的域会落到这里，不是丢了。</li>\n<li><strong>设置行的说明浮窗只在有 <code>help</code> 的行上出现</strong>：没有浮窗 = 这行没有补充说明，不是坏了。</li>\n</ul>\n<h2>常见问题</h2>\n<p><strong>怎么快速找到某个设置？</strong></p>\n<p>顶部搜索框直接输设置名或关键词（中英文都行，不区分大小写）；桌面端命中后导航会跟着过滤。</p>\n<p><strong>为什么某个域的徽标是「—」？</strong></p>\n<p>那个域没有设置项（比如数据体检、附件搬移）。</p>\n<p><strong>面板里改的和 ⚙️ 弹窗里改的会冲突吗？</strong></p>\n<p>不会，同一份数据，两个入口写的是同一处。</p>\n<p><strong>打开面板有点慢？</strong></p>\n<p>第一次进某个域要现场读盘加载 schema（有会话缓存，第二次起就快了）。</p>\n<p><strong>主题能跟随系统亮暗吗？</strong></p>\n<p>能，「晨昏」就是跟随 Obsidian 亮暗的定义。</p>","no":11},{"id":"ai","title":"AI","group":"智能","tags":["ai","config"],"domain":"ai","html":"<blockquote>AI 模型与凭据配置</blockquote>\n<h2>什么时候用它</h2>\n<p>只要你打算用「会思考」的功能，就要来这里配一次。具体是这些：剪藏摘要与标签、脸谱人物画像、第二大脑的检索与对话、知识盒的关联判定与挂载建议、知识盒视频转文字。用不到这些，整章可以跳过——插件其余部分不依赖 AI。</p>\n<p>配一次的原则：<strong>选一条通道 + 填一个密钥</strong>，模型名留空即可（插件用该服务商的默认模型）。</p>\n<h2>数据放在哪</h2>\n<p>所有 AI 配置都写在插件设置里（Obsidian 插件数据目录的 <code>data.json</code>），不落在 vault 里。</p>\n<table><thead><tr><th>键</th><th>类型</th><th>说明</th></tr></thead><tbody><tr><td><code>aiProvider</code></td><td>字符串</td><td>当前生成通道（<code>deepseek</code> / <code>zhipu-plan</code> / <code>ollama</code>）</td></tr><tr><td><code>aiModelOverrides</code></td><td>对象</td><td>每个服务商一份模型名覆盖</td></tr><tr><td><code>aiMaxTokensOverrides</code></td><td>对象</td><td>每个服务商一份最大输出 token 覆盖</td></tr><tr><td><code>aiThinkingOverrides</code></td><td>对象</td><td>每个服务商一份思考档位</td></tr><tr><td><code>deepseekApiKey</code> / <code>zhipuPlanApiKey</code> / <code>ollamaApiKey</code></td><td>字符串</td><td>三条通道各自的密钥</td></tr><tr><td><code>secondBrainEmbeddingModel</code></td><td>字符串</td><td>嵌入模型（默认 <code>bge-m3</code>）</td></tr><tr><td><code>secondBrainOllamaUrl</code></td><td>字符串</td><td>桌面端连本机 Ollama 的地址（默认 <code>http://localhost:11434</code>）</td></tr><tr><td><code>secondBrainRerank</code></td><td>布尔</td><td>启用重排（默认开）</td></tr><tr><td><code>jevProvider</code></td><td>字符串</td><td>判定通道服务商（默认 <code>typesafe</code>）</td></tr><tr><td><code>jevApiKeys</code> / <code>jevModels</code></td><td>对象</td><td>判定通道按服务商分存的密钥与模型</td></tr><tr><td><code>asrEngine</code> / <code>asrWhisperModel</code></td><td>字符串</td><td>转写引擎（默认 <code>sensevoice</code>）与 Whisper 档位（默认 <code>small</code>）</td></tr><tr><td><code>cinemaApizeroKey</code> / <code>bilibiliCookie</code> / <code>cinemaDoubanCookie</code></td><td>字符串</td><td>三个外部凭据（默认都为空）</td></tr></tbody></table>\n<blockquote>「按服务商分存」的意思：<code>aiModelOverrides</code> 这类键里面是 <code>{ deepseek: '…', ollama: '…' }</code> 这样的映射。所以你切服务商不会互相覆盖。</blockquote>\n<h2>日常怎么用</h2>\n<p>设置面板左侧「智能 → AI」，页面里是五个组，从上到下依次配：</p>\n<ol>\n<li><strong>LLM</strong>：先选「AI 服务商」，下面会对应出现该家的密钥行，粘贴密钥（框是掩码的，右侧眼睛可以切明文）。</li>\n<li><strong>LLM → 模型名称</strong>：留空用默认模型；不确定名字就点行内「获取模型名」从服务商接口拉列表，选中即回填。</li>\n<li><strong>LLM → 最大输出 token</strong>：留空（推荐），插件按当前模型名取官方最大档。</li>\n<li><strong>Embedding</strong>：要用第二大脑检索时配一个嵌入模型；本机跑 Ollama 的话先确认「Ollama 本地 URL」通。</li>\n<li><strong>JEV</strong>：只有当你要用判定类功能（如知识盒关联判定）时才需要；不填就用生成通道那套。</li>\n<li><strong>数据源凭据</strong>：影院字段（ApiZero Key）、B站清晰度（B站 Cookie）、豆瓣风控（豆瓣 Cookie），按需填。</li>\n<li><strong>语音转写</strong>：知识盒把视频转文字用哪套引擎；这行依赖你机器上装好的外部 Python 环境。</li>\n</ol>\n<p>行内按钮都长在输入框左侧：密钥行有「测试」（发一次极小请求验证连通，按钮上直接显示转圈 / 绿✓ / 红✕），模型名行有「获取模型名 / 获取模型」，B站 Cookie 行在桌面端还有「从 CLI 导入」。</p>\n<h2>五个组分别管什么</h2>\n<h3>LLM（生成通道）</h3>\n<table><thead><tr><th>设置</th><th>默认</th><th>说明</th></tr></thead><tbody><tr><td>AI 服务商</td><td><code>deepseek</code></td><td>三条通道：DeepSeek、智谱 Plan、Ollama</td></tr><tr><td>DeepSeek 密钥 / 智谱 Plan 密钥 / Ollama 密钥</td><td>空</td><td>行名与说明随服务商注册表生成；有密钥的通道才可用</td></tr><tr><td>模型名称</td><td>空</td><td>留空用该服务商默认模型；自由文本不校验</td></tr><tr><td>最大输出 token</td><td>空</td><td>三段回落：本行覆盖 &gt; 模型档位表 &gt; 服务商默认</td></tr><tr><td>思考 reasoning</td><td>跟随</td><td>档位表随服务商变：DeepSeek 关 / 低 / 高 / 最高；智谱 Plan 无关闭档（只有低 / 高 / 最高）；Ollama 关 / 低 / 中 / 高</td></tr><tr><td>Ollama 本地 URL</td><td><code>http://localhost:11434</code></td><td>桌面端用；移动端读另一个自动维护的远端键</td></tr></tbody></table>\n<h3>Embedding（嵌入通道）</h3>\n<table><thead><tr><th>设置</th><th>默认</th><th>说明</th></tr></thead><tbody><tr><td>Embedding 模型</td><td><code>bge-m3</code></td><td>第二大脑向量化用；点「获取模型」走当前 Ollama，按 embedding 能力过滤（旧版 Ollama 无 capabilities 字段时会把聊天模型也列出来）</td></tr><tr><td>启用重排</td><td>开</td><td>它是下面两行的总开关：检索先向量召回候选，再用 rerank 重排</td></tr><tr><td>重排走 Jev</td><td>关</td><td>开了走云端判定通道，本地重排行随之隐藏</td></tr><tr><td>重排模型</td><td>空</td><td>留空回落内置 Qwen3-Reranker-4B；<strong>本地重排只在嵌入模型是 <code>qwen3-embedding:8b</code> 时生效</strong></td></tr></tbody></table>\n<h3>JEV（判定通道）</h3>\n<table><thead><tr><th>设置</th><th>默认</th><th>说明</th></tr></thead><tbody><tr><td>Jev 服务商</td><td><code>typesafe</code></td><td>Typesafe 与博查两家</td></tr><tr><td>Jev 密钥</td><td>空</td><td>按服务商分存；填上才接管判定</td></tr><tr><td>Jev 模型</td><td>空</td><td>留空跟随该家缺省（Typesafe → <code>jev-latest</code>，博查 → <code>bocha-jev-v1</code>）</td></tr></tbody></table>\n<h3>语音转写</h3>\n<table><thead><tr><th>设置</th><th>默认</th><th>说明</th></tr></thead><tbody><tr><td>转写引擎</td><td><code>sensevoice</code></td><td>SenseVoice-Small（funasr，中文更好）或 faster-whisper</td></tr><tr><td>Whisper 档位</td><td><code>small</code></td><td>只有选 faster-whisper 时才出现</td></tr></tbody></table>\n<p>两者都靠外部 Python 执行（路径键 <code>knowledgePythonPath</code>，不再从面板暴露）；缺包会整批失败并在提示里点名缺哪个。</p>\n<h3>数据源凭据</h3>\n<table><thead><tr><th>设置</th><th>默认</th><th>说明</th></tr></thead><tbody><tr><td>ApiZero Key</td><td>空</td><td>影院补评分/导演/主演/类型/地区/片长；留空交内置演职员兜底</td></tr><tr><td>B站 Cookie</td><td>空</td><td>录入 B 站视频解析可用清晰度；桌面端可「从 CLI 导入」（读本机 <code>~/.bilibili-cookies.json</code>）</td></tr><tr><td>豆瓣 Cookie</td><td>空</td><td>豆瓣被风控后继续检索用；拦截会以通知与表单提示报出来</td></tr></tbody></table>\n<h2>全部设置项</h2>\n<blockquote>下表按面板里的出现顺序排列；「类型」对应控件形态。</blockquote>\n<table><thead><tr><th>设置名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>AI 服务商</td><td>select</td><td>deepseek</td><td>当前使用的 AI 服务商。切换不影响已填内容：密钥、模型名、最大输出 token、思考档位都按服务商分别存储</td></tr><tr><td>DeepSeek 密钥</td><td>secret</td><td>空</td><td>DeepSeek 官方的接口密钥（行名随服务商注册表生成）</td></tr><tr><td>智谱 Plan 密钥</td><td>secret</td><td>空</td><td>智谱 Coding 套餐的接口密钥</td></tr><tr><td>Ollama 密钥</td><td>secret</td><td>空</td><td>本机 Ollama 一般不需要；填了会作为请求凭据带上</td></tr><tr><td>模型名称</td><td>text</td><td>空</td><td>生成用模型；留空回落该服务商默认模型</td></tr><tr><td>最大输出 token</td><td>number</td><td>空</td><td>请求里的 max_tokens，封顶值；解析链见上文</td></tr><tr><td>思考 reasoning</td><td>select</td><td>跟随</td><td>思考档位，随服务商换选项表</td></tr><tr><td>Ollama 本地 URL</td><td>text</td><td><code>http://localhost:11434</code></td><td>桌面端第二大脑连接的 Ollama 地址</td></tr><tr><td>Embedding 模型</td><td>text</td><td><code>bge-m3</code></td><td>向量化模型；换模型要重建索引</td></tr><tr><td>启用重排</td><td>toggle</td><td>开</td><td>召回后再精排</td></tr><tr><td>重排走 Jev</td><td>toggle</td><td>关</td><td>改用云端判定通道重排</td></tr><tr><td>重排模型</td><td>text</td><td>空</td><td>本地 rerank 模型；只在嵌入模型为 Qwen3-Embedding-8B 时出现/生效</td></tr><tr><td>Jev 服务商</td><td>select</td><td>typesafe</td><td>判定通道服务商</td></tr><tr><td>Jev 密钥</td><td>secret</td><td>空</td><td>判定通道密钥（按服务商分存）</td></tr><tr><td>Jev 模型</td><td>text</td><td>空</td><td>判定模型；留空跟随该家缺省</td></tr><tr><td>ApiZero Key</td><td>secret</td><td>空</td><td>影院字段来源密钥</td></tr><tr><td>B站 Cookie</td><td>secret</td><td>空</td><td>B 站清晰度凭据</td></tr><tr><td>豆瓣 Cookie</td><td>secret</td><td>空</td><td>豆瓣风控凭据</td></tr><tr><td>转写引擎</td><td>select</td><td>sensevoice</td><td>视频转文字引擎</td></tr><tr><td>Whisper 档位</td><td>select</td><td>small</td><td>仅 faster-whisper 时显示</td></tr></tbody></table>\n<blockquote>密钥与 Cookie 行都走掩码档位（密码框 + 眼睛切明文），凭据不会以明文长显在屏幕上。</blockquote>\n<h2>全部命令</h2>\n<p>这一域没有自己的命令。它的入口只有设置：自绘设置面板的「智能 → AI」页，以及插件自带的 ⚙️ 设置页里同一批键。</p>\n<h2>边界、限制与坑</h2>\n<ul>\n<li>各家配置分开存：切服务商不丢别家密钥，但面板上那几行的显示值会换成当前那家的。</li>\n<li>最大输出 token 只封顶、不是每次消耗；填得比模型官方档位大，服务端会以 400 拒绝整个请求。</li>\n<li>模型名与 Jev 模型都是自由文本，不做存在性校验——写错面板不拦，由服务端报错。</li>\n<li>「获取模型名 / 获取模型」在拉取期间切了服务商，这批结果作废、需要重取（会提示「服务商已切换，请重新获取」）。</li>\n<li>非 Ollama 通道缺密钥时，点「获取模型名」会直接失败并提示去哪填（提示里带该家密钥行名）。</li>\n<li>Ollama 本地地址：桌面端用它连本机；移动端读的是自动维护的远端键，手填 localhost 在手机上必然不通。</li>\n<li>转写引擎走外部 Python：缺包整批失败，提示会点名缺哪个包。</li>\n<li>换 Embedding 模型 = 换向量维度，旧索引全部作废（第二大脑下次打开自动全量重建）。</li>\n<li>本地重排有硬前提：嵌入模型必须是 <code>qwen3-embedding:8b</code>，否则重排通道判定为 off。</li>\n<li>密钥类型（secret）在数据文件里是明文的——它保护的是「屏幕上的可见性」，不是磁盘加密。真要保护，把库加密或把数据目录放到受控位置。</li>\n</ul>\n<h2>常见问题</h2>\n<p><strong>没填密钥会怎样？</strong></p>\n<p>依赖 AI 的功能会失败或降级：摘要不生成、画像不可用、关联判定回落、检索仍可用（检索只用嵌入模型，不需要 LLM 密钥）。</p>\n<p><strong>换服务商要重新填密钥吗？</strong></p>\n<p>不用。每家的密钥单独存着，切回来就是上次那份。</p>\n<p><strong>最大输出 token 该填多少？</strong></p>\n<p>留空最省心：插件按模型名取官方最大档。只有服务端明确报上限错误时，才考虑手填一个更小的值。</p>\n<p><strong>JEV 和生成通道有什么区别？</strong></p>\n<p>生成通道出文本（摘要、画像、对话）；JEV 只做判定（输入状态与类型化问题，输出类型化答案与校准概率），知识盒的关联判定走它。</p>\n<p><strong>B站 Cookie 从哪来？</strong></p>\n<p>浏览器登录 B 站后复制请求头里的 Cookie；桌面端可点「从 CLI 导入」读本机 <code>~/.bilibili-cookies.json</code>。移动端没有这个按钮。</p>\n<p><strong>「测试」按钮会花钱吗？</strong></p>\n<p>它发一次极小的真实请求，走的就是该服务商的正式接口，会产生极小的一次调用量。</p>\n<p><strong>本地 Ollama 需要密钥吗？</strong></p>\n<p>一般不需要。桌面端填地址即可；密钥行留空。</p>\n<p><strong>为什么移动端搜不到本机 Ollama？</strong></p>\n<p>移动设备访问不到你电脑的 localhost。要么填电脑的局域网地址（并在桌面端让远端键自动维护），要么移动端干脆不用嵌入类功能。</p>","no":12},{"id":"secondbrain","title":"第二大脑","group":"智能","tags":["ai","search"],"domain":"secondbrain","html":"<blockquote>给笔记建向量索引，按语义找相似内容、带到对话里</blockquote>\n<h2>什么时候用它</h2>\n<p>笔记多到自己都记不清哪篇写过什么时用它。它把笔记切块、算成向量存起来，于是你能：</p>\n<ul>\n<li>按<strong>意思</strong>找笔记（不必记得原话），看「跟这篇相似的有哪些」；</li>\n<li>开一个对话，让它带着检索到的材料回答，而不是凭空编；</li>\n</ul>\n<p>两个前提：<strong>装了 Ollama 并拉了模型</strong>（桌面端本地跑，或连局域网上那台机器），<strong>AI 通道配好</strong>（对话要用）。</p>\n<h2>数据放在哪</h2>\n<table><thead><tr><th>文件</th><th>位置</th><th>里面是什么</th></tr></thead><tbody><tr><td><code>secondbrain.json</code></td><td>数据存储路径</td><td>索引元数据（哪些文件、切块、修改时间等）与关联队列</td></tr><tr><td><code>secondbrain.vec</code></td><td>数据存储路径</td><td>向量本体，<strong>二进制</strong>：开头是维度头（uint32 小端），后面是 float32 平铺数据。打不开看，也不该手动编辑</td></tr><tr><td><code>../CONFIG/STORAGE/</code> 以外</td><td>—</td><td>本域不往库里另写笔记</td></tr></tbody></table>\n<p>旧版本遗留的向量文件名 <code>secondbrain_vectors.vec</code> 会在加载时自动改名为 <code>secondbrain.vec</code>（<code>src/secondbrain/store-file.ts:131</code>）。</p>\n<h2>面板怎么用</h2>\n<p>面板分三块（左导航切换，命令都能直达）：</p>\n<h3>参考（<code>bz-secondbrain-open</code>）</h3>\n<ol>\n<li>打开面板，在检索框里输入你想找的东西（凭意思就行）。</li>\n<li>停一下（300ms 防抖）它会自己搜（<code>src/secondbrain/config.ts:31</code>）。</li>\n<li>出来的每条结果旁边列出近邻相似的笔记，点一条直接跳过去。</li>\n<li>结果数量由「参考结果数 TopK」决定，先按它召回一批候选，再交给 rerank 重新排序。</li>\n</ol>\n<h3>对话（<code>bz-secondbrain-chat</code>）</h3>\n<ol>\n<li>输入问题，插件先检索（条数 = 「对话参考结果数」），把命中的片段连同最近若干轮历史一起送给模型。</li>\n<li>保留多少轮由「最大历史记录」决定（默认 10，<code>src/secondbrain/config.ts:102</code>）。</li>\n<li>回答里能点到引用的原笔记。</li>\n</ol>\n<h3>主面板与索引（<code>bz-secondbrain-panel</code>）</h3>\n<p>面板底部是索引状态与「全量重建」入口。重建要先确认（<code>src/secondbrain/index.ts:234</code>），确认后面板切成进度视图，边跑边显示。</p>\n<p>此外「本周知识动态」（<code>bz-secondbrain-weekly</code>）是一份按周汇总的动态报告。</p>\n<h2>全部设置项</h2>\n<h3>外观</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>面板布局</td><td><code>secondbrainSkin</code></td><td>卡片选择</td><td>default</td><td>切换面板布局（当前只有「对话」一种）</td></tr><tr><td>面板主题</td><td><code>secondbrainSkinTheme</code></td><td>卡片选择</td><td>graphite</td><td>切换面板主题（当前只有「石墨」一种）</td></tr></tbody></table>\n<h3>服务</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>额外检索目录</td><td><code>secondBrainAllowPaths</code></td><td>路径（多值）</td><td>空</td><td>三个盒子之外还要纳入检索的目录，可多选；存储成英文逗号分隔的路径串。<strong>目录前缀语义</strong>：勾了祖先目录就等于勾了它底下全部子目录。留空 = 只检索三个盒子（<code>src/secondbrain/whitelist.ts:44</code>）</td></tr></tbody></table>\n<p>原先这组里的「Ollama 本地 URL」「Embedding 模型」「本机局域网 IP」等行已经<strong>迁到 AI 面板</strong>（<code>src/secondbrain/panel.ts:688</code> 注释：issue 422/423/424）；「启用」开关也已删除 —— 第二大脑启动即自动加载，没有总开关。</p>\n<h3>检索</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>参考结果数 TopK</td><td><code>secondBrainTopK</code></td><td>数字</td><td>20</td><td>参考侧每次从向量库召回的近邻条数（1–50）。它是<strong>重排之前</strong>的召回量：先按这个数捞候选，再交给 rerank 重排</td></tr><tr><td>对话参考结果数</td><td><code>secondBrainChatTopK</code></td><td>数字</td><td>20</td><td>对话时注入上下文的参考条数（1–50）。与上一行<strong>各自独立召回、互不钳制</strong>，也不共用候选池</td></tr></tbody></table>\n<p>段落最小长度、上下文限制、防抖延迟、光标轮询四行已删除：前两者不再限制（切块全留），后两者固化成常量（防抖 300ms、光标轮询 500ms，<code>src/secondbrain/config.ts:31</code>）。</p>\n<h3>对话</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>最大历史记录</td><td><code>secondBrainMaxHistory</code></td><td>数字</td><td>10</td><td>对话保留的历史轮数上限（1–200）；超出后从最早的开始丢</td></tr></tbody></table>\n<h2>全部命令</h2>\n<table><thead><tr><th>命令</th><th>名称</th><th>做什么</th><th>前置条件</th></tr></thead><tbody><tr><td><code>bz-secondbrain-panel</code></td><td>第二大脑面板</td><td>打开主面板（索引状态 + 全量重建入口）</td><td>装了 Ollama</td></tr><tr><td><code>bz-secondbrain-open</code></td><td>第二大脑参考</td><td>打开参考检索面板</td><td>同上</td></tr><tr><td><code>bz-secondbrain-chat</code></td><td>第二大脑对话</td><td>打开对话面板</td><td>同上 + AI 通道配好</td></tr><tr><td><code>bz-secondbrain-rebuild-index</code></td><td>重建索引</td><td><strong>先弹确认框</strong>，确认后重头算全部向量</td><td>同上；笔记多会比较久</td></tr><tr><td><code>bz-secondbrain-weekly</code></td><td>本周知识动态</td><td>打开按周汇总的知识动态</td><td>有索引内容</td></tr></tbody></table>\n<h2>索引是怎么建起来的</h2>\n<p><strong>谁进索引</strong></p>\n<p>三个盒子恒在内：<strong>文献盒、卡片盒、主题盒</strong>（默认名，可在「知识盒」章里改；解析单源 = <code>src/core/knowledge-boxes.ts:21</code>）。「额外检索目录」是在这三盒之外再加范围。</p>\n<p><strong>什么时候更新</strong></p>\n<ul>\n<li>日常新增/修改笔记走<strong>增量</strong>：只处理变化的部分，不用整库重来。</li>\n<li>加了新的「额外检索目录」，会在<strong>下一轮增量</strong>时进库；把目录从名单里摘掉，<strong>它已经建好的向量不会立刻清掉</strong>（<code>src/secondbrain/panel.ts:698</code> 的说明）。</li>\n<li>下面三种情况必须<strong>全量重建</strong>：</li>\n</ul>\n<ol>\n<li>换了 Embedding 模型 —— 向量维度与含义都变了，旧向量不可用（<code>src/secondbrain/vector-store.ts:142</code>）；</li>\n<li>索引格式版本升级（旧库版本不符 → 加载时清空，下次全量重嵌）；</li>\n<li>元数据里有条目但向量文件丢了 —— 视为全量重建自愈（<code>src/secondbrain/vector-store.ts:16</code>）。</li>\n</ol>\n<p><strong>重建中途被打断怎么办</strong></p>\n<p>不会白干。重建期间按「距上次暂存 ≥5 秒且新完成 ≥200 块」双阈值周期性把已完成部分落盘（<code>src/secondbrain/vector-store.ts:56</code>）；关面板、重启 Obsidian、Ollama 中途失联之后再打开，会从已暂存进度接着嵌（<code>src/secondbrain/vector-store.ts:23</code>）。所以重建期间关掉窗口是安全的。</p>\n<p><strong>自动关联（谁跟谁相关）</strong></p>\n<p>第二大脑里还有一条关联管线：在三盒范围内做向量近邻 → 交给 AI 裁判是否真的相关 → 只在一侧写入 <code>related</code>（<code>src/secondbrain/link-agent/pipeline.ts:2</code>）。Ollama 不可达时任务会先入队，服务恢复后再消费；存量补齐在启动时扫一遍缺 <code>related</code> 的笔记。这条通道的开与关在「知识盒」的「自动关联」设置里，改完要重载插件。</p>\n<h2>边界、限制与坑</h2>\n<ul>\n<li><strong>必须有 Ollama</strong>：第二大脑的检索与对话都依赖本机（或局域网上）的 Ollama 服务；服务不在，重建和检索都起不来。</li>\n<li><strong>换 Embedding 模型 = 重建</strong>：不是可选优化，是必须动作 —— 换了模型旧向量就是垃圾。</li>\n<li><strong>「重排」有硬前提</strong>：本地重排只对 <code>qwen3-embedding:8b</code> 这个嵌入模型有用；嵌入模型不是它时，重排开着也不生效（详见 AI 章）。</li>\n<li><strong>两个 TopK 不互相钳制</strong>：参考侧与对话侧各召回各的，调大对话侧不会把参考侧的条数也带上去。</li>\n<li><strong>摘掉额外目录不清向量</strong>：想让那些向量消失得靠全量重建。</li>\n<li><strong><code>.vec</code> 是二进制</strong>：别用手改；要用别的方式排查请走「数据体检」。</li>\n<li><strong>移动端能力降级</strong>：移动端向量检索走「远程 → TF-IDF → 纯文本」三级降级（<code>src/secondbrain/vector-store.ts:11</code>），精确度不如桌面端；远程地址由插件按本机局域网 IP 自动维护，不用手动填。</li>\n<li>外观两行目前各只有一个选项，等于还没有可切换的皮肤。</li>\n</ul>\n<h2>常见问题</h2>\n<p><strong>搜不到我刚写的笔记？</strong></p>\n<p>它可能还没进索引（增量有延迟），或者不在三个盒子里、也没加进「额外检索目录」。确认在范围内后，等下一轮增量或手动触发重建。</p>\n<p><strong>为什么重排好像没起作用？</strong></p>\n<p>先看嵌入模型是不是 <code>qwen3-embedding:8b</code> —— 不是它的话本地重排不生效，这是设计上的限制。</p>\n<p><strong>重建要多久？</strong></p>\n<p>看笔记量。中途可以关窗口，下次接着来，不会从零开始。</p>\n<p><strong>换电脑后索引还能用吗？</strong></p>\n<p><code>secondbrain.vec</code> 是二进制，跟着库复制过去即可；如果换过嵌入模型，复制过去也会触发重建。</p>\n<p><strong>对话答得不准怎么办？</strong></p>\n<p>先把「对话参考结果数」调大（给模型更多材料），或者把「额外检索目录」补上 —— 材料不足是最常见的原因。</p>\n<p><strong>它和我手动写的 <code>[[双链]]</code> 冲突吗？</strong></p>\n<p>不冲突。自动关联只往笔记的 <code>related</code> 字段里加它在三盒内找到的实质关联，已经存在的链不会重复加（<code>src/secondbrain/link-agent/pipeline.ts:11</code>）。</p>","no":13},{"id":"belongings","title":"归物本","group":"记录","tags":["record","belongings"],"domain":"belongings","html":"<blockquote>记录你买过、用过、卖过、丢过的每一件东西。</blockquote>\n<h2>什么时候用它</h2>\n<p>归物本用来登记你拥有的实体物品（或任何值得记账的东西），并追踪它们从「购入」到「在库」再到「转卖 / 丢弃」的完整生命周期。适合这些场景：</p>\n<ul>\n<li>想记清楚某件东西花了多少钱、哪天买的、现在算下来「每天成本」多高。</li>\n<li>想看一年里在哪些分类上花钱最多、哪些东西陪你最久。</li>\n<li>卖出或处理掉东西时，留下出离日期和转卖售价，便于回本统计。</li>\n</ul>\n<p>数据全部存在本地 JSON 文件，不上传、不联网（联网的「AI 归类」仅按名称向模型请求分类建议，失败也不影响手填）（<code>src/belongings/ui.ts:1074</code>）。</p>\n<h2>数据放在哪</h2>\n<p>数据文件位于仓库的 <code>CONFIG/STORAGE/belongings.json</code>（默认路径；具体目录由设置里的「共享 JSON 数据目录」决定，可配置）（<code>src/belongings/data.ts:13</code>、<code>src/core/storage.ts:37</code>）。</p>\n<p>落盘时只写三段：<code>version</code>、<code>last_updated</code>、<code>items</code>。<code>categories</code> 和 <code>categoryIcons</code> 是<strong>读取时从 items 内存派生</strong>的，不会写进磁盘，手动改这两个字段无效（<code>src/belongings/data.ts:87</code>）。</p>\n<p>每条物品（<code>items</code> 里的一行）字段如下：</p>\n<table><thead><tr><th>字段</th><th>含义</th><th>类型 / 取值</th><th>必填</th></tr></thead><tbody><tr><td><code>id</code></td><td>条目唯一 ID</td><td>字符串，形如 <code>item_&lt;时间戳&gt;_&lt;随机&gt;</code></td><td>自动生成</td></tr><tr><td><code>name</code></td><td>物品名称</td><td>字符串</td><td>是</td></tr><tr><td><code>category</code></td><td>分类名（纯文字，emoji 前缀已退役）</td><td>字符串</td><td>是</td></tr><tr><td><code>icon</code></td><td>分类图标（lucide 图标名）</td><td>字符串或 <code>null</code>，可选</td><td>否</td></tr><tr><td><code>purchase_price</code></td><td>购买价格（入库金额）</td><td>数字，最多两位小数</td><td>是</td></tr><tr><td><code>purchase_date</code></td><td>购买日期</td><td>字符串 <code>'YYYY-MM-DD'</code></td><td>是</td></tr><tr><td><code>current_status</code></td><td>当前状态</td><td><code>使用中</code> / <code>闲置</code> / <code>已转卖</code> / <code>已丢弃</code></td><td>是</td></tr><tr><td><code>description</code></td><td>描述 / 备注</td><td>字符串</td><td>否</td></tr><tr><td><code>created_date</code></td><td>录入时间</td><td>ISO 时间串</td><td>自动</td></tr><tr><td><code>last_updated</code></td><td>最后更新时间</td><td>ISO 时间串</td><td>自动</td></tr><tr><td><code>exit_date</code></td><td>出离日期（转卖 / 丢弃当天）</td><td>字符串 <code>'YYYY-MM-DD'</code> 或 <code>null</code>，可选</td><td>仅出离态填写</td></tr><tr><td><code>sold_price</code></td><td>转卖售价</td><td>数字或 <code>null</code>，可选</td><td>仅「已转卖」填写</td></tr></tbody></table>\n<p>说明：</p>\n<ul>\n<li>状态值用的是中文标签（<code>使用中</code> 等），不是英文 key（<code>src/belongings/shared.ts:49</code>）。手动改 JSON 时若写成别的值，会破坏「出离态」判定逻辑（<code>src/belongings/shared.ts:154</code>）。</li>\n<li><code>exit_date</code> 仅在状态为「已转卖 / 已丢弃」时才有意义；一旦转回在库状态会被清空（<code>src/belongings/ui.ts:1159</code>）。</li>\n<li><code>sold_price</code> 仅在「已转卖」时有意义；「已丢弃」或任何在库状态都不会保存售价（<code>src/belongings/ui.ts:1162</code>）。</li>\n<li><code>purchase_price</code> 保存时会被四舍五入到两位小数（<code>src/belongings/ui.ts:1155</code>）。</li>\n</ul>\n<h2>面板怎么用</h2>\n<p>打开方式：命令面板运行「归物本」（或点面板里的入口）。面板是一个覆盖层，结构为：海报头（标题 = 当前筛选名）→ KPI 行 → 状态筛选 chips → 工具行（搜索 / 年份 / 排序 / 记一笔）→ 物品网格。</p>\n<h3>顶部 KPI 行</h3>\n<ul>\n<li>在库件数（使用中 + 闲置的条目数，可点击切换「资产」筛选）</li>\n<li>在库投入（在库条目原价合计）</li>\n<li>日均成本（口径见下「边界」）</li>\n<li>已离场·回收（已转卖 / 已丢弃数量，及转卖回血合计）</li>\n</ul>\n<p>（KPI 文案与口径见 <code>src/belongings/ui.ts:8</code>、<code>src/belongings/shared.ts:223</code>）</p>\n<h3>状态筛选 chips</h3>\n<p>「全部 / 资产（在库合成）/ 使用中 / 闲置 / 已转卖 / 已丢弃」，每条带计数。再点当前选中的 chip = 取消筛选回到全部（<code>src/belongings/ui.ts:641</code>）。</p>\n<h3>工具行</h3>\n<ul>\n<li><strong>搜索</strong>：匹配名称、分类、描述（不区分大小写），输入 180ms 防抖；框尾 <code>✕</code> 一键清词（<code>src/belongings/ui.ts:424</code>、<code>src/belongings/shared.ts:254</code>）。</li>\n<li><strong>年份</strong>：按 <code>purchase_date</code> 的年份前缀过滤；可选「全部」（<code>src/belongings/shared.ts:253</code>）。</li>\n<li><strong>排序</strong>：三档（<code>src/belongings/shared.ts:65</code>）</li>\n<li>最近购入（默认，按购买日期倒序）</li>\n<li>投入最高（按原价倒序）</li>\n<li>日均最高（按单件日均成本倒序）</li>\n<li><strong>记一笔</strong>：直接弹出新增表单。</li>\n</ul>\n<h3>看 / 改一条物品</h3>\n<ul>\n<li><strong>桌面</strong>：点卡片 = 详情弹窗，显示全部字段 + 四态流转条 + 「编辑 / 删除」按钮（点遮罩或 ESC 关）（<code>src/belongings/ui.ts:681</code>）。</li>\n<li><strong>桌面右键卡片</strong> / <strong>移动端长按卡片</strong> = 操作菜单，含「标记为某状态（四态流转）/ 编辑 / 删除」（桌面右键；移动端走底部抽屉）（<code>src/belongings/ui.ts:483</code>、<code>src/belongings/ui.ts:841</code>）。</li>\n<li><strong>移动端</strong>：点卡片 = 底部抽屉，信息同上（<code>src/belongings/ui.ts:468</code>）。</li>\n</ul>\n<h3>
