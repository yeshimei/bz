<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>包仔（bz）使用手册</title>
<style>
:root{--sp-bg:#f6f2e9;--sp-panel:#fffcf6;--sp-line:#e5dfcf;--sp-line-soft:#f2eee1;--sp-ink:#2c2924;
--sp-ink-2:#7a7466;--sp-ink-3:#aca595;--sp-accent:#c95a28;--sp-accent-soft:#f7e8dd;--sp-on-accent:#fff;
--sp-radius:12px;--sp-pop:#fff;--sp-pop-shadow:0 4px 16px rgba(90,70,40,.14);--sp-code:#f7f3ea;}
.theme-dark{--sp-bg:#1b1b1f;--sp-panel:#242429;--sp-line:#35353c;--sp-line-soft:#2c2c32;--sp-ink:#e8e8ec;
--sp-ink-2:#a2a2ac;--sp-ink-3:#6a6a74;--sp-accent:#eda75c;--sp-accent-soft:rgba(237,167,92,.14);
--sp-on-accent:#1b1b1f;--sp-pop:#2e2e35;--sp-pop-shadow:0 8px 24px rgba(0,0,0,.38);--sp-code:#1f1f24;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--sp-bg);color:var(--sp-ink);font:14px/1.6 system-ui,'Segoe UI','Microsoft YaHei',sans-serif}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
.bk{display:flex;flex-direction:column;height:100%}
.bk-bar{flex:none;display:flex;align-items:center;gap:12px;height:54px;padding:0 18px;background:var(--sp-panel);
border-bottom:1px solid var(--sp-line)}
.bk-title{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.bk-title svg{width:17px;height:17px;color:var(--sp-accent)}
/* ☰ 目录抽屉开关：仅移动端出现（桌面目录常驻，不需要开关） */
.bk-menu{display:none;flex:none;align-items:center;justify-content:center;
width:40px;height:40px;margin-right:2px;border:0;background:none;color:var(--sp-ink-2);
cursor:pointer}
.bk-menu:active{color:var(--sp-ink)}
.bk-spacer{flex:1}
.bk-search{display:flex;align-items:center;gap:7px;height:32px;padding:0 10px;background:var(--sp-panel);
border:1px solid var(--sp-line);border-radius:9px;min-width:260px}
.bk-search:focus-within{border-color:var(--sp-accent)}
.bk-search svg{width:14px;height:14px;stroke:var(--sp-ink-3);flex:none}
.bk-search input{flex:1;border:0;background:none;outline:none;font:inherit;font-size:12.5px;color:var(--sp-ink)}
.bk-body{flex:1;display:flex;min-height:0}
.bk-toc{width:178px;flex:none;overflow-y:auto;padding:12px 8px 30px;background:var(--sp-panel);
border-right:1px solid var(--sp-line)}
.bk-sec{font-size:10px;letter-spacing:.09em;color:var(--sp-ink-3);font-weight:600;padding:11px 7px 4px}
.bk-item{width:100%;display:flex;align-items:center;gap:7px;padding:5px 7px;border:0;border-radius:8px;
background:none;font:inherit;font-size:12px;color:var(--sp-ink);cursor:pointer;text-align:left}
.bk-item:hover{background:var(--sp-accent-soft)}
.bk-item.on{background:var(--sp-accent);color:var(--sp-on-accent)}
.bk-item.on .n{color:inherit;opacity:.8}
.bk-main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--sp-bg)}
.bk-prog{height:2px;flex:none;background:var(--sp-line-soft)}
.bk-prog i{display:block;height:100%;width:0;background:var(--sp-accent)}
.bk-page{flex:1;overflow-y:auto;padding:34px 46px 70px}
.bk-page h1{font-size:27px;margin:0 0 10px}
.bk-page h2{font-size:17px;margin:28px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--sp-line)}
.bk-page h3{font-size:14.5px;margin:22px 0 8px}
.bk-page h4{font-size:13px;margin:16px 0 6px;color:var(--sp-ink-2)}
.bk-page p{margin:0 0 10px;max-width:78ch}
.bk-page ul,.bk-page ol{margin:0 0 12px 22px;max-width:78ch}
.bk-page li{margin-bottom:5px}
.bk-page blockquote{margin:0 0 12px;padding:8px 12px;border-left:3px solid var(--sp-accent);
background:var(--sp-accent-soft);border-radius:0 8px 8px 0;max-width:78ch;color:var(--sp-ink)}
.bk-page table{border-collapse:collapse;width:100%;margin:0 0 14px;font-size:12.5px;display:block;overflow-x:auto}
.bk-page th,.bk-page td{border:1px solid var(--sp-line);padding:6px 9px;text-align:left;vertical-align:top}
.bk-page th{background:var(--sp-panel);font-weight:600;white-space:nowrap}
.bk-page td{max-width:46ch}
.bk-page code{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:var(--sp-code);
padding:1px 5px;border-radius:5px;color:var(--sp-accent)}
.bk-page pre.code{background:var(--sp-code);border:1px solid var(--sp-line);border-radius:10px;padding:11px 13px;
overflow-x:auto;margin:0 0 14px}
.bk-page pre.code code{background:none;padding:0;color:var(--sp-ink);font-size:12px}
.bk-page a{color:var(--sp-accent)}
.bk-page mark{background:var(--sp-accent-soft);color:var(--sp-accent);border-radius:3px;padding:0 2px}
.shot{margin:0 0 16px}
.shot-ph{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:26px 16px;
border:1px dashed var(--sp-line);border-radius:12px;background:var(--sp-panel);color:var(--sp-ink-3);font-size:12px}
.shot-ph a{color:var(--sp-accent);text-decoration:none}
.shot figcaption{margin-top:6px;font-size:11.5px;color:var(--sp-ink-3)}
.shot img{display:block;width:100%;height:auto;border:1px solid var(--sp-line);border-radius:10px}
.shot figcaption a{color:var(--sp-accent);text-decoration:none}
.bk-hits{padding:0 6px 8px}
.bk-hit{width:100%;text-align:left;border:0;background:none;font:inherit;font-size:12px;color:var(--sp-ink);
padding:6px 8px;border-radius:8px;cursor:pointer}
.bk-hit:hover{background:var(--sp-accent-soft)}
.bk-hit .where{color:var(--sp-ink-3);font-size:11px}
.bk-foot{padding:26px 0 0;color:var(--sp-ink-3);font-size:11.5px;border-top:1px solid var(--sp-line);margin-top:26px}
/* 移动端（≤768px）：外壳已占掉 44px 避让带，顶栏压到 46px 与之叠成一条头；
   目录收窄、正文留白收窄、表格不再撑出横向滚动条 */
@media (max-width:768px){
  /* 标准移动端文档布局（用户 2026-09-26 拍板）：
     顶栏 = ☰(目录抽屉) + 标题 + ✕(外壳给，占末格) 三格同行；
     侧栏目录收成左侧抽屉，点 ☰ 滑出、点遮罩/条目收回；正文独占整宽。 */
  .bk-bar{height:46px;padding:0 48px 0 10px;gap:0}
  .bk-title{flex:1;min-width:0;font-size:14px}
  .bk-title svg{width:16px;height:16px}
  /* 搜索框在手机上降为第二行（塞进 46px 顶栏会只剩几十像素可用，纯摆设） */
  .bk-search{order:9;flex-basis:100%;min-width:0;height:30px;margin:0 0 8px}
  .bk-bar{flex-wrap:wrap;height:auto;padding-bottom:0}
  .bk-bar::after{content:'';flex-basis:100%;height:0}
  .bk-menu{display:flex}
  .bk-body{position:relative;flex:1;min-height:0}
  /* 目录抽屉：桌面是常驻窄栏，移动端从左侧滑出盖在正文上 */
  .bk-toc{position:absolute;inset:0 auto 0 0;z-index:4;width:min(76vw,280px);
    flex:none;overflow-y:auto;padding:12px 8px 30px;
    border-right:1px solid var(--sp-line);background:var(--sp-panel);
    box-shadow:8px 0 24px rgba(0,0,0,.16);
    transform:translateX(-102%);transition:transform .2s ease}
  body.toc-open .bk-toc{transform:none}
  /* 抽屉展开时的遮罩：点它收回（toc-scrim 由 JS 注入到 .bk-body 首位） */
  .bk-scrim{position:absolute;inset:0;z-index:3;background:rgba(0,0,0,.28);
    opacity:0;pointer-events:none;transition:opacity .2s ease}
  body.toc-open .bk-scrim{opacity:1;pointer-events:auto}
  .bk-main{flex:1;min-height:0}
  .bk-page{padding:16px 14px 48px}
  .bk-page h1{font-size:21px;margin:0 0 8px}
  .bk-page h2{font-size:16px;margin:20px 0 8px}
  .bk-page h3{font-size:14px}
  .bk-page p,.bk-page ul,.bk-page ol{max-width:none}
  .bk-page table{font-size:12px}
  /* 目录条目在抽屉里回到纵列（桌面的窄栏形态），点击热区放大到触摸档 */
  .bk-item{padding:9px 10px;font-size:13px}
}
@media print{.bk-toc,.bk-bar{display:none}.bk-page{overflow:visible;height:auto}}
</style>
</head>
<body>
<div class="bk">
  <div class="bk-bar">
    <button class="bk-menu" id="menu" type="button" aria-label="目录">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round"><path d="M3 6h18"/><path d="M3 12h18"/><path d="M3 18h18"/></svg></button>
    <div class="bk-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
      stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
      <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      使用手册</div>
    <span class="bk-spacer"></span>
    <div class="bk-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="q" placeholder="搜章节、命令、设置、症状…" autocomplete="off"></div>
  </div>
  <div class="bk-body">
    <div class="bk-scrim" id="scrim"></div>
    <aside class="bk-toc" id="toc"></aside>
    <main class="bk-main">
      <div class="bk-prog"><i id="prog"></i></div>
      <div class="bk-page" id="page"></div>
    </main>
  </div>
</div>
<script>
const CHAPTERS = [{"id":"overview","title":"包仔是什么","group":"开始","tags":["getting-started"],"domain":"","html":"<p>包仔是一个跑在 Obsidian 里的插件。它不改变你的笔记——你的笔记还是普通的 Markdown 文件，想用别的软件打开、想删掉包仔，随时都行。</p>\n<p>它做的事是：<strong>在你现有的库上，长出一层好用的工具</strong>。记录、收集、阅读、复习、加密，这些原本要自己想办法的事，它给做成了现成的功能。</p>\n<blockquote>一句话：<strong>你的库还是你的库，包仔是长在库上的一层工具。</strong></blockquote>\n<h2>它能帮你做什么</h2>\n<p>不用一次全学会，挑你现在需要的那件就行：</p>\n<table><thead><tr><th>你想做的事</th><th>用哪个</th></tr></thead><tbody><tr><td>随手记一笔今天发生了什么，往后按时间往回翻</td><td><strong>日记本</strong></td></tr><tr><td>临时存一条想法、一条链接，回头再整理</td><td><strong>备忘录</strong>／<strong>收藏本</strong></td></tr><tr><td>看到好文章先存下来，有空再读</td><td><strong>剪藏本</strong></td></tr><tr><td>记下看过的电影、读过的书、玩过的游戏，攒成一面墙</td><td><strong>影院</strong>／<strong>书库</strong>／<strong>游戏库</strong></td></tr><tr><td>记的东西太多，想不起来放哪了</td><td><strong>第二大脑</strong>（按意思搜你的笔记）</td></tr><tr><td>有些东西想背下来、想定期复习</td><td><strong>复习计划</strong></td></tr><tr><td>有真正不想被别人看到的内容</td><td><strong>保险库</strong>／<strong>密码本</strong></td></tr><tr><td>想记住某个人、某段关系里的细节</td><td><strong>脸谱</strong></td></tr><tr><td>需要专注一段时间、不想被打断</td><td><strong>番茄钟</strong></td></tr><tr><td>想有个住在库里、能聊天的陪伴角色</td><td><strong>小橘</strong></td></tr></tbody></table>\n<p>一共 25 个这样的功能，每个管一件事。它们各自独立——你可以只用一个，也可以让它们互相配合（比如在影院记了一条影评，日记本的时间墙上会自动多出这一条）。</p>\n<h2>它由什么组成</h2>\n<table><thead><tr><th>层面</th><th>数量</th><th>说明</th></tr></thead><tbody><tr><td>功能域</td><td>25</td><td>每个域管一件事（日记、备忘录、脸谱、影院、复习计划…）</td></tr><tr><td>命令</td><td>72</td><td>命令面板里搜中文名就能找到，也能绑快捷键</td></tr><tr><td>数据文件</td><td>19 个共享文件 + 若干目录</td><td>都是明文 JSON / Markdown，你随时能打开看、能自己备份</td></tr></tbody></table>\n<p><strong>关于数据</strong>：包仔把你记的内容存在普通的 JSON 和 Markdown 文件里，不加密、不锁格式、不传任何服务器。你能直接打开看，也能自己复制走。</p>\n<h2>你需要什么</h2>\n<ul>\n<li><strong>Obsidian</strong>（桌面端或移动端都行；个别功能两端有差异，各域章节里会写明）</li>\n<li><strong>想用 AI 功能时再配一条通道</strong>：比如让包仔帮你写摘要、按意思找笔记、跟小橘聊天——这些需要在设置里选一个服务商并填上密钥（DeepSeek、智谱或你本机跑的 Ollama，任选其一）。<strong>不配也能用</strong>，只是 AI 相关的功能用不了。</li>\n<li><strong>想用知识盒的视频转文字</strong>：另外需要一个能用的 Python 环境。</li>\n</ul>\n<h2>三分钟上手</h2>\n<ol>\n<li><strong>打开设置面板</strong>：按 <code>Ctrl/Cmd + P</code> 调出命令面板，搜「设置面板」。左边列出全部域，按用途分好组了。</li>\n<li><strong>确认数据放哪</strong>：进「通用」→ 看「数据存储路径」。默认在你的库里，所有数据都写这儿。想换位置也能改。</li>\n<li><strong>配 AI 通道</strong>（只有想用 AI 功能才需要）：进「AI」→ 选服务商、填密钥。模型名留空就用该服务商默认的。</li>\n<li><strong>挑一件事试试</strong>：命令面板搜「写日记」，写下第一篇；或搜「加收藏」，存一条链接。</li>\n<li><strong>想找东西时</strong>：命令面板搜「第二大脑参考」，用大白话描述你要找的内容（需要先配好 AI）。</li>\n</ol>\n<h2>遇到问题先做两件事</h2>\n<ol>\n<li><strong>命令面板搜「数据体检」</strong>：它只读扫一遍你的全部数据文件，告诉你缺了什么、坏了什么、有没有没人认领的条目。不改动任何东西。</li>\n<li><strong>重载插件</strong>（把插件关掉再打开）：绝大多数「改了设置没生效」都是这个原因——很多功能是在插件启动时才准备好的。</li>\n</ol>\n<h2>本书怎么读</h2>\n<table><thead><tr><th>你的目的</th><th>去哪</th></tr></thead><tbody><tr><td>想先看看能干什么</td><td>往下读「界面与入口」，再挑感兴趣的域章节</td></tr><tr><td>已经知道要做什么</td><td>直接看对应域的章节，或看「照着做：工作流示例」</td></tr><tr><td>想查某条命令叫什么</td><td>看「参考：命令、设置与数据」</td></tr><tr><td>出问题了</td><td>看「排查：症状与处置」</td></tr><tr><td>想备份或换电脑</td><td>看「参考」章最后的「换电脑或备份时要带走哪些文件」</td></tr></tbody></table>\n<h2>术语表</h2>\n<table><thead><tr><th>词</th><th>含义</th></tr></thead><tbody><tr><td>域</td><td>一个功能模块（如「影院」「复习计划」）。每个域有自己的设置页、数据文件和命令</td></tr><tr><td>命令面板</td><td>Obsidian 的 <code>Ctrl/Cmd + P</code>；包仔的 72 条命令都在这里搜中文名就能找到</td></tr><tr><td>设置面板</td><td>包仔自己的设置界面（命令面板搜「设置面板」）；和插件 ⚙️ 设置页看的是同一份设置</td></tr><tr><td>数据存储路径</td><td>所有数据的根目录，默认在你的库里，可以改到别处</td></tr><tr><td>重载插件</td><td>关闭再启用插件（或重启 Obsidian）。不是「刷新界面」</td></tr><tr><td>笔记开头的信息区</td><td>Markdown 文件最上面 <code>---</code> 之间那几行，包仔在这里记日期、类型这类信息</td></tr><tr><td>前置条件</td><td>某个功能要先满足的条件（比如填了密钥、装了 Python 包、选好了目录）</td></tr></tbody></table>","no":1},{"id":"interface","title":"界面与入口","group":"开始","tags":["interface"],"domain":"","html":"<p>包仔没有自己的独立窗口：它活在 Obsidian 里，通过三个入口和你打交道。先认清这三个入口，后面所有章节都只是它们的细节。</p>\n<h2>三个入口</h2>\n<table><thead><tr><th>入口</th><th>怎么打开</th><th>适合干什么</th></tr></thead><tbody><tr><td>命令面板</td><td><code>Ctrl/Cmd + P</code>，搜命令名</td><td>做一件事（写日记、加影视、开始复习）</td></tr><tr><td>设置面板</td><td>命令面板搜「设置面板」</td><td>改配置；左侧按域列出全部设置页</td></tr><tr><td>域面板</td><td>各域自己的打开命令（如「影院」「书库」「第二大脑面板」）</td><td>浏览、检索、批量操作</td></tr></tbody></table>\n<p>72 条命令的名称与 id 全表见「参考：命令、设置与数据」；每个域用到哪些命令，见该域章节。</p>\n<h2>设置面板怎么用</h2>\n<ol>\n<li><strong>左侧导航</strong>：按语义分成七组——基础、智能、记录、收集、媒体与阅读、工具、安全；最后一节是本书入口。</li>\n<li><strong>顶部搜索</strong>：同时匹配域名、域描述和设置行名；搜到设置项会直接带你去那一行。</li>\n<li><strong>设置行</strong>：名称后面若有一条很淡的下划线，说明这行有详细说明——<strong>鼠标停在标题上会浮出说明</strong>（触屏点标题）。</li>\n<li><strong>改动即存</strong>：多数行改完立刻生效并落盘；少数行标注了「需重载插件」。</li>\n<li><strong>移动端</strong>：形态不同但功能一致——先是一个全屏的域列表，点进某个域推入该域设置页，左上角返回。</li>\n</ol>\n<blockquote>插件自带的 ⚙️ 设置页与自绘面板是<strong>同一份设置的两种界面</strong>：在任一处改动，另一处刷新后即同步。</blockquote>\n<h2>域面板长什么样</h2>\n<p>各域面板风格统一（同一套皮肤、同一套滚动手感），但内容布局按用途不同：</p>\n<table><thead><tr><th>形态</th><th>用在哪些域</th><th>特征</th></tr></thead><tbody><tr><td>列表 / 流</td><td>剪藏本、备忘录、收藏本</td><td>条目流，可筛选、可勾选</td></tr><tr><td>墙 / 网格</td><td>影院、书库、游戏库</td><td>海报 / 封面墙，点开条目详情</td></tr><tr><td>时间轴</td><td>日记本</td><td>按时间排布，点开一篇</td></tr><tr><td>检索台</td><td>第二大脑</td><td>输入框 + 结果列表 + 对话</td></tr><tr><td>任务盘</td><td>番茄钟、小橘</td><td>常驻的小面板，状态实时变化</td></tr><tr><td>弹窗式</td><td>保险库、密码本、脸谱数据源</td><td>打开时先解锁或先选数据</td></tr></tbody></table>\n<h2>通知</h2>\n<p>所有操作反馈走统一的通知系统：右下（或你配的位置）滑入，几秒后自动消失。级别、时长、位置、最大同时可见数在「通知」域配置。</p>\n<ul>\n<li>通知正文不带 emoji，语义靠图标区分。</li>\n<li>批量任务（如批量导入、批量补链）会合并成一条进度通知，不会刷屏。</li>\n<li>把级别调高会连「已保存」这类回执一起过滤掉——排查问题时记得调回来。</li>\n</ul>\n<h2>报告类入口</h2>\n<p>几个域会把统计聚合成报告：归物本年度报告、影视分析报告、剪藏阅读报告、游戏库数据统计、复习计划分析报告、记忆分析、阅读分析报告、小橘数据面板。它们都是只读视图，不改数据；数据源分别在各自域章节里写明。</p>\n<h2>键盘与触屏</h2>\n<table><thead><tr><th>场景</th><th>桌面</th><th>触屏</th></tr></thead><tbody><tr><td>打开面板</td><td>命令面板或绑快捷键</td><td>命令面板（移动端手势）</td></tr><tr><td>设置行说明</td><td>悬停标题出浮窗，点击可钉住</td><td>点标题开合</td></tr><tr><td>关闭浮层</td><td><code>Esc</code>、点外面、滚动</td><td>点外面</td></tr><tr><td>面板内移动</td><td>搜索框输入即过滤</td><td>全屏列表滚动</td></tr></tbody></table>\n<h2>一致性约定（读到这里你会更少踩坑）</h2>\n<ul>\n<li><strong>命令按中文名找就行</strong>：命令面板里搜中文名（「写日记」「影院」「数据体检」）就能找到；想绑快捷键，在 Obsidian 的快捷键设置里同样搜中文名。</li>\n<li><strong>数据位置固定</strong>：明文都在数据目录（默认在你的库里），密文在数据目录下的 <code>.ENCRYPT</code>（以点开头，Obsidian 侧栏里看不见），日记、影视这类正文就落在库内的普通目录（如 <code>我的/日记</code>、<code>我的/影视</code>）。</li>\n<li><strong>改完要重载插件的行</strong>：面板会在那一行给出提示；常见于换目录、改监听、换索引模型这类设置。看到提示就重载一次，别怀疑自己改错了。</li>\n</ul>","no":2},{"id":"configuration","title":"配置：数据、密钥与端差异","group":"进阶","tags":["config"],"domain":"","html":"<p>这一章讲「一次配好、之后少折腾」的几件事：数据放哪、密钥怎么填、加密怎么起、桌面与移动差在哪。</p>\n<h2>一、数据放哪</h2>\n<table><thead><tr><th>内容</th><th>位置</th><th>说明</th></tr></thead><tbody><tr><td>各域明文数据</td><td><code>&lt;数据存储路径&gt;/</code>（默认 <code>CONFIG/STORAGE/</code>）</td><td>一个域一份 JSON；<code>secondbrain.vec</code> 等是二进制</td></tr><tr><td>加密密文</td><td><code>&lt;数据存储路径&gt;/.ENCRYPT/</code></td><td>根目录固定跟着数据存储路径，不再单独配置</td></tr><tr><td>笔记类数据</td><td>vault 内目录</td><td>日记 <code>我的/日记</code>、影视 <code>我的/影视</code>、游戏 <code>我的/游戏</code>、书库 <code>书库</code>、剪藏归档 <code>归档/网页剪藏</code></td></tr><tr><td>外部数据</td><td>库外（可选）</td><td>例如脸谱的微信导出目录，放在库外可避免被同步</td></tr></tbody></table>\n<p><strong>换存储位置的正确顺序</strong>：</p>\n<ol>\n<li>关闭 Obsidian（或至少停用插件）。</li>\n<li>用文件管理器把旧目录<strong>整个</strong>移到新位置。</li>\n<li>打开插件，改「数据存储路径」。</li>\n<li>重载插件，再跑一次「数据体检」确认各域都读到了。</li>\n</ol>\n<blockquote>只改设置不搬文件 = 插件在新位置读不到数据，看起来像「数据全丢了」。</blockquote>\n<h2>二、AI 通道</h2>\n<p>包仔有三条通道，互不代替：</p>\n<table><thead><tr><th>通道</th><th>用途</th><th>在哪配</th></tr></thead><tbody><tr><td>生成通道（LLM）</td><td>摘要、人物画像、对话、转写后的整理</td><td>AI → LLM</td></tr><tr><td>嵌入通道（Embedding）</td><td>第二大脑与小橘的向量检索</td><td>AI → Embedding</td></tr><tr><td>判定通道（JEV）</td><td>知识盒的关联判定这类「判断题」</td><td>AI → JEV</td></tr></tbody></table>\n<p>每条通道可选的服务商：</p>\n<ul>\n<li><strong>LLM</strong>：DeepSeek、智谱 Plan、Ollama（本机或局域网）</li>\n<li><strong>JEV</strong>：Typesafe、博查</li>\n<li><strong>Embedding</strong>：走 Ollama 已安装的嵌入模型（如 bge-m3）</li>\n</ul>\n<p><strong>per-provider 分开存</strong>：密钥、模型名、最大输出 token、思考档位都是「每个服务商存一份」。切服务商不会丢别家的值，但面板上这几行会换成当前那家的。</p>\n<h3>填密钥的三种情况</h3>\n<table><thead><tr><th>情况</th><th>表现</th></tr></thead><tbody><tr><td>没填密钥</td><td>依赖它的功能失败或降级；插件不会偷偷换别家</td></tr><tr><td>密钥错</td><td>操作时报错（401 之类），错误会以通知给出</td></tr><tr><td>没填但用了 Ollama</td><td>本机放行，不需要密钥，只要地址通</td></tr></tbody></table>\n<h2>三、外部凭据（按需填）</h2>\n<table><thead><tr><th>凭据</th><th>关联功能</th><th>不填会怎样</th></tr></thead><tbody><tr><td>B站 Cookie</td><td>录入 B 站视频时解析可用清晰度</td><td>只能拿固定清晰度列表</td></tr><tr><td>豆瓣 Cookie</td><td>豆瓣搜索风控后继续检索</td><td>抓取失败；会有风控提示</td></tr><tr><td>ApiZero Key</td><td>影院补齐评分/导演/主演等字段</td><td>交内置演职员信息兜底，字段不全</td></tr></tbody></table>\n<p>桌面端「B站 Cookie」旁有「从 CLI 导入」，读本机已存的 cookie 文件；移动端没有这个按钮（读不到本机文件）。</p>\n<h2>四、加密</h2>\n<ul>\n<li>第一次进保险库时设置口令；之后进保险库、取密码都用这一把口令。</li>\n<li>密文与清单都在 <code>&lt;数据存储路径&gt;/.ENCRYPT/</code>。<strong>口令没有找回通道</strong>，请自己保存。</li>\n<li>想看加密的图片/视频缩略图：打开「生成压缩预览」（代价是加密慢一点、密文大一点）。</li>\n<li>想要原图画质：打开「预览自动加载原图」（代价是打开那一刻全部原图一起解密，会明显变慢）。</li>\n</ul>\n<h2>五、桌面与移动的差异</h2>\n<table><thead><tr><th>能力</th><th>桌面</th><th>移动</th></tr></thead><tbody><tr><td>全部域与命令</td><td>✅</td><td>✅</td></tr><tr><td>选择库外文件夹</td><td>✅ 系统目录对话框</td><td>受限（按宿主能力）</td></tr><tr><td>B站 Cookie「从 CLI 导入」</td><td>✅</td><td>❌（读不到本机文件）</td></tr><tr><td>本机 Ollama</td><td>用 <code>Ollama 本地 URL</code></td><td>读自动维护的远端地址键，别手填 localhost</td></tr><tr><td>知识盒视频转写（外部 Python）</td><td>✅</td><td>通常不可用（取决于宿主能否起外部进程）</td></tr></tbody></table>\n<h2>六、多库 / 多端</h2>\n<ul>\n<li>设置与数据都在库内时，换设备打开同一个库就带着走。</li>\n<li>数据库放在库外时，<strong>不会跟着 vault 同步</strong>，需要自己用同步工具处理（并且要保证两端路径都可访问）。</li>\n<li>加密数据与图片缓存等由插件管理的内容，建议整体备份数据存储路径，而不是挑单个文件。</li>\n</ul>\n<h2>一份「新机器上手」清单</h2>\n<ol>\n<li>装插件，打开设置面板 → 通用 → 确认数据存储路径指向你搬过来的数据目录。</li>\n<li>重载插件。</li>\n<li>AI → LLM 填密钥、确认模型名；Embedding 配好嵌入模型。</li>\n<li>需要影院字段/AI 检索的，补对应凭据（ApiZero / 豆瓣 / B站 Cookie）。</li>\n<li>跑「数据体检」看有没有缺失文件。</li>\n<li>试三个冒烟动作：写一篇日记、抓一次剪藏、搜一次第二大脑参考。</li>\n</ol>","no":3},{"id":"reference","title":"参考：命令、设置与数据","group":"进阶","tags":["reference"],"domain":"","html":"<p>两张表：全部命令（按域分好，去命令面板搜名字就能找到），以及换电脑、备份时要带走哪些文件。</p>\n<h2>命令总表（按域）</h2>\n<p>在 Obsidian 里按 <code>Ctrl/Cmd + P</code> 打开命令面板，直接搜名字就行。想给常用命令配快捷键，去 Obsidian 的「快捷键」设置里搜同一个名字。</p>\n<h3>首页（基础）</h3>\n<ul>\n<li>内容首页</li>\n</ul>\n<h3>设置面板（基础）</h3>\n<ul>\n<li>设置面板</li>\n</ul>\n<h3>数据体检（基础）</h3>\n<ul>\n<li>数据体检</li>\n</ul>\n<h3>第二大脑（智能）</h3>\n<ul>\n<li>第二大脑面板</li>\n<li>第二大脑参考</li>\n<li>第二大脑对话</li>\n<li>重建索引</li>\n<li>本周知识动态</li>\n</ul>\n<h3>日记本（记录）</h3>\n<ul>\n<li>日记本</li>\n<li>写日记</li>\n</ul>\n<h3>备忘录（记录）</h3>\n<ul>\n<li>备忘录</li>\n<li>加备忘录</li>\n<li>给当前笔记记一笔</li>\n</ul>\n<h3>归物本（记录）</h3>\n<ul>\n<li>加物品</li>\n<li>归物本</li>\n<li>归物本年度报告</li>\n</ul>\n<h3>脸谱（记录）</h3>\n<ul>\n<li>脸谱</li>\n<li>脸谱数据源</li>\n</ul>\n<h3>剪藏本（收集）</h3>\n<ul>\n<li>剪藏本</li>\n<li>未读全部标为已读</li>\n<li>剪藏本抓取新文章</li>\n<li>剪藏阅读报告</li>\n</ul>\n<h3>收藏本（收集）</h3>\n<ul>\n<li>收藏本</li>\n<li>加收藏</li>\n</ul>\n<h3>自动摘要（收集）</h3>\n<ul>\n<li>重新生成当前剪藏摘要</li>\n</ul>\n<h3>影院（媒体与阅读）</h3>\n<ul>\n<li>影视分析报告</li>\n<li>影院</li>\n<li>加影视</li>\n<li>随机抽一部</li>\n</ul>\n<h3>阅读报告（媒体与阅读）</h3>\n<ul>\n<li>阅读分析报告</li>\n</ul>\n<h3>书库（媒体与阅读）</h3>\n<ul>\n<li>书库</li>\n<li>继续在读</li>\n</ul>\n<h3>游戏库（媒体与阅读）</h3>\n<ul>\n<li>游戏库</li>\n<li>同步游戏库</li>\n<li>游戏库数据统计</li>\n</ul>\n<h3>复习计划（媒体与阅读）</h3>\n<ul>\n<li>复习计划</li>\n<li>复习计划分析报告</li>\n<li>记忆分析</li>\n<li>开始复习</li>\n<li>做题练习</li>\n<li>加入复习计划</li>\n<li>移出复习计划</li>\n<li>跳转逾期复习</li>\n<li>选择复习难度</li>\n<li>复习评级：忘了</li>\n<li>复习评级：困难</li>\n<li>复习评级：一般</li>\n<li>复习评级：简单</li>\n</ul>\n<h3>知识盒（媒体与阅读）</h3>\n<ul>\n<li>知识盒</li>\n<li>名词生成文献笔记</li>\n<li>影像生成文献笔记</li>\n<li>段落生成文献笔记</li>\n<li>图版生成文献笔记</li>\n<li>重跑当前笔记关联</li>\n<li>为未关联笔记批量补链</li>\n<li>看挂载树</li>\n<li>重跑挂载建议</li>\n</ul>\n<h3>番茄钟（工具）</h3>\n<ul>\n<li>番茄钟</li>\n<li>开始/重置专注</li>\n<li>跳过休息</li>\n<li>暂停/继续专注</li>\n</ul>\n<h3>小橘陪伴猫（工具）</h3>\n<ul>\n<li>小橘</li>\n<li>小橘聊天</li>\n<li>隐藏小橘</li>\n<li>小橘数据面板</li>\n</ul>\n<h3>保险库（安全）</h3>\n<ul>\n<li>保险库</li>\n<li>加密当前笔记</li>\n<li>锁定保险库</li>\n</ul>\n<h3>密码本（安全）</h3>\n<ul>\n<li>密码本</li>\n<li>快速取密</li>\n<li>快速生成密码</li>\n<li>锁定密码本</li>\n</ul>\n<h2>换电脑或备份时要带走哪些文件</h2>\n<p>包仔的数据分三类，位置各不相同。要备份或换电脑，照这个清单来：</p>\n<table><thead><tr><th>放在哪</th><th>里面是什么</th><th>你要留意</th></tr></thead><tbody><tr><td><strong>数据目录</strong>（默认库内 <code>CONFIG/STORAGE/</code>）</td><td>各域的 <code>.json</code> 数据文件，比如备忘录、复习计划、番茄钟记录</td><td>这是主要数据，<strong>必须带走</strong></td></tr><tr><td><strong>加密目录</strong>（数据目录下的 <code>.ENCRYPT/</code>）</td><td>保险库、密码本、脸谱的密文</td><td>以点开头，Obsidian 侧栏里看不见（防误删）。<strong>必须带走，且必须记得主密码</strong></td></tr><tr><td><strong>笔记目录</strong>（库内 <code>我的/日记</code>、<code>我的/影视</code>、<code>书库</code> 等）</td><td>日记、影视条目、书目这些正文本身</td><td>它们就是普通 Markdown，跟库一起走</td></tr><tr><td><strong>向量索引</strong>（<code>.vec</code> 文件）</td><td>第二大脑和小橘用来「按意思找内容」的索引</td><td>丢了不伤数据，下次会自动重建（要重新等它建完）</td></tr></tbody></table>\n<p><strong>换电脑的做法</strong>：把上面四类一起复制过去，插件设置里把「数据存储路径」指到新位置即可。</p>\n<p><strong>只备份不换机</strong>：前两类是要害，笔记本来就在库里跟着 Obsidian 的同步走。</p>\n<p>想确认数据有没有缺、有没有坏：命令面板搜「<strong>数据体检</strong>」，它只读扫一遍全部数据文件，报告缺了什么、坏了什么、有没有没人认领的条目。</p>","no":4},{"id":"troubleshooting","title":"排查：症状与处置","group":"进阶","tags":["troubleshooting"],"domain":"","html":"<p>先记住两把万能钥匙：<strong>① 命令面板搜「数据体检」</strong>（只读扫全域数据文件）；<strong>② 重载插件</strong>（关掉再打开）。下面按症状排。</p>\n<h2>一、设置改了没反应</h2>\n<table><thead><tr><th>症状</th><th>原因</th><th>处置</th></tr></thead><tbody><tr><td>换了目录，内容还是旧的</td><td>目录类设置在启动或特定时机读取</td><td>重载插件</td></tr><tr><td>「自动关联」改了没变化</td><td>关联监听在插件启动时注册</td><td>重载插件</td></tr><tr><td>换了嵌入模型，检索没变</td><td>旧索引还在用旧维度</td><td>用「重建索引」全量重嵌</td></tr><tr><td>面板看着没更新</td><td>面板是渲染快照</td><td>关掉面板重新打开</td></tr></tbody></table>\n<h2>二、数据看起来「不见了」</h2>\n<ol>\n<li>先确认「通用 → 数据存储路径」指向的还是那个目录。</li>\n<li>若刚改过路径：检查旧目录里的文件是否已搬到新目录（插件不会替你搬）。</li>\n<li>跑「数据体检」：它按当前路径扫描并报告缺失项。</li>\n<li>若文件确实不在：从备份恢复（建议整体备份数据存储路径）。</li>\n</ol>\n<h2>三、AI 相关不工作（报错 / 没反应）</h2>\n<table><thead><tr><th>症状</th><th>可能原因</th><th>处置</th></tr></thead><tbody><tr><td>操作报 401/403</td><td>密钥没填或填错</td><td>AI → LLM 补密钥，用行内「测试」验证</td></tr><tr><td>报 400、提示上限</td><td>最大输出 token 填得比模型官方档位大</td><td>清空该行（回落自动档位）或改小</td></tr><tr><td>模型名写错</td><td>该行是自由文本，不校验</td><td>用「获取模型名」从列表里选</td></tr><tr><td>换服务商后右边几行变了</td><td>配置按服务商分存</td><td>正常；切回去就是原来那份</td></tr><tr><td>移动端连不上本机 Ollama</td><td>移动端读的是自动维护的远端键</td><td>填桌面机的局域网地址，别填 localhost</td></tr><tr><td>JEV 判定不生效</td><td>没配 JEV 密钥</td><td>AI → JEV 填密钥；不填会用生成通道那套</td></tr></tbody></table>\n<h2>四、检索类问题（第二大脑 / 小橘）</h2>\n<table><thead><tr><th>症状</th><th>原因</th><th>处置</th></tr></thead><tbody><tr><td>搜不到某篇笔记</td><td>不在检索范围，或索引未建</td><td>检查三个盒子与「额外检索目录」；必要时重建索引</td></tr><tr><td>结果不相关</td><td>嵌入模型不合适 / TopK 太小</td><td>换更好的嵌入模型；调大参考结果数</td></tr><tr><td>开了重排但没效果</td><td>本地重排只在嵌入模型是 Qwen3-Embedding-8B 时生效</td><td>换该嵌入模型，或走 JEV 云端重排</td></tr><tr><td>重建很慢</td><td>笔记多</td><td>正常；重建期间周期性落盘，关掉窗口下次续建</td></tr><tr><td>小橘记不住东西</td><td>目录没进「记忆文件夹」，或换过模型没重建</td><td>加目录并重扫；换模型后删向量文件重扫</td></tr></tbody></table>\n<h2>五、抓取类问题（剪藏 / 影院 / 游戏库）</h2>\n<table><thead><tr><th>症状</th><th>可能原因</th><th>处置</th></tr></thead><tbody><tr><td>剪藏抓不到新文章</td><td>对应源名单为空 / 开关关着</td><td>检查 UP 主名单、RSS 订阅源是否非空</td></tr><tr><td>抓取失败、提示风控</td><td>豆瓣等站点拦截</td><td>补豆瓣 Cookie；稍后再试</td></tr><tr><td>影院字段缺评分/导演</td><td>没配 ApiZero Key</td><td>AI → 数据源凭据填 ApiZero Key</td></tr><tr><td>B站视频清晰度选项少</td><td>没配 B站 Cookie</td><td>填 Cookie；桌面端可从 CLI 导入</td></tr><tr><td>Steam 同步没反应</td><td>SteamID64 或 Web API 密钥缺一；或格式不对</td><td>两项都填；ID 必须是 17 位、7656 开头</td></tr><tr><td>Steam 请求失败</td><td>国内直连被重置</td><td>走系统代理</td></tr></tbody></table>\n<h2>六、脸谱（微信导入）</h2>\n<table><thead><tr><th>症状</th><th>原因</th><th>处置</th></tr></thead><tbody><tr><td>面板上没有数据源入口</td><td>「数据根目录」留空</td><td>设置 → 脸谱 → 数据根目录，粘贴导出目录的完整路径</td></tr><tr><td>换了目录看不到新数据</td><td>换目录后不会自动重扫</td><td>执行「脸谱数据源」重扫一遍</td></tr><tr><td>头像没显示</td><td>保险库上着锁，或这个人没有头像文件</td><td>先解锁保险库；还不行就重新导入一次</td></tr><tr><td>群聊不见了</td><td>群聊默认不进列表</td><td>打开「群聊纳入列表」</td></tr><tr><td>脸谱面板空的 / 提示要先解锁</td><td>脸谱数据存在保险库里</td><td>先解锁保险库（跟保险库、密码本共用主密码）</td></tr><tr><td>画像生成失败</td><td>没配 AI 通道或密钥</td><td>AI → LLM 配好再试</td></tr></tbody></table>\n<h2>七、复习计划</h2>\n<table><thead><tr><th>症状</th><th>原因</th><th>处置</th></tr></thead><tbody><tr><td>笔记没进复习</td><td>目录没加入监听 / 加入时点了取消</td><td>「取消」= 该目录根本不加入；重新加并确认收编</td></tr><tr><td>每天要复习的太多</td><td>R 阈值偏低或间隔缩放偏小</td><td>调高 R 阈值、把间隔缩放调大</td></tr><tr><td>刚用拟合没效果</td><td>样本不足（&lt;100 条会跳过）</td><td>正常；积累记录后再看</td></tr><tr><td>评级点错</td><td>评级会立刻改排期</td><td>再评一次，以最新一次为准</td></tr></tbody></table>\n<h2>八、保险库与密码本</h2>\n<table><thead><tr><th>症状</th><th>原因</th><th>处置</th></tr></thead><tbody><tr><td>提示保险库是空的</td><td>密文不在当前数据存储路径的 .ENCRYPT 下</td><td>确认路径；换过目录的话把 .ENCRYPT 整体搬过去</td></tr><tr><td>口令不对</td><td>记忆偏差</td><td>没有找回通道；确认大小写与输入法</td></tr><tr><td>预览很慢</td><td>开了「预览自动加载原图」</td><td>关掉它，改用压缩预览</td></tr><tr><td>密文没随库同步</td><td>数据存储路径在库外</td><td>移到库内，或自行同步该目录</td></tr></tbody></table>\n<h2>九、性能与卡顿</h2>\n<ul>\n<li><strong>批量任务（导入 / 补链 / 抓取 / 重建）</strong>会占用资源；同一时间只跑一个，别叠加。</li>\n<li><strong>抓取类走网络</strong>，弱网时感知明显；「立即抓取」在抓取中再点会提示稍候，不会叠请求。</li>\n<li><strong>大库首次建索引最慢</strong>，属一次性成本；之后是增量。</li>\n</ul>\n<h2>十、还是解决不了</h2>\n<p>按这个顺序再试一遍：</p>\n<ol>\n<li><strong>重载插件</strong>——它解决了一半的「不对劲」。</li>\n<li><strong>跑一次「数据体检」</strong>——它会直接告诉你数据有没有缺、有没有坏。</li>\n<li><strong>回到那个域的章节，看「要注意的地方」</strong>——很多你以为是故障的表现，其实是设计如此。比如番茄钟开了「强制专注」，专注中就是不给暂停，这不是 bug。</li>\n<li><strong>确认前置条件都满足了</strong>——密钥填了吗、目录选了吗、Python 装了吗。AI 类功能没配通道就是不会工作，这是设计。</li>\n</ol>\n<p>如果以上都试过还是不行，记下三样东西再去反馈：<strong>你做的操作</strong>、<strong>屏幕上出现的提示原文</strong>、<strong>你期望它做什么</strong>。有这三样，问题基本能定位。</p>","no":5},{"id":"examples","title":"照着做：工作流示例","group":"进阶","tags":["examples"],"domain":"","html":"<p>三个难度层：入门（单域一件事）、进阶（跨域组合）、高级（把整套流程串起来）。每例都写明前置条件与出错时的去处。</p>\n<h2>入门</h2>\n<h3>例 1：写下第一篇日记</h3>\n<ol>\n<li>命令面板搜「写日记」。</li>\n<li>当天没有日记就新建一篇，有就接着写。</li>\n<li>想翻旧日记：命令面板搜「日记本」。</li>\n</ol>\n<p><strong>预期</strong>：<code>我的/日记/</code> 下多了一篇当天日期的笔记。</p>\n<p><strong>出错</strong>：写了但找不到文件 → 通用 → 检查日记目录设置，并确认该目录在库内。</p>\n<h3>例 2：收一条新闻并读掉</h3>\n<ol>\n<li>设置 → 剪藏本：确认至少一个源开着，且对应名单非空（B站要 UP 主名单、RSS 要订阅源）。</li>\n<li>命令面板搜「剪藏本抓取新文章」抓一轮。</li>\n<li>命令面板搜「剪藏本」读；读完可以「未读全部标为已读」。</li>\n</ol>\n<p><strong>预期</strong>：未读流里出现新条目；读过的能标已读。</p>\n<p><strong>出错</strong>：抓不到 → 看通知是否有风控提示；豆瓣被拦就去 AI → 数据源凭据补豆瓣 Cookie。</p>\n<h3>例 3：记一件买的东西</h3>\n<ol>\n<li>命令面板搜「加物品」登记。</li>\n<li>年底或想复盘时搜「归物本年度报告」。</li>\n</ol>\n<p><strong>预期</strong>：条目进 <code>belongings.json</code>，报告按年份统计。</p>\n<p><strong>出错</strong>：报告里年份不对 → 检查条目日期。</p>\n<h2>进阶</h2>\n<h3>例 4：把微信聊天变成人物档案</h3>\n<ol>\n<li>拿到微信导出工具产出的目录（结构：一层一个联系人，里面是 <code>chat.json</code>）。</li>\n<li>设置 → 脸谱 → 数据根目录：<strong>粘贴这个目录的完整路径</strong>（数据在库外，只能手填）。</li>\n<li>命令面板「脸谱数据源」→ 勾选要导入的联系人 → 导入所选。</li>\n<li>在弹窗里点「画脸谱」，然后回到「脸谱」面板看人物与画像。</li>\n</ol>\n<p><strong>前置</strong>：画像需要 AI 通道可用（AI → LLM 配好密钥）。另外脸谱数据存在保险库里，<strong>主密码要先设好并记住</strong> —— 忘了就永久拿不回来。</p>\n<p><strong>注意</strong>：媒体文件夹只能选库内目录；只有头像会复制进库。</p>\n<p><strong>出错</strong>：导入后没变化 → 回数据源窗口刷新重扫；头像裂图 → 改媒体文件夹到库内。</p>\n<h3>例 5：让笔记按意思被搜到</h3>\n<ol>\n<li>AI → Embedding：配好嵌入模型（本机 Ollama 拉一个，如 bge-m3）。</li>\n<li>设置 → 第二大脑 → 额外检索目录：把三个盒子之外的目录也纳入（逗号分隔）。</li>\n<li>需要时命令面板「重建索引」。</li>\n<li>平时用「第二大脑参考」检索；要聊用「第二大脑对话」。</li>\n</ol>\n<p><strong>注意</strong>：换嵌入模型会换维度 → 必须重建索引。</p>\n<p><strong>调参</strong>：参考结果数 TopK 管召回量（重排之前），对话侧条数是另一个键。</p>\n<h3>例 6：把一本书读进复习</h3>\n<ol>\n<li>书库放好 EPUB 或建好藏书笔记，读的时候记录进度（「继续在读」用得着）。</li>\n<li>设置 → 复习计划 → 监听文件夹：加入你要复习的笔记目录。</li>\n<li>到期时命令面板「开始复习」，逐条评四档（忘了/困难/一般/简单）。</li>\n<li>用「复习计划分析报告」「记忆分析」看趋势。</li>\n</ol>\n<p><strong>注意</strong>：加监听目录时会问要不要收编已有笔记；点取消 = 该目录根本不加入。</p>\n<p><strong>调节奏</strong>：复习间隔缩放（只作用于 FSRS 动态间隔）、R 目标阈值（只管提前安排）。</p>\n<h3>例 7：给一批文件上锁并用压缩预览翻看</h3>\n<ol>\n<li>设置 → 保险库：打开「生成压缩预览」（可选：调预览长边与质量）。</li>\n<li>对要加密的笔记用命令「加密当前笔记」。</li>\n<li>命令「保险库」浏览；看图片/视频时先看压缩预览（不解密）。</li>\n<li>需要原图画质时再开「预览自动加载原图」；离开时「锁定保险库」。</li>\n</ol>\n<p><strong>代价</strong>：压缩预览让加密慢一点、密文大一点；自动加载原图会让打开预览变慢。</p>\n<p><strong>注意</strong>：口令没有找回通道。</p>\n<h2>高级</h2>\n<h3>例 8：一套「全域可检索」工作流</h3>\n<ol>\n<li><strong>入口统一</strong>：剪藏本自动收文章 + 自动摘要（immediate 或 lazy），保证新内容一进来就有文本。</li>\n<li><strong>纳入检索</strong>：第二大脑的额外检索目录把这些内容目录都加上（增量索引，不用重建）。</li>\n<li><strong>配好重排</strong>：想更准就开「启用重排」；走 JEV 云端或本地（本地要求嵌入模型是 Qwen3-Embedding-8B）。</li>\n<li><strong>喂给小橘</strong>：把关键目录加进「记忆文件夹」，聊天时它会带进来。</li>\n<li><strong>定期体检</strong>：跑「数据体检」，发现异常再重建索引。</li>\n</ol>\n<p><strong>判断标准</strong>：随便问一句「我以前在哪记过 X」，参考结果前几条是否相关。</p>\n<h3>例 9：影院字段与季合并</h3>\n<ol>\n<li>AI → 数据源凭据：填 ApiZero Key（补评分/导演/主演等），豆瓣 Cookie 备用（风控时）。</li>\n<li>录入片子用「加影视」→ 搜索 → 抓字段 → 写笔记。</li>\n<li>剧集多季：打开「剧集按季合并」，同一部剧 ≥2 季会合并成一张卡（点进去展开）。</li>\n<li>找片用「随机抽一部」；统计用「影视分析报告」。</li>\n</ol>\n<p><strong>注意</strong>：合并只改海报墙显示，不动笔记与文件名。</p>\n<h3>例 10：备份与迁移到新机器</h3>\n<ol>\n<li><strong>备份</strong>：整体复制 <code>&lt;数据存储路径&gt;</code>（含 <code>.ENCRYPT</code>）与需要保留的 vault 目录（日记/影视/游戏/书库/剪藏归档）。</li>\n<li><strong>新机器</strong>：装插件 → 通用改数据存储路径到备份位置 → 重载插件。</li>\n<li><strong>补配</strong>：AI 密钥、外部凭据（ApiZero / 豆瓣 / B站 Cookie）、Steam 两项。</li>\n<li><strong>冒烟</strong>：「数据体检」→ 写一篇日记 → 抓一次剪藏 → 搜一次第二大脑参考 → 打开保险库确认密文可见。</li>\n</ol>\n<p><strong>注意</strong>：数据库放在库外时不会随 vault 同步；跨端使用要保证两端都能访问该路径。</p>","no":6},{"id":"checkup","title":"数据体检","group":"基础","tags":["basic","troubleshooting"],"domain":"checkup","html":"<blockquote>给你的插件数据做一次全身检查 —— 只看不动手，把坏掉的和断线的都列出来</blockquote>\n<h2>什么时候用它</h2>\n<p>它不只是给某个功能用的，而是<strong>把插件写在磁盘上的所有数据文件一次性过一遍</strong>，回答三个问题：</p>\n<ul>\n<li>文件还打不打得开？</li>\n<li>里面的内容形状还对不对？</li>\n<li>条目里指向你库内文件的那些「链接」，指的东西还在不在？</li>\n</ul>\n<p>建议在下面这些时候跑一次：</p>\n<ul>\n<li><strong>某个功能怪怪的</strong>——备忘不显示、收藏点了跳笔记报错、剪藏残留清不掉。先来这里定位，比瞎猜快。</li>\n<li><strong>改了「数据存储路径」之后</strong>——确认各文件是不是按新路径被扫到了。</li>\n<li><strong>同步盘出过问题</strong>（OneDrive / iCloud 冲突、异常退出）之后——排查有没有文件被截断成坏档。</li>\n<li><strong>换设备、重装前</strong>——把隐患提前暴露出来，别等迁移完了才发现。</li>\n</ul>\n<p><strong>体检本身不改你的任何数据。</strong> 它是只读的：发现坏文件时不会当场重建，目的是把现场留给你、不毁掉你恢复的机会（唯一的例外是下面说的「一键修复」，只清失效的指向，而且可以撤销）。</p>\n<h2>怎么用</h2>\n<h3>打开它</h3>\n<p>两种方式：</p>\n<ul>\n<li>打开命令面板（Obsidian 里按 <code>Ctrl/Cmd + P</code>），搜<strong>「数据体检」</strong>；</li>\n<li>或者：设置面板 → <strong>通用</strong> → 「数据存储路径」那一组的末尾，有一颗<strong>「打开体检」</strong>按钮。</li>\n</ul>\n<h3>跑一次</h3>\n<ol>\n<li><strong>第一次打开</strong>只有一个<strong>「开始体检」</strong>按钮，点它。</li>\n<li><strong>跑的过程中</strong>：顶部有进度条，下面列出四项检查的进度（等待 / 进行 / 完成）。库很大时会分批让出主线程，进度条一直在动，不是卡死。中途想停，点底部的<strong>「取消体检」</strong>。</li>\n<li><strong>看结果</strong>：结果按三档分组展示——</li>\n</ol>\n<table><thead><tr><th>分组</th><th>颜色</th><th>意思</th></tr></thead><tbody><tr><td><strong>需要处理</strong></td><td>红</td><td>真出问题了：文件坏掉、结构异常，必须处理</td></tr><tr><td><strong>建议处理</strong></td><td>黄</td><td>有点问题：内容漂移、指向的文件没了，建议处理</td></tr><tr><td><strong>通过</strong></td><td>绿</td><td>该项没问题</td></tr></tbody></table>\n<p>每条问题都带一句话说明；想看具体是哪个文件，点<strong>「查看详情」</strong>展开。</p>\n<ol>\n<li><strong>跑完把面板关了也没关系</strong>——跑完会弹一条通知，带「查看」可以直接回到结果页。</li>\n<li><strong>重开面板</strong>看到的是上次的结果，面板会告诉你它还算不算数：显示「此后数据未变化」就还准；显示「数据可能已变化」，旁边就有一颗「重新体检」按钮让你重新跑。</li>\n<li>想主动再跑一次，点结果页底部的<strong>「重新体检」</strong>，会覆盖上次的结果。</li>\n</ol>\n<h3>四类检查分别查什么</h3>\n<table><thead><tr><th>检查项</th><th>查什么</th><th>典型问题</th></tr></thead><tbody><tr><td><strong>数据文件可解析</strong></td><td>逐个读清单里的数据文件，看能不能正常解析</td><td>文件坏了（解析失败）；文件在但读不动</td></tr><tr><td><strong>字段漂移</strong></td><td>核对文件内容跟约定格式一不一致</td><td>多了不该有的字段、少了该有的字段</td></tr><tr><td><strong>孤儿条目</strong></td><td>条目里指向库内文件的引用，那个文件还在不在</td><td>影院海报、书封、游戏封面、剪藏笔记、收藏关联笔记、知识盒引用，指的文件没了</td></tr><tr><td><strong>同源一致性（备忘录）</strong></td><td>对备忘录的数据做一次交叉核对</td><td>同一份数据两条读取链结果对不上</td></tr></tbody></table>\n<p>四类串行跑完，其中某一类出错也不会拖垮整页，只会变成该项的一条红色问题。</p>\n<h2>它扫哪些文件</h2>\n<p>主要扫两类东西：</p>\n<ol>\n<li><strong>各域的数据文件</strong>——一共 17 个 JSON，默认都在「数据存储路径」下（也就是「通用」里那一行配置的目录）：</li>\n</ol>\n<table><thead><tr><th>检查对象</th><th>属于谁</th></tr></thead><tbody><tr><td><code>memo.json</code></td><td>备忘录</td></tr><tr><td><code>favorites.json</code></td><td>收藏本</td></tr><tr><td><code>belongings.json</code></td><td>归物本</td></tr><tr><td><code>clipbook.json</code></td><td>剪藏本侧写</td></tr><tr><td><code>news.json</code></td><td>剪藏未读流</td></tr><tr><td><code>pomodoro.json</code></td><td>番茄钟</td></tr><tr><td><code>review.json</code> / <code>review-fit.json</code> / <code>quiz.json</code></td><td>复习计划 / 拟合参数 / 做题记录</td></tr><tr><td><code>home.json</code></td><td>内容首页</td></tr><tr><td><code>smartcat.json</code> / <code>smartcat-memory.json</code> / <code>smartcat-behavior.json</code></td><td>小橘</td></tr><tr><td><code>lock-stats.json</code></td><td>锁屏统计</td></tr><tr><td><code>knowledge.json</code></td><td>知识盒</td></tr><tr><td><code>secondbrain.json</code></td><td>第二大脑</td></tr><tr><td><code>weave-data.json</code></td><td>书库的 EPUB 阅读数据（走书库那边的外部插件数据路径）</td></tr></tbody></table>\n<ol>\n<li><strong>你库里的 Markdown 笔记</strong>——查「孤儿」时会去读影院 / 书库 / 游戏库 / 剪藏目录里的笔记，核对它们开头信息区里写的封面、海报、EPUB 路径还在不在。</li>\n</ol>\n<p><strong>有意不扫的</strong>（不是漏了）：</p>\n<ul>\n<li><strong>保险库的密文</strong>——那是加密数据，由保险库自己的体检覆盖，明文巡检不碰；</li>\n<li><strong>向量文件</strong>（<code>.vec</code> 结尾）——是二进制，不是 JSON；</li>\n<li><strong>游戏库</strong>——它的数据就在笔记开头的信息区里，没有独立的数据文件。</li>\n</ul>\n<h2>可以调什么（设置项）</h2>\n<p><strong>没有设置项。</strong></p>\n<p>数据体检自己不产生任何配置，它只读「通用」里的「数据存储路径」来决定去哪找文件。</p>\n<h2>有哪些命令</h2>\n<table><thead><tr><th>命令名（去命令面板搜这个）</th><th>做什么</th></tr></thead><tbody><tr><td>数据体检</td><td>打开数据体检面板</td></tr></tbody></table>\n<p>（设置面板「通用」页里的「打开体检」按钮作用相同。）</p>\n<h2>看到问题该怎么办</h2>\n<table><thead><tr><th>报告里写的是</th><th>该怎么办</th></tr></thead><tbody><tr><td><strong>坏文件（红）</strong></td><td>体检不会帮你修——这是故意的，为了保住现场。这个文件会在对应功能<strong>下次读取时</strong>自动留一份档到 <code>CONFIG/.CORRUPT/</code>，然后重建一份默认文件。你也可以从那份留档里手工找回原文</td></tr><tr><td><strong>文件读不动（黄）</strong></td><td>这不是损坏，也不是丢失——多半是被别的程序占用、权限不足，或者同步盘正在动它。过一会儿重新体检通常就好了，别当坏文件处理</td></tr><tr><td><strong>字段漂移（黄 / 提示）</strong></td><td>多数不用管。缺的字段在读取时会自动补默认值；多出来的字段一般是旧版本或别的程序留下的残留，不影响读取</td></tr><tr><td><strong>孤儿 · 能修的（黄）</strong></td><td>用面板上的「一键修复」或单条的「清除」按钮清掉失效的指向。<strong>只清指向，不动你的笔记，条目本身保留</strong>，而且清完可以在通知里撤销</td></tr><tr><td><strong>孤儿 · 只能报告的（黄）</strong></td><td>影院海报 / 书封 / 游戏封面 / EPUB 指的文件没了。这些在你自己的笔记里，体检不会改它们——请把文件补回去，或者到那篇笔记里把对应的字段清空</td></tr><tr><td><strong>两条读取链对不上（红）</strong></td><td>这是程序本身的问题，请反馈给开发者</td></tr></tbody></table>\n<h3>关于「一键修复」</h3>\n<p>能不能修，取决于问题出在哪：能修的只有<strong>收藏本、剪藏本、知识盒</strong>这三处数据文件里的失效指向（比如收藏指向一篇已经删掉的笔记、剪藏残留指着一篇没了的文章）。</p>\n<ul>\n<li><strong>单条修复</strong>：点一下就清掉，不用确认，清完通知里可以撤销。</li>\n<li><strong>批量修复（「一键修复」或按域分组）</strong>：会弹确认框，写明要清多少项，让你确认后再动手。</li>\n<li>修完之后会<strong>自动重新跑一次体检</strong>，让报告收敛回去。</li>\n</ul>\n<blockquote>一句话：修复只清「指向」，不删你的笔记，而且随时能撤销。</blockquote>\n<h2>要注意的地方</h2>\n<ul>\n<li><strong>体检是只读的</strong>，不会改你的数据；唯一动手的是「一键修复」，而且可以撤销。</li>\n<li><strong>坏文件不在体检时修</strong>。体检当下你看到的就是现场，数据不会丢——留档加重建由对应功能下次读取时完成。</li>\n<li><strong>「读不动」不等于「坏掉」，也不等于「没了」</strong>。重新体检通常就好。</li>\n<li><strong>重开面板看到的是缓存</strong>，面板会用文件修改时间判断它还算不算数；写「数据可能已变化」时就该重新跑一次。</li>\n<li><strong>库很大时进度条仍在动</strong>，不是卡死。</li>\n<li><strong>某一类检查出错不会拖垮整页</strong>，只会变成该项的一条红问题。</li>\n<li><strong>改了「数据存储路径」之后要重跑一次</strong>，确认各文件都按新路径被扫到了。</li>\n<li><strong>加密数据、向量文件、游戏库不在扫描清单里</strong>——这是有意豁免，不是漏扫。</li>\n</ul>\n<h2>常见问题</h2>\n<p><strong>体检会改我的数据吗？</strong></p>\n<p>不会。除了「一键修复」清掉失效的指向之外，体检全程只读，一个文件都不写；坏文件也不会在体检时被重建。</p>\n<p><strong>看到「数据文件无法解析（红）」怎么办？</strong></p>\n<p>体检当下不动这个文件。它会在对应功能下次读取时自动留档到 <code>CONFIG/.CORRUPT/</code> 并重建一份默认文件；你也可以从那份留档里手工恢复原文。</p>\n<p><strong>「一键修复」会删掉我的笔记吗？</strong></p>\n<p>不会。它只清数据文件里失效的指向（比如收藏关联的那篇笔记、剪藏残留），笔记本身和条目本身都保留，清完还能在通知里撤销。</p>\n<p><strong>为什么有些问题只有「查看详情」，没有修复按钮？</strong></p>\n<p>因为那些指向写在你的笔记里（影院海报、书封、游戏封面）或者在外部插件的数据里（EPUB），体检不会动它们。得你自己把文件补回去，或者到那篇笔记里把对应字段清空。</p>\n<p><strong>重开面板怎么还是上次的结果？</strong></p>\n<p>那是缓存。面板按文件的修改时间判断：都没变就标「此后数据未变化」；有变化就标「数据可能已变化，重新体检」，并给你一颗按钮。</p>\n<p><strong>「文件存在但读不动（黄）」是什么意思？</strong></p>\n<p>文件在，但这次没读出来——可能被别的程序占用、权限不够，或者同步盘正在动它。既不是损坏也不是丢失，过一会儿重新体检就行。</p>\n<p><strong>报告全绿，但我还是觉得某个功能不对劲？</strong></p>\n<p>体检只能查出数据层面的问题，查不出逻辑或显示上的问题。这种请直接反馈给开发者，并说明你看到的现象。</p>","no":7},{"id":"global","title":"通用","group":"基础","tags":["basic","config"],"domain":"global","html":"<blockquote>插件的「总开关房」：数据存哪儿、面板长什么样，都在这间屋子里定</blockquote>\n<h2>什么时候用它</h2>\n<p>只有两件事需要来这一页改：</p>\n<ol>\n<li><strong>数据存在哪</strong>——想把数据文件挪出主目录，或者放进同步盘时；</li>\n<li><strong>设置面板长什么样</strong>——布局和主题。</li>\n</ol>\n<p>其他所有偏好都在各自功能自己的设置页里，不在这里。</p>\n<p>这一页<strong>没有命令</strong>——入口就是设置面板左侧导航最上面的「通用」。</p>\n<blockquote>想看使用手册？入口不在这一页，在设置面板<strong>左侧栏的底部</strong>（「使用手册」按钮），详见下面「关于使用手册」。</blockquote>\n<h2>数据放在哪</h2>\n<p>这一页自己<strong>不产生数据文件</strong>，它管的恰恰是别人的数据放在哪。</p>\n<p><strong>数据存储路径</strong>（默认 <code>CONFIG/STORAGE</code>，也就是你库里的一个子目录）下面会出现这些文件：</p>\n<table><thead><tr><th>文件</th><th>属于谁</th></tr></thead><tbody><tr><td><code>memo.json</code></td><td>备忘录</td></tr><tr><td><code>favorites.json</code></td><td>收藏本</td></tr><tr><td><code>belongings.json</code></td><td>归物本</td></tr><tr><td><code>clipbook.json</code></td><td>剪藏本侧写（含阅读流水）</td></tr><tr><td><code>news.json</code></td><td>剪藏未读流</td></tr><tr><td><code>pomodoro.json</code></td><td>番茄钟</td></tr><tr><td><code>review.json</code> / <code>review-fit.json</code> / <code>quiz.json</code></td><td>复习计划 / 拟合参数 / 做题记录</td></tr><tr><td><code>knowledge.json</code> / <code>mount-suggest.json</code></td><td>知识盒 / 挂载建议缓存</td></tr><tr><td><code>secondbrain.json</code> / <code>secondbrain.vec</code></td><td>第二大脑（<strong><code>.vec</code> 是二进制，打不开看</strong>）</td></tr><tr><td><code>home.json</code></td><td>内容首页</td></tr><tr><td><code>smartcat.json</code> / <code>smartcat-memory.json</code> / <code>smartcat-memory-vectors.vec</code> / <code>smartcat-behavior.json</code></td><td>小橘</td></tr><tr><td><code>lock-stats.json</code></td><td>锁屏统计</td></tr><tr><td><code>weave-data.json</code></td><td>书库阅读数据</td></tr><tr><td><code>.ENCRYPT/</code></td><td><strong>保险库的密文</strong>（子目录，固定在这里）</td></tr></tbody></table>\n<p><strong>不在这个目录里的东西</strong>（容易误会，记一下）：</p>\n<ul>\n<li>剪藏存下来的<strong>网页图片</strong>等媒体 → 仍走库自己的附件目录；</li>\n<li>影视 / 日记 / 游戏 / 书库 / 剪藏这些<strong>笔记本体</strong> → 是库里的普通 <code>.md</code> 文件，不走 JSON；</li>\n<li>脸谱的外部聊天数据 → 在你自己选的<strong>库外</strong>那个数据根目录里；</li>\n<li><strong>脸谱在这里一个文件都没有</strong> —— 它每个联系人一条记录存在 <code>.ENCRYPT/</code> 保险库里，跟保险库共用主密码。忘了主密码，脸谱数据就永久拿不回来。</li>\n</ul>\n<h2>怎么用</h2>\n<ol>\n<li>打开设置面板：命令面板（Obsidian 里按 <code>Ctrl/Cmd + P</code>）搜<strong>「设置面板」</strong>，或者从 Obsidian 原生设置页里的插件入口进去。</li>\n<li>点左侧导航最上面的<strong>「通用」</strong>。</li>\n<li>这一页两组内容：</li>\n</ol>\n<ul>\n<li><strong>外观</strong>：布局和主题，卡片式选择，选了立即生效。</li>\n<li><strong>数据存储路径</strong>：点右侧按钮选一个目录（库内路径），或者直接粘路径进去。改完会弹一条黄色提醒，告诉你这次改动的影响面。</li>\n</ul>\n<ol>\n<li>顶部搜索框能搜到这一页的设置项名字。</li>\n</ol>\n<h3>关于使用手册</h3>\n<p>「使用手册」的入口在<strong>设置面板左侧栏的最底部</strong>，不在「通用」这一页里。点它：</p>\n<ul>\n<li>本地还没有手册 → 先联网下载，下载期间按钮图标会转圈，下完自动打开；</li>\n<li>本地已经有了 → 直接打开。</li>\n</ul>\n<p>手册会在 <strong>Obsidian 里弹出一个独立窗口</strong>显示，不会跳到系统浏览器。</p>\n<p>下载走两条通道：先试 GitHub，不通再换备用 CDN，两条都失败才会报错。手册不随插件一起分发——想更新到最新版，删掉插件目录里那份再点一次即可。</p>\n<p>手册文件放在<strong>插件安装目录</strong>（<code>&lt;配置目录&gt;/plugins/bz/bz-manual.html</code>），不是数据存储路径——手册是程序自带的东西，跟版本走，不该和你的数据混在一起。</p>\n<h3>关于数据体检</h3>\n<p>「通用」这一页的「数据存储路径」组末尾还有一颗<strong>「打开体检」</strong>按钮，点了会打开数据体检面板（详见「数据体检」章）。改完存储路径后顺手跑一次，可以确认各文件是不是都被扫到了。</p>\n<h2>可以调什么（设置项）</h2>\n<h3>外观</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>布局</td><td>经纬</td><td>设置面板的布局（目前只有这一种）</td></tr><tr><td>主题</td><td>晨昏</td><td>设置面板的主题（目前只有这一种）</td></tr></tbody></table>\n<blockquote>「晨昏」的意思就是<strong>跟随 Obsidian 的亮色/暗色自动切换</strong>——这就是它的定义，没有单独的亮暗开关。</blockquote>\n<h3>数据存储路径</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>数据存储路径</td><td><code>CONFIG/STORAGE</code></td><td>所有数据文件统一存放的目录。<strong>只改路径、不搬旧数据</strong>，而且<strong>要重载插件才生效</strong></td></tr></tbody></table>\n<h2>有哪些命令</h2>\n<p><strong>没有。</strong> 这一页是纯设置，没有配套命令。想打开设置面板，去命令面板搜<strong>「设置面板」</strong>。</p>\n<h2>要注意的地方</h2>\n<ul>\n<li><strong>改路径不会帮你搬数据。</strong> 插件之后会去新位置读写，旧文件留在原地不动。要么你自己把旧文件移过去，要么记得旧目录还在——不然在插件看来数据就「没了」。</li>\n<li><strong>改完要重载插件</strong>（把插件关掉再打开）才生效，不重载还是读旧位置。</li>\n<li><strong>加密的密文跟着一起走。</strong> <code>.ENCRYPT</code> 是数据存储路径的子目录，所以改路径等于改了密文位置，<strong>已有密文不会自动搬迁</strong>——保险库会看起来是空的，需要你手工把旧的 <code>.ENCRYPT</code> 目录移过去。</li>\n<li><strong><code>.vec</code> 是二进制</strong>，别手动编辑，也别指望能打开看。</li>\n<li><strong>媒体文件不在这个目录里</strong>，想统一管理图片附件得去附件相关的设置，不是这一页。</li>\n<li>外观两项目前各只有一个选项，等于暂时没得换。</li>\n</ul>\n<h2>常见问题</h2>\n<p><strong>我的数据到底存在哪？</strong></p>\n<p>默认在库里的 <code>CONFIG/STORAGE</code> 目录。想确认就看这一页「数据存储路径」的值。</p>\n<p><strong>改了路径，数据还在旧地方怎么办？</strong></p>\n<p>把旧目录里的文件复制到新目录，然后重载插件。插件不会替你搬。</p>\n<p><strong>为什么改完没反应？</strong></p>\n<p>路径类的改动要重载插件（把插件关掉再打开）才生效。</p>\n<p><strong>面板主题能跟着系统变暗吗？</strong></p>\n<p>能。「晨昏」就是跟随 Obsidian 的亮暗自动切换——这就是它的定义，不需要另外开关。</p>\n<p><strong>这一页能重置所有设置吗？</strong></p>\n<p>不能。这一页只有数据路径和外观两组，没有「一键重置全部设置」的入口。</p>\n<p><strong>加密的笔记存在这个目录里吗？</strong></p>\n<p>在——但在它的<strong>子目录</strong> <code>.ENCRYPT</code> 里，而且是密文。数据目录里看到 <code>.ENCRYPT</code> 就当它不存在，去「保险库」那一页管理。</p>\n<p><strong>「使用手册」按钮点了没反应 / 报下载失败？</strong></p>\n<p>下载要走网络（先 GitHub，失败再换备用 CDN），两条都不通才会报错，通知里会写失败原因。网络好了再点一次即可。</p>\n<p><strong>手册下载到哪儿了？</strong></p>\n<p>插件安装目录里的 <code>bz-manual.html</code>（不是数据存储路径——手册是程序资产，跟版本走，不跟你的数据混放）。</p>\n<p><strong>这一页能改通知相关的设置吗？</strong></p>\n<p>不能。通知相关的设置已经从这一页拆出去，单独成一页「通知」了。</p>","no":8},{"id":"home","title":"首页","group":"基础","tags":["basic","interface"],"domain":"home","html":"<blockquote>库里发生的一条河 —— 今天、昨天、这周，谁动了什么，一眼看完</blockquote>\n<h2>什么时候用它</h2>\n<p>想「一眼看到今天 / 这周库里发生了什么」的时候打开它。</p>\n<p>它是各域活动的<strong>汇总视图</strong>，自己不产生内容 —— 上面那些记录，是别的域的动作留下的回声：写了篇日记、收了个剪藏、读完一本书、给影片打个分，这些都会出现在时间线上。</p>\n<p>它跟「设置面板」的分工：设置面板是<strong>改设置</strong>的地方，首页是<strong>看动静</strong>的地方。首页底部那排图标是各个域的快捷入口，点了直接进那个域。</p>\n<p>它跟「日记本」的分工：日记本是你<strong>主动写</strong>的；首页这条河是<strong>自动记</strong>的 —— 你不用写什么，它自己就有。</p>\n<h2>怎么用</h2>\n<ol>\n<li>命令面板搜 <strong>内容首页</strong>，打开面板。</li>\n<li>面板分三个区域：</li>\n</ol>\n<ul>\n<li><strong>时间线（活动河）</strong> —— 按天排的动作记录，从上往下。每行可以显示具体时刻。</li>\n<li><strong>预告栏</strong> —— 右侧那一条，复习、剪藏、日记的预告卡（可以整栏关掉）。</li>\n<li><strong>入口区</strong> —— 一排域入口图标，点了直接进对应的域。</li>\n</ul>\n<ol>\n<li>想回看别的日子：在设置里把<strong>时间范围</strong>调大（当天 / 最近 3 天 / 本周），翻回去看。</li>\n</ol>\n<h3>调入口顺序</h3>\n<p>设置面板 → 基础 → <strong>首页</strong> → <strong>入口</strong>那一组，直接在面板里拖动排序，还能把不用的入口移除、以后再加回来。</p>\n<p><strong>桌面端和手机端各存一套</strong>，互不影响 —— 在电脑上调的顺序不会动到手机上的。</p>\n<h2>数据放在哪</h2>\n<table><thead><tr><th>文件</th><th>位置</th><th>里面是什么</th><th>你要留意什么</th></tr></thead><tbody><tr><td><code>home.json</code></td><td>数据目录</td><td><strong>首页自己的状态</strong>：入口的排序与显隐</td><td>删了只丢入口顺序，不丢任何域的内容</td></tr><tr><td><code>smartcat-behavior.json</code></td><td>数据目录</td><td>小橘的<strong>行为流</strong> —— 时间线的主要数据来源</td><td>有保留天数和条数上限，超了自动丢最旧的</td></tr><tr><td>其他域的数据</td><td>各自位置</td><td>时间线上的条目是各域动作的回声，这里不另存一份</td><td>—</td></tr></tbody></table>\n<blockquote><strong>首页不产生数据。</strong> 删掉 <code>home.json</code> 只会让入口回到默认顺序，任何域的内容都不会丢。</blockquote>\n<h2>可以调什么（设置项）</h2>\n<h3>外观</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>面板布局</td><td>活动河</td><td>目前只有这一种，暂无可切换项</td></tr><tr><td>面板主题</td><td>米白</td><td>目前只有这一种，暂无可切换项</td></tr></tbody></table>\n<h3>时间线</h3>\n<p>只管「时间线自己长什么样」。</p>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>时间线字号</td><td>标准</td><td>紧凑 / 标准 / 宽松 —— 一屏能塞多少条</td></tr><tr><td>时间范围</td><td>本周</td><td>能回翻多久：当天 / 最近 3 天 / 本周。超出窗口的日子翻不到</td></tr><tr><td>默认打开日</td><td>今天</td><td>打开时定位到「今天」还是「最后有动静的那天」</td></tr><tr><td>显示时刻列</td><td>开</td><td>每行要不要显示具体时刻</td></tr></tbody></table>\n<h3>内容过滤</h3>\n<p>只管「哪些痕迹进时间线」，跟长相无关。</p>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>产出动作</td><td>开</td><td>写下的 / 收进的 / 读完的这类动作记录</td></tr><tr><td>状态推进</td><td>开</td><td>加入片单、读到一半这类推进记录</td></tr><tr><td>小橘点评</td><td>开</td><td>小橘的点评与影片星级记录</td></tr><tr><td>跳过痕迹</td><td>关</td><td>聚合讯里跳过的文章记录。<strong>默认关，因为量级大</strong> —— 想看得手动开</td></tr></tbody></table>\n<h3>预告栏</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>明天预告卡</td><td>开</td><td>右侧那一栏复习、剪藏、日记的预告。关掉后右侧不留空位</td></tr></tbody></table>\n<h3>入口</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>入口</td><td>默认顺序</td><td>在面板里直接拖动排序、移除、加回。桌面端与手机端各存一套，互不影响</td></tr></tbody></table>\n<h2>有哪些命令</h2>\n<table><thead><tr><th>命令名（去命令面板搜这个）</th><th>做什么</th></tr></thead><tbody><tr><td>内容首页</td><td>打开首页面板</td></tr></tbody></table>\n<p>只有这一条 —— 首页的定位就是<strong>入口</strong>，具体的动作都在各域自己的命令里。</p>\n<h2>要注意的地方</h2>\n<ul>\n<li><strong>时间线不是自动日志</strong>：它显示的是行为流里<strong>已有</strong>的记录。某一类动作一直不出现，先去「内容过滤」里看对应开关是不是关着。</li>\n<li><strong>「跳过痕迹」默认是关的</strong>：聚合讯里跳过的文章量太大，默认不显示，想看得手动开。</li>\n<li><strong>入口顺序存在 <code>home.json</code> 里</strong>，跟着库一起同步。只复制部分数据时会回到默认顺序。</li>\n<li><strong>它不产生数据</strong>：删掉 <code>home.json</code> 只丢入口排序。</li>\n<li>外观两行目前各只有一个选项。</li>\n</ul>\n<h2>常见问题</h2>\n<p><strong>首页空空的？</strong></p>\n<p>两种可能：① 还没有任何域产生过动作（先去写条日记或收藏点东西）；②「内容过滤」里的开关被关掉了。</p>\n<p><strong>怎么调入口顺序？</strong></p>\n<p>设置面板 → 首页 →「入口」那一组，直接拖动。这个编辑器同时管移除与加回。</p>\n<p><strong>时间线能看上周吗？</strong></p>\n<p>看「时间范围」选的是哪个 —— 当天 / 最近 3 天 / 本周。超出这个窗口的翻不到。</p>\n<p><strong>「小橘点评」是什么？</strong></p>\n<p>小橘给出的点评与影片星级评分记录。不想看就在「内容过滤」里关掉。</p>\n<p><strong>首页会拖慢 Obsidian 吗？</strong></p>\n<p>只在打开面板时读数据，关掉不占资源。</p>\n<p><strong>为什么手机上入口顺序跟电脑上不一样？</strong></p>\n<p>两套是分开存的 —— 在哪一端调的，就只改那一端。</p>","no":9},{"id":"notice","title":"通知","group":"基础","tags":["basic","notice"],"domain":"notice","html":"<blockquote>屏幕角上蹦出来的小卡片 —— 告诉你刚才那下成没成、后台跑完了没、哪一步失败了</blockquote>\n<h2>什么时候用它</h2>\n<p>你不用「用它」，它自己会来。但你可能想调它。</p>\n<p>插件里几乎所有动作的最后一步，都是给你弹一条小卡片：</p>\n<ul>\n<li><strong>你点了什么之后</strong> —— 比如删除、归档、移出，会弹一条带<strong>撤销</strong>的提示，给你一个反悔的窗口（默认停留 6 秒）；</li>\n<li><strong>后台任务跑着</strong> —— 比如自动摘要、加密进度，会弹一条带转圈的常驻卡片，跑完就在原地变成结果；</li>\n<li><strong>出错的时候</strong> —— 写盘失败、动作失败，会用红条明确告诉你「什么失败了 + 为什么 + 怎么重试」。</li>\n</ul>\n<p>它不是 Obsidian 自带的那套提示，是插件自己画的，所以下面四项都能调。</p>\n<h2>怎么用</h2>\n<ol>\n<li>打开<strong>设置面板</strong>（命令面板搜「设置面板」）。</li>\n<li>左栏找到<strong>通知</strong>这一页（铃铛图标）。</li>\n<li>四项都是下拉：<strong>通知级别 / 停留时长 / 弹出位置 / 同屏上限</strong>。</li>\n<li>改完<strong>立刻生效</strong>，下次弹通知时就是新的样子 —— 不用重启、不用重载插件。</li>\n</ol>\n<p>建议的调法：觉得吵就先把「通知级别」调到「仅警告与错误」，再把「同屏上限」调到 3 条。</p>\n<h2>数据放在哪</h2>\n<p>通知<strong>不写任何数据文件</strong> —— 它只是屏幕上临时出现的小卡片，关掉就没了，卸载插件也不留痕迹。</p>\n<p>只有四项偏好会被记住：</p>\n<table><thead><tr><th>位置</th><th>里面是什么</th><th>你要留意什么</th></tr></thead><tbody><tr><td>插件数据目录的 <code>data.json</code></td><td>通知级别、停留时长、弹出位置、同屏上限这四项偏好</td><td>换电脑不跟着库走，新机器上要重新调一次</td></tr></tbody></table>\n<h2>可以调什么（设置项）</h2>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>通知级别</td><td>全部</td><td>「全部」= 什么都弹；「仅警告与错误」= 常规提示不再打扰你；「仅错误」= 只有出错才弹。<strong>带按钮（撤销/查看）和进度类通知不受这一项限制，永远弹得出</strong></td></tr><tr><td>停留时长</td><td>标准（3 秒）</td><td>干脆 2 秒 / 标准 3 秒 / 从容 5 秒 / 常驻（点了才关）。错误类会比当前档位多停 2 秒</td></tr><tr><td>弹出位置</td><td>右上</td><td>右上 / 右下 / 左下 / 左上。<strong>只在电脑端生效</strong> —— 手机上恒定顶部居中，这一项无效</td></tr><tr><td>同屏上限</td><td>5 条</td><td>一屏最多同时显示几条（3 / 5 / 8）。超了会挤掉最旧的</td></tr></tbody></table>\n<h2>有哪些命令</h2>\n<p>这一域没有命令 —— 通知是插件自动弹出的，没有可以手动触发的入口。</p>\n<h2>要注意的地方</h2>\n<ul>\n<li><strong>带「撤销」的通知和进度条，任何级别下都会弹。</strong> 它们是要你做决定的出口，不能被静默掉 —— 所以就算你把级别调到「仅错误」，删完东西那条撤销提示照样出现。</li>\n<li><strong>通知会被合并</strong>：同一件事还在屏幕上时又触发一次，它不会新弹一条，而是<strong>原地更新文字并重新计时</strong>。所以自动摘要跑一批时你只看到一张卡片在变，不是一堆卡片在堆。</li>\n<li><strong>同一个后台事件 30 秒内只弹一次</strong>，防止刷屏。</li>\n<li><strong>点一下通知本身就关掉它</strong>，包括常驻的进度条。点「撤销」这类按钮则执行对应动作，不会误触关闭。</li>\n<li><strong>文字越长停得越久</strong>：超过 20 字之后每多 1 个字多停一点点，最长 15 秒。所以长提示不用担心看不完。</li>\n<li><strong>手机上位置调不动</strong>：手机上恒定从顶部往下出，这是移动端的设计。</li>\n</ul>\n<h2>常见问题</h2>\n<p><strong>通知太多、刷屏怎么办？</strong></p>\n<p>把「通知级别」调到「仅警告与错误」，再把「同屏上限」调低（比如 3 条）。注意带「撤销 / 查看」按钮的那类和进度条仍会弹。</p>\n<p><strong>某个操作明明又做了一次，为什么只弹了一条？</strong></p>\n<p>那是防刷屏的设计：同一类后台事件 30 秒内重复触发只弹一条。</p>\n<p><strong>常驻通知（比如进度条）怎么关？</strong></p>\n<p>直接点通知本体任意位置就关了。把「停留时长」设成「常驻」的普通通知也是点一下才关。</p>\n<p><strong>手机上把位置设成「左下」为什么不生效？</strong></p>\n<p>位置只在电脑端生效。手机上恒定顶部居中，这一项会被忽略。</p>\n<p><strong>删错了能反悔吗？</strong></p>\n<p>能。删除 / 移出 / 归档这类操作落地后，会弹一条带<strong>撤销</strong>的通知，默认停留 6 秒，点一下就回滚。这条在任何通知级别下都会弹。</p>\n<p><strong>通知文字很长，会看不完吗？</strong></p>\n<p>不会。没写死时长的通知，正文越长停得越久，最长 15 秒。</p>","no":10},{"id":"settings-panel","title":"设置面板","group":"基础","tags":["basic","interface"],"domain":"settings-panel","html":"<blockquote>全插件设置的总门 —— 左栏挑域，顶部搜名字，一处改完全域通用</blockquote>\n<h2>什么时候用它</h2>\n<p>改任何设置都从这里进。插件有二十多个域，每个域都有自己的设置，全收在这一个面板里：左边是按语义分好组的导航，右边是当前域的设置页，顶部一个搜索框。</p>\n<p>它跟各个域面板里那个 <strong>⚙️</strong> 按钮的关系：两条路通向<strong>同一份设置</strong>，改哪边都一样，不会冲突。想一次找多个域的设置用设置面板；正在用某个域、顺手改两行就点那个域面板里的 ⚙️。</p>\n<p>它跟 Obsidian 原生设置页的关系：插件的设置<strong>统一在自绘的设置面板里改</strong>，不在 Obsidian 原生设置页里。</p>\n<h2>怎么用</h2>\n<ol>\n<li>命令面板搜 <strong>设置面板</strong>，打开。</li>\n<li><strong>左栏</strong>按语义分成七组：基础 / 智能 / 记录 / 收集 / 媒体与阅读 / 工具 / 安全。不在这些组里的域会落到末尾的「其他」组 —— 不是丢了。</li>\n<li><strong>顶部搜索框</strong>直接输关键词（中英文都行，不区分大小写）。输 <code>api</code>、<code>rss</code>、<code>deepseek</code> 的小写也能命中。搜索范围包含<strong>域名、域描述，以及设置行的名称和说明</strong> —— 所以搜「摘要」能直接找到自动摘要那一组。</li>\n<li>点一个域，右边出它的设置页，按组分成一张张卡。</li>\n<li>有些设置行的<strong>标题上带说明</strong>：鼠标停在标题上会出浮窗（触屏就点一下标题）。没有浮窗 = 这行没有补充说明，不是坏了。</li>\n<li>改完直接生效。少数几行（比如数据存储路径、知识盒的自动关联）会提示你<strong>重载插件</strong>。</li>\n</ol>\n<h3>手机上的样子</h3>\n<p>手机上是<strong>全屏推入式两页</strong>：先看到搜索框和域列表，点进去是那个域的设置页，返回键弹回上一页。不是电脑那种左右分栏。</p>\n<h2>数据放在哪</h2>\n<p>设置面板本身<strong>不存数据文件</strong> —— 它只是各域设置的<strong>入口</strong>，设置值存在它们各自该在的地方：</p>\n<table><thead><tr><th>位置</th><th>里面是什么</th><th>你要留意什么</th></tr></thead><tbody><tr><td>插件数据目录的 <code>data.json</code></td><td>绝大多数域的设置值</td><td>换电脑不跟着库走</td></tr><tr><td>各域自己的数据文件（在数据目录里）</td><td>少数存在域数据里的设置（如小橘的部分配置）</td><td>跟着库走</td></tr></tbody></table>\n<blockquote>面板自己只有两行设置（布局 / 主题），排在「通用」页最前面。</blockquote>\n<h2>可以调什么（设置项）</h2>\n<p>本域自己的设置只有两行，在「通用」页最前面：</p>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>布局</td><td>经纬</td><td>面板布局（目前只有这一种）</td></tr><tr><td>主题</td><td>晨昏</td><td>面板主题，跟随 Obsidian 的亮 / 暗</td></tr></tbody></table>\n<p>其余所有设置都在各自域那一页 —— 见各域章节。</p>\n<h2>有哪些命令</h2>\n<table><thead><tr><th>命令名（去命令面板搜这个）</th><th>做什么</th></tr></thead><tbody><tr><td>设置面板</td><td>打开设置面板</td></tr></tbody></table>\n<h2>要注意的地方</h2>\n<ul>\n<li><strong>搜索是即时的</strong>：每敲一键都会重筛导航与列表。域多时略有跳动是正常的。</li>\n<li><strong>域名字后面那个小徽标要等一下</strong>：没进过的域先显示一个点，进去一次（或后台预载完）才变成具体数字。显示横杠 <code>—</code> 的域是<strong>没有设置项</strong>的域（比如附件搬移、自动摘要）。</li>\n<li><strong>自动摘要没有独立页面</strong>：它的设置在「剪藏本」页的「自动摘要」组里。</li>\n<li><strong>手机上没有左右分栏</strong>，是推入式两页，返回键的行为是「弹回上一页」。</li>\n<li><strong>个别设置改完要重载插件</strong>，面板会提示你 —— 看到提示就照做，不然改了不生效。</li>\n</ul>\n<h2>常见问题</h2>\n<p><strong>怎么快速找到某个设置？</strong></p>\n<p>顶部搜索框直接输设置名或关键词（中英文都行，不区分大小写）。桌面端命中后左栏导航会跟着一起过滤。</p>\n<p><strong>为什么某个域后面显示「—」？</strong></p>\n<p>那个域没有设置项（比如附件搬移、自动摘要）。自动摘要的设置要去找「剪藏本」。</p>\n<p><strong>面板里改的和 ⚙️ 弹窗里改的会冲突吗？</strong></p>\n<p>不会。同一份数据，两个入口写的是同一处。</p>\n<p><strong>打开面板有点慢？</strong></p>\n<p>第一次进某个域要现场加载它的设置（有些域要读盘）。同一会话里加载过一次就会记住，之后再进就快了。</p>\n<p><strong>主题能跟随系统亮暗吗？</strong></p>\n<p>能 ——「晨昏」这个主题就是跟随 Obsidian 亮暗的定义。</p>\n<p><strong>为什么我搜一个词什么都没搜到？</strong></p>\n<p>搜的是域名、域描述和设置行的名称与说明。如果你想找的功能本身没有设置项（比如附件搬移），就搜不到 —— 那类域在列表里会显示「—」。</p>","no":11},{"id":"ai","title":"AI","group":"智能","tags":["ai","config"],"domain":"ai","html":"<blockquote>插件身上所有「会思考」的功能，都要在这里领一把钥匙 —— 配一次，各处通用</blockquote>\n<h2>什么时候用它</h2>\n<p>只要你打算用带 AI 的功能，就先来这里配一次。具体是这些：剪藏摘要与标签、脸谱人物画像、第二大脑的对话、知识盒的关联判定与挂载建议、知识盒视频转文字。</p>\n<p>如果你一个都不打算用，整章可以跳过 —— 插件的其余部分（记日记、收藏、影院、书库这些）不依赖 AI，不配也能照常用。</p>\n<p>配一次的原则很简单：<strong>选一家服务商 + 填一个密钥</strong>，模型名留空就行（插件会用这家服务商的默认模型）。</p>\n<p>它跟「设置面板」的分工：设置面板是所有域设置的入口，这一页是 AI 自己的那一页 —— 进设置面板后往左栏的「智能」组里找「AI」。</p>\n<h2>怎么用</h2>\n<ol>\n<li>打开<strong>设置面板</strong>（命令面板搜「设置面板」），左栏「智能」组里点 <strong>AI</strong>。</li>\n<li>页面从上到下是五张卡：<strong>LLM / Embedding / JEV / 语音转写 / 数据源凭据</strong>。先只管第一张。</li>\n<li>在 <strong>LLM</strong> 卡里点 <strong>AI 服务商</strong>，选你要用的一家（DeepSeek、智谱 Plan、Ollama 三选一）。</li>\n<li>选完，下面会自动出现这一家的<strong>密钥</strong>行（只显示当前选中那家的）。把密钥粘进去 —— 输入框是掩码的，右边的眼睛可以切回明文核对。</li>\n<li>点密钥行左边的<strong>测试</strong>。按钮上会直接出结果：转圈是正在试，绿色 ✓ 是通了，红色 ✕ 是不通。通了这一步就结束了。</li>\n<li><strong>模型名称</strong>那一行留空。留空就是「用这家服务商的默认模型」。只有你明确想换某个模型时才填；不确定名字就点行内的<strong>获取模型名</strong>，从服务商接口拉一份列表出来选。</li>\n<li><strong>最大输出 token</strong> 也建议留空 —— 插件会按当前模型取它的官方上限，比手填更准。</li>\n</ol>\n<p>后面四张卡按需再说：</p>\n<ul>\n<li><strong>Embedding</strong>：只有要用「第二大脑」按意思找笔记时才需要。</li>\n<li><strong>JEV</strong>：只有要用判定类功能（比如知识盒的关联判定）时才需要；不填就沿用生成通道那套。</li>\n<li><strong>语音转写</strong>：知识盒把视频转成文字时用哪套引擎 —— 这需要你电脑上装好了对应的 Python 环境，见「要注意的地方」。</li>\n<li><strong>数据源凭据</strong>：影院补字段、B 站清晰度、豆瓣风控这几个外部凭据，用不到就不用填。</li>\n</ul>\n<h2>数据放在哪</h2>\n<p>AI 配置<strong>不写在你的库里</strong>，它存在插件自己的设置文件里（Obsidian 插件数据目录的 <code>data.json</code>）。</p>\n<table><thead><tr><th>位置</th><th>里面是什么</th><th>你要留意什么</th></tr></thead><tbody><tr><td>插件数据目录的 <code>data.json</code></td><td>你填的服务商、密钥、模型名等全部 AI 配置</td><td>换电脑时它<strong>不会</strong>跟着库走，得在新机器上重配一次</td></tr><tr><td>你的库</td><td>不存任何密钥</td><td>备份库不会把密钥带出去</td></tr></tbody></table>\n<blockquote>密钥在存储文件里是明文保存的。它保护的只是「屏幕上不被人瞄到」，不是磁盘加密。真要保密，就别让数据目录落到别人能碰的地方。</blockquote>\n<h2>可以调什么（设置项）</h2>\n<h3>LLM（生成通道）</h3>\n<p>出文字的那一档：写摘要、写画像、陪你聊天，都走这里。</p>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>AI 服务商</td><td>DeepSeek</td><td>切换后下面的密钥行会换成这一家的；每家的密钥、模型名、token 上限、思考档位是<strong>分开存</strong>的，切回来还是上次那份</td></tr><tr><td>各家密钥（DeepSeek 密钥 / 智谱 Plan 密钥 / Ollama 密钥）</td><td>空</td><td>只显示当前选中那家。没填 = 这家不可用，依赖 AI 的功能会失败或降级</td></tr><tr><td>模型名称</td><td>空</td><td>留空用该服务商的默认模型。这是自由文本，写错名字面板不会拦，会由服务端报错</td></tr><tr><td>最大输出 token</td><td>空</td><td>留空 = 按当前模型取官方上限。填得比模型真实上限大，服务端会直接拒绝整批请求</td></tr><tr><td>思考 reasoning</td><td>跟随</td><td>决定模型「想多久再答」。选项随服务商变：DeepSeek 是关/低/高/最高；智谱 Plan 没有关闭档，只有低/高/最高；Ollama 是关/低/中/高</td></tr></tbody></table>\n<p>行内按钮：密钥行有<strong>测试</strong>（发一次极小请求验证连通，按钮上直接显示转圈 / 绿✓ / 红✕），模型名行有<strong>获取模型名</strong>。</p>\n<h3>Embedding（嵌入通道）</h3>\n<p>管「把笔记变成一串数字，好按意思找」这件事 —— 只有第二大脑检索要用。</p>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>Ollama 本地 URL</td><td><code>http://localhost:11434</code></td><td>桌面端连本机 Ollama 的地址。手机端不读这一行（手机上填 localhost 必然不通）</td></tr><tr><td>Embedding 模型</td><td><code>bge-m3</code></td><td>换了模型，已建的检索索引全部作废，第二大脑下次打开会自己全量重建一遍</td></tr><tr><td>启用重排</td><td>开</td><td>开着的話，先捞一批候选、再精排一次，排得更准，代价是每次检索多算一点</td></tr><tr><td>重排走 Jev</td><td>关</td><td>打开后重排改走云端判定通道（需要 JEV 卡里配了密钥）</td></tr><tr><td>重排模型</td><td>空</td><td>留空用内置的 Qwen3-Reranker-4B。本地重排只在嵌入模型是 <code>qwen3-embedding:8b</code> 时才生效</td></tr></tbody></table>\n<h3>JEV（判定通道）</h3>\n<p>只做「判断」，不写文字 —— 比如知识盒判断两篇笔记是否真的相关。</p>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>Jev 服务商</td><td>Typesafe</td><td>Typesafe 与博查两家</td></tr><tr><td>Jev 密钥</td><td>空</td><td>空着就回落到生成通道那套；填上才由它接管判定。按服务商分开存</td></tr><tr><td>Jev 模型</td><td>空</td><td>留空跟随这家的缺省模型</td></tr></tbody></table>\n<h3>语音转写</h3>\n<p>知识盒把视频转成文字时用。</p>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>转写引擎</td><td>SenseVoice-Small</td><td>走 funasr，中文识别更好。换成 faster-whisper 会多出「Whisper 档位」一行</td></tr><tr><td>Whisper 档位</td><td>small</td><td>只有选了 faster-whisper 才出现。档位越高越准越慢</td></tr></tbody></table>\n<h3>数据源凭据</h3>\n<p>跟 AI 无关的三个外部凭据，凑在这一页一起管。</p>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>ApiZero Key</td><td>空</td><td>影院补评分/导演/主演/类型/地区/片长用。留空就用内置演职员信息兜底，能取到多少算多少</td></tr><tr><td>B站 Cookie</td><td>空</td><td>录入 B 站视频时能看到可用清晰度。桌面端可以点「从 CLI 导入」读本机已有的那份</td></tr><tr><td>豆瓣 Cookie</td><td>空</td><td>豆瓣被风控之后还能继续检索。被拦截时会以通知或表单提示报出来</td></tr></tbody></table>\n<h2>有哪些命令</h2>\n<p>这一域没有自己的命令 —— 它的入口只有设置面板里的「智能 → AI」这一页。</p>\n<h2>要注意的地方</h2>\n<ul>\n<li><strong>换服务商不会丢别家密钥</strong>：每家分开存。但面板上那几行显示的会变成当前这家的，别以为之前的被清掉了。</li>\n<li><strong>最大输出 token 是封顶值，不是每次消耗的量</strong>。填得比模型真实上限大，服务端会直接拒绝整个请求 —— 留空最省心。</li>\n<li><strong>模型名不校验</strong>：写错名字面板不拦，错误会从服务端那边报回来。</li>\n<li><strong>点「获取模型名」时别切服务商</strong>：拉取期间切了，这批结果作废，会提示你重新获取。</li>\n<li><strong>没有密钥时点「获取模型名」会直接失败</strong>：提示里会写明该去哪一行填。</li>\n<li><strong>手机上连不到你电脑的 localhost</strong>：Ollama 这类本机服务在移动设备上访问不到，要么填电脑的局域网地址，要么手机上干脆不用嵌入类功能。</li>\n<li><strong>视频转文字要靠你电脑上的 Python 环境</strong>：插件只是把任务交给外部命令行工具去跑。环境里缺包的话整批转写会失败，错误提示里会点名缺的是哪个包。</li>\n<li><strong>换 Embedding 模型 = 换数字的含义</strong>：旧索引全部作废，下次打开第二大脑会自动重建一遍（中途关掉也不会白干）。</li>\n<li><strong>密钥是明文存在文件里的</strong>：它保护的是屏幕可见性，不是磁盘加密。</li>\n</ul>\n<h2>常见问题</h2>\n<p><strong>不填密钥会怎样？</strong></p>\n<p>依赖 AI 的功能会失败或降级：摘要不生成、画像用不了、关联判定回落。但<strong>检索还能用</strong> —— 检索只用到嵌入模型，不需要 LLM 密钥。</p>\n<p><strong>换服务商要重新填密钥吗？</strong></p>\n<p>不用。每家的密钥单独存着，切回来就是上次那份。</p>\n<p><strong>最大输出 token 该填多少？</strong></p>\n<p>留空最省心。只有服务端明确报「超出上限」的错误时，才考虑手填一个更小的值。</p>\n<p><strong>JEV 和生成通道有什么区别？</strong></p>\n<p>生成通道出文本（摘要、画像、聊天回答）；JEV 只做判定（给它状态和问题，它给一个类型化的答案）。知识盒的关联判定走 JEV。</p>\n<p><strong>B站 Cookie 从哪来？</strong></p>\n<p>浏览器登录 B 站后，从请求头里复制 Cookie。桌面端可以点「从 CLI 导入」，直接读你本机已有的那份。手机上没有这个按钮。</p>\n<p><strong>「测试」按钮会花钱吗？</strong></p>\n<p>它发的是一次极小的真实请求，走的就是该服务商的正式接口，会产生极小的一次调用量。</p>\n<p><strong>本地 Ollama 需要密钥吗？</strong></p>\n<p>一般不需要。桌面端填地址就行，密钥行留空。</p>\n<p><strong>换电脑后 AI 配置还在吗？</strong></p>\n<p>不在。它存在插件数据目录里，不跟库走。新机器上要重新配一次密钥。</p>","no":12},{"id":"secondbrain","title":"第二大脑","group":"智能","tags":["ai","search"],"domain":"secondbrain","html":"<blockquote>给全库笔记做一份「按意思查」的目录 —— 你不记得原话也没关系，记得大概意思就能翻出来</blockquote>\n<h2>什么时候用它</h2>\n<p>笔记多到自己都记不清「那句话我到底写在哪篇」的时候用它。它把笔记切成小段、变成一串数字存起来，于是你能：</p>\n<ul>\n<li>按<strong>意思</strong>找笔记 —— 不用记得原话，输入你想表达的意思就能翻出来；</li>\n<li>看「跟这篇相似的还有哪些」；</li>\n<li>开一个对话，让它带着检索到的材料回答你，而不是凭空编。</li>\n</ul>\n<p>它跟「小橘聊天」的分工：第二大脑是<strong>检索工具</strong>（找笔记、带材料回答）；小橘是<strong>有记忆有性格的角色</strong>。想找东西用第二大脑，想聊聊天找小橘。</p>\n<p>它跟 Obsidian 自带搜索的分工：自带搜索找的是<strong>字面匹配</strong>（你输入什么词，它找含这个词的）；第二大脑找的是<strong>意思相近</strong>（你说「那篇讲拖延的」，它能找到通篇没出现「拖延」二字但讲的就是这个的笔记）。</p>\n<p>两个前提：<strong>要有一个能用的向量化服务</strong>（桌面端通常是本机跑的 Ollama，并已拉好模型），<strong>对话功能还需要配好 AI 通道</strong>（见「AI」章）。</p>\n<h2>怎么用</h2>\n<h3>按意思找笔记（参考）</h3>\n<ol>\n<li>命令面板搜 <strong>第二大脑参考</strong>，打开参考面板。</li>\n<li>在检索框里输入你想找的东西 —— 用大白话就行，不必是原话。</li>\n<li>停一下它就会自己搜，不用按回车。</li>\n<li>每条结果旁边会列出跟它相近的笔记，点一条直接跳过去。</li>\n</ol>\n<p>一次出多少条由设置里的「参考结果数 TopK」决定。</p>\n<h3>带着材料问（对话）</h3>\n<ol>\n<li>命令面板搜 <strong>第二大脑对话</strong>，打开对话面板。</li>\n<li>输入你的问题。插件会先从库里检索相关片段，把这些材料连同最近几轮对话一起交给模型。</li>\n<li>回答里可以点到它引用的原笔记。</li>\n</ol>\n<p>每次带多少条材料由「对话参考结果数」决定；它能记住多少轮对话由「最大历史记录」决定（默认 10 轮）。</p>\n<h3>重建索引</h3>\n<p>命令面板搜 <strong>重建索引</strong>。会先弹一个确认框，确认后面板切成进度视图，边跑边显示。</p>\n<p>什么时候需要重建：换了 Embedding 模型、笔记大批量改动后觉得搜不准、或者你刚把一批新目录加进检索范围想立刻生效。日常改几篇笔记不需要 —— 那是增量更新，自动就做了。</p>\n<h3>看本周知识动态</h3>\n<p>命令面板搜 <strong>本周知识动态</strong>，打开一份按周汇总的知识动态。</p>\n<h2>数据放在哪</h2>\n<table><thead><tr><th>文件</th><th>位置</th><th>里面是什么</th><th>你要留意什么</th></tr></thead><tbody><tr><td><code>secondbrain.json</code></td><td>数据目录（默认在你的库里，见「通用」章的数据存储路径）</td><td>索引的目录信息：收录了哪些文件、切成多少块、各自的修改时间</td><td>可以删，删了会触发重建，不会丢你的笔记</td></tr><tr><td><code>secondbrain.vec</code></td><td>同上</td><td>检索用的数据本体，<strong>二进制文件</strong></td><td>打不开也看不了，别手动编辑。跟着库一起复制走即可</td></tr></tbody></table>\n<p>本域不往你的库里另写笔记 —— 它只是给已有笔记建了一份索引。</p>\n<h2>可以调什么（设置项）</h2>\n<h3>外观</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>面板布局</td><td>对话</td><td>目前只有这一种，暂无可切换项</td></tr><tr><td>面板主题</td><td>石墨</td><td>目前只有这一种，暂无可切换项</td></tr></tbody></table>\n<h3>服务</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>额外检索目录</td><td>空（只检索知识盒的三个盒子）</td><td>三个盒子之外还要纳入检索的目录，可多选。勾了上层目录就等于把它底下所有子目录都勾上了。加进来的目录在<strong>下一轮增量更新</strong>时进库，不用重建整个索引</td></tr></tbody></table>\n<blockquote>连接地址、嵌入模型、重排这几行已经挪到「AI」页的 Embedding 组里了，不在这里。本域也没有「启用」开关 —— 插件启动即自动加载。</blockquote>\n<h3>检索</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>参考结果数 TopK</td><td>20</td><td>参考面板每次捞多少条候选（1–50）。调大：候选更多，代价是每次检索算得更多</td></tr><tr><td>对话参考结果数</td><td>20</td><td>对话时给模型塞多少条材料（1–50）。调大：模型看到的材料更多，答得更准，每次消耗的额度也更高</td></tr></tbody></table>\n<p>这两行<strong>各算各的</strong>：调大对话那行不会把参考面板的条数也带上去。</p>\n<h3>对话</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>最大历史记录</td><td>10</td><td>对话保留多少轮上下文（1–200）。超了就从最早的开始丢</td></tr></tbody></table>\n<h2>有哪些命令</h2>\n<table><thead><tr><th>命令名（去命令面板搜这个）</th><th>做什么</th></tr></thead><tbody><tr><td>第二大脑面板</td><td>打开主面板（看索引状态、从这里全量重建）</td></tr><tr><td>第二大脑参考</td><td>打开按意思检索的面板</td></tr><tr><td>第二大脑对话</td><td>打开对话面板</td></tr><tr><td>重建索引</td><td>先弹确认框，确认后重头算一遍全部索引</td></tr><tr><td>本周知识动态</td><td>打开按周汇总的知识动态</td></tr></tbody></table>\n<h2>要注意的地方</h2>\n<ul>\n<li><strong>必须有一个能用的向量化服务</strong>：检索和对话都依赖它。服务不在，重建和检索都起不来。桌面端通常是本机 Ollama（见「AI」页的 Embedding 组）。</li>\n<li><strong>换 Embedding 模型就必须重建</strong>，不是可选优化 —— 换了模型，旧的数据含义就不一样了，留着只会搜出垃圾。</li>\n<li><strong>把目录从「额外检索目录」里摘掉，已经算好的那部分不会立刻清掉</strong>。想让它彻底消失，得重建一次。</li>\n<li><strong>手机上的检索会降级</strong>：精确度不如桌面端，这是设备能力决定的。</li>\n<li><strong><code>.vec</code> 是二进制</strong>：别用手改。要排查问题请走「数据体检」。</li>\n<li>外观两行目前各只有一个选项，等于还没有可换的皮肤。</li>\n</ul>\n<h2>常见问题</h2>\n<p><strong>我刚写的笔记怎么搜不到？</strong></p>\n<p>它可能还没进索引（日常改动是增量更新，有延迟），或者不在检索范围内 —— 默认只检索知识盒的三个盒子（文献盒 / 卡片盒 / 主题盒），别的目录要加进「额外检索目录」。确认在范围内后，等下一轮更新，或手动执行一次「重建索引」。</p>\n<p><strong>重建要多久？</strong></p>\n<p>看笔记量。中途关掉窗口是安全的 —— 它会周期性把已完成的部分存下来，下次打开从进度接着算，不会从零开始。</p>\n<p><strong>换电脑后索引还能用吗？</strong></p>\n<p>把 <code>secondbrain.vec</code> 跟着库一起复制过去就行。如果中途换过嵌入模型，复制过去也会触发一次重建。</p>\n<p><strong>对话答得不准怎么办？</strong></p>\n<p>最常见的原因是材料不够。把「对话参考结果数」调大（给模型更多材料），或者把相关目录补进「额外检索目录」。</p>\n<p><strong>它和我手动写的双链冲突吗？</strong></p>\n<p>不冲突。自动关联只往笔记的 <code>related</code> 字段里加它找到的实质关联，你已经写好的链不会被重复添加。</p>\n<p><strong>搜出来的东西和我想的差很远？</strong></p>\n<p>先确认「参考结果数 TopK」是不是被调得太小 —— 候选太少时，就算后面排得再准也挑不出好的。</p>","no":13},{"id":"belongings","title":"归物本","group":"记录","tags":["record","belongings"],"domain":"belongings","html":"<blockquote>你买过、用过、卖过、丢过的每一件东西，都在这儿留一笔</blockquote>\n<h2>什么时候用它</h2>\n<p>想登记自己拥有的实体物品（或任何你想记账的东西），并追踪它从「购入」到「在库」再到「转卖 / 丢弃」的全过程时用。典型场景：</p>\n<ul>\n<li>想记清楚某件东西花了多少钱、哪天买的、算下来「每天成本」多高。</li>\n<li>想看一年里在哪些分类上花钱最多、哪些东西陪你最久。</li>\n<li>卖出或处理掉时，留下出离日期和售价，好算这笔钱回来的比例。</li>\n</ul>\n<p>数据全部存在本地的一个 JSON 文件里，不上传、不联网。（唯一跟网络有关的是填名称后点「AI 归类」—— 它按名称向模型问一句分类建议，失败也只是内联提示，不耽误你手填。）</p>\n<h2>怎么用</h2>\n<p>打开方式：命令面板搜 <strong>「归物本」</strong>，回车。面板从上到下是：<strong>标题头（写当前筛选名）→ KPI 行 → 状态筛选条 → 工具行 → 物品网格</strong>。</p>\n<h3>顶部 KPI 行（四块数字）</h3>\n<ul>\n<li><strong>在库件数</strong>：使用中和闲置的条目合计，点一下可以切到「资产」筛选。</li>\n<li><strong>在库投入</strong>：在库条目原价加起来是多少。</li>\n<li><strong>日均成本</strong>：算钱摊到每天的口径。</li>\n<li><strong>已离场 · 回收</strong>：已转卖 / 已丢弃的数量，以及转卖回来了多少钱。</li>\n</ul>\n<h3>状态筛选条</h3>\n<p>「全部 / 资产 / 使用中 / 闲置 / 已转卖 / 已丢弃」，每一档都带数量。<strong>再点一次当前选中的那档，就是取消筛选回到全部。</strong></p>\n<h3>工具行</h3>\n<ul>\n<li><strong>搜索</strong>：匹配名称、分类、描述，不区分大小写；框尾有个 <code>✕</code> 一键清词。</li>\n<li><strong>年份</strong>：按购买日期的年份过滤，另有「全部」。</li>\n<li><strong>排序</strong>：三档 —— 最近购入（默认）、投入最高、日均最高。</li>\n<li><strong>记一笔</strong>：直接弹出新增表单。</li>\n</ul>\n<h3>看／改一件东西</h3>\n<ul>\n<li><strong>电脑上</strong>：点卡片 = 详情弹窗，显示全部字段 + 状态流转条 + 「编辑 / 删除」按钮（点遮罩或按 ESC 关）。右键卡片 = 操作菜单：改状态 / 编辑 / 删除。</li>\n<li><strong>手机 / 平板上</strong>：点卡片 = 底部抽屉，内容一样；长按卡片 = 操作菜单。</li>\n</ul>\n<h3>状态怎么流转</h3>\n<p>在详情弹窗的流转条、或者右键菜单里点目标状态就行。规则：</p>\n<ul>\n<li>从「使用中 / 闲置」转到「已转卖 / 已丢弃」→ 自动把<strong>今天</strong>填成出离日期。</li>\n<li>已经是出离态再互转（比如转卖改成丢弃）→ 保留原来的出离日期，不会重置。</li>\n<li>转回在库态（使用中 / 闲置）→ 出离日期会被清空。</li>\n<li>每一次流转都可以撤销。</li>\n</ul>\n<h3>删除</h3>\n<p>删除<strong>不会二次确认</strong>，点下就执行，但右下角会弹一条「撤销」提示 —— <strong>点一下就原样恢复</strong>。所以误删先抢这条撤销，别急着去翻备份。</p>\n<h3>记一笔 / 编辑表单</h3>\n<p>标 * 的是必填：</p>\n<ol>\n<li><strong>名称\\</strong>* —— 比如「iPhone 15 Pro」。</li>\n<li><strong>分类\\</strong>* —— 手输或从「历史分类」的联想下拉里挑；选历史分类会自动带上它原来的图标。右边有 <strong>AI 归类</strong> 按钮：填了名称后点它，会按名称建议「分类 + 图标」。</li>\n<li><strong>购买价格\\</strong>* —— 数字，≥ 0。显示时的货币符号由「金额单位」决定（只是显示，不改存的值）。</li>\n<li><strong>购买日期\\</strong>* —— 日期选择器。</li>\n<li><strong>状态</strong> —— 四档平铺单选；选「已转卖 / 已丢弃」会展开出离记录那一行。</li>\n<li><strong>出离日期</strong> —— 只在出离态出现，默认今天。</li>\n<li><strong>转卖售价（可选）</strong> —— 只在「已转卖」出现；留空 = 不记售价（回本按 0 算）。</li>\n<li><strong>描述（可选）</strong> —— 规格、颜色、购买原因等。</li>\n</ol>\n<p>保存时会校验，不通过就在表单里红字提示，不会写盘：</p>\n<ul>\n<li>名称、分类、购买日期是必填的。</li>\n<li>价格必须是 ≥ 0 的有效数字，且不能超过一万亿（超了会提示你多输了几位）。</li>\n<li>出离日期不能早于购买日期。</li>\n<li>转卖售价填了的话，同样得是 ≥ 0 的有效数字，且不超过一万亿。</li>\n</ul>\n<p>快捷键：<code>Ctrl/⌘ + Enter</code> 提交（单行输入框里直接按 Enter 也提交；多行文本框里 Enter 是换行）。<strong>关闭表单时如果改过内容，会先问你「放弃修改？」。</strong></p>\n<h3>年度报告</h3>\n<p>面板工具行上的「年度报告」按钮，或者命令面板里的 <strong>「归物本年度报告」</strong>，打开一整页报告（<strong>只读</strong>，不改动任何数据）。用 <code>‹ ›</code> 在有记录的年份之间切换。报告有五段：</p>\n<ol>\n<li><strong>购入与离场概览</strong> —— 购入件数、购入金额、离场件数、转卖回血。</li>\n<li><strong>月度花销走势</strong> —— 当年的花销按月汇总，固定 12 格，没花钱的月份补零。</li>\n<li><strong>分类占比</strong> —— 当年花销按分类汇总，取前 8 名，其余并成一格「其他」。</li>\n<li><strong>日均成本走势</strong> —— 各月末时点的全库日均成本，固定 12 格；没到的月份是空档。</li>\n<li><strong>陪伴最久榜</strong> —— 前 5 名（当年的按今天截止，往年的按年末截止）。</li>\n</ol>\n<h2>数据放在哪</h2>\n<table><thead><tr><th>位置</th><th>里面是什么</th><th>你要留意什么</th></tr></thead><tbody><tr><td>数据目录下的 <code>belongings.json</code></td><td>全部物品条目</td><td>具体目录由「共享 JSON 数据目录」决定。备份时把这一个文件带上就行</td></tr></tbody></table>\n<p>每条物品记着：名称、分类、分类图标、购买价格、购买日期、当前状态、描述、录入和更新时间，以及出离态才有的出离日期、转卖售价。</p>\n<p>有几件事知道一下比较好：</p>\n<ul>\n<li><strong>状态值用的是中文</strong>（使用中 / 闲置 / 已转卖 / 已丢弃）。你要手改这个文件，写成别的值会让它认不出「已经离场」这件事，统计跟着失真。</li>\n<li><strong>出离日期和转卖售价跟着状态走</strong>：只有在「已转卖 / 已丢弃」时才会写出去；转卖售价还要求状态正好是「已转卖」。状态转回在库，这两项会被清掉。</li>\n<li><strong>购买价格保存时会四舍五入到两位小数。</strong></li>\n<li><strong>数据文件万一出问题不会丢</strong>：结构异常时会按空库继续并把原文件留档，不会静默丢掉你的数据。</li>\n</ul>\n<h2>可以调什么（设置项）</h2>\n<h3>外观</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>面板布局</td><td>大字报</td><td>只有这一档，暂无别的可选</td></tr><tr><td>面板主题</td><td>暖白</td><td>只有这一档，暂无别的可选</td></tr></tbody></table>\n<h3>显示</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>默认状态筛选</td><td>全部</td><td>打开面板时选中哪一档：全部 / 使用中 / 闲置 / 已转卖 / 已丢弃</td></tr><tr><td>默认排序</td><td>最近购入</td><td>另有「投入最高」「日均最高」</td></tr><tr><td>金额单位</td><td>￥</td><td>另有「元」「$」「无符号」。<strong>只影响显示</strong>，不动存起来的价格数值</td></tr></tbody></table>\n<h3>记一笔</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>新增物品默认状态</td><td>使用中</td><td>「记一笔」时的初始状态，只能在「使用中 / 闲置」里选，出离态不能当默认</td></tr></tbody></table>\n<blockquote>这几个「默认」管的是<strong>下次打开面板时的初始状态</strong>。你在面板里临时换的状态、排序、年份只作用这一次，关掉再开就回到设置值了。</blockquote>\n<h2>有哪些命令</h2>\n<table><thead><tr><th>命令名（去命令面板搜这个）</th><th>做什么</th></tr></thead><tbody><tr><td>归物本</td><td>打开归物本面板</td></tr><tr><td>加物品</td><td>直接弹出「记一笔」表单</td></tr><tr><td>归物本年度报告</td><td>打开年度资产报告页（面板没开也能直接打开）</td></tr></tbody></table>\n<h2>要注意的地方</h2>\n<ul>\n<li><strong>分类和图标是临时算出来的，不存文件。</strong> 每次打开面板都由条目实时汇总成分类列表。所以你手动去改那个 JSON 里的分类／图标字段是没用的 —— 真正该改的是每条物品自己的「分类」和「图标」。</li>\n<li><strong>价格上限一万亿。</strong> 再大就不收了（这是为了避免超大数字落盘时变成空值，把你的钱悄悄弄丢）。</li>\n<li><strong>日期卡得比较严。</strong> 像 <code>2026-13-45</code> 这种不存在的日期不会被自动纠正成合理日期，而会被当作「没有出离锚点」—— 天数会一路算到今天。</li>\n<li><strong>日均成本是怎么算的</strong>（大致口径）：全库日均 =（原价总和 − 转卖回本总和）÷ 累计持有天数总和；在库投入 = 使用中 + 闲置的原价合计；单件日均 = 价格 ÷ 已经用了多少天（用 0 天就按全价算）。已经离场的条目，天数算出离日期为止。</li>\n<li><strong>删除免确认，但可撤销。</strong> 撤销窗口一过就是真的没了，别指望还有二次确认保你。</li>\n<li><strong>年度报告是只读的</strong>，看归看，改不了这份数据文件。</li>\n<li><strong>面板开着的时候</strong>，数据文件被别的程序改了，列表会自己刷新。</li>\n</ul>\n<h2>常见问题</h2>\n<p><strong>分类旁的图标是怎么来的？</strong></p>\n<p>两个来源：一是从历史分类下拉里选到已有分类时，它会带上那个分类原来的图标；二是「AI 归类」按名称给建议。没匹配到图标的分类，会退回显示分类名的第一个字。</p>\n<p><strong>我手动改了数据文件，分类列表怎么没变？</strong></p>\n<p>因为分类列表是打开面板时临时从物品里汇总出来的，不写进文件。想改分类就得改每条物品自己的分类字段。</p>\n<p><strong>我填了出离日期 / 转卖售价，详情里怎么不显示？</strong></p>\n<p>这两个字段只在状态是「已转卖 / 已丢弃」时才写、才显示；售价还额外要求状态正好是「已转卖」。先确认状态切过去了。</p>\n<p><strong>面板里选了某状态，关掉再开怎么变回「全部」了？</strong></p>\n<p>面板里的选择只是本次临时态。想让打开时就固定某一档，去设置里改「默认状态筛选」。</p>\n<p><strong>不小心删了一条，还能找回来吗？</strong></p>\n<p>删除后右下角马上会弹一条带「撤销」的提示，点一下就原样恢复。要是已经错过这个窗口，就只能靠你自己的备份了。</p>\n<p><strong>年度报告里某一年的图表是空的，是不是坏了？</strong></p>\n<p>不一定是。那一年如果没有任何购入记录（只有转卖或丢弃），「月度花销走势」和「分类占比」会显示空态提示 —— 确实没花钱可画，这是正常的。</p>\n<p><strong>很早之前录入的分类带 emoji 前缀，现在还能用吗？</strong></p>\n<p>能用。带 emoji 前缀的旧分类在载入时会自动剥掉前缀、转成纯文字分类并补上图标字段，你不用手动整理。</p>","no":14},{"id":"diary","title":"日记本","group":"记录","tags":["record","diary"],"domain":"diary","html":"<blockquote>一面按时间倒着排的墙：日记、影视、信、书全糊在同一面墙上</blockquote>\n<h2>什么时候用它</h2>\n<p>晚上想记一笔今天做了什么，或者想翻出去年同一天你在干嘛的时候用它。</p>\n<p>它不只是日记本 —— 这面墙<strong>同时把四类内容混在一起</strong>，统一按日期时间倒着排：</p>\n<table><thead><tr><th>内容</th><th>从哪个目录读</th><th>什么条件才会出现在墙上</th></tr></thead><tbody><tr><td>日记</td><td>日记文件夹（默认 <code>我的/日记</code>）</td><td>正常条目文件就进</td></tr><tr><td>影视</td><td>影视文件夹（默认 <code>我的/影视</code>，<strong>和影院是同一个目录</strong>）</td><td>写了影评或观影日期的才进，否则跳过</td></tr><tr><td>信</td><td>信件文件夹（默认 <code>我的/信</code>）</td><td>只读文件跳过</td></tr><tr><td>书</td><td>书库文件夹（默认 <code>书库</code>）</td><td>有读完日期或开读日期的才进</td></tr></tbody></table>\n<p>所以它和影院、书库是照着同一批笔记做的两面镜子：那边新增一条，这面墙上就多一条。</p>\n<h2>怎么用</h2>\n<ol>\n<li>打开命令面板，搜<strong>「日记本」</strong>，回车。默认出来的就是<strong>媒体墙</strong>布局。</li>\n<li>面板顶部有一排按钮：</li>\n</ol>\n<ul>\n<li><strong>✏️ 写日记</strong>：弹出写作窗，保存完墙会自动刷新，新条马上就在上面；</li>\n<li><strong>🔍 搜索</strong>：按关键词筛这面墙上的条目；</li>\n<li><strong>🗓 按年月跳转</strong>：滚轮挑年份，直接跳到那一年（年份范围取自你现有的数据）；</li>\n<li><strong>✕ 关闭面板</strong>。</li>\n</ul>\n<ol>\n<li>墙上每条从上往下按时间排，点一条就跳到对应的笔记。</li>\n<li>不用非得在插件里新建 —— 你手动往日记文件夹里放文件、从别处移进来，面板也会自动刷新。</li>\n<li>笔记里引用的图片、视频、音频会按扩展名自动识别并显示；用 Obsidian 正常的写法引用即可（写死绝对路径的播不出来）。</li>\n</ol>\n<h2>数据放在哪</h2>\n<table><thead><tr><th>位置</th><th>里面是什么</th><th>你要留意什么</th></tr></thead><tbody><tr><td><code>我的/日记/</code></td><td>日记条目，<strong>一条一个文件</strong></td><td>文件名是「年月日时分」六位六位排下来，如 <code>2609261705</code> 就是 2026 年 9 月 26 日 17:05；同一分钟写了多条会追加 <code>-2</code>、<code>-3</code> 这样的后缀</td></tr><tr><td><code>我的/影视/</code>（可改）</td><td>影视条目</td><td>和影院共用同一个目录，改一处两边一起变</td></tr><tr><td><code>我的/信/</code>（可改）</td><td>信件</td><td>—</td></tr><tr><td><code>书库/</code></td><td>书目笔记</td><td>只有填了读完日期或开读日期的才会上墙</td></tr></tbody></table>\n<p><strong>本域不写独立的数据文件</strong> —— 墙上显示的一切都来自笔记本体。所以：你的日记就是普通的 <code>.md</code> 文件，换台电脑只要笔记还在就还在；备份的话备份这些目录就够了。</p>\n<p>每条笔记开头的信息区（<code>---</code> 之间那几行）里有 <code>date</code> 和 <code>type</code> 两行，面板靠它们认时间和归类。</p>\n<h2>可以调什么（设置项）</h2>\n<h3>外观</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>面板布局</td><td>媒体墙</td><td>只有这一档，暂无别的可选</td></tr><tr><td>面板主题</td><td>画廊白</td><td>只有这一档，暂无别的可选</td></tr></tbody></table>\n<h3>目录</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>日记文件夹</td><td><code>我的/日记</code></td><td>日记从这里读，改完马上重读，不用重启</td></tr><tr><td>信件文件夹</td><td><code>我的/信</code></td><td>信件从这里读，同样即时生效</td></tr></tbody></table>\n<h3>显示</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>默认日期取自文件</td><td>关</td><td>关着时写日记默认填「现在」；打开后，如果当前正开着一篇日记，写作窗里的默认日期会改成那篇的日期</td></tr></tbody></table>\n<h2>有哪些命令</h2>\n<table><thead><tr><th>命令名（去命令面板搜这个）</th><th>做什么</th></tr></thead><tbody><tr><td>日记本</td><td>打开日记本面板（那面墙）</td></tr><tr><td>写日记</td><td>打开写作窗，写一条新日记</td></tr></tbody></table>\n<h2>要注意的地方</h2>\n<ul>\n<li><strong>时间藏在文件名里，所以别随手改名。</strong> 你手动把 <code>2609261705</code> 改成别的，这条日记在时间轴上的位置会跟着变 —— 它不看你什么时候写的，只看文件名。</li>\n<li><strong>一条一个文件，不是一天一个文件。</strong> 同一天写三条就是三个文件，墙上是三条独立条目。跟「一天一页、往里追加」那种日记不是一回事。</li>\n<li><strong>四类内容共墙，但各有门槛。</strong> 影视要有影评或观影日期、书要有读完或开读日期、只读信件直接跳过 —— 不满足就看不见，不是坏了。</li>\n<li><strong>影视目录和影院共用。</strong> 你在「影院」章改了影视文件夹，日记本这边跟着变。</li>\n<li><strong>改文件夹不等于搬家。</strong> 换了「日记文件夹」的指向，旧目录里的日记不会自动过来，还留在原地。</li>\n<li>外观那两项目前各自只有一个选项，改不出变化是正常的。</li>\n</ul>\n<h2>常见问题</h2>\n<p><strong>我写的日记怎么没出现在墙上？</strong></p>\n<p>先看三件事：文件是不是在「日记文件夹」里、文件名是不是「年月日时分」那种形式、笔记开头的信息区里有没有 <code>date</code> 和 <code>type</code> 两行。</p>\n<p><strong>影视和书为什么有的能看到、有的看不到？</strong></p>\n<p>上墙有门槛：影视要写了影评或观影日期，书要有读完日期或开读日期。差的那些去笔记里补上日期就行。</p>\n<p><strong>同一天写了好几条日记，是怎么存的？</strong></p>\n<p>就是好几个文件。同一分钟写的会带 <code>-N</code> 后缀区分，墙上是各自独立的一条。</p>\n<p><strong>「写日记」弹窗里的日期能改成别的日子吗？</strong></p>\n<p>能，随便改。如果你当前正开着一篇日记，并且开了「默认日期取自文件」，弹窗里的日期会自动预填成那篇的日期。</p>\n<p><strong>改了文件夹以后，旧日记去哪了？</strong></p>\n<p>留在旧目录。插件不会自动搬，它只认新目录。</p>\n<p><strong>换台电脑日记还在吗？</strong></p>\n<p>在。日记就是普通的 <code>.md</code> 文件，跟着你的库走，同步过去即可。</p>","no":15},{"id":"memo","title":"备忘录","group":"记录","tags":["record","memo"],"domain":"memo","html":"<blockquote>按场景收着待办，还能把一条备忘钉到某篇笔记的具体位置上</blockquote>\n<h2>什么时候用它</h2>\n<p>记「等会儿要做的事」时用它。它比 Obsidian 自带的待办多两件事：</p>\n<ul>\n<li><strong>场景</strong>：条目按场景分组（默认是剪藏 / 工作 / 学习 / 生活 / 代码 / 公开课），可以按场景筛着看；</li>\n<li><strong>能绑到笔记</strong>：一条备忘可以指向某篇笔记的具体位置，下次你打开那篇笔记，它会跳出来提醒你。</li>\n</ul>\n<p>适合：临时冒出来、怕忘的待办。</p>\n<p>不适合：需要整批排进长期记忆里去背的东西 —— 那用「复习计划」更合适。</p>\n<h2>怎么用</h2>\n<p>三种记法，最终都进同一份数据，区别只在「绑不绑笔记」：</p>\n<ol>\n<li><strong>打开面板慢慢记</strong>：命令面板搜 <strong>「备忘录」</strong>，打开面板后手动加。</li>\n<li><strong>不想开面板</strong>：命令面板搜 <strong>「加备忘录」</strong>，一步加一条。</li>\n<li><strong>想让它在某篇笔记里提醒你</strong>：先打开那篇笔记，然后执行 <strong>「给当前笔记记一笔」</strong>。这样记出来的条目会带上笔记位置，以后打开那篇笔记就会提醒。</li>\n</ol>\n<p>面板里的操作：</p>\n<ol>\n<li>左侧（或上方）选场景、切筛选 —— 默认开哪个场景、默认怎么排、要不要把已完成的也列出来，都在设置里配。</li>\n<li>勾选完成 → 自动记下完成时间。</li>\n<li>每条条目上可以跳到绑定的笔记、复制链接，或者删除。</li>\n</ol>\n<h2>数据放在哪</h2>\n<table><thead><tr><th>位置</th><th>里面是什么</th><th>你要留意什么</th></tr></thead><tbody><tr><td>数据目录下的 <code>memo.json</code></td><td>全部备忘条目</td><td>跟着库走，换设备把库同步过去就带走了；也能跟着库同步到手机</td></tr></tbody></table>\n<p>值得知道的一点：<strong>备忘不会写进你的笔记里。</strong> 绑定笔记的时候，它只是记下了「哪篇笔记 + 哪个位置」这两个信息，不会往你的笔记正文里插任何东西。好处是笔记干干净净，代价是你把那篇笔记删了，这条备忘就悬空了。</p>\n<p>每条备忘大致包含：内容、场景、优先级（重要 / 次要）、创建时间和完成时间（没完成就是空）、到期时间，以及可选的「绑定的笔记与位置」和「关联的笔记或网址」。</p>\n<p><strong>场景列表</strong>：默认是内置六个（剪藏 / 工作 / 学习 / 生活 / 代码 / 公开课）。场景那栏留空，就会自动回到这六个。</p>\n<h2>可以调什么（设置项）</h2>\n<h3>外观</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>面板布局</td><td>清单</td><td>只有这一档，暂无别的可选</td></tr><tr><td>面板主题</td><td>编辑部</td><td>还有「纸感手账」可选，切换即时生效</td></tr></tbody></table>\n<h3>显示</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>打开默认场景</td><td>上次停留</td><td>决定打开面板时默认停在哪个场景。还可以固定成「全部」「今日」「重要」，或任一自定义场景</td></tr><tr><td>默认排序方式</td><td>紧急优先</td><td>另有「仅按到期时间」「按创建时间」可选</td></tr><tr><td>默认显示已完成</td><td>关</td><td>打开时要不要把已完成的那些一起列出来</td></tr><tr><td>已完成显示范围</td><td>近 30 天</td><td>显示已完成条目时往前看多久：近 7 天 / 近 30 天 / 近 90 天 / 全部</td></tr></tbody></table>\n<h3>新建</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>新条目默认优先级</td><td>次要</td><td>新建表单里预填的优先级，另有「重要」</td></tr><tr><td>新条目默认场景</td><td>第一个场景</td><td>新建表单里预填的场景</td></tr></tbody></table>\n<h3>场景列表</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>自定义场景列表</td><td>空</td><td>用逗号分隔填你自己的场景名（中文逗号也认）。<strong>留空就回到内置六个默认场景</strong></td></tr></tbody></table>\n<h3>提醒</h3>\n<table><thead><tr><th>设置名</th><th>默认是什么</th><th>改了会怎样</th></tr></thead><tbody><tr><td>启动时自动弹出</td><td>开</td><td>打开 Obsidian 就自动弹备忘录面板提醒到期事项。嫌吵就关掉</td></tr><tr><td>打开笔记自动提醒</td><td>开</td><td>打开某篇有备忘绑定的笔记时，弹出面板并定位到那条备忘。不想被弹就关掉</td></tr></tbody></table>\n<h2>有哪些命令</h2>\n<table><thead><tr><th>命令名（去命令面板搜这个）</th><th>做什么</th></tr></thead><tbody><tr><td>备忘录</td><td>打开备忘录面板</td></tr><tr><td>加备忘录</td><td>直接加一条（不绑笔记）</td></tr><tr><td>给当前笔记记一笔</td><td>加一条并绑到当前打开的那篇笔记</td></tr></tbody></table>\n<h2>要注意的地方</h2>\n<ul>\n<li><strong>备忘不写进笔记，绑的就是个位置。</strong> 所以删了被绑定的笔记，那条备忘还躺在这儿，但点过去会找不到地方。</li>\n<li><strong>场景列表留空不等于没场景。</strong> 清空会回退到内置六个默认场景。</li>\n<li><strong>「打开笔记自动提醒」默认开着。</strong> 每次打开有绑定的笔记都会弹面板 —— 觉得烦就在「提醒」组里关掉它。</li>\n<li><strong>完成时间只记一次。</strong> 勾上完成写时间，取消完成清掉，再勾完成重新写。</li>\n<li>数据全在 <code>memo.json</code> 一个文件里，备份和迁移都只需要管这一个文件。</li>\n</ul>\n<h2>常见问题</h2>\n<p><strong>怎么才能让某条备忘在打开某篇笔记时提醒我？</strong></p>\n<p>用<strong>「给当前笔记记一笔」</strong>，不要用「加备忘录」—— 只有前者会把笔记位置记上去，打开那篇笔记时才会有提醒。</p>\n<p><strong>能不能自定义场景？</strong></p>\n<p>能。在设置里找到「自定义场景列表」，用逗号分隔写你自己的场景名。想恢复默认就清空它。</p>\n<p><strong>已完成的条目怎么不见了？</strong></p>\n<p>看两处：「默认显示已完成」是不是关着，「已完成显示范围」是不是设得太短。前者决定列不列，后者决定往前看多少天。</p>\n<p><strong>一打开 Obsidian 就弹面板，太打扰了？</strong></p>\n<p>关掉「启动时自动弹出」。</p>\n<p><strong>备忘能同步到手机上吗？</strong></p>\n<p>能。数据在 <code>memo.json</code> 里，跟着库一起同步。</p>\n<p><strong>我删了那篇笔记，备忘会跟着没吗？</strong></p>\n<p>不会自动消失，但会变成「指向了不存在的位置」，跳不过去了。需要你自己删掉这条备忘。</p>","no":16},{"id":"people","title":"脸谱","group":"记录","tags":["record","people"],"domain":"people","html":"<blockquote>把聊天记录变成一份「人物档案」—— 这个人什么样、你俩之间发生过什么</blockquote>\n<h2>什么时候用它</h2>\n<p>你手上有导出来的微信聊天记录，想把它变成一份能读、能留的人物档案时用它。插件把聊天流读进来，交给 AI 提炼，最后给出<strong>双卷画像</strong>：</p>\n<ul>\n<li>卷一《其人》—— 这个人是什么样；</li>\n<li>卷二《我们》—— 你俩的关系；</li>\n<li>再加一条关系时间线。</li>\n</ul>\n<p>适合：想认真梳理某段关系，或者给一个重要的人留一份记录。</p>\n<p><strong>不适合拿它做聊天备份</strong> —— 它不把图片、语音、视频本身搬进库，只把媒体转成文字进预览。原始文件始终留在你自己的导出目录里。</p>\n<p>它跟「日记本」的分工：日记本记的是<strong>你自己</strong>的日子；脸谱记的是<strong>某一个人</strong>，素材来自你俩的聊天。</p>\n<h2>怎么用</h2>\n<h3>一、准备数据</h3>\n<p>用微信聊天导出工具，把数据导出成这样的结构 —— <strong>一个人一个目录</strong>：</p>\n<pre class=\"code\" data-lang=\"text\"><code>&lt;数据根目录&gt;/\n  ├─ 张三/\n  │   ├─ chat.json        ← 消息流（必须）\n  │   ├─ voice.json       ← 语音转写（可选，兼容兜底）\n  │   ├─ image_desc.json  ← 图片描述（可选，兼容兜底）\n  │   └─ avatar.jpg       ← 头像（可选）\n  └─ 李四/\n      └─ chat.json</code></pre>\n<p>这个目录<strong>放在库外面</strong>就行（它是你的原始数据，本来也不该进库）。</p>\n<h3>二、告诉插件数据在哪</h3>\n<ol>\n<li>打开<strong>设置面板</strong> → 记录 → <strong>脸谱</strong>。</li>\n<li>在<strong>数据根目录</strong>那一行<strong>粘贴完整路径</strong>。因为数据在库外（库外的目录没法用库内选择器挑），所以这里是手填的一行文本框，没有浏览按钮。</li>\n<li>如果你的导出目录下有多个微信账号文件夹，在<strong>微信账号目录</strong>填其中一个；<strong>留空会自动探测</strong>，一般不用管。</li>\n</ol>\n<h3>三、导入</h3>\n<ol>\n<li>命令面板搜 <strong>脸谱数据源</strong>，执行。它会立刻去扫你刚填的目录。</li>\n<li>在弹出的列表里<strong>勾选要导入的人</strong>（默认一个都不勾）。想连群聊一起就先去设置里打开<strong>群聊纳入列表</strong>（默认关）。</li>\n<li>点<strong>导入所选</strong>。导入的是聊天素材，不会顺手出画像。</li>\n<li>想接着出画像，在弹窗里点<strong>画脸谱</strong> —— 它会关掉弹窗、回到面板跑生成。</li>\n</ol>\n<blockquote>正在生成脸谱的时候，数据源弹窗打不开：这期间聊天数据还在变，不画半截素材。等这批结束再开。</blockquote>\n<h3>四、生成画像</h3>\n<ol>\n<li>导入完成<strong>不会自动出画像</strong> —— 需要在弹窗里点<strong>画脸谱</strong>。这是刻意的：画像要走 AI，每批都消耗真实调用，所以交给你决定。</li>\n<li>它会分批采集素材（事件、原话、场景、特质、兴趣、未竟之事六类），再汇总成双卷画像与关系时间线。这一步需要<strong>配好 AI 通道</strong>（见「AI」章）。</li>\n</ol>\n<h3>五、看结果</h3>\n<p>命令面板搜 <strong>脸谱</strong> 打开面板。左边是联系人列表，选中一个，右边可以看三样：</p>\n<ul>\n<li><strong>预览</strong> —— 按时间排的聊天流。语音以转写文本、图片以描述文本、视频以时长标签进入（这四类分别可以在设置里关掉）；</li>\n<li><strong>画像</strong> —— 卷一《其人》与卷二《我们》；</li>\n<li><strong>关系时间线</strong>。</li>\n</ul>\n<blockquote>换了数据目录、或者外部数据更新了，都要<strong>重新导入一次</strong>才会看到新内容。改设置不会自动重读。</blockquote>\n<h2>数据放在哪</h2>\n<h3>你自己准备的（库外）</h3>\n<table><thead><tr><th>路径</th><th>里面是什么</th></tr></thead><tbody><tr><td><code>&lt;数据根目录&gt;/&lt;联系人&gt;/chat.json</code></td><td>消息流：每条含时间、类型、说话人、文本等</td></tr><tr><td><code>&lt;数据根目录&g
