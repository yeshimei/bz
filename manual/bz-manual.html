状态流转</h3>\n<p>在详情弹窗的流转条、或右键菜单里点目标状态即可。规则：</p>\n<ul>\n<li>从在库态转入「已转卖 / 已丢弃」→ 自动写入当天为 <code>exit_date</code>（出离封口）（<code>src/belongings/ui.ts:752</code>）。</li>\n<li>已是出离态再互转（如转卖→丢弃）→ 保留原封口日期，不重置（<code>src/belongings/ui.ts:751</code>）。</li>\n<li>转回在库态 → <code>exit_date</code> 清空（<code>src/belongings/ui.ts:754</code>）。</li>\n<li>每次流转都可撤销（见下）。</li>\n</ul>\n<h3>删除</h3>\n<p>删除<strong>免确认</strong>，直接执行，但右下角弹「撤销」提示，点一下即可原样恢复（<code>src/belongings/ui.ts:854</code>）。因此误删先用撤销，别急着去翻备份。</p>\n<h3>记一笔 / 编辑表单</h3>\n<p>字段（标 * 为必填）：</p>\n<ol>\n<li><strong>名称</strong>* — 如「iPhone 15 Pro」。</li>\n<li><strong>分类</strong>* — 输入或从「历史分类」联想下拉里选；选历史分类会自动带上它的图标（<code>src/belongings/ui.ts:1022</code>）。右侧有「AI 归类」按钮：填了名称后点它，按名称向模型建议「分类 + 图标」，失败仅内联提示、不阻塞手填（<code>src/belongings/ui.ts:1075</code>）。</li>\n<li><strong>购买价格</strong>* — 数字，≥0，显示单位由「金额单位」设置决定（仅展示，不改存储值）。</li>\n<li><strong>购买日期</strong>* — 日期选择器。</li>\n<li><strong>状态</strong> — 四态平铺单选；选「已转卖 / 已丢弃」会展开出离记录行。</li>\n<li><strong>出离日期</strong> — 仅在出离态出现；默认今天。</li>\n<li><strong>转卖售价（可选）</strong> — 仅在「已转卖」出现；留空＝不记售价（回本按 0 计）。</li>\n<li><strong>描述（可选）</strong> — 规格、颜色、购买原因等。</li>\n</ol>\n<p>保存校验（不通过会在表单内联报错，不写盘）：</p>\n<ul>\n<li>名称、分类、购买日期必填（<code>src/belongings/ui.ts:1105</code>）。</li>\n<li>价格须为有限非负数，且 ≤ 一万亿（<code>1e12</code>），超限提示「多输了几位」（<code>src/belongings/ui.ts:1109</code>、<code>src/belongings/shared.ts:46</code>）。</li>\n<li>出离日期不能早于购买日期（<code>src/belongings/ui.ts:1121</code>）。</li>\n<li>转卖售价填了也须为有限非负数且 ≤ 一万亿（<code>src/belongings/ui.ts:1127</code>）。</li>\n</ul>\n<p>快捷键：<code>Ctrl/⌘ + Enter</code> 提交（单行输入直接 Enter 也提交；textarea 内 Enter 是换行）（<code>src/belongings/ui.ts:1216</code>）。关闭表单时若内容有改动，会先弹「放弃修改？」确认（<code>src/belongings/ui.ts:954</code>）。</p>\n<h3>年度报告</h3>\n<p>面板工具行的「年度报告」按钮，或命令「归物本年度报告」打开独立报告页（只读，不改数据文件）。用 <code>‹ ›</code> 在「有记录的年份」间切换（年份集合 = 购入年 ∪ 出离年，降序）（<code>src/belongings/report-stats.ts:53</code>）。报告含五段：</p>\n<ol>\n<li><strong>购入与离场概览</strong> — 四张卡：购入件数、购入金额、离场件数、转卖回血（<code>src/belongings/report.ts:361</code>）。</li>\n<li><strong>月度花销走势</strong> — 当年购入按月聚合，固定 12 列，缺月补零（<code>src/belongings/report-stats.ts:167</code>）。</li>\n<li><strong>分类占比</strong> — 当年购入按分类聚合（金额降序），Top 8 + 其余合并「其他」，显示占比百分比（<code>src/belongings/report-stats.ts:189</code>）。</li>\n<li><strong>日均成本走势</strong> — 各月末时点的全库日均成本，固定 12 列；未到的月份为空档，当年当月截至今天（<code>src/belongings/report-stats.ts:201</code>）。</li>\n<li><strong>陪伴最久榜</strong> — Top 5；截止点取「年末」与「今天」较早者（当年截至今日、往年截至年末）（<code>src/belongings/report-stats.ts:217</code>、<code>src/belongings/report-stats.ts:19</code>）。</li>\n</ol>\n<h2>全部设置项</h2>\n<p>归物本的设置挂在统一设置面板，分三组（<code>src/belongings/ui.ts:127</code>）：</p>\n<h3>外观</h3>\n<ul>\n<li><strong>面板布局</strong>（<code>belSkin</code>）：当前仅「大字报 / poster」一档（占位键，未来扩展）（<code>src/belongings/ui.ts:138</code>）。</li>\n<li><strong>面板主题</strong>（<code>belSkinTheme</code>）：当前仅「暖白 / warmwhite」一档，与 poster 绑定（<code>src/belongings/ui.ts:147</code>）。</li>\n</ul>\n<h3>显示</h3>\n<ul>\n<li><strong>默认状态筛选</strong>（<code>belongingsDefaultStatus</code>）：打开面板时选中的状态。选项：全部 / 使用中 / 闲置 / 已转卖 / 已丢弃。非法值回落「全部」（默认空串＝全部）（<code>src/belongings/settings.ts:215</code>、<code>src/belongings/ui.ts:295</code>）。</li>\n<li><strong>默认排序</strong>（<code>belongingsDefaultSort</code>）：最近购入 / 投入最高 / 日均最高。非法值回落「最近购入」（默认 <code>recent</code>）（<code>src/belongings/settings.ts:217</code>、<code>src/belongings/ui.ts:298</code>）。</li>\n<li><strong>金额单位</strong>（<code>belongingsCurrency</code>）：<code>cny</code>（￥ 前缀，默认）/ <code>yuan</code>（元 后缀）/ <code>usd</code>（$ 前缀）/ <code>none</code>（无符号）。仅影响显示，不改存储值；非法值回落 <code>cny</code>（默认 <code>cny</code>）（<code>src/belongings/settings.ts:221</code>、<code>src/belongings/ui.ts:111</code>）。</li>\n</ul>\n<h3>记一笔</h3>\n<ul>\n<li><strong>新增物品默认状态</strong>（<code>belongingsNewStatus</code>）：记一笔时物品的初始状态，仅限在库两态（使用中 / 闲置），出离态不可作默认。非法值回落「使用中」（默认 <code>使用中</code>）（<code>src/belongings/settings.ts:219</code>、<code>src/belongings/ui.ts:118</code>）。</li>\n</ul>\n<blockquote>这些「默认」是「下次打开面板时的初始值」；面板内临时改选状态 / 排序 / 年份只作用于本次会话，关掉再开会回到设置值（<code>src/belongings/ui.ts:292</code>）。</blockquote>\n<h2>全部命令</h2>\n<table><thead><tr><th>命令 ID</th><th>命令名</th><th>作用</th></tr></thead><tbody><tr><td><code>bz-belongings-add</code></td><td>加物品</td><td>直接弹出「记一笔」表单（<code>src/belongings/index.ts:10</code>）</td></tr><tr><td><code>bz-belongings-open</code></td><td>归物本</td><td>打开归物本面板（<code>src/belongings/index.ts:15</code>）</td></tr><tr><td><code>bz-belongings-report</code></td><td>归物本年度报告</td><td>打开年度资产报告页（面板未开也会从盘载库直开）（<code>src/belongings/index.ts:20</code>）</td></tr></tbody></table>\n<h2>边界、限制与坑</h2>\n<ul>\n<li><strong>分类 / 图标不落盘</strong>：<code>categories</code>、<code>categoryIcons</code> 每次打开由 items 实时派生，手动编辑 JSON 的这两个字段不会生效（<code>src/belongings/data.ts:87</code>）。</li>\n<li><strong>状态值是中文</strong>：<code>current_status</code> 必须是 <code>使用中 / 闲置 / 已转卖 / 已丢弃</code> 之一，写成别的字符串会让出离判定与统计失真（<code>src/belongings/shared.ts:154</code>）。</li>\n<li><strong>出离字段受状态约束</strong>：<code>exit_date</code> 只在「已转卖 / 已丢弃」时写出；<code>sold_price</code> 只在「已转卖」时写出。状态转回在库会清空这两项（<code>src/belongings/ui.ts:1159</code>）。</li>\n<li><strong>金额单位只是显示</strong>：<code>cny/yuan/usd/none</code> 只改符号，不动 <code>purchase_price</code> 存储值（<code>src/belongings/shared.ts:94</code>）。</li>\n<li><strong>价格上限一万亿</strong>：超过 <code>1e12</code> 会被拒收（避免科学计数法落盘成 null 静默丢值）（<code>src/belongings/shared.ts:46</code>）。</li>\n<li><strong>日期严格校验</strong>：<code>2026-13-45</code> 这类非法日期不会被 JS 静默归一化，而是当作「无封口锚点」处理——天数算到今天（<code>src/belongings/shared.ts:194</code>）。</li>\n<li><strong>日均成本口径</strong>：全库日均 =（Σ原价 − Σ转卖回本）/ Σ累计持有天数；在库投入 = 在用 + 闲置原价合计；单件日均 = 价格 / 已用天数（0 天＝全价）。出离条目天数封口在 <code>exit_date</code>（<code>src/belongings/shared.ts:207</code>）。</li>\n<li><strong>旧数据迁移</strong>：v231 前带 emoji 前缀的分类，载入时自动剥离前缀、转成纯文字分类并补 <code>icon</code> 字段，迁移随下次自然保存落盘（<code>src/belongings/data.ts:55</code>）。</li>\n<li><strong>文件损坏不丢数据</strong>：数据文件结构异常时按空库继续、原文件不动并提示；写失败 / 解析失败的原文件会原样留档到 <code>CONFIG/.CORRUPT/</code>，永不静默丢弃（<code>src/belongings/data.ts:42</code>、<code>src/core/storage.ts:171</code>）。</li>\n<li><strong>删除可撤销、无二次确认</strong>：依赖右下角撤销 toast；面板 / 插件卸载前未撤销的删除即持久化（<code>src/belongings/ui.ts:854</code>）。</li>\n<li><strong>年度报告只读</strong>：报告页不修改 <code>belongings.json</code>，纯从 items 派生（<code>src/belongings/report-stats.ts:4</code>）。</li>\n<li><strong>自动刷新</strong>：面板打开期间，数据文件被外部修改会实时刷新列表（自写操作会短路，避免双渲染）（<code>src/belongings/ui.ts:554</code>）。</li>\n</ul>\n<h2>常见问题</h2>\n<p><strong>Q1：分类的 emoji / 图标是怎么来的？</strong></p>\n<p>历史分类联想下拉选中已有分类会带上它的图标；「AI 归类」按名称建议分类与图标。旧数据里 emoji 前缀的分类在载入时已自动转成文字 + <code>icon</code>。未匹配到图标的分类回退显示首字或原 emoji（<code>src/belongings/data.ts:55</code>、<code>src/belongings/shared.ts:131</code>）。</p>\n<p><strong>Q2：我手动改了 belongings.json，分类列表 / 图标没变？</strong></p>\n<p><code>categories</code> 和 <code>categoryIcons</code> 不落盘，是打开时从 <code>items</code> 派生的。改这两个字段无效，真正要改的是每条物品的 <code>category</code> 和 <code>icon</code>（<code>src/belongings/data.ts:87</code>）。</p>\n<p><strong>Q3：我填了出离日期 / 转卖售价，但详情里不显示？</strong></p>\n<p>这两个字段只在状态为「已转卖 / 已丢弃」时才写、才显示；<code>sold_price</code> 还要求状态正好是「已转卖」。先确认状态已切到出离态（<code>src/belongings/ui.ts:1159</code>）。</p>\n<p><strong>Q4：面板里选了某状态筛选，关掉再开变回「全部」了？</strong></p>\n<p>默认状态筛选是「下次打开的初始值」，面板内的改选只是本次会话临时态。要在打开时就固定某筛选，去设置里改「默认状态筛选」（<code>src/belongings/ui.ts:292</code>）。</p>\n<p><strong>Q5：不小心删了一条，能找回来吗？</strong></p>\n<p>删除是免确认的，但保存后右下角会弹「已删除『XX』」并带「撤销」；点撤销即原样恢复。若已错过撤销窗口，可去 <code>CONFIG/.CORRUPT/</code> 找损坏前留档，或靠外部备份（<code>src/belongings/ui.ts:854</code>、<code>src/core/storage.ts:171</code>）。</p>\n<p><strong>Q6：年度报告里某一年图表是空的 / 显示「只有出离」？</strong></p>\n<p>当年若没有任何购入记录（只有转卖 / 丢弃），「月度花销走势」「分类占比」会换成空态提示，这是正常的——那一年没有购入金额可绘（<code>src/belongings/report.ts:407</code>）。</p>","no":14},{"id":"diary","title":"日记本","group":"记录","tags":["record","diary"],"domain":"diary","html":"<blockquote>一面按时间混排的墙：日记、影视、信、书全在上面</blockquote>\n<h2>什么时候用它</h2>\n<p>想「按时间往回翻自己都干了什么」时用它。它不是只写日记 —— 这面墙<strong>同时聚合四类内容</strong>，按日期时间降序混排（<code>src/diary/data.ts:2</code>）：</p>\n<table><thead><tr><th>内容</th><th>从哪读</th><th>什么条件才进墙</th></tr></thead><tbody><tr><td>日记</td><td>日记文件夹（默认 <code>我的/日记</code>）</td><td>条目文件，一个文件一条</td></tr><tr><td>影视</td><td>影视文件夹（默认 <code>我的/影视</code>，<strong>与影院共用</strong>）</td><td>有影评或观影日期才进（否则跳过）</td></tr><tr><td>信</td><td>信件文件夹（默认 <code>我的/信</code>）</td><td>只读文件跳过</td></tr><tr><td>书</td><td>书库文件夹（默认 <code>书库</code>）</td><td>有 <code>completionDate</code> 或 <code>readingDate</code> 才进</td></tr></tbody></table>\n<p>所以它跟影院、书库是读同一批数据的两面镜子 —— 那边记一条，这边墙上就多一条。</p>\n<h2>数据放在哪</h2>\n<table><thead><tr><th>位置</th><th>说明</th></tr></thead><tbody><tr><td><code>我的/日记/YYMMDDHHmm(-N)?.md</code></td><td>日记条目，<strong>一目一文件</strong>（ADR-0130/0131）：文件名是「年月日时分」，同一分钟多条会加 <code>-N</code> 后缀</td></tr><tr><td><code>我的/影视/*.md</code>（可配）</td><td>影视条目，与影院同一个目录</td></tr><tr><td><code>我的/信/*.md</code>（可配）</td><td>信件</td></tr><tr><td><code>书库/*.md</code></td><td>书目（读取条件是上面表格里的那两个日期字段）</td></tr><tr><td>数据存储路径</td><td>本域<strong>不写 json</strong> —— 墙上的内容全部来自笔记本身</td></tr></tbody></table>\n<p>每条笔记的 frontmatter 用 <code>date</code> + <code>type</code> 表达，格式契约在 <code>src/core/diary-format.ts</code>（解析自包含在本域，<code>src/diary/data.ts:8</code>）。条目里的 <code>filename</code> 存的是<strong>完整 vault 路径</strong>（面板跳转与定位就靠它）。</p>\n<p><strong>媒体怎么显示</strong>：笔记里引用的图片 / 视频 / 音频会按扩展名识别成 <code>img</code> / <code>video</code> / <code>audio</code> 三种（<code>src/diary/data.ts:26</code>），并且必须经 Obsidian 的资源路径加载 —— 原型里那种硬编码 <code>file://</code> 路径在这里是播不出来的。</p>\n<h2>面板怎么用</h2>\n<ol>\n<li>「日记本」命令打开面板（<code>bz-diary-open</code>），默认是<strong>媒体墙</strong>布局。</li>\n<li>头部按钮组（<code>src/diary/ui.ts:7</code>）：</li>\n</ol>\n<ul>\n<li>✏️ <strong>写日记</strong>（<code>bz-diary-write</code>）：弹出写作窗，保存后自动回刷；</li>\n<li>🔍 搜索：按关键词筛条目；</li>\n<li>🗓 按年月跳转：滚轮选年份（范围取自当前数据）；</li>\n<li>✕ 关闭面板。</li>\n</ul>\n<ol>\n<li>墙上每条按时间排，点条目跳到对应笔记。</li>\n<li>外部新增/移入条目文件也会自动回刷（面板订阅了 vault 的创建事件，<code>src/diary/ui.ts:2679</code>）。</li>\n</ol>\n<h2>全部设置项</h2>\n<h3>外观</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>面板布局</td><td><code>diarySkin</code></td><td>卡片选择</td><td>default</td><td>切换面板布局（当前只有「媒体墙」）</td></tr><tr><td>面板主题</td><td><code>diarySkinTheme</code></td><td>卡片选择</td><td>gallery</td><td>切换面板主题（当前只有「画廊白」）</td></tr></tbody></table>\n<h3>目录</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>日记文件夹</td><td><code>diaryDirectory</code></td><td>路径</td><td><code>我的/日记</code></td><td>日记文件所在目录；改完立即重读（<code>src/diary/settings.ts:31</code>）</td></tr><tr><td>信件文件夹</td><td><code>letterDirectory</code></td><td>路径</td><td><code>我的/信</code></td><td>信件所在目录；同样即时生效</td></tr></tbody></table>\n<h3>显示</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>默认日期取自文件</td><td><code>useFileDateTime</code></td><td>开关</td><td>—</td><td>写作窗里的默认日期取自当前打开的日记文件，而不是「现在」</td></tr></tbody></table>\n<p>「维护」组与「日记格式体检」弹窗已按拍板<strong>退役</strong>（2026-09-25）—— 格式检查逻辑保留在代码里，但面板不再提供入口（<code>src/diary/settings.ts:6</code>）。</p>\n<h2>全部命令</h2>\n<table><thead><tr><th>命令</th><th>名称</th><th>做什么</th></tr></thead><tbody><tr><td><code>bz-diary-open</code></td><td>日记本</td><td>打开日记本面板</td></tr><tr><td><code>bz-diary-write</code></td><td>写日记</td><td>打开写作窗，写一条新日记</td></tr></tbody></table>\n<p>这两条命令在 <code>main.ts</code> 里走的是<strong>裸注册通道</strong>（ADR-0004），域内只出回调函数。</p>\n<h2>边界、限制与坑</h2>\n<ul>\n<li><strong>一目一文件</strong>：日记是「一条一个文件」的模型（<code>YYMMDDHHmm(-N)</code>），不是「一天一个文件追加」；同一天写多条就是多个文件。</li>\n<li><strong>文件名的坑</strong>：文件名承载时间（<code>YYMMDDHHmm</code>），改名等于改时间，会直接影响墙上的排序。</li>\n<li><strong>四类内容共墙，但各有门槛</strong>：影视要有影评或观影日期、书要有那两类日期、只读信件直接跳过 —— 不满足条件的不会出现，不是 bug。</li>\n<li><strong>影视目录与影院共用</strong>：在「影院」章改影视文件夹，这里一起变。</li>\n<li><strong>媒体要经 vault 资源路径</strong>：笔记里引用媒体用正常的 Obsidian 语法，别写绝对路径。</li>\n<li><strong>日记文件夹改名不搬文件</strong>：旧目录里的日记不会自动过来。</li>\n<li><strong>格式体检入口已退役</strong>：想检查格式得手动看 frontmatter 的 <code>date</code> / <code>type</code>。</li>\n<li>外观两行目前各只有一个选项。</li>\n</ul>\n<h2>常见问题</h2>\n<p><strong>我写的日记没出现在墙上？</strong></p>\n<p>先看文件在不在「日记文件夹」里、文件名是不是 <code>YYMMDDHHmm</code> 这种形式、frontmatter 有没有 <code>date</code> 和 <code>type</code>。</p>\n<p><strong>影视 / 书为什么有的能看到、有的看不到？</strong></p>\n<p>进墙有门槛：影视要有影评或观影日期，书要有读完或开始读的日期（见上表）。</p>\n<p><strong>同一天写了好几条日记怎么存？</strong></p>\n<p>就是多个文件（同一分钟的多条会带 <code>-N</code> 后缀），墙上是多条独立条目。</p>\n<p><strong>「写日记」弹窗里的日期能改成别的日子吗？</strong></p>\n<p>能 —— 而且如果当前打开着一篇日记文件，「默认日期取自文件」打开时会用那篇的日期做默认值。</p>\n<p><strong>改文件夹后旧日记去哪了？</strong></p>\n<p>留在旧目录，不会自动搬；插件只读新目录。</p>","no":15},{"id":"memo","title":"备忘录","group":"记录","tags":["record","memo"],"domain":"memo","html":"<blockquote>按场景记待办，可以绑到某篇笔记的具体位置</blockquote>\n<h2>什么时候用它</h2>\n<p>记「等会儿要做的事」时用它。比宿主自带的待办多两件事：</p>\n<ul>\n<li><strong>场景</strong>：条目按场景分（默认：剪藏 / 工作 / 学习 / 生活 / 代码 / 公开课），可以按场景筛；</li>\n<li><strong>绑到笔记</strong>：一条备忘可以指向某篇笔记的<strong>具体位置</strong>（<code>notePath</code> + <code>notePosition</code>），下次打开那篇笔记会被提醒。</li>\n</ul>\n<h2>数据放在哪</h2>\n<table><thead><tr><th>文件</th><th>位置</th><th>里面是什么</th></tr></thead><tbody><tr><td><code>memo.json</code></td><td>数据存储路径</td><td>全部备忘条目</td></tr><tr><td>配置里的笔记</td><td>库内</td><td>备忘<strong>不写进笔记</strong>：绑定时只记路径与位置，笔记本身不被改写</td></tr></tbody></table>\n<p>条目字段（<code>src/memo/types.ts:10</code>）：</p>\n<table><thead><tr><th>字段</th><th>含义</th></tr></thead><tbody><tr><td><code>id</code></td><td>条目标识</td></tr><tr><td><code>title</code></td><td>内容</td></tr><tr><td><code>scene</code></td><td>场景（对应场景列表里的某一项）</td></tr><tr><td><code>priority</code></td><td>优先级：<code>important</code>（重要）/ <code>minor</code>（次要）</td></tr><tr><td><code>created</code> / <code>completed</code></td><td>创建时间 / 完成时间（未完成是 <code>null</code>）</td></tr><tr><td><code>due</code></td><td>到期时间（可空）</td></tr><tr><td><code>notePath</code> + <code>notePosition</code></td><td>绑定的笔记与位置（可空）</td></tr><tr><td><code>scriptName</code> / <code>courseName</code> / <code>coursePath</code></td><td>公开课类备忘用的附加字段</td></tr><tr><td><code>linkedNote</code> / <code>url</code></td><td>关联的笔记或网址</td></tr></tbody></table>\n<p>默认场景是 <code>剪藏 / 工作 / 学习 / 生活 / 代码 / 公开课</code>（<code>src/memo/data.ts:25</code>）；场景列表留空就回退这套默认。</p>\n<h2>面板怎么用</h2>\n<p>三种记录方式，产物都进同一份 <code>memo.json</code>，区别只在「有没有绑定」：</p>\n<table><thead><tr><th>方式</th><th>命令</th><th>产物</th></tr></thead><tbody><tr><td>打开面板手动记</td><td><code>bz-memo-open</code></td><td>普通条目，不绑定笔记</td></tr><tr><td>快速加一条</td><td><code>bz-memo-add</code></td><td>同上，省一步打开面板</td></tr><tr><td>给当前笔记记一笔</td><td><code>bz-memo-note-binding</code></td><td>条目<strong>绑到当前笔记</strong>，可指定位置；打开那篇笔记会被提醒定位</td></tr></tbody></table>\n<p>面板里的操作：</p>\n<ol>\n<li>左/上选择场景与筛选（默认打开哪个场景、默认怎么排、要不要显示已完成，都在设置里配）。</li>\n<li>勾选完成 → 写完成时间。</li>\n<li>条目上可以跳到绑定笔记、复制链接，或删除。</li>\n</ol>\n<h2>全部设置项</h2>\n<h3>外观</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>面板布局</td><td><code>memoLayout</code></td><td>卡片选择</td><td>default</td><td>切换面板布局（当前只有「清单」）</td></tr><tr><td>面板主题</td><td><code>memoTheme</code></td><td>卡片选择</td><td>—</td><td>切换面板主题</td></tr></tbody></table>\n<h3>显示</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>打开默认场景</td><td>—</td><td>下拉</td><td>—</td><td>打开面板时默认选中的场景</td></tr><tr><td>默认排序方式</td><td>—</td><td>下拉</td><td>—</td><td>列表默认排序</td></tr><tr><td>默认显示已完成</td><td>—</td><td>开关</td><td>—</td><td>打开时要不要把已完成的一起列出来</td></tr><tr><td>已完成显示范围</td><td>—</td><td>下拉</td><td>—</td><td>显示已完成条目时往前看多久</td></tr></tbody></table>\n<h3>新建</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>新条目默认优先级</td><td>—</td><td>下拉</td><td>—</td><td>新建时预填的优先级（重要 / 次要）</td></tr><tr><td>新条目默认场景</td><td>—</td><td>下拉</td><td>—</td><td>新建时预填的场景</td></tr></tbody></table>\n<h3>场景列表</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>自定义场景列表</td><td><code>memoScenarios</code></td><td>文本</td><td>空</td><td>逗号分隔（半角/全角都认）；<strong>留空回退内置六个默认场景</strong>（<code>src/memo/data.ts:28</code>）</td></tr></tbody></table>\n<h3>提醒</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>启动时自动弹出</td><td><code>autoPopupOnStart</code></td><td>开关</td><td>—</td><td>Obsidian 启动时自动打开备忘录面板，提醒到期事项</td></tr><tr><td>打开笔记自动提醒</td><td><code>openNoteReminder</code></td><td>开关</td><td>开</td><td>打开某篇笔记时弹出备忘录面板并定位到绑在该笔记上的条目</td></tr></tbody></table>\n<h2>全部命令</h2>\n<table><thead><tr><th>命令</th><th>名称</th><th>做什么</th></tr></thead><tbody><tr><td><code>bz-memo-open</code></td><td>备忘录</td><td>打开备忘录面板</td></tr><tr><td><code>bz-memo-add</code></td><td>加备忘录</td><td>直接加一条（不绑笔记）</td></tr><tr><td><code>bz-memo-note-binding</code></td><td>给当前笔记记一笔</td><td>加一条并绑到当前笔记（可指定位置）</td></tr></tbody></table>\n<h2>边界、限制与坑</h2>\n<ul>\n<li><strong>备忘不写进笔记</strong>：绑定只是「记住位置」，笔记内容不会被插入任何东西 —— 所以删了笔记，绑定就悬空了。</li>\n<li><strong>场景列表留空 ≠ 没有场景</strong>：会回退到内置六个默认场景（剪藏 / 工作 / 学习 / 生活 / 代码 / 公开课）。</li>\n<li><strong>「打开笔记自动提醒」默认是开的</strong>：不想被弹就关掉，否则每次打开有绑定的笔记都会弹面板。</li>\n<li><strong>完成时间只记一次</strong>：勾选完成写时间；取消完成会清掉，重新完成会重写。</li>\n<li><strong>公开课类条目有专属字段</strong>（<code>scriptName</code> / <code>courseName</code> / <code>coursePath</code>）：这一类跟别的条目不是同一套展示，删相关目录前留意。</li>\n<li>数据全在 <code>memo.json</code> 里：跟库走，换设备复制即带走。</li>\n</ul>\n<h2>常见问题</h2>\n<p><strong>怎么让某条备忘在打开某篇笔记时提醒我？</strong></p>\n<p>用「给当前笔记记一笔」（<code>bz-memo-note-binding</code>）而不是「加备忘录」—— 前者的条目带 <code>notePath</code>，打开那篇笔记时才会定位提醒。</p>\n<p><strong>能不能自定义场景？</strong></p>\n<p>能。在「场景列表」里用逗号分隔写自己的场景；清空就回到内置六个。</p>\n<p><strong>已完成的不见了？</strong></p>\n<p>看「默认显示已完成」和「已完成显示范围」两行：前者决定要不要显示，后者决定往前看多久。</p>\n<p><strong>启动就弹面板，太打扰了？</strong></p>\n<p>关掉「启动时自动弹出」。</p>\n<p><strong>备忘会同步到手机吗？</strong></p>\n<p>会。数据在 <code>memo.json</code>，跟库一起同步。</p>","no":16},{"id":"people","title":"脸谱","group":"记录","tags":["record","people"],"domain":"people","html":"<blockquote>把微信聊天记录导进库，生成这个人的画像与关系时间线</blockquote>\n<h2>什么时候用它</h2>\n<p>当你有一份用导出工具做好的微信聊天数据，想把它变成「可读的人物档案」时用它。插件把聊天流读进来，分批交给 AI 提炼素材，最后生成<strong>双卷画像</strong>：卷一《其人》（这个人是什么样）+ 卷二《我们》（你俩的关系）+ 一条关系时间线（<code>src/people/digest.ts:2</code>）。</p>\n<p>适合：想认真梳理某段关系、或给重要的人留一份记录。</p>\n<p>不适合：想全量备份聊天记录 —— 它只把媒体转成文本进预览，图片语音视频本身<strong>不搬进库</strong>。</p>\n<h2>数据放在哪</h2>\n<h3>外部（你自己准备的）</h3>\n<table><thead><tr><th>路径</th><th>里面是什么</th></tr></thead><tbody><tr><td><code>&lt;数据文件夹&gt;/&lt;联系人&gt;/chat.json</code></td><td>消息流，每条含时间、类型、说话人、文本、语音时长、wav、图片等字段（<code>src/people/datasource.ts:3</code>）</td></tr><tr><td><code>&lt;数据文件夹&gt;/&lt;联系人&gt;/voice.json</code></td><td>语音转写表（<strong>兼容兜底</strong>：正常情况下 chat.json 已回填转写，有这个文件才读）</td></tr><tr><td><code>&lt;数据文件夹&gt;/&lt;联系人&gt;/image_desc.json</code></td><td>图片描述表（同上，兼容兜底）</td></tr><tr><td><code>&lt;数据文件夹&gt;/&lt;联系人&gt;/avatar.&lt;扩展名&gt;</code></td><td>头像文件，按顺序探测扩展名（<code>src/people/datasource.ts:613</code>）</td></tr></tbody></table>\n<p>也就是说：<strong>一个联系人一个目录，聊天记录文件放在里面</strong>。</p>\n<h3>库内</h3>\n<table><thead><tr><th>文件 / 目录</th><th>位置</th><th>里面是什么</th></tr></thead><tbody><tr><td><code>people.json</code></td><td>数据存储路径</td><td>联系人、消息与画像数据</td></tr><tr><td><code>people-preview.json</code></td><td>数据存储路径</td><td><strong>预览缓存</strong>，纯文本（语音转写与图片描述以文本进预览，<code>src/people/datasource.ts:15</code>）</td></tr><tr><td><code>people-jobs.json</code></td><td>数据存储路径</td><td>导入任务的进度与状态</td></tr><tr><td><code>&lt;媒体文件夹&gt;/&lt;联系人&gt;/avatar.&lt;扩展名&gt;</code></td><td>库内</td><td>从外部目录复制进来的头像（一人一个子目录，<code>src/people/datasource.ts:645</code>）</td></tr></tbody></table>\n<p><strong>媒体文件夹只能选库内目录</strong>：库外文件在 Obsidian 里加载不出来，头像会显示成裂图。</p>\n<h2>导入流程（从零到看到人）</h2>\n<ol>\n<li><strong>准备数据</strong>：用微信聊天导出工具产出上面那套目录结构（一层一个联系人）。</li>\n<li><strong>在设置里填「数据文件夹」</strong>：点右侧按钮唤起<strong>系统目录对话框</strong>（可以选 vault 之外的目录，因为是外部数据）。</li>\n<li><strong>执行「脸谱数据源」命令</strong>（<code>bz-people-import</code>）扫描目录。</li>\n<li><strong>勾选要导入的联系人</strong>：想连群聊一起就打开「群聊纳入列表」。</li>\n<li><strong>开始导入</strong>：这是异步任务，进度写在 <code>people-jobs.json</code> 里，可以边跑边做别的。</li>\n<li><strong>导入完成后</strong>不会自动出画像 —— 需要你在弹窗里点「画脸谱」（<code>src/people/ui.ts:412</code>，447 拍板：不自动生成）。</li>\n<li><strong>生成画像</strong>：分批采集素材（事件 / 原话 / 场景 / 特质 / 兴趣 / 未竟之事六类），再汇总成双卷画像与关系时间线。这一步走 LLM，需要配好 AI 通道。</li>\n</ol>\n<h2>面板怎么用</h2>\n<ol>\n<li>「脸谱」命令打开面板（<code>bz-people-open</code>），左栏是联系人列表。</li>\n<li>选中一个联系人，右侧看：</li>\n</ol>\n<ul>\n<li><strong>预览</strong>：按时间排的聊天流，语音以转写文本、图片以描述文本、视频以时长标签进流（受「预览」组四行控制）；</li>\n<li><strong>画像</strong>：卷一《其人》与卷二《我们》；</li>\n<li><strong>关系时间线</strong>。</li>\n</ul>\n<ol>\n<li>换过数据目录、或外部数据更新了，重新导入一次才会看到新内容。</li>\n</ol>\n<h2>全部设置项</h2>\n<h3>数据源</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>数据文件夹</td><td><code>peopleDataDir</code></td><td>文本 + 选择按钮</td><td>空</td><td>微信聊天导出生成的目录，一层一个联系人。点「选择…」唤起<strong>系统目录对话框</strong>（可选库外）；也可直接粘贴完整路径。<strong>留空则面板上不显示数据源入口</strong>；换了目录要重新扫一次</td></tr><tr><td>群聊纳入列表</td><td>—</td><td>开关</td><td>—</td><td>群聊会话也进勾选列表</td></tr></tbody></table>\n<h3>媒体</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>媒体文件夹</td><td><code>peopleMediaDir</code></td><td>路径</td><td><code>CONFIG/FACES</code></td><td>头像复制进库后存这里，<strong>只能选库内目录</strong></td></tr><tr><td>头像入库</td><td>—</td><td>开关</td><td>—</td><td>只有头像复制进库，其余媒体留在外部数据目录</td></tr></tbody></table>\n<h3>预览</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>语音转写</td><td><code>peopleVoiceMode</code></td><td>下拉</td><td>—</td><td>语音消息用什么文本进预览（转写文本 / 不显示）</td></tr><tr><td>图片描述</td><td><code>peopleImageDescMode</code></td><td>下拉</td><td>—</td><td>有描述的图片以描述文本进预览；<code>file</code> = 读 <code>image_desc.json</code>（兼容兜底），<code>off</code> = 只计数不打标签</td></tr><tr><td>视频标签</td><td><code>peopleVideoMode</code></td><td>下拉</td><td>—</td><td>视频消息以时长标签进预览</td></tr><tr><td>系统消息</td><td><code>peopleSystemMessageMode</code></td><td>下拉</td><td>—</td><td>撤回、打招呼这类系统消息是否保留</td></tr></tbody></table>\n<h3>隐私</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>清空预览</td><td>—</td><td>按钮</td><td>—</td><td>清掉全部导入预览缓存（<code>people-preview.json</code>），<strong>不动已生成的脸谱</strong></td></tr></tbody></table>\n<h2>全部命令</h2>\n<table><thead><tr><th>命令</th><th>名称</th><th>做什么</th></tr></thead><tbody><tr><td><code>bz-people-open</code></td><td>脸谱</td><td>打开脸谱面板</td></tr><tr><td><code>bz-people-import</code></td><td>脸谱数据源</td><td>扫描数据文件夹，弹出联系人勾选与导入</td></tr></tbody></table>\n<h2>边界、限制与坑</h2>\n<ul>\n<li><strong>数据是外面的</strong>：<code>chat.json</code> 那套结构由导出工具产出，插件只是读它。所以数据文件夹必须选<strong>库外</strong>目录才合理（这一行专门用了系统目录对话框）。</li>\n<li><strong>媒体不搬库</strong>：除了头像，图片语音视频都留在外部目录，库里只有文本预览 —— 所以清空预览不会丢原始消息。</li>\n<li><strong>媒体文件夹必须库内</strong>：选库外头像会裂图。</li>\n<li><strong>换目录要重扫</strong>：改了「数据文件夹」不会自动重读，得重新执行一次导入。</li>\n<li><strong>导入是异步任务</strong>：进度在 <code>people-jobs.json</code>；导入过程中可以继续用 Obsidian。</li>\n<li><strong>画像不自动生成</strong>：导入完要手动点「画脸谱」，每批要走 LLM，消耗真实调用。</li>\n<li><strong>提炼有抽样上限</strong>：批切有字数与条数双限、批数有均匀抽样封顶（<code>src/people/digest.ts:16</code>），所以特别长的记录是抽样后提炼的，不是逐条全文。</li>\n<li><strong>预览文本依赖导出侧</strong>：语音转写与图片描述基本靠导出工具预先回填；没回填时才会去找 <code>voice.json</code> / <code>image_desc.json</code> 兜底。</li>\n<li><strong>群聊要单独开</strong>：不开「群聊纳入列表」，导入时看不到群聊。</li>\n</ul>\n<h2>常见问题</h2>\n<p><strong>点了导入没反应 / 看不到数据源入口？</strong></p>\n<p>「数据文件夹」是空的 —— 留空时面板不显示数据源入口，先把它填上（用「选择…」挑目录最省事）。</p>\n<p><strong>头像是裂的？</strong></p>\n<p>媒体文件夹被选到了库外。改回库内目录，重新导入让头像复制进来。</p>\n<p><strong>画像里的话是编的吗？</strong></p>\n<p>不是凭空编的：提炼阶段先采集素材（含<strong>原话</strong>与场景），画像阶段才做模式提炼，并且方法论上要求「证据与推断分离」（<code>src/people/digest.ts:7</code>）。但它是 AI 归纳，仍建议当作参考。</p>\n<p><strong>清空预览会把聊天记录删掉吗？</strong></p>\n<p>不会。清的是库内的 <code>people-preview.json</code> 预览缓存；原始数据在外部目录里，重新导入即可再生成。</p>\n<p><strong>群聊里的人太多，只想看个别几个？</strong></p>\n<p>导入时是勾选的，不勾就不进；群聊默认不纳入，得先打开「群聊纳入列表」。</p>\n<p><strong>换了新手机导出数据，怎么更新？</strong></p>\n<p>覆盖外部数据目录里的文件，然后重新执行一次导入（会按新数据重算）。</p>","no":17},{"id":"auto-summary","title":"自动摘要","group":"收集","tags":["collect","ai"],"domain":"auto-summary","html":"<blockquote>新剪藏自动生成 AI 摘要与标签，写进 frontmatter</blockquote>\n<h2>什么时候用它</h2>\n<p>剪藏文章多了想「每篇都有个摘要可扫」时开它。它是<strong>剪藏本的附属能力</strong>：设置在剪藏本的「自动摘要」组，产物写进剪藏笔记的 frontmatter。</p>\n<p>每次生成消耗<strong>一次 LLM 调用</strong> —— 批量导入几十篇就是几十次，这是它唯一的代价。</p>\n<h2>数据放在哪</h2>\n<p>写进剪藏笔记的 frontmatter，本域真实管辖的键只有三个（<code>src/auto-summary/parser.ts:30</code>）：</p>\n<table><thead><tr><th>frontmatter 键</th><th>含义</th></tr></thead><tbody><tr><td><code>title</code></td><td>标题（手动重跑也<strong>不动用户标题</strong>，<code>src/auto-summary/index.ts:59</code>）</td></tr><tr><td><code>summary</code></td><td>摘要正文</td></tr><tr><td><code>tags</code></td><td>生成的中文标签</td></tr></tbody></table>\n<p>解析器按「管辖键白名单」工作：这三个键进 frontmatter，其余键连同附属行<strong>原文保留</strong>（<code>src/auto-summary/parser.ts:48</code>）—— 不会碰你 frontmatter 里的其他东西。</p>\n<h2>什么时候会跑</h2>\n<p>两条链路，由「摘要时机」决定：</p>\n<table><thead><tr><th>档位</th><th>触发点</th><th>代价</th></tr></thead><tbody><tr><td><code>immediate</code>（保存后立刻）</td><td>文章进库就生成</td><td>一进库就占一次 LLM 调用；批量导入就是 N 次</td></tr><tr><td><code>lazy</code>（懒触发）</td><td>你<strong>打开那篇文章</strong>时才生成</td><td>平时不花钱，代价是打开要多等一小会儿</td></tr></tbody></table>\n<p>设置里的时机<strong>切换即时生效</strong>（重注册监听，不用重启；<code>src/clipbook/ui.ts:2440</code>）。</p>\n<p><strong>手动重跑</strong>：命令「重新生成当前剪藏摘要」（<code>bz-auto-summary-redo</code>）对当前打开的笔记 <code>force</code> 重建 —— 跳过\"已有摘要就不动\"的缺失检测，<strong>直接重写 <code>summary</code> / <code>tags</code> 两个键</strong>（<code>src/auto-summary/index.ts:210</code>）。</p>\n<h2>全部设置项</h2>\n<p>设置都在「剪藏本 → 自动摘要」组（键名单源在 <code>src/auto-summary/keys.ts:12</code>）：</p>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>自动摘要</td><td><code>autoSummaryEnabled</code></td><td>开关</td><td>—</td><td>总开关；<strong>关掉时下面四行一起收起</strong></td></tr><tr><td>摘要长度</td><td><code>autoSummaryLength</code></td><td>下拉</td><td>—</td><td>简短（50–100 字）/ 标准（150–250 字）/ 详细（300–400 字）（子项）</td></tr><tr><td>生成标签</td><td><code>autoSummaryTagsEnabled</code></td><td>开关</td><td>—</td><td>为剪藏生成中文标签（子项）</td></tr><tr><td>标签数量</td><td><code>autoSummaryTagCount</code></td><td>文本</td><td>—</td><td>生成的标签个数写成区间，如 <code>3-6</code>（子项，开了生成标签才显示）</td></tr><tr><td>摘要时机</td><td><code>autoSummaryTiming</code></td><td>下拉</td><td>—</td><td>immediate 保存后立刻 / lazy 懒触发（子项；切换即时生效）</td></tr></tbody></table>\n<h2>全部命令</h2>\n<table><thead><tr><th>命令</th><th>名称</th><th>做什么</th></tr></thead><tbody><tr><td><code>bz-auto-summary-redo</code></td><td>重新生成当前剪藏摘要</td><td>对当前打开的剪藏笔记强制重建摘要与标签（只动 <code>summary</code> / <code>tags</code>，不动标题）</td></tr></tbody></table>\n<h2>边界、限制与坑</h2>\n<ul>\n<li><strong>它只管新进来的文章</strong>：开开关之前已在库里的剪藏不会自动补摘要；想要就逐篇手动重跑。</li>\n<li><strong>immediate 档烧调用</strong>：批量导入前想清楚 —— 一次导 50 篇就是 50 次 LLM 调用；不确定就先用 <code>lazy</code>。</li>\n<li><strong>手动重跑会覆盖旧摘要</strong>：<code>force</code> 模式跳过缺失检测直接重写 <code>summary</code> / <code>tags</code>。</li>\n<li><strong>标题永远不动</strong>：哪怕重跑，<code>title</code> 键保持你手写的值。</li>\n<li><strong>frontmatter 其他键安全</strong>：解析器只认它管辖的三个键，其余原文保留。</li>\n<li><strong>失败不静默</strong>：批量跑完会给合并通知（进度型通知带去重键，<code>src/auto-summary/index.ts:193</code>）。</li>\n<li><strong>没有独立设置页</strong>：全部设置在剪藏本的「自动摘要」组 —— 这是刻意安排，别找单独的域页面。</li>\n</ul>\n<h2>常见问题</h2>\n<p><strong>开了开关但旧文章没摘要？</strong></p>\n<p>正常 —— 它只管新进来的。旧文章打开后手动执行「重新生成当前剪藏摘要」。</p>\n<p><strong>摘要时机选哪个好？</strong></p>\n<p>导入量大选 <code>lazy</code>（打开才花调用）；少量精选选 <code>immediate</code>（进库即有摘要）。</p>\n<p><strong>生成的标签能改吗？</strong></p>\n<p>能，标签就是 frontmatter 的 <code>tags</code> 键，直接编辑笔记即可；但下次手动重跑会被覆盖。</p>\n<p><strong>摘要太长 / 太短？</strong></p>\n<p>调「摘要长度」三档；它只影响新生成的，已有摘要不变。</p>\n<p><strong>会把我 frontmatter 里别的字段冲掉吗？</strong></p>\n<p>不会。管辖键只有 <code>title</code> / <code>summary</code> / <code>tags</code>，其余键原文保留（<code>src/auto-summary/parser.ts:30</code>）。</p>","no":18},{"id":"clipping","title":"剪藏本","group":"收集","tags":["collect","clipping"],"domain":"clipping","html":"<blockquote>自动收四个源的文章，在收件流里读、随手存成笔记</blockquote>\n<h2>什么时候用它</h2>\n<p>想「每天自动进一批可读的东西」，而不是自己到处找时用它。四个源按间隔自动抓，抓回来的先进<strong>未读流</strong>；你在里面翻，看着中意的存成正式剪藏笔记，其余标记已读或删掉。</p>\n<p>不适合：想精确控制每篇文章内容（它不是全文抓取器，存的是标题 + 摘要 + 链接 + 正文转写）。</p>\n<h2>数据放在哪</h2>\n<table><thead><tr><th>文件 / 目录</th><th>位置</th><th>里面是什么</th></tr></thead><tbody><tr><td><code>news.json</code></td><td>数据存储路径</td><td><strong>未读流</strong>：抓回来的待读条目（含来源、标题、链接、抓取时间）</td></tr><tr><td><code>clipbook.json</code></td><td>数据存储路径</td><td><strong>侧写</strong>：条目的覆盖信息（<code>articleOverrides</code>）、保存过的图片（<code>savedImages</code>）、待升级文献笔记路径（<code>pendingSource</code>）、阅读流水（<code>readLog</code>）</td></tr><tr><td>剪藏文件夹</td><td>库内，默认 <code>归档/网页剪藏</code></td><td>正式剪藏笔记（<code>.md</code>），一篇一个文件</td></tr><tr><td>图片文件夹</td><td>库内，默认 <code>&lt;剪藏文件夹&gt;/assets</code></td><td>保存正文图片时的落地目录（<code>src/clipbook/save.ts:36</code>）</td></tr><tr><td><code>readLog</code></td><td>就在 <code>clipbook.json</code> 里</td><td>阅读会话流水，append-only，超 180 天或超上限会被裁掉</td></tr></tbody></table>\n<p>三者的分工：<code>news.json</code> 是<strong>还没读的</strong>，剪藏笔记是<strong>你决定留的</strong>，<code>clipbook.json</code> 是<strong>这两者之外的补充状态</strong>。</p>\n<h2>日常怎么用</h2>\n<p>收 → 读 → 归档：</p>\n<ol>\n<li><strong>收</strong>：到点自动抓（间隔由「抓取间隔」决定），也可以随时用命令「剪藏本抓取新文章」（<code>bz-clipbook-fetch-now</code>）立刻跑一轮。</li>\n<li><strong>读</strong>：打开「剪藏本」（<code>bz-clipbook-open</code>），左栏选源，中栏选条目，右侧是阅读面。阅读面正文字号由「阅读字号」控制，改完立即生效。</li>\n<li><strong>归档</strong>：在条目上「保存到剪藏本」→ 生成正式剪藏笔记（正文图片按需保存到图片文件夹）。</li>\n<li><strong>清流</strong>：「标记为已读」让它不再出现在收件流；不想看就删除。整批清可以用「未读全部标为已读」（<code>bz-clipbook-mark-all-read</code>）。</li>\n<li><strong>看统计</strong>：「剪藏阅读报告」（<code>bz-clipbook-report</code>）看读了什么。</li>\n</ol>\n<p>条目上的常用动作：打开笔记、复制双链、复制原文链接、重新生成摘要（已存成笔记的）、删除（<code>src/clipbook/ui.ts:1141</code>）。</p>\n<h2>四个抓取源</h2>\n<table><thead><tr><th>源</th><th>抓什么</th><th>要不要凭据</th><th>备注</th></tr></thead><tbody><tr><td>知乎日报</td><td>每日文章（先取列表再逐篇取详情）</td><td>不要</td><td>只看 24 小时窗口内的（<code>src/clipbook/news-fetcher.ts:10</code>）</td></tr><tr><td>果壳科学人</td><td>最新文章（同样逐篇取正文）</td><td>不要</td><td>同样 24 小时窗口</td></tr><tr><td>B站 UP 动态</td><td>名单里每位 UP 主最近的动态，条数上限由「B站抓取条数」定</td><td>建议配</td><td>带风控标记；抓取失败/被风控会<strong>弹通知告诉你</strong>（不静默）</td></tr><tr><td>RSS 订阅</td><td>每个 feed 最近 30 条</td><td>不要</td><td>轻量 XML 解析；每 feed 保留窗口上限 30（<code>src/clipbook/news-fetcher.ts:23</code>）</td></tr></tbody></table>\n<p>去重口径：<strong>URL + 标题双去重</strong>，每条打上抓取时间；名单为空的源（B站 / RSS）直接跳过，不算报错。</p>\n<h2>全部设置项</h2>\n<h3>外观</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>面板布局</td><td><code>clipbookSkin</code></td><td>卡片选择</td><td>default</td><td>切换面板布局（当前只有「编辑部」）</td></tr><tr><td>面板主题</td><td><code>clipbookSkinTheme</code></td><td>卡片选择</td><td>newsprint</td><td>切换面板主题（当前只有「新闻纸」）</td></tr></tbody></table>\n<h3>显示</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>阅读字号</td><td><code>clipbookReaderFontSize</code></td><td>下拉</td><td>medium</td><td>桌面阅读面正文字号：小 / 中 / 大，改完立即生效</td></tr></tbody></table>\n<h3>目录</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>剪藏文件夹</td><td><code>articleDirectory</code></td><td>路径</td><td><code>归档/网页剪藏</code></td><td>正式剪藏笔记落在哪；<strong>改目录不搬旧笔记</strong></td></tr><tr><td>图片文件夹</td><td><code>clipbookImageFolder</code></td><td>路径</td><td>空</td><td>网页图片保存位置；留空回落 <code>&lt;剪藏文件夹&gt;/assets</code>（<code>src/clipbook/image-save.ts:35</code>）</td></tr></tbody></table>\n<h3>自动摘要</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>自动摘要</td><td>见「自动摘要」章</td><td>开关</td><td>—</td><td>新入库文章自动跑一遍 AI 摘要；<strong>关掉时下面四行一起收起</strong></td></tr><tr><td>摘要长度</td><td>—</td><td>下拉</td><td>—</td><td>简短（50–100 字）/ 标准（150–250 字）/ 详细（300–400 字）（子项）</td></tr><tr><td>生成标签</td><td>—</td><td>开关</td><td>—</td><td>为剪藏生成中文标签（子项）</td></tr><tr><td>标签数量</td><td>—</td><td>文本</td><td>—</td><td>写成区间，如 <code>3-6</code>（子项，只在开了生成标签时显示）</td></tr><tr><td>摘要时机</td><td>—</td><td>下拉</td><td>—</td><td><code>immediate</code> 保存后立刻 / <code>lazy</code> 懒触发（打开时）（子项，改了即时生效，不用重启）</td></tr></tbody></table>\n<h3>数据源</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>立即抓取</td><td>—</td><td>按钮</td><td>—</td><td>马上跑一轮，不必等间隔；范围 = 所有启用的源，名单为空的源跳过。只发 HTTP 请求、不调 AI</td></tr><tr><td>抓取间隔</td><td>—</td><td>下拉</td><td>—</td><td>自动抓取的最小间隔</td></tr><tr><td>知乎日报</td><td><code>newsSourceZhihu</code></td><td>开关</td><td>—</td><td>是否抓这个源</td></tr><tr><td>果壳科学人</td><td><code>newsSourceGuokr</code></td><td>开关</td><td>—</td><td>是否抓这个源</td></tr><tr><td>UP 主名单</td><td>—</td><td>按钮</td><td>—</td><td>「管理」打开名单弹窗；行描述显示当前条数</td></tr><tr><td>RSS 订阅源</td><td>—</td><td>按钮</td><td>—</td><td>「管理」打开订阅弹窗；行描述显示当前条数</td></tr><tr><td>B站抓取条数</td><td>—</td><td>数字</td><td>—</td><td>每位 UP 主抓取的动态条数上限（1–50）</td></tr><tr><td>文章保留天数</td><td>—</td><td>数字</td><td>—</td><td>已读文章数据的保留天数（1–3650）</td></tr></tbody></table>\n<h2>全部命令</h2>\n<table><thead><tr><th>命令</th><th>名称</th><th>做什么</th></tr></thead><tbody><tr><td><code>bz-clipbook-open</code></td><td>剪藏本</td><td>打开剪藏本面板</td></tr><tr><td><code>bz-clipbook-fetch-now</code></td><td>剪藏本抓取新文章</td><td>立刻跑一轮抓取</td></tr><tr><td><code>bz-clipbook-mark-all-read</code></td><td>未读全部标为已读</td><td>清空未读流（条目不删，只是不再算未读）</td></tr><tr><td><code>bz-clipbook-report</code></td><td>剪藏阅读报告</td><td>打开「我读了什么」报告弹层</td></tr></tbody></table>\n<h2>边界、限制与坑</h2>\n<ul>\n<li><strong>抓取不等你</strong>：间隔到点就抓；「文章保留天数」只管已读数据能留多久，不是抓取窗口。</li>\n<li><strong>知乎 / 果壳只看 24 小时</strong>：过了窗口的旧文不会补抓，所以长期不开 Obsidian 会漏。</li>\n<li><strong>B站是动态不是视频</strong>：抓的是 UP 主发布的动态条目，不是完整视频内容。</li>\n<li><strong>RSS 每 feed 只留最近 30 条</strong>：feed 更新极快时，早于窗口的会被裁掉（<code>src/clipbook/news-fetcher.ts:23</code>）。</li>\n<li><strong>改剪藏文件夹不搬旧笔记</strong>：新笔记进新目录，老的留在原地。</li>\n<li><strong>「标记为已读」而「删除」是两回事</strong>：已读保留数据（受保留天数约束），删除是直接从收件流去掉。</li>\n<li><strong>B站被风控会通知</strong>：豆瓣/B站这类拦截会由队列聚合出提示，不是默默失败。</li>\n<li><strong><code>readLog</code> 会自动裁</strong>：超过 180 天或超过条数上限的阅读流水会被清掉，别把它当永久档案。</li>\n<li>外观两行目前各只有一个选项。</li>\n</ul>\n<h2>常见问题</h2>\n<p><strong>抓不到新文章？</strong></p>\n<p>按顺序看：①「抓取间隔」是不是还没到；② 对应源的开关有没有打开；③ 是 B站/RSS 的话，名单是不是空的（空名单 = 整路跳过）；④ B站的话看有没有风控通知 —— 被拦时填 B站 Cookie 能恢复（见 AI 章的凭据一节）。</p>\n<p><strong>保存后的笔记在哪？</strong></p>\n<p>在「剪藏文件夹」里（默认 <code>归档/网页剪藏</code>）；想换地方改这一行即可，但已经存好的不会自己搬。</p>\n<p><strong>自动摘要会不会把我手写的摘要覆盖掉？</strong></p>\n<p>摘要写在剪藏的 frontmatter 字段里，见「自动摘要」章；「自动摘要」只管新进来的文章，已有摘要不受影响。</p>\n<p><strong>阅读报告统计的是什么？</strong></p>\n<p>来自阅读流水 <code>readLog</code> 与剪藏条目，跟书库的「阅读报告」（另一个域）不是一回事。</p>\n<p><strong>文章保留天数设 1 天会怎样？</strong></p>\n<p>已读数据只留一天，报告里的历史会明显变短 —— 未读流里的条目不受它影响。</p>","no":19},{"id":"favorites","title":"收藏本","group":"收集","tags":["collect","favorites"],"domain":"favorites","html":"<blockquote>收集网址与条目，按自定义标签归类、可置顶可归档</blockquote>\n<h2>什么时候用它</h2>\n<p>想攒一个「以后要用的链接 / 条目」清单时用它。跟剪藏本的分工很清楚：</p>\n<table><thead><tr><th></th><th>收藏本</th><th>剪藏本</th></tr></thead><tbody><tr><td>来源</td><td>你手动加（可以关联笔记）</td><td>自动从四个源抓</td></tr><tr><td>形态</td><td>卡片 + 自定义标签</td><td>未读流 + 剪藏笔记</td></tr><tr><td>适合</td><td>工具网址、要反复用的东西、想分类的东西</td><td>每天要读的东西</td></tr></tbody></table>\n<h2>数据放在哪</h2>\n<table><thead><tr><th>文件</th><th>位置</th><th>里面是什么</th></tr></thead><tbody><tr><td><code>favorites.json</code></td><td>数据存储路径</td><td>全部收藏条目</td></tr><tr><td>标签定义</td><td>设置键 <code>favoriteTags</code></td><td>自定义标签的名字与顺序（<code>src/favorites/ui.ts:153</code>）</td></tr></tbody></table>\n<p>条目字段（<code>src/favorites/types.ts:20</code>）：</p>\n<table><thead><tr><th>字段</th><th>含义</th></tr></thead><tbody><tr><td><code>id</code></td><td>标识（新增时取时间戳）</td></tr><tr><td><code>title</code> / <code>description</code> / <code>url</code></td><td>标题 / 说明 / 网址</td></tr><tr><td><code>tags</code></td><td>标签数组</td></tr><tr><td><code>type</code></td><td>等于 <code>tags[0]</code>，卡片按它归组</td></tr><tr><td><code>pinned</code></td><td>置顶（恒排最前，与排序方式无关）</td></tr><tr><td><code>created</code></td><td>创建时间（<code>YYYY-MM-DD HH:mm:ss</code>）</td></tr><tr><td><code>linkedNote</code></td><td>关联的笔记路径（可空）</td></tr><tr><td><code>balance</code> / <code>balanceCacheTime</code> / <code>balanceError</code> / <code>llmConfig</code></td><td>余额类条目用的补充字段</td></tr><tr><td><code>archived</code> / <code>archivedAt</code></td><td>归档标记与归档时间；面板里有「已归档」视图入口（<code>src/favorites/shared.ts:38</code>）</td></tr></tbody></table>\n<h2>面板怎么用</h2>\n<ol>\n<li>「收藏本」命令打开面板（<code>bz-favorites-open</code>）。</li>\n<li>「加收藏」（<code>bz-favorites-add</code>）新增一条；也可以从别的域往这里塞（关联笔记路径会记进 <code>linkedNote</code>）。</li>\n<li>卡片操作（<code>src/favorites/shared.ts:203</code> 的动作清单）：打开、复制网址、置顶 / 取消置顶、编辑、归档 / 取消归档、删除。</li>\n<li>顶部磁贴按标签筛选：</li>\n</ol>\n<ul>\n<li><strong>全部</strong> / <strong>已归档</strong>；</li>\n<li>你自定义的标签磁贴；</li>\n<li>「记住上次」这一档会在下次打开时回到你上次选的标签。</li>\n</ul>\n<ol>\n<li>排序有三种：最新收藏 / 最早收藏 / 按标题。<strong>置顶的条目永远在最前</strong>，跟排序方式无关。</li>\n</ol>\n<h2>标签怎么用</h2>\n<p>标签是这一域的核心，管理入口在设置里：</p>\n<ol>\n<li>设置 → 「标签管理」组（这一行是域内自绘的管理列表，不是普通设置行）。</li>\n<li>在里面<strong>增、删、改、排序</strong>标签；定义存在设置键 <code>favoriteTags</code> 里，单一来源。</li>\n<li>标签就是筛选磁贴的来源 —— 改了标签定义，面板上的磁贴跟着变。</li>\n<li>条目的 <code>type</code> 取 <code>tags[0]</code>，所以<strong>第一个标签决定卡片归在哪组</strong>。</li>\n</ol>\n<h2>全部设置项</h2>\n<h3>外观</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>面板布局</td><td><code>favoritesSkin</code></td><td>卡片选择</td><td>default</td><td>切换面板布局（当前只有「标签工作台」）</td></tr><tr><td>面板主题</td><td><code>favoritesSkinTheme</code></td><td>卡片选择</td><td>linen</td><td>切换面板主题（当前只有「亚麻」）</td></tr></tbody></table>\n<h3>显示</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>打开默认筛选</td><td><code>favoritesOpenFilter</code></td><td>下拉</td><td>空</td><td>全部 / 记住上次 / 以及你自定义的每个标签（选项是动态生成的）。<strong>这一行没有写描述文案</strong>，但功能正常</td></tr><tr><td>默认排序</td><td><code>favoritesDefaultSort</code></td><td>下拉</td><td>new</td><td>最新收藏 / 最早收藏 / 按标题。同样<strong>没有描述文案</strong>，但功能正常</td></tr></tbody></table>\n<h3>标签管理</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>标签管理</td><td><code>favoriteTags</code></td><td>自绘管理行</td><td>—</td><td>增删改排序标签定义（<code>src/favorites/ui.ts:156</code>）</td></tr></tbody></table>\n<h2>全部命令</h2>\n<table><thead><tr><th>命令</th><th>名称</th><th>做什么</th></tr></thead><tbody><tr><td><code>bz-favorites-open</code></td><td>收藏本</td><td>打开收藏本面板</td></tr><tr><td><code>bz-favorites-add</code></td><td>加收藏</td><td>新增一条收藏</td></tr></tbody></table>\n<h2>边界、限制与坑</h2>\n<ul>\n<li><strong>「记住上次」是一个特殊档</strong>：选它之后，下次打开会回到上次选中的标签，而不是「全部」。</li>\n<li><strong>置顶优先于排序</strong>：不管选哪种排序，置顶条目都在最前。</li>\n<li><strong>第一个标签决定归组</strong>：<code>type = tags[0]</code>，想改卡片归在哪组，就调标签顺序。</li>\n<li><strong>改标签定义会影响筛选入口</strong>：标签被删掉后，条目里残留的旧标签名仍然是数据，但面板上不再有对应磁贴。</li>\n<li><strong>两行「显示」设置没有描述文案</strong>：这是现状（不是 bug），意思就是选项名本身。</li>\n<li><strong>归档是冷存</strong>：归档条目默认不出现在正常视图里，要从「已归档」入口看。</li>\n<li><strong>余额字段是给特定条目用的</strong>：普通网址收藏用不到 <code>balance</code> 那几个字段。</li>\n</ul>\n<h2>常见问题</h2>\n<p><strong>收藏和剪藏有什么区别？</strong></p>\n<p>收藏是你手动攒的（可以是任意网址或条目），剪藏是自动抓来的文章。要读新闻用剪藏本，要攒工具网址用收藏本。</p>\n<p><strong>怎么给收藏分类？</strong></p>\n<p>先去设置 →「标签管理」建标签，再在条目上选标签。第一个标签决定卡片归在哪组。</p>\n<p><strong>删掉一个标签，已用的条目会怎样？</strong></p>\n<p>条目里的标签名还在数据里，但面板上没有对应筛选磁贴了 —— 想彻底清掉得在条目上改标签。</p>\n<p><strong>怎么把收藏关联到某篇笔记？</strong></p>\n<p>条目的 <code>linkedNote</code> 字段就是干这个的；从笔记侧发起的收藏会自动带上关联。</p>\n<p><strong>标签顺序能调吗？</strong></p>\n<p>能。「标签管理」支持排序，顺序会影响卡片归组与磁贴排列。</p>","no":20},{"id":"bookshelf","title":"书库","group":"媒体与阅读","tags":["media","books"],"domain":"bookshelf","html":"<blockquote>把在读的书摆成一面封面墙，连 EPUB 的进度与划线一起看</blockquote>\n<h2>什么时候用它</h2>\n<p>想让「我在读什么 / 读完哪些」一目了然时用它。它读两类书：</p>\n<ul>\n<li><strong>普通笔记书</strong>：书库目录里、frontmatter 带书标签的笔记；</li>\n<li><strong>EPUB</strong>：读取书插件（Weave）存在 <code>weave-data.json</code> 里的阅读数据（进度、划线、想法）。</li>\n</ul>\n<p>所以它自己不产生阅读数据 —— 只是把这些摆到一面墙上，并给「继续在读」这类动作提供入口。</p>\n<h2>数据放在哪</h2>\n<table><thead><tr><th>来源</th><th>位置</th><th>里面是什么</th></tr></thead><tbody><tr><td>笔记书</td><td>书库文件夹（默认 <code>书库</code>）</td><td>每本书一篇 <code>.md</code>，<strong>frontmatter 的 <code>tags</code> 里要有书标签</strong>（默认 <code>book</code>）才被识别（<code>src/bookshelf/data.ts:4</code>）</td></tr><tr><td>封面</td><td>书库目录内</td><td>与书同名的图片（<code>jpg/jpeg/png/webp/gif</code> 依次探测）</td></tr><tr><td><code>weave-data.json</code></td><td>数据存储路径（默认 <code>CONFIG/STORAGE</code>；读的是 Weave 插件的 <code>dataPath</code>）</td><td>EPUB 的阅读进度、划线、想法（<code>src/bookshelf/data.ts:6</code>）</td></tr><tr><td>阅读报告</td><td>域内视图，无独立文件</td><td>见「阅读报告」章（借这里的数据）</td></tr></tbody></table>\n<p><strong>目录形态有两种，同权</strong>：<code>书库/…</code> 目录前缀下的笔记，或者目录本身就是一个 md 笔记（<code>书库.md</code>）。</p>\n<p><strong>状态是推出来的</strong>，不是存的（<code>src/bookshelf/data.ts:7</code>）：</p>\n<table><thead><tr><th>条件</th><th>状态</th></tr></thead><tbody><tr><td>有 <code>readingDate</code>、没有 <code>completionDate</code></td><td>在读</td></tr><tr><td>两个都有</td><td>已读</td></tr><tr><td>其他</td><td>未读</td></tr></tbody></table>\n<h2>加一本书</h2>\n<ol>\n<li>在书库文件夹里建一篇笔记，frontmatter 写 <code>tags</code>（含书标签，默认 <code>book</code>），再补书名、作者等字段。</li>\n<li>想有封面，就在同目录放一张同名图片。</li>\n<li><strong>EPUB</strong> 不用手动加：用 Weave 插件读，读完的数据会落在 <code>weave-data.json</code>，书库自动出现在墙上（缺 <code>title</code> / <code>vaultPath</code> 的条目会被跳过，<code>src/bookshelf/data.ts:204</code>）。</li>\n</ol>\n<h2>读书与记笔记</h2>\n<ul>\n<li><strong>笔记书</strong>：在笔记里正常写；划线、摘录、读后感都是笔记正文的一部分。</li>\n<li><strong>EPUB</strong>：划线 + 想法由 Weave 写进 <code>weave-data.json</code>，书库能直接按<strong>章节分组</strong>渲染这些划线（<code>src/bookshelf/epub-notes.ts:2</code>）—— 也就是说 EPUB 的读书笔记不落成单独的 md。</li>\n<li>想让「在读 / 已读」判断准，关键是 <code>readingDate</code> 与 <code>completionDate</code> 这两个字段。</li>\n</ul>\n<h2>面板怎么用</h2>\n<ol>\n<li>「书库」命令打开书架墙（<code>bz-bookshelf-open</code>，再执行一次是关闭）。</li>\n<li>墙上是书脊/封面；侧栏按状态筛（全部 / 在读 / 未读 / 已读），默认选中哪个由「默认筛选」决定。</li>\n<li>点一本书进详情：基本信息、进度、划线（EPUB）。</li>\n<li>「继续在读」（<code>bz-bookshelf-continue</code>）：直接跳到在读的书；<strong>一本都没有时会提示「书库里还没有在读的书」</strong>（<code>src/bookshelf/index.ts:107</code>）。</li>\n<li>面板里还能切到阅读分析报告视图（命令 <code>bz-reading-report-open</code> 直达，见「阅读报告」章）。</li>\n</ol>\n<h2>全部设置项</h2>\n<h3>外观</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>面板布局</td><td><code>bookshelfLayout</code></td><td>卡片选择</td><td>default</td><td>切换面板布局（当前只有「书架墙」）</td></tr><tr><td>面板主题</td><td><code>bookshelfTheme</code></td><td>卡片选择</td><td>—</td><td>切换面板主题</td></tr></tbody></table>\n<h3>目录</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>书库文件夹</td><td><code>bookshelfFolderPath</code></td><td>路径</td><td><code>书库</code></td><td>书目笔记所在目录。老配置里的 <code>libraryFolderPath</code> 仍会被读（零感知迁移），最终回落 <code>书库</code>（<code>src/bookshelf/data.ts:24</code>）</td></tr></tbody></table>\n<h3>显示</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>默认筛选</td><td><code>bookshelfDefaultSide</code></td><td>下拉</td><td>all</td><td>打开面板时侧栏选中：全部 / 在读 / 未读 / 已读</td></tr><tr><td>默认排序</td><td><code>bookshelfSortMode</code></td><td>下拉</td><td>recent</td><td>最近读完 / 时长最长 / 书名</td></tr></tbody></table>\n<p>书标签（<code>bookTag</code>）的默认值是 <code>book</code>；这个键随着旧 library 域退役已不再暴露在设置里，但<strong>存量值仍生效</strong>（<code>src/bookshelf/data.ts:34</code>）。</p>\n<h2>全部命令</h2>\n<table><thead><tr><th>命令</th><th>名称</th><th>做什么</th></tr></thead><tbody><tr><td><code>bz-bookshelf-open</code></td><td>书库</td><td>打开/关闭书架墙</td></tr><tr><td><code>bz-bookshelf-continue</code></td><td>继续在读</td><td>直接跳到正在读的那本</td></tr></tbody></table>\n<h2>边界、限制与坑</h2>\n<ul>\n<li><strong>没书标签就不进墙</strong>：笔记的 <code>tags</code> 里没有书标签（默认 <code>book</code>），插件当它不是书。</li>\n<li><strong>状态靠两个日期推</strong>：<code>readingDate</code> / <code>completionDate</code> 缺一个判断就会偏 —— 想让某本变「在读」，补 <code>readingDate</code>、清掉 <code>completionDate</code>。</li>\n<li><strong>EPUB 数据归 Weave 管</strong>：<code>weave-data.json</code> 是它写的（默认位置在数据存储路径），书库只读不写；没装/没用 Weave 就没有 EPUB 条目。</li>\n<li><strong>EPUB 笔记不落 md</strong>：划线想法按章节渲染在面板里，不会写进你的笔记 —— 想留档得自己摘出来。</li>\n<li><strong>改书库文件夹不搬笔记</strong>，旧目录里的书不会自动过来。</li>\n<li><strong>封面靠同名图片</strong>：文件名对不上就显示不出封面。</li>\n<li>外观两行目前各只有一个选项。</li>\n</ul>\n<h2>常见问题</h2>\n<p><strong>我的书没出现在墙上？</strong></p>\n<p>按顺序查：① 笔记在不在「书库文件夹」里；② frontmatter 的 <code>tags</code> 有没有书标签（默认 <code>book</code>）。</p>\n<p><strong>为什么状态一直是「未读」？</strong></p>\n<p>状态是从 <code>readingDate</code> / <code>completionDate</code> 推出来的 —— 没有这两个字段就是未读。</p>\n<p><strong>EPUB 怎么进书库？</strong></p>\n<p>用 Weave 插件读，阅读数据落进 <code>weave-data.json</code>，书库自动读到。</p>\n<p><strong>「继续在读」提示没有在读的书？</strong></p>\n<p>说明筛出来的在读集合是空的：检查书有没有 <code>readingDate</code>、有没有误填 <code>completionDate</code>。</p>\n<p><strong>阅读报告在哪？</strong></p>\n<p>在书架墙内的报告视图，命令是 <code>bz-reading-report-open</code>；详见「阅读报告」章。</p>","no":21},{"id":"cinema","title":"影院","group":"媒体与阅读","tags":["media","cinema"],"domain":"cinema","html":"<blockquote>把看过的影视做成海报墙，按季合并、随机抽一部</blockquote>\n<h2>什么时候用它</h2>\n<p>想记「看过什么、打几分」，并且愿意看海报墙时用它。数据就是一篇篇普通笔记，插件只负责把它们<strong>读成</strong>条目、抓豆瓣字段、按状态和评分组织成墙。</p>\n<p>适合：记录观影/追剧进度，攒一个能回顾的观影史。</p>\n<p>不适合：只想列个待看清单 —— 那用备忘录更轻。</p>\n<h2>数据放在哪</h2>\n<table><thead><tr><th>位置</th><th>说明</th></tr></thead><tbody><tr><td>影视文件夹</td><td>默认 <code>我的/影视</code>（<code>src/cinema/state.ts:10</code>）。<strong>日记本也读这个目录</strong>，两边共用</td></tr><tr><td>海报文件夹</td><td>豆瓣抓回来的海报图片存这里（可在设置里改）</td></tr><tr><td>数据存储路径</td><td>本域<strong>不写</strong> json：条目全部来自笔记本身，没有独立数据文件</td></tr></tbody></table>\n<p>每篇笔记靠 frontmatter 表达，字段如下（<code>src/cinema/data.ts:23</code>）：</p>\n<table><thead><tr><th>frontmatter 字段</th><th>含义</th></tr></thead><tbody><tr><td><code>tags</code></td><td>类型标签（<code>ALL_TAGS</code> 里的第一个命中项决定分组；没有固定标签时取首个标签；完全没有标签的笔记会被跳过）</td></tr><tr><td><code>评分</code></td><td><strong>状态就由它推断</strong>：<code>-1</code> = 想看，<code>0</code> = 在看，大于 0（或没填） = 已看（<code>src/cinema/data.ts:51</code>）</td></tr><tr><td><code>观影日期</code></td><td>观看日期</td></tr><tr><td><code>海报</code></td><td>海报路径</td></tr><tr><td><code>影评</code></td><td>你的短评</td></tr><tr><td><code>类型</code> / <code>导演</code> / <code>主演</code> / <code>制片国家/地区</code></td><td>豆瓣抓回来的字段</td></tr><tr><td><code>上映日期</code></td><td>年份显示取它的前 4 位</td></tr><tr><td><code>豆瓣评分</code> / <code>豆瓣链接</code></td><td>豆瓣来源信息（链接必须 <code>http(s)://</code> 开头才认）</td></tr><tr><td><code>简介</code></td><td>剧情简介</td></tr><tr><td><code>片长</code> / <code>季集</code> / <code>热门短评</code></td><td>分析页统计与详情展示用</td></tr></tbody></table>\n<p>文件名里的片名用 <code>《名称》</code> 形式表达，插件从文件名提取。</p>\n<h2>录入一部片子</h2>\n<ol>\n<li>执行「加影视」（<code>bz-cinema-add</code>）。</li>\n<li>输入片名搜索 —— 命中之后自动抓取豆瓣字段（评分、导演、主演、类型、地区、片长等）。</li>\n<li>抓回来的海报存进海报文件夹，笔记写进影视文件夹。</li>\n<li>想补手写内容，直接在笔记的 <code>影评</code> 里写。</li>\n</ol>\n<p>豆瓣字段抓取需要凭据（在 AI 面板的「数据源凭据」组）：</p>\n<ul>\n<li><strong>ApiZero Key</strong>：用来补齐评分、导演、主演、类型、地区、片长这些字段；不填就走内置的演职员信息兜底，能取多少算多少（详见 AI 章）。</li>\n<li><strong>豆瓣 Cookie</strong>：平时不用填；豆瓣开始拦搜索时填上才能继续搜。被拦会由队列聚合出通知。</li>\n</ul>\n<h2>面板怎么用</h2>\n<ol>\n<li>「影院」命令打开面板（<code>bz-cinema-open</code>）。</li>\n<li>主区是<strong>海报墙</strong>，固定<strong>5 列</strong>（列数不再提供设置）。</li>\n<li>顶部/侧边有：</li>\n</ol>\n<ul>\n<li>默认排序与默认状态筛选（打开面板时用的那套，在设置里配）；</li>\n<li>搜索与筛选（按状态：想看 / 在看 / 已看）；</li>\n<li>点卡片进详情，看抓回来的字段与影评。</li>\n</ul>\n<ol>\n<li>「随机抽一部」（<code>bz-cinema-random-pick</code>）：从库里随机挑一部，选择困难时用。</li>\n<li>「影视分析报告」（<code>bz-cinema-analysis</code>）：内嵌的分析页，统计看过的量、评分分布、片长与季集等（报告窗是并入的，不再是独立域，<code>src/cinema/settings.ts:52</code> 注释引 ADR-0090）。</li>\n</ol>\n<h2>全部设置项</h2>\n<h3>外观</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>面板布局</td><td><code>cinemaSkin</code></td><td>卡片选择</td><td>default</td><td>切换面板布局</td></tr><tr><td>面板主题</td><td><code>cinemaSkinTheme</code></td><td>卡片选择</td><td>—</td><td>切换面板主题</td></tr></tbody></table>\n<h3>目录</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>影视文件夹</td><td><code>cinemaFolderPath</code></td><td>路径</td><td><code>我的/影视</code></td><td>影院读这里的笔记；<strong>日记本共用同一目录</strong>，改了那边一起变</td></tr><tr><td>海报文件夹</td><td><code>cinemaPosterFolder</code></td><td>路径</td><td>库内默认位置</td><td>豆瓣抓取的海报存这里</td></tr></tbody></table>\n<h3>显示</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>默认排序</td><td><code>cinemaSortMode</code></td><td>下拉</td><td>date</td><td>最近观看 / 按创建时间 / 按评分</td></tr><tr><td>默认状态筛选</td><td><code>cinemaStatusFilter</code></td><td>下拉</td><td>空</td><td>全部 / 想看 / 在看 / 已看</td></tr><tr><td>剧集按季合并</td><td><code>cinemaMergeSeasons</code></td><td>开关</td><td><strong>开</strong></td><td>同一部剧 ≥2 季时合并成一张卡片，点进详情展开各季；「剧名：副标题」这类特别篇在卡片详情里单列</td></tr></tbody></table>\n<p>原「网格每行列数」设置行<strong>已退役</strong>，列数固定 5（2026-09-26 拍板）。</p>\n<h2>全部命令</h2>\n<table><thead><tr><th>命令</th><th>名称</th><th>做什么</th></tr></thead><tbody><tr><td><code>bz-cinema-open</code></td><td>影院</td><td>打开海报墙面板</td></tr><tr><td><code>bz-cinema-add</code></td><td>加影视</td><td>搜索 → 抓豆瓣字段 → 写笔记</td></tr><tr><td><code>bz-cinema-random-pick</code></td><td>随机抽一部</td><td>从库里随机挑一部</td></tr><tr><td><code>bz-cinema-analysis</code></td><td>影视分析报告</td><td>打开内嵌分析页</td></tr></tbody></table>\n<h2>边界、限制与坑</h2>\n<ul>\n<li><strong>状态没有独立字段</strong>：状态是从 <code>评分</code> 推出来的（-1 想看 / 0 在看 / 其他已看）。想改状态就改评分 —— 只改别的字段没用。</li>\n<li><strong>没有 <code>tags</code> 的笔记不显示</strong>：完全没有标签的笔记会被跳过（<code>src/cinema/data.ts:33</code>）。</li>\n<li><strong>影视目录与日记本共用</strong>：改路径是两边一起改，旧目录里的笔记不会自动搬。</li>\n<li><strong>抓字段要靠凭据</strong>：没有 ApiZero Key 时字段会缺一块（走内置兜底）；豆瓣开始拦搜索时得填 Cookie，否则搜索一直失败（会有通知）。</li>\n<li><strong>列数固定 5 列</strong>：设置里没有这一项了。</li>\n<li><strong>按季合并是纯渲染层的分组</strong>：不改笔记、不改文件名、不动目录；关掉立刻恢复每季一张卡。</li>\n<li><strong>片名从文件名提取</strong>：文件名格式不规范会拿不到片名（用 <code>《名称》</code> 最稳）。</li>\n</ul>\n<h2>常见问题</h2>\n<p><strong>加了一部但海报墙上没有？</strong></p>\n<p>先看文件名里有没有片名、笔记有没有 <code>tags</code>（没有标签会被跳过）。两个都正常就是不显示，再检查「影视文件夹」指向的目录对不对。</p>\n<p><strong>想把「已看」改回「在看」？</strong></p>\n<p>把 <code>评分</code> 改成 <code>0</code>；改回「想看」就填 <code>-1</code>。这是状态唯一的来源。</p>\n<p><strong>为什么抓不到评分和演员？</strong></p>\n<p>两个可能：没配 ApiZero Key（只剩内置兜底信息），或者豆瓣在拦搜索 —— 后者会有拦截通知，配上豆瓣 Cookie 就能恢复。</p>\n<p><strong>剧集怎么整理？</strong></p>\n<p>一部剧各季各写一篇笔记，打开「剧集按季合并」就会在墙上合成一张卡，详情里分开列。</p>\n<p><strong>随机抽一部会不会抽到想看但没看的？</strong></p>\n<p>会。它按当前筛选范围抽，想只看已看就先筛「已看」再抽。</p>","no":22},{"id":"gameshelf","title":"游戏库","group":"媒体与阅读","tags":["media","games"],"domain":"gameshelf","html":"<blockquote>把 Steam 库同步进 Obsidian：一作一笔记，时长与封面自动管</blockquote>\n<h2>什么时候用它</h2>\n<p>想把 Steam 的游戏库（已购、时长、最近在玩、成就）变成库里可查、可写感受的笔记时用它。</p>\n<p>它的做法跟影院一致（一作一笔记，<code>src/gameshelf/state.ts:3</code>）：<strong>游戏数据写进笔记的 frontmatter，Steam 同步负责维护那几个字段</strong>，你自己写的感想留在正文里，互不覆盖。</p>\n<h2>数据放在哪</h2>\n<table><thead><tr><th>位置</th><th>说明</th></tr></thead><tbody><tr><td><code>我的/游戏/*.md</code>（可配）</td><td>一作一笔记，目录默认 <code>我的/游戏</code>（<code>src/gameshelf/state.ts:9</code>）</td></tr><tr><td>笔记 frontmatter</td><td>Steam 管辖的字段（见下表），同步时被刷新</td></tr><tr><td>海报文件夹</td><td>封面 / 图标本地化的落点（可在设置里改）</td></tr><tr><td>数据存储路径</td><td>本域<strong>不写 json</strong>：数据就在笔记里</td></tr></tbody></table>\n<p>frontmatter 里 Steam 管的字段（<code>src/gameshelf/state.ts:48</code>）：</p>\n<table><thead><tr><th>字段</th><th>含义</th></tr></thead><tbody><tr><td><code>appid</code></td><td>Steam 应用 ID（与 Steam 库对应的唯一键）</td></tr><tr><td><code>playtimeMin</code></td><td>累计游玩分钟数</td></tr><tr><td>平台分项分钟（四键）</td><td>各平台的分钟数分项；老笔记缺键按 0 处理</td></tr><tr><td><code>中文名</code></td><td>中文名 —— Steam 只给英文名，中文名由商店接口回填（<code>src/gameshelf/names.ts:4</code>）</td></tr><tr><td><code>封面</code> / <code>封面源</code></td><td>封面本地路径 / 远端地址（本地化之后远端仍留着，删缓存能重下）</td></tr><tr><td><code>图标</code> / <code>图标源</code></td><td>同上，图标</td></tr><tr><td>成就相关</td><td>有社区成就页时才写（<code>src/gameshelf/state.ts:69</code>）</td></tr></tbody></table>\n<h2>第一次配置</h2>\n<ol>\n<li>填 <strong>SteamID64</strong>：17 位纯数字、固定以 <code>7656</code> 开头。<strong>不符合格式就判为未配置，不会发出任何请求</strong>。</li>\n<li>填 <strong>Web API 密钥</strong>：在 Steam 官网开发者页免费申请，32 位串，掩码显示（点了才显形）。</li>\n<li>两项<strong>必须都填</strong>：任一为空，同步就停在未配置状态（<code>src/gameshelf/settings.ts:72</code>）。</li>\n<li>想让打开面板时自动补数据，打开「自动同步」。</li>\n<li>手动跑一次「同步游戏库」（<code>bz-gameshelf-sync</code>）。</li>\n</ol>\n<p><strong>网络是这一域最大的门槛</strong>：Steam 接口国内直连常被重置，需要系统代理（<code>src/gameshelf/steam.ts:7</code>）。另外中文名回填走的是另一条网络路径（商店接口），跟同步不是一回事 —— 所以<strong>同步成功不代表中文名立刻有</strong>（<code>src/gameshelf/backfill.ts:20</code>）。</p>\n<h2>同步是怎么跑的</h2>\n<table><thead><tr><th>阶段</th><th>拉什么</th></tr></thead><tbody><tr><td>库同步</td><td><code>GetOwnedGames</code>（已购 + 累计时长）+ <code>GetRecentlyPlayedGames</code>（最近游玩）</td></tr><tr><td>详情</td><td><code>appdetails</code> + <code>appreviews</code> 等（补商店信息与评价）</td></tr><tr><td>中文名回填</td><td>走商店接口单独补 <code>中文名</code>，不经 <code>api.steampowered.com</code></td></tr><tr><td>封面 / 图标</td><td>本地化到海报文件夹；<code>封面源</code> / <code>图标源</code> 保留远端地址</td></tr></tbody></table>\n<ul>\n<li><strong>手动</strong>：命令「同步游戏库」。</li>\n<li><strong>自动</strong>：「自动同步」开着时，打开面板发现数据过期就自动拉一次。</li>\n<li><strong>失败</strong>：网络被重置是最常见的失败原因 —— 挂上系统代理再试。</li>\n</ul>\n<h2>面板怎么用</h2>\n<ol>\n<li>「游戏库」命令打开（<code>bz-gameshelf-open</code>）。</li>\n<li>主区是游戏墙（封面 + 时长），可搜索、可切换视图。</li>\n<li>点开一部：看累计时长、最近游玩、成就进度等同步来的数据；想写感想直接编辑笔记正文。</li>\n<li>「游戏库数据统计」（<code>bz-gameshelf-stats</code>）看总量、时长分布这类统计。</li>\n</ol>\n<h2>全部设置项</h2>\n<h3>外观</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>面板布局</td><td><code>gameshelfLayout</code></td><td>卡片选择</td><td>default</td><td>切换面板布局</td></tr><tr><td>面板主题</td><td><code>gameshelfTheme</code></td><td>卡片选择</td><td>—</td><td>切换面板主题</td></tr></tbody></table>\n<h3>目录</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>游戏文件夹</td><td><code>gameshelfFolder</code></td><td>路径</td><td><code>我的/游戏</code></td><td>游戏笔记所在目录；尾斜杠会自动归一（否则扫描前缀会恒零匹配，<code>src/gameshelf/state.ts:13</code>）</td></tr><tr><td>海报文件夹</td><td><code>gameshelfPosterFolder</code></td><td>路径</td><td>—</td><td>封面与图标本地化的落点</td></tr></tbody></table>\n<h3>Steam</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>SteamID64</td><td><code>gameshelfSteamId</code></td><td>文本</td><td>空</td><td>Steam 的固定数字 ID，17 位、7656 开头；格式不符视为未配置、不发请求</td></tr><tr><td>Web API 密钥</td><td><code>gameshelfSteamApiKey</code></td><td>密钥（掩码）</td><td>空</td><td>与 SteamID64 并列必填；<strong>密钥是账号级的，要跟 ID 对上</strong> —— 配成别人的 ID 拉回来的就是别人的库</td></tr><tr><td>自动同步</td><td><code>gameshelfAutoSync</code></td><td>开关</td><td>—</td><td>打开面板时数据过期即自动拉取</td></tr></tbody></table>\n<h2>全部命令</h2>\n<table><thead><tr><th>命令</th><th>名称</th><th>做什么</th></tr></thead><tbody><tr><td><code>bz-gameshelf-open</code></td><td>游戏库</td><td>打开游戏墙</td></tr><tr><td><code>bz-gameshelf-sync</code></td><td>同步游戏库</td><td>立刻拉一次 Steam 数据并回写笔记</td></tr><tr><td><code>bz-gameshelf-stats</code></td><td>游戏库数据统计</td><td>打开统计视图</td></tr></tbody></table>\n<h2>边界、限制与坑</h2>\n<ul>\n<li><strong>两个凭据缺一不可</strong>：任一为空 → 同步不跑。填了 ID 没填密钥同样是「未配置」。</li>\n<li><strong>ID 格式卡得死</strong>：17 位纯数字、<code>7656</code> 开头；写成昵称或链接一律视为未配置。</li>\n<li><strong>密钥必须与 ID 对应</strong>：账号级密钥配别人的 ID，拉回来的是别人的库。</li>\n<li><strong>国内直连常被重置</strong>：这是最常见的失败原因，需要系统代理（<code>src/gameshelf/steam.ts:7</code>）。</li>\n<li><strong>中文名是另一条链路</strong>：同步成功 ≠ 中文名立刻有；它走商店接口单独回填，缺了不影响别的字段。</li>\n<li><strong>同步会刷新 frontmatter</strong>：<code>appid</code> / 时长 / 封面那几项由同步管辖，手改会被下次同步覆盖 —— 感想写在正文，别写进这些字段。</li>\n<li><strong>一作一笔记</strong>：一部游戏对应一篇笔记，靠 <code>appid</code> 对上。</li>\n<li>外观两行目前各只有一个选项。</li>\n</ul>\n<h2>常见问题</h2>\n<p><strong>同步没反应？</strong></p>\n<p>按顺序查：① SteamID64 格式对不对（17 位、7656 开头）；② 密钥填了没；③ 有没有挂系统代理 —— 国内直连被重置是最常见的原因。</p>\n<p><strong>时长显示 0？</strong></p>\n<p>这一部可能没同步到（新入库/私有资料），跑一次手动同步；老笔记缺平台分项键会按 0 显示。</p>\n<p><strong>中文名一直没有？</strong></p>\n<p>中文名走独立的商店接口回填，跟同步分开 —— 挂上代理后再同步一次，或等下一轮回填。</p>\n<p><strong>能改游戏数据吗？</strong></p>\n<p>不能，那是 Steam 同步管的字段；但你可以在正文里写自己的评测，同步不会动正文。</p>\n<p><strong>库里没有的游戏怎么办？</strong></p>\n<p>同步只拉你 Steam 库里的；想手动加需要自己建笔记并补 <code>appid</code>。</p>","no":23},{"id":"knowledge","title":"知识盒","group":"媒体与阅读","tags":["media","knowledge"],"domain":"knowledge","html":"<blockquote>把名词、段落、图片、视频收成文献笔记，并让卡片互相挂上</blockquote>\n<h2>什么时候用它</h2>\n<p>看书、看视频、刷到一段好文字的时候用它：把「外部的东西」做成库里可检索、可关联的文献笔记。</p>\n<p>三条主线：</p>\n<ol>\n<li><strong>录入</strong>：四个入口分别处理名词、段落、图片、视频，产出格式统一的文献笔记；</li>\n<li><strong>关联</strong>：卡片之间自动建 <code>related</code>（引擎在第二大脑，开关在这边）；</li>\n<li><strong>挂载</strong>：把卡片「挂」到文献的对应位置上，附 AI 语义建议。</li>\n</ol>\n<p>命令第二多的域（9 条）。</p>\n<h2>数据放在哪</h2>\n<table><thead><tr><th>文件 / 目录</th><th>位置</th><th>里面是什么</th></tr></thead><tbody><tr><td>文献文件夹</td><td>库内（可配，默认名 <code>文献盒</code>）</td><td>部壹：录入的文献笔记</td></tr><tr><td>卡片文件夹</td><td>库内（可配，默认名 <code>卡片盒</code>）</td><td>部贰：你自己写的卡片</td></tr><tr><td>主题文件夹</td><td>库内（可配，默认名 <code>主题盒</code>）</td><td>部叁：专题笔记</td></tr><tr><td>图版图片文件夹</td><td>库内（可配）</td><td>图版录入时保存的图片</td></tr><tr><td><code>knowledge.json</code></td><td>数据存储路径</td><td>转文献的归档记录（每条含笔记路径、视频路径、状态等）</td></tr><tr><td><code>mount-suggest.json</code></td><td>数据存储路径</td><td>挂载建议的候选与缓存</td></tr><tr><td>视频文件</td><td>由「输出文件夹」决定，<strong>可放在库外</strong></td><td>下载/转录出来的视频（实际写盘的是外部工具）</td></tr></tbody></table>\n<p>三个目录名不是写死的：文献 / 卡片 / 主题都能改，「三盒」这个说法讲的就是它们三个（<code>src/core/knowledge-boxes.ts:21</code>）。</p>\n<h2>四条录入命令</h2>\n<table><thead><tr><th>命令</th><th>名称</th><th>输入什么</th><th>产出什么</th><th>前置条件</th></tr></thead><tbody><tr><td><code>bz-knowledge-note-term</code></td><td>名词生成文献笔记</td><td>一个名词或术语</td><td>一篇文献笔记</td><td>配好 AI 通道</td></tr><tr><td><code>bz-knowledge-note-passage</code></td><td>段落生成文献笔记</td><td>一段文字</td><td>一篇文献笔记（带出处）</td><td>配好 AI 通道</td></tr><tr><td><code>bz-knowledge-note-image</code></td><td>图版生成文献笔记</td><td>一张图片</td><td>图片存进「图版图片文件夹」+ 一篇文献笔记</td><td>配好 AI 通道</td></tr><tr><td><code>bz-knowledge-note-video</code></td><td>影像生成文献笔记</td><td>视频链接或文件</td><td>下载/转写 → 一篇文献笔记</td><td><strong>装好外部工具链</strong>（见下节）</td></tr></tbody></table>\n<p>四条产出格式统一，所以在库里能用同一套检索与关联。</p>\n<h2>视频转文字的外部工具链</h2>\n<p>视频这条链路不靠插件本身干活，插件只把任务交给外部命令 <code>bili-dl</code>（全局命令，一次传一批；Windows 上的 <code>.cmd</code> 以 shell 方式启动，<code>src/knowledge/processor.ts:90</code>）。</p>\n<p>插件下发的参数（<strong>留空 = 跟随工具自己的默认配置</strong>，<code>src/knowledge/processor.ts:184</code>）：</p>\n<table><thead><tr><th>参数</th><th>来自哪</th></tr></thead><tbody><tr><td><code>pythonPath</code></td><td>AI 面板 · 语音转写组的 Python 路径</td></tr><tr><td><code>ffmpegPath</code></td><td>同上的 ffmpeg 路径</td></tr><tr><td><code>outputDir</code></td><td>「输出文件夹」</td></tr><tr><td>清晰度</td><td>「下载清晰度」</td></tr><tr><td>压缩开关与质量</td><td>「视频压缩」+「压缩质量 CRF」</td></tr></tbody></table>\n<p>跑起来是<strong>串行</strong>的：一批任务按列表顺序一个一个来，不并行。</p>\n<p>出错怎么读：</p>\n<ul>\n<li><strong>「未找到 bili-dl」</strong>：全局命令没装上（<code>ENOENT</code>），按提示里的说明装（<code>src/knowledge/processor.ts:239</code>）。</li>\n<li><strong>整批报「未配置 pythonPath」</strong>：Python 路径留空、工具默认配置里也没有 —— 这时必须显式填上，整批都会卡在这一步（<code>src/knowledge/processor.ts:187</code>）。</li>\n<li>开了「遇错即停」，第一条失败就停整批；否则继续跑后面的。</li>\n</ul>\n<h2>自动关联与挂载</h2>\n<p><strong>自动关联</strong>（引擎在第二大脑，开关在这里）</p>\n<p>笔记改动后自动建关联。范围<strong>恒为三个盒子</strong>，两端都限，手动命令也不例外（<code>src/secondbrain/link-agent/pipeline.ts:6</code>）。</p>\n<ul>\n<li>「重跑当前笔记关联」（<code>bz-knowledge-relink</code>）：对当前这篇重跑。</li>\n<li>「为未关联笔记批量补链」（<code>bz-knowledge-link-all</code>）：给三盒里缺 <code>related</code> 的存量批量补。</li>\n<li><strong>改完要重载插件才生效</strong> —— 监听在插件启动那一刻注册（面板会提示）。</li>\n<li>子项：单篇候选数量 TopK、每篇关联上限（0 = 不限，交裁判决定）、候选相似度下限（0 = 不过滤）、完成通知、失效关联自动清理、已有关联不再建链。</li>\n</ul>\n<p><strong>挂载树与建议</strong>（<code>bz-knowledge-mount-tree</code> / <code>bz-knowledge-mount-refresh</code>）</p>\n<p>「挂载」= 把卡片挂到文献的具体位置（整篇 / 某标题 / 某段落）。建议由三段 AI 链路给出（<code>src/knowledge/mount-suggest.ts:2</code>）：</p>\n<ol>\n<li>查询官把片段变成「完整短句 + 关键词」双查询；</li>\n<li>在<strong>卡片盒之内</strong>本地召回候选（去自指、同笔记去重留最高分、双查询并集，总量 10）；</li>\n<li>采纳官定「哪个片段挂到哪篇」（同一目标最多 2 条）；</li>\n<li>定位官现读被采纳笔记全文，给出可回定位的锚点（找不到就退回片段锚点，允许否决）。</li>\n</ol>\n<p>结果落缓存 <code>mount-suggest.json</code>。「清空建议缓存」清的就是候选与缓存；打开挂载树时要不要自动生成建议，由「挂载建议」开关决定。</p>\n<h2>面板怎么用</h2>\n<ol>\n<li>「知识盒」命令打开面板，左导航切换视图。</li>\n<li>主要视图：</li>\n</ol>\n<ul>\n<li><strong>转文献任务列表</strong>：每行一条任务，行上可「打开文献笔记」「复制视频路径」「编辑」「删除」（<code>src/knowledge/ui.ts:1572</code>）；历史视图里是「移出历史」。</li>\n<li><strong>挂载树</strong>：看卡片与文献的挂载关系，打开时可自动出建议。</li>\n<li><strong>维护</strong>：「清空历史」「挂载建议」开关、「清空建议缓存」。</li>\n</ul>\n<ol>\n<li>想随时重跑建议，用命令「重跑挂载建议」。</li>\n</ol>\n<h2>全部设置项</h2>\n<h3>外观</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>面板布局</td><td><code>knowledgeSkin</code></td><td>卡片选择</td><td>default</td><td>切换面板布局（当前只有「词条」一种）</td></tr><tr><td>面板主题</td><td><code>knowledgeSkinTheme</code></td><td>卡片选择</td><td>manila</td><td>切换面板主题（当前只有「牛皮纸」一种）</td></tr></tbody></table>\n<h3>目录与分类</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>文献文件夹</td><td><code>knowledgeDirectory</code></td><td>路径</td><td><code>文献盒</code></td><td>文献笔记所在目录，部壹扫描这里</td></tr><tr><td>图版图片文件夹</td><td><code>knowledgeImageFolder</code></td><td>路径</td><td>—</td><td>图版录入的图片保存位置</td></tr><tr><td>卡片文件夹</td><td><code>knowledgeCardboxDirectory</code></td><td>路径</td><td><code>卡片盒</code></td><td>你自己写的卡片目录</td></tr><tr><td>主题文件夹</td><td><code>knowledgeTopicDirectory</code></td><td>路径</td><td><code>主题盒</code></td><td>主题笔记目录</td></tr><tr><td>领域词表</td><td><code>knowledgeDomainList</code></td><td>多行文本</td><td>空</td><td>逗号分隔的领域词</td></tr></tbody></table>\n<p>改这三个目录名会连带影响第二大脑的索引范围（三盒解析同源）。</p>\n<h3>自动关联</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>自动关联</td><td><code>linkAgentEnabled</code></td><td>开关</td><td>开</td><td>笔记改动后自动建关联；<strong>改完要重载插件</strong>。下面六行只在开着时显示</td></tr><tr><td>单篇候选数量 TopK</td><td><code>linkAgentTopK</code></td><td>数字</td><td>—</td><td>每篇取多少近邻候选（1–50）</td></tr><tr><td>每篇关联上限</td><td><code>linkAgentMaxLinks</code></td><td>数字</td><td>—</td><td>0 = 不限量，由裁判自行决定</td></tr><tr><td>候选相似度下限</td><td><code>linkAgentMinScore</code></td><td>数字</td><td>—</td><td>送裁判的相似度门槛（0–1），0 = 不过滤</td></tr><tr><td>完成通知</td><td><code>linkAgentNotify</code></td><td>开关</td><td>开</td><td>处理完给一条通知</td></tr><tr><td>失效关联自动清理</td><td><code>linkAgentAutoClean</code></td><td>开关</td><td>开</td><td>自动清掉指向已不存在笔记的关联</td></tr><tr><td>已有关联不再建链</td><td><code>linkAgentRespectRelated</code></td><td>开关</td><td>开</td><td>笔记已有 <code>related</code> 就跳过</td></tr></tbody></table>\n<h3>视频处理</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>详细进度提示</td><td><code>knowledgeProgressDetail</code></td><td>开关</td><td>—</td><td>显示当前步骤与耗时</td></tr><tr><td>保留视频原件</td><td><code>knowledgeKeepVideo</code></td><td>开关</td><td>—</td><td>转成文献后是否保留视频</td></tr><tr><td>下载清晰度</td><td><code>knowledgeQuality</code></td><td>下拉</td><td>highest</td><td>最高 / 1080P / 720P</td></tr><tr><td>遇错即停</td><td><code>knowledgeStopOnFailure</code></td><td>开关</td><td>—</td><td>失败即停整批</td></tr><tr><td>输出文件夹</td><td><code>knowledgeOutputDir</code></td><td>文本</td><td>空</td><td>视频落在哪，填完整路径，<strong>可填库外</strong>；留空则不下发，由外部工具按自己默认值决定（<code>src/knowledge/processor.ts:211</code>）</td></tr><tr><td>视频压缩</td><td><code>knowledgeCompress</code></td><td>开关</td><td>—</td><td>转文字前先压缩视频</td></tr><tr><td>压缩质量 CRF</td><td><code>knowledgeCrf</code></td><td>数字</td><td>—</td><td>越小画质越高（18–28）</td></tr></tbody></table>\n<h3>维护</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>清空历史</td><td>—</td><td>按钮</td><td>—</td><td>清空转文献的归档记录（不动已生成的笔记）</td></tr><tr><td>挂载建议</td><td><code>knowledgeMountAutoSuggest</code></td><td>开关</td><td>—</td><td>打开挂载树时自动生成建议</td></tr><tr><td>清空建议缓存</td><td>—</td><td>按钮</td><td>—</td><td>清掉建议的候选与缓存</td></tr></tbody></table>\n<h2>全部命令</h2>\n<table><thead><tr><th>命令</th><th>名称</th><th>做什么</th></tr></thead><tbody><tr><td><code>bz-knowledge-open</code></td><td>知识盒</td><td>打开面板</td></tr><tr><td><code>bz-knowledge-note-term</code></td><td>名词生成文献笔记</td><td>输入名词 → 生成文献笔记</td></tr><tr><td><code>bz-knowledge-note-video</code></td><td>影像生成文献笔记</td><td>输入视频 → 下载/转写 → 生成文献笔记</td></tr><tr><td><code>bz-knowledge-note-passage</code></td><td>段落生成文献笔记</td><td>输入段落 → 生成文献笔记</td></tr><tr><td><code>bz-knowledge-note-image</code></td><td>图版生成文献笔记</td><td>输入图片 → 存档 + 生成文献笔记</td></tr><tr><td><code>bz-knowledge-relink</code></td><td>重跑当前笔记关联</td><td>对当前笔记重跑关联</td></tr><tr><td><code>bz-knowledge-link-all</code></td><td>为未关联笔记批量补链</td><td>三盒内缺 <code>related</code> 的存量批量补</td></tr><tr><td><code>bz-knowledge-mount-tree</code></td><td>看挂载树</td><td>打开挂载树视图</td></tr><tr><td><code>bz-knowledge-mount-refresh</code></td><td>重跑挂载建议</td><td>重新生成挂载建议</td></tr></tbody></table>\n<h2>边界、限制与坑</h2>\n<ul>\n<li><strong>视频链路依赖外部命令</strong>：装不上 <code>bili-dl</code>、没配 Python 路径，这条路就走不通；插件只负责下发与收结果。</li>\n<li><strong><code>pythonPath</code> 留空的陷阱</strong>：外部工具默认配置里也没有时，整批会在转写环节报「未配置 pythonPath」，而不是某一部失败。</li>\n<li><strong>输出文件夹填错，报错在外部侧</strong>：插件只透传路径，落盘失败表现为外部工具失败。</li>\n<li><strong>自动关联改完要重载插件</strong>。</li>\n<li><strong>关联范围锁死在三个盒子</strong>：想缩小只能把笔记挪出三盒，设置里没有范围选项。</li>\n<li><strong>挂载建议只在卡片盒内召回候选</strong>（<code>src/knowledge/mount-suggest.ts:7</code>）。</li>\n<li><strong>「清空历史」不动笔记</strong>：只清归档记录。</li>\n<li>外观两行目前各只有一个选项。</li>\n</ul>\n<h2>常见问题</h2>\n<p><strong>转视频一直失败怎么办？</strong></p>\n<p>先看提示：「未找到 bili-dl」＝外部命令没装；「未配置 pythonPath」＝去 AI 面板语音转写组把 Python 路径填上；两类都不是，就打开「详细进度提示」看卡在哪一步。</p>\n<p><strong>关联一直没建起来？</strong></p>\n<p>按顺序查三件事：①「自动关联」开关是否打开；② 改过设置后有没有重载插件；③ 笔记是否在三个盒子里 —— 盒外不参与。</p>\n<p><strong>挂载建议是 AI 编的吗？</strong></p>\n<p>是 AI 生成的，但每条都要求带<strong>可回定位的锚点</strong>（标题原文或原文摘录），正文里找不到会退回片段锚点（<code>src/knowledge/mount-suggest.ts:14</code>）。</p>\n<p><strong>「清空建议缓存」会删掉已挂好的关系吗？</strong></p>\n<p>不会。清的是候选与缓存，挂载关系写在笔记里。</p>\n<p><strong>换电脑后外部工具链还要重配吗？</strong></p>\n<p>要。<code>pythonPath</code>、ffmpeg 路径、<code>bili-dl</code> 都是本机环境的一部分，不随库走。</p>","no":24},{"id":"reading-report","title":"阅读报告","group":"媒体与阅读","tags":["media","books"],"domain":"reading-report","html":"<blockquote>书架墙内的阅读统计：读了多少、多久、什么时候</blockquote>\n<h2>什么时候用它</h2>\n<p>想回顾「我这段时间读了什么」时打开它。它不是独立面板 —— <strong>是书库墙里的一层视图</strong>（ADR-0091），借书库的数据做统计，自己没有独立数据文件。</p>\n<p>跟「剪藏阅读报告」（<code>bz-clipbook-report</code>）不是一回事：那个统计的是剪藏文章，这个统计的是<strong>书</strong>。</p>\n<h2>数据从哪来</h2>\n<p>两类来源，都不在本域：</p>\n<table><thead><tr><th>来源</th><th>位置</th><th>贡献什么</th></tr></thead><tbody><tr><td>书目笔记</td><td>书库文件夹的 <code>.md</code>（<code>tags</code> 含书标签）</td><td>书目、读完/在读状态、阅读日期</td></tr><tr><td>EPUB 阅读数据</td><td><code>weave-data.json</code>（Weave 插件写的）</td><td>阅读会话（开始/结束时间、时长）、进度百分比、字数</td></tr></tbody></table>\n<p>EPUB 侧的映射口径（<code>src/reading-report/stats.ts:44</code>）：</p>\n<ul>\n<li>会话时间戳转成<strong>本地时区</strong>的 <code>YYYY-MM-DD</code>（特意不走 UTC 切片 —— 否则时区边界会偏一天，<code>src/reading-report/stats.ts:59</code>）；</li>\n<li>会话时长由 <code>start</code> / <code>end</code> 推出，<code>start</code> 缺失时按 0 处理；</li>\n<li><strong>页数是估的</strong>：<code>wordCount / 500</code> 向下取整（<code>src/reading-report/stats.ts:82</code>），不是真实页码。</li>\n</ul>\n<h2>报告里有什么</h2>\n<p>打开报告后按书库数据汇总阅读量、时长与时间分布；EPUB 的会话数据参与\"什么时候读的\"这条线。</p>\n<p>界面行为（<code>src/reading-report/index.ts</code>）：</p>\n<ul>\n<li>书目数<strong>多</strong>时先渲染骨架「统计中…」（计算量大不再瞬完，l3）；</li>\n<li>书目数<strong>少</strong>时毫秒级完成，不再发进度 toast 徒增噪音（C-2）；</li>\n<li>书库还没有可统计的书时，给「书库还没有可统计的书」的空态页；</li>\n<li>统计失败给人话模板「统计失败」，技术详情只进 console，不把原始异常怼你脸上（m1b）。</li>\n</ul>\n<h2>全部命令</h2>\n<table><thead><tr><th>命令</th><th>名称</th><th>做什么</th></tr></thead><tbody><tr><td><code>bz-reading-report-open</code></td><td>阅读分析报告</td><td>打开书库墙内的报告视图（先切到书库，再进报告）</td></tr></tbody></table>\n<h2>全部设置项</h2>\n<p><strong>无。</strong> 它是纯统计视图，没有任何可配项 —— 统计口径跟随书库与 Weave 的数据，要调只能调数据本身（书的状态字段、EPUB 的阅读记录）。</p>\n<h2>边界、限制与坑</h2>\n<ul>\n<li><strong>没书就没报告</strong>：书库空、或书都没带书标签时，只有空态页。</li>\n<li><strong>EPUB 数据归 Weave</strong>：没用 Weave 读过书，报告里就只有笔记书的部分。</li>\n<li><strong>页数是估算值</strong>：按字数 ÷ 500 估的，跟纸质书页码对不上很正常。</li>\n<li><strong>日期按本地时区切片</strong>：跨零点的阅读会话归属哪一天，按你机器的时区算。</li>\n<li><strong>它统计\"书\"，不统计\"文章\"</strong>：剪藏的阅读统计在剪藏本自己的报告里（<code>bz-clipbook-report</code>）。</li>\n<li><strong>没有设置项</strong>：想改变口径（比如剔除某本书），操作对象是书库笔记而不是这里。</li>\n</ul>\n<h2>常见问题</h2>\n<p><strong>报告是空的？</strong></p>\n<p>书库里没有可统计的书：检查书库文件夹、书标签、以及书的状态字段（在读/已读日期）。</p>\n<p><strong>EPUB 的阅读时长对不上？</strong></p>\n<p>时长来自 <code>weave-data.json</code> 里的会话记录 —— 在 Weave 里读多久就记多久，插件这边只做汇总。</p>\n<p><strong>为什么和剪藏阅读报告数字差很多？</strong></p>\n<p>两个报告统计对象不同：这个统计书，那个统计剪藏文章。</p>\n<p><strong>能导出报告吗？</strong></p>\n<p>本域是视图，不落文件；要留档得截图或自行摘录。</p>\n<p><strong>统计很慢？</strong></p>\n<p>书目多时先出「统计中…」骨架，等计算完成；书目少则瞬完。</p>","no":25},{"id":"review","title":"复习计划","group":"媒体与阅读","tags":["media","review"],"domain":"review","html":"<blockquote>把笔记排进间隔重复，到期提醒，可选题考你</blockquote>\n<h2>什么时候用它</h2>\n<p>想让读过的东西别忘掉，但又不想自己排日程时用它。笔记排进计划后，插件按「先固定阶梯、后动态算法」的方式算下一次该什么时候看，到点提醒你，你评一个「记住的程度」，它据此改排期。</p>\n<p>适合：读书摘录、概念卡片、外语单词、要背的条目。</p>\n<p>不适合：纯流水账日记、一次性备忘（这类排进复习只会变成噪音）。</p>\n<p>命令最多的域（13 条），大部分动作在命令面板或面板按钮上都能触发。</p>\n<h2>数据放在哪</h2>\n<p>数据存储路径下三份文件（默认 <code>CONFIG/STORAGE/</code>，改路径见「通用」章）：</p>\n<table><thead><tr><th>文件</th><th>里面是什么</th></tr></thead><tbody><tr><td><code>review.json</code></td><td>复习条目与全部复习历史</td></tr><tr><td><code>review-fit.json</code></td><td>自动拟合出的记忆参数（权重 W 与目标难度 D）</td></tr><tr><td><code>quiz.json</code></td><td>做题记录：题目、答案、答题结果</td></tr></tbody></table>\n<p><code>review.json</code> 每条记录里，跟排期直接有关的字段（<code>src/review/data.ts:23</code>）：</p>\n<table><thead><tr><th>字段</th><th>含义</th></tr></thead><tbody><tr><td><code>filePath</code> / <code>name</code></td><td>对应笔记路径与显示名</td></tr><tr><td><code>stage</code></td><td>当前所处阶段序号（0 起）</td></tr><tr><td><code>phase</code></td><td><code>ladder</code>（固定阶梯）或 <code>fsrs</code>（动态算法）</td></tr><tr><td><code>stability</code> / <code>difficulty</code></td><td>FSRS 的稳定度与难度，只进入 <code>fsrs</code> 阶段后才有意义</td></tr><tr><td><code>nextReviewDate</code></td><td>下一次该复习的时间（ISO 字符串，可为空）</td></tr><tr><td><code>lastReviewed</code> / <code>lastDifficulty</code></td><td>上次复习时间与那次评的档</td></tr><tr><td><code>reviewHistory</code></td><td>逐条历史（时间、评级；进入动态算法后还带当次的稳定度/难度）</td></tr><tr><td><code>totalReviews</code></td><td>累计复习次数</td></tr><tr><td><code>pendingRedo</code></td><td>待重做标记：做题会话里首次评成「忘了」或「困难」会置位；重做通过只清标记、不写算法</td></tr><tr><td><code>pinned</code></td><td>置顶/星标：列表里排在逾期队列最前，与按 R 排序互斥</td></tr><tr><td><code>isMissing</code></td><td>运行时标记：文件在库里找不到（列表里显示删除线）</td></tr></tbody></table>\n<h2>日常怎么用</h2>\n<h3>把笔记排进复习</h3>\n<p>三条途径：</p>\n<ol>\n<li><strong>监听文件夹（自动）</strong>：设一个或几个目录，之后放进目录的新笔记自动加入。</li>\n<li><strong>手动加入</strong>：在当前笔记上执行「加入复习计划」（<code>bz-review-add</code>）。</li>\n<li><strong>去掉</strong>：不想复习了执行「移出复习计划」（<code>bz-review-remove</code>）。</li>\n</ol>\n<h3>开始一轮复习</h3>\n<ol>\n<li>执行「开始复习」（<code>bz-review-start</code>）。插件先取本轮队列：逾期 + 今日到期的笔记，按排序规则给出。</li>\n</ol>\n<ul>\n<li>到期的笔记超过「每日复习上限」时，只放行上限数量，并提示「本轮复习 N 篇，剩余 M 篇留到下次」（<code>src/review/app.ts:458</code>）。</li>\n<li>「今日到期但时刻还没到」的笔记也会提前纳入本轮，并给一条提示（<code>src/review/app.ts:454</code>）。</li>\n</ul>\n<ol>\n<li>打开「用做题测难度」时，本轮先出题考你，再按正确率给出本次难度；没开就是普通跳转复习。</li>\n<li>每条笔记看过之后评一个档：<strong>忘了 / 困难 / 一般 / 简单</strong>（面板按钮或 <code>bz-review-again</code> / <code>-hard</code> / <code>-good</code> / <code>-easy</code>）。</li>\n<li>评级立刻写入记录并算下一次排期（<code>src/review/app.ts:240</code>）。</li>\n</ol>\n<h3>看趋势</h3>\n<ul>\n<li>「复习计划分析报告」（<code>bz-review-report</code>）：队列与完成情况。</li>\n<li>「记忆分析」（<code>bz-review-analysis</code>）：记忆指标与趋势。</li>\n<li>「跳转逾期复习」（<code>bz-review-overdue</code>）：直接跳到积压的那一批。</li>\n</ul>\n<h2>全部设置项</h2>\n<p>按面板里的分组与出现顺序；「键名」是写在设置数据里的字段，排查或改配置时用得上。</p>\n<h3>外观</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>面板布局</td><td><code>reviewSkin</code></td><td>卡片选择</td><td>default</td><td><strong>预留功能，暂未生效</strong>（只有「三区队列」一个选项，<code>src/review/settings-schema.ts:29</code>）</td></tr><tr><td>面板主题</td><td><code>reviewSkinTheme</code></td><td>卡片选择</td><td>sage</td><td><strong>预留功能，暂未生效</strong>（只有「苔绿」一个选项，<code>src/review/settings-schema.ts:30</code>）</td></tr></tbody></table>\n<h3>检查提醒</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>到期提醒</td><td><code>enableAutoNotify</code></td><td>开关</td><td>开</td><td>有笔记到期待复习时自动弹提醒</td></tr><tr><td>新笔记加入提醒</td><td><code>reviewAutoAddNotice</code></td><td>开关</td><td>开</td><td>新笔记被自动加入时提示，多条合并成一条</td></tr></tbody></table>\n<h3>做题家</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>用做题测难度</td><td><code>forceQuizForReview</code></td><td>开关</td><td>关</td><td>打开后「开始复习」先出题，再按正确率定本次难度。<strong>下面四行是它的子项，只在打开时显示</strong>（<code>src/review/settings-schema.ts:51</code>）</td></tr><tr><td>允许多选题</td><td><code>enableMultipleChoice</code></td><td>开关</td><td>—</td><td>关则只出单选题（子项）</td></tr><tr><td>每篇笔记出题数量</td><td><code>questionsPerNote</code></td><td>数字</td><td>0</td><td>0 = 自动决定（子项，0–100）</td></tr><tr><td>打乱出题顺序</td><td><code>shuffleQuestions</code></td><td>开关</td><td>开</td><td>随机排列题目顺序（子项）</td></tr><tr><td>出题难度</td><td><code>difficulty</code></td><td>下拉</td><td>random</td><td>随机 / 简单 / 中等 / 困难（子项，<code>src/review/settings-schema.ts:72</code>）</td></tr></tbody></table>\n<h3>复习节奏</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>每日复习上限</td><td><code>reviewDailyLimit</code></td><td>数字</td><td>0</td><td>一轮最多放行多少篇；超出部分留到下次并给提示。0 视为不设上限（0–1000）</td></tr><tr><td>复习间隔缩放</td><td><code>reviewIntervalScale</code></td><td>数字</td><td>1</td><td><strong>只乘在动态间隔上</strong>：仅当这次决策落在 <code>fsrs</code> 阶段、且不是刚进 FSRS 的那一步时才生效；固定阶梯表不受影响。范围 0.1–5，最小间隔 0.01 天（<code>src/review/app.ts:238</code>）</td></tr><tr><td>R 目标阈值</td><td><code>reviewRThreshold</code></td><td>数字</td><td>0.9</td><td>记忆保留度 R 的提前复习门槛，取值 0–1。低于它就允许提前复习；<strong>不改排期间隔本身</strong>（<code>src/review/app.ts:250</code>、<code>src/review/queue.ts:20</code>）</td></tr></tbody></table>\n<h3>记忆算法</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>参数自动拟合</td><td><code>reviewAutoFit</code></td><td>开关</td><td>开</td><td>用你的复习记录重拟合参数。样本 <strong>少于 100 条直接跳过</strong>、100–300 条只拟合基础八参、300 条以上才全参</td></tr><tr><td>每 N 次复习重算</td><td><code>reviewFitEvery</code></td><td>数字</td><td>10</td><td>累计这么多次评级后自动重拟合</td></tr></tbody></table>\n<h3>自动化</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>监听文件夹</td><td><code>reviewWatchFolders</code></td><td>路径（多值）</td><td>空</td><td>目录里的新笔记自动加入。<strong>库根目录不能监听</strong>；添加时会先问「目录里已有的笔记要不要一起收进来」，<strong>点取消 = 这个目录完全不加入</strong>（不是只跳过存量，<code>src/review/watch.ts:230</code>）</td></tr><tr><td>排除名单</td><td><code>reviewExcludeList</code></td><td>列表</td><td>空</td><td>自动加入的排除清单</td></tr></tbody></table>\n<h3>界面</h3>\n<table><thead><tr><th>设置名</th><th>键名</th><th>类型</th><th>默认值</th><th>作用与说明</th></tr></thead><tbody><tr><td>文件树标记</td><td><code>reviewTreeBadge</code></td><td>开关</td><td>开</td><td>给复习中的笔记在文件树里染色并挂阶段徽标（颜色按当前拟合权重算）。关掉 = 不染色不挂徽标，排期与提醒不受影响（<code>src/review/app.ts:764</code>）</td></tr></tbody></table>\n<h2>全部命令</h2>\n<table><thead><tr><th>命令</th><th>名称</th><th>做什么</th><th>前置条件</th></tr></thead><tbody><tr><td><code>bz-review-open</code></td><td>复习计划</td><td>打开复习面板</td><td>—</td></tr><tr><td><code>bz-review-start</code></td><td>开始复习</td><td>取本轮队列并进入复习流程（开了做题就先出题）</td><td>队列非空</td></tr><tr><td><code>bz-review-add</code></td><td>加入复习计划</td><td>把当前笔记加入计划</td><td>当前打开着一篇笔记</td></tr><tr><td><code>bz-review-remove</code></td><td>移出复习计划</td><td>把当前笔记移出计划</td><td>该笔记在计划内</td></tr><tr><td><code>bz-review-overdue</code></td><td>跳转逾期复习</td><td>直接跳到已逾期的那一批</td><td>有逾期条目</td></tr><tr><td><code>bz-review-rate</code></td><td>选择复习难度</td><td>弹出评级对话框，手动选一个档</td><td>当前笔记在计划内</td></tr><tr><td><code>bz-review-again</code></td><td>复习评级：忘了</td><td>按「忘了」评级并重排</td><td>同上</td></tr><tr><td><code>bz-review-hard</code></td><td>复习评级：困难</td><td>按「困难」评级并重排</td><td>同上</td></tr><tr><td><code>bz-review-good</code></td><td>复习评级：一般</td><td>按「一般」评级并重排</td><td>同上</td></tr><tr><td><code>bz-review-easy</code></td><td>复习评级：简单</td><td>按「简单」评级并重排</td><td>同上</td></tr><tr><td><code>bz-review-quiz-open</code></td><td>做题练习</td><td>打开做题练习面板（不等到期，随时练）</td><td>需要配好 AI 通道</td></tr><tr><td><code>bz-review-report</code></td><td>复习计划分析报告</td><td>打开队列与完成情况报告</td><td>—</td></tr><tr><td><code>bz-review-analysis</code></td><td>记忆分析</td><td>打开记忆指标与趋势</td><td>有复习记录</td></tr></tbody></table>\n<p>命令面板里搜中文名即可；命令 id 用于配快捷键或写排查说明。</p>\n<h2>排期是怎么算的</h2>\n<p>两段式，先粗排后动态：</p>\n<p><strong>第一段 · 固定阶梯（<code>ladder</code>）</strong></p>\n<p>共 10 个阶段，间隔固定为：1 分钟 → 30 分钟 → 6 小时 → 1 天 → 3 天 → 7 天 → 15 天 → 30 天 → 60 天 → 120 天（<code>src/review/fsrs.ts:76</code>）。评级决定往上爬几级还是退回，阶段到 9 就翻到动态阶段（<code>src/review/fsrs.ts:79</code>）。</p>\n<p><strong>第二段 · 动态算法（<code>fsrs</code>）</strong></p>\n<p>进入之后不再走固定表，改由稳定度/难度算出下一次间隔（<code>src/review/fsrs.ts:115</code>）。这时「复习间隔缩放」才起作用：</p>\n<blockquote>间隔 = 算法算出的天数 × 缩放系数（最低 0.01 天）</blockquote>\n<p><strong>注意刚跨过 120 天那一步不乘系数</strong> —— 判定条件里明确排除了 <code>enteringFsrs</code> 那一次（<code>src/review/app.ts:238</code>）。</p>\n<p><strong>R 阈值插在哪</strong></p>\n<p>R 是算法估的「现在还记得多少」，低于阈值时允许提前复习。它只放开「能不能提前」这道门，不改算法给出的间隔，所以调它不会让整体节奏整体变快或变慢（<code>src/review/app.ts:250</code>）。</p>\n<p><strong>评级四档</strong></p>\n<p>忘了 / 困难 / 一般 / 简单 —— 分别对应算法里的四档评分，直接进历史并影响稳定度、难度。做题会话里第一次评成「忘了」或「困难」会打上待重做标记；重做通过只清标记，<strong>不额外写一次算法</strong>（<code>src/review/data.ts:41</code>）。</p>\n<h2>边界、限制与坑</h2>\n<ul>\n<li><strong>「复习间隔缩放」不是全局变速档</strong>：固定阶梯（1 分钟到 120 天这一串）完全不受它影响，只对已经进入动态算法之后的间隔生效。</li>\n<li><strong>「R 目标阈值」不改变排期间隔</strong>，只决定要不要提前安排一次 —— 想整体调快调慢请动缩放系数。</li>\n<li><strong>拟合要够样本</strong>：不足 100 条直接跳过，所以刚上手「参数自动拟合」看不出差别是正常的。</li>\n<li><strong>加监听目录时的取消是彻底的</strong>：取消 = 该目录不加入监听，新笔记也不会自动进来；它不会顺手把目录写进排除名单（<code>src/review/watch.ts:230</code>）。</li>\n<li><strong>库根目录不能作为监听目录</strong>。</li>\n<li><strong>删文件会问一次</strong>：计划内的笔记被删除时，防抖合并成一次确认「是否同步移除复习记录？」；改名或移动则是自动更新路径，不再确认（<code>src/review/watch.ts:4</code>）。</li>\n<li><strong>评级错了没法回退</strong>：评级即写盘并重排，错了只能再评一次（以最新一次为准）。</li>\n<li><strong>文件树标记只影响观感</strong>：关掉不影响排期、提醒与逾期判定。</li>\n<li>外观两行（面板布局 / 面板主题）是占位，改了没有任何效果。</li>\n</ul>\n<h2>常见问题</h2>\n<p><strong>加入复习后什么时候看第一篇？</strong></p>\n<p>从阶梯第一步开始（1 分钟起步），之后按 30 分钟、6 小时、1 天这样往上爬，评级越「简单」爬得越快。</p>\n<p><strong>一天积了一堆复习怎么办？</strong></p>\n<p>「每日复习上限」直接限制每轮放行数量（超出部分留到下次，会告诉你还剩多少篇）；想让整体节奏松一点，把「复习间隔缩放」调到大于 1。</p>\n<p><strong>为什么笔记没进复习计划？</strong></p>\n<p>三种可能：它不在监听目录里；它在监听目录里，但当初添加目录时你点了取消（那次取消等于整个目录没加入）；它被加进了排除名单。手动加入不受监听影响。</p>\n<p><strong>做题模式是必须的吗？</strong></p>\n<p>不是。「用做题测难度」关着就是普通的跳转复习；打开后「开始复习」先出题，按正确率定本次难度，下面四行设置才出现。</p>\n<p><strong>文件树上的颜色和徽标是什么？</strong></p>\n<p>复习中/到期的笔记会在文件树里染色并带阶段徽标，颜色按当前拟合出的参数算。不想看可以在「界面」组关掉，排期不受影响。</p>\n<p><strong>换设备后复习记录还在吗？</strong></p>\n<p>在。排期与历史都写在 <code>review.json</code> 里，跟库一起走；只有拟合出的参数在 <code>review-fit.json</code>，一起复制即可。</p>","no":26},{"id":"attach","title":"附件搬移","group":"工具","tags":["tool","attach"],"domain":"attach","html":"<blockquote>把笔记引用的附件批量挪到指定文件夹，并自动改写全库链接。</blockquote>\n<h2>什么时候用它</h2>\n<p>当你想给某篇笔记「瘦身」「归档」或「整理资源」时：例如把散落在各处的图片、PDF、音频等附件，集中搬到某个文件夹（如 <code>assets/</code>、<code>附件/</code> 或库根）。</p>\n<p>它搬的不是整篇笔记，而是<strong>当前笔记引用到的附件</strong>——即笔记正文里以 Wikilink 或 Markdown 链接指向的、库内的非 <code>.md</code> 文件（含 <code>![[...]]</code>、<code>![]()</code> 嵌入）。搬完之后，全库里引用这些附件的链接会自动改指向新位置（见下文「引用怎么改」）。</p>\n<p>适用对象：</p>\n<ul>\n<li>命令入口：当前正在编辑/打开的 Markdown 笔记。</li>\n<li>右键入口：文件树里任意 <code>.md</code> 笔记（右键菜单项只对 <code>.md</code> 出现，文件夹和其他类型不挂菜单）（src/attach/index.ts:23-40）。</li>\n<li>非 Markdown 文件或没有打开笔记时，会提示「附件搬移适用于 Markdown 笔记，请在笔记上运行」（src/attach/ui.ts:508-511）。</li>\n</ul>\n<h2>数据放在哪</h2>\n<p>本域<strong>没有用户可配置的设置项</strong>（在设置面板里登记为 <code>noSettings: true</code>，只是一个占位导航项，点进去没有实质设置内容）（src/settings-panel/ui.ts:182）。</p>\n<p>插件会静默持久化唯一一个运行期字段 <code>attachLastFolder</code>（上次选择的目标文件夹），仅用于下次打开选择器时自动高亮「上次文件夹」；它不出现在设置页，不可手动编辑（src/settings.ts:71-73, src/attach/ui.ts:228-236）。</p>\n<h2>日常怎么用</h2>\n<p>有两种入口，流程一致：</p>\n<p><strong>入口 A — 命令面板</strong></p>\n<ol>\n<li>打开（或选中）一篇 Markdown 笔记。</li>\n<li>打开命令面板（Ctrl/Cmd+P），执行命令 <strong>「搬移附件」</strong>（命令 ID：<cod
