<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>概念稿 3 · 年历图谱（热力图）</title>
<!--
  ============================================================================
  概念稿 3 ·「年历图谱」—— 用密度看十年
  ----------------------------------------------------------------------------
  范式主张：日记还有一种根本不同的用法，不是「读」，而是**看自己怎么活的**。
  这时候要的不是卡片，是**图谱**：一屏塞进全部时间，用色深表达密度，
  用空白表达断档，一眼看出哪年写得凶、哪段整月空白。

  与现有实现的根本差别：
  - 现有：一次只能看到几天（滚动浏览），碎片化，看不见整体形状
  - 本稿：**一屏十年**（每年两块 6×2 月历），点击任一格 → 底部抽屉出当日条目
    · 主区 = 年历热力（色深=条数，角标=有媒体）
    · 右栏 = 统计（总览 / 年度柱 / 标签条 / 类型构成 / 最长连续）
  - 没有卡片墙、没有瀑布；「阅读」降级为点击后的次要动作

  数据：../prototype-data.js → concept-data.js（真解析链）
  ============================================================================
-->
<link rel="stylesheet" href="../../host-theme.css">
<link rel="stylesheet" href="./base.css">
<style>
  body { display: flex; flex-direction: column; }

  .top {
    flex: none; display: flex; align-items: baseline; gap: 18px;
    padding: 18px 26px 14px; border-bottom: 1px solid var(--c-line);
  }
  .top h1 { font-family: var(--c-serif); font-size: 20px; font-weight: 600; letter-spacing: .16em; }
  .top .sub { font-size: 12px; color: var(--c-faint); letter-spacing: .04em; }
  .legend { margin-left: auto; display: flex; align-items: center; gap: 5px; font-size: 10.5px; color: var(--c-faint); }
  .legend i { width: 11px; height: 11px; border-radius: 3px; display: block; }

  .body { flex: 1; min-height: 0; display: flex; }

  /* ---------- 主区：年历 ---------- */
  .heat { flex: 1; overflow-y: auto; padding: 22px 26px 40px; min-width: 0; }
  .yr { margin-bottom: 34px; }
  .yr > .hd { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; }
  .yr > .hd .n { font-family: var(--c-serif); font-size: 34px; font-weight: 200; line-height: 1; }
  .yr > .hd .c { font-size: 11.5px; color: var(--c-faint); letter-spacing: .1em; }
  .yr > .hd .r { flex: 1; height: 1px; background: var(--c-line); }

  .months { display: grid; grid-template-columns: repeat(6, max-content); gap: 12px 20px; }
  .mo { }
  .mo > .mn { font-size: 10.5px; color: var(--c-faint); letter-spacing: .1em; margin-bottom: 5px; font-family: var(--c-mono); }
  .mo > .wd { display: grid; grid-template-columns: repeat(7, 13px); gap: 3px; margin-bottom: 3px; }
  .mo > .wd span { font-size: 8px; color: var(--c-faint); text-align: center; opacity: .6; }
  .grid7 { display: grid; grid-template-columns: repeat(7, 13px); gap: 3px; }
  .cell {
    width: 13px; height: 13px; border-radius: 3px; position: relative;
    background: color-mix(in srgb, var(--c-ink) 5%, transparent);
    transition: transform .12s, box-shadow .12s;
  }
  .cell.void { background: none; pointer-events: none; }
  .cell.has { cursor: pointer; }
  .cell.has:hover { transform: scale(1.5); box-shadow: 0 0 0 1.5px var(--c-accent); z-index: 3; }
  .cell.on { box-shadow: 0 0 0 2px var(--c-accent); }
  /* 有媒体：右下角小点 */
  .cell.m::after {
    content: ''; position: absolute; right: 1px; bottom: 1px;
    width: 3px; height: 3px; border-radius: 50%; background: rgba(255,255,255,.85);
  }

  /* ---------- 右栏：统计 ---------- */
  .rail { width: 306px; flex: none; border-left: 1px solid var(--c-line); overflow-y: auto; padding: 22px 22px 40px; }
  .blk { margin-bottom: 26px; }
  .blk h3 {
    font-size: 10.5px; letter-spacing: .2em; color: var(--c-faint); font-weight: 500;
    text-transform: uppercase; margin-bottom: 12px;
  }
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .kpi { padding: 11px 13px; border-radius: 9px; background: var(--c-surface); }
  .kpi b { display: block; font-size: 21px; font-weight: 600; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .kpi span { font-size: 10.5px; color: var(--c-faint); letter-spacing: .06em; }

  .bars { display: flex; flex-direction: column; gap: 7px; }
  .bar { display: grid; grid-template-columns: 34px 1fr 34px; align-items: center; gap: 9px; font-size: 11px; }
  .bar .k { color: var(--c-muted); font-family: var(--c-mono); }
  .bar .t { height: 7px; border-radius: 4px; background: color-mix(in srgb, var(--c-ink) 6%, transparent); overflow: hidden; }
  .bar .t i { display: block; height: 100%; border-radius: 4px; }
  .bar .v { text-align: right; color: var(--c-faint); font-family: var(--c-mono); font-size: 10.5px; }

  .yrs { display: flex; align-items: flex-end; gap: 12px; height: 92px; }
  .yrs .y { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
  .yrs .y .col { width: 100%; border-radius: 4px 4px 0 0; background: var(--c-accent); opacity: .85; }
  .yrs .y .lb { font-family: var(--c-mono); font-size: 10px; color: var(--c-faint); }
  .yrs .y .vv { font-size: 10px; color: var(--c-muted); font-variant-numeric: tabular-nums; }

  /* ---------- 底部抽屉 ---------- */
  .drawer {
    flex: none; height: 0; overflow: hidden; border-top: 1px solid var(--c-line);
    transition: height .22s ease; background: var(--c-bg);
  }
  .drawer.on { height: 244px; }
  .drawer .dh { display: flex; align-items: baseline; gap: 12px; padding: 13px 26px 9px; }
  .drawer .dh .d { font-size: 14px; font-weight: 600; }
  .drawer .dh .s { font-size: 11.5px; color: var(--c-faint); }
  .drawer .dh .x { margin-left: auto; font-size: 17px; color: var(--c-faint); }
  .drawer .dx { height: 186px; overflow-y: auto; padding: 0 26px 16px; display: flex; gap: 12px; }
  .dc {
    flex: 0 0 262px; border: 1px solid var(--c-line); border-radius: 11px; padding: 11px 13px;
    display: flex; flex-direction: column; gap: 6px; background: var(--c-surface);
  }
  .dc .h { display: flex; align-items: center; gap: 7px; font-size: 11px; color: var(--c-faint); font-family: var(--c-mono); }
  .dc .h i { width: 6px; height: 6px; border-radius: 50%; }
  .dc .t { font-size: 12.5px; line-height: 1.65; color: var(--c-ink); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; }
  .dc .thumbs { display: flex; gap: 4px; margin-top: auto; }
  .dc .thumbs div { width: 38px; height: 38px; border-radius: 6px; overflow: hidden; background: color-mix(in srgb, var(--c-ink) 8%, transparent); }
  .dc .thumbs img { width: 100%; height: 100%; object-fit: cover; }
</style>
</head>
<body class="theme-light">
<div class="c-boot" id="boot"><i></i>正在绘制十年图谱…</div>

<header class="top">
  <h1>年历图谱</h1>
  <div class="sub" id="sub"></div>
  <div class="legend">
    <span>少</span>
    <i style="background:color-mix(in srgb, var(--c-ink) 5%, transparent)"></i>
    <i style="background:color-mix(in srgb, var(--c-accent) 30%, transparent)"></i>
    <i style="background:color-mix(in srgb, var(--c-accent) 55%, transparent)"></i>
    <i style="background:color-mix(in srgb, var(--c-accent) 80%, transparent)"></i>
    <i style="background:var(--c-accent)"></i>
    <span>多　· 角标 = 有媒体</span>
  </div>
</header>

<div class="body">
  <main class="heat c-scroll" id="heat"></main>
  <aside class="rail c-scroll" id="rail"></aside>
</div>

<div class="drawer" id="drawer">
  <div class="dh"><span class="d" id="dd"></span><span class="s" id="ds"></span><button class="x" id="dx">×</button></div>
  <div class="dx c-scroll" id="dx2"></div>
</div>

<script src="../prototype-data.js"></script>
<script src="./concept-data.js"></script>
<script src="./concept-ui.js"></script>
<script>
(function () {
  var C = CUI, M = null;
  var dayMap = {};   // date → entries
  var WD = ['日', '一', '二', '三', '四', '五', '六'];

  C.ready(function (model) {
    M = model;
    M.days.forEach(function (d) { dayMap[d.date] = d.entries; });
    document.getElementById('sub').textContent =
      M.span.from + ' → ' + M.span.to + ' · ' + M.entries.length + ' 条落在 ' + M.days.length + ' 天';

    drawHeat();
    drawRail();
  });

  function heatColor(n) {
    if (!n) return 'color-mix(in srgb, var(--c-ink) 5%, transparent)';
    var a = n >= 6 ? 100 : n >= 4 ? 80 : n >= 3 ? 62 : n >= 2 ? 42 : 26;
    return 'color-mix(in srgb, var(--c-accent) ' + a + '%, transparent)';
  }

  function drawHeat() {
    var heat = document.getElementById('heat');
    heat.innerHTML = '';
    var years = [];
    M.entries.forEach(function (e) {
      var y = e.date.slice(0, 4);
      if (years.indexOf(y) < 0) years.push(y);
    });
    years.sort().reverse();

    years.forEach(function (y) {
      var yEntries = M.entries.filter(function (e) { return e.date.slice(0, 4) === y; });
      var yDays = M.days.filter(function (d) { return d.date.slice(0, 4) === y; });

      var sec = C.h('section.yr');
      sec.appendChild(C.h('div.hd', {
        html: '<span class="n">' + y + '</span><span class="c">' + yEntries.length + ' 条 · ' + yDays.length + ' 天</span><span class="r"></span>',
      }));

      var grid = C.h('div.months');
      for (var m = 1; m <= 12; m++) {
        grid.appendChild(monthBlock(y, m));
      }
      sec.appendChild(grid);
      heat.appendChild(sec);
    });
  }

  function monthBlock(y, m) {
    var key = y + '-' + String(m).padStart(2, '0');
    var mo = C.h('div.mo');
    mo.appendChild(C.h('div.mn', { text: String(m).padStart(2, '0') + ' 月' }));
    var wd = C.h('div.wd');
    WD.forEach(function (w) { wd.appendChild(C.h('span', { text: w })); });
    mo.appendChild(wd);

    var g = C.h('div.grid7');
    var first = new Date(Number(y), m - 1, 1).getDay();
    var days = new Date(Number(y), m, 0).getDate();
    for (var i = 0; i < first; i++) g.appendChild(C.h('div.cell.void'));
    for (var d = 1; d <= days; d++) {
      var ds = key + '-' + String(d).padStart(2, '0');
      var list = dayMap[ds];
      var c = C.h('div.cell' + (list ? '.has' : ''));
      if (list) {
        var hasMedia = list.some(function (e) { return C.mediaStat(e).total > 0; });
        c.style.background = heatColor(list.length);
        if (list.length >= 3) c.style.color = '#fff';
        if (hasMedia) c.classList.add('m');
        c.title = ds + ' ' + C.weekday(ds) + ' · ' + list.length + ' 条';
        c.dataset.d = ds;
        c.onclick = function (ev) { pick(ev.currentTarget); };
      }
      g.appendChild(c);
    }
    mo.appendChild(g);
    return mo;
  }

  function pick(cell) {
    Array.prototype.forEach.call(document.querySelectorAll('.cell.on'), function (x) { x.classList.remove('on'); });
    cell.classList.add('on');
    var date = cell.dataset.d, list = dayMap[date] || [];
    document.getElementById('dd').textContent = date + '　' + C.weekday(date);
    document.getElementById('ds').textContent = list.length + ' 条 · ' + C.relDay(date);
    var box = document.getElementById('dx2');
    box.innerHTML = '';
    list.forEach(function (e) {
      var c = C.h('div.dc');
      var h = C.h('div.h');
      h.innerHTML = e.time + ' · ' + C.esc(e.tags.join(' '));
      c.appendChild(h);
      var thumbs = (e.media || []).filter(function (m) { return m.kind === 'img'; }).slice(0, 2);
      c.appendChild(C.h('div.t', { text: C.excerpt(e, 120) || '（仅媒体）' }));
      if (thumbs.length) {
        var tw = C.h('div.thumbs');
        thumbs.forEach(function (md) {
          var d = C.h('div');
          d.appendChild(C.img(C.fixMedia(BZ_CONCEPT.url(md.name, e.filename)), md.name));
          tw.appendChild(d);
        });
        c.appendChild(tw);
      }
      box.appendChild(c);
    });
    document.getElementById('drawer').classList.add('on');
  }
  document.getElementById('dx').onclick = function () { document.getElementById('drawer').classList.remove('on'); };

  function drawRail() {
    var rail = document.getElementById('rail');

    // KPI
    var longest = longestStreak();
    rail.appendChild(blk('总览', C.h('div.kpis', { html:
      kpi(M.entries.length, '总条目') + kpi(M.days.length, '有记录天数') +
      kpi(M.span.years, '跨度（年）') + kpi(longest, '最长连续（天）'),
    })));

    // 年度柱
    var years = [];
    M.entries.forEach(function (e) { var y = e.date.slice(0, 4); if (years.indexOf(y) < 0) years.push(y); });
    years.sort();
    var maxY = 1;
    var yc = years.map(function (y) {
      var n = M.entries.filter(function (e) { return e.date.slice(0, 4) === y; }).length;
      maxY = Math.max(maxY, n);
      return { y: y, n: n };
    });
    var yb = C.h('div.yrs');
    yc.forEach(function (o) {
      var d = C.h('div.y');
      d.appendChild(C.h('div.vv', { text: o.n }));
      var col = C.h('div.col');
      col.style.height = Math.max(3, Math.round((o.n / maxY) * 58)) + 'px';
      d.appendChild(col);
      d.appendChild(C.h('div.lb', { text: o.y.slice(2) }));
      yb.appendChild(d);
    });
    rail.appendChild(blk('年度分布', yb));

    // 标签 Top
    var top = M.tagCounts.slice(0, 12);
    var mx = top.length ? top[0].count : 1;
    var tb = C.h('div.bars');
    top.forEach(function (t) {
      var bar = C.h('div.bar');
      bar.appendChild(C.h('span.k', { text: t.tag }));
      bar.appendChild(C.h('span.t', { html: '<i style="width:' + Math.max(3, Math.round(t.count / mx * 100)) + '%;background:' + C.tagColor(t.tag) + '"></i>' }));
      bar.appendChild(C.h('span.v', { text: t.count }));
      tb.appendChild(bar);
    });
    rail.appendChild(blk('标签 TOP 12', tb));

    // 类型构成
    var kb = C.h('div.bars');
    var kc = M.kindCounts;
    var kmax = Math.max(kc.diary, kc.movie, kc.letter, kc.book, 1);
    [['diary', kc.diary], ['movie', kc.movie], ['book', kc.book], ['letter', kc.letter]].forEach(function (p) {
      var bar = C.h('div.bar');
      bar.appendChild(C.h('span.k', { text: C.KIND[p[0]].label }));
      bar.appendChild(C.h('span.t', { html: '<i style="width:' + Math.max(3, Math.round(p[1] / kmax * 100)) + '%;background:var(--c-accent);opacity:.7"></i>' }));
      bar.appendChild(C.h('span.v', { text: p[1] }));
      kb.appendChild(bar);
    });
    rail.appendChild(blk('内容构成', kb));
  }

  function blk(title, node) {
    var b = C.h('div.blk');
    b.appendChild(C.h('h3', { text: title }));
    b.appendChild(node);
    return b;
  }
  function kpi(v, label) {
    return '<div class="kpi"><b>' + v + '</b><span>' + label + '</span></div>';
  }

  function longestStreak() {
    var set = {};
    M.days.forEach(function (d) { set[d.date] = 1; });
    var keys = Object.keys(set).sort();
    var best = 0, run = 0, prev = null;
    keys.forEach(function (k) {
      if (prev) {
        var a = new Date(prev), b = new Date(k);
        run = (b - a) / 86400000 === 1 ? run + 1 : 1;
      } else run = 1;
      best = Math.max(best, run);
      prev = k;
    });
    return best;
  }
})();
</script>
</body>
</html>
