<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>概念稿 5 · 四柜（类型原生多视图）</title>
<!--
  ============================================================================
  概念稿 5 ·「四柜」—— 每种内容用它自己该有的样子
  ----------------------------------------------------------------------------
  范式主张：这份库里其实有四种**性质完全不同**的东西——
    日记/念念碎/对谈（散文）· 影视（海报 + 短评）· 书（封面 + 书评）· 信（信笺）
  现有实现把它们拍平成同一面卡片墙，等于抹掉了它们各自的阅读方式。

  与现有实现的根本差别：
  - 现有：一种版式通吃四类（统一的瀑布卡片）
  - 本稿：**四个柜子，四套版式语言，连材质都换**
    · 日记柜 → 暖纸页流（衬线、舒适行宽、按天成页）
    · 影视柜 → 暗色海报墙（2:3 海报、类型角标、短评浮层）
    · 书柜   → 米色封面架（封面 + 书名 + 书评）
    · 信柜   → 信笺叠（暖纸、竖排感、蜡封）
  - 顶部只留一个「柜门」开关；跨类检索交给搜索（概念稿未实现）

  数据：../prototype-data.js → concept-data.js（真解析链）
  ============================================================================
-->
<link rel="stylesheet" href="../../host-theme.css">
<link rel="stylesheet" href="./base.css">
<style>
  /* 柜体材质统一走 --sh-bg 一个变量：
     body 自己、以及 .top / .cab 三层同时取用——不依赖任何一层的层叠结果，
     也不用过渡动画（换柜是「换房间」，不该有渐变残留）。 */
  body { display: flex; flex-direction: column; background: var(--sh-bg, var(--background-primary)); }
  .top, .cab { background: var(--sh-bg, var(--background-primary)); }

  /* 柜门：每种内容换一套材质（连页面底色都换） */
  body[data-shelf="diary"]  { --sh-bg: #f7f3ec; --sh-ink: #33302a; --sh-on-ink: #fffdf9; --sh-mute: #8a8377; --sh-line: #e2dbcf; --sh-card: #fffdf9; }
  body[data-shelf="movie"]  { --sh-bg: #121216; --sh-ink: #ececf1; --sh-on-ink: #14141a; --sh-mute: #8f8f9b; --sh-line: #26262e; --sh-card: #1b1b21; }
  body[data-shelf="book"]   { --sh-bg: #f4f1ea; --sh-ink: #2f2c26; --sh-on-ink: #fffcf6; --sh-mute: #857d70; --sh-line: #e0d8c9; --sh-card: #fffcf6; }
  body[data-shelf="letter"] { --sh-bg: #f3efe6; --sh-ink: #322e27; --sh-on-ink: #fffdf7; --sh-mute: #877f72; --sh-line: #e0d7c6; --sh-card: #fffdf7; }

  /* ---------- 顶栏 ---------- */
  .top {
    flex: none; display: flex; align-items: center; gap: 6px;
    padding: 14px 24px; border-bottom: 1px solid var(--sh-line);
  }
  .top .brand { font-size: 13px; letter-spacing: .2em; color: var(--sh-mute); margin-right: 14px; text-transform: uppercase; }
  .door {
    display: flex; align-items: center; gap: 9px;
    padding: 7px 16px; border-radius: 99px; color: var(--sh-mute);
    font-size: 13px; letter-spacing: .06em; transition: background .15s, color .15s;
  }
  .door:hover { background: color-mix(in srgb, var(--sh-ink) 7%, transparent); color: var(--sh-ink); }
  .door.on { background: var(--sh-ink); color: var(--sh-on-ink, #fff); }
  .door b { font-weight: 600; font-variant-numeric: tabular-nums; }
  .door .ic { font-size: 14px; opacity: .8; }
  .top .info { margin-left: auto; font-size: 11.5px; color: var(--sh-mute); letter-spacing: .06em; }

  /* ---------- 柜体 ---------- */
  .cab { flex: 1; min-height: 0; overflow-y: auto; padding: 26px 30px 60px; }
  .grid { display: grid; gap: 22px; }

  /* ===== 日记柜：暖纸页流 ===== */
  body[data-shelf="diary"] .grid { grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 20px; }
  .page {
    background: var(--sh-card); border: 1px solid var(--sh-line); border-radius: 4px;
    padding: 20px 22px 18px; box-shadow: 0 1px 2px rgba(90,75,50,.05), 0 8px 22px -14px rgba(90,75,50,.35);
    position: relative; break-inside: avoid;
  }
  .page::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: color-mix(in srgb, var(--c-accent) 42%, transparent); border-radius: 4px 0 0 4px;
  }
  .page .d {
    font-family: var(--c-serif); font-size: 19px; font-weight: 600; color: var(--sh-ink);
    display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px;
  }
  .page .d small { font-family: system-ui, sans-serif; font-size: 11px; color: var(--sh-mute); font-weight: 400; letter-spacing: .06em; }
  .page .d .n { margin-left: auto; font-family: var(--c-mono); font-size: 10.5px; color: var(--sh-mute); }
  .page .e { display: flex; gap: 10px; margin-bottom: 11px; }
  .page .e:last-child { margin-bottom: 0; }
  .page .e .tm { font-family: var(--c-mono); font-size: 10.5px; color: var(--sh-mute); flex: none; padding-top: 2px; }
  .page .e .bd { min-width: 0; }
  .page .e .tg { font-size: 10.5px; color: var(--sh-mute); letter-spacing: .05em; margin-bottom: 3px; }
  .page .e .tg i { display: inline-block; width: 5px; height: 5px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
  .page .e .tx {
    font-family: var(--c-serif); font-size: 14px; line-height: 1.86; color: var(--sh-ink);
    display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden;
  }
  .page .thumbs { display: flex; gap: 4px; margin-top: 8px; }
  .page .thumbs div { width: 42px; height: 42px; border-radius: 4px; overflow: hidden; background: #eae3d7; }
  .page .thumbs img { width: 100%; height: 100%; object-fit: cover; }

  /* ===== 影视柜：暗色海报墙 ===== */
  body[data-shelf="movie"] .grid { grid-template-columns: repeat(auto-fill, minmax(144px, 1fr)); gap: 16px; }
  .poster { position: relative; cursor: pointer; }
  .poster .pbox {
    aspect-ratio: 2 / 3; border-radius: 9px; overflow: hidden; position: relative;
    background: #23232b; box-shadow: 0 6px 20px -8px rgba(0,0,0,.9);
    transition: transform .18s, box-shadow .18s;
  }
  .poster:hover .pbox { transform: translateY(-4px); box-shadow: 0 14px 34px -10px rgba(0,0,0,.95); }
  .poster .pbox img { width: 100%; height: 100%; object-fit: cover; }
  .poster .tag {
    position: absolute; left: 7px; top: 7px; font-size: 10px; letter-spacing: .06em;
    background: rgba(0,0,0,.62); color: #fff; padding: 2px 7px; border-radius: 4px; backdrop-filter: blur(4px);
  }
  .poster .rev {
    position: absolute; inset: auto 0 0 0; padding: 22px 10px 10px; font-size: 11.5px; line-height: 1.6;
    color: #eee; background: linear-gradient(transparent, rgba(0,0,0,.86)); border-radius: 0 0 9px 9px;
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
    opacity: 0; transition: opacity .18s;
  }
  .poster:hover .rev { opacity: 1; }
  .poster .cap { margin-top: 9px; font-size: 12px; color: var(--sh-ink); line-height: 1.45; letter-spacing: .02em; }
  .poster .cap small { display: block; color: var(--sh-mute); font-size: 10.5px; font-family: var(--c-mono); margin-top: 3px; }

  /* ===== 书柜：米色封面架 ===== */
  body[data-shelf="book"] .grid { grid-template-columns: repeat(auto-fill, minmax(156px, 1fr)); gap: 24px; }
  .bk { }
  .bk .cov {
    aspect-ratio: 2 / 3; border-radius: 3px 7px 7px 3px; overflow: hidden; background: #e8e1d3;
    box-shadow: -2px 0 0 rgba(0,0,0,.07) inset, 0 3px 10px -3px rgba(80,66,44,.5), 0 14px 30px -16px rgba(80,66,44,.6);
    position: relative;
  }
  .bk .cov::after { content: ''; position: absolute; left: 7px; top: 0; bottom: 0; width: 1px; background: rgba(0,0,0,.12); }
  .bk .cov img { width: 100%; height: 100%; object-fit: cover; }
  .bk .nm { margin-top: 10px; font-family: var(--c-serif); font-size: 14.5px; font-weight: 600; color: var(--sh-ink); }
  .bk .rv {
    margin-top: 5px; font-size: 11.5px; line-height: 1.65; color: var(--sh-mute);
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }

  /* ===== 信柜：信笺叠 ===== */
  body[data-shelf="letter"] .grid { grid-template-columns: repeat(auto-fill, minmax(430px, 1fr)); gap: 26px; }
  .letter {
    background: var(--sh-card); border: 1px solid var(--sh-line); border-radius: 3px;
    padding: 26px 30px; position: relative; font-family: var(--c-serif);
    box-shadow: 0 1px 2px rgba(90,75,50,.05), 0 10px 26px -16px rgba(90,75,50,.45);
  }
  .letter::after {
    content: ''; position: absolute; right: 0; bottom: 0;
    border-width: 0 0 20px 20px; border-style: solid;
    border-color: transparent transparent color-mix(in srgb, var(--c-accent) 30%, #fff) transparent;
    border-radius: 0 0 3px 0;
  }
  .letter .from { font-size: 11px; letter-spacing: .18em; color: var(--sh-mute); margin-bottom: 12px; }
  .letter .tit { font-size: 17px; font-weight: 600; color: var(--sh-ink); margin-bottom: 12px; }
  .letter .bd {
    font-size: 14px; line-height: 1.95; color: var(--sh-ink); white-space: pre-wrap;
    display: -webkit-box; -webkit-line-clamp: 9; -webkit-box-orient: vertical; overflow: hidden;
  }
  .letter .seal {
    position: absolute; right: 26px; bottom: 22px; width: 34px; height: 34px; border-radius: 50%;
    background: color-mix(in srgb, var(--c-accent) 78%, #b1462f); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 13px; font-family: var(--c-serif);
    box-shadow: 0 2px 6px -2px rgba(150,50,30,.7);
  }

  .empty { padding: 60px; text-align: center; color: var(--sh-mute); font-size: 13px; letter-spacing: .08em; }

  /* 灯箱 */
  .lb { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.93); display: none; align-items: center; justify-content: center; }
  .lb.on { display: flex; }
  .lb img, .lb video { max-width: 92vw; max-height: 86vh; object-fit: contain; border-radius: 6px; }
  .lb .x { position: absolute; top: 22px; right: 26px; color: #fff; font-size: 22px; width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,.12); }
</style>
</head>
<body class="theme-light" data-shelf="diary">
<div class="c-boot" id="boot"><i></i>正在开门…</div>

<header class="top" id="top">
  <span class="brand">四柜</span>
  <button class="door" data-s="diary"><span class="ic">✎</span>日记 <b id="c-diary"></b></button>
  <button class="door" data-s="movie"><span class="ic">▤</span>影视 <b id="c-movie"></b></button>
  <button class="door" data-s="book"><span class="ic">❏</span>书 <b id="c-book"></b></button>
  <button class="door" data-s="letter"><span class="ic">✉</span>信 <b id="c-letter"></b></button>
  <span class="info" id="info"></span>
</header>

<main class="cab c-scroll" id="cab"></main>
<div class="lb" id="lb"><button class="x" id="lbx">×</button><div id="lbbody"></div></div>

<script src="../prototype-data.js"></script>
<script src="./concept-data.js"></script>
<script src="./concept-ui.js"></script>
<script>
(function () {
  var C = CUI, M = null, SHELF = 'diary';

  C.ready(function (model) {
    M = model;
    var kc = M.kindCounts;
    document.getElementById('c-diary').textContent = kc.diary;
    document.getElementById('c-movie').textContent = kc.movie;
    document.getElementById('c-book').textContent = kc.book;
    document.getElementById('c-letter').textContent = kc.letter;

    // 直达某柜：?s=movie|book|letter|diary（评审/截图用）
    var m = /[?&]s=(\w+)/.exec(location.search);
    if (m && ['diary', 'movie', 'book', 'letter'].indexOf(m[1]) >= 0) SHELF = m[1];

    document.getElementById('top').addEventListener('click', function (e) {
      var b = e.target.closest('.door'); if (!b) return;
      SHELF = b.dataset.s;
      open();
    });
    open();
  });

  function open() {
    document.body.dataset.shelf = SHELF;
    Array.prototype.forEach.call(document.querySelectorAll('.door'), function (b) {
      b.classList.toggle('on', b.dataset.s === SHELF);
    });
    var cab = document.getElementById('cab');
    cab.innerHTML = '';
    if (SHELF === 'diary') shelfDiary(cab);
    else if (SHELF === 'movie') shelfMovie(cab);
    else if (SHELF === 'book') shelfBook(cab);
    else shelfLetter(cab);
    cab.scrollTop = 0;
  }

  function of(kind) { return M.entries.filter(function (e) { return e.kind === kind; }); }

  /* ---------- 日记柜：按天成页 ---------- */
  function shelfDiary(cab) {
    var days = M.days.filter(function (d) { return d.entries.some(function (e) { return e.kind === 'diary'; }); });
    document.getElementById('info').textContent = days.length + ' 天 · 每页一天，衬线正文';
    var g = C.h('div.grid');
    days.forEach(function (d) {
      var es = d.entries.filter(function (e) { return e.kind === 'diary'; });
      var p = C.h('div.page');
      p.appendChild(C.h('div.d', { html:
        C.mdLabel(d.date) + '<small>' + C.weekday(d.date) + '　' + C.relDay(d.date) + '</small>' +
        '<span class="n">' + es.length + ' 条</span>' }));
      es.forEach(function (e) {
        var row = C.h('div.e');
        row.appendChild(C.h('div.tm', { text: e.time }));
        var bd = C.h('div.bd');
        bd.appendChild(C.h('div.tg', { html:
          e.tags.map(function (t) { return '<i style="background:' + C.tagColor(t) + '"></i>' + C.esc(t); }).join('　') }));
        bd.appendChild(C.h('div.tx', { text: (e.text || '').slice(0, 260) }));
        var imgs = (e.media || []).filter(function (m) { return m.kind === 'img'; }).slice(0, 3);
        if (imgs.length) {
          var tw = C.h('div.thumbs');
          imgs.forEach(function (md) {
            var x = C.h('div');
            x.appendChild(C.img(C.fixMedia(BZ_CONCEPT.url(md.name, e.filename)), md.name));
            x.onclick = function () { lb('img', C.fixMedia(BZ_CONCEPT.url(md.name, e.filename))); };
            tw.appendChild(x);
          });
          bd.appendChild(tw);
        }
        row.appendChild(bd);
        p.appendChild(row);
      });
      g.appendChild(p);
    });
    cab.appendChild(g);
  }

  /* ---------- 影视柜：海报墙 ---------- */
  function shelfMovie(cab) {
    var list = of('movie').sort(function (a, b) { return b.date.localeCompare(a.date); });
    document.getElementById('info').textContent = list.length + ' 部 · 海报 + 短评';
    var g = C.h('div.grid');
    list.forEach(function (e) {
      var poster = C.firstImage(e);
      var box = C.h('div.poster');
      var pb = C.h('div.pbox');
      if (poster) pb.appendChild(C.img(C.fixMedia(BZ_CONCEPT.url(poster.name, e.filename)), poster.name));
      pb.appendChild(C.h('div.tag', { text: e.tags[0] || '影视' }));
      pb.appendChild(C.h('div.rev', { text: C.excerpt(e, 150) }));
      pb.onclick = function () { if (poster) lb('img', C.fixMedia(BZ_CONCEPT.url(poster.name, e.filename))); };
      box.appendChild(pb);
      box.appendChild(C.h('div.cap', { html: C.esc(movieTitle(e)) + '<small>' + e.date + '</small>' }));
      g.appendChild(box);
    });
    cab.appendChild(g);
  }

  /* ---------- 书柜：封面架 ---------- */
  function shelfBook(cab) {
    var list = of('book').sort(function (a, b) { return b.date.localeCompare(a.date); });
    document.getElementById('info').textContent = list.length + ' 本 · 封面 + 书评';
    var g = C.h('div.grid');
    list.forEach(function (e) {
      var cov = C.firstImage(e);
      var box = C.h('div.bk');
      var c = C.h('div.cov');
      if (cov) { c.appendChild(C.img(C.fixMedia(BZ_CONCEPT.url(cov.name, e.filename)), cov.name)); c.onclick = function () { lb('img', C.fixMedia(BZ_CONCEPT.url(cov.name, e.filename))); }; }
      box.appendChild(c);
      box.appendChild(C.h('div.nm', { text: bookTitle(e) }));
      var review = (e.text || '').replace(/\*\*《[^》]*》\*\*/, '').trim();
      box.appendChild(C.h('div.rv', { text: review.slice(0, 200) }));
      g.appendChild(box);
    });
    cab.appendChild(g);
  }

  /* ---------- 信柜：信笺叠 ---------- */
  function shelfLetter(cab) {
    var list = of('letter').sort(function (a, b) { return b.date.localeCompare(a.date); });
    document.getElementById('info').textContent = list.length + ' 封 · 信笺';
    var g = C.h('div.grid');
    list.forEach(function (e) {
      var l = C.h('div.letter');
      l.appendChild(C.h('div.from', { text: e.date + '　' + C.weekday(e.date) + '　' + e.time }));
      l.appendChild(C.h('div.tit', { text: bookTitle(e) }));
      var body = (e.text || '').replace(/^\*\*[^*]+\*\*\s*/, '').trim();
      l.appendChild(C.h('div.bd', { text: body || '（空信）' }));
      l.appendChild(C.h('div.seal', { text: '封' }));
      g.appendChild(l);
    });
    cab.appendChild(g);
  }

  function movieTitle(e) {
    var m = /#\s*(.+?)\s*$/m.exec(e.content || '');
    return m ? m[1].replace(/^《|》$/g, '') : (e.date + ' ' + (e.tags[0] || ''));
  }
  function bookTitle(e) {
    var m = /\*\*《(.+?)》\*\*/.exec(e.content || '');
    if (m) return m[1];
    var m2 = /^\*\*(.+?)\*\*/m.exec(e.content || '');
    return m2 ? m2[1] : '（无题）';
  }

  function lb(kind, src) {
    var body = document.getElementById('lbbody'); body.innerHTML = '';
    var i = document.createElement('img'); i.src = src; body.appendChild(i);
    document.getElementById('lb').classList.add('on');
  }
  document.getElementById('lbx').onclick = function () { document.getElementById('lb').classList.remove('on'); document.getElementById('lbbody').innerHTML = ''; };
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') document.getElementById('lbx').onclick(); });
})();
</script>
</body>
</html>
