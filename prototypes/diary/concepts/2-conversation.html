<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>概念稿 2 · 对谈室（消息流）</title>
<!--
  ============================================================================
  概念稿 2 ·「对谈室」—— 把日记当消息流
  ----------------------------------------------------------------------------
  范式主张：这份日记里最大的一类不是「日记」，是**对谈**（208 条 / 占 43%）。
  既然如此，就不该给它套一个「相册瀑布」的外壳——它本质是**一段段对话记录**。

  与现有实现的根本差别：
  - 现有：日期分组 + 卡片墙（线性浏览，像翻相册）
  - 本稿：**左会话列表 + 右气泡线程 + 底部输入条**（像聊天软件）
    · 对谈 → 左侧气泡（对方侧），独白/念念碎/日记 → 右侧气泡（自己侧）
    · 跨天自动插入日期分隔，媒体作为「附件」贴进气泡
    · 底部输入条即写入口（真写链路的占位位）

  数据：../prototype-data.js → concept-data.js（真解析链）
  ============================================================================
-->
<link rel="stylesheet" href="../../host-theme.css">
<link rel="stylesheet" href="./base.css">
<style>
  body { display: flex; flex-direction: column; }

  /* ---------- 顶栏 ---------- */
  .top {
    flex: none; display: flex; align-items: center; gap: 16px;
    padding: 14px 22px; border-bottom: 1px solid var(--c-line);
  }
  .top h1 { font-size: 16px; font-weight: 600; letter-spacing: .14em; }
  .top .stats { font-size: 12px; color: var(--c-faint); letter-spacing: .04em; }
  .top .stats b { color: var(--c-ink); }
  .top .stats .d { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin: 0 6px 1px 14px; vertical-align: middle; }
  .top .right { margin-left: auto; display: flex; gap: 6px; }
  .top .right button {
    font-size: 11.5px; padding: 5px 12px; border-radius: 99px;
    border: 1px solid var(--c-line); color: var(--c-muted); letter-spacing: .04em;
  }
  .top .right button:hover { background: var(--c-hover); color: var(--c-ink); }
  .top .right button.on { background: var(--c-accent); border-color: transparent; color: var(--c-on-accent); }

  /* ---------- 双栏 ---------- */
  .panes { flex: 1; min-height: 0; display: flex; }

  /* 左：会话列表 */
  .list { width: 288px; flex: none; border-right: 1px solid var(--c-line); overflow-y: auto; }
  .lm {
    position: sticky; top: 0; z-index: 2; padding: 14px 18px 7px;
    font-family: var(--c-mono); font-size: 10.5px; letter-spacing: .2em; color: var(--c-faint);
    background: var(--c-bg);
  }
  .sess {
    display: block; width: 100%; text-align: left; padding: 11px 18px;
    border-left: 2px solid transparent; transition: background .13s, border-color .13s;
  }
  .sess:hover { background: var(--c-hover); }
  .sess.on { background: color-mix(in srgb, var(--c-accent) 9%, transparent); border-left-color: var(--c-accent); }
  .sess .r1 { display: flex; align-items: baseline; gap: 8px; margin-bottom: 3px; }
  .sess .r1 .dt { font-size: 13px; font-weight: 600; letter-spacing: .02em; }
  .sess .r1 .wk { font-size: 11px; color: var(--c-faint); }
  .sess .r1 .n { margin-left: auto; font-family: var(--c-mono); font-size: 10.5px; color: var(--c-faint); }
  .sess .r2 {
    font-size: 12px; color: var(--c-muted); line-height: 1.45;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .sess .r3 { display: flex; gap: 4px; margin-top: 5px; }
  .sess .r3 i { width: 5px; height: 5px; border-radius: 50%; }

  /* 右：线程 */
  .thread { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .thead {
    flex: none; padding: 16px 26px 12px; border-bottom: 1px solid var(--c-line);
    display: flex; align-items: baseline; gap: 12px;
  }
  .thead .d { font-size: 15px; font-weight: 600; }
  .thead .s { font-size: 12px; color: var(--c-faint); }
  .thead .who { margin-left: auto; font-size: 11.5px; color: var(--c-faint); letter-spacing: .06em; }

  .msgs { flex: 1; overflow-y: auto; padding: 20px 26px 24px; }

  /* 气泡 */
  .msg { display: flex; gap: 10px; margin-bottom: 16px; max-width: 100%; }
  .msg.me { flex-direction: row-reverse; }
  .msg .av {
    flex: none; width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 14px;
    background: var(--c-surface); border: 1px solid var(--c-line);
  }
  .msg.other .av { background: color-mix(in srgb, var(--c-accent) 14%, transparent); border-color: transparent; }
  .msg .col { min-width: 0; max-width: 64%; display: flex; flex-direction: column; }
  .msg.me .col { align-items: flex-end; }
  .msg .meta {
    font-size: 10.5px; color: var(--c-faint); letter-spacing: .05em;
    margin-bottom: 5px; font-family: var(--c-mono);
  }
  .msg .meta .tag { color: var(--c-muted); }

  .bub {
    padding: 11px 15px; font-size: 14px; line-height: 1.78; white-space: pre-wrap;
    word-break: break-word; border-radius: 4px 15px 15px 15px;
    /* 浅色主题下 --background-secondary 与页面几乎同色，气泡会「隐形」——
       故显式用 ink 混合拉开层次，而不是直接吃 surface token */
    background: color-mix(in srgb, var(--c-ink) 6%, var(--c-bg));
    border: 1px solid color-mix(in srgb, var(--c-ink) 9%, transparent);
  }
  .msg.me .bub {
    border-radius: 15px 4px 15px 15px;
    background: color-mix(in srgb, var(--c-accent) 13%, var(--c-bg));
    border-color: color-mix(in srgb, var(--c-accent) 26%, transparent);
  }
  .bub strong { font-weight: 600; }
  .bub .q { color: var(--c-muted); border-left: 2px solid var(--c-line); padding-left: 10px; display: block; }

  /* 附件（媒体） */
  .atts { display: grid; gap: 5px; margin-top: 8px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .atts.one { grid-template-columns: minmax(0, 1fr); }
  .att {
    position: relative; border-radius: 10px; overflow: hidden; cursor: zoom-in; background: var(--c-surface);
    aspect-ratio: 1 / 1;
  }
  .atts.one .att { aspect-ratio: 4 / 3; max-height: 300px; }
  .att img, .att video { width: 100%; height: 100%; object-fit: cover; }
  .att .pl {
    position: absolute; inset: 0; margin: auto; width: 38px; height: 38px; border-radius: 50%;
    background: rgba(0,0,0,.5); color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 14px; pointer-events: none;
  }
  .att .dur {
    position: absolute; right: 5px; bottom: 5px; font-family: var(--c-mono); font-size: 10px;
    background: rgba(0,0,0,.62); color: #fff; padding: 0 5px; border-radius: 3px;
  }
  .aud {
    display: flex; align-items: center; gap: 9px; margin-top: 8px; padding: 9px 13px;
    border-radius: 99px; background: var(--c-surface); border: 1px solid var(--c-line);
    font-size: 12px; color: var(--c-muted); cursor: pointer; width: fit-content; max-width: 100%;
  }
  .aud .eq { display: flex; gap: 2px; align-items: flex-end; height: 13px; }
  .aud .eq i { width: 2.5px; background: var(--c-accent); border-radius: 2px; animation: eq .9s ease-in-out infinite; }
  .aud .eq i:nth-child(1) { height: 40%; animation-delay: 0s; }
  .aud .eq i:nth-child(2) { height: 90%; animation-delay: .15s; }
  .aud .eq i:nth-child(3) { height: 60%; animation-delay: .3s; }
  .aud .eq i:nth-child(4) { height: 100%; animation-delay: .45s; }
  @keyframes eq { 0%,100% { transform: scaleY(.45); } 50% { transform: scaleY(1); } }

  /* 日期分隔 */
  .daysep { text-align: center; margin: 26px 0 20px; }
  .daysep span {
    display: inline-block; font-size: 11px; letter-spacing: .12em; color: var(--c-faint);
    padding: 3px 13px; border-radius: 99px; background: var(--c-surface);
  }

  /* 底部输入条 */
  .composer {
    flex: none; display: flex; gap: 10px; align-items: center;
    padding: 13px 26px 16px; border-top: 1px solid var(--c-line);
  }
  .composer .box {
    flex: 1; display: flex; align-items: center; gap: 10px;
    border: 1px solid var(--c-line); border-radius: 99px; padding: 9px 16px;
    color: var(--c-faint); font-size: 13px; background: var(--c-surface);
  }
  .composer .box .em { font-size: 13px; letter-spacing: .1em; }
  .composer button.send {
    width: 38px; height: 38px; border-radius: 50%; background: var(--c-accent); color: var(--c-on-accent);
    display: flex; align-items: center; justify-content: center; font-size: 15px; flex: none;
    transition: opacity .15s;
  }
  .composer button.send:hover { opacity: .86; }
  .toast {
    position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%) translateY(10px);
    background: var(--c-ink); color: var(--c-bg); font-size: 12px; padding: 8px 16px; border-radius: 99px;
    opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 60;
  }
  .toast.on { opacity: .93; transform: translateX(-50%) translateY(0); }

  /* 灯箱 */
  .lb { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.93); display: none; align-items: center; justify-content: center; }
  .lb.on { display: flex; }
  .lb img, .lb video { max-width: 92vw; max-height: 86vh; object-fit: contain; border-radius: 6px; }
  .lb .x { position: absolute; top: 22px; right: 26px; color: #fff; font-size: 22px; width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,.12); }
</style>
</head>
<body class="theme-light">
<div class="c-boot" id="boot"><i></i>正在接通对谈…</div>

<header class="top">
  <h1>对谈室</h1>
  <div class="stats" id="stats"></div>
  <div class="right">
    <button id="onlyTalk" class="on">只看对谈</button>
    <button id="jumpNew">最新</button>
  </div>
</header>

<div class="panes">
  <nav class="list c-scroll" id="list"></nav>
  <section class="thread">
    <div class="thead" id="thead"></div>
    <div class="msgs c-scroll" id="msgs"></div>
    <div class="composer">
      <div class="box"><span class="em">✎ ⌘ ⌨</span><span>说点什么…（概念稿：此处接真写日记链路）</span></div>
      <button class="send" id="send">↑</button>
    </div>
  </section>
</div>

<div class="toast" id="toast"></div>
<div class="lb" id="lb"><button class="x" id="lbx">×</button><div id="lbbody"></div></div>

<script src="../prototype-data.js"></script>
<script src="./concept-data.js"></script>
<script src="./concept-ui.js"></script>
<script>
(function () {
  var C = CUI, M = null, DAYS = [], CUR = null, ONLY_TALK = true;

  C.ready(function (model) {
    M = model;
    var tc = 0, oc = 0;
    M.entries.forEach(function (e) {
      if (e.tags.indexOf('对谈') >= 0) tc++;
      else oc++;
    });
    document.getElementById('stats').innerHTML =
      '<b>' + tc + '</b> 条对谈<span class="d" style="background:hsl(200 55% 55%)"></span>' +
      '<b>' + oc + '</b> 条独白<span class="d" style="background:var(--c-accent)"></span>';
    buildList();
    select(DAYS[0] && DAYS[0].date);
  });

  function isTalk(e) { return e.tags.indexOf('对谈') >= 0; }

  function buildList() {
    DAYS = M.days.filter(function (d) {
      return !ONLY_TALK || d.entries.some(isTalk);
    });
    var list = document.getElementById('list');
    list.innerHTML = '';
    var byM = C.byMonth(DAYS.map(function (d) { return { date: d.date, entries: d.entries }; }));
    byM.forEach(function (g) {
      var y = Number(g.key.slice(0, 4)), m = Number(g.key.slice(5));
      list.appendChild(C.h('div.lm', { text: y + ' 年 ' + m + ' 月' }));
      g.entries.forEach(function (d) {
        var talk = d.entries.filter(isTalk).length;
        var b = C.h('button.sess', { 'data-d': d.date });
        b.innerHTML =
          '<div class="r1"><span class="dt">' + C.mdLabel(d.date) + '</span>' +
          '<span class="wk">' + C.weekday(d.date) + '</span>' +
          '<span class="n">' + d.entries.length + '</span></div>' +
          '<div class="r2">' + C.esc(C.excerpt(d.entries[0], 46)) + '</div>';
        var r3 = C.h('div.r3');
        if (talk) r3.appendChild(C.h('i', { style: 'background:hsl(200 55% 55%)' }));
        if (d.entries.length - talk) r3.appendChild(C.h('i', { style: 'background:var(--c-accent)' }));
        if (d.entries.some(function (e) { return C.mediaStat(e).total; })) r3.appendChild(C.h('i', { style: 'background:var(--c-faint)' }));
        b.appendChild(r3);
        b.onclick = function () { select(d.date); };
        list.appendChild(b);
      });
    });
  }

  function select(date) {
    if (!date) return;
    CUR = date;
    Array.prototype.forEach.call(document.querySelectorAll('.sess'), function (b) {
      b.classList.toggle('on', b.dataset.d === date);
      if (b.dataset.d === date) b.scrollIntoView({ block: 'nearest' });
    });
    var day = DAYS.filter(function (x) { return x.date === date; })[0] || M.days[0];
    renderThread(day);
  }

  function renderThread(day) {
    var es = ONLY_TALK ? day.entries.filter(isTalk) : day.entries;
    var th = document.getElementById('thead');
    th.innerHTML =
      '<span class="d">' + day.date + '　' + C.weekday(day.date) + '</span>' +
      '<span class="s">' + es.length + ' 条</span>' +
      '<span class="who">对谈 · 与自己</span>';

    var box = document.getElementById('msgs');
    box.innerHTML = '';
    box.appendChild(daySep(day.date));
    es.forEach(function (e) { box.appendChild(bubble(e)); });
    box.scrollTop = 0;
  }

  function daySep(date) {
    var d = C.h('div.daysep');
    d.appendChild(C.h('span', { text: date + ' ' + C.weekday(date) + ' · ' + C.relDay(date) }));
    return d;
  }

  function bubble(e) {
    var talk = isTalk(e);
    var msg = C.h('div.msg ' + (talk ? 'other' : 'me'));
    msg.appendChild(C.h('div.av', { text: e.emoji || (talk ? '💬' : '✎') }));

    var col = C.h('div.col');
    var otherTags = e.tags.filter(function (t) { return t !== (talk ? '对谈' : ''); });
    col.appendChild(C.h('div.meta', {
      html: e.time + (otherTags.length ? ' · <span class="tag">' + C.esc(otherTags.join(' ')) + '</span>' : ''),
    }));

    if (e.text) {
      var b = C.h('div.bub');
      b.innerHTML = e.text.split(/\n{2,}/).map(function (p) {
        var s = C.esc(p).replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        return /^\s*>/.test(p) ? '<span class="q">' + s.replace(/^&gt;\s?/gm, '') + '</span>'
                              : s.replace(/\n/g, '<br>');
      }).join('<br><br>');
      col.appendChild(b);
    }

    var imgs = (e.media || []).filter(function (m) { return m.kind === 'img'; });
    var vids = (e.media || []).filter(function (m) { return m.kind === 'video'; });
    var auds = (e.media || []).filter(function (m) { return m.kind === 'audio'; });
    var pics = imgs.concat(vids);
    if (pics.length) {
      var atts = C.h('div.atts' + (pics.length === 1 ? '.one' : ''));
      pics.slice(0, 4).forEach(function (md) {
        var src = C.fixMedia(BZ_CONCEPT.url(md.name, e.filename));
        var a = C.h('div.att');
        if (md.kind === 'img') a.appendChild(C.img(src, md.name));
        else {
          var v = document.createElement('video'); v.src = src; v.muted = true; v.preload = 'metadata'; v.playsInline = true;
          a.appendChild(v); a.appendChild(C.h('div.pl', { text: '▶' }));
        }
        a.onclick = function () { lb(md.kind === 'img' ? 'img' : 'video', src); };
        atts.appendChild(a);
      });
      col.appendChild(atts);
    }
    auds.forEach(function (md) {
      var src = C.fixMedia(BZ_CONCEPT.url(md.name, e.filename));
      var bar = C.h('div.aud');
      var eq = C.h('div.eq'); for (var i = 0; i < 4; i++) eq.appendChild(C.h('i'));
      bar.appendChild(eq);
      bar.appendChild(document.createTextNode(md.name.split('.').pop().toUpperCase() + ' 语音'));
      bar.onclick = function () { lb('audio', src); };
      col.appendChild(bar);
    });

    msg.appendChild(col);
    return msg;
  }

  function lb(kind, src) {
    var body = document.getElementById('lbbody');
    body.innerHTML = '';
    if (kind === 'img') { var i = document.createElement('img'); i.src = src; body.appendChild(i); }
    else if (kind === 'video') { var v = document.createElement('video'); v.src = src; v.controls = true; v.autoplay = true; v.playsInline = true; body.appendChild(v); }
    else { var a = document.createElement('audio'); a.src = src; a.controls = true; a.autoplay = true; a.style.width = 'min(78vw,600px)'; body.appendChild(a); }
    document.getElementById('lb').classList.add('on');
  }
  document.getElementById('lbx').onclick = function () { document.getElementById('lb').classList.remove('on'); document.getElementById('lbbody').innerHTML = ''; };

  document.getElementById('onlyTalk').onclick = function () {
    ONLY_TALK = !ONLY_TALK;
    this.classList.toggle('on', ONLY_TALK);
    this.textContent = ONLY_TALK ? '只看对谈' : '全部条目';
    buildList();
    select(DAYS[0] && DAYS[0].date);
  };
  document.getElementById('jumpNew').onclick = function () { select(DAYS[0] && DAYS[0].date); };

  var tid = null;
  document.getElementById('send').onclick = function () {
    var t = document.getElementById('toast');
    t.textContent = '概念稿：这里就是「写日记」的入口位（真链路在 bz-diary-write）';
    t.classList.add('on');
    clearTimeout(tid); tid = setTimeout(function () { t.classList.remove('on'); }, 2400);
  };
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') document.getElementById('lbx').onclick(); });
})();
</script>
</body>
</html>
