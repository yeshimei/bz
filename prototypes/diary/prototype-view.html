<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>日记本 · 真行为实例</title>
<!--
  本页 = 日记本行为单源评审壳的 iframe 视图（issue 256/ADR-0115）。
  它不实现任何日记本交互——只把真行为层跑起来：
    - 载入同一份 CSS（core + 域，与插件同源、build-css SOURCES 同序）
    - 载入 prototype-behavior.js（真 ui.ts/store.ts/dialogs.ts/data.ts 依赖链，
      alias obsidian→fake）
    - boot + openPanel：面板 append 到本页 body（iframe 即全屏视口），
      桌面 980px 卡 / 移动 ≤768 真全屏（fake Platform.isMobile 按视口宽判定）
  宿主差异（数据/媒体/图标/视口）由 fake-obsidian / prototype-icons.js / prototype-data.js 提供。

  宿主主题保真：../host-theme.css 由 scripts/fetch-host-theme.mjs 从真实 vault 的
  .obsidian/appearance.json + Obsidian 官方默认变量表生成（强调色/字号/明暗色阶全真值），
  取代了早期壳内写死的一组浅色近似值——域样式 100% 消费宿主 token，壳内配色由此与
  Obsidian 一致。评审钩子：?theme=dark / ?theme=light 明暗直达。
-->
<link rel="stylesheet" href="../host-theme.css">
<link rel="stylesheet" href="../../src/core/styles.css">
<link rel="stylesheet" href="../../src/core/ui/tokens.css">
<link rel="stylesheet" href="../../src/core/ui/components.css">
<link rel="stylesheet" href="../../src/diary/styles.css">
<!-- 评审变体皮肤位：?skin=warm|quiet|darkroom —— 必须排在域样式之后（同序覆盖视觉层），
     空值时整条移除，常态即「现状」；markup/行为不受影响（纯视觉层，ADR-0104 单源不破）。 -->
<link rel="stylesheet" id="skinCss" href="about:blank">
<script>
  (function () {
    var m = /(?:^|[?&])skin=([a-z0-9-]+)/.exec(location.search);
    window.__BZ_SKIN__ = m ? m[1] : '';
    var el = document.getElementById('skinCss');
    if (m) el.setAttribute('href', './skins/' + m[1] + '.css');
    else el.parentNode.removeChild(el);
  })();
</script>
<script src="./prototype-icons.js"></script>
<script src="./prototype-data.js"></script>
<script src="./prototype-behavior.js"></script>
<style>
  /* iframe 内全屏面板：清掉 body 边距，让根遮罩铺满 */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  /* 遮罩背后露出的是 Obsidian 工作区底 —— 用宿主 token，不写死颜色 */
  body { background: var(--background-secondary); }
</style>
</head>
<body class="theme-light">
<script>
  (function () {
    // 主题类必须与 host-theme.css 的 body.theme-light / body.theme-dark 对齐
    // （早期壳写死 light；现由外景壳按「明/暗/跟随系统」传参，直达 URL 时缺省亮色）
    var q = location.search;
    var want = q.indexOf('theme=dark') >= 0 ? 'dark' : 'light';
    var body = document.body;
    if (want === 'dark' && !body.classList.contains('theme-dark')) {
      body.classList.remove('theme-light');
      body.classList.add('theme-dark');
    }
    // 皮肤类挂 body：皮肤的覆盖规则一律以 body.skin-<名> 兜底（特异性稳赢域样式）
    if (window.__BZ_SKIN__) body.classList.add('skin-' + window.__BZ_SKIN__);
    var B = window.BZW_diary;
    B.bootDiarySim();
    B.openPanel();
  })();
</script>
</body>
</html>
