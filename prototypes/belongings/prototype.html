<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>归物本 · 原型预览（真行为单源）</title>
<!--
  ┌────────────────────────────────────────────────────────────────────────┐
  │ 本文件 = 归物本域 UI 的评审壳（行为单源版，issue 245/ADR-0106）。          │
  │ 组件样式零内联，全部来自（与 build-css SOURCES 同序）：                    │
  │   ../core/styles.css → ../core/ui/tokens.css → ../core/ui/components.css │
  │   → ./styles.css                                                        │
  │ markup 单源（ADR-0104）：面板/网格/详情/表单 HTML 出自 ./prototype-render.js│
  │   （src/belongings/render.ts 构建）。                                    │
  │ 行为单源（issue 245/ADR-0106）：交互逻辑全部是插件同款 ui.ts 依赖链——       │
  │   经 ./prototype-behavior.js（src/belongings/fake-sim.ts 构建，           │
  │   alias obsidian→公共假层）在下方两个 iframe 视图里跑真行为；                │
  │   桌面 iframe 宽视口 = 桌面布局；移动 iframe 412×915 = styles.css           │
  │   @container 移动布局。数据 = localStorage（跨 iframe storage 桥同步，     │
  │   完整模拟插件「数据文件外部变更自动刷新」）。                              │
  │ 壳内只允许：外景容器样式、评审徽牌、演示钩子与自检。                        │
  └────────────────────────────────────────────────────────────────────────┘
-->
<link rel="stylesheet" href="../../src/core/styles.css">
<link rel="stylesheet" href="../../src/core/ui/tokens.css">
<link rel="stylesheet" href="../../src/core/ui/components.css">
<link rel="stylesheet" href="../../src/belongings/styles.css">
<link rel="stylesheet" href="../mob-1to1.css">
<script src="../mob-1to1.js"></script>
<style>
  /* ===== 以下全部是演示壳，禁止放组件样式 ===== */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; gap: 28px; padding: 32px 24px;
    background: #dcd8cd; font-family: system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif; }
  /* 模拟 Obsidian 宿主变量（core/styles.css 的右键菜单/底部抽屉取值用；插件内由主题提供） */
  body {
    --background-primary: #fbf9f3; --text-normal: #171512; --text-muted: #8b8474; --text-faint: #b3ab99;
    --text-error: #b3564d; --background-modifier-hover: rgba(23,21,18,.06); --color-green: #3d8f5d;
  }
  * { scrollbar-width: none; } *::-webkit-scrollbar { display: none; }

  /* 桌面外景（真行为 iframe：面板 append iframe body，宽度决定布局） */
  .demo-dt { flex: none; width: 920px; height: 640px; }
  /* 移动外景：412×915 iframe → 面板 body 容器 412px → @container 移动布局 */
  .demo-mob { width: 412px; height: 915px; border-radius: 26px; overflow: hidden; flex: none;
    border: 1px solid #b8b0a0; box-shadow: 0 8px 30px rgba(0,0,0,.16); background: #f5f2ec; }
  .demo-frame { width: 100%; height: 100%; border: 0; display: block; }

  /* 评审徽牌（演示壳自用） */
  .vbadge { position: fixed; right: 16px; bottom: 12px; font-size: 11px; color: #8b8474; display: flex; gap: 10px; align-items: center;
    background: rgba(255,255,255,.92); border: 1px solid #c9c2b2; padding: 3px 8px; z-index: 900; }
  .vbadge button { border: none; background: none; color: #b3564d; font: 11px 'Microsoft YaHei'; cursor: pointer; }
  .vbadge .ok { color: #3d8f5d; }
  .vbadge .bad { color: #b3564d; }
</style>
</head>
<body class="theme-light"> <!-- 模拟 Obsidian 宿主：色彩 token 挂 theme-light/dark，壳内必须补一类才不透明 -->
  <div id="dtHost" class="demo-dt"><iframe class="demo-frame" src="./prototype-view.html" title="归物本·桌面"></iframe></div>
  <div id="mobHost" class="demo-mob-wrap"><div class="demo-mob"><iframe class="demo-frame" src="./prototype-view.html?mob=1" title="归物本·移动"></iframe></div></div>

  <div class="vbadge">归物本 · 真行为单源预览（桌面=真 ui.ts 跑在 920px，移动=412×915）
    <button id="mobToggle">隐藏移动端</button>
    <button id="reset">重置演示数据</button>
    <span id="stResult"></span>
  </div>

<script src="./prototype-icons.js"></script>
<script src="./prototype-data.js"></script>
<script src="./prototype-render.js"></script>
<script>
(function () {
  /* ==================== 壳基座（仅外景）：两个真行为 iframe + storage 桥 ====================
   * 行为全部在 iframe 内跑真 ui.ts（prototype-behavior.js）；本页只做：
   *  - 数据种子（BLG.ITEMS 首启写 localStorage，见 fake-sim seedDatabase）
   *  - 重置演示数据（清 localStorage 后重载 iframe）
   *  - 演示钩子（?demo=…）与自检（?selftest=1）：经 iframe contentWindow 访问真 DOM
   */
  const LS = 'bz-sim:CONFIG/STORAGE/belongings.json';
  const seedOnce = () => {
    if (localStorage.getItem(LS)) return;
    const db = {
      version: '1.0',
      last_updated: new Date().toISOString(),
      items: Object.fromEntries((window.BLG?.ITEMS || []).map((x) => [x.id, x])),
    };
    localStorage.setItem(LS, JSON.stringify(db, null, 2));
  };
  seedOnce();

  const dtFrame = () => document.querySelector('#dtHost iframe');
  const mobFrame = () => document.querySelector('#mobHost iframe');
  const dtDoc = () => dtFrame().contentDocument;
  const mobDoc = () => mobFrame().contentDocument;
  // 轮询现取 contentDocument：iframe 加载前后 document 引用会替换（about:blank → 真实文档），
  // 不能缓存旧引用等面板——每次现查，跨文档访问本身同源安全。
  const waitFrame = (getDoc) => new Promise((res, rej) => {
    const started = Date.now();
    const tries = () => {
      try {
        const doc = getDoc();
        if (doc && doc.querySelector('.bz-bel-panel')) return res(doc);
        if (Date.now() - started > 25000) return rej(new Error('iframe 面板超时'));
        setTimeout(tries, 150);
      } catch (e) { setTimeout(tries, 150); }
    };
    tries();
  });

  document.querySelector('#mobToggle').addEventListener('click', () => {
    const m = document.querySelector('#mobHost');
    const hidden = m.style.display === 'none';
    m.style.display = hidden ? '' : 'none';
    document.querySelector('#mobToggle').textContent = hidden ? '隐藏移动端' : '显示移动端';
  });

  document.querySelector('#reset').addEventListener('click', () => {
    localStorage.removeItem(LS);
    localStorage.removeItem('bz-bel-p20-shared-v1'); // 旧壳数据键一并清（防误读旧壳残留）
    location.reload();
  });

  /* ==================== 自检（?selftest=1）：真行为 DOM 断言（经 iframe） ==================== */
  if (location.search.includes('selftest')) {
    const R = window.BZR_belongings;
    window.__st = { pass: 0, fail: [] };
    const t = (name, cond) => cond ? window.__st.pass++ : window.__st.fail.push(name);
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    (async () => {
      const res = document.querySelector('#stResult');
      try {
        // 数据基线检查：种子应是 65 件。若残留上次运行（非 65 或含「测试物品」）则重置重载一次。
        // headless 验收每次全新 profile 天然干净；浏览器手动重复跑 selftest 也能自清理。
        const pre = (() => { try { return JSON.parse(localStorage.getItem(LS) || 'null'); } catch { return null; } })();
        const dirty = !pre || Object.keys(pre.items).length !== 65 || Object.values(pre.items).some((i) => i.name === '测试物品');
        if (dirty) {
          if (!location.search.includes('reset=1')) {
            localStorage.removeItem(LS);
            seedOnce();
            location.search = '?selftest=1&reset=1';
            return;
          }
        }
        const dd = await waitFrame(dtDoc);
        const md = await waitFrame(mobDoc);
        res.textContent = '…';
        const dt = (sel) => dd.querySelector(sel);
        const mob = (sel) => md.querySelector(sel);
        const dtCells = () => dd.querySelectorAll('.bz-bel-cell').length;
        const mobCells = () => md.querySelectorAll('.bz-bel-cell').length;

        t('桌面面板开', !!dt('.bz-bel-panel'));
        t('移动面板开', !!mob('.bz-bel-panel'));
        t('桌面65行', dtCells() === 65);
        t('移动65行', mobCells() === 65);
        t('KPI在库', dt('[data-bel-kpis] .bz-bel-kpi--hero b')?.textContent === String(R.stockCount(Object.values(JSON.parse(localStorage.getItem(LS)).items))));
        t('总投入≈71706', Math.abs(R.totalAssets(Object.values(JSON.parse(localStorage.getItem(LS)).items)) - 71706.48) < 1);
        t('无页脚残留', !dt('.bz-bel-foot, [data-bel-footnote], .bz-bel-mobsort'));

        // 筛选：闲置（桌面）
        dt('[data-bel-st="idle"]').click();
        await sleep(50);
        t('闲置筛选7', dtCells() === 7);
        t('标题=闲置', dt('[data-bel-herotitle]').textContent === '闲置');
        dt('[data-bel-st="idle"]').click();
        await sleep(50);
        t('再点回全部', dtCells() === 65);

        // 搜索（桌面，防抖 180ms）
        const q = dt('[data-bel-search]');
        q.value = '松下'; q.dispatchEvent(new Event('input'));
        await sleep(300);
        t('搜索松下6', dtCells() === 6);
        q.value = ''; q.dispatchEvent(new Event('input'));
        await sleep(300);

        // 排序（桌面）
        dt('[data-k="price"]').click();
        await sleep(50);
        t('投入排序首位=松下s5', dt('.bz-bel-name').textContent === '松下s5');
        dt('[data-k="recent"]').click();

        // 移动专属：横滑条 / 排序下拉
        t('移动chips五枚无资产', md.querySelectorAll('[data-bel-mobstatus] .bz-mobstrip-chip').length === 5 && !md.querySelector('[data-bel-mobstatus] [data-bel-st="asset"]'));
        t('移动排序下拉3项', md.querySelectorAll('[data-bel-mobsortmenu] .bz-bel-dropopt').length === 3 && mob('[data-bel-mobsortsel] .bz-bel-select-label')?.textContent === '最近购入');

        // 新增（桌面表单）
        dt('[data-bel-add]').click();
        await sleep(80);
        t('表单开', !!dd.querySelector('.bz-bel-form-mask'));
        dd.querySelector('#bm-name').value = '测试物品';
        dd.querySelector('#bm-cat').value = '落地灯';
        dd.querySelector('#bm-price').value = '100';
        dd.querySelector('#bm-date').value = '2026-09-01';
        dd.querySelector('#bm-save').click();
        await sleep(180);
        const saved = JSON.parse(localStorage.getItem(LS)).items;
        const nu = Object.values(saved).find((i) => i.name === '测试物品');
        t('新增后66件', Object.keys(saved).length === 66 && dtCells() === 66);
        t('新增在列表首位', dt('.bz-bel-name').textContent === '测试物品'); // 最近排序：新增置顶
        t('新增同步到移动', mobCells() === 66); // storage 桥自动刷新

        // 右键菜单流转（桌面）
        const clickReal = (el) => {
          if (!el) return;
          const r = el.getBoundingClientRect();
          const mk = (type) => new MouseEvent(type, { clientX: r.left + 10, clientY: r.top + 10, bubbles: true, cancelable: true });
          el.dispatchEvent(mk('mousedown'));
          el.dispatchEvent(mk('mouseup'));
          el.dispatchEvent(mk('click'));
        };
        dd.querySelector(`[data-bel-id="${nu.id}"]`).dispatchEvent(new MouseEvent('contextmenu', { clientX: 300, clientY: 300, bubbles: true, cancelable: true }));
        await sleep(100);
        t('右键菜单开', !!dd.querySelector('.bz-item-menu.bz-bel-menu'));
        const flowIdle = [...dd.querySelectorAll('.bz-item-menu .bz-item-menu-item')].find((b) => b.textContent.includes('闲置'));
        clickReal(flowIdle);
        await sleep(150);
        t('流转闲置生效', JSON.parse(localStorage.getItem(LS)).items[nu.id].current_status === '闲置');
        t('闲置数=8', Object.values(JSON.parse(localStorage.getItem(LS)).items).filter((i) => i.current_status === '闲置').length === 8);

        // 详情（桌面）
        dd.querySelector(`[data-bel-id="${nu.id}"]`).click();
        await sleep(80);
        t('详情开', !!dd.querySelector('.bz-bel-detail-mask'));
        t('详情流转条4档', dd.querySelectorAll('.bz-bel-flowbtn').length === 4);
        dd.querySelector('.bz-bel-detail-mask [data-bd-close]').click();
        await sleep(50);
        t('详情关', !dd.querySelector('.bz-bel-detail-mask'));

        // 删除 + 撤销（桌面，真 notice）
        dd.querySelector(`[data-bel-id="${nu.id}"]`).dispatchEvent(new MouseEvent('contextmenu', { clientX: 300, clientY: 300, bubbles: true, cancelable: true }));
        await sleep(100);
        const delItem = [...dd.querySelectorAll('.bz-item-menu .bz-item-menu-item')].find((b) => b.textContent.includes('删除'));
        t('删除菜单项在', !!delItem);
        clickReal(delItem);
        await sleep(150);
        // 删除确认 = core flow-dialog 标准双动作（取消左/删除右：__shared_confirm_ok__）
        const delBtn = dd.querySelector('#__shared_confirm_ok__');
        t('删除确认框开', !!delBtn);
        clickReal(delBtn);
        await sleep(180);
        const afterDel = JSON.parse(localStorage.getItem(LS)).items;
        t('删除后65件', Object.keys(afterDel).length === 65);
        // 撤销（真 notice 的撤销钮在 iframe body 内）
        const undoBtn = [...dd.querySelectorAll('.bz-notice-action')].pop();
        if (undoBtn) undoBtn.click();
        await sleep(180);
        t('撤销后66件', Object.keys(JSON.parse(localStorage.getItem(LS)).items).length === 66);

        // 移动抽屉：真行为只支持下拉关闭（core item-actions touch 拖拽），模拟合成 touch
        mob('.bz-bel-cell').click();
        await sleep(100);
        t('移动抽屉开', !!md.querySelector('.bz-item-sheet-mask'));
        const sheetEl = md.querySelector('.bz-item-sheet');
        if (sheetEl) {
          const mkTouch = (type, y) => new TouchEvent(type, {
            bubbles: true, cancelable: true,
            touches: type === 'touchend' ? [] : [new Touch({ identifier: 1, target: sheetEl, clientX: 100, clientY: y })],
            changedTouches: [new Touch({ identifier: 1, target: sheetEl, clientX: 100, clientY: y })],
          });
          sheetEl.dispatchEvent(mkTouch('touchstart', 100));
          sheetEl.dispatchEvent(mkTouch('touchmove', 300)); // 下拉 200px > 80 阈值
          sheetEl.dispatchEvent(mkTouch('touchend', 300));
        }
        await sleep(300); // 滑出动画 180ms
        t('移动抽屉关', !md.querySelector('.bz-item-sheet-mask'));

        document.title = window.__st.fail.length
          ? 'SELFTEST FAIL ' + window.__st.fail.join(',')
          : `SELFTEST OK ${window.__st.pass}/${window.__st.pass + window.__st.fail.length}`;
        res.textContent = window.__st.fail.length ? '自检失败' : `自检通过 ${window.__st.pass}`;
        res.className = window.__st.fail.length ? 'bad' : 'ok';
      } catch (err) {
        document.title = 'SELFTEST ERR ' + (err && err.message || err);
        res.textContent = '自检异常';
        res.className = 'bad';
      }
    })();
  }
})();
</script>
</body>
</html>
