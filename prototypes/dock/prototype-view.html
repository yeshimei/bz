<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>工具坞 · 真行为实例</title>
<!--
  本页 = 工具坞行为单源评审壳的 iframe 视图（范式自 gameshelf/favorites 适配）。
  它不实现任何工具坞交互——只把真行为层跑起来：
    - 载入同一份 CSS（与 build-css SOURCES 同序）：host-theme → core/styles →
      core/ui/tokens → core/ui/components → dock/styles
    - 载入 prototype-behavior.js（真 ui.ts / data.ts / runner.ts / schema.ts /
      schedule.ts / registry.ts 依赖链，alias obsidian→fake）
    - boot + openDock：面板 append 到本页 body（iframe 即全屏视口），
      桌面视图 = 1180px 面板居中；移动视图 412×915 = Platform.isMobile（视口判定）
  宿主差异（vault 文件系统 / 图标 / 视口 / 子进程）由 fake/fake-obsidian 与
  prototype-icons.js 提供；「工具」那半边（写运行记录）由 fake-sim.ts 的假 child_process 演。
  主题：?theme=dark 直达暗色；缺省亮色（本域评审默认亮色）。
-->
<link rel="stylesheet" href="../host-theme.css">
<link rel="stylesheet" href="../../src/core/styles.css">
<link rel="stylesheet" href="../../src/core/ui/tokens.css">
<link rel="stylesheet" href="../../src/core/ui/components.css">
<link rel="stylesheet" href="../../src/dock/styles.css">
<script src="./prototype-icons.js"></script>
<script src="./prototype-behavior.js"></script>
<style>
  /* iframe 内全屏面板：清掉 body 边距，让根遮罩铺满 */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  /* 遮罩背后露出的是 Obsidian 工作区底 —— 用宿主 token，不写死颜色 */
  body { background: var(--background-primary); font-family: var(--font-interface); }
</style>
</head>
<body class="theme-light">
<script>
  (function () {
    // 主题类必须与 host-theme.css 的 body.theme-light / body.theme-dark 对齐
    // （外景壳按切换钮传参，直达 URL 时缺省亮色——本域评审默认亮色）
    if (location.search.indexOf('theme=dark') >= 0) {
      document.body.classList.remove('theme-light');
      document.body.classList.add('theme-dark');
    }
    // 同源双 iframe（桌面 + 移动）共享同一 localStorage 文件系统：
    // 两个真行为实例各自的模块级状态互不干扰，数据源却是同一份。
    var B = window.BZW_dock;
    B.bootDockSim();
    B.openDockPanel();
  })();
</script>
</body>
</html>
