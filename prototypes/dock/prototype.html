<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>工具坞 · 原型预览（真行为单源）</title>
<!--
  ┌────────────────────────────────────────────────────────────────────────┐
  │ 本文件 = 工具坞域 UI 的评审壳（行为单源版，issue 245/ADR-0106 范式）。     │
  │ 组件样式零内联，全部来自（与 build-css SOURCES 同序）：                    │
  │   ../host-theme.css（真实宿主 token）                                     │
  │   → ../core/styles.css → ../core/ui/tokens.css → ./ui/components.css     │
  │   → ../dock/styles.css                                                  │
  │ 行为单源：交互逻辑全部是插件同款 ui.ts / data.ts / runner.ts 依赖链——      │
  │   经 ./prototype-behavior.js（prototypes/dock/fake-sim.ts 构建，          │
  │   alias obsidian→fake 假层）在两个 iframe 视图里跑真行为：                 │
  │   桌面 iframe 1280×900 = 1180px 面板居中；移动 iframe 412×915 =           │
  │   Platform 视口判定 → 移动布局（物理 1:1，见 ../mob-1to1.js）。            │
  │ 数据 = 工具目录里的**声明文件**（dock.json：标题 / 描述 / 参数 / 节奏 / 怎么跑，        │
  │   工具作者手写、bz 只读不缓存）与 `dock.settings.json`（用户填过的参数值），             │
  │   外加 vault 里「工具的账本」（runs/<id>.json，工具写、bz 只读）；                       │
  │   执行走假 child_process，它按四行协议吐流并**自己**落账——bz 永远不是运行记录的写者。     │
  │ 主题：默认亮色，按钮切暗色（宿主体 theme-light/theme-dark 三端同步）。       │
  │ 壳内只允许：外景容器样式、评审徽牌、演示钩子与自检。                        │
  └────────────────────────────────────────────────────────────────────────┘
-->
<link rel="stylesheet" href="../mob-1to1.css">
<script src="../mob-1to1.js"></script>
<style>
  /* ===== 以下全部是演示壳，禁止放组件样式 ===== */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; gap: 26px;
    padding: 28px 20px 60px; background: #dcd8cd;
    font-family: system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif; }
  /* 模拟 Obsidian 宿主变量（core 弹层/菜单取值用；插件内由主题提供） */
  body {
    --background-primary: #fbf9f3; --text-normal: #171512; --text-muted: #8b8474; --text-faint: #b3ab99;
    --text-error: #b3564d; --background-modifier-hover: rgba(23,21,18,.06); --color-green: #3d8f5d;
    --background-modifier-border: rgba(23,21,18,.12); --background-modifier-cover: rgba(0,0,0,.32);
    --interactive-normal: #fff; --interactive-accent: #e67341; --shadow-s: 0 1px 3px rgba(0,0,0,.1);
  }
  body.theme-dark {
    background: #17171b;
    --background-primary: #1e1e24; --text-normal: #e8e8ec; --text-muted: #9a9aa5; --text-faint: #6c6c78;
    --background-modifier-hover: rgba(255,255,255,.07); --background-modifier-border: rgba(255,255,255,.12);
    --background-modifier-cover: rgba(0,0,0,.6);
  }
  * { scrollbar-width: none; } *::-webkit-scrollbar { display: none; }

  .title { font-size: 13px; color: #7c7566; }
  body.theme-dark .title { color: #8f8f9a; }

  /* 桌面外景（真行为 iframe：面板 append iframe body，视口宽决定面板宽度） */
  .demo-dt { flex: none; width: 1280px; height: 900px; }
  /* 移动外景 412×915 → 物理 1:1（缩放只走 transform，不改 iframe 尺寸，见 mob-1to1.css）。
     ⚠️ 边框用 box-shadow 画（border 会吃掉 2px 内容宽 → iframe 视口变 410，移动端
     「满幅」断言与真机 412 对不上；shadow 不参与布局）。 */
  .demo-mob { width: 412px; height: 915px; border-radius: 26px; overflow: hidden; flex: none;
    box-shadow: 0 0 0 1px #b8b0a0, 0 8px 30px rgba(0,0,0,.16); background: #f5f2ec; }
  body.theme-dark .demo-mob { box-shadow: 0 0 0 1px #3a3a44, 0 8px 30px rgba(0,0,0,.5); background: #22222a; }
  .demo-frame { width: 100%; height: 100%; border: 0; display: block; }

  /* 评审徽牌（演示壳自用） */
  .vbadge { position: fixed; right: 16px; bottom: 12px; font-size: 11px; color: #6d6659; display: flex; gap: 10px; align-items: center;
    background: rgba(255,255,255,.94); border: 1px solid #c9c2b2; padding: 4px 9px; z-index: 900; border-radius: 6px; }
  body.theme-dark .vbadge { background: rgba(34,34,42,.95); border-color: #43434f; color: #a9a9b4; }
  .vbadge button { border: none; background: none; color: #a8402f; font: 11px 'Microsoft YaHei'; cursor: pointer; padding: 0; }
  body.theme-dark .vbadge button { color: #e9a08a; }
  .vbadge .ok { color: #2f7d4d; }
  .vbadge .bad { color: #b3564d; }
</style>
<link rel="stylesheet" href="../preview-settings.css">
</head>
<body class="theme-light">
  <div class="title" id="title">工具坞 · 真行为单源预览（桌面 1280×900 · 移动 412×915 物理 1:1 · 默认亮色）</div>
  <div id="dtHost" class="demo-dt"><iframe class="demo-frame" title="工具坞·桌面"></iframe></div>
  <div id="mobHost" class="demo-mob-wrap"><div class="demo-mob"><iframe class="demo-frame" title="工具坞·移动"></iframe></div></div>

  <div class="vbadge">
    <button id="themeToggle">切到暗色</button>
    <button id="mobToggle">隐藏移动端</button>
    <button id="reset">重置演示数据</button>
    <span id="stResult"></span>
  </div>

<script src="./prototype-icons.js"></script>
<script>
(function () {
  /* ==================== 壳基座（仅外景）：两个真行为 iframe ====================
   * 行为全部在 iframe 内跑真 ui.ts（prototype-behavior.js）；本页只做：
   *  - 亮暗切换（默认亮色；三端同步 body 主题类）
   *  - 重置演示数据（清 localStorage bz-sim:* 后重载）
   *  - 自检（?selftest=1）：经 iframe contentDocument 访问真 DOM 断言
   */
  /* 评审口径透传（演示钩子）：主文档 query 原样交给行为 iframe；iframe 无静态 src，
   * 在此一次性赋值，只加载一次。 */
  document.querySelectorAll('.demo-frame').forEach((f) => {
    f.src = './prototype-view.html' + location.search;
  });

  const resetSim = () => {
    const kill = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith('bz-sim:')) kill.push(k);
    }
    kill.forEach((k) => localStorage.removeItem(k));
  };

  const dtFrame = () => document.querySelector('#dtHost iframe');
  const mobFrame = () => document.querySelector('#mobHost iframe');
  const dtDoc = () => dtFrame().contentDocument;
  const mobDoc = () => mobFrame().contentDocument;
  // 轮询现取 contentDocument：iframe 加载前后 document 引用会替换（about:blank → 真实文档），
  // 不能缓存旧引用等面板——每次现查，跨文档访问本身同源安全。
  const waitFrame = (getDoc, sel) => new Promise((res, rej) => {
    const started = Date.now();
    const tries = () => {
      try {
        const doc = getDoc();
        if (doc && doc.querySelector(sel)) return res(doc);
        if (Date.now() - started > 25000) return rej(new Error('iframe 面板超时'));
        setTimeout(tries, 150);
      } catch (e) { setTimeout(tries, 150); }
    };
    tries();
  });

  /* ---------- 亮暗切换（缺省亮色；文案按当前态，不做三态跟随系统） ---------- */
  const applyTheme = () => {
    const dark = document.documentElement.classList.contains('theme-dark');
    document.body.className = dark ? 'theme-dark' : 'theme-light';
    for (const f of [dtFrame(), mobFrame()]) {
      try {
        const d = f && f.contentDocument;
        if (d && d.body) d.body.className = dark ? 'theme-dark' : 'theme-light';
      } catch (e) { /* 未加载跳过 */ }
    }
    document.querySelector('#themeToggle').textContent = dark ? '切回亮色' : '切到暗色';
  };
  document.querySelector('#themeToggle').addEventListener('click', () => {
    document.documentElement.classList.toggle('theme-dark');
    applyTheme();
  });
  // iframe 首载晚于壳脚本：加载完成后补一次主题
  for (const sel of ['#dtHost iframe', '#mobHost iframe']) {
    const f = document.querySelector(sel);
    if (f) f.addEventListener('load', () => { try { applyTheme(); } catch (e) { /* noop */ } });
  }
  applyTheme();

  document.querySelector('#mobToggle').addEventListener('click', () => {
    const m = document.querySelector('#mobHost');
    const hidden = m.style.display === 'none';
    m.style.display = hidden ? '' : 'none';
    document.querySelector('#mobToggle').textContent = hidden ? '隐藏移动端' : '显示移动端';
  });

  document.querySelector('#reset').addEventListener('click', () => {
    resetSim();
    location.reload();
  });

  /* ==================== 自检（?selftest=1）：真行为 DOM 断言（经 iframe） ====================
   *
   * 断言只对着 **面板的真实 DOM**（`.bz-dock-mask / .bz-dock-panel / .bz-dock-card[data-tool]`）。
   * 2026-10-24：面板外壳回退到各域共用的 `.bz-panel-*` 范式（卡片墙 + 详情两栏），
   * 这一整段跟着从 `.bz-dock-overlay / -sheet / -summary` 改回来 —— 类名变了就必须同步，
   * 否则自检又会变成「对着空气断言」。
   */
  if (location.search.includes('selftest')) {
    window.__st = { pass: 0, fail: [] };
    const t = (name, cond) => cond ? window.__st.pass++ : window.__st.fail.push(name);
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    (async () => {
      const res = document.querySelector('#stResult');
      try {
        const dd0 = await waitFrame(dtDoc, '.bz-dock-panel');
        const md0 = await waitFrame(mobDoc, '.bz-dock-panel');
        const SEED = (dtFrame().contentWindow || {}).DOCK_SEED || { total: 0, ids: [] };
        res.textContent = '…';
        const dt = (sel) => dd0.querySelector(sel);
        const mob = (sel) => md0.querySelector(sel);
        const cards = (doc) => doc.querySelectorAll('.bz-dock-card').length;
        const cardOf = (doc, id) => doc.querySelector('.bz-dock-card[data-tool="' + id + '"]');
        const textOf = (el) => (el ? el.textContent || '' : '');
        const btnOfText = (doc, name) => Array.from(doc.querySelectorAll('button.bz-btn')).find((b) => textOf(b) === name);

        // ---- 面板骨架 ----
        t('桌面面板开', !!dt('.bz-dock-mask') && !!dt('.bz-dock-panel'));
        t('移动面板开', !!mob('.bz-dock-mask') && !!mob('.bz-dock-panel'));
        t('遮罩是 body 直接子节点', dt('.bz-dock-mask').parentElement === dd0.body);
        t('面板在遮罩内', dt('.bz-dock-panel').parentElement === dt('.bz-dock-mask'));
        t('面板走共用面板范式', dt('.bz-dock-panel').classList.contains('bz-panel-frame'));
        t('标题是「工具坞」', textOf(dt('.bz-dock-panel .bz-panel-title')) === '工具坞');

        // view 页 CSS 链生效（曾因 ../../ 深度写错静默 404 → 面板透明）
        const cssAlive = (doc) => {
          const sheet = doc.querySelector('.bz-dock-panel');
          const bg = getComputedStyle(sheet).backgroundColor;
          let sheets = 0;
          for (const s of doc.styleSheets) { try { if (s.cssRules.length > 0) sheets++; } catch (e) { /* 跨域忽略 */ } }
          return bg !== 'rgba(0, 0, 0, 0)' && sheets >= 5;
        };
        t('view页CSS链生效', cssAlive(dd0) && cssAlive(md0));

        // ---- 种子覆盖到几种形态 ----
        t('桌面 ' + SEED.total + ' 卡', cards(dd0) === SEED.total);
        t('移动 ' + SEED.total + ' 卡', cards(md0) === SEED.total);

        // 四格概览：今日达标 / 成功率 / 待处理异常 / 距下次到期
        const kpis = dd0.querySelectorAll('#bz-dock-kpi .bz-dock-kpi-tile');
        t('概览四格', kpis.length === 4);
        t('概览第一格是「今日自动化达标」',
          kpis.length === 4 && textOf(kpis[0].querySelector('.bz-dock-kpi-l')) === '今日自动化达标');

        // 每种状态都要有一张卡能看见（这是这次补种子的全部意义）
        t('有「正在跑」的卡', !!dd0.querySelector('.bz-dock-card.is-running'));
        t('有「待授权」标签', !!dd0.querySelector('.bz-dock-card .bz-dock-tag--warn'));
        t('有声明读不出来的卡', Array.from(dd0.querySelectorAll('.bz-dock-card-desc'))
          .some((el) => (textOf(el) || '').includes('manifest.json')));

        // ---- 详情：展示板 ----
        cardOf(dd0, 'demo-radar').click();
        await sleep(260);
        t('进详情页（封面头 + 返回）', !!dt('.bz-dock-toolhead') && !!dt('.bz-dock-back'));
        const frame = dt('.bz-dock-board iframe.bz-dock-board-frame');
        t('展示板 iframe 挂出来', !!frame);
        t('展示板 srcdoc 里塞了框内滚动条样式', !!frame && (frame.getAttribute('srcdoc') || '').includes('scrollbar'));
        t('展示板灌了主题变量（框里跟面板同一个世界）',
          !!frame && /--bz-text-1/.test(frame.getAttribute('srcdoc') || ''));
        t('展示板不给 allow-scripts 之外的越权位', !!frame && !(frame.getAttribute('sandbox') || '').includes('allow-top-navigation'));
        t('展示板高度封顶走内联 max-height', !!frame && /max-height:\s*\d+px/.test(frame.getAttribute('style') || ''));

        // ---- 详情：未授权 = 能看不能跑 ----
        dt('.bz-dock-back').click();
        await sleep(200);
        cardOf(dd0, 'demo-backup').click();
        await sleep(200);
        t('未授权工具给「授权这条命令」', !!btnOfText(dd0, '授权这条命令'));
        t('未授权时运行按钮禁用', (() => { const b = btnOfText(dd0, '运行'); return !!b && b.disabled; })());
        t('未授权写在头部标签里', !!dt('.bz-dock-tag--warn'));

        // ---- 详情：熔断 = 给「恢复自动运行」 ----
        dt('.bz-dock-back').click();
        await sleep(200);
        cardOf(dd0, 'demo-failing').click();
        await sleep(200);
        t('熔断的工具给「恢复自动运行」', !!btnOfText(dd0, '恢复自动运行'));

        // ---- 详情：参数与历史 ----
        dt('.bz-dock-back').click();
        await sleep(200);
        cardOf(dd0, 'demo-signin').click();
        await sleep(200);
        t('参数按声明长出来 1 行', dd0.querySelectorAll('.bz-dock-form .bz-field').length === 1);
        t('历史账本有记录行', dd0.querySelectorAll('.bz-dock-histpane .bz-dock-histrow').length >= 1);

        // ---- 交互：点「运行」真的会演一场（假 child_process 吐步骤） ----
        {
          const runBtn = btnOfText(dd0, '运行');
          t('已授权工具的运行按钮可用', !!runBtn && !runBtn.disabled);
          if (runBtn) {
            runBtn.click();
            await sleep(1500); // 假进程 400ms 起跑、每 700ms 一步
            const lines = dd0.querySelectorAll('.bz-dock-livelog .bz-dock-liveline').length;
            t('运行中吐出步骤（' + lines + ' 行）', lines >= 1);
            const stopBtn = btnOfText(dd0, '停止');
            t('运行中给「停止」', !!stopBtn);
            if (stopBtn) stopBtn.click();
            await sleep(500);
          }
        }

        res.textContent = window.__st.fail.length ? '✗ ' + window.__st.fail.length : '✓ ' + window.__st.pass;
        res.className = window.__st.fail.length ? 'bad' : 'ok';
        res.title = (window.__st.fail || []).join('\n');
        console.log('[dock selftest]', window.__st);
      } catch (e) {
        res.textContent = 'ERR ' + (e && e.message ? e.message : e);
        res.className = 'bad';
        console.error('[dock selftest]', e);
      }
    })();
  }
})();
</script>
<script src="../preview-settings.js"></script>
</body>
</html>
