<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>书库 · 原型预览（真行为单源）</title>
<!--
  ┌────────────────────────────────────────────────────────────────────────┐
  │ 本文件 = 书库域 UI 的评审壳（行为单源版，issue 245/ADR-0106）。           │
  │ 组件样式零内联，全部来自（与 build-css SOURCES 同序）：                    │
  │   ../core/styles.css → ../core/ui/tokens.css → ../core/ui/components.css │
  │   → ../reading-report/styles.css → ./styles.css                          │
  │ markup 单源（ADR-0104）：面板/标签/排序/书脊墙/空态/借书卡 HTML 出自       │
  │   ./prototype-render.js（src/bookshelf/render.ts 构建）。                 │
  │ 行为单源（issue 245/ADR-0106）：交互逻辑全部是插件同款 ui.ts/index.ts      │
  │   /data.ts/reading-report 依赖链——经 ./prototype-behavior.js              │
  │   （src/bookshelf/fake-sim.ts 构建，alias obsidian→公共假层）在下方两个     │
  │   iframe 视图里跑真行为；桌面 iframe 920px = 桌面布局；移动 iframe 412×915    │
  │   = @media ≤768 移动布局。数据 = localStorage（fake vault 种子：md 笔记    │
  │   frontmatter + weave-data.json + 封面图，每次启动无条件重灌）。            │
  │ 壳内只允许：外景容器样式、评审徽牌、演示钩子与自检。                        │
  └────────────────────────────────────────────────────────────────────────┘
-->
<link rel="stylesheet" href="../../src/core/styles.css">
<link rel="stylesheet" href="../../src/core/ui/tokens.css">
<link rel="stylesheet" href="../../src/core/ui/components.css">
<link rel="stylesheet" href="../../src/reading-report/styles.css">
<link rel="stylesheet" href="../../src/bookshelf/styles.css">
<link rel="stylesheet" href="../mob-1to1.css">
<script src="../mob-1to1.js"></script>
<style>
  /* ===== 以下全部是演示壳，禁止放组件样式 ===== */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; gap: 28px; padding: 32px 24px;
    background: #d6d2c6; font-family: system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif; }
  /* 模拟 Obsidian 宿主变量（core/styles.css 的弹层/菜单取值用；插件内由主题提供） */
  body {
    --background-primary: #fbf9f3; --text-normal: #171512; --text-muted: #8b8474; --text-faint: #b3ab99;
    --text-error: #b3564d; --background-modifier-hover: rgba(23,21,18,.06); --color-green: #3d8f5d;
  }
  * { scrollbar-width: none; } *::-webkit-scrollbar { display: none; }

  /* 桌面外景（真行为 iframe：面板 append iframe body，宽度决定布局；
     .bz-bs-panel 以 max-width:calc(100vw-32px)/max-height:92vh 自适应外景） */
  .demo-dt { flex: none; width: 920px; height: 640px; }
  /* 移动外景：412×915 iframe → 视口 ≤768 命中 fake Platform.isMobile 与 @media 移动布局 */
  .demo-mob { width: 412px; height: 915px; border-radius: 26px; overflow: hidden; flex: none;
    border: 1px solid #9a948a; box-shadow: 0 8px 30px rgba(0,0,0,.2); background: #1d1510; }
  .demo-frame { width: 100%; height: 100%; border: 0; display: block; }

  /* 评审徽牌（演示壳自用） */
  .vbadge { position: fixed; right: 16px; bottom: 12px; font-size: 11px; color: #5c564a; display: flex; gap: 10px; align-items: center;
    background: rgba(255,255,255,.92); border: 1px solid #c9c2b2; padding: 3px 8px; z-index: 900; }
  .vbadge button { border: none; background: none; color: #b3564d; font: 11px 'Microsoft YaHei'; cursor: pointer; }
  .vbadge .ok { color: #3d8f5d; }
  .vbadge .bad { color: #b3564d; }
</style>
</head>
<body class="theme-light"> <!-- 模拟 Obsidian 宿主：色彩 token 挂 theme-light/dark；书库面板皮肤自给，壳内补一类兜底 -->
  <div id="dtHost" class="demo-dt"><iframe class="demo-frame" src="./prototype-view.html" title="书库·桌面"></iframe></div>
  <div id="mobHost" class="demo-mob-wrap"><div class="demo-mob"><iframe class="demo-frame" src="./prototype-view.html?mob=1" title="书库·移动"></iframe></div></div>

  <div class="vbadge">书库 · 真行为单源预览（桌面=真 ui.ts 跑在 920px，移动=412×915）· 真实 164 册
    <button id="mobToggle">隐藏移动端</button>
    <button id="reset">重置演示数据</button>
    <span id="stResult"></span>
  </div>

<script src="./prototype-icons.js"></script>
<script src="./prototype-data.js"></script>
<script src="./prototype-render.js"></script>
<script>
(function () {
  /* ==================== 壳基座（仅外景）：两个真行为 iframe ====================
   * 行为全部在 iframe 内跑真 ui.ts（prototype-behavior.js）；本页只做：
   *  - 重置演示数据（清 fake vault 本域键后重载；fake-sim 每次启动无条件重灌种子）
   *  - 演示钩子（?demo=…）与自检（?selftest=1）：经 iframe contentWindow 访问真 DOM
   */
  const dtFrame = () => document.querySelector('#dtHost iframe');
  const mobFrame = () => document.querySelector('#mobHost iframe');
  const dtDoc = () => dtFrame().contentDocument;
  const mobDoc = () => mobFrame().contentDocument;
  // 轮询现取 contentDocument：iframe 加载前后 document 引用会替换（about:blank → 真实文档），
  // 不能缓存旧引用等面板——每次现查，跨文档访问本身同源安全。
  const waitFrame = (getDoc, sel) => new Promise((res, rej) => {
    const started = Date.now();
    const tries = () => {
      try {
        const doc = getDoc();
        if (doc && doc.querySelector(sel)) return res(doc);
        if (Date.now() - started > 25000) return rej(new Error('iframe 面板超时：' + sel));
        setTimeout(tries, 150);
      } catch (e) { setTimeout(tries, 150); }
    };
    tries();
  });
  // 条件轮询（现取求值；报告分片渲染等异步面用）
  const waitCond = (fn, what, timeout = 12000) => new Promise((res, rej) => {
    const started = Date.now();
    const tries = () => {
      try {
        const v = fn();
        if (v) return res(v);
        if (Date.now() - started > timeout) return rej(new Error('等待超时：' + what));
        setTimeout(tries, 120);
      } catch (e) { rej(e); }
    };
    tries();
  });

  document.querySelector('#mobToggle').addEventListener('click', () => {
    const m = document.querySelector('#mobHost');
    const hidden = m.style.display === 'none';
    m.style.display = hidden ? '' : 'none';
    document.querySelector('#mobToggle').textContent = hidden ? '隐藏移动端' : '显示移动端';
  });

  document.querySelector('#reset').addEventListener('click', () => {
    // fake vault 本域键清仓（书库 md + weave-data.json + 封面图；不动其他域的 bz-sim 数据）
    const rm = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && (k.startsWith('bz-sim:书库/') || k.startsWith('bz-sim:CONFIG/BOOK/') || k.startsWith('bz-sim-meta:书库/')
        || k === 'bz-sim:CONFIG/STORAGE/weave-data.json')) rm.push(k);
    }
    rm.forEach((k) => localStorage.removeItem(k));
    location.reload();
  });

  /* ==================== 演示钩子（?demo=detail|unread：桌面 iframe 直达） ==================== */
  if (location.search.includes('demo=')) {
    const d = new URLSearchParams(location.search).get('demo');
    waitFrame(dtDoc, '.bz-bs-panel').then((doc) => {
      setTimeout(() => {
        if (d === 'detail') doc.querySelector('#bz-bs-shelf [data-bs-id]')?.click();
        if (d === 'unread') doc.querySelector('[data-bs-side="unread"]')?.click();
      }, 600);
    }).catch(() => {});
  }

  /* ==================== 自检（?selftest=1）：真行为 DOM 断言（经 iframe） ==================== */
  if (location.search.includes('selftest')) {
    const R = window.BZR_bookshelf;
    const ITEMS = window.BS?.ITEMS || [];
    window.__st = { pass: 0, fail: [] };
    const t = (name, cond) => cond ? window.__st.pass++ : window.__st.fail.push(name);
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    (async () => {
      const res = document.querySelector('#stResult');
      try {
        const dd = await waitFrame(dtDoc, '.bz-bs-panel');
        const md = await waitFrame(mobDoc, '.bz-bs-panel');
        res.textContent = '…';
        const dt = (sel) => dd.querySelector(sel);
        const mob = (sel) => md.querySelector(sel);
        const spines = (doc) => doc.querySelectorAll('#bz-bs-shelf .bz-bs-spine');
        const itemById = (id) => ITEMS.find((i) => i.id === id);
        // 完整鼠标事件序列（mousedown+mouseup+click 带真实坐标）：纯 .click() 会被遮罩判定吞
        const clickReal = (el) => {
          if (!el) return;
          const r = el.getBoundingClientRect();
          const mk = (type) => new MouseEvent(type, { clientX: r.left + 10, clientY: r.top + 10, bubbles: true, cancelable: true });
          el.dispatchEvent(mk('mousedown'));
          el.dispatchEvent(mk('mouseup'));
          el.dispatchEvent(mk('click'));
        };
        const view = { side: 'all', catFilter: 'all', q: '', sortMode: 'recent' };
        const pipe = (v) => R.getDisplayItems(ITEMS, v);
        // CSS 链生效断言（防 view 页相对路径再犯：404 的表不进 styleSheets）：
        // 外链表 5 张全载 + components.css 的 .bz-panel-overlay 基准（position:fixed）+ tokens 变量在位
        const cssState = (doc) => ({
          sheets: [...doc.styleSheets].filter((s) => s.href).length,
          overlayPos: (() => {
            const el = doc.querySelector('.bz-panel-overlay');
            try { return el ? getComputedStyle(el).position : ''; } catch { return ''; }
          })(),
          tokens: getComputedStyle(doc.body).getPropertyValue('--bz-overlay').trim(),
        });
        const csDt = cssState(dd);
        const csMd = cssState(md);
        t('桌面CSS五链生效', csDt.sheets === 5 && csDt.overlayPos === 'fixed' && csDt.tokens !== '');
        t('移动CSS五链生效', csMd.sheets === 5 && csMd.overlayPos === 'fixed' && csMd.tokens !== '');

        // 首扫：等真 rebuildItems 完成（B8 加载态占位 → 整墙）
        await waitCond(() => spines(dd).length === ITEMS.length, '桌面整墙', 15000);

        t('桌面面板开', !!dt('.bz-bs-panel'));
        t('移动面板开', !!mob('.bz-bs-panel'));
        t('真实164册', spines(dd).length === 164);
        t('标签行全馆164', dt('[data-bs-side="all"] .n').textContent === '164');
        t('在墙计数提示', dt('#bz-bs-hint').textContent === '164 册在墙');
        const dividers = [...dd.querySelectorAll('#bz-bs-shelf .bz-bs-divider')];
        const catDivs = new Set(dividers.map((d) => d.textContent).filter((x) => x !== '倒 叠 区'));
        t('分区隔板15类+倒叠区', catDivs.size === 15 && dividers.filter((d) => d.textContent === '倒 叠 区').length === 1);
        t('分类标签15张', dd.querySelectorAll('[data-bs-cat]').length === 15);
        t('倒叠区含全部未读', ITEMS.filter((x) => x.status === '未读').every((x) => dt(`#bz-bs-shelf [data-bs-id="${CSS.escape(x.id)}"]`)));
        t('已读盖讫印', dd.querySelectorAll('#bz-bs-shelf .bz-bs-spine.read .stamp').length === 151);
        t('在读垂书签带', dd.querySelectorAll('#bz-bs-shelf .bz-bs-spine.reading .ribbon').length === 9);
        t('EPUB书脊标记', dd.querySelectorAll('#bz-bs-shelf [data-bs-epub="1"]').length === 2);
        t('书脊厚度22~64', [...spines(dd)].every((s) => { const w = parseFloat(s.style.width); return w >= 22 && w <= 64; }));
        t('书脊高度150~230', [...spines(dd)].every((s) => { const h = parseFloat(s.style.height); return h >= 150 && h <= 230; }));
        t('双列拆题存在', dd.querySelectorAll('#bz-bs-shelf .bz-bs-spine-title .t-sub').length > 0);
        t('报告视图容器默认隐藏', !dt('.bz-bs-view-report.active') && !!dt('.bz-bs-view-report'));
        t('关闭面板无关钮残留', !dt('.bz-bs-mob-close'));

        // 状态筛选（真事件委托：ui.ts overlay click 单一委托）
        dt('[data-bs-side="reading"]').click();
        await sleep(60);
        t('在读筛选9条', spines(dd).length === 9 && dt('#bz-bs-hint').textContent === '9 册在墙');
        t('筛选时未选标签弱化', dd.querySelectorAll('.bz-bs-taglabel.off').length > 0);
        dd.querySelector('[data-bs-side="reading"]').click(); // renderAll 重建标签 DOM，须重新取节点
        await sleep(60);
        t('再点回全馆', spines(dd).length === 164);

        // 分类筛选（与状态正交；再点回全馆）
        let catLabel = [...dd.querySelectorAll('[data-bs-cat]')].find((c) => c.dataset.bsCat === '推理');
        catLabel.click();
        await sleep(60);
        t('分类筛选=推理区', [...dd.querySelectorAll('#bz-bs-shelf .bz-bs-divider')].every((d) => d.textContent === '推理 区' || d.textContent === '倒 叠 区'));
        t('分类筛选数=管道值', spines(dd).length === pipe({ ...view, catFilter: '推理' }).length);
        [...dd.querySelectorAll('[data-bs-cat]')].find((c) => c.dataset.bsCat === '推理').click();
        await sleep(60);
        t('分类再点回全馆', spines(dd).length === 164);

        // 检索（ui.ts 200ms 防抖）
        const q = dt('#bz-bs-dsearch');
        q.value = '红楼梦'; q.dispatchEvent(new Event('input'));
        await sleep(320);
        t('搜索红楼梦1条(EPUB)', spines(dd).length === 1 && spines(dd)[0].dataset.bsEpub === '1');
        q.value = '不存在的书xyz'; q.dispatchEvent(new Event('input'));
        await sleep(320);
        t('搜索空态+图标', !!dt('.bz-bs-wall-empty .bz-empty') && !!dt('.bz-bs-wall-empty .bz-empty-ic svg'));
        q.value = ''; q.dispatchEvent(new Event('input'));
        await sleep(320);

        // 排序（书名档；分区口径下区内首位 = 管道值首位）
        dt('[data-bs-sort="title"]').click();
        await sleep(60);
        const sorted0 = R.itemId(pipe({ ...view, sortMode: 'title' })[0]);
        const zone0 = dt(`#bz-bs-shelf [data-bs-id="${CSS.escape(sorted0)}"]`)?.closest('.bz-bs-zone');
        t('书名排序区内首位', !!zone0 && zone0.querySelector('.bz-bs-spine').dataset.bsId === sorted0);
        dd.querySelector('[data-bs-sort="recent"]').click();
        await sleep(60);

        // 借书卡（ui.ts openBookDetail + core uiModal；封面走假 vault resource URL）
        const first = spines(dd)[0];
        first.click();
        await sleep(80);
        const firstIt = itemById(first.dataset.bsId);
        t('借书卡开', !!dt('.bz-bs-d-popup .bz-bs-detail'));
        t('借书卡标题一致', dt('.bz-bs-d-title').textContent === firstIt.title);
        t('进度百分数', dt('.bz-bs-d-prognum').textContent === Math.round(firstIt.progress) + '%');
        t('借书卡✕钮在位', !!dt('.bz-bs-d-x'));
        dd.querySelector('.bz-bs-d-x').click();
        await sleep(60);
        t('借书卡点✕关', !dt('.bz-bs-d-popup'));

        // 桌面点匾额不关面板（isMobileEnv 假判定 = 920 视口 false）
        dt('[data-bs-plaque]').click();
        await sleep(40);
        t('桌面点匾额不关面板', !!dt('.bz-bs-panel'));

        // 报告视图（真 openReportView → reading-report 分片渲染 → 返回书库）
        dtFrame().contentWindow.BZW_bookshelf.openReport();
        await waitCond(() => dd.querySelector('.bz-bs-view-report.active'), '报告视图激活');
        await waitCond(() => dd.querySelector('.bz-rr-content .bz-rr-bar-row, .bz-rr-content [data-rr-year]'), '报告分片渲染');
        t('报告视图渲染数据', (dd.querySelector('.bz-rr-content').textContent || '').length > 200);
        dd.querySelector('[data-rr-goto-shelf]').click();
        await sleep(80);
        t('报告返回书库', !!dt('.bz-bs-view-shelf.active') && !dt('.bz-bs-view-report.active'));

        // ---------- 移动 iframe（412 视口：@media 布局 + 真 isMobileEnv 出口） ----------
        t('移动164册', spines(md).length === 164);
        t('移动端@media全屏命中', Math.abs(mob('.bz-bs-panel').getBoundingClientRect().width - md.documentElement.clientWidth) < 2);
        const head = mob('.bz-bs-header');
        t('头行一行横滑(overflow+隐藏滚动条)', !!head && getComputedStyle(head).overflowX === 'auto' && getComputedStyle(head).scrollbarWidth === 'none' && head.scrollWidth > head.clientWidth);
        t('顶部安全区避让(匾额≥44px)', mob('.bz-bs-plaque').getBoundingClientRect().top >= 44);
        t('状态签+分类带并入头行单行', getComputedStyle(mob('.bz-bs-labels')).display === 'contents' && getComputedStyle(mob('.bz-bs-cats')).display === 'contents');

        // 移动借书卡（core uiModal 窄卡）
        mob('#bz-bs-shelf [data-bs-id]').click();
        await sleep(80);
        const pop = mob('.bz-bs-d-popup');
        t('移动借书卡留边不全屏', !!pop && pop.getBoundingClientRect().width <= md.documentElement.clientWidth - 24);
        t('移动借书卡✕钮在位', !!mob('.bz-bs-d-x'));
        clickReal(md.querySelector('.bz-overlay-mask'));
        await sleep(60);
        t('移动借书卡点遮罩关', !mob('.bz-bs-d-popup'));

        // 移动点匾额 = 真 closeOverlay（插件「点书库匾收面板」语义；旧壳只能藏 DOM）
        mob('[data-bs-plaque]').click();
        await sleep(80);
        t('移动点书库匾收面板', !mob('.bz-bs-panel') && !md.querySelector('.bz-panel-overlay'));
        // 真重开（index.ts openBookshelf toggle 语义经 contentWindow）
        mobFrame().contentWindow.BZW_bookshelf.openBookshelf();
        await waitCond(() => spines(md).length === 164, '移动重开整墙', 15000);
        t('移动面板重开', spines(md).length === 164);

        document.title = window.__st.fail.length
          ? 'SELFTEST FAIL ' + window.__st.fail.join(',')
          : `SELFTEST OK ${window.__st.pass}/${window.__st.pass + window.__st.fail.length}`;
        res.textContent = window.__st.fail.length ? '自检失败' : `自检通过 ${window.__st.pass}`;
        res.className = window.__st.fail.length ? 'bad' : 'ok';
      } catch (err) {
        document.title = 'SELFTEST ERR ' + (err && err.message || err);
        res.textContent = '自检异常';
        res.className = 'bad';
      }
    })();
  }
})();
</script>

</body>
</html>
