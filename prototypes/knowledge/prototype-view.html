<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>知识盒 · 真行为实例</title>
<!--
  本页 = 知识盒行为单源评审壳的 iframe 视图（issue 259，范式随 settings-panel/ADR-0106）。
  它不实现任何交互——只把真行为层跑起来：
    - 载入同一份 CSS（core + 域，与插件同源；相对路径一级 ../core/）
    - 载入 prototype-behavior.js（真 ui.ts 依赖链，alias obsidian→fake）
    - boot + openPanel：主窗 append 到本页 body（iframe 即全屏视口），
      宽度决定桌面/移动布局（≤768 主窗真全屏 + 头栏 ✕，fake Platform 视口判定）
  宿主差异（图标/目录面/设置存取/AI 罐头）由 fake-obsidian / prototype-icons.js 提供。
-->
<link rel="stylesheet" href="../../src/core/styles.css">
<link rel="stylesheet" href="../../src/core/ui/tokens.css">
<link rel="stylesheet" href="../../src/core/ui/components.css">
<link rel="stylesheet" href="../../src/knowledge/styles.css">
<script src="./prototype-icons.js"></script>
<script src="./prototype-behavior.js"></script>
<style>
  /* iframe 内全屏：清 body 边距，让固定定位的主窗铺满 */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body { background: #e3e0d8; }
  * { scrollbar-width: none; } *::-webkit-scrollbar { display: none; }
  /* 模拟 Obsidian 宿主变量（core 弹层/通知取值用；插件内由主题提供） */
  body {
    --background-primary: #fbf9f3; --text-normal: #171512; --text-muted: #8b8474; --text-faint: #b3ab99;
    --text-error: #b3564d; --background-modifier-hover: rgba(23,21,18,.06); --color-green: #3d8f5d;
    --background-modifier-cover: rgba(0, 0, 0, 0.35);
  }
</style>
</head>
<body class="theme-light">
<script>
(function () {
  window.BZW_knowledge.boot();
  window.BZW_knowledge.openPanel();
})();
</script>
</body>
</html>
