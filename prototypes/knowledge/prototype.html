<script>
(function () {
  /* 壳基座（仅外景）：重置演示数据（清 bz-sim:* 后重载 iframe，种子由 fake-sim 重播） */
  document.querySelector('#mobToggle').addEventListener('click', () => {
    const m = document.querySelector('#mobHost');
    const hidden = m.style.display === 'none';
    m.style.display = hidden ? '' : 'none';
    document.querySelector('#mobToggle').textContent = hidden ? '隐藏移动端' : '显示移动端';
  });
  document.querySelector('#reset').addEventListener('click', () => {
    const doomed = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith('bz-sim:')) doomed.push(k);
    }
    doomed.forEach((k) => localStorage.removeItem(k));
    location.reload();
  });
})();

/* ===== 评审工具：标注模式（点选 iframe 内元素 → 生成代码片段 → 复制给 AI） ===== */
(function () {
  const state = { on: false, items: [], hooks: new Map(), cur: null, prev: '' };
  const toggle = document.querySelector('#annoToggle');
  const panel = document.querySelector('#annoPanel');
  const list = document.querySelector('#annoList');
  const toastEl = document.querySelector('#annoToast');
  const pop = document.querySelector('#annoPop');
  const popInput = document.querySelector('#annoInput');
  const chipsBox = document.querySelector('#annoChips');
  const escHtml = (s) => s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let noteTimer = 0, editIdx = -1;
  const PRESETS = ['去掉', '居中', '字号大点', '字号小点', '加粗', '换文案'];
  chipsBox.innerHTML = PRESETS.map((p) => '<button data-p="' + p + '">' + p + '</button>').join('');

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.style.opacity = 1;
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => { toastEl.style.opacity = 0; }, 1200);
  }
  function frameName(iframe) { return iframe.title.includes('移动') ? '移动端' : '桌面端'; }
  /* 还原成「开标签 + 文本」片段（贴给 AI 即可检索定位）；剥掉高亮 outline，别混进片段 */
  function snippet(el) {
    const clone = el.cloneNode(false);
    clone.style && clone.style.removeProperty('outline');
    const open = clone.outerHTML;
    const closeIdx = open.lastIndexOf('</');
    const voidEl = closeIdx < 0;
    const openTag = voidEl ? open : open.slice(0, closeIdx);
    const text = (el.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 80);
    return voidEl ? openTag : openTag + text + (text.length >= 80 ? '…' : '') + '</' + el.tagName.toLowerCase() + '>';
  }
  function buildText() {
    return state.items.map((it, i) => {
      const head = '【标注 ' + (i + 1) + ' · ' + it.frame + '】' + it.html;
      return it.note ? head + '\n处理：' + it.note : head;
    }).join('\n');
  }
  function copyAll(silent) {
    if (!state.items.length) return;
    const text = buildText();
    const done = () => { if (!silent) toast('已复制 ' + state.items.length + ' 条，直接贴给 AI'); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
    } else fallbackCopy(text, done);
  }
  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
    done();
  }
  function render() {
    list.innerHTML = state.items.length
      ? state.items.map((it, i) => '<div><b>' + (i + 1) + ' · ' + it.frame + '</b>' + escHtml(it.html) +
          '<input type="text" data-idx="' + i + '" placeholder="要怎么处理？如：去掉 / 居中 / 字号大点" value="' + escHtml(it.note || '') + '"></div>').join('')
      : '<div style="color:#9a917d">还没有标注。</div>';
  }
  /* 鼠标旁的处理弹框：预选一键项，或自定义输入后回车 */
  function openPop(idx, x, y) {
    editIdx = idx;
    popInput.value = state.items[idx].note || '';
    pop.style.display = 'block';
    const w = 266, h = pop.offsetHeight || 92;
    pop.style.left = Math.max(8, Math.min(x, window.innerWidth - w - 12)) + 'px';
    pop.style.top = Math.max(8, Math.min(y + 14, window.innerHeight - h - 12)) + 'px';
    popInput.focus();
  }
  function closePop() {
    pop.style.display = 'none';
    editIdx = -1;
  }
  function applyNote(text) {
    if (editIdx >= 0 && editIdx < state.items.length) {
      state.items[editIdx].note = text.trim();
      render();
      copyAll(false);
    }
    closePop();
  }
  chipsBox.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-p]');
    if (b) applyNote(b.getAttribute('data-p'));
  });
  popInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') applyNote(popInput.value);
    else if (e.key === 'Escape') closePop();
  });
  popInput.addEventListener('input', () => {
    if (editIdx >= 0 && editIdx < state.items.length) state.items[editIdx].note = popInput.value;
    clearTimeout(noteTimer);
    noteTimer = setTimeout(() => copyAll(true), 600);
  });
  document.addEventListener('click', (e) => {
    if (pop.style.display === 'block' && !pop.contains(e.target)) closePop();
  }, true);
  function attach(iframe) {
    const doc = iframe.contentDocument;
    if (!doc || state.hooks.has(iframe)) return;
    const over = (e) => {
      if (state.cur === e.target) return;
      if (state.cur) state.cur.style.outline = state.prev;
      state.cur = e.target;
      state.prev = e.target.style.outline || '';
      e.target.style.outline = '2px solid #b3564d';
    };
    const out = () => { if (state.cur) { state.cur.style.outline = state.prev; state.cur = null; } };
    const click = (e) => {
      e.preventDefault();
      e.stopPropagation();
      closePop();
      state.items.push({ frame: frameName(iframe), html: snippet(e.target), note: '' });
      render();
      const r = iframe.getBoundingClientRect();
      openPop(state.items.length - 1, r.left + e.clientX, r.top + e.clientY);
    };
    doc.addEventListener('mouseover', over);
    doc.addEventListener('mouseout', out);
    doc.addEventListener('click', click, true);
    doc.documentElement.style.cursor = 'crosshair';
    state.hooks.set(iframe, { doc, over, out, click });
  }
  function detach(iframe) {
    const h = state.hooks.get(iframe);
    if (!h) return;
    h.doc.removeEventListener('mouseover', h.over);
    h.doc.removeEventListener('mouseout', h.out);
    h.doc.removeEventListener('click', h.click, true);
    h.doc.documentElement.style.cursor = '';
    state.hooks.delete(iframe);
  }
  toggle.addEventListener('click', () => {
    state.on = !state.on;
    toggle.classList.toggle('on', state.on);
    panel.style.display = state.on ? 'block' : 'none';
    document.querySelectorAll('iframe.demo-frame').forEach(state.on ? attach : detach);
    if (state.on) toast('标注开启：点元素即记录');
    else closePop();
  });
  /* 热重载/重置会换 iframe 文档：载入完成后若标注仍开着就重新挂上 */
  document.querySelectorAll('iframe.demo-frame').forEach((f) => {
    f.addEventListener('load', () => { if (state.on) attach(f); });
  });
  document.querySelector('#annoCopy').addEventListener('click', () => copyAll(false));
  document.querySelector('#annoClear').addEventListener('click', () => { state.items = []; render(); closePop(); });
  /* 面板里直接改「处理」：记下指令后静默更新剪贴板（防抖） */
  list.addEventListener('input', (e) => {
    const idx = e.target.getAttribute && e.target.getAttribute('data-idx');
    if (idx == null || !(idx in state.items)) return;
    state.items[Number(idx)].note = e.target.value;
    clearTimeout(noteTimer);
    noteTimer = setTimeout(() => copyAll(true), 600);
  });
  render();
})();

/* ==================== 自检（?selftest=1）：文献预览正文单份 + 视频嵌入在位（issue 275，经 iframe 真行为断言） ==================== */
(function () {
  if (!location.search.includes('selftest')) return;
  window.__st = { pass: 0, fail: [] };
  const t = (name, cond) => cond ? window.__st.pass++ : window.__st.fail.push(name);
  const res = document.createElement('div');
  res.id = 'stResult';
  res.style.cssText = 'position:fixed;left:16px;top:12px;z-index:999;font:12px/1.7 monospace;background:#fff;border:1px solid #d8d1c0;padding:6px 10px;color:#3d3a30;max-width:440px;word-break:break-all;';
  document.body.appendChild(res);
  // 轮询现取 contentDocument：iframe 加载前后 document 引用会替换——每次现查（同款 review 壳 waitFrame）
  const dtDoc = () => document.querySelector('#dtHost iframe').contentDocument;
  const wait = (get, what) => new Promise((ok, bad) => {
    const started = Date.now();
    const tries = () => {
      try {
        const v = get();
        if (v) return ok(v);
        if (Date.now() - started > 30000) return bad(new Error('超时：' + what));
        setTimeout(tries, 150);
      } catch (e) { setTimeout(tries, 150); }
    };
    tries();
  });
  (async () => {
    try {
      const MARK = '非药物治疗失眠的循证心理干预'; // CBTI 种子正文标记串
      const rows = await wait(() => {
        const list = dtDoc().querySelectorAll('.bz-kb-lexrow[data-kb-act=lit-peek]');
        return list.length >= 4 ? list : null; // 部壹 4 篇种子就位才放行
      }, '部壹文献列表');
      const cbti = Array.prototype.find.call(rows, (r) => r.textContent.indexOf('CBTI') >= 0);
      (cbti || rows[0]).click(); // 点开视频文献 → 文献预览弹层
      const body = await wait(() => dtDoc().querySelector('#bz-kb-preview-body'), '文献预览正文容器');
      await new Promise((r) => setTimeout(r, 500)); // 等异步 Markdown 渲染落定
      const text = body.textContent || '';
      const count = (s, needle) => s.split(needle).length - 1;
      t('文献列表就位', rows.length >= 4);
      t('文献预览打开', !!body);
      t('正文只出现一份（单源渲染，无预填第二份）', count(text, MARK) === 1);
      t('mp4 嵌入语法不再以字面残留（渲染器吃掉）', count(text, '![') === 0);
      t('视频嵌入在位（fake 渲染器 demo 片段映射）', !!body.querySelector('video[src*="demo.mp4"]'));
      // ---- ADR-0133 + issue 310：链接解析式录入（影像入口**直达录入界面**；未解析只出链接行，
      //      解析跑完才展开信息区/分P/范围/清晰度/保存；保存后落到处理队列） ----
      const ovl = dtDoc().querySelector('.bz-kb-ovl');
      if (ovl) ovl.click(); // 关预览弹层
      await wait(() => {
        const entry = dtDoc().querySelector('[data-kb-act=video-entry]');
        if (!entry) return null;
        entry.click();
        return entry;
      }, '影像录入入口');
      const urlInput = await wait(() => dtDoc().querySelector('#lit-add-url'), '录入 URL 输入框');
      const addPopup = dtDoc().querySelector('#knowledge-add-popup');
      t('影像入口直达录入界面（不经处理队列）', addPopup.style.display === 'flex' && dtDoc().querySelector('#knowledge-video-popup').style.display === 'none');
      t('录入界面与名词/段落同壳（词典皮标题栏 + 行内标签行）', !!addPopup.querySelector('.bz-lit-sheet-title') && !!addPopup.querySelector('.bz-lit-term-row .bz-lit-term-meta-k'));
      t('未解析：下半表单未展开（只见链接行）', dtDoc().querySelector('#lit-add-more').style.display === 'none');
      const saveBtn = dtDoc().querySelector('#lit-add-save');
      t('未解析：保存钮不可见（随下半表单收起）', !saveBtn || saveBtn.offsetParent === null || dtDoc().querySelector('#lit-add-more').style.display === 'none');
      urlInput.value = 'https://www.bilibili.com/video/BV1awbg6XELn/?spm_id_from=333.1391.0.0&vd_source=15205b8944be621a94fb0bf0efdb81f3';
      dtDoc().querySelector('#lit-add-resolve').click();
      const infoTitle = await wait(() => {
        const el = dtDoc().querySelector('#lit-add-ititle');
        return el && (el.textContent || '').indexOf('BV1awbg6XELn') >= 0 ? el : null;
      }, '信息区标题（解析回包）');
      t('URL 净化写回（追踪参数剥除）', urlInput.value === 'https://www.bilibili.com/video/BV1awbg6XELn/');
      t('解析完成 → 下半表单展开', dtDoc().querySelector('#lit-add-more').style.display !== 'none');
      t('信息区标题（view API 罐头）', (infoTitle.textContent || '').indexOf('BV1awbg6XELn') >= 0);
      t('信息区 UP主', (dtDoc().querySelector('#lit-add-iuploader').textContent || '') === '演示 UP 主');
      t('多 P 下拉就位（3 项）', dtDoc().querySelectorAll('#lit-add-page option').length === 3);
      t('双把手范围条就位', dtDoc().querySelectorAll('.bz-lit-rb-handle').length === 2);
      t('范围默认全选（0:00 ~ 12:00 = P1 时长）', dtDoc().querySelector('#lit-add-start').value === '0:00' && dtDoc().querySelector('#lit-add-end').value === '12:00');
      t('切 P2 → 量程随该 P 重置（0:00 ~ 10:00）', (() => {
        const sel = dtDoc().querySelector('#lit-add-page');
        sel.value = '2';
        sel.dispatchEvent(new Event('change', { bubbles: true }));
        return dtDoc().querySelector('#lit-add-end').value === '10:00';
      })());
      t('解析全程无 toast', !dtDoc().querySelector('.bz-notice'));
// ---- ADR-0134：b23.tv 短链 → 落地页 og:url 补出 bvid → 写回规范链接（下载器只认 BV 号） ----
      urlInput.value = 'https://b23.tv/AtDgBVH';
      urlInput.dispatchEvent(new Event('input', { bubbles: true })); // 改输入作废上一条解析结果
      dtDoc().querySelector('#lit-add-resolve').click();
      await wait(() => (urlInput.value === 'https://www.bilibili.com/video/BV1awbg6XELn/' ? urlInput : null), '短链写回规范链接');
      t('短链解析写回规范链接', urlInput.value === 'https://www.bilibili.com/video/BV1awbg6XELn/');
      t('短链解析信息区 UP主', (dtDoc().querySelector('#lit-add-iuploader').textContent || '') === '演示 UP 主');
      t('短链解析多 P 下拉就位（3 项）', dtDoc().querySelectorAll('#lit-add-page option').length === 3);
      // 保存 → 落到处理队列（种子 4 行 + 新增 1 行）
      dtDoc().querySelector('#lit-add-save').click();
      const cards = await wait(() => {
        const list = dtDoc().querySelectorAll('#knowledge-video-list .bz-kb-taskcard');
        return list.length >= 5 ? list : null;
      }, '保存后处理队列卡片');
      t('保存 → 落到处理队列（新任务进列）', cards.length >= 5);
      t('处理界面与主窗同款词典头（题字「影 像」）', (dtDoc().querySelector('#knowledge-video-popup .bz-kb-title')?.textContent || '').replace(/\s/g, '') === '影像');
      // issue 310：图标化（四个钮都是 lucide svg，正文无 emoji 字形）
      t('处理面板图标钮全为 lucide svg（新增/批量/历史/返回）', dtDoc().querySelectorAll('#knowledge-video-popup .bz-lit-head-btns button svg').length === 4);
      t('处理界面正文无 emoji 字形', !/[➕▶⏹⏳⌛⏱🕘📄]/.test(dtDoc().querySelector('#knowledge-video-popup').textContent || ''));
      // 2026-09-14 复核：头部左右分工（左列计数、右列图标组）+ 面板比主窗小一号（不完全遮挡）
      const vhead = dtDoc().querySelector('#knowledge-video-popup .bz-kb-head');
      t('处理面板头：左列计数 / 右列图标组', vhead.children[0].id === 'lit-video-counts' && vhead.children[vhead.children.length - 1].className === 'bz-lit-head-btns');
      const vRect = dtDoc().querySelector('#knowledge-video-popup').getBoundingClientRect();
      const mRect = dtDoc().querySelector('#knowledge-popup').getBoundingClientRect();
      t('处理面板比主窗小一号，主窗仍露在外面', vRect.width < mRect.width && vRect.height < mRect.height && vRect.left > mRect.left && vRect.top > mRect.top);
      // 录入界面不再放出口钮（issue 310 复核）
      dtDoc().querySelector('#lit-btn-video-add').click();
      await wait(() => (dtDoc().querySelector('#knowledge-add-popup').style.display === 'flex' ? true : null), '再次打开录入界面');
      t('录入界面标题栏无出口钮', !dtDoc().querySelector('#knowledge-add-popup .bz-lit-head-btns'));
      // 2026-09-14 复核：点「历史」在同一面板内切视图（不再另开弹窗）
      dtDoc().querySelector('#knowledge-add-mask').click();
      dtDoc().querySelector('#lit-btn-video-history').click();
      const groups = await wait(() => {
        const g = dtDoc().querySelectorAll('#knowledge-video-list .bz-kb-hgroup');
        return g.length >= 2 ? g : null;
      }, '历史分组');
      t('历史：同面板内打开（无独立历史窗）', !dtDoc().querySelector('#knowledge-history-popup') && dtDoc().querySelector('#knowledge-video-popup').style.display === 'flex');
      t('历史视图：题字「历 史」+ 计数「共 3 条」+ 归档分组（同链接一组）', (dtDoc().querySelector('#knowledge-video-popup .bz-kb-title')?.textContent || '').replace(/\s/g, '') === '历史' && (dtDoc().querySelector('#lit-video-counts')?.textContent || '').indexOf('共 3 条') >= 0 && groups.length === 2);
      t('历史视图：图标组只留返回箭头', dtDoc().querySelector('#lit-btn-video-add').style.display === 'none' && dtDoc().querySelector('#lit-btn-video-back').style.display !== 'none');
      dtDoc().querySelector('#lit-btn-video-back').click();
      const backCards = await wait(() => {
        const list = dtDoc().querySelectorAll('#knowledge-video-list .bz-kb-taskcard');
        return list.length >= 5 ? list : null;
      }, '返回处理队列（任务卡片回列表）');
      t('返回箭头 → 回到处理队列（题字复位 + 列表复原）', backCards.length >= 5 && (dtDoc().querySelector('#knowledge-video-popup .bz-kb-title')?.textContent || '').replace(/\s/g, '') === '影像');
      // ---- issue 312/313：图版（第四类录入；拖入 / 粘贴**多张**图 → AI 读图成文 → 图片与笔记一并落盘） ----
      dtDoc().querySelector('#knowledge-video-mask').click(); // 收起影像处理面板，回主窗
      const entryBtns = dtDoc().querySelectorAll('.bz-kb-entrybtn');
      t('部壹入口四枚，图版排在影像之前（2026-09-14 复核改序）', entryBtns.length === 4 && (entryBtns[2].textContent || '').trim() === '图版' && (entryBtns[3].textContent || '').trim() === '影像');
      entryBtns[2].click();
      await wait(() => (dtDoc().querySelector('#knowledge-term-popup').style.display === 'flex' ? true : null), '图版录入面板');
      const tPopup = dtDoc().querySelector('#knowledge-term-popup');
      t('图版面板：同壳第三态（data-lit-entry=image + 题字「图版」）', tPopup.getAttribute('data-lit-entry') === 'image' && tPopup.querySelector('#lit-entry-title').textContent === '图版');
      t('图版面板：拖入区就位，来源行与名词/段落同构', !!tPopup.querySelector('#lit-image-drop') && !!tPopup.querySelector('#lit-term-src'));
      tPopup.querySelector('#lit-term-generate').click(); // 没图就点生成 → 应被拒
      // 注意：通知会堆叠且先前步骤的 toast 可能仍在（querySelector 取到的是最旧那条）→ 全量扫
      const notices = Array.prototype.map.call(dtDoc().querySelectorAll('.bz-notice'), (n) => n.textContent || '');
      t('未放图点生成 → 提示「请先拖入或粘贴图片」', notices.some((s) => s.indexOf('请先拖入或粘贴图片') >= 0));
      // 多图（issue 313）：一次 drop 两张（壳专用画布图，走**真实 drop 事件**，与手动拖入同一条路径）
      await dtDoc().defaultView.BZW_knowledge.loadDemoPlate(2);
      const thumbs = await wait(() => {
        const list = tPopup.querySelectorAll('#lit-image-grid .bz-lit-drop-item img');
        return list.length === 2 && (list[0].getAttribute('src') || '').indexOf('data:image/png') === 0 ? list : null;
      }, '两张示例图进面板（缩略图网格就位）');
      t('多图：两张示例图经一次 drop 进面板（网格两张 + hint 报数）', thumbs.length === 2 && (tPopup.querySelector('#lit-image-hint')?.textContent || '').indexOf('已放 2 张') >= 0);
      t('多图：每张缩略图带一个 ✕ 移除钮', tPopup.querySelectorAll('#lit-image-grid .bz-lit-drop-item [data-lit-image-remove]').length === 2);
      // 删掉第 1 张 → 只剩 1 张；再补一张 → 回到 2 张（增删都作废草稿，重跑读图）
      tPopup.querySelector('[data-lit-image-remove="0"]').click();
      await new Promise((r) => setTimeout(r, 200));
      t('多图：点 ✕ 删掉一张后只剩 1 张', tPopup.querySelectorAll('#lit-image-grid .bz-lit-drop-item img').length === 1);
      await dtDoc().defaultView.BZW_knowledge.loadDemoPlate(1);
      await wait(() => {
        const list = tPopup.querySelectorAll('#lit-image-grid .bz-lit-drop-item img');
        return list.length === 2 ? list : null;
      }, '再补一张回到两张');
      tPopup.querySelector('#lit-term-generate').click();
      const imgTitle = await wait(() => {
        const el = tPopup.querySelector('#lit-entry-meta-title');
        return el && (el.value || '').indexOf('演示图题') >= 0 ? el : null;
      }, '读图结果（自动图题）');
      t('读图出自动图题（属性首行可改）', (imgTitle.value || '').indexOf('（演示图题）') === 0);
      // 罐头回包里带着「实际收到的图片数量」→ 证明图片确实经多模态走到了 AI 层
      t('多图确实发到 AI 层（回包报出收到 2 张）', (tPopup.querySelector('#lit-term-content')?.textContent || '').indexOf('已收到图片（2 张') >= 0);
      const relDone = await wait(() => {
        const el = tPopup.querySelector('#lit-term-meta-rel');
        const txt = (el?.textContent || '').trim();
        return txt && txt.indexOf('分析中') < 0 && txt !== '—' ? el : null;
      }, '图版关联行完成');
      t('图版关联行：生成即起跑 → 完成后就地显示卡名', !!relDone);
      tPopup.querySelector('#lit-term-save').click();
      const imgRow = await wait(() => {
        const rows = dtDoc().querySelectorAll('.bz-kb-lexrow');
        const hit = Array.prototype.find.call(rows, (r) => (r.querySelector('.bz-kb-pos')?.textContent || '').indexOf('图') >= 0);
        return hit || null;
      }, '图版笔记进部壹列表');
      t('确认写入 → 关窗 + 图版笔记进列表（类型标签「图 版」）', tPopup.style.display === 'none' && !!imgRow);
      imgRow.click();
      const pvBody = await wait(() => dtDoc().querySelector('#bz-kb-preview-body'), '图版预览正文');
      await new Promise((r) => setTimeout(r, 400)); // 等异步 Markdown 渲染落定
      t('图版笔记正文：两张图片嵌入都渲染成真 <img>（图片本体已落盘可预览）', pvBody.querySelectorAll('img.bz-kb-embed-img').length === 2);
      t('图版笔记正文顺序：文字在上、图片在下（issue 313）', pvBody.innerHTML.indexOf('演示读图') >= 0 && pvBody.innerHTML.indexOf('演示读图') < pvBody.innerHTML.indexOf('bz-kb-embed-img'));
    } catch (e) {
      t('自检流程异常：' + ((e && e.message) || e), false);
    }
    res.textContent = 'PASS ' + window.__st.pass + ' / FAIL ' + window.__st.fail.length + (window.__st.fail.length ? ' → ' + window.__st.fail.join('; ') : '');
    // title 回写（对齐其余域惯例：scripts/_selftest-cdp.mjs 轮询 document.title 取结果）
    document.title = window.__st.fail.length
      ? 'SELFTEST FAIL ' + window.__st.fail.join(',')
      : `SELFTEST OK ${window.__st.pass}/${window.__st.pass + window.__st.fail.length}`;
  })();
})();
</script>
</body>
</html>
