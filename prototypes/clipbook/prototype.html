<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>剪藏本 · 原型预览（真行为单源）</title>
<!--
  ┌────────────────────────────────────────────────────────────────────────┐
  │ 本文件 = 剪藏本域 UI 的评审壳（行为单源版，issue 247/ADR-0106，           │
  │ 范式随 belongings/cinema 试点）。                                        │
  │ 组件样式零内联，全部来自（与 build-css SOURCES 同序）：                    │
  │   ../core/styles.css → ../core/ui/tokens.css → ../core/ui/components.css │
  │   → ./styles.css                                                        │
  │ markup 单源（ADR-0104）：面板骨架/rail/目录/阅读面/移动端 HTML 出自        │
  │   ./render.ts（构建产物 prototype-render.js 在 git，但壳不自绘渲染——       │
  │   两侧 markup 均由真 ui.ts 消费同一份）。                                  │
  │ 行为单源（issue 247/ADR-0106）：交互逻辑全部是插件同款 ui.ts 依赖链——      │
  │   经 ./prototype-behavior.js（src/clipbook/fake-sim.ts 构建，              │
  │   alias obsidian→公共假层）在下方两个 iframe 视图里跑真行为；               │
  │   桌面 iframe 1200px 宽视口 = 桌面 1180×760 本体；移动 iframe 412×915 =     │
  │   styles.css 移动双屏态。数据 = localStorage fake vault（真实库同构快照：   │
  │   news.json / clipbook.json / 归档/网页剪藏/*.md；跨 iframe storage 桥     │
  │   共享数据源，obsidian-adapter 桥驱动 clipping:file-* 自动刷新同插件链）。  │
  │ 壳内只允许：外景容器样式、评审徽牌、演示钩子与自检。                        │
  └────────────────────────────────────────────────────────────────────────┘
-->
<link rel="stylesheet" href="../../src/core/styles.css">
<link rel="stylesheet" href="../../src/core/ui/tokens.css">
<link rel="stylesheet" href="../../src/core/ui/components.css">
<link rel="stylesheet" href="../../src/clipbook/styles.css">
<!-- 数据/图标必须在 head 内就绪：iframe 随 body 解析即启动，若数据脚本放 body 尾，
     iframe boot 时 window.CLIP_DATA 还是 undefined，种子静默空跑（评审壳时序坑） -->
<script src="./prototype-icons.js"></script>
<script src="./prototype-data.js"></script>
<link rel="stylesheet" href="../mob-1to1.css">
<script src="../mob-1to1.js"></script>
<style>
  /* ===== 以下全部是演示壳，禁止放组件样式 ===== */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; gap: 28px; padding: 32px 24px;
    background: #e3e0d8; font-family: system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif; }
  /* 模拟 Obsidian 宿主变量（core/styles.css 的弹层/通知取值用；插件内由主题提供） */
  body {
    --background-primary: #fbf9f3; --text-normal: #171512; --text-muted: #8b8474; --text-faint: #b3ab99;
    --text-error: #b3564d; --background-modifier-hover: rgba(23,21,18,.06); --color-green: #3d8f5d;
  }
  * { scrollbar-width: none; } *::-webkit-scrollbar { display: none; }

  /* 桌面外景（真行为 iframe：面板 append iframe body，本体 1180×760 来自 styles.css） */
  .demo-dt { flex: none; width: 1210px; height: 800px; }
  /* 移动外景：412×915 iframe → 双屏态铺满即手机框尺寸 */
  .demo-mob { width: 412px; height: 915px; border-radius: 26px; overflow: hidden; flex: none;
    border: 1px solid #d8d1c0; box-shadow: 0 8px 30px rgba(0,0,0,.14); background: #f5f2ec; }
  .demo-frame { width: 100%; height: 100%; border: 0; display: block; }

  /* 评审徽牌（演示壳自用） */
  .vbadge { position: fixed; right: 16px; bottom: 12px; font-size: 11px; color: #9a917d; display: flex; gap: 10px; align-items: center;
    background: rgba(255,255,255,.9); border: 1px solid #d8d1c0; padding: 3px 8px; z-index: 900; }
  .vbadge button { border: none; background: none; color: #b3564d; font: 11px 'Microsoft YaHei'; cursor: pointer; }
  .vbadge .ok { color: #3d8f5d; }
  .vbadge .bad { color: #b3564d; }
</style>
</head>
<body class="theme-light"> <!-- 模拟 Obsidian 宿主：色彩 token 挂 theme-light/dark，壳内必须补一类才不透明 -->
  <div id="dtHost" class="demo-dt"><iframe class="demo-frame" src="./prototype-view.html" title="剪藏本·桌面"></iframe></div>
  <div id="mobHost" class="demo-mob-wrap"><div class="demo-mob"><iframe class="demo-frame" src="./prototype-view.html?mob=1" title="剪藏本·移动"></iframe></div></div>

  <div class="vbadge">剪藏本 · 真行为单源预览（桌面=真 ui.ts 跑在 1200px，移动=412×915）· 真实库快照 63 未读
    <button id="mobToggle">隐藏移动端</button>
    <button id="themeToggle">切到暗色</button>
    <button id="reset">重置演示数据</button>
    <span id="stResult"></span>
  </div>

<script>
(function () {
  /* ==================== 壳基座（仅外景）：两个真行为 iframe ====================
   * 行为全部在 iframe 内跑真 ui.ts（prototype-behavior.js）；本页只做：
   *  - 种子：iframe 内 fake-sim 首启自查 SEED_MARK 写入（本页持有 CLIP_DATA 供父页读取）
   *  - 重置演示数据（清 bz-sim:* 后重载 iframe）
   *  - 自检（?selftest=1）：经 iframe contentWindow 访问真 DOM
   */
  const dtFrame = () => document.querySelector('#dtHost iframe');
  const mobFrame = () => document.querySelector('#mobHost iframe');
  const dtDoc = () => dtFrame().contentDocument;
  const mobDoc = () => mobFrame().contentDocument;
  // 轮询现取 contentDocument：iframe 加载前后 document 引用会替换（about:blank → 真实文档），
  // 不能缓存旧引用等面板——每次现查，跨文档访问本身同源安全。
  const waitFrame = (getDoc, sel) => new Promise((res, rej) => {
    const started = Date.now();
    const tries = () => {
      try {
        const doc = getDoc();
        if (doc && doc.querySelector(sel)) return res(doc);
        if (Date.now() - started > 25000) return rej(new Error('iframe 面板超时'));
        setTimeout(tries, 150);
      } catch (e) { setTimeout(tries, 150); }
    };
    tries();
  });

  document.querySelector('#mobToggle').addEventListener('click', () => {
    const m = document.querySelector('#mobHost');
    const hidden = m.style.display === 'none';
    m.style.display = hidden ? '' : 'none';
    document.querySelector('#mobToggle').textContent = hidden ? '隐藏移动端' : '显示移动端';
  });

  /* 明暗切换（2026-09-10 剪藏本加暗色）：宿主 body 与两个 iframe body 同步换 theme-dark/light */
  const applyTheme = () => {
    const dark = document.documentElement.classList.contains('theme-dark');
    document.body.className = dark ? 'theme-dark' : 'theme-light';
    for (const f of [dtFrame(), mobFrame()]) {
      try { const d = f && f.contentDocument; if (d && d.body) d.body.className = dark ? 'theme-dark' : 'theme-light'; } catch { /* 未加载跳过 */ }
    }
    document.querySelector('#themeToggle').textContent = dark ? '切回浅色' : '切到暗色';
    applyThemeStyle(dark);
  };
  const applyThemeStyle = (dark) => {
    const s = document.querySelector('#darkExtras');
    if (s) s.disabled = !dark;
  };
  document.querySelector('#themeToggle').addEventListener('click', () => {
    document.documentElement.classList.toggle('theme-dark');
    applyTheme();
  });
  // iframe 首载晚于壳脚本：加载完成后补一次主题（切入暗色后重置 iframe 也不会掉回浅色）
  for (const id of ['#dtHost iframe', '#mobHost iframe']) {
    const f = document.querySelector(id);
    if (f) f.addEventListener('load', () => { try { applyTheme(); } catch { /* noop */ } });
  }

  document.querySelector('#reset').addEventListener('click', () => {
    const kill = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && (k.startsWith('bz-sim:') || k.startsWith('bz-clip-c5-shared'))) kill.push(k);
    }
    kill.forEach((k) => localStorage.removeItem(k));
    location.reload();
  });

  /* ==================== 自检（?selftest=1）：真行为 DOM 断言（经 iframe） ==================== */
  if (location.search.includes('selftest')) {
    window.__st = { pass: 0, fail: [] };
    const t = (name, cond) => cond ? window.__st.pass++ : window.__st.fail.push(name);
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    (async () => {
      const res = document.querySelector('#stResult');
      try {
        // 自检判脏 = 「运行标记」：标记在场说明上一轮跑过（已读残留会缩小未读池），
        // 清 bz-sim:* 后带 reset=1 重载一次；标记不在场（headless 全新 profile / 首轮）直接跑。
        // 不能以「news.json 是否在库」判脏——种子由 iframe boot 异步完成，壳脚本先执行，
        // 以数据在库判脏会让首载永远判脏 → 重置 → 重载死循环（iframe 永远停在 about:blank）。
        const MARK = 'bz-sim:__clipbook-selftest-ran';
        if (localStorage.getItem(MARK) && !location.search.includes('reset=1')) {
          const kill = [];
          for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (k && k.startsWith('bz-sim:')) kill.push(k);
          }
          kill.forEach((k) => localStorage.removeItem(k));
          location.search = '?selftest=1&reset=1';
          return;
        }
        localStorage.setItem(MARK, '1');
        const NEWS_LS = 'bz-sim:CONFIG/STORAGE/news.json';
        const db = () => JSON.parse(localStorage.getItem(NEWS_LS)).articles;
        const dd = await waitFrame(dtDoc, '.bz-clip-frame');
        const md = await waitFrame(mobDoc, '.bz-clip-frame');
        res.textContent = '…';
        const dt = (sel) => dd.querySelector(sel);
        const mob = (sel) => md.querySelector(sel);

        // —— 0. CSS 生效断言（评审壳链路 ../../ 404 曾全绿假象——样式必须真加载）：
        // 桌面 frame 底色 = 编辑部纸白 #faf8f3（域变量 --clip-paper）
        const frameEl = dt('.bz-clip-frame');
        const bg = getComputedStyle(frameEl).backgroundColor;
        t('桌面 frame 纸白底（CSS 链生效）', bg === 'rgb(250, 248, 243)');
        t('移动 desk 隐藏（媒体查询生效）', getComputedStyle(md.querySelector('.bz-clip-desk')).display === 'none');

        // —— 1. 面板骨架（桌面三栏 + 头行期号）
        t('桌面面板开', !!dt('.bz-clip-desk'));
        t('头行刊名=剪藏本', dt('.bz-panel-title')?.textContent === '剪藏本');
        t('期号行=第 N 期', /第 \d+ 期/.test(dt('[data-clip-issue]')?.textContent || ''));
        t('三栏骨架在场', !!dt('[data-clip-rail]') && !!dt('[data-clip-list]') && !!dt('[data-clip-reader]'));
        t('头行无设置/关闭钮（issue 214）', !dt('[data-clip-settings]') && !dt('[data-clip-desk-close]'));

        // —— 2. rail 点线索引：全部未读 + 站点行 + B站 UP 行 + 剪藏本行 + 今日已读脚注
        const railRows = [...dd.querySelectorAll('[data-clip-rail] .bz-rail-item')];
        t('rail 行≥4', railRows.length >= 4);
        t('rail 全部未读行', railRows[0]?.textContent.includes('全部未读'));
        t('rail 站点行（果壳科学人）', railRows.some((r) => r.textContent.includes('果壳科学人')));
        t('rail 剪藏本行', railRows.some((r) => r.textContent.includes('剪藏本')));
        t('rail 脚注今日已读', /今日已读/.test(dt('[data-clip-rail-foot]')?.textContent || ''));
        // 选中态计数可读（2026-09-10 修复）：点站点行后「未读/总数」不应继承白字
        const siteRow = railRows.find((r) => r.textContent.includes('果壳科学人'));
        siteRow.classList.add('on');
        const probed = getComputedStyle(siteRow.querySelector('.bz-rail-count')).color;
        siteRow.className = siteRow.className.replace(' on', '');
        t('rail 选中态计数非白字', probed !== 'rgb(255, 255, 255)' && probed !== 'rgba(255, 255, 255, 1)');

        // —— 3. 中栏目录：序号制 + 未读在前（首条带未读类）+ 点击阅读联动
        const items = () => [...dd.querySelectorAll('[data-clip-list] .bz-clip-item')];
        t('目录条目非空', items().length > 0);
        t('首条未读类', items()[0]?.classList.contains('bz-clip-item--unread'));
        t('首条序号 01', items()[0]?.querySelector('.bz-clip-no')?.textContent === '01');
        // 2026-09-10 改版：目录标题不截断（无 -webkit-line-clamp）
        const tClamp = getComputedStyle(items()[0].querySelector('.bz-clip-item-t')).getPropertyValue('-webkit-line-clamp');
        t('目录标题不截断', !tClamp || tClamp === 'none');
        const firstTitle = items()[0]?.querySelector('.bz-clip-item-t')?.textContent || '';
        items()[0].click();
        await sleep(150);
        t('点击后阅读面标题联动', dt('[data-clip-reader] .bz-clip-art-title')?.textContent === firstTitle);
        // ADR-0108：桌面打开即已读——首条原位灰显（重渲后列表仍含该条）
        t('打开即已读：首条灰显在原位', items().some((i) => i.classList.contains('bz-clip-item--read')));

        // —— 4. 右键菜单（编辑部皮肤：变量挂菜单根，白底墨边须真渲染）
        // 打开即已读后 items()[0] 已 read，右键目标取仍未读的 items()[1]（标读计数断言不受污染）
        const ctxCard = items().find((i) => !i.classList.contains('bz-clip-item--read')) || items()[0];
        ctxCard.dispatchEvent(new MouseEvent('contextmenu', { clientX: 300, clientY: 300, bubbles: true, cancelable: true }));
        await sleep(150);
        const menu = dd.querySelector('.bz-item-menu.bz-clip-menu-editorial');
        t('右键菜单开（编辑部类）', !!menu);
        if (menu) {
          const mbg = getComputedStyle(menu).backgroundColor;
          t('菜单纸白底（皮肤变量生效）', mbg === 'rgb(250, 248, 243)');
          t('菜单含保存/已读/删除', menu.textContent.includes('保存到剪藏本') && menu.textContent.includes('标记为已读') && menu.textContent.includes('删除'));
        }
        // 菜单点「标记为已读」（右键浮层 capture 层需完整鼠标序列）
        const clickReal = (el) => {
          if (!el) return;
          const r = el.getBoundingClientRect();
          const mk = (type) => new MouseEvent(type, { clientX: r.left + 10, clientY: r.top + 10, bubbles: true, cancelable: true });
          el.dispatchEvent(mk('mousedown'));
          el.dispatchEvent(mk('mouseup'));
          el.dispatchEvent(mk('click'));
        };
        const readBtn = menu && [...menu.querySelectorAll('.bz-item-menu-item')].find((b) => b.textContent.includes('标记为已读'));
        const readBefore = db().filter((a) => a.read).length;
        clickReal(readBtn);
        await sleep(350);
        t('标为已读落盘', db().filter((a) => a.read).length === readBefore + 1);
        t('撤销通知在场', !!dd.querySelector('.bz-notice'));
        t('菜单已关', !dd.querySelector('.bz-item-menu'));
        // ADR-0108：显式标读后会话内原位保留（灰显 read 类仍在目录）——重开面板才沉段
        t('标读后目录原位保留（灰显 read 类）', items().some((i) => i.classList.contains('bz-clip-item--read')));

        // —— 5. 搜索（180ms 防抖后过滤；条目数变少且全部命中关键词）
        const searchInput = dt('[data-clip-desk-search]');
        const kw = firstTitle.slice(0, 4);
        searchInput.value = kw;
        searchInput.dispatchEvent(new Event('input', { bubbles: true }));
        await sleep(420);
        const searched = items();
        t('搜索过滤生效', searched.length > 0 && searched.length < 63 && searched.every((i) => (i.querySelector('.bz-clip-item-t')?.textContent || '').includes(kw)));
        searchInput.value = '';
        searchInput.dispatchEvent(new Event('input', { bubbles: true }));
        await sleep(420);

        // —— 6. 移动章目录（m3/m3+ADR-0108）：章 = site + 已读/已收双折叠行
        t('移动面板开（mob 双屏）', !!mob('.bz-clip-mob'));
        const mobItems = () => [...md.querySelectorAll('[data-clip-mob-list] .bz-clip-mob-item')];
        t('移动章目录非空（章头在场）', md.querySelectorAll('[data-clip-mob-list] .bz-clip-mob-ch').length > 0);
        t('移动列表条目非空', mobItems().length > 0);
        mobItems()[0].click();
        await sleep(150);
        t('移动详情屏2开', md.querySelector('[data-clip-mob-detail]')?.style.display !== 'none' && !!mob('[data-clip-mob-detail-body] .bz-clip-mob-d-title'));
        mob('[data-clip-mob-back]').click();
        await sleep(120);
        t('移动返回列表', md.querySelector('[data-clip-mob-detail]')?.style.display === 'none');

        document.title = window.__st.fail.length
          ? 'SELFTEST FAIL ' + window.__st.fail.join(',')
          : `SELFTEST OK ${window.__st.pass}/${window.__st.pass + window.__st.fail.length}`;
        res.textContent = window.__st.fail.length ? '自检失败' : `自检通过 ${window.__st.pass}`;
        res.className = window.__st.fail.length ? 'bad' : 'ok';
      } catch (err) {
        document.title = 'SELFTEST ERR ' + (err && err.message || err);
        res.textContent = '自检异常';
        res.className = 'bad';
      }
    })();
  }
})();
</script>
</body>
</html>
