<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>内容首页 · 原型预览（真行为单源）</title>
<!--
  ┌────────────────────────────────────────────────────────────────────────┐
  │ 本文件 = 内容首页域 UI 的评审壳（行为单源版，issue 245/ADR-0106）。        │
  │ 组件样式零内联，全部来自（与 build-css SOURCES 同序）：                    │
  │   ../core/styles.css → ../core/ui/tokens.css → ../core/ui/components.css │
  │   → ./styles.css                                                        │
  │ markup 单源（ADR-0104）：面板骨架/周历/入口行/河卡/预告卡 HTML 出自        │
  │   src/home/render.ts（与插件 ui.ts 消费同一份）。                          │
  │ 行为单源（issue 245/ADR-0106）：交互逻辑全部是插件同款 ui.ts 依赖链——       │
  │   经 ./prototype-behavior.js（src/home/fake-sim.ts 构建，                 │
  │   alias obsidian→公共假层）在下方两个 iframe 视图里跑真行为；               │
  │   桌面 iframe 920px = 桌面三栏；移动 iframe 412×915 = 小米13U 真机整屏     │
  │   （1440×3200 @dpr3.5），按实测基准（412 CSS px = 118mm）缩放到实物大小：  │
  │   412 CSS px → 屏幕宽 70.2mm · 高 155.9mm。尺寸固定，无任何调节 UI        │
  │   @media/@container ≤768 移动布局。数据 = fake vault（localStorage 种子，  │
  │   相对「今天」生成、跨天自动重灌，见 fake-sim.ts）。                        │
  │ 壳内只允许：外景容器样式、评审徽牌、演示钩子与自检。                        │
  └────────────────────────────────────────────────────────────────────────┘
-->
<link rel="stylesheet" href="../../src/core/styles.css">
<link rel="stylesheet" href="../../src/core/ui/tokens.css">
<link rel="stylesheet" href="../../src/core/ui/components.css">
<link rel="stylesheet" href="../../src/home/styles.css">
<style>
  /* ===== 以下全部是演示壳，禁止放组件样式 ===== */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; gap: 28px; padding: 32px 24px;
    background: #dcd8cd; font-family: system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif; }
  * { scrollbar-width: none; } *::-webkit-scrollbar { display: none; }

  /* 桌面外景（真行为 iframe：overlay append iframe body，宽度决定布局） */
  .demo-dt { flex: none; width: 920px; height: 640px; }
  /* 移动外景 = 小米13U 真机尺寸，**固定**（无任何调节 UI）：
   *   412 × 915 CSS px（= 1440 × 3200 物理 px ÷ dpr 3.5 = 整屏；412 仍 ≤768 → 移动布局命中）
   *   屏幕上用 scale 缩到实物大小：屏幕实测 70.2 × 156.0mm，比例自洽 412:915 = 70.2:155.9 ✓
   *   本机尺量 412 CSS px = 118mm（非理论 109mm，系统缩放/PPI 所致）→ scale = 70.2/118 ≈ 0.5949
   *   ⚠️ 基准是「屏幕」而非「整机」（整机 74.64×163.18mm 含约 2.2mm 边框，按边框对会偏 6%）
   *   transform: scale 只缩视觉，绝不改 iframe 尺寸（改了就动到 @media ≤768 判据） */
  .demo-mob-wrap { flex: none; width: calc(412px * var(--mob-scale, 1)); height: calc(915px * var(--mob-scale, 1)); }
  .demo-mob { width: 412px; height: 915px; border-radius: 26px; overflow: hidden; flex: none;
    transform: scale(var(--mob-scale, 1)); transform-origin: top left;
    border: 1px solid #b8b0a0; box-shadow: 0 8px 30px rgba(0,0,0,.16); background: #f5f2ec; }
  .demo-frame { width: 100%; height: 100%; border: 0; display: block; }

  /* 评审徽牌（演示壳自用） */
  .vbadge { position: fixed; right: 16px; bottom: 12px; font-size: 11px; color: #8b8474; display: flex; gap: 10px; align-items: center;
    background: rgba(255,255,255,.92); border: 1px solid #c9c2b2; padding: 3px 8px; z-index: 900; }
  .vbadge button { border: none; background: none; color: #b3564d; font: 11px 'Microsoft YaHei'; cursor: pointer; }
  .vbadge .ok { color: #3d8f5d; }
  .vbadge .bad { color: #b3564d; }
</style>
</head>
<body class="theme-light"> <!-- 模拟 Obsidian 宿主：色彩 token 挂 theme-light/dark，壳内必须补一类才不透明 -->
  <div id="dtHost" class="demo-dt"><iframe class="demo-frame" src="./prototype-view.html" title="内容首页·桌面"></iframe></div>

  <div id="mobHost" class="demo-mob-wrap"><div class="demo-mob"><iframe class="demo-frame" src="./prototype-view.html?mob=1" title="内容首页·移动"></iframe></div></div>

  <div class="vbadge">内容首页 · 真行为单源预览（桌面=真 ui.ts 跑在 920px，移动=412 宽 · 小米13U）
    <button id="mobToggle">隐藏移动端</button>
    <button id="reset">重置演示数据</button>
    <span id="stResult"></span>
  </div>

<script src="./prototype-icons.js"></script>
<script src="./prototype-behavior.js"></script>
<script>
(function () {
  /* ==================== 壳基座（仅外景）：两个真行为 iframe ====================
   * 行为全部在 iframe 内跑真 ui.ts（prototype-behavior.js）；本页只做：
   *  - 种子启动（bootHomeSim 首启写 fake vault 种子，见 fake-sim seedDatabase）
   *  - 重置演示数据（resetHomeSim 清 bz-sim:* 后重载）
   *  - 自检（?selftest=1）：经 iframe contentWindow/contentDocument 访问真 DOM
   */
  const B = window.BZW_home;
  B.bootHomeSim(); // 父页先灌种子：双 iframe 加载时命中「已种子」分支，单写者无竞态

  const dtFrame = () => document.querySelector('#dtHost iframe');
  const mobFrame = () => document.querySelector('#mobHost iframe');
  const dtDoc = () => dtFrame().contentDocument;
  const mobDoc = () => mobFrame().contentDocument;
  // 轮询现取 contentDocument：iframe 加载前后 document 引用会替换（about:blank → 真实文档），
  // 不能缓存旧引用等面板——每次现查，跨文档访问本身同源安全。
  const waitFrame = (getDoc, sel) => new Promise((res, rej) => {
    const started = Date.now();
    const tries = () => {
      // 超时守卫放 try 之外：getDoc() 抛错被 catch 吞掉时会绕过内部守卫 → 无限重试（曾因此卡死自检）
      if (Date.now() - started > 30000) return rej(new Error('iframe 面板超时'));
      try {
        const doc = getDoc();
        // 等 [data-home-entries]：活动河采集完成后才有（骨架期无入口行）
        if (doc && doc.querySelector(sel)) return res(doc);
        setTimeout(tries, 150);
      } catch (e) { setTimeout(tries, 150); }
    };
    tries();
  });

  document.querySelector('#mobToggle').addEventListener('click', () => {
    const m = document.querySelector('#mobHost');
    const hidden = m.style.display === 'none';
    m.style.display = hidden ? '' : 'none';
    document.querySelector('#mobToggle').textContent = hidden ? '隐藏移动端' : '显示移动端';
  });

  /* ==================== 移动外景 1:1 真机（物理尺寸对齐小米13U） ====================
   * 目标：框在屏幕上的「毫米数」= 真机尺寸，而不是 CSS 像素数相等。
   *   小米13U 屏幕实测 70.2 × 156.0mm（与 6.73" 20:9 理论值 70.15×155.88 吻合）；
   *   412 CSS px = 1440 物理 px = 整屏宽；满屏高 915 CSS px = 156.0mm。
   * 换算锚点 = 本机用尺子量「412 CSS px 基准线」的实测值 RULER_MM = 118mm：
   *   1 CSS px = 118/412 ≈ 0.2864mm → scale = 70.2/118 ≈ 0.5949 时框宽恰为 70.2mm。
   * 尺寸**固定**、无任何调节 UI；换显示器若偏差明显，只改 RULER_MM 一个常量。
   */
  const RULER_MM = 118;                 // 实测：412 CSS px 在本机屏幕上的物理宽度（mm）
  const MOB_MM = 70.2;                  // 小米13U 屏幕宽（mm，实测；非整机 74.64）
  // 固定 scale：把 412 CSS px 渲染成 70.2mm（≈ 0.5949），全程一次设定
  document.documentElement.style.setProperty('--mob-scale', String(MOB_MM / RULER_MM));

  document.querySelector('#reset').addEventListener('click', () => {
    B.resetHomeSim();
    location.reload();
  });

  /* ==================== 自检（?selftest=1）：真行为 DOM 断言（经 iframe） ==================== */
  if (location.search.includes('selftest')) {
    window.__st = { pass: 0, fail: [], last: '' };
    // last = 最近一条断言名：自检卡死时靠它定位「跑到了哪一条」（ERR/超时排查用）
    const t = (name, cond) => { window.__st.last = name; cond ? window.__st.pass++ : window.__st.fail.push(name); };
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    (async () => {
      const res = document.querySelector('#stResult');
      try {
        // 数据基线检查：种子标记应是今天。若缺失/过期（上次运行残留）则重灌并重载一次。
        // headless 验收每次全新 profile 天然干净；浏览器手动隔天重复跑 selftest 也能自清理。
        let mark = null;
        try { mark = JSON.parse(localStorage.getItem('bz-sim:__home_seed') || 'null'); } catch { mark = null; }
        const today = (() => { const d = new Date(); const p = (n) => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; })();
        if (!mark || mark.seededOn !== today || mark.rev !== 6) {
          if (!location.search.includes('reset=1')) {
            B.resetHomeSim();
            location.search = '?selftest=1&reset=1';
            return;
          }
        }
        const dd = await waitFrame(dtDoc, '.bz-home-entries .bz-home-erow');
        const md = await waitFrame(mobDoc, '.bz-home-entries .bz-home-erow, .bz-home-m-tile');
        res.textContent = '…';
        const dt = (sel) => dd.querySelector(sel);
        const mob = (sel) => md.querySelector(sel);
        const dtRows = () => dd.querySelectorAll('.bz-home-erow');
        const dtEvs = () => dd.querySelectorAll('.bz-home-timeline .bz-home-ev');

        // CSS 生效（壳四链防 404 再犯）：core+域样式表已加载且规则非空；域样式真命中（入口行 flex 来自 ./styles.css）
        const rules = [...dd.styleSheets].reduce((n, s) => { try { return n + s.cssRules.length; } catch { return n; } }, 0);
        t('CSS 生效：样式表规则非空', rules > 50);
        t('CSS 生效：域样式命中（入口行 flex）', dd.querySelector('.bz-home-erow') && getComputedStyle(dd.querySelector('.bz-home-erow')).display === 'flex');

        t('桌面面板开', !!dt('.bz-home-panel'));
        t('移动面板开', !!mob('.bz-home-panel'));
        t('入口行13域（home.json 的 hiddenDesk 藏了密码本）', dtRows().length === 13);
        t('首页按 home.json 顺序（首行=书库）', dtRows()[0].dataset.homeGo === 'bookshelf');
        t('桌面隐藏域不在入口列', ![...dtRows()].some((r) => r.dataset.homeGo === 'vault'));
        t('备忘录行计数=2条待办', [...dtRows()].find((r) => r.dataset.homeGo === 'memo').querySelector('.bz-home-ect').textContent === '2 条待办');
        t('复习行计数=9张逾期1', [...dtRows()].find((r) => r.dataset.homeGo === 'review').querySelector('.bz-home-ect').textContent === '9 张 · 逾期 1');
        t('日记行计数=518篇', [...dtRows()].find((r) => r.dataset.homeGo === 'diary').querySelector('.bz-home-ect').textContent === '518 篇');
        t('书库行计数=在读9读完4', [...dtRows()].find((r) => r.dataset.homeGo === 'bookshelf').querySelector('.bz-home-ect').textContent === '在读 9 · 读完 4');
        t('剪藏行计数=未读12', [...dtRows()].find((r) => r.dataset.homeGo === 'clipping').querySelector('.bz-home-ect').textContent === '未读 12 篇');
        t('归物行计数=登记12件', [...dtRows()].find((r) => r.dataset.homeGo === 'belongings').querySelector('.bz-home-ect').textContent === '登记 12 件');
        t('时间线9条痕迹', dtEvs().length === 9);
        t('规则点评2条', dd.querySelectorAll('.bz-home-ev-note').length === 2);
        t('首条点评=比昨天早了78分钟（今日首动07:42 vs 昨日首动09:00）', dt('.bz-home-ev-note').textContent.indexOf('早了 78 分钟') >= 0);
        t('末条挂连击提醒+warn行', [...dtEvs()].pop().className.indexOf('bz-home-ev--warn') >= 0);
        t('预告3卡', dd.querySelectorAll('.bz-home-pr').length === 3);
        t('预告首卡=逾期卡', dt('.bz-home-pr-h').textContent === '还有 1 张逾期卡');
        t('彩点 warn/hot/ok 各在其位', dt('.bz-home-erow .bz-home-dot--warn') && dt('.bz-home-erow .bz-home-dot--hot') && dt('.bz-home-erow .bz-home-dot--ok'));
        t('周历7格+hit4格', dd.querySelectorAll('.bz-home-wk').length === 7 && dd.querySelectorAll('.bz-home-wk--hit').length === 4);
        t('今天显示今+选中格=今天', [...dd.querySelectorAll('.bz-home-wk-n')].some((n) => n.textContent === '今') && dt('.bz-home-wk--sel .bz-home-wk-n').textContent === '今');
        t('关闭钮图标已物化（真 setIcon）', !!dt('[data-home-close] svg'));
        t('移动瓦片在 DOM（14 枚：移动端没藏密码本）', dd.querySelectorAll('.bz-home-m-tile').length === 14);
        t('移动瓦片桌面隐藏', getComputedStyle(dt('.bz-home-tiles')).display === 'none');

        // 周历切天（桌面）：切昨天 → 时间线 4 条 + 标题带日期 + 无点评；切回今天恢复
        const yesterKey = [...dd.querySelectorAll('.bz-home-wk')].map((b) => b.dataset.homeWeekday)[1];
        [...dd.querySelectorAll('.bz-home-wk')].find((b) => b.dataset.homeWeekday === yesterKey).click();
        await sleep(60);
        t('切昨天后时间线5条', dd.querySelectorAll('.bz-home-timeline .bz-home-ev').length === 5);
        t('切天后无点评（仅今天点评）', dd.querySelectorAll('.bz-home-ev-note').length === 0);
        [...dd.querySelectorAll('.bz-home-wk')][0].click();
        await sleep(60);
        t('切回今天9条+点评2条', dtEvs().length === 9 && dd.querySelectorAll('.bz-home-ev-note').length === 2);

        // ESC 关闭（桌面，真 escManager 层）→ 重开（壳经 iframe contentWindow 调真 openHome）
        dd.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
        await sleep(60);
        t('ESC 关闭面板', !dt('.bz-home-panel'));
        dtFrame().contentWindow.BZW_home.openHome();
        await waitFrame(dtDoc, '.bz-home-entries .bz-home-erow');
        t('重开面板（活动河重采）', !!dt('.bz-home-panel') && dtRows().length === 13);

        // 入口点击降级（桌面）：FakeApp 无 commands → openDomain 捕获走真 notice，不崩、面板关
        [...dtRows()].find((r) => r.dataset.homeGo === 'review').click();
        await sleep(80);
        t('入口点击：面板关闭（域命令直达语义）', !dt('.bz-home-panel'));
        t('入口点击：降级通知弹出不崩', !!dt('.bz-notice') && dt('.bz-notice').textContent.indexOf('暂时不可用') >= 0);
        dtFrame().contentWindow.BZW_home.openHome();
        await waitFrame(dtDoc, '.bz-home-entries .bz-home-erow');

        // 移动端（412 宽 iframe ≈ 小米13U，高度 915 满屏/827 内容区可切）：@media 全屏命中 + 瓦片置前 + 头行关闭钮 + 周历切天
        t('移动端@media全屏命中', Math.abs(mob('.bz-home-panel').getBoundingClientRect().width - md.documentElement.clientWidth) < 1);
        t('移动瓦片14枚（hiddenMob 为空 → 密码本在列）', md.querySelectorAll('.bz-home-m-tile').length === 14);
        t('两端隐藏互不影响：桌面藏的域在移动端仍在列', !!md.querySelector('.bz-home-m-tile[data-home-go="vault"]'));
        t('移动顺序未自定义（首枚=日记本，两端各排各的）', md.querySelector('.bz-home-m-tile').dataset.homeGo === 'diary');
        t('移动入口行隐藏（瓦片替代，CSS display:none）', getComputedStyle(mob('.bz-home-entries')).display === 'none');
        t('关闭钮在头行（移动范式）', !!mob('.bz-home-head [data-home-close]'));
        const mobYester = [...md.querySelectorAll('.bz-home-wk')].map((b) => b.dataset.homeWeekday)[1];
        [...md.querySelectorAll('.bz-home-wk')].find((b) => b.dataset.homeWeekday === mobYester).click();
        await sleep(60);
        t('移动切昨天时间线5条', md.querySelectorAll('.bz-home-timeline .bz-home-ev').length === 5);
        [...md.querySelectorAll('.bz-home-wk')][0].click();
        await sleep(60);
        t('移动切回今天9条', md.querySelectorAll('.bz-home-timeline .bz-home-ev').length === 9);

        // ===== 移动端长按抽屉（2026-09-10）：盒头 = 域彩色图标 + 域名 + 入口行那行灰字；番茄钟文案动态 =====
        const MW = mobFrame().contentWindow;
        /** 长按瓦片（core/dom longPress = mousedown 计时 500ms；移动 iframe 内 Platform.isMobile=true） */
        const longPressTile = async (id) => {
          const tile = md.querySelector('.bz-home-m-tile[data-home-go="' + id + '"]');
          tile.dispatchEvent(new MW.MouseEvent('mousedown', { bubbles: true, button: 0 }));
          await sleep(600);
        };
        const sheetLabels = () => [...md.querySelectorAll('.bz-item-sheet-label')].map((b) => b.textContent.trim());

        await longPressTile('diary');
        t('移动端长按入口 → 弹底部抽屉', !!md.querySelector('.bz-item-sheet'));
        t('抽屉盒头有域图标（svg 已物化）', !!md.querySelector('.bz-home-sheet-ic svg'));
        t('盒头图标取域色（日记 #e67341）', (md.querySelector('.bz-home-sheet-ic').getAttribute('style') || '').indexOf('#e67341') >= 0);
        t('盒头显示域名', md.querySelector('.bz-home-sheet-nm').textContent === '日记本');
        t('盒头版式：图标与标题同一行（上排）', (() => {
          const top = md.querySelector('.bz-home-sheet-top');
          return !!top && !!top.querySelector('.bz-home-sheet-ic svg') && !!top.querySelector('.bz-home-sheet-nm');
        })());
        t('盒头版式：灰字在下排（不在图标行内）', (() => {
          const top = md.querySelector('.bz-home-sheet-top'); const sub = md.querySelector('.bz-home-sheet-sub');
          return !!top && !!sub && !top.contains(sub) && sub.parentElement.classList.contains('bz-home-sheet-head');
        })());
        // 字号拍板（用户 2026-09-10 二次）：功能项 > 盒头标题 > 盒头小字 —— 按计算样式实测，不靠肉眼
        t('抽屉字号：功能项 > 标题 > 小字（实测计算样式）', (() => {
          const it = md.querySelector('.bz-item-sheet-item'); const nm = md.querySelector('.bz-home-sheet-nm'); const sub = md.querySelector('.bz-home-sheet-sub');
          if (!it || !nm || !sub) return false;
          const f = (el) => parseFloat(getComputedStyle(el).fontSize);
          return f(it) > f(nm) && f(nm) > f(sub);
        })());
        t('盒头灰字=入口行那行小字（同口径）', md.querySelector('.bz-home-sheet-sub').textContent === md.querySelector('.bz-home-m-tile[data-home-go="diary"] .bz-home-ect').textContent);
        t('抽屉功能项=写日记', sheetLabels().join('|') === '写日记');

        await longPressTile('pomodoro');
        t('番茄钟抽屉项=停止专注（种子 = 暂停中的专注）', sheetLabels().join('|') === '停止专注');

        // 跑真 toggleFocus（同一条命令链路）→ 停掉专注 → 重开面板重采相位 → 文案应翻成「开始专注」
        await MW.BZW_home.toggleFocusSim();
        md.querySelector('.bz-home-head [data-home-close]').click();
        await sleep(100);
        t('移动端关闭钮关掉面板（抽屉同关）', !md.querySelector('.bz-home-panel') && !md.querySelector('.bz-item-sheet'));
        MW.BZW_home.openHome();
        await waitFrame(mobDoc, '.bz-home-m-tile');
        await longPressTile('pomodoro');
        t('停止专注后文案翻成「开始专注」（动态识别）', sheetLabels().join('|') === '开始专注');

        md.querySelector('.bz-item-sheet-mask').click();
        await sleep(80);
        t('点遮罩关掉抽屉', !md.querySelector('.bz-item-sheet'));

        // ===== 入口菜单（2026-09-10：只放域快捷动作；无动作的域不挂） =====
        const rowOf = (id) => [...dtRows()].find((r) => r.dataset.homeGo === id);
        const openMenu = (row, y = 120) => row.dispatchEvent(new MouseEvent('contextmenu', { bubbles: true, cancelable: true, clientX: 120, clientY: y }));
        const menuLabelsNow = () => [...dd.querySelectorAll('.bz-item-menu-item')].map((b) => b.textContent.trim());

        // 域清单变更：移出「移动附件」、入列「备忘录」
        t('移动附件已移出入口', !rowOf('attach'));
        t('备忘录入列', !!rowOf('memo'));

        // 挂载口径：只有带快捷动作的域才挂浮层（core/item-actions 会给元素打 bz-item-card 标记）
        t('有快捷动作的域已挂浮层（日记）', !!rowOf('diary') && rowOf('diary').classList.contains('bz-item-card'));
        t('无快捷动作的域不挂浮层（设置）', !!rowOf('settings') && !rowOf('settings').classList.contains('bz-item-card'));
        t('无快捷动作的域不挂浮层（剪藏本）', !!rowOf('clipping') && !rowOf('clipping').classList.contains('bz-item-card'));
        t('无快捷动作的域不挂浮层（保险库）', !!rowOf('encrypt') && !rowOf('encrypt').classList.contains('bz-item-card'));
        t('移动瓦片同口径（日记挂、设置不挂）', !!mob('.bz-home-m-tile[data-home-go="diary"]') && mob('.bz-home-m-tile[data-home-go="diary"]').classList.contains('bz-item-card') && !mob('.bz-home-m-tile[data-home-go="settings"]').classList.contains('bz-item-card'));

        // 菜单内容：只有域快捷动作（无「打开 X」、无「整理顺序」）
        openMenu(rowOf('diary'));
        await sleep(80);
        const diaryLabels = menuLabelsNow();
        t('日记菜单仅 1 项', diaryLabels.length === 1);
        t('日记菜单=写日记', diaryLabels[0] === '写日记');
        t('菜单无「打开」项', !diaryLabels.some((s) => s.indexOf('打开') >= 0));
        t('菜单无「整理顺序」项', !diaryLabels.some((s) => s.indexOf('整理顺序') >= 0));
        t('菜单项图标已物化（svg）', !!dd.querySelector('.bz-item-menu-item .bz-item-menu-icon svg'));

        openMenu(rowOf('cinema'), 160);
        await sleep(80);
        const cinemaLabels = menuLabelsNow();
        t('影院菜单=加影视+分析报告', cinemaLabels.length === 2 && cinemaLabels[0] === '加影视' && cinemaLabels[1] === '影视分析报告');
        openMenu(rowOf('pomodoro'), 200);
        await sleep(80);
        // 番茄钟 = 唯一动态文案项：种子是「暂停中的专注」→ 桌面菜单显示「停止专注」（移动抽屉另有断言）
        t('番茄菜单=停止专注（动态文案，种子为专注中）', menuLabelsNow().join('|') === '停止专注');
        openMenu(rowOf('knowledge'), 200);
        await sleep(80);
        const kbLabels = menuLabelsNow();
        t('知识盒菜单=术语+视频生成文献笔记', kbLabels.length === 2 && kbLabels[1] === '视频生成文献笔记');
        // 密码本已被 home.json 隐藏 → 不在入口列（故此处不做它的菜单断言，隐藏链路由上面两条覆盖）
        t('隐藏域没有浮层标记', ![...dtRows()].some((r) => r.dataset.homeGo === 'vault' && r.classList.contains('bz-item-card')));
        // 无快捷动作的域：压根没挂浮层（右键不弹菜单；不依赖「上一个菜单已关」这种时序）
        t('设置域未挂浮层（右键不弹菜单）', !rowOf('settings').classList.contains('bz-item-card'));


        document.title = window.__st.fail.length
          ? 'SELFTEST FAIL ' + window.__st.fail.join(',')
          : `SELFTEST OK ${window.__st.pass}/${window.__st.pass + window.__st.fail.length}`;
        res.textContent = window.__st.fail.length ? '自检失败' : `自检通过 ${window.__st.pass}`;
        res.className = window.__st.fail.length ? 'bad' : 'ok';
      } catch (err) {
        document.title = 'SELFTEST ERR ' + (err && err.message || err);
        res.textContent = '自检异常';
        res.className = 'bad';
      }
    })();
  }
})();
</script>

</body>
</html>
