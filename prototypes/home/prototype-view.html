<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>内容首页 · 真行为实例</title>
<!--
  本页 = 内容首页行为单源评审壳的 iframe 视图（issue 245/ADR-0106）。
  它不实现任何首页交互——只把真行为层跑起来：
    - 载入同一份 CSS（core + 域，与插件同源；路径 = 一级 ../core/，与 prototype.html 同目录）
    - 载入 prototype-behavior.js（真 ui.ts 依赖链，alias obsidian→fake）
    - bootHomeSim + openHome：overlay append 到本页 body（iframe 即全屏视口），
      宽度决定桌面/移动布局（styles.css @media/@container ≤768 判定）
  宿主差异（数据/图标/视口）由 fake/fake-obsidian.ts / prototype-icons.js 提供。
-->
<link rel="stylesheet" href="../../src/core/styles.css">
<link rel="stylesheet" href="../../src/core/ui/tokens.css">
<link rel="stylesheet" href="../../src/core/ui/components.css">
<link rel="stylesheet" href="../../src/home/styles.css">
<!-- 剪藏本皮：入口菜单「未读全部标为已读」的确认框用 #__shared_confirm_popup__.bz-clip-dialog-editorial
     （与面板内同款动作同一个皮；只作用于该弹窗，不窜到首页版式） -->
<link rel="stylesheet" href="../../src/clipbook/styles.css">
<script src="./prototype-icons.js"></script>
<script src="./prototype-behavior.js"></script>
<style>
  /* iframe 内全屏面板：清掉 body 边距，让 .bz-home-overlay 铺满 */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body { background: #eae6dc; }
  /* 模拟 Obsidian 宿主变量（core 弹层/通知取值用；插件内由主题提供） */
  body {
    --background-primary: #fbf9f3; --text-normal: #171512; --text-muted: #8b8474; --text-faint: #b3ab99;
    --text-error: #b3564d; --background-modifier-hover: rgba(23,21,18,.06); --color-green: #3d8f5d;
    --background-modifier-border: rgba(23,21,18,.12); --input-shadow: none;
    --interactive-normal: #fff; --interactive-accent: #3d8f5d; --shadow-s: 0 1px 3px rgba(0,0,0,.1);
  }
</style>
</head>
<body class="theme-light">
<script>
  (function () {
    var B = window.BZW_home;
    B.bootHomeSim();
    B.openHome();
  })();
</script>
</body>
</html>
