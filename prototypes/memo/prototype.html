<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>备忘录 · 原型预览（真行为单源）</title>
<!--
  ┌────────────────────────────────────────────────────────────────────────┐
  │ 本文件 = 备忘录域 UI 的评审壳（行为单源版，issue 260，范式随 favorites）。  │
  │ 组件样式零内联，全部来自（与 build-css SOURCES 同序）：                    │
  │   ../core/styles.css → ../core/ui/tokens.css → ../core/ui/components.css │
  │   → ./styles.css（src/memo/styles.css，bz-memo-* 前缀）                   │
  │ markup 单源（ADR-0104）：面板壳/nav/卡/meta 出自 src/memo/render.ts        │
  │   （prototype-render.js 产物同步重出，插件 ui.ts 消费同一份）。             │
  │ 行为单源（ADR-0106）：交互逻辑全部是插件同款 ui.ts 依赖链——                │
  │   经 ./prototype-behavior.js（src/memo/fake-sim.ts 构建，                 │
  │   alias obsidian→公共假层）在下方两个 iframe 视图里跑真行为；               │
  │   桌面 iframe 920px 宽视口 = 桌面 720×580 本体；移动 iframe 412×915 =        │
  │   styles.css 移动全屏态。数据 = localStorage memo.json（数组同构；         │
  │   跨 iframe storage 桥共享）。                                            │
  │ 壳内只允许：外景容器样式、评审徽牌、演示钩子与自检。                        │
  └────────────────────────────────────────────────────────────────────────┘
-->
<link rel="stylesheet" href="../../src/core/styles.css">
<link rel="stylesheet" href="../../src/core/ui/tokens.css">
<link rel="stylesheet" href="../../src/core/ui/components.css">
<link rel="stylesheet" href="../../src/memo/styles.css">
<link rel="stylesheet" href="../mob-1to1.css">
<script src="../mob-1to1.js"></script>
<style>
  /* ===== 以下全部是演示壳，禁止放组件样式 ===== */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; gap: 28px; padding: 32px 24px;
    background: #e3e0d8; font-family: system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif; }
  /* 模拟 Obsidian 宿主变量（core/styles.css 的弹层/通知取值用；插件内由主题提供） */
  body {
    --background-primary: #fbf9f3; --text-normal: #171512; --text-muted: #8b8474; --text-faint: #b3ab99;
    --text-error: #b3564d; --background-modifier-hover: rgba(23,21,18,.06); --color-green: #3d8f5d;
  }
  * { scrollbar-width: none; } *::-webkit-scrollbar { display: none; }

  /* 桌面外景（真行为 iframe：面板 append iframe body，本体 720×580 来自 styles.css） */
  .demo-dt { flex: none; width: 920px; height: 640px; }
  /* 移动外景：412×915 iframe → 全屏态 100vw/100vh 即手机框尺寸 */
  .demo-mob { width: 412px; height: 915px; border-radius: 26px; overflow: hidden; flex: none;
    border: 1px solid #d8d1c0; box-shadow: 0 8px 30px rgba(0,0,0,.14); background: #f5f2ec; }
  .demo-frame { width: 100%; height: 100%; border: 0; display: block; }

  /* 评审徽牌（演示壳自用） */
  .vbadge { position: fixed; right: 16px; bottom: 12px; font-size: 11px; color: #9a917d; display: flex; gap: 10px; align-items: center;
    background: rgba(255,255,255,.9); border: 1px solid #d8d1c0; padding: 3px 8px; z-index: 900; flex-wrap: wrap; }
  .vbadge button { border: none; background: none; font: 11px 'Microsoft YaHei'; cursor: pointer; color: #7a7261; }
  .vbadge button:hover { color: #b3564d; }
  .vbadge .ok { color: #3d8f5d; }
  .vbadge .bad { color: #b3564d; }
</style>
</head>
<body class="theme-light"> <!-- 模拟 Obsidian 宿主：色彩 token 挂 theme-light/dark，壳内必须补一类才不透明 -->
  <div id="dtHost" class="demo-dt"><iframe class="demo-frame" src="./prototype-view.html" title="备忘录·桌面"></iframe></div>
  <div id="mobHost" class="demo-mob-wrap"><div class="demo-mob"><iframe class="demo-frame" src="./prototype-view.html?mob=1" title="备忘录·移动"></iframe></div></div>

  <div class="vbadge">备忘录 · 真行为单源预览（桌面=真 ui.ts 跑在 920px，移动=412×915）· 演示 16 条
    <button id="skinToggle">皮肤→编辑部</button>
    <button id="capDemo">被动捕获演示</button>
    <button id="renameDemo">笔记改名演示</button>
    <button id="delDemo">笔记删除演示</button>
    <button id="mobToggle">隐藏移动端</button>
    <button id="reset">重置演示数据</button>
    <span id="stResult"></span>
  </div>

<script src="./prototype-icons.js"></script>
<script src="./prototype-data.js"></script>
<script>
(function () {
  /* ==================== 壳基座（仅外景）：两个真行为 iframe + 数据种子 + 演示钩子 ====================
   * 行为全部在 iframe 内跑真 ui.ts（prototype-behavior.js）；本页只做：
   *  - 数据种子（MEMO.ITEMS 首启写 localStorage memo.json，数组同构，见 fake-sim seedDatabase）
   *  - 四个演示面（被动捕获 / 打开笔记提醒 / 引用同步·改名 / 引用同步·删除）——手动触发，
   *    经桌面 iframe 的 BZW_memo 演示钩子驱动真 reminder.ts / file-sync.ts
   *  - 重置演示数据（清 localStorage 后重载 iframe）
   *  - 自检（?selftest=1）：经 iframe contentWindow 访问真 DOM
   */
  const LS = 'bz-sim:CONFIG/STORAGE/memo.json';
  const seedOnce = () => {
    if (localStorage.getItem(LS)) return;
    localStorage.setItem(LS, JSON.stringify(window.MEMO?.ITEMS || []));
  };
  seedOnce();

  const dtFrame = () => document.querySelector('#dtHost iframe');
  const mobFrame = () => document.querySelector('#mobHost iframe');
  const dtDoc = () => dtFrame().contentDocument;
  const mobDoc = () => mobFrame().contentDocument;
  const db = () => { try { return JSON.parse(localStorage.getItem(LS) || '[]'); } catch (e) { return []; } };
  // 轮询现取 contentDocument：iframe 加载前后 document 引用会替换（about:blank → 真实文档），
  // 不能缓存旧引用等面板——每次现查，跨文档访问本身同源安全。
  const waitFrame = (getDoc, sel) => new Promise((res, rej) => {
    const started = Date.now();
    const tries = () => {
      try {
        const doc = getDoc();
        if (doc && doc.querySelector(sel)) return res(doc);
        if (Date.now() - started > 25000) return rej(new Error('iframe 面板超时'));
        setTimeout(tries, 150);
      } catch (e) { setTimeout(tries, 150); }
    };
    tries();
  });

  document.querySelector('#mobToggle').addEventListener('click', () => {
    const m = document.querySelector('#mobHost');
    const hidden = m.style.display === 'none';
    m.style.display = hidden ? '' : 'none';
    document.querySelector('#mobToggle').textContent = hidden ? '隐藏移动端' : '显示移动端';
  });

  document.querySelector('#reset').addEventListener('click', () => {
    localStorage.removeItem(LS);
    location.reload();
  });

  // ===== 演示钩子（驱动桌面 iframe 内的真行为层；数据落 localStorage，移动侧重开面板可见） =====
  const B = () => dtFrame().contentWindow.BZW_memo;
  const skinBtn = document.querySelector('#skinToggle');
  skinBtn.addEventListener('click', () => {
    const next = skinBtn.textContent.includes('编辑部') ? 'paper' : 'editorial';
    B().applySkin(next);
    skinBtn.textContent = next === 'editorial' ? '皮肤→纸感' : '皮肤→编辑部';
  });
  document.querySelector('#capDemo').addEventListener('click', () => B().demoCapture());
  document.querySelector('#renameDemo').addEventListener('click', () => {
    const ok = B().demoRenameNote('笔记/项目规划.md', '笔记/项目规划-2026.md');
    window.alert(ok ? '已派发 vault rename：笔记/项目规划.md → 笔记/项目规划-2026.md\nfile-sync 将把 3 条关联备忘录的 notePath 就地改写（namePosition 定位保留）。'
                    : 'fake vault 里没有该笔记');
  });
  document.querySelector('#delDemo').addEventListener('click', () => {
    const ok = B().demoDeleteNote('笔记/项目规划-2026.md');
    window.alert(ok ? '已派发 vault delete：笔记/项目规划-2026.md\nfile-sync 将清空关联备忘录的 notePath/notePosition。'
                    : 'fake vault 里没有该笔记（先跑「笔记改名演示」）');
  });

  /* ==================== 自检（?selftest=1）：真行为 DOM 断言（经 iframe） ==================== */
  if (location.search.includes('selftest')) {
    window.__st = { pass: 0, fail: [] };
    const t = (name, cond) => cond ? window.__st.pass++ : window.__st.fail.push(name);
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    (async () => {
      const res = document.querySelector('#stResult');
      try {
        // 数据基线：种子 16 条；若残留上次运行（非基线数或含「测试备忘录」）则重置重跑一次。
        // headless 验收每次全新 profile 天然干净；浏览器手动重复跑 selftest 也能自清理。
        const BASE = (window.MEMO?.ITEMS || []).length;
        const pre = (() => { try { return JSON.parse(localStorage.getItem(LS) || 'null'); } catch { return null; } })();
        const dirty = !Array.isArray(pre) || pre.length !== BASE || pre.some((i) => i.title === '测试备忘录');
        if (dirty) {
          if (!location.search.includes('reset=1')) {
            localStorage.removeItem(LS);
            seedOnce();
            location.search = '?selftest=1&reset=1';
            return;
          }
        }
        res.textContent = '…';
        const dd = await waitFrame(dtDoc, '.bz-memo-panel');
        const md = await waitFrame(mobDoc, '.bz-memo-panel');
        const dt = (sel) => dd.querySelector(sel);
        const mob = (sel) => md.querySelector(sel);

        t('桌面面板开', !!dt('.bz-memo-panel'));
        t('移动面板开', !!mob('.bz-memo-panel'));
        t('初始16条', db().length === BASE);
        t('皮肤默认纸感', dt('.bz-memo-panel').classList.contains('bz-memo-skin-paper'));
        t('nav 场景=3伪+6用户', dd.querySelectorAll('[data-memo-nav] [data-memo-scene]').length === 9);
        t('移动 chips=3伪+6用户', md.querySelectorAll('[data-memo-mob-scenes] [data-memo-scene]').length === 9);
        t('nav 图标兑现', !!dt('[data-memo-nav] [data-memo-scene] svg')); // fake setIcon + MEMO_ICONS 表生效
        t('主头行计数在场', dd.querySelectorAll('[data-memo-main-count] .bz-memo-cnt-num').length === 2);
        t('到期优先分区在场', [...dd.querySelectorAll('.bz-memo-section-label')].some((el) => el.textContent.includes('到期优先')));
        t('重要红底标签在场', !!dd.querySelector('.bz-memo-tag-scene.bz-memo-tag-important'));
        t('逾期标签在场', !!dd.querySelector('.bz-memo-tag-overdue'));
        t('代码脚本标签在场', [...dd.querySelectorAll('.bz-memo-tag-script')].some((el) => el.textContent.includes('weekly-report.py')));
        t('公开课课程标签去书名号', [...dd.querySelectorAll('.bz-memo-tag-course')].every((el) => !el.textContent.includes('《')));
        t('已完成折叠条在场', !!dt('[data-memo-donebar]'));

        // composer 添加（真 addFromComposer → jsonFileStore 写队列）
        const input = dt('[data-memo-composer-input]');
        input.value = '测试备忘录';
        dt('[data-memo-composer-add]').click();
        await sleep(600);
        const saved = db().find((i) => i.title === '测试备忘录');
        t('composer 落盘', !!saved);
        t('composer 场景=默认第一场景', saved && saved.scene === '剪藏');

        // 行内勾选（300ms 防抖 + 行为流）
        const firstCard = dd.querySelector('.bz-memo-card:not(.bz-memo-done)');
        const firstId = firstCard && firstCard.dataset.memoId;
        firstCard.querySelector('[data-memo-check]').click();
        await sleep(900);
        const doneItem = db().find((i) => i.id === firstId);
        t('勾选完成落盘', doneItem && !!doneItem.completed);

        // 编辑弹窗（真 openEditor → uiModal）
        dt('[data-memo-newbtn]').click();
        await sleep(150);
        t('编辑器开', !!dd.querySelector('.bz-overlay-popup .bz-memo-editor'));
        dd.querySelector('.bz-overlay-mask').click();
        await sleep(150);
        t('编辑器关（点遮罩）', !dd.querySelector('.bz-overlay-popup .bz-memo-editor'));

        // 皮肤热切换（真 applyMemoSkin）
        B().applySkin('editorial');
        await sleep(80);
        t('皮肤切编辑部', dt('.bz-memo-panel').classList.contains('bz-memo-skin-editorial'));
        B().applySkin('paper');

        // 引用同步·改名（真 file-sync：vault rename → 域事件总线 → notePath 改写，去抖回放）
        const renamed = B().demoRenameNote('笔记/项目规划.md', '笔记/项目规划-2026.md');
        await sleep(1600);
        const afterRename = db().filter((i) => i.notePath === '笔记/项目规划-2026.md');
        t('改名演示派发成功', renamed);
        t('改名改写 3 条引用', afterRename.length === 3);
        t('改写保留定位', afterRename.every((i) => !!i.notePosition || !i.notePath));

        // 引用同步·删除（vault delete → notePath/notePosition 清空）
        const del = B().demoDeleteNote('笔记/项目规划-2026.md');
        await sleep(900);
        const afterDel = db().filter((i) => i.notePath === '笔记/项目规划-2026.md');
        t('删除演示派发成功', del);
        t('删除清空引用', afterDel.length === 0);

        // 被动捕获（真 reminder：autoPopupOnStart + hasPendingUrgent → 300ms 自动弹面板）
        dtFrame().contentWindow.BZW_memo.closePanel();
        await sleep(120);
        B().demoCapture();
        await sleep(1200);
        t('被动捕获自动弹面板', !!dt('.bz-memo-panel'));

        // 打开笔记提醒（真 reminder file-open 链：关联重要/到期 → 搜索框定位笔记路径）
        mobFrame().contentWindow.BZW_memo.demoFileOpen('课程/数据分析实战.md');
        await sleep(500);
        t('打开笔记提醒定位', (mob('[data-memo-search]') || {}).value === '课程/数据分析实战.md');

        const st = window.__st;
        res.innerHTML = st.fail.length
          ? '<span class="bad">FAIL ' + st.fail.length + ': ' + st.fail.join(' / ') + '</span>'
          : '<span class="ok">PASS ' + st.pass + '/' + (st.pass + st.fail.length) + '</span>';
        console.log('[memo selftest]', st.pass, 'pass', st.fail.length, 'fail', st.fail);
      } catch (e) {
        res.innerHTML = '<span class="bad">ERR ' + (e && e.message || e) + '</span>';
        console.error(e);
      }
    })();
  }
})();
</script>
</body>
</html>
