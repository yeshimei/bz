<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>设置面板 · 真行为实例</title>
<!--
  本页 = 设置面板行为单源评审壳的 iframe 视图（issue 245/ADR-0106，范式随 belongings 试点）。
  它不实现任何设置交互——只把真行为层跑起来：
    - 载入同一份 CSS（core + 域，与插件同源；相对路径一级 ../core/，四级链缺一即自检红）
    - 载入 prototype-behavior.js（真 ui.ts 依赖链，alias obsidian→fake）
    - boot + openPanel：面板 append 到本页 body（iframe 即全屏视口），
      宽度决定桌面/移动布局（桌面 bz-sp-desk 工作台 / ≤768 移动 M1 命令面板）
  宿主差异（图标/视口/目录面/设置存取）由 fake-obsidian / prototype-icons.js 提供。
-->
<link rel="stylesheet" href="../../src/core/styles.css">
<link rel="stylesheet" href="../../src/core/ui/tokens.css">
<link rel="stylesheet" href="../../src/core/ui/components.css">
<link rel="stylesheet" href="../../src/settings-panel/styles.css">
<!-- 跨域弹窗：通用组「数据体检」经动态 import('../checkup') 打开 bz-checkup-* 弹窗，其域样式须入链 -->
<link rel="stylesheet" href="../../src/checkup/styles.css">
<script src="./prototype-icons.js"></script>
<script src="./prototype-behavior.js"></script>
<style>
  /* iframe 内全屏面板：清掉 body 边距，让面板铺满 */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body { background: #e3e0d8; }
  /* 评审壳隐藏滚动条（插件端由 Obsidian 主题出） */
  * { scrollbar-width: none; } *::-webkit-scrollbar { display: none; }
  /* 模拟 Obsidian 宿主变量（core 弹层/菜单/通知取值用；插件内由主题提供） */
  body {
    --background-primary: #fbf9f3; --text-normal: #171512; --text-muted: #8b8474; --text-faint: #b3ab99;
    --text-error: #b3564d; --background-modifier-hover: rgba(23,21,18,.06); --color-green: #3d8f5d;
    --background-modifier-border: rgba(23,21,18,.12); --input-shadow: none;
    --interactive-normal: #fff; --interactive-accent: #3d8f5d; --shadow-s: 0 1px 3px rgba(0,0,0,.1);
  }
</style>
</head>
<body class="theme-light">
<script>
  (function () {
    var B = window.BZW_settings_panel;
    B.bootSettingsPanelSim();
    B.openPanel();
  })();
</script>
</body>
</html>
