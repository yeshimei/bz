<!--

  │ 本文件 = 设置面板域 UI 的评审壳（行为单源版，issue 245/ADR-0106，          │
  │ 范式随 belongings 试点；2026-09-07 拍板推翻 4b068bb「原型 app.js 为真理」  │
  │ 方向——行为唯一真理 = 域 ui.ts，本壳退化为双 iframe 评审壳，                │
  │ prototype.app.js / prototype-data.js 退役删除）。                         │
  │ 组件样式零内联，全部来自（与 build-css SOURCES 同序）：                    │
  │   ../core/styles.css → ../core/ui/tokens.css → ../core/ui/components.css │
  │   → ./styles.css                                                        │
  │ 行为单源：交互逻辑全部是插件同款 ui.ts / renderer.ts / dir-picker.ts        │
  │   依赖链——经 ./prototype-behavior.js（src/settings-panel/fake-sim.ts       │
  │   构建，alias obsidian→公共假层）在下方两个 iframe 视图里跑真行为；          │
  │   桌面 iframe 920px 宽视口 = 桌面 B 侧栏工作台（本体 min(1080px,94vw)）；  │
  │   移动 iframe 412×915 = M1 命令面板 + 域设置弹窗（fake Platform ≤768 判定）。 │
  │ 数据 = schema 全真（ui.ts schemaLoaders 调各域真实 xxxSettingsSchema()）；  │
  │   设置 = localStorage 内存单例（fake-sim 注入，键直绑改动可持久）；          │
  │   vault 目录面 = localStorage 种子树（dir-picker 真聚合 + adapter 补齐）。  │
  │ 壳内只允许：外景容器样式、评审徽牌、重置与自检。                            │
  └────────────────────────────────────────────────────────────────────────┘
-->

<!-- 番茄钟皮肤域样式：外观组十张预览卡的 --pz-<id>-* 色值变量定义在此（:root 表），
     缺链 = var 解析失败 → 预览卡透明（静默，与 2026-09-11 菜单透明同因） -->
<link rel="stylesheet" href="../../src/pomodoro/styles.css">

<script src="../mob-1to1.js"></script>
<style>
  /* ===== 以下全部是演示壳，禁止放组件样式 ===== */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; gap: 28px; padding: 32px 24px;
    background: #e3e0d8; font-family: system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif; }
  /* 模拟 Obsidian 宿主变量（core/styles.css 的弹层/通知取值用；插件内由主题提供） */
  body {
    --background-primary: #fbf9f3; --text-normal: #171512; --text-muted: #8b8474; --text-faint: #b3ab99;
    --text-error: #b3564d; --background-modifier-hover: rgba(23,21,18,.06); --color-green: #3d8f5d;
  }
  * { scrollbar-width: none; } *::-webkit-scrollbar { display: none; }

  /* 桌面外景（真行为 iframe：面板 append iframe body，本体 min(1080px,94vw) 来自 styles.css） */
  .demo-dt { flex: none; width: 920px; height: 720px; }
  /* 移动外景：412×915 iframe → M1 命令面板真全屏态即手机框尺寸 */
  .demo-mob { width: 412px; height: 915px; border-radius: 26px; overflow: hidden; flex: none;
    border: 1px solid #d8d1c0; box-shadow: 0 8px 30px rgba(0,0,0,.14); background: #f5f2ec; }
  .demo-frame { width: 100%; height: 100%; border: 0; display: block; }

  /* 评审徽牌（演示壳自用） */
  .vbadge { position: fixed; right: 16px; bottom: 12px; font-size: 11px; color: #9a917d; display: flex; gap: 10px; align-items: center;
    background: rgba(255,255,255,.9); border: 1px solid #d8d1c0; padding: 3px 8px; z-index: 900; }
  .vbadge button { border: none; background: none; color: #b3564d; font: 11px 'Microsoft YaHei'; cursor: pointer; }

</head>
<body class="theme-light"> <!-- 模拟 Obsidian 宿主：色彩 token 挂 theme-light/dark，壳内必须补一类才不透明 -->
  <div id="dtHost" class="demo-dt"><iframe class="demo-frame" src="./prototype-view.html" title="设置面板·桌面"></iframe></div>
  <div id="mobHost" class="demo-mob-wrap"><div class="demo-mob"><iframe class="demo-frame" src="./prototype-view.html?mob=1" title="设置面板·移动"></iframe></div></div>

  <div class="vbadge">设置面板 · 真行为单源预览（桌面=真 ui.ts 跑在 920px，移动=412×915 M1 命令面板）
    <button id="mobToggle">隐藏移动端</button>
    <button id="reset">重置演示数据</button>
    <span id="stResult"></span>
  </div>

<script src="./prototype-icons.js"></script>
<script>
(function () {
  /* ==================== 壳基座（仅外景）：两个真行为 iframe + 重置 ====================
   * 行为全部在 iframe 内跑真 ui.ts（prototype-behavior.js）；本页只做：
   *  - 重置演示数据（清 bz-sim:* 后重载 iframe——设置单例/vault 种子由 fake-sim 重播）
   *  - 自检（?selftest=1）：经 iframe contentWindow 访问真 DOM
   */
  const SIM_SETTINGS_KEY = 'bz-sim:bz-settings.json';
  const clearSim = () => {
    const doomed = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith('bz-sim:')) doomed.push(k);
    }
    doomed.forEach((k) => localStorage.removeItem(k));
  };

  const dtFrame = () => document.querySelector('#dtHost iframe');
  const mobFrame = () => document.querySelector('#mobHost iframe');
  const dtDoc = () => dtFrame().contentDocument;
  const mobDoc = () => mobFrame().contentDocument;
  // 轮询现取 contentDocument：iframe 加载前后 document 引用会替换（about:blank → 真实文档），
  // 不能缓存旧引用等面板——每次现查，跨文档访问本身同源安全。
  const waitFrame = (getDoc, sel) => new Promise((res, rej) => {
    const started = Date.now();
    const tries = () => {
      try {
        const doc = getDoc();
        if (doc && doc.querySelector(sel)) return res(doc);
        if (Date.now() - started > 25000) return rej(new Error('iframe 面板超时'));
        setTimeout(tries, 150);
      } catch (e) { setTimeout(tries, 150); }
    };
    tries();
  });

  document.querySelector('#mobToggle').addEventListener('click', () => {
    const m = document.querySelector('#mobHost');
    const hidden = m.style.display === 'none';
    m.style.display = hidden ? '' : 'none';
    document.querySelector('#mobToggle').textContent = hidden ? '隐藏移动端' : '显示移动端';
  });

  document.querySelector('#reset').addEventListener('click', () => {
    clearSim();
    location.reload();
  });

  /* ==================== 自检（?selftest=1）：真行为 DOM 断言（经 iframe） ==================== */
  if (location.search.includes('selftest')) {
    window.__st = { pass: 0, fail: [] };
    const t = (name, cond) => cond ? window.__st.pass++ : window.__st.fail.push(name);
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    /** 轮询断言面出现（防异步渲染时序脆断）：ok() 返回真值即通过 */
    const waitFor = (ok, ms = 6000) => new Promise((res) => {
      const started = Date.now();
      const tries = () => {
        let v = null;
        try { v = ok(); } catch { v = null; }
        if (v) return res(v);
        if (Date.now() - started > ms) return res(null);
        setTimeout(tries, 100);
      };
      tries();
    });
    (async () => {
      const res = document.querySelector('#stResult');
      try {
        // 基线检查：自检会改设置（diarySkin/diaryDirectory/cinemaSortMode/belongingsDefaultStatus）。
        // 残留上次运行（键在）则清 bz-sim:* 重载一次。headless 全新 profile 天然干净；
        // 浏览器手动重复跑 selftest 也能自清理（壳可重复）。
        const dirtyKeys = ['diarySkin', 'diaryDirectory', 'cinemaSortMode', 'belongingsDefaultStatus'];
        let base = {};
        try { base = JSON.parse(localStorage.getItem(SIM_SETTINGS_KEY) || '{}'); } catch { base = {}; }
        if (dirtyKeys.some((k) => k in base)) {
          if (!location.search.includes('reset=1')) {
            clearSim();
            location.search = '?selftest=1&reset=1';
            return;
          }
        }
        const dd = await waitFrame(dtDoc, '.bz-sp-desk');
        const md = await waitFrame(mobDoc, '.bz-sp-mobile');
        res.textContent = '…';
        const dt = (sel) => dd.querySelector(sel);
        const mob = (sel) => md.querySelector(sel);
        const sim = () => dtFrame().contentWindow.BZW_settings_panel.__simSettings();
        // 移动 iframe 是独立 JS realm：自己的设置内存单例（经 localStorage 持久层与桌面同源共享）
        const simMob = () => mobFrame().contentWindow.BZW_settings_panel.__simSettings();
        const dtAll = (sel) => [...dd.querySelectorAll(sel)];
        const mobAll = (sel) => [...md.querySelectorAll(sel)];
        const badgeOf = (id) => dt(`.bz-sp-nav-item[data-sp-domain="${id}"] .bz-sp-nav-count`)?.textContent || '';
        const waitPaneGroups = (min) => waitFor(() => {
          const gs = dtAll('.bz-sp-pane .bz-sp-group');
          return gs.length >= min ? gs : null;
        });

        /* ---------- CSS 生效（壳四链防 404 再犯）：外链表已加载、规则非空、域样式真命中 ---------- */
        const sheetsOf = (doc) => [...doc.styleSheets].filter((s) => s.href).length;
        const rulesOf = (doc) => [...doc.styleSheets].reduce((n, s) => { try { return n + s.cssRules.length; } catch { return n; } }, 0);
        t('桌面CSS外链≥4', sheetsOf(dd) >= 4);
        t('桌面CSS规则非空', rulesOf(dd) > 50);
        t('桌面面板底色非透明（域 tokens 命中）', getComputedStyle(dt('.bz-sp-desk')).backgroundColor !== 'rgba(0, 0, 0, 0)');
        t('移动CSS外链≥4', sheetsOf(md) >= 4);
        t('移动CSS规则非空', rulesOf(md) > 50);
        t('移动面板底色非透明', getComputedStyle(mob('.bz-sp-mobile')).backgroundColor !== 'rgba(0, 0, 0, 0)');

        /* ---------- 移动：壳结构（关闭钮只留首页页；分组与桌面导航同源） ---------- */
        // 2026-09-10 拍板：域页右上角关闭钮删除（域页已有返回钮弹回首页，再叠一枚误触率高），
        // 关面板走首页页那枚 —— 全 DOM 只剩一枚关闭钮。
        t('移动域页无关闭钮', mobAll('.bz-sp-mob-page--domain .bz-sp-mob-close').length === 0);
        t('移动首页页保留关闭钮（全 DOM 唯一一枚）', mobAll('.bz-sp-mob-page--home .bz-sp-mob-close').length === 1 &&
          mobAll('.bz-sp-mob-close').length === 1);
        t('移动返回钮在场（域页弹回首页用）', !!mob('.bz-sp-mob-back-btn'));
        // 侧栏重新分细组（2026-09-10 拍板七组）：移动列表与桌面导航同源同序
        const MOB_SECS = '基础>智能>记录>收集>媒体与阅读>工具>安全';
        const mobSecOrder = await waitFor(() => {
          const s = mobAll('.bz-sp-mob-sec').map((e) => e.textContent).join('>');
          return s === MOB_SECS ? s : null;
        });
        t('移动分组与桌面导航同源七组', mobSecOrder === MOB_SECS);

        /* ---------- 桌面：壳结构 + 徽标（schema 预载回填）+ 默认域 ---------- */
        t('桌面面板开', !!dt('#bz-settings-panel-popup.bz-sp-desk'));
        t('桌面导航域≥16', dtAll('.bz-sp-nav-item').length >= 16);
        t('导航图标兑现（fake setIcon SVG）', !!dt('.bz-sp-nav-item .bz-sp-nav-ic svg'));
        t('头行搜索框在场', !!dt('.bz-sp-search .bz-input'));
        // 侧栏重新分细组（2026-09-10 拍板七组，替代原「基础/记录/媒体与知识/工具」四组）：
        // 组内域序 = DOMAINS 声明序，组序 = NAV_SECS 声明序 —— 单测 tests/settings-panel.test.ts 同口径。
        const NAV_GROUPS = '基础>智能>记录>收集>媒体与阅读>工具>安全';
        const navSecOrder = dtAll('.bz-sp-nav-sec-t').map((e) => e.textContent).join('>');
        t('侧栏七组分组顺序', navSecOrder === NAV_GROUPS);
        t('基础组含首页（通用/设置/首页）', (() => {
          const items = dtAll('.bz-sp-nav-sec')[0]?.querySelectorAll('.bz-sp-nav-item') ?? [];
          return [...items].map((b) => b.dataset.spDomain).join(',') === 'global,appearance,home';
        })());
        t('无「其他」尾组（18 可见域全在表内）', !dtAll('.bz-sp-nav-sec-t').some((e) => e.textContent === '其他'));
        await waitFor(() => badgeOf('global') !== '·' && badgeOf('global') !== '');
        t('通用徽标=1', badgeOf('global') === '1');
        t('设置徽标=2（外观独立域）', badgeOf('appearance') === '2');
        // AI=5：4 常显（服务商/模型名称/上下文窗口/最大输出 token）+ deepseek 密钥行
        // （seed aiProvider=deepseek，visibleWhen 门控放行）。**不是 9**：采样参数组 4 行已于
        // 2026-09-08 拍板退役（schema 注释），旧断言按 9 是那批行还在时的口径。
        t('AI徽标=5（含 seed deepseek 密钥行门控放行）', badgeOf('ai') === '5');
        t('归物本徽标=3（移动端组桌面门控不计）', badgeOf('belongings') === '3');
        t('默认域=通用（数据存储路径组）', await waitFor(() => dt('.bz-sp-pane .bz-sp-group-name')?.textContent === '数据存储路径') !== null);
        // 路径行控件二态（renderer.ts path 分支）：有值 → chip 回显（点文本重开），空值 → 「选择…」按钮。
        // 种子给了 storagePath，所以这里兑现的是 chip 态；两态都是自绘（无原生 Setting 嵌套）。
        t('通用路径行自绘 chip 回显（有值态）', !!dt('.bz-sp-pane .bz-sp-chips .bz-sp-chip') &&
          !dt('.bz-sp-pane .bz-sp-path-btn'));

        /* ---------- 桌面：搜索过滤域导航 ---------- */
        const searchIn = dt('.bz-sp-search .bz-input');
        searchIn.value = '番茄';
        searchIn.dispatchEvent(new Event('input', { bubbles: true }));
        t('搜索过滤域导航', dtAll('.bz-sp-nav-item').length === 1 && dt('.bz-sp-nav-item').textContent.includes('番茄钟'));
        searchIn.value = '';
        searchIn.dispatchEvent(new Event('input', { bubbles: true }));

        /* ---------- 桌面：「设置」域外观组（经纬/晨昏 各一卡） ---------- */
        dt('.bz-sp-nav-item[data-sp-domain="appearance"]').click();
        await waitPaneGroups(1);
        const apPicks = () => dtAll('.bz-sp-pane .bz-sp-cardpick');
        await waitFor(() => apPicks().length === 2 && apPicks()[0].querySelectorAll('.bz-sp-cardpick-card').length === 1);
        t('设置域外观组两卡组', apPicks().length === 2);
        t('布局卡=经纬', apPicks()[0].textContent.includes('经纬'));
        t('主题卡=晨昏', apPicks()[1].textContent.includes('晨昏'));
        t('空值回退首卡选中', apPicks()[0].querySelector('.bz-sp-cardpick-card').classList.contains('is-on') &&
          apPicks()[1].querySelector('.bz-sp-cardpick-card').classList.contains('is-on'));

        /* ---------- 桌面：日记本——choiceCards 联动过滤 + 键直绑 + dir-picker 真聚合 ---------- */
        dt('.bz-sp-nav-item[data-sp-domain="diary"]').click();
        await waitPaneGroups(3);
        const diaryPicks = () => dtAll('.bz-sp-pane .bz-sp-cardpick');
        await waitFor(() => diaryPicks().length === 2 && diaryPicks()[1].querySelectorAll('.bz-sp-cardpick-card').length === 1);
        // 种子给了 diarySkin='default' → 布局门放行主题单卡「画廊白」（ADR-0115 正名：值 ivory→gallery）
        t('日记主题卡联动单卡（画廊白放行）', diaryPicks()[1].querySelector('.bz-sp-cardpick-card')?.textContent.includes('画廊白') === true);
        t('主题卡按种子值选中（diarySkinTheme=gallery）', diaryPicks()[1].querySelector('.bz-sp-cardpick-card').classList.contains('is-on'));
        diaryPicks()[0].querySelector('.bz-sp-cardpick-card').click();
        t('布局卡键直绑落内存设置（diarySkin=default）', sim().diarySkin === 'default');
        // choiceCards 不热重渲（真行为口径）：切走再切回，联动过滤放行主题单卡
        dt('.bz-sp-nav-item[data-sp-domain="ai"]').click();
        dt('.bz-sp-nav-item[data-sp-domain="diary"]').click();
        await waitPaneGroups(3);
        await waitFor(() => diaryPicks().length === 2 && diaryPicks()[1].querySelectorAll('.bz-sp-cardpick-card').length === 1);
        t('切走切回后主题行仍单卡（画廊白）', diaryPicks()[1].querySelector('.bz-sp-cardpick-card')?.textContent.includes('画廊白') === true);

        /* ---------- 首页「外观 → 首页入口」内联编辑器（2026-09-10：弹窗 → 面板内联） ---------- */
        // 导航项与面板内容都是异步渲染的（preload 徽标后才定稿）：一律 waitFor + 判空点击，
        // 不做「元素一定已在」的假设（曾因时序踩到 null.click）。
        const clickIf = (sel) => { const el = dt(sel); if (el) el.click(); return !!el; };

        const homeNav = await waitFor(() => dt('.bz-sp-nav-item[data-sp-domain="home"]'));
        t('设置导航出现「首页」域', !!homeNav && homeNav.textContent.indexOf('首页') >= 0);
        if (homeNav) homeNav.click();
        // 首页域现在是五组（外观/时间线/内容过滤/预告栏/入口）—— 先等组就绪，否则下面的 select/toggle 查询拿到 0 个
        await waitPaneGroups(5);
        // 内联列表在 loadHomeOrder 完成后才填 —— 必须等行就绪再断言
        const entRows = await waitFor(() => dtAll('[data-ent-list] [data-ent-row]').length === 14);
        t('首页域内联出入口列表（14 域默认顺序）', !!entRows);
        // 组序（issue 288，2026-09-11 用户拍板拆细分组）：外观 → 时间线 → 内容过滤 → 预告栏 → 入口
        const homeGroupOrder = dtAll('.bz-sp-pane .bz-sp-group-name').map((e) => e.textContent).join('>');
        t('首页域组序=外观 → 时间线 → 内容过滤 → 预告栏 → 入口', homeGroupOrder === '外观>时间线>内容过滤>预告栏>入口');
        const homePicks = () => dtAll('.bz-sp-pane .bz-sp-cardpick');
        await waitFor(() => homePicks().length === 2 && homePicks().every((p) => p.querySelectorAll('.bz-sp-cardpick-card').length === 1));
        t('外观组两卡组（布局+主题 各一档）', homePicks().length === 2);
        t('布局卡=活动河（预览 bz-sp-prev-panel）', homePicks()[0].querySelector('.bz-sp-cardpick-name')?.textContent === '活动河' &&
          !!homePicks()[0].querySelector('.bz-sp-mini.bz-sp-prev-panel'));
        t('主题卡=米白（预览 bz-sp-prev-cream 生效）', homePicks()[1].querySelector('.bz-sp-cardpick-name')?.textContent === '米白' &&
          !!homePicks()[1].querySelector('.bz-sp-mini.bz-sp-prev-cream'));
        t('两卡按种子值选中（homeLayout/homeSkin）', homePicks()[0].querySelector('.bz-sp-cardpick-card').classList.contains('is-on') &&
          homePicks()[1].querySelector('.bz-sp-cardpick-card').classList.contains('is-on'));

        /* ---------- 首页「时间线 / 内容过滤 / 预告栏」三组（issue 287，2026-09-11 用户点名六项 + issue 288 拆组去「已跳过」） ---------- */
        // 行控件是**面板自绘组件**（不是原生 select/checkbox）：
        //   select 行 → .bz-sp-set-ctrl > .bz-select（当前值在 .bz-select-val 文本里）
        //   toggle 行 → .bz-sp-set-ctrl > button.bz-sw（开 = 带 .on 且 aria-checked=true）
        // 且行带 data-key=<键名>，按键取行最稳（不靠下标，将来插行不会错位）。
        // **必须在 waitPaneGroups 之后取**：行是异步渲染的（issue 287 首次自检踩到）。
        const homePane = () => dt('.bz-sp-pane');
        const tlRow = (key) => homePane().querySelector(`.bz-sp-set-row[data-key="${key}"]`);
        await waitFor(() => tlRow('homeTimelineSize') && tlRow('homeTimelineTime'));
        const tlSelectText = (key) => tlRow(key)?.querySelector('.bz-select-val')?.textContent || '';
        const tlOn = (key) => {
          const b = tlRow(key)?.querySelector('button.bz-sw');
          return !!b && b.classList.contains('on') && b.getAttribute('aria-checked') === 'true';
        };
        t('时间线组：两个 select 行在场且按种子取当前值（字号=标准 / 时间范围=本周 / 默认打开日=今天）',
          tlSelectText('homeTimelineSize') === '标准' &&
          tlSelectText('homeTimelineRange') === '本周' &&
          tlSelectText('homeDefaultDay') === '今天');
        t('时间线组：显示时刻列开关在场且按种子取当前值（开）', tlOn('homeTimelineTime'));
        t('内容过滤组：三个 toggle 行在场且按种子取当前值（产出/状态推进/点评 ✦ 全开）',
          tlOn('homeTimelineProduce') && tlOn('homeTimelineProgress') && tlOn('homeTimelineNotes'));
        t('预告栏组：明天预告卡开关在场且按种子取当前值（开）', tlOn('homeNextCards'));
        // 组归属：时间线组里不该再有「产出/已跳过」，内容过滤组里不该有「字号」
        t('组归属正确（时间线=字号/范围/默认日/时刻列；内容过滤=产出/推进/点评；预告栏=预告卡）', (() => {
          const groups = dtAll('.bz-sp-pane .bz-sp-group');
          const byName = (n) => groups.find((g) => g.querySelector('.bz-sp-group-name')?.textContent === n);
          const keysOf = (g) => [...g.querySelectorAll('.bz-sp-set-row[data-key]')].map((r) => r.dataset.key);
          const tl = keysOf(byName('时间线'));
          const ct = keysOf(byName('内容过滤'));
          const pr = keysOf(byName('预告栏'));
          return tl.join(',') === 'homeTimelineSize,homeTimelineRange,homeDefaultDay,homeTimelineTime'
            && ct.join(',') === 'homeTimelineProduce,homeTimelineProgress,homeTimelineNotes'
            && pr.join(',') === 'homeNextCards';
        })());
        t('「已跳过」toggle 已退役（面板内不再有此行）', !tlRow('homeTimelineSkipped') &&
          homePane().textContent.indexOf('已跳过') < 0);
        // 组头图标必须全部兑现（prototype-icons.js 是手写白名单，漏一个就静默空一块）
        t('首页五组组头图标全部兑现', (() => {
          const heads = dtAll('.bz-sp-pane .bz-sp-group-head');
          return heads.length >= 5 && heads.every((h) => !!h.querySelector('.bz-sp-group-icon svg'));
        })());
        // 改一个开关必须能落盘（键直绑 → saveSettings 通道）
        t('时间线开关可切换（点「显示时刻列」后变关）', (() => {
          tlRow('homeTimelineTime').querySelector('button.bz-sw').click();
          return tlOn('homeTimelineTime') === false;
        })());
        // 复原，别把改动带给后面段落（上面那次点击已把它关掉，再点一次回到开）
        tlRow('homeTimelineTime').querySelector('button.bz-sw').click();
        t('时间线开关复原为开', tlOn('homeTimelineTime'));
        t('不再有「编辑入口…」按钮（不开弹窗）', !dtAll('.bz-sp-pane button').some((b) => b.textContent.indexOf('编辑入口') >= 0));
        t('不再有浮层遮罩（弹窗形态已退役）', !dt('.bz-home-ee-mask'));
        t('不再有「已移除的域仍可从命令面板打开」提示行', dt('.bz-sp-pane').textContent.indexOf('命令面板') < 0);
        t('内联列表有拖拽手柄（已物化 svg）', !!dt('[data-ent-list] .bz-home-ent-grip svg'));
        t('桌面端只归桌面那套（data-ent-scope=desk）', (dt('.bz-home-ent') || {}).getAttribute && dt('.bz-home-ent').getAttribute('data-ent-scope') === 'desk');
        t('无桌面/移动切换段（各端只改自己）', dtAll('.bz-home-ent-seg').length === 0);

        // 移除 = 隐藏（只作用本端）；改动即时落盘。
        // 2026-09-10 拍板：移除的域**不分区、无「已隐藏」标题**，就地排到同一列表最下面（弱化 + 无拖柄 + 点 + 加回）
        const entListIds = () => dtAll('[data-ent-list] [data-ent-row]').map((r) => r.dataset.entRow);
        const rowsBeforeRemove = entListIds();
        t('点 × 移除设置域', clickIf('[data-ent-list] [data-ent-row="settings"] [data-ent-remove]'));
        await sleep(160);
        t('移除后行仍在同一列表（不分区）', !!dt('[data-ent-list] [data-ent-row="settings"]'));
        t('移除后行带 --off 弱化类且无移除钮', dt('[data-ent-list] [data-ent-row="settings"]')?.classList.contains('bz-home-ent-row--off') === true &&
          !dt('[data-ent-list] [data-ent-row="settings"] [data-ent-remove]'));
        t('移除后排到列表最下面（末位是它）', entListIds()[entListIds().length - 1] === 'settings' &&
          entListIds().length === rowsBeforeRemove.length);
        t('移除后恢复钮在场（点 + 加回）', !!dt('[data-ent-restore="settings"]'));
        t('无「已隐藏」分区元素（.bz-home-ent-sec 已退役）', dtAll('.bz-home-ent-sec').length === 0);
        t('移除行的拖柄已隐（不参与排序）', (() => {
          const grip = dt('[data-ent-list] [data-ent-row="settings"] .bz-home-ent-grip');
          return !!grip && getComputedStyle(grip).visibility === 'hidden';
        })());
        t('入口列表无说明小字（2026-09-11 用户拍板删除）', !dt('.bz-home-ent-hint'));
        // 列表靠左、左边不留内边距（右边照常）：宿主 custom 行左 padding 归零 + 行左 padding 归零
        t('入口列表贴卡片左缘（宿主行左内边距归零，右内边距保留）', (() => {
          const row = dt('[data-ent-list] [data-ent-row]');
          if (!row) return false;
          const host = row.closest('.bz-sp-set-row');
          if (!host) return false;
          const hp = getComputedStyle(host);
          return hp.paddingLeft === '0px' && parseFloat(hp.paddingRight) > 0
            && getComputedStyle(row).paddingLeft === '0px';
        })());
        t('改动即时落盘 home.json', Object.keys(localStorage).some((k) => k.indexOf('home.json') >= 0));
        t('点 + 恢复设置域', clickIf('[data-ent-restore="settings"]'));
        await sleep(160);
        t('恢复后回到可见列（--off 已摘）', dt('[data-ent-list] [data-ent-row="settings"]')?.classList.contains('bz-home-ent-row--off') === false);
        t('恢复后无残留恢复钮/分区', !dt('[data-ent-restore="settings"]') && dtAll('.bz-home-ent-sec').length === 0);

        // 拖拽排序（桌面端）
        const entRow0 = dt('[data-ent-list] [data-ent-row]');
        const entOrderBefore = dtAll('[data-ent-list] [data-ent-row]').map((r) => r.dataset.entRow).join(',');
        if (entRow0) {
          const entY0 = entRow0.getBoundingClientRect().top + 6;
          const ENT_W = dtFrame().contentWindow;
          const ENT_PE = ENT_W.PointerEvent || PointerEvent;
          entRow0.dispatchEvent(new ENT_PE('pointerdown', { bubbles: true, button: 0, clientX: 100, clientY: entY0 }));
          await sleep(40);
          ENT_W.dispatchEvent(new ENT_PE('pointermove', { bubbles: true, clientX: 100, clientY: entY0 + 130 }));
          await sleep(40);
          t('拖拽中行带 drag 标记', !!dt('.bz-home-ent-drag'));
          // 让位动画（2026-09-11 用户报 bug：只移动自身、邻居纹丝不动）
          t('被跨过的邻居行反向位移（让位动画）', (() => {
            const shifted = dtAll('.bz-home-ent-shift');
            if (!shifted.length) return false;
            return shifted.every((el) => el.style.transform.indexOf('translateY(-') === 0);
          })());
          ENT_W.dispatchEvent(new ENT_PE('pointerup', { bubbles: true, clientX: 100, clientY: entY0 + 130 }));
          // 拖拽后有 300ms 点击抑制窗口（防落点误触），必须等过它再做后续点击
          await sleep(520);
        }
        const entOrderAfter = dtAll('[data-ent-list] [data-ent-row]').map((r) => r.dataset.entRow).join(',');
        t('拖拽后列表顺序变化', entOrderAfter !== entOrderBefore);
        t('落地后邻居让位位移已清干净（无残留 transform）', dtAll('.bz-home-ent-shift').length === 0);

        // 落盘形状 = v3 四份数组（顺序与隐藏都按端各一份 → 本端编辑影响不到另一端）
        t('home.json 落盘为 v3（desk/mob/hiddenDesk/hiddenMob 各一份）', (() => {
          const key = Object.keys(localStorage).find((k) => k.indexOf('home.json') >= 0);
          if (!key) return false;
          try {
            const v = JSON.parse(localStorage.getItem(key));
            const j = JSON.parse(v && v.c ? v.c : v);
            return j.version === 3 && Array.isArray(j.desk) && Array.isArray(j.mob) && Array.isArray(j.hiddenDesk) && Array.isArray(j.hiddenMob);
          } catch { return false; }
        })());

        // dir-picker：日记目录 → 打开（先快速首渲染后 adapter 补齐）
        // 前置：本节跟着首页域那节跑，面板停在首页页 —— 先切回日记本域（行的归属域），
        // 否则 diaryRow() 永远找不到行（曾以 undefined.querySelector 崩掉整轮自检）。
        const diaryNav = await waitFor(() => dt('.bz-sp-nav-item[data-sp-domain="diary"]'));
        if (diaryNav) diaryNav.click();
        await waitPaneGroups(3);
        const diaryRow = () => dtAll('.bz-sp-pane .bz-sp-set-row').find((r) => r.querySelector('.bz-sp-set-name')?.textContent === '日记目录');
        await waitFor(() => diaryRow());
        // 打开选择器：有值走 chip（点文本重开）、无值走「选择…」按钮 —— 两种形态都要能开
        // （种子给 diaryDirectory='我的/日记'，所以常态是 chip；空态按钮分支保留给清空后的场景）
        const openDiaryPicker = () => {
          const row = diaryRow();
          const hit = row.querySelector('.bz-sp-path-btn') || row.querySelector('.bz-sp-chip');
          if (hit) hit.click();
          return !!hit;
        };
        t('dir-picker 入口在场（有值 chip / 空态按钮二选一）', openDiaryPicker());
        const pickerRows = () => dtAll('.bz-sp-picker-mask .bz-sp-picker-row');
        await waitFor(() => dt('.bz-sp-picker-mask'));
        t('dir-picker 打开（挂 body 弹层）', !!dt('.bz-sp-picker-mask .bz-sp-picker'));
        // 面包屑回显当前绑定值（种子已设 我的/日记；清空后才会是「未设置」）
        t('dir-picker 面包屑回显当前值', (() => {
          const c = dt('.bz-sp-picker-crumb');
          return !!c && c.textContent.includes('我的') && c.textContent.includes('日记');
        })());
        await waitFor(() => pickerRows().length >= 10 && pickerRows().some((r) => r.textContent.includes('信件')));
        t('dir-picker 降级聚合目录（库根+文件父目录+adapter 补齐）',
          pickerRows().length >= 10 && pickerRows().some((r) => r.textContent.includes('（库根目录）')) &&
          pickerRows().some((r) => r.textContent.includes('信件')) &&
          pickerRows().some((r) => r.textContent.includes('.ENCRYPT')));
        pickerRows().find((r) => r.textContent.includes('日记') && r.textContent.includes('我的 /')).click();
        t('dir-picker 点选高亮+面包屑跟随', dt('.bz-sp-picker-crumb').textContent.includes('我的') && dt('.bz-sp-picker-crumb').textContent.includes('日记'));
        dt('.bz-sp-picker-mask .bz-sp-picker-foot .bz-sp-btn--primary').click();
        await waitFor(() => diaryRow().querySelector('.bz-sp-chip'));
        t('dir-picker 选用落 chip', diaryRow().querySelector('.bz-sp-chip')?.textContent === '我的/日记');
        t('路径键直绑落内存设置（diaryDirectory）', sim().diaryDirectory === '我的/日记');
        t('dir-picker 已关', !dt('.bz-sp-picker-mask'));

        /* ---------- 桌面：影院——下拉键直绑 + 主题联动单卡（seed cinemaStyle=midnight） ---------- */
        dt('.bz-sp-nav-item[data-sp-domain="cinema"]').click();
        await waitPaneGroups(1);
        await waitFor(() => dtAll('.bz-sp-pane .bz-sp-cardpick').length === 2);
        t('影院主题卡联动单卡（夜幕）', dtAll('.bz-sp-pane .bz-sp-cardpick')[1].querySelectorAll('.bz-sp-cardpick-card').length === 1 &&
          dtAll('.bz-sp-pane .bz-sp-cardpick')[1].textContent.includes('夜幕'));
        const sortRow = () => dtAll('.bz-sp-pane .bz-sp-set-row').find((r) => r.querySelector('.bz-sp-set-name')?.textContent === '默认排序');
        await waitFor(() => sortRow());
        sortRow().querySelector('.bz-select').dispatchEvent(new MouseEvent('click', { bubbles: true }));
        // 弹出层观感（2026-09-11 用户：弹出菜单廉价、不真实）——判据取「有独立底色」而不是「看起来还行」：
        // 断言 --sp-pop 与卡片底(--sp-panel)、面板底(--sp-bg) 都不同；改回同色立刻红。
        const selMenuNow = dtAll('.bz-select-menu')[0];
        t('下拉弹出层有独立底色（--sp-pop != 卡片底、!= 面板底，且非透明）', (() => {
          if (!selMenuNow) return false;
          const cs = getComputedStyle(selMenuNow);
          const pop = cs.getPropertyValue('--sp-pop').trim();
          const panel = cs.getPropertyValue('--sp-panel').trim();
          const bg = cs.getPropertyValue('--sp-bg').trim();
          const c = cs.backgroundColor;
          return !!pop && pop !== panel && pop !== bg && c !== 'rgba(0, 0, 0, 0)' && c !== 'transparent';
        })());
        t('下拉弹出层有描边（层级不完全靠阴影）', !!selMenuNow && parseFloat(getComputedStyle(selMenuNow).borderTopWidth) > 0);
        t('下拉项行高 >=30px（不再是 6px 内距的挤行）',
          !!selMenuNow && parseFloat(getComputedStyle(selMenuNow.querySelector('.bz-select-item')).minHeight) >= 30);
        t('下拉弹出层无入场动画（用户要求：不要过度动效）', !!selMenuNow && getComputedStyle(selMenuNow).animationName === 'none');
        const rateOpt = await waitFor(() => dtAll('.bz-select-menu').map((m) => [...m.querySelectorAll('.bz-select-item')]).flat().find((o) => o.textContent.includes('按评分')));
        rateOpt.dispatchEvent(new MouseEvent('click', { bubbles: true }));
        t('下拉键直绑落内存设置（cinemaSortMode=rating）', sim().cinemaSortMode === 'rating');
        t('下拉触发器值跟随', sortRow().querySelector('.bz-select-val')?.textContent === '按评分');

        /* ---------- 移动：域页推入（M1 两页式）+ 键直绑落移动 realm + 返回钮弹回 ---------- */
        t('移动面板开', !!mob('#bz-settings-panel-popup.bz-sp-mobile'));
        t('移动头行关闭钮图标兑现（首页页限定）', !!mob('.bz-sp-mob-page--home .bz-sp-mob-close svg'));
        const mobBelItem = () => mobAll('.bz-sp-mob-item').find((b) => b.querySelector('.bz-sp-mob-name')?.textContent === '归物本');
        mobBelItem().click();
        // M1 两页式：域设置**推入成页**（不是弹窗）——bz-sp-mob-pushed 是页切换的唯一标记
        await waitFor(() => md.querySelector('.bz-sp-mob-page--domain .bz-sp-group'));
        t('域页推入（popup 带 bz-sp-mob-pushed）', !!md.querySelector('#bz-settings-panel-popup.bz-sp-mob-pushed'));
        t('域页标题跟随域名', (md.querySelector('.bz-sp-mob-title') || {}).textContent === '归物本');
        const mobGroups = () => [...md.querySelectorAll('.bz-sp-mob-page--domain .bz-sp-group')];
        await waitFor(() => mobGroups().length >= 2);
        t('域页渲染归物本全部组', mobGroups().length === 2);
        t('域页组序=外观 → 显示', mobGroups().map((g) => g.querySelector('.bz-sp-group-name')?.textContent).join('>') === '外观>显示');
        t('域页无关闭钮（关面板走首页那枚）', md.querySelectorAll('.bz-sp-mob-page--domain .bz-sp-mob-close').length === 0);
        // 键直绑落**移动 realm** 的设置单例（移动 iframe 是独立 JS realm，靠 localStorage 持久层与桌面同源共享）
        const mobSelRow = () => [...md.querySelectorAll('.bz-sp-mob-page--domain .bz-sp-set-row')]
          .find((r) => r.querySelector('.bz-sp-set-name')?.textContent === '默认状态筛选');
        await waitFor(() => mobSelRow());
        mobSelRow().querySelector('.bz-select').dispatchEvent(new MouseEvent('click', { bubbles: true }));
        const mobOpt = await waitFor(() => [...md.querySelectorAll('.bz-select-menu .bz-select-item')].find((o) => o.textContent.includes('使用中')));
        mobOpt.dispatchEvent(new MouseEvent('click', { bubbles: true }));
        t('移动域页下拉键直绑落移动 realm 设置单例', simMob().belongingsDefaultStatus === 'using');
        // 域页头行不再挂关闭钮，取返回钮弹回首页（2026-09-10 拍板交互）
        md.querySelector('.bz-sp-mob-back-btn').dispatchEvent(new MouseEvent('click', { bubbles: true }));
        await sleep(300);
        t('返回钮弹回首页页（pushed 已摘）', !md.querySelector('#bz-settings-panel-popup.bz-sp-mob-pushed'));

        // 移动搜索：域段 + 设置项段（schemaRowCache 预载）
        const mobSearch = mob('.bz-sp-mob-search .bz-input');
        mobSearch.value = 'AI';
        mobSearch.dispatchEvent(new Event('input', { bubbles: true }));
        await waitFor(() => mobAll('.bz-sp-mob-sec').some((s) => s.textContent.startsWith('设置项')));
        t('移动搜索「设置项」段在场', mobAll('.bz-sp-mob-sec').some((s) => s.textContent.startsWith('设置项')));
        t('移动设置项命中行 kind 徽标', mobAll('.bz-sp-mob-kind').length > 0);


        document.title = window.__st.fail.length
          ? 'SELFTEST FAIL ' + window.__st.fail.join(',')
          : `SELFTEST OK ${window.__st.pass}/${window.__st.pass + window.__st.fail.length}`;
        res.textContent = window.__st.fail.length ? '自检失败' : `自检通过 ${window.__st.pass}`;
        res.className = window.__st.fail.length ? 'bad' : 'ok';
      } catch (err) {
        document.title = 'SELFTEST ERR ' + String(err && err.message || err).slice(0, 120)
          + ' | 已过 ' + window.__st.pass + ' 项，失败：' + (window.__st.fail.join('，') || '（无）');
        res.textContent = '自检异常';
        res.className = 'bad';
      }
    })();
  }
})();
</script>
</body>
</html>
