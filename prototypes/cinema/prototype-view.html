<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>影院 · 真行为实例</title>
<!--
  本页 = 影院行为单源评审壳的 iframe 视图（issue 245/ADR-0106）。
  它不实现任何影院交互——只把真行为层跑起来：
    - 载入同一份 CSS（core + 域，与插件同源）
    - 载入 ../host-base.css：真实宿主 app.css 的裸 button 基线（评审壳不载宿主 app.css，
      不补这层就看不出「域样式漏写 justify-content 被宿主 center 压盖」这类真机差异）
    - 载入 prototype-behavior.js（真 ui.ts 依赖链，alias obsidian→fake）
    - boot + openCinema：午夜场面板 append 到本页 body（iframe 即全屏视口），
      桌面视图 920×640 = 900×620 面板居中；移动视图 396×780 = Platform.isMobile（视口判定）
  宿主差异（数据/图标/视口）由 fake/fake-obsidian / prototype-icons.js 提供；
  午夜场自绘主题变量挂 .bz-cinema--midnight 域根类，随 body.theme-light/dark 翻转。
-->
<link rel="stylesheet" href="../host-base.css"><!-- 宿主 app.css 的裸 button 基线（真机口径；见该文件头注释） -->
<link rel="stylesheet" href="../../src/core/styles.css">
<link rel="stylesheet" href="../../src/core/ui/tokens.css">
<link rel="stylesheet" href="../../src/core/ui/components.css">
<link rel="stylesheet" href="../../src/cinema/styles.css">
<script src="./prototype-icons.js"></script>
<script src="./prototype-behavior.js"></script>
<style>
  /* iframe 内全屏面板：清掉 body 边距，让 .bz-panel-overlay 铺满 */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body { background: #e3e0d8; font-family: system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif; }
  /* 模拟 Obsidian 宿主变量（core 弹层/菜单取值用；插件内由主题提供） */
  body {
    --background-primary: #fbf9f3; --text-normal: #171512; --text-muted: #8b8474; --text-faint: #b3ab99;
    --text-error: #b3564d; --background-modifier-hover: rgba(23,21,18,.06); --color-green: #3d8f5d;
    --background-modifier-border: rgba(23,21,18,.12); --input-shadow: none;
    --interactive-normal: #fff; --interactive-accent: #3d8f5d; --shadow-s: 0 1px 3px rgba(0,0,0,.1);
  }
</style>
</head>
<body class="theme-light">
<script>
  /* 宿主保真（演示钩子，评审壳专用）：Obsidian 移动端原生顶栏/底栏占位（约 44px+44px）
     在 webview 视口之外，使 --bz-vvh（visualViewport 口径，issue 266）短于 100vh——
     真机上面板若走 overlay 居中链，顶部会空出 44px（用户真机反馈 2026-09-10）。
     壳按此口径模拟（--bz-vvh = 100vh - 88px），复现顶距供评审；配合 styles.css 里
     「移动壳顶部对齐」修复，可见面板贴顶、底边落在可视视口下沿。 */
  if (new URLSearchParams(location.search).get('mob')) {
    document.documentElement.style.setProperty('--bz-vvh', 'calc(100vh - 88px)');
  }
</script>
<script>
  (function () {
    var B = window.BZW_cinema;
    B.bootCinemaSim();
    B.openCinema();
  })();
</script>
</body>
</html>
