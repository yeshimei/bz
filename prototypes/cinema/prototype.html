<script>
(function () {
  /* ==================== 壳基座（仅外景）：两个真行为 iframe + storage 桥 ====================
   * 行为全部在 iframe 内跑真 ui.ts（prototype-behavior.js）；本页只做：
   *  - 数据基座（CINEMA_DATA 经父页全局供 fake-sim 种子读）
   *  - 重置演示数据（清 localStorage bz-sim:* 后重载 iframe）
   *  - 分季合并开关（默认开；关时向 iframe 传 ?merge=0——插件侧该键走插件设置页，原型没有设置页入口）
   *  - 自检（?selftest=1）：经 iframe contentDocument 访问真 DOM 断言
   */
  const DATA = window.CINEMA_DATA || [];

  /** 分季合并评审开关（cinemaMergeSeasons 在评审壳里没有设置页入口 → 壳给 URL 开关；
   *  与插件默认一致 = **开**。自检基线按「关」的口径断言卡片数（逐季一卡 = 种子条数），
   *  故 selftest 模式强制关；重置演示数据也回到默认开） */
  const MERGE_KEY = 'bz-cinema-proto-merge';
  const mergeOn = () => localStorage.getItem(MERGE_KEY) !== '0';
  if (location.search.includes('selftest')) localStorage.setItem(MERGE_KEY, '0');

  const resetSim = () => {
    const kill = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith('bz-sim:')) kill.push(k);
    }
    kill.forEach((k) => localStorage.removeItem(k));
    // 旧自绘壳数据键一并清（防误读旧壳残留；MERGE_KEY 清掉 = 回默认「开」）
    ['bz-cinema-proto-db', 'bz-cinema-proto', 'bz-cinema-proto-set', 'bz-cinema-proto-theme', MERGE_KEY].forEach((k) => localStorage.removeItem(k));
  };

  const dtFrame = () => document.querySelector('#dtHost iframe');
  const mobFrame = () => document.querySelector('#mobHost iframe');
  const dtDoc = () => dtFrame().contentDocument;
  const mobDoc = () => mobFrame().contentDocument;

  /** iframe src 由本函数统一设置（含合并开关参数）：改 src 即重载 → 行为层重新 boot 读参数。
   *  默认开 → 传的是关的参数 `merge=0`（fake-sim 侧只认 `?merge=0` 关闭） */
  const applyFrames = () => {
    const tail = mergeOn() ? '' : 'merge=0';
    dtFrame().src = './prototype-view.html' + (tail ? '?' + tail : '');
    mobFrame().src = './prototype-view.html?mob=1' + (tail ? '&' + tail : '');
    document.querySelector('#mergeToggle').textContent = '分季合并：' + (mergeOn() ? '开' : '关');
  };
  document.querySelector('#mergeToggle').addEventListener('click', () => {
    localStorage.setItem(MERGE_KEY, mergeOn() ? '0' : '1'); // '1' = 显式开（与「未设置 = 默认开」等价）
    applyFrames();
  });
  applyFrames();
  // 轮询现取 contentDocument：iframe 加载前后 document 引用会替换（about:blank → 真实文档），
  // 不能缓存旧引用等面板——每次现查，跨文档访问本身同源安全。
  const waitFrame = (getDoc) => new Promise((res, rej) => {
    const started = Date.now();
    const tries = () => {
      try {
        const doc = getDoc();
        if (doc && doc.querySelector('section.bz-cinema--midnight')) return res(doc);
        if (Date.now() - started > 25000) return rej(new Error('iframe 面板超时'));
        setTimeout(tries, 150);
      } catch (e) { setTimeout(tries, 150); }
    };
    tries();
  });

  document.querySelector('#mobToggle').addEventListener('click', () => {
    const m = document.querySelector('#mobHost');
    const hidden = m.style.display === 'none';
    m.style.display = hidden ? '' : 'none';
    document.querySelector('#mobToggle').textContent = hidden ? '隐藏移动端' : '显示移动端';
  });

  document.querySelector('#reset').addEventListener('click', () => {
    resetSim();
    location.reload();
  });

  /* ==================== 自检（?selftest=1）：真行为 DOM 断言（经 iframe） ==================== */
  if (location.search.includes('selftest')) {
    window.__st = { pass: 0, fail: [] };
    const t = (name, cond) => cond ? window.__st.pass++ : window.__st.fail.push(name);
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    /** 轮询等待条件成立（解析分两段后时序变宽，固定 sleep 容易 flake） */
    const until = async (fn, ms = 4000) => {
      const t0 = Date.now();
      while (Date.now() - t0 < ms) { if (fn()) return true; await sleep(50); }
      return false;
    };
    (async () => {
      const res = document.querySelector('#stResult');
      try {
        // 数据基线检查：种子应是全量 DATA 条、无自检测试片、且各片评分口径与种子一致
        // （状态流转跑崩在还原前 → 下次启动也能识别为脏）。脏则重置重载一次。
        // headless 验收每次全新 profile 天然干净；浏览器手动重复跑 selftest 也能自清理。
        const countSimMd = () => {
          let n = 0;
          for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (k && k.startsWith('bz-sim:我的/影视/') && k.endsWith('.md')) n++;
          }
          return n;
        };
        const seedRating = (x) => (x.status === '想看' ? '-1' : x.status === '在看' ? '0' : x.rating == null ? '' : String(x.rating));
        const seedDirty = () => {
          for (const x of DATA) {
            if (!x || !x.name) continue;
            const raw = localStorage.getItem('bz-sim:我的/影视/《' + x.name + '》.md');
            if (raw == null) return true;
            const m = /^评分:[ \t]*(.*)$/m.exec(raw);
            if (!m || m[1].trim() !== seedRating(x)) return true;
          }
          return false;
        };
        const dirty = countSimMd() !== DATA.length || !!localStorage.getItem('bz-sim:我的/影视/《测试影片》.md') || seedDirty();
        if (dirty && !location.search.includes('reset=1')) {
          resetSim();
          location.search = '?selftest=1&reset=1';
          return;
        }
        const dd = await waitFrame(dtDoc);
        const md = await waitFrame(mobDoc);
        res.textContent = '…';
        const dt = (sel) => dd.querySelector(sel);
        const mob = (sel) => md.querySelector(sel);
        const dtCards = () => dd.querySelectorAll('.d-scroll .pcard').length;
        const mobCards = () => md.querySelectorAll('.m-grid .pcard').length;
        const firstDeskName = () => dt('.d-scroll .pcard .pname')?.textContent || '';
        const cardByName = (doc, name) => [...doc.querySelectorAll('.pcard')].find((c) => c.querySelector('.pname')?.textContent === name);
        const badgeOf = (card) => card?.querySelector('.badge')?.textContent || null;
        const fmField = (name, field) => {
          const raw = localStorage.getItem('bz-sim:我的/影视/《' + name + '》.md') || '';
          const m = new RegExp('^' + field + ':[ \\t]*(.*)$', 'm').exec(raw);
          return m ? m[1].trim() : null;
        };
        // 带真实坐标的完整鼠标序列（右键菜单项/确认钮：纯 .click() 可能被外点关闭逻辑吞掉）
        const clickReal = (el) => {
          if (!el) return;
          const r = el.getBoundingClientRect();
          const mk = (type) => new MouseEvent(type, { clientX: r.left + 10, clientY: r.top + 10, bubbles: true, cancelable: true });
          el.dispatchEvent(mk('mousedown'));
          el.dispatchEvent(mk('mouseup'));
          el.dispatchEvent(mk('click'));
        };
        const ctxCard = (card) => {
          const r = card.getBoundingClientRect();
          card.dispatchEvent(new MouseEvent('contextmenu', { clientX: r.left + 10, clientY: r.top + 10, bubbles: true, cancelable: true }));
        };
        // 期望值（与 data.ts 同口径从种子现算，不硬编码）
        const watched = DATA.filter((x) => x.status === '已看').length;
        const movies = DATA.filter((x) => x.group === '电影').length;
        const dateVal = (x) => { const t2 = new Date(x.watchDate || '').getTime(); return isNaN(t2) ? 0 : t2; };
        const topRated = [...DATA].filter((x) => x.status === '已看' && x.rating > 0)
          .sort((a, b) => b.rating - a.rating || dateVal(b) - dateVal(a))[0];
        const topDate = DATA.reduce((m, x) => (dateVal(x) > dateVal(m) ? x : m), DATA[0]);
        const searchKw = '肖申克';
        const searchHit = DATA.filter((x) => ((x.name || '') + (x.typeTag || '') + (x.review || '') + (x.director || '') + (x.actors || '')).includes(searchKw)).length;

        t('桌面面板开', !!dt('section.bz-cinema--midnight') && !!dt('.d-rail'));
        t('移动面板开', !!mob('section.mob.bz-cinema--midnight') && !!mob('.m-head'));
        // view 页 CSS 四链生效（belongings 壳曾写错 ../../ 深度致 404、DOM 自检抓不到——此断言防再犯）
        const cssAlive = (doc) => {
          const sec = doc.querySelector('section.bz-cinema--midnight');
          const bg = getComputedStyle(sec).backgroundColor;
          let sheets = 0;
          for (const s of doc.styleSheets) { try { if (s.cssRules.length > 0) sheets++; } catch { /* 跨域忽略 */ } }
          return bg !== 'rgba(0, 0, 0, 0)' && sheets >= 4;
        };
        t('view页CSS四链生效', cssAlive(dd) && cssAlive(md));
        t('桌面' + DATA.length + '卡', dtCards() === DATA.length);
        t('移动' + DATA.length + '卡', mobCards() === DATA.length);
        t('侧栏类型7行', dd.querySelectorAll('.j-groups [data-g]').length === 7);
        t('侧栏状态3行', dd.querySelectorAll('.j-status [data-s]').length === 3);
        t('rail计数=数据口径', dt('.j-groups [data-g="全部"] .n')?.textContent === String(DATA.length)
          && dt('.j-status [data-s="已看"] .n')?.textContent === String(watched));
        t('移动chips10枚', md.querySelectorAll('.j-chips .chip').length === 10);

        // 组筛选（桌面）
        dt('[data-g="电影"]').click();
        await sleep(80);
        t('电影筛选' + movies + '卡', dtCards() === movies && dt('.d-head .j-title')?.textContent === '电影');
        dt('[data-g="全部"]').click();
        await sleep(80);
        t('回全部' + DATA.length + '卡', dtCards() === DATA.length);

        // 状态筛选（移动 chips）
        mob('.chip[data-s="已看"]').click();
        await sleep(80);
        t('移动已看筛选', mobCards() === watched && mob('.j-mtitle')?.textContent === '全部 · 已看');
        mob('.chip[data-c="all"]').click();
        await sleep(80);
        t('chips回全部', mobCards() === DATA.length);

        // 排序三档（桌面）
        dt('.j-sort [data-k="rating"]').click();
        await sleep(80);
        t('评分排序首位=' + topRated.name, firstDeskName() === topRated.name && dt('.j-sort [data-k="rating"]').classList.contains('is-on'));
        dt('.j-sort [data-k="created"]').click();
        await sleep(80);
        t('创建排序首位=导出首部', firstDeskName() === DATA[0].name);
        dt('.j-sort [data-k="date"]').click();
        await sleep(80);
        t('日期排序首位=' + topDate.name, firstDeskName() === topDate.name && dt('.j-sort [data-k="date"]').classList.contains('is-on'));

        // 搜索（桌面，防抖 300ms）
        const q = dt('.j-q');
        q.value = searchKw; q.dispatchEvent(new Event('input', { bubbles: true }));
        await sleep(600);
        t('搜索' + searchKw + searchHit + '部', dtCards() === searchHit && dt('.d-head .j-cnt')?.textContent === '· ' + searchHit + ' 部');
        q.value = ''; q.dispatchEvent(new Event('input', { bubbles: true }));
        await sleep(600);

        // AI 荐片降级（桌面）：无密钥 → requestUrl/配置层报错 → 页内错误态不崩
        dt('[data-tool="ai"]').click();
        await sleep(80);
        t('AI页待机', dt('.sp-title')?.textContent === 'AI 荐片' && !!dt('[data-cinema-ai-start]'));
        dt('[data-cinema-ai-start]').click();
        await sleep(500);
        t('AI降级错误页不崩', !!dt('.ai-err-ic') && dt('.ai-title')?.textContent === 'AI 分析失败'
          && dt('[data-cinema-ai-start]')?.textContent.includes('重试'));
        dt('.j-back').click();
        await sleep(80);
        t('AI页返回列表', !!dt('.d-head'));

        // 观影分析页（桌面，analysis.ts 真统计）
        dt('[data-tool="stat"]').click();
        await sleep(80);
        t('分析页19板块', dt('.sp-title')?.textContent === '观影分析' && dd.querySelectorAll('.stat-card').length === 4
          && dd.querySelectorAll('.sec').length === 19 && dt('.sp-cnt')?.textContent === '· ' + watched + ' 部已看');
        dt('.j-back').click();
        await sleep(80);

        // 表单（桌面，issue 395 双面卡片）：正面只有名称 + 状态 → 解析 → 翻面 → 背面保存
        dt('[data-cinema-add]').click();
        await sleep(80);
        t('正面只有名称与状态', dt('.cn-modal .cn-modal-title')?.textContent === '添加影视'
          && !dt('.cn-modal .form-face--front .j-tags') && !!dt('.cn-modal .j-parse'));
        dt('.cn-modal .j-name').value = '测试影片';
        dt('.cn-modal .j-parse').click();
        // 原型罐头：豆瓣两跳各 500ms → 约 1 秒翻面；Jev 判定再 1 秒（真实插件无这些延迟）
        t('约1秒后翻面', await until(() => !!dt('.cn-modal .form-flip.is-flipped'), 2600));
        t('背面是详情形制', !!dt('.cn-modal .form-face--back .dm-title') && !dt('.cn-modal .form-face--back .j-rating'));
        t('无返回按钮', !dt('.cn-modal .j-flip-back'));
        t('徽标无小三角', !dt('.cn-modal .form-face--back .dm-caret'));
        // 翻面时分类还在判定：占位骨架 + 保存锁着（2026-09-21 拆两段）
        t('分类先占位', !!dt('.cn-modal .form-face--back .dm-chip--pick.is-pending'));
        t('判定中锁保存', dt('.cn-modal .j-save').disabled);
        t('分类占位换真值', await until(() => !dt('.cn-modal .form-face--back .dm-chip--pick.is-pending')
          && !!dt('.cn-modal .form-face--back [data-pick="tag"]'), 4000));
        t('判定完解锁保存', !dt('.cn-modal .j-save').disabled);
        // 分类徽标 → 下拉展开 → 选中即回填（就地换徽标同时收起）
        // 下拉展开/收起走 .is-open 类（不再是 hidden 瞬切，见 styles.css 全域动效段）
        t('分类下拉初始收起', !dt('.cn-modal [data-pick-list="tag"]').classList.contains('is-open'));
        dt('.cn-modal .form-face--back [data-pick="tag"]').click();
        await sleep(80);
        t('分类下拉展开', dt('.cn-modal [data-pick-list="tag"]').classList.contains('is-open'));
        t('下拉候选13项', dt('.cn-modal [data-pick-list="tag"]').querySelectorAll('.dm-pick-item[data-f-tag]').length === 13);
        dt('.cn-modal [data-pick-list="tag"] [data-f-tag="美剧"]').click();
        await sleep(80);
        t('下拉选中回填', (dt('.cn-modal .form-face--back [data-pick="tag"]')?.textContent || '').includes('美剧')
          && !dt('.cn-modal [data-pick-list="tag"]').classList.contains('is-open'));
        // 状态下拉 → 已看（评分按 DEFAULT_RATING 落盘，见下方 fmField 断言）
        dt('.cn-modal .form-face--back [data-pick="st"]').click();
        await sleep(80);

          await until(() => dq(gridSel).querySelectorAll('.cn-exit').length === 0, 3000);
          t('幽灵自清（不留残影）', dq(gridSel).querySelectorAll('.cn-exit').length === 0);
          dq('.d-rail .rail-item[data-g="全部"]').click();
          await sleep(300);

          // 打断即折返（issue 401）：点卡起飞 → 起飞途中点遮罩 → 海报带着图飞回源卡
          const bCard = [...dv.querySelectorAll(gridSel + ' .pcard')].find((c) => c.querySelector('.pw img[src]'));
          t('有带海报的卡可演飞行', !!bCard);
          if (bCard) {
            bCard.click();
            await sleep(60);
            // 去掉 !important 之后（issue 401）接力动画仍必须被压住——那是「同权重 + 排在更后」
            // 才成立的约定，这条断言就是那个约定的守卫（改回选择器权重/挪动段序会当场红）
            const flyKid = dv.querySelector('.cn-modal--fly > *');
            const flyModal = dv.querySelector('.cn-modal--fly');
            t('fly 通道压住面板入场与内容接力（不靠 !important）',
              !!flyKid && !!flyModal && getComputedStyle(flyKid).animationName === 'none'
              && getComputedStyle(flyModal).animationName === 'none',
              flyKid ? `段=${getComputedStyle(flyKid).animationName} 面板=${getComputedStyle(flyModal).animationName}` : '没有 .cn-modal--fly');
            const flying = dv.querySelectorAll('.cn-fly').length;
            dv.querySelector('.cn-ovl').click(); // 起飞途中关（ESC / 点遮罩同路径）
            await sleep(30);
            const folding = dv.querySelectorAll('.cn-fly').length; // 折返中：飞行件还在（被搬到共享宿主）
            let home = false;
            for (let i = 0; i < 80 && !home; i++) {
              home = !dv.querySelector('.cn-ovl') && !dv.querySelector('.cn-fly') && bCard.style.display === '';
              if (!home) await sleep(40);
            }
            t('起飞中关：海报折返、卡归位（不硬切）', flying === 1 && folding === 1 && home,
              `起飞件=${flying} 折返件=${folding} 归位=${home}`);
          }

          // 星级点亮 + 保存折回（issue 403）：拖评分滑杆 → 星预览逐颗点亮；保存 → 卡落位闪、面板折回
          dq(gridSel + ' .pcard').click();
          await until(() => !!dv.querySelector('.cn-ovl .j-edit'), 5000);
          dv.querySelector('.cn-ovl .j-edit').click();
          await until(() => !!dv.querySelector('.cn-ovl .j-range'), 5000);
          const rng = dv.querySelector('.cn-ovl .j-range');
          const starsBox = dv.querySelector('.cn-ovl .j-stars');
          rng.value = '4';
          rng.dispatchEvent(new Event('input', { bubbles: true }));
          const lit4 = starsBox.querySelectorAll('i.is-on').length;
          rng.value = '9';
          rng.dispatchEvent(new Event('input', { bubbles: true }));
          const lit9 = starsBox.querySelectorAll('i.is-on').length;
          t('评分滑杆星预览逐颗点亮', lit4 === 2 && lit9 === 4, `4分=${lit4}颗 9分=${lit9}颗`);

          const formOv = dv.querySelector('.cn-ovl');
          formOv.querySelector('.j-save').click();
          await sleep(60);
          const foldAnim = (formOv.getAnimations?.() ?? [])
            .some((a) => (a.effect?.getKeyframes?.() ?? []).some((k) => !!k.clipPath));
          t('保存后面板折回卡片（clip-path 收势）', foldAnim);
          const flash = [...dv.querySelectorAll(gridSel + ' .pcard .pw')].some((pw) => (pw.getAnimations?.() ?? [])
            .some((a) => (a.effect?.getKeyframes?.() ?? []).some((k) => !!k.boxShadow)));
          t('保存后目标卡落位闪', flash);
          for (let i = 0; i < 60 && dv.querySelector('.cn-ovl'); i++) await sleep(40);
          t('折回结束层已收', !dv.querySelector('.cn-ovl'));

          // 方向键导航（issue 403）：焦点在第一张卡 → 右 → 落到第二张（真矩形下按几何选）
          const kbCards = [...dq(gridSel).querySelectorAll('.pcard')];
          kbCards[0].focus();
          kbCards[0].dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true, cancelable: true }));
          t('方向键移动焦点（几何最近）', dv.activeElement === kbCards[1]);
          kbCards[0].focus();
        }

        document.title = window.__st.fail.length
          ? 'SELFTEST FAIL ' + window.__st.fail.join(',')
          : `SELFTEST OK ${window.__st.pass}/${window.__st.pass + window.__st.fail.length}`;
        res.textContent = window.__st.fail.length ? '自检失败' : `自检通过 ${window.__st.pass}`;
        res.className = window.__st.fail.length ? 'bad' : 'ok';
      } catch (err) {
        // 报错必须带进度：只报 message 时无法判断断在哪一步（2026-09-21 排查双面卡片时吃过亏）
        document.title = 'SELFTEST ERR @pass=' + window.__st.pass
          + ' fail=[' + window.__st.fail.join('|') + '] ' + (err && err.message || err);
        res.textContent = '自检异常';
        res.className = 'bad';
      }
    })();
  }
})();
</script>
</body>
</html>
