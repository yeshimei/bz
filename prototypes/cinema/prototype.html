<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>影院 · 原型预览（真行为单源）</title>
<!--
  ┌────────────────────────────────────────────────────────────────────────┐
  │ 本文件 = 影院域 UI 的评审壳（行为单源版，issue 245/ADR-0106）。           │
  │ 组件样式零内联，全部来自（与 build-css SOURCES 同序）：                    │
  │   ../core/styles.css → ../core/ui/tokens.css → ../core/ui/components.css │
  │   → ./styles.css                                                        │
  │ markup 单源（ADR-0104/0105）：午夜场 HTML 出自 ./prototype-render.js       │
  │   （src/cinema/render.ts 构建）。                                        │
  │ 行为单源（issue 245/ADR-0106）：交互逻辑全部是插件同款 ui.ts 依赖链——      │
  │   经 ./prototype-behavior.js（src/cinema/fake-sim.ts 构建，               │
  │   alias obsidian→公共假层）在下方两个 iframe 视图里跑真行为；              │
  │   桌面 iframe 宽视口 = 桌面布局（900×620 面板居中）；移动 iframe 412×915 = │
  │   Platform 视口判定 → 移动布局。数据 = 我的/影视/*.md 笔记（localStorage   │
  │   文件系统，跨 iframe storage 桥同步——完整模拟插件「外部变更自动刷新」）。  │
  │ 壳内只允许：外景容器样式、评审徽牌、演示钩子与自检。                        │
  │ 旧自绘壳（三风格切换/场刊/放映室探索稿/AI mock 池）随行为单源退役：         │
  │   真行为层本批只上岸午夜场（cinemaStyleOf 非法值回落 midnight）。           │
  └────────────────────────────────────────────────────────────────────────┘
-->
<link rel="stylesheet" href="../../src/core/styles.css">
<link rel="stylesheet" href="../../src/core/ui/tokens.css">
<link rel="stylesheet" href="../../src/core/ui/components.css">
<link rel="stylesheet" href="../../src/cinema/styles.css">
<link rel="stylesheet" href="../mob-1to1.css">
<script src="../mob-1to1.js"></script>
<style>
  /* ===== 以下全部是演示壳，禁止放组件样式 ===== */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; gap: 28px; padding: 32px 24px;
    background: #dcd8cd; font-family: system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif; }
  /* 模拟 Obsidian 宿主变量（core/styles.css 的右键菜单/底部抽屉取值用；插件内由主题提供） */
  body {
    --background-primary: #fbf9f3; --text-normal: #171512; --text-muted: #8b8474; --text-faint: #b3ab99;
    --text-error: #b3564d; --background-modifier-hover: rgba(23,21,18,.06); --color-green: #3d8f5d;
  }
  * { scrollbar-width: none; } *::-webkit-scrollbar { display: none; }

  /* 桌面外景（真行为 iframe：面板 append iframe body，宽度决定布局） */
  .demo-dt { flex: none; width: 920px; height: 640px; }
  /* 移动外景：412×915 iframe → Platform 视口判定移动布局（412×915 面板满幅） */
  .demo-mob { width: 412px; height: 915px; border-radius: 26px; overflow: hidden; flex: none;
    border: 1px solid #b8b0a0; box-shadow: 0 8px 30px rgba(0,0,0,.16); background: #f5f2ec; }
  .demo-frame { width: 100%; height: 100%; border: 0; display: block; }

  /* 评审徽牌（演示壳自用） */
  .vbadge { position: fixed; right: 16px; bottom: 12px; font-size: 11px; color: #8b8474; display: flex; gap: 10px; align-items: center;
    background: rgba(255,255,255,.92); border: 1px solid #c9c2b2; padding: 3px 8px; z-index: 900; }
  .vbadge button { border: none; background: none; color: #b3564d; font: 11px 'Microsoft YaHei'; cursor: pointer; }
  .vbadge .ok { color: #3d8f5d; }
  .vbadge .bad { color: #b3564d; }
</style>
</head>
<body class="theme-light"> <!-- 模拟 Obsidian 宿主：色彩 token 挂 theme-light/dark，壳内必须补一类才不透明 -->
  <div id="dtHost" class="demo-dt"><iframe class="demo-frame" src="./prototype-view.html" title="影院·桌面"></iframe></div>
  <div id="mobHost" class="demo-mob-wrap"><div class="demo-mob"><iframe class="demo-frame" src="./prototype-view.html?mob=1" title="影院·移动"></iframe></div></div>

  <div class="vbadge">影院 · 真行为单源预览（桌面=真 ui.ts 跑在 920px，移动=412×915）
    <button id="mobToggle">隐藏移动端</button>
    <button id="reset">重置演示数据</button>
    <span id="stResult"></span>
  </div>

<script src="./prototype-icons.js"></script>
<script src="./prototype-data.js"></script>
<script src="./prototype-render.js"></script>
<script>
(function () {
  /* ==================== 壳基座（仅外景）：两个真行为 iframe + storage 桥 ====================
   * 行为全部在 iframe 内跑真 ui.ts（prototype-behavior.js）；本页只做：
   *  - 数据基座（CINEMA_DATA 经父页全局供 fake-sim 种子读）
   *  - 重置演示数据（清 localStorage bz-sim:* 后重载 iframe）
   *  - 自检（?selftest=1）：经 iframe contentDocument 访问真 DOM 断言
   */
  const DATA = window.CINEMA_DATA || [];

  const resetSim = () => {
    const kill = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith('bz-sim:')) kill.push(k);
    }
    kill.forEach((k) => localStorage.removeItem(k));
    // 旧自绘壳数据键一并清（防误读旧壳残留）
    ['bz-cinema-proto-db', 'bz-cinema-proto', 'bz-cinema-proto-set', 'bz-cinema-proto-theme'].forEach((k) => localStorage.removeItem(k));
  };

  const dtFrame = () => document.querySelector('#dtHost iframe');
  const mobFrame = () => document.querySelector('#mobHost iframe');
  const dtDoc = () => dtFrame().contentDocument;
  const mobDoc = () => mobFrame().contentDocument;
  // 轮询现取 contentDocument：iframe 加载前后 document 引用会替换（about:blank → 真实文档），
  // 不能缓存旧引用等面板——每次现查，跨文档访问本身同源安全。
  const waitFrame = (getDoc) => new Promise((res, rej) => {
    const started = Date.now();
    const tries = () => {
      try {
        const doc = getDoc();
        if (doc && doc.querySelector('section.bz-cinema--midnight')) return res(doc);
        if (Date.now() - started > 25000) return rej(new Error('iframe 面板超时'));
        setTimeout(tries, 150);
      } catch (e) { setTimeout(tries, 150); }
    };
    tries();
  });

  document.querySelector('#mobToggle').addEventListener('click', () => {
    const m = document.querySelector('#mobHost');
    const hidden = m.style.display === 'none';
    m.style.display = hidden ? '' : 'none';
    document.querySelector('#mobToggle').textContent = hidden ? '隐藏移动端' : '显示移动端';
  });

  document.querySelector('#reset').addEventListener('click', () => {
    resetSim();
    location.reload();
  });

  /* ==================== 自检（?selftest=1）：真行为 DOM 断言（经 iframe） ==================== */
  if (location.search.includes('selftest')) {
    window.__st = { pass: 0, fail: [] };
    const t = (name, cond) => cond ? window.__st.pass++ : window.__st.fail.push(name);
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    (async () => {
      const res = document.querySelector('#stResult');
      try {
        // 数据基线检查：种子应是 50 部、无自检测试片、且各片评分口径与种子一致
        // （状态流转跑崩在还原前 → 下次启动也能识别为脏）。脏则重置重载一次。
        // headless 验收每次全新 profile 天然干净；浏览器手动重复跑 selftest 也能自清理。
        const countSimMd = () => {
          let n = 0;
          for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (k && k.startsWith('bz-sim:我的/影视/') && k.endsWith('.md')) n++;
          }
          return n;
        };
        const seedRating = (x) => (x.status === '想看' ? '-1' : x.status === '在看' ? '0' : x.rating == null ? '' : String(x.rating));
        const seedDirty = () => {
          for (const x of DATA) {
            if (!x || !x.name) continue;
            const raw = localStorage.getItem('bz-sim:我的/影视/《' + x.name + '》.md');
            if (raw == null) return true;
            const m = /^评分:[ \t]*(.*)$/m.exec(raw);
            if (!m || m[1].trim() !== seedRating(x)) return true;
          }
          return false;
        };
        const dirty = countSimMd() !== DATA.length || !!localStorage.getItem('bz-sim:我的/影视/《测试影片》.md') || seedDirty();
        if (dirty && !location.search.includes('reset=1')) {
          resetSim();
          location.search = '?selftest=1&reset=1';
          return;
        }
        const dd = await waitFrame(dtDoc);
        const md = await waitFrame(mobDoc);
        res.textContent = '…';
        const dt = (sel) => dd.querySelector(sel);
        const mob = (sel) => md.querySelector(sel);
        const dtCards = () => dd.querySelectorAll('.d-scroll .pcard').length;
        const mobCards = () => md.querySelectorAll('.m-grid .pcard').length;
        const firstDeskName = () => dt('.d-scroll .pcard .pname')?.textContent || '';
        const cardByName = (doc, name) => [...doc.querySelectorAll('.pcard')].find((c) => c.querySelector('.pname')?.textContent === name);
        const badgeOf = (card) => card?.querySelector('.badge')?.textContent || null;
        const fmField = (name, field) => {
          const raw = localStorage.getItem('bz-sim:我的/影视/《' + name + '》.md') || '';
          const m = new RegExp('^' + field + ':[ \\t]*(.*)$', 'm').exec(raw);
          return m ? m[1].trim() : null;
        };
        // 带真实坐标的完整鼠标序列（右键菜单项/确认钮：纯 .click() 可能被外点关闭逻辑吞掉）
        const clickReal = (el) => {
          if (!el) return;
          const r = el.getBoundingClientRect();
          const mk = (type) => new MouseEvent(type, { clientX: r.left + 10, clientY: r.top + 10, bubbles: true, cancelable: true });
          el.dispatchEvent(mk('mousedown'));
          el.dispatchEvent(mk('mouseup'));
          el.dispatchEvent(mk('click'));
        };
        const ctxCard = (card) => {
          const r = card.getBoundingClientRect();
          card.dispatchEvent(new MouseEvent('contextmenu', { clientX: r.left + 10, clientY: r.top + 10, bubbles: true, cancelable: true }));
        };
        // 期望值（与 data.ts 同口径从种子现算，不硬编码）
        const watched = DATA.filter((x) => x.status === '已看').length;
        const movies = DATA.filter((x) => x.group === '电影').length;
        const dateVal = (x) => { const t2 = new Date(x.watchDate || '').getTime(); return isNaN(t2) ? 0 : t2; };
        const topRated = [...DATA].filter((x) => x.status === '已看' && x.rating > 0)
          .sort((a, b) => b.rating - a.rating || dateVal(b) - dateVal(a))[0];
        const topDate = DATA.reduce((m, x) => (dateVal(x) > dateVal(m) ? x : m), DATA[0]);
        const searchKw = '肖申克';
        const searchHit = DATA.filter((x) => ((x.name || '') + (x.typeTag || '') + (x.review || '') + (x.director || '') + (x.actors || '')).includes(searchKw)).length;

        t('桌面面板开', !!dt('section.bz-cinema--midnight') && !!dt('.d-rail'));
        t('移动面板开', !!mob('section.mob.bz-cinema--midnight') && !!mob('.m-head'));
        // view 页 CSS 四链生效（belongings 壳曾写错 ../../ 深度致 404、DOM 自检抓不到——此断言防再犯）
        const cssAlive = (doc) => {
          const sec = doc.querySelector('section.bz-cinema--midnight');
          const bg = getComputedStyle(sec).backgroundColor;
          let sheets = 0;
          for (const s of doc.styleSheets) { try { if (s.cssRules.length > 0) sheets++; } catch { /* 跨域忽略 */ } }
          return bg !== 'rgba(0, 0, 0, 0)' && sheets >= 4;
        };
        t('view页CSS四链生效', cssAlive(dd) && cssAlive(md));
        t('桌面50卡', dtCards() === DATA.length);
        t('移动50卡', mobCards() === DATA.length);
        t('侧栏类型7行', dd.querySelectorAll('.j-groups [data-g]').length === 7);
        t('侧栏状态3行', dd.querySelectorAll('.j-status [data-s]').length === 3);
        t('rail计数=数据口径', dt('.j-groups [data-g="全部"] .n')?.textContent === String(DATA.length)
          && dt('.j-status [data-s="已看"] .n')?.textContent === String(watched));
        t('移动chips10枚', md.querySelectorAll('.j-chips .chip').length === 10);

        // 组筛选（桌面）
        dt('[data-g="电影"]').click();
        await sleep(80);
        t('电影筛选' + movies + '卡', dtCards() === movies && dt('.d-head .j-title')?.textContent === '电影');
        dt('[data-g="全部"]').click();
        await sleep(80);
        t('回全部' + DATA.length + '卡', dtCards() === DATA.length);

        // 状态筛选（移动 chips）
        mob('.chip[data-s="已看"]').click();
        await sleep(80);
        t('移动已看筛选', mobCards() === watched && mob('.j-mtitle')?.textContent === '全部 · 已看');
        mob('.chip[data-c="all"]').click();
        await sleep(80);
        t('chips回全部', mobCards() === DATA.length);

        // 排序三档（桌面）
        dt('.j-sort [data-k="rating"]').click();
        await sleep(80);
        t('评分排序首位=' + topRated.name, firstDeskName() === topRated.name && dt('.j-sort [data-k="rating"]').classList.contains('is-on'));
        dt('.j-sort [data-k="created"]').click();
        await sleep(80);
        t('创建排序首位=导出首部', firstDeskName() === DATA[0].name);
        dt('.j-sort [data-k="date"]').click();
        await sleep(80);
        t('日期排序首位=' + topDate.name, firstDeskName() === topDate.name && dt('.j-sort [data-k="date"]').classList.contains('is-on'));

        // 搜索（桌面，防抖 300ms）
        const q = dt('.j-q');
        q.value = searchKw; q.dispatchEvent(new Event('input', { bubbles: true }));
        await sleep(600);
        t('搜索' + searchKw + searchHit + '部', dtCards() === searchHit && dt('.d-head .j-cnt')?.textContent === '· ' + searchHit + ' 部');
        q.value = ''; q.dispatchEvent(new Event('input', { bubbles: true }));
        await sleep(600);

        // AI 荐片降级（桌面）：无密钥 → requestUrl/配置层报错 → 页内错误态不崩
        dt('[data-tool="ai"]').click();
        await sleep(80);
        t('AI页待机', dt('.sp-title')?.textContent === 'AI 荐片' && !!dt('[data-cinema-ai-start]'));
        dt('[data-cinema-ai-start]').click();
        await sleep(500);
        t('AI降级错误页不崩', !!dt('.ai-err-ic') && dt('.ai-title')?.textContent === 'AI 分析失败'
          && dt('[data-cinema-ai-start]')?.textContent.includes('重试'));
        dt('.j-back').click();
        await sleep(80);
        t('AI页返回列表', !!dt('.d-head'));

        // 观影分析页（桌面，analysis.ts 真统计）
        dt('[data-tool="stat"]').click();
        await sleep(80);
        t('分析页19板块', dt('.sp-title')?.textContent === '观影分析' && dd.querySelectorAll('.stat-card').length === 4
          && dd.querySelectorAll('.sec').length === 19 && dt('.sp-cnt')?.textContent === '· ' + watched + ' 部已看');
        dt('.j-back').click();
        await sleep(80);

        // 表单（桌面）：14 类型 choice + 状态切已看 → 添加「测试影片」
        dt('[data-cinema-add]').click();
        await sleep(80);
        t('表单14类型choice', dd.querySelectorAll('.f-choice-btn[data-f-tag]').length === 14
          && dt('.cn-modal .cn-modal-title')?.textContent === '添加影视');
        dt('.cn-modal .j-name').value = '测试影片';
        dt('.cn-modal [data-f-st="已看"]').click();
        await sleep(50);
        t('切已看显评分影评', dt('.cn-modal .j-rating').style.display !== 'none' && dt('.cn-modal .j-review').style.display !== 'none');
        dt('.cn-modal .j-save').click();
        await sleep(600);
        t('新增写库51卡', dtCards() === DATA.length + 1 && !!localStorage.getItem('bz-sim:我的/影视/《测试影片》.md'));
        t('新增置顶', firstDeskName() === '测试影片');
        t('新增frontmatter', fmField('测试影片', '评分') === '5');
        await sleep(900); // storage 桥 → 移动端防抖自动刷新
        t('新增同步到移动', mobCards() === DATA.length + 1);

        // 右键菜单（桌面）：已看卡 5 项（无标记动作项）
        ctxCard(cardByName(dd, '测试影片'));
        await sleep(100);
        t('右键菜单5项(已看)', dd.querySelectorAll('.cn-menu .cn-menu-item').length === 5
          && ![...dd.querySelectorAll('.cn-menu .cn-menu-item')].some((b) => b.textContent.includes('标记')));

        // 状态流转（桌面，种子想看片：想看 → 在看 → 已看；跑完还原 frontmatter 保自检可重复）
        const wantName = (DATA.find((x) => x.status === '想看') || {}).name;
        const wantKey = 'bz-sim:我的/影视/《' + wantName + '》.md';
        const wantOrig = localStorage.getItem(wantKey);
        ctxCard(cardByName(dd, wantName));
        await sleep(100);
        t('右键菜单7项(想看)', dd.querySelectorAll('.cn-menu .cn-menu-item').length === 7);
        clickReal([...dd.querySelectorAll('.cn-menu .cn-menu-item')].find((b) => b.textContent.includes('标记在看')));
        await sleep(500);
        t('流转在看徽标', badgeOf(cardByName(dd, wantName)) === '在看' && fmField(wantName, '评分') === '0');
        ctxCard(cardByName(dd, wantName));
        await sleep(100);
        t('在看态无标记在看项', ![...dd.querySelectorAll('.cn-menu .cn-menu-item')].some((b) => b.textContent.includes('标记在看')));
        clickReal([...dd.querySelectorAll('.cn-menu .cn-menu-item')].find((b) => b.textContent.includes('标记已看')));
        await sleep(500);
        t('流转已看收徽标', badgeOf(cardByName(dd, wantName)) === null && fmField(wantName, '评分') === '5');

        // 长按抽屉（移动，450ms 阈值）
        const lpCard = mob('.m-grid .pcard');
        lpCard.dispatchEvent(new Event('pointerdown'));
        await sleep(650);
        t('长按抽屉开', !!mob('.cn-sheet') && !!mob('.cn-sheet-name') && mob('.cn-sheet').querySelectorAll('.cn-sheet-item').length >= 4);
        mob('.cn-sheet-mask').click();
        await sleep(80);
        t('抽屉遮罩关闭', !mob('.cn-sheet'));

        // 头行钮序（移动 m-acts）：添加最前 → AI → 分析 → 关闭最后；设置钮退役（设置走插件设置页）
        const acts = [...mob('.m-acts').querySelectorAll('button')];
        t('头行钮序 添加→AI→分析→关闭', acts.length === 4
          && acts[0].classList.contains('j-madd') && acts[1].classList.contains('j-mai')
          && acts[2].classList.contains('j-mstat') && acts[3].classList.contains('j-mclose'));
        t('头行无设置钮', !mob('.j-mgear'));

        // 详情弹窗 + 删除（桌面，确认三段式 + 回收站删除）
        cardByName(dd, '测试影片').click();
        await sleep(80);
        const dm = dt('.cn-ovl .cn-modal');
        t('详情弹窗', !!dm && dm.querySelector('.dm-title')?.textContent === '测试影片');
        dm.querySelector('.j-del').click();
        await sleep(80);
        const confirm = dt('.cn-confirm');
        t('删除确认三段式', !!confirm && confirm.querySelector('.cn-confirm-title')?.textContent === '删除影视'
          && confirm.textContent.includes('回收站'));
        clickReal(confirm.querySelector('.j-del'));
        await sleep(600);
        t('删除后50卡', dtCards() === DATA.length && !localStorage.getItem('bz-sim:我的/影视/《测试影片》.md'));
        await sleep(900);
        t('删除同步到移动', mobCards() === DATA.length);

        // ESC 分层（桌面）：先关弹窗后关面板；重开走真 openCinema（toggle 语义）
        dt('[data-cinema-add]').click();
        await sleep(80);
        dd.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape' }));
        await sleep(80);
        t('ESC先关弹窗', !!dt('section.bz-cinema--midnight') && !dt('.cn-modal'));
        dd.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape' }));
        await sleep(80);
        t('ESC再关面板', !dt('section.bz-cinema--midnight'));
        dd.defaultView.BZW_cinema.openCinema();
        await sleep(300);
        t('桌面重开面板', !!dt('section.bz-cinema--midnight') && !!dt('.d-head'));

        // 移动专属：AI 钮再点回列表（落域适配）+ ✕ 关闭 + 重开
        mob('.j-mai').click();
        await sleep(80);
        t('移动AI页', mob('.j-mview').classList.contains('sp-body'));
        mob('.j-mai').click();
        await sleep(80);
        t('再点回列表', mob('.j-mview').classList.contains('m-scroll'));
        mob('.j-mclose').click();
        await sleep(80);
        t('移动✕关闭', !mob('section.mob.bz-cinema--midnight'));
        md.defaultView.BZW_cinema.openCinema();
        await sleep(300);
        t('移动重开面板', !!mob('section.mob.bz-cinema--midnight') && mobCards() === DATA.length);

        // 还原流转过的种子想看片（disk 层面；自检可重复——基线计数不受影响）
        if (wantOrig != null) localStorage.setItem(wantKey, wantOrig);

        document.title = window.__st.fail.length
          ? 'SELFTEST FAIL ' + window.__st.fail.join(',')
          : `SELFTEST OK ${window.__st.pass}/${window.__st.pass + window.__st.fail.length}`;
        res.textContent = window.__st.fail.length ? '自检失败' : `自检通过 ${window.__st.pass}`;
        res.className = window.__st.fail.length ? 'bad' : 'ok';
      } catch (err) {
        document.title = 'SELFTEST ERR ' + (err && err.message || err);
        res.textContent = '自检异常';
        res.className = 'bad';
      }
    })();
  }
})();
</script>
</body>
</html>
