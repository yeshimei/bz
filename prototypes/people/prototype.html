<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>脸谱 · 原型预览（真行为单源）</title>
<!--
  ┌────────────────────────────────────────────────────────────────────────┐
  │ 本文件 = 脸谱域 UI 的评审壳（行为单源版，issue 447，范式随 memo）。        │
  │ 组件样式零内联，全部来自（与 build-css SOURCES 同序）：                    │
  │   ../core/styles.css → ../core/ui/tokens.css → ../core/ui/components.css │
  │   → ./styles.css（src/people/styles.css，bz-people-* 前缀）               │
  │ markup 单源（ADR-0104）：壳/封面墙/详情折册/数据源弹窗出自 src/people/render.ts │
  │ 行为单源（ADR-0106）：交互逻辑全部是插件同款 ui.ts 依赖链——                │
  │   经 ./prototype-behavior.js（src/people/fake-sim.ts 构建，              │
  │   alias obsidian→公共假层）在下方两个 iframe 视图里跑真行为；               │
  │   桌面 iframe 920px 宽视口 = 桌面 920×660 本体；移动 iframe 412×915 =       │
  │   styles.css 容器查询窄态。数据 = localStorage people.json（构造种子；      │
  │   数据源弹窗跑真扫描管线——chat.json 为构造数据，四态可评审）。              │
  │ 壳内只允许：外景容器样式、评审徽牌、演示钩子与自检。                        │
  └────────────────────────────────────────────────────────────────────────┘
-->
<link rel="stylesheet" href="../../src/core/styles.css">
<link rel="stylesheet" href="../../src/core/ui/tokens.css">
<link rel="stylesheet" href="../../src/core/ui/components.css">
<link rel="stylesheet" href="../../src/people/styles.css">
<link rel="stylesheet" href="../mob-1to1.css">
<script src="../mob-1to1.js"></script>
<style>
  /* ===== 以下全部是演示壳，禁止放组件样式 ===== */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; gap: 28px; padding: 32px 24px;
    background: #e3e0d8; font-family: system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif; }
  /* 模拟 Obsidian 宿主变量（core/styles.css 的弹层/通知取值用；插件内由主题提供） */
  body {
    --background-primary: #fbf9f3; --text-normal: #171512; --text-muted: #8b8474; --text-faint: #b3ab99;
    --text-error: #b3564d; --background-modifier-hover: rgba(23,21,18,.06); --color-green: #3d8f5d;
  }
  * { scrollbar-width: none; } *::-webkit-scrollbar { display: none; }

  /* 桌面外景（真行为 iframe：面板 append iframe body，本体 920×660 来自 styles.css） */
  .demo-dt { flex: none; width: 960px; height: 700px; }
  /* 移动外景：412×915 iframe → 全屏态 100vw/100vh 即手机框尺寸 */
  .demo-mob { width: 412px; height: 915px; border-radius: 26px; overflow: hidden; flex: none;
    border: 1px solid #d8d1c0; box-shadow: 0 8px 30px rgba(0,0,0,.14); background: #f5f2ec; }
  .demo-frame { width: 100%; height: 100%; border: 0; display: block; }

  /* 评审徽牌（演示壳自用） */
  .vbadge { position: fixed; right: 16px; bottom: 12px; font-size: 11px; color: #9a917d; display: flex; gap: 10px; align-items: center;
    background: rgba(255,255,255,.9); border: 1px solid #d8d1c0; padding: 3px 8px; z-index: 900; flex-wrap: wrap; }
  .vbadge button { border: none; background: none; font: 11px 'Microsoft YaHei'; cursor: pointer; color: #7a7261; }
  .vbadge button:hover { color: #b3564d; }
  .vbadge .ok { color: #3d8f5d; }
  .vbadge .bad { color: #b3564d; }
</style>
</head>
<body class="theme-light"> <!-- 模拟 Obsidian 宿主：色彩 token 挂 theme-light/dark，壳内必须补一类才不透明 -->
  <div id="dtHost" class="demo-dt"><iframe class="demo-frame" src="./prototype-view.html" title="脸谱·桌面"></iframe></div>
  <div id="mobHost" class="demo-mob"><iframe class="demo-frame" src="./prototype-view.html?mob=1" title="脸谱·移动"></iframe></div>
  <div class="vbadge">
    <span>脸谱 · 真行为单源（构造种子；生成路径需插件端 AI）</span>
    <button id="btnDs">数据源弹窗（桌面）</button>
    <button id="btnReset">重置演示数据</button>
    <span id="selftest"></span>
  </div>
<script>
  // 演示钩子：只在桌面实例触发（移动实例保持初始态，专评窄容器布局）
  var dtFrame = document.querySelector('#dtHost iframe');
  function dt() { return dtFrame && dtFrame.contentWindow && dtFrame.contentWindow.BZW_people; }
  document.getElementById('btnDs').onclick = function () { var b = dt(); if (b) b.demoOpenDataSource(); };
  document.getElementById('btnReset').onclick = function () {
    var b = dt(); if (b) b.demoReset();
  };
  // 自检：行为包挂载 + 种子落位
  window.addEventListener('load', function () {
    setTimeout(function () {
      var ok = !!(dt() && dtFrame.contentWindow.localStorage.getItem('bz-sim:CONFIG/STORAGE/people.json'));
      var el = document.getElementById('selftest');
      el.textContent = ok ? '✓ 行为包与种子就绪' : '✗ 行为包未挂载';
      el.className = ok ? 'ok' : 'bad';
    }, 400);
  });
</script>
</body>
</html>
