<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V5 · 值守台 — 保险库</title>
<style>
  :root{
    --bg:#161616; --panel:#1e1e1e; --panel2:#262626; --border:#333; --border2:#3f3f3f;
    --tx:#dadada; --tx2:#999; --tx3:#777; --ac:#8a7cf5; --danger:#e35d5d; --ok:#5db97a; --warn:#d9a24a;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--tx);font:14px/1.65 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;flex-direction:column}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  svg{vertical-align:-2px}

  /* 会话条 */
  .sbar{background:var(--panel);border-bottom:1px solid var(--border);padding:11px 22px;display:flex;align-items:center;gap:20px}
  .sbar .brand{font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px}
  .sbar .brand svg{color:var(--ac)}
  .s-item{font-size:12px;color:var(--tx3);display:flex;align-items:center;gap:6px}
  .s-item b{color:var(--tx2);font-weight:500;font-variant-numeric:tabular-nums}
  .s-item .lamp{width:7px;height:7px;border-radius:50%}
  .sbar .sp{flex:1}
  .btn{border:1px solid var(--border2);border-radius:8px;padding:5px 13px;font-size:12.5px;color:var(--tx2)}
  .btn:hover{background:var(--panel2);color:var(--tx)}
  .btn.pri{color:var(--ac);border-color:rgba(138,124,245,.45)}
  .btn.dgr{color:var(--danger);border-color:rgba(227,93,93,.4)}

  /* 锁定幕 */
  #veil{flex:1;display:flex;align-items:center;justify-content:center}
  .veil-card{width:320px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:30px 28px;text-align:center}
  .veil-card h2{font-size:15px;font-weight:600;margin:12px 0 4px}
  .veil-card .sub{color:var(--tx3);font-size:12px;margin-bottom:20px}
  .pw-wrap{display:flex;border:1px solid var(--border2);border-radius:8px;overflow:hidden;background:var(--bg)}
  .pw-wrap input{flex:1;background:none;border:none;outline:none;color:var(--tx);padding:9px 12px}
  .pw-wrap button{padding:9px 16px;color:var(--ac);border-left:1px solid var(--border)}
  .veil-err{color:var(--danger);font-size:12px;height:18px;margin-top:8px;text-align:left}

  /* 工作区 */
  #desk{flex:1;display:none;min-height:0}
  .list{width:380px;border-right:1px solid var(--border);overflow:auto}
  .list-hd{padding:12px 18px;font-size:11px;color:var(--tx3);letter-spacing:.12em;display:flex;justify-content:space-between;position:sticky;top:0;background:var(--bg);z-index:1;border-bottom:1px solid var(--border)}
  .lrow{display:flex;align-items:center;gap:10px;padding:10px 18px;cursor:pointer;border-bottom:1px solid var(--border)}
  .lrow:hover{background:var(--panel)}
  .lrow.sel{background:var(--panel2);border-left:2px solid var(--ac);padding-left:16px}
  .lrow .nm{flex:1;min-width:0}
  .lrow .nm .t{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lrow .nm .d{font-size:11px;color:var(--tx3)}
  .st{font-size:10.5px;padding:2px 8px;border-radius:14px;border:1px solid var(--border2);color:var(--tx3);flex:none}
  .st.open{color:var(--warn);border-color:rgba(217,162,74,.5)}

  .read{flex:1;display:flex;flex-direction:column;min-width:0}
  .read-hd{padding:15px 26px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
  .read-hd h2{font-size:16px;font-weight:600;flex:1}
  .read-hd .st{font-size:11px}
  .read-meta{padding:8px 26px;border-bottom:1px dashed var(--border);color:var(--tx3);font-size:12px;display:flex;gap:16px}
  .read-body{flex:1;overflow:auto;padding:22px 30px;font-size:14px;line-height:1.9}
  .read-body p{margin-bottom:12px;color:var(--tx)}
  .read-ft{padding:12px 26px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
  .read-ft .hint{color:var(--tx3);font-size:12px;flex:1}
  .empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--tx3)}
  #toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--border2);border-radius:8px;padding:9px 18px;font-size:13px;display:none;z-index:20}
</style>
</head>
<body>

<!-- 会话条：锁定时也在，只换内容 -->
<div class="sbar">
  <div class="brand"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2 4 5v6c0 5 3.5 8.5 8 11 4.5-2.5 8-6 8-11V5l-8-3z"/></svg>保险库</div>
  <span class="s-item" id="sSess"><span class="lamp" style="background:var(--danger)"></span>会话未开启</span>
  <span class="s-item" id="sExpo" style="display:none">明文暴露 <b id="expoN">0</b> 篇</span>
  <span class="s-item" id="sIdle" style="display:none">无操作 <b id="idleN">0:00</b> 后自动上锁</span>
  <span class="sp"></span>
  <button class="btn pri" id="startBtn">开始会话</button>
  <button class="btn dgr" id="lockBtn" style="display:none">立即上锁</button>
</div>

<!-- 锁定幕 -->
<div id="veil">
  <div class="veil-card">
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="var(--tx2)" stroke-width="1.6"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    <h2>开启值守会话</h2>
    <div class="sub">会话期间可打开明文 · 结束即全库密封</div>
    <div class="pw-wrap">
      <input id="pw" type="password" placeholder="主密码">
      <button id="goBtn">开启</button>
    </div>
    <div class="veil-err" id="err"></div>
  </div>
</div>

<!-- 值守工作台 -->
<div id="desk">
  <div style="flex:1;display:flex;min-height:0">
    <div class="list">
      <div class="list-hd"><span>库 存</span><span id="listCnt"></span></div>
      <div id="rows"></div>
    </div>
    <div class="read" id="readPane">
      <div class="empty" id="readEmpty">
        <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" style="opacity:.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
        <div>未开启任何笔记</div>
        <div style="font-size:12px">左侧选择一篇，明文只在打开期间存在</div>
      </div>
      <div id="readView" style="display:none;flex:1;flex-direction:column;min-height:0">
        <div class="read-hd"><h2 id="rTitle"></h2><span class="st open" id="rSt">明文中</span></div>
        <div class="read-meta"><span id="rPath"></span><span id="rDate"></span><span id="rAtts"></span></div>
        <div class="read-body" id="rBody"></div>
        <div class="read-ft">
          <span class="hint">关闭后此篇回到密文态，明文从内存清除</span>
          <button class="btn pri" id="closeBtn">封存本篇</button>
          <button class="btn dgr" id="delBtn">销毁</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const SEED = [
  {id:1,title:"个人证件与材料扫描",path:"私密/证件材料.md",date:"08-14",atts:2,body:["证件材料这一篇收录了所有扫描件的存放位置与说明。","身份证、户口本、护照的电子扫描件作为附件随这篇笔记一起加密保管，原文已在文库中移除。"]},
  {id:2,title:"银行账户与密码备忘",path:"私密/账户备忘.md",date:"08-20",atts:0,body:["只记录账户名、开户行与用途，密码本体在密码管理器里。","万一密码管理器本身出问题，还能从这里找到恢复入口。"]},
  {id:3,title:"2026 上半年收入台账",path:"私密/收入台账.md",date:"07-02",atts:1,body:["一月到六月的收入明细逐月记录，工资流水截图作为附件保存。"]},
  {id:4,title:"写给家里的一封信",path:"私密/信件.md",date:"06-11",atts:0,body:["有些话不适合放在公开的日记里，写完就封存。","等合适的时机再取出来。"]},
  {id:5,title:"医疗记录汇总",path:"私密/医疗记录.md",date:"09-01",atts:3,body:["三次体检的报告与处方单扫描件都在附件里。","正文按时间线记录每次就诊的结论与医嘱要点。"]},
  {id:6,title:"合同草稿 · 房屋租赁",path:"工作/合同草稿.md",date:"08-28",atts:1,body:["租约谈判过程里的底稿与修改记录。","最终签署版在对方手里，这里只留谈判过程的完整脉络。"]},
  {id:7,title:"投资账户持仓明细",path:"私密/持仓明细.md",date:"09-05",atts:0,body:["只记账户与大致仓位结构，具体数字每月更新一次。"]},
  {id:8,title:"旧手机备份清单",path:"私密/备份清单.md",date:"05-19",atts:0,body:["旧手机里的照片已迁移，这篇是迁移时的核对清单。"]},
  {id:9,title:"保险单据归档",path:"私密/保险单据.md",date:"04-22",atts:1,body:["两份保单的关键条款摘录与缴费日期。"]},
  {id:10,title:"旅行证件与行程底稿",path:"私密/行程底稿.md",date:"03-08",atts:0,body:["护照签证的办理记录，以及一次未成行的行程规划底稿。"]},
  {id:11,title:"家庭网络与设备口令",path:"私密/设备口令.md",date:"09-08",atts:0,body:["路由器、NAS、摄像头的管理口令与固件版本。"]},
  {id:12,title:"谈话记录 · 0903",path:"私密/谈话记录.md",date:"09-03",atts:0,body:["九月三日的谈话要点，按问与答的形式整理。","涉及第三方隐私，只自留。"]},
];
let notes = SEED.map(n=>({...n,open:false}));
let sessionId = null, openedId = null, idleSec = 0;
const $ = id=>document.getElementById(id);
const esc = s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
function toast(m){const t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(toast._h);toast._h=setTimeout(()=>t.style.display="none",2200)}

function renderBar(){
  if(!sessionId){
    $("sSess").innerHTML = '<span class="lamp" style="background:var(--danger)"></span>会话未开启';
    $("sExpo").style.display="none"; $("sIdle").style.display="none";
    $("startBtn").style.display=""; $("lockBtn").style.display="none";
  }else{
    const el = Math.floor((Date.now()-sessionId)/1000);
    $("sSess").innerHTML = `<span class="lamp" style="background:var(--ok)"></span>会话进行中 <b>${String(Math.floor(el/60)).padStart(2,"0")}:${String(el%60).padStart(2,"0")}</b>`;
    const expo = notes.filter(n=>n.open).length;
    $("sExpo").style.display=""; $("expoN").textContent = expo;
    $("expoN").style.color = expo ? "var(--warn)" : "var(--ok)";
    $("sIdle").style.display=""; $("idleN").textContent = Math.floor(idleSec/60)+":"+String(idleSec%60).padStart(2,"0");
    $("startBtn").style.display="none"; $("lockBtn").style.display="";
  }
}
function renderList(){
  $("listCnt").textContent = notes.length + " 篇 · " + notes.filter(n=>n.open).length + " 篇明文";
  $("rows").innerHTML = notes.map(n=>`
    <div class="lrow ${openedId===n.id?"sel":""}" data-id="${n.id}">
      <div class="nm"><div class="t">${esc(n.title)}</div><div class="d">${n.path} · 存入 ${n.date}</div></div>
      <span class="st ${n.open?"open":""}">${n.open?"明文中":"密文"}</span>
    </div>`).join("");
  $("rows").querySelectorAll(".lrow").forEach(el=>el.onclick=()=>openNote(+el.dataset.id));
}
function renderRead(){
  const n = notes.find(x=>x.id===openedId);
  if(!n){ $("readEmpty").style.display="flex"; $("readView").style.display="none"; return; }
  $("readEmpty").style.display="none"; $("readView").style.display="flex";
  $("rTitle").textContent = n.title;
  $("rPath").textContent = n.path;
  $("rDate").textContent = "存入 " + n.date;
  $("rAtts").textContent = n.atts ? n.atts+" 个附件（密文，点击解密预览）" : "无附件";
  $("rBody").innerHTML = n.body.map(p=>`<p>${esc(p)}</p>`).join("");
}
function openNote(id){
  if(!sessionId){ toast("会话未开启"); return; }
  const n = notes.find(x=>x.id===id);
  if(!n.open){ n.open = true; toast(`「${n.title}」已解密为明文`); }
  openedId = id; touch();
}
function touch(){ idleSec = 0; renderBar(); renderList(); renderRead(); }

$("goBtn").onclick = ()=>{
  if($("pw").value.length<4){ $("err").textContent="密码不符，重试。"; return; }
  $("pw").value=""; $("err").textContent="";
  sessionId = Date.now(); idleSec = 0; openedId = null;
  $("veil").style.display="none"; $("desk").style.display="flex";
  renderBar(); renderList(); renderRead();
};
$("pw").addEventListener("keydown",e=>{ if(e.key==="Enter") $("goBtn").click(); });
$("startBtn").onclick = ()=>$("pw").focus();
$("lockBtn").onclick = ()=>{
  notes.forEach(n=>n.open=false);
  sessionId = null; openedId = null;
  $("desk").style.display="none"; $("veil").style.display="flex";
  renderBar(); renderList(); renderRead();
  toast("会话结束，全库已密封");
};
$("closeBtn").onclick = ()=>{
  const n = notes.find(x=>x.id===openedId); if(!n) return;
  n.open = false; openedId = null;
  toast(`「${n.title}」明文已清除，回到密文态`);
  touch();
};
$("delBtn").onclick = ()=>{
  const n = notes.find(x=>x.id===openedId); if(!n) return;
  const b=$("delBtn");
  if(b.dataset.arm!=="1"){ b.dataset.arm="1"; b.textContent="确认销毁？"; setTimeout(()=>{b.dataset.arm="";b.textContent="销毁"},2600); return; }
  b.dataset.arm=""; b.textContent="销毁";
  notes = notes.filter(x=>x.id!==n.id);
  toast("密文已销毁，不可恢复");
  openedId = null; touch();
};
setInterval(()=>{
  if(!sessionId) return;
  idleSec++;
  if(idleSec >= 300){ $("lockBtn").click(); return; }
  renderBar();
},1000);
renderBar();
</script>
</body>
</html>
