<style>
  /* ===== 宿主 mock（密码本评审壳口径：暖纸浅主题 + 金色强调） ===== */
  :root{
    --bg-cover:#e3e0d8;
    --primary:#fbf9f3; --secondary:#f2efe6; --hover:rgba(23,21,18,.06);
    --line:rgba(23,21,18,.12);
    --ink:#171512; --muted:#8b8474; --faint:#b3ab99;
    --bad:#b3564d; --ok:#3d8f5d; --warn:#d08b2c;
    --gold:#b8913e; --gold-soft:linear-gradient(135deg,#d3b26b,#b8913e);
    --mono:'Cascadia Mono',Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg-cover);color:var(--ink);font:14px/1.65 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  input{font:inherit;border:1px solid var(--line);background:var(--secondary);color:var(--ink);border-radius:10px;padding:9px 13px;outline:none}
  input:focus{border-color:var(--gold)}
  svg{vertical-align:-2px}

  .desk{width:1060px;max-width:calc(100vw - 48px);height:680px;max-height:calc(100vh - 48px);border-radius:14px;overflow:hidden;background:var(--primary);box-shadow:0 20px 60px rgba(0,0,0,.35);position:relative;flex-shrink:0;display:flex}

  /* ===== 左导航（密码本同款 nav） ===== */
  .nav{width:200px;flex-shrink:0;background:var(--secondary);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 12px}
  .logo{display:flex;align-items:center;gap:10px;padding:0 10px 22px}
  .logo .seal{width:34px;height:34px;border-radius:10px;background:var(--gold-soft);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(184,145,62,.4);color:#fff;flex:none}
  .logo .name{font-size:16px;font-weight:700}
  .logo .name small{display:block;font-size:10px;font-weight:400;color:var(--muted);letter-spacing:.08em}
  .navitem{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:10px;font-size:13.5px;color:var(--muted);width:100%;text-align:left}
  .navitem:hover{background:var(--hover)}
  .navitem.on{background:rgba(184,145,62,.14);color:var(--gold);font-weight:600}
  .navitem .cnt{margin-left:auto;font-size:11px;color:var(--faint)}
  .nav .spacer{flex:1}
  .sess{padding:10px 14px 4px;font-size:11px;color:var(--muted);display:flex;justify-content:space-between}
  .sess b{font-variant-numeric:tabular-nums;font-weight:500;color:var(--muted)}
  .sess .idle{color:var(--warn)}
  .lockstate{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 14px;margin-top:6px;font-size:12px;font-weight:600;color:var(--muted);border-top:1px solid var(--line);width:100%}
  .lockstate:hover{color:var(--bad)}
  .lockstate .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}

  /* ===== 主区 ===== */
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .bar{display:flex;align-items:center;gap:10px;padding:13px 20px;border-bottom:1px solid var(--line)}
  .bar .t{font-size:15px;font-weight:700}
  .bar .sub{font-size:11.5px;color:var(--muted)}
  .bar .sp{flex:1}
  .icb{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--muted);border:1px solid transparent}
  .icb:hover{background:var(--hover);color:var(--ink)}
  .icb.gold{color:var(--gold)}
  .btn{border:1px solid var(--line);border-radius:10px;padding:7px 15px;font-size:13px;color:var(--muted)}
  .btn:hover{background:var(--hover);color:var(--ink)}
  .btn.gold{background:var(--gold-soft);color:#fff;font-weight:600;border:none;box-shadow:0 4px 12px rgba(184,145,62,.35)}
  .btn.gold:hover{opacity:.92}
  .btn.red{color:var(--bad);border-color:rgba(179,86,77,.4)}
  .btn.red:hover{background:rgba(179,86,77,.08)}
  .body{flex:1;display:flex;min-height:0}

  /* 列表 */
  .listwrap{flex:1;min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--line)}
  .listbar{padding:11px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .listbar input{flex:1}
  .listbar .c{font-size:11px;color:var(--faint);flex:none}
  .rows{flex:1;overflow:auto}
  .nrow{display:flex;align-items:center;gap:13px;padding:12px 18px;border-bottom:1px solid var(--line);cursor:pointer}
  .nrow:hover{background:var(--hover)}
  .nrow.sel{background:rgba(184,145,62,.1)}
  .nrow .no{width:42px;flex:none;font-family:var(--mono);font-size:11px;color:var(--faint)}
  .nrow .t{flex:1;min-width:0}
  .nrow .t b{display:block;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nrow .t span{font-size:11px;color:var(--muted)}
  .nrow .att{flex:none;display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:12px;padding:2px 9px}
  .nrow .sz{flex:none;font-family:var(--mono);font-size:11px;color:var(--faint);width:60px;text-align:right}
  .norec{padding:40px 0;text-align:center;color:var(--faint);font-size:12.5px}

  /* 详情 */
  .detail{width:340px;flex-shrink:0;padding:20px;overflow:auto}
  .detail .hd .no{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.15em;margin-bottom:4px}
  .detail .hd b{font-size:17px;font-weight:700}
  .fld{margin:13px 0}
  .fld label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:4px}
  .fld .val{display:flex;align-items:center;gap:6px;background:var(--secondary);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:12.5px}
  .fld .val.mono{font-family:var(--mono);font-size:12px}
  .acts{display:flex;gap:8px;margin-top:18px}
  .acts .btn{flex:1;text-align:center}

  /* 概览 */
  .ov{flex:1;overflow:auto;padding:22px 26px}
  .hero{display:flex;gap:12px;margin-bottom:22px}
  .hero>div{flex:1;background:var(--secondary);border:1px solid var(--line);border-radius:12px;padding:16px 18px 12px;cursor:pointer}
  .hero>div:hover{border-color:var(--gold)}
  .hero b{display:block;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
  .hero span{font-size:11.5px;color:var(--muted)}
  .ov h3{font-size:12px;color:var(--muted);letter-spacing:.12em;font-weight:600;margin:0 0 10px}
  .recent{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:22px}
  .rrow{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
  .rrow:last-child{border-bottom:none}
  .rrow:hover{background:var(--hover)}
  .rrow .ic{width:28px;height:28px;border-radius:9px;background:var(--gold-soft);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
  .rrow .t{flex:1;min-width:0}
  .rrow .t b{display:block;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rrow .t span{font-size:11px;color:var(--muted)}
  .rrow .tm{font-size:11px;color:var(--faint);flex:none}
  .healthcard{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;background:var(--secondary)}
  .healthcard:hover{border-color:var(--gold)}
  .healthcard .ic{color:var(--ok)}
  .healthcard .t{flex:1}
  .healthcard .t b{display:block;font-size:13px;font-weight:600}
  .healthcard .t span{font-size:11px;color:var(--muted)}
  .healthcard .go{color:var(--gold);font-size:12px;font-weight:600}

  /* ===== 解锁遮罩 ===== */
  .lock{position:absolute;inset:0;z-index:40;background:var(--primary);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px}
  .lock.hide{display:none}
  .lock .seal{width:72px;height:72px;border-radius:22px;background:var(--gold-soft);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(184,145,62,.4);color:#fff;margin-bottom:14px}
  .lock h2{font-size:22px;font-weight:700}
  .lock .sub{font-size:12.5px;color:var(--muted);margin:4px 0 20px}
  .stats{display:flex;gap:12px;margin-bottom:24px}
  .stats div{min-width:122px;background:var(--secondary);border:1px solid var(--line);border-radius:12px;padding:12px 16px 10px}
  .stats b{display:block;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
  .stats span{font-size:11px;color:var(--muted)}
  .pwrow{display:flex;gap:10px}
  .pwrow input{width:280px;text-align:center;font-size:15px}
  .go{background:var(--gold-soft);color:#fff;font-weight:600;padding:11px 30px;border-radius:12px;box-shadow:0 6px 18px rgba(184,145,62,.4)}
  .go:hover{opacity:.92}
  .go:disabled{opacity:.5;cursor:not-allowed}
  .err{font-size:12px;color:var(--bad);min-height:18px;margin-top:10px}
  .sec{margin-top:20px;font-size:11px;color:var(--faint);display:flex;align-items:center;gap:6px}
  .sec .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
  .hint{margin-top:8px;font-size:11.5px;color:var(--faint)}

  /* ===== 弹层（对话框/灯箱） ===== */
  .mask{position:absolute;inset:0;z-index:50;background:rgba(30,26,18,.45);display:none;align-items:center;justify-content:center}
  .mask.open{display:flex}
  .dlg{background:var(--primary);border-radius:16px;box-shadow:0 24px 70px rgba(0,0,0,.35);width:min(440px,90%);max-height:84%;display:flex;flex-direction:column;overflow:hidden}
  .dlg .hd{padding:16px 20px 4px}
  .dlg .hd h3{font-size:15px;font-weight:700}
  .dlg .hd .sub{font-size:11.5px;color:var(--muted);margin-top:2px}
  .dlg .bd{padding:14px 20px;overflow:auto;flex:1}
  .dlg .ft{padding:12px 20px 16px;display:flex;gap:8px;justify-content:flex-end;align-items:center}
  .dlg .ft .note{flex:1;font-size:11px;color:var(--faint)}

  /* 开关行（自绘 toggle） */
  .setrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
  .setrow:last-child{border-bottom:none}
  .setrow .t{flex:1}
  .setrow .t b{display:block;font-size:13px;font-weight:600}
  .setrow .t span{font-size:11px;color:var(--muted)}
  .sw{width:38px;height:22px;border-radius:12px;background:var(--line);position:relative;flex:none;transition:background .15s}
  .sw::after{content:"";position:absolute;left:2px;top:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .15s}
  .sw.on{background:var(--gold)}
  .sw.on::after{left:18px}

  /* 体检 */
  .hsec{margin-bottom:14px}
  .hsec .h{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
  .hitem{display:flex;align-items:center;gap:9px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;margin-bottom:5px;font-size:12.5px}
  .hitem .cb{width:15px;height:15px;border:1px solid var(--line);border-radius:4px;flex:none;display:flex;align-items:center;justify-content:center;color:transparent;font-size:11px}
  .hitem.on .cb{background:var(--gold);border-color:var(--gold);color:#fff}
  .hitem .lab{flex:1}
  .hitem .cat{font-size:10.5px;color:var(--faint)}
  .hitem.ro{opacity:.75}
  .hitem.ro .cb{display:none}
  .prog{background:var(--secondary);border:1px solid var(--line);border-radius:9px;padding:12px 14px}
  .prog .pbar{height:6px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:8px}
  .prog .pbar i{display:block;height:100%;background:var(--gold-soft);border-radius:4px;width:0%}
  .prog .pc{font-size:11px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between}

  /* 存入候选 */
  .dep{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px;cursor:pointer;font-size:13px}
  .dep:hover{background:var(--hover)}
  .dep .cb{width:15px;height:15px;border:1px solid var(--line);border-radius:4px;flex:none;display:flex;align-items:center;justify-content:center;color:transparent;font-size:11px}
  .dep.on .cb{background:var(--gold);border-color:var(--gold);color:#fff}
  .dep .p{margin-left:auto;font-size:10.5px;color:var(--faint)}

  /* 灯箱（附件密文预览） */
  .lb{position:absolute;inset:0;z-index:60;background:rgba(30,26,18,.62);display:none;align-items:center;justify-content:center}
  .lb.open{display:flex}
  .lb .card{background:var(--primary);border-radius:14px;width:min(480px,90%);overflow:hidden}
  .lb .im{height:300px;display:flex;align-items:center;justify-content:center;position:relative}
  .lb .im .ph{position:absolute;inset:0;background:linear-gradient(135deg,#e8e2d2,#d8cfba)}
  .lb .im .ph.orig{background:linear-gradient(120deg,#efe9da,#cfc4a8 60%,#dccfb2)}
  .lb .im .tag{position:relative;z-index:1;background:rgba(251,249,243,.9);border:1px solid var(--line);border-radius:8px;padding:5px 12px;font-size:11px;color:var(--muted)}
  .lb .ft{padding:12px 16px;display:flex;gap:8px;align-items:center}
  .lb .ft .t{flex:1;font-size:12px;color:var(--muted)}

  /* 右键菜单（对齐原生规范：≥180px、行高 30、1px 边框、无动效） */
  #cmenu{position:fixed;z-index:80;display:none;min-width:180px;background:var(--primary);border:1px solid rgba(23,21,18,.22);border-radius:9px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:5px}
  #cmenu.open{display:block}
  #cmenu button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:6px 10px;border-radius:7px;font-size:13px;min-height:30px;color:var(--ink)}
  #cmenu button:hover{background:var(--hover)}
  #cmenu button.dgr{color:var(--bad)}
  #cmenu .sep{height:1px;background:var(--line);margin:4px 6px}

  /* 正文预览窗（宽一点，Markdown 阅读排版） */
  .dlg.pv{width:min(680px,92%);max-width:680px}
  .md{font-size:14px;line-height:1.85;color:var(--ink)}
  .md h1{font-size:1.55em;font-weight:700;margin:.2em 0 .5em}
  .md h2{font-size:1.25em;font-weight:700;margin:1em 0 .4em}
  .md h3{font-size:1.08em;font-weight:600;margin:.9em 0 .35em}
  .md p{margin:.55em 0}
  .md ul,.md ol{padding-left:1.5em;margin:.45em 0}
  .md li{margin:.18em 0}
  .md blockquote{border-left:3px solid var(--gold);padding:2px 12px;color:var(--muted);margin:.7em 0}
  .md code{font-family:var(--mono);font-size:.88em;background:var(--secondary);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
  .md hr{border:none;border-top:1px solid var(--line);margin:.9em 0}
  .md strong{font-weight:700}

  /* 通知 */
  #toast{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);background:var(--secondary);border:1px solid var(--line);border-radius:9px;padding:8px 16px;font-size:12.5px;display:none;z-index:70;box-shadow:0 4px 14px rgba(0,0,0,.18)}
</style>

function outNote(n){
  confirmDlg({
    title:"取出还原", msg:`将「${n.title}」的正文与附件解密，还原回文库原路径？还原后该条目从保险库移除。`, ok:"还原", gold:true,
    then:()=>runProgress(`还原 ${n.title}`, [n.path, ...n.atts.map(a=>a.n)], ()=>{
      notes = notes.filter(x=>x.id!==n.id); if(selId===n.id) selId=null;
      renderAll(); toast(`「${n.title}」已还原回文库`);
    })
  });
}
function destroyNote(n){
  confirmDlg({
    title:"销毁密文", msg:`彻底销毁「${n.title}」的全部密文（正文 + ${n.atts.length} 附件）？此操作不可恢复。`, ok:"确认销毁", danger:true, pw:true,
    then:()=>runProgress(`销毁 ${n.title}`, [n.no.toLowerCase()+"-a7f3c2.enc"], ()=>{
      notes = notes.filter(x=>x.id!==n.id); if(selId===n.id) selId=null;
      renderAll(); toast("密文已销毁，不可恢复");
    })
  });
}

/* ================= 通用对话框 ================= */
function openDlg(html){ $("dlg").innerHTML = html; $("dlgMask").classList.add("open"); }
function closeDlg(){ $("dlgMask").classList.remove("open"); }
$("dlgMask").addEventListener("click",e=>{ if(e.target===e.currentTarget) closeDlg(); });
function confirmDlg({title,msg,ok,danger,gold,pw,then}){
  openDlg(`<div class="hd"><h3>${esc(title)}</h3><div class="sub">${esc(msg)}</div></div>
    ${pw?`<div class="bd"><label style="display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:5px">主密码确认（销毁为高危操作）</label>
      <input id="cPw" type="password" placeholder="再次输入主密码" style="width:100%">
      <div id="cErr" style="font-size:12px;color:var(--bad);min-height:16px;margin-top:6px"></div></div>`:""}
    <div class="ft"><button class="btn" id="cNo">取消</button><button class="btn ${danger?"red":gold?"gold":""}" id="cOk">${esc(ok)}</button></div>`);
  $("cNo").onclick = closeDlg;
  $("cOk").onclick = ()=>{
    if(pw && $("cPw").value !== "demo"){ $("cErr").textContent = "主密码不符，未执行。"; return; }
    closeDlg(); then();
  };
  if(pw) $("cPw").focus();
}
/* 进度（复刻逐文件进度语义：done/total/current 即时刷新） */
function runProgress(title, files, done){
  openDlg(`<div class="hd"><h3>${esc(title)}</h3></div><div class="bd">
    <div class="prog"><div class="pc" style="margin:0 0 4px"><span id="pCur">准备中…</span><span id="pN"></span></div>
    <div class="pbar"><i id="pBar"></i></div></div></div>`);
  let i = 0;
  const step = ()=>{
    if(i < files.length){
      $("pCur").textContent = files[i];
      $("pN").textContent = `${i+1} / ${files.length}`;
      $("pBar").style.width = Math.round((i+1)/files.length*100)+"%";
      i++; setTimeout(step, 420);
    }else{ closeDlg(); done(); }
  };
  setTimeout(step, 300);
}

/* ================= 存入笔记 ================= */
$("lockNoteBtn").onclick = ()=>{
  if(!unlocked) return;
  const picked = new Set();
  const render = ()=>{
    openDlg(`<div class="hd"><h3>存入笔记</h3><div class="sub">从文库选择要加密存入的笔记（正文与附件一并加密，原文移除）</div></div>
      <div class="bd">${CANDIDATES.map((c,i)=>`
        <div class="dep ${picked.has(i)?"on":""}" data-i="${i}"><span class="cb">✓</span><span>${esc(c.title)}</span><span class="p">${esc(c.path)}</span></div>`).join("")}</div>
      <div class="ft"><span class="note">加密逐文件进行，完成后原文件删除</span>
      <button class="btn" id="dNo">取消</button><button class="btn gold" id="dOk">加密存入</button></div>`);
    $("dlg").querySelectorAll(".dep").forEach(el=>el.onclick=()=>{
      const i=+el.dataset.i; picked.has(i)?picked.delete(i):picked.add(i); render();
    });
    $("dNo").onclick = closeDlg;
    $("dOk").onclick = ()=>{
      if(!picked.size){ toast("未选择任何笔记"); return; }
      const idx = [...picked];
      closeDlg();
      runProgress("加密存入", idx.map(i=>CANDIDATES[i].path), ()=>{
        idx.forEach(i=>{
          const c = CANDIDATES[i];
          notes.push({id:Date.now()+Math.random(), no:"B-"+String(seq++).padStart(2,"0"), title:c.title, path:c.path, date:"2026-09-11", words:600+Math.floor(Math.random()*1500), size:(2+Math.random()*10).toFixed(1)+" KB", atts:[], ts:Date.now()});
        });
        view = "notes"; selId = null; renderAll();
        toast(`已存入 ${idx.length} 篇，原文件已加密移除`);
      });
    };
  };
  render();
};

/* ================= 体检 ================= */
$("healthBtn").onclick = ()=>{ if(unlocked) openHealth(); };
function openHealth(){
  const scan = ()=>{
    const files = ["safe.enc 清单", ...notes.flatMap(n=>[n.no, ...n.atts.map(a=>a.n)])];
    openDlg(`<div class="hd"><h3>保险库体检</h3><div class="sub">逐项校验清单、密文镜像与附件完整性</div></div>
      <div class="bd"><div class="prog"><div class="pc" style="margin:0 0 4px"><span id="pCur">准备中…</span><span id="pN"></span></div>
      <div class="pbar"><i id="pBar"></i></div></div></div>`);
    let i=0;
    const step = ()=>{
      if(i<files.length){
        $("pCur").textContent = files[i]; $("pN").textContent = `${i+1} / ${files.length}`;
        $("pBar").style.width = Math.round((i+1)/files.length*100)+"%"; i++; setTimeout(step,200);
      }else{
        health = { time:"09-11", items:[
          {cat:"dead-entry", lab:"B-13 · 临时草稿 0812（清单条目无镜像）", key:"entry:x1"},
          {cat:"orphan-file", lab:"k9x2m4.enc（磁盘镜像无对应条目）", key:"file:f1"},
          {cat:"corrupted-body", lab:"B-07 · 密文镜像校验失败", key:""},
        ]};
        report();
      }
    };
    setTimeout(step,300);
  };
  const checked = new Set();
  const report = ()=>{
    const cleanable = health.items.filter(x=>x.cat==="dead-entry"||x.cat==="orphan-file");
    const ro = health.items.filter(x=>!(x.cat==="dead-entry"||x.cat==="orphan-file"));
    openDlg(`<div class="hd"><h3>体检报告 · ${health.time}</h3><div class="sub">共 ${health.items.length} 项发现；勾选项可安全清理，其余仅报告</div></div>
      <div class="bd">
        ${cleanable.length?`<div class="hsec"><div class="h">可 清 理（${cleanable.length}）</div>${cleanable.map(x=>`
          <div class="hitem" data-key="${x.key}"><span class="cb">✓</span><span class="lab">${esc(x.lab)}</span><span class="cat">${x.cat==="dead-entry"?"死条目":"孤儿文件"}</span></div>`).join("")}</div>`:""}
        ${ro.length?`<div class="hsec"><div class="h">仅 报 告（${ro.length}）</div>${ro.map(x=>`
          <div class="hitem ro"><span class="lab">${esc(x.lab)}</span><span class="cat">${x.cat==="corrupted-body"?"密文损坏":"附件缺失"}</span></div>`).join("")}
          <div style="font-size:11px;color:var(--faint);padding:4px 2px">损坏与缺失类请从备份恢复后重试还原，删除即真丢数据</div></div>`:""}
        ${!health.items.length?'<div style="text-align:center;color:var(--ok);padding:20px 0">全部通过，库内无异常</div>':""}
      </div>
      <div class="ft"><span class="note" id="hCount"></span>
      <button class="btn" id="hRe">重新扫描</button>
      <button class="btn gold" id="hClean" ${cleanable.length?"":"disabled style='opacity:.5'"}>清理所选</button></div>`);
    $("dlg").querySelectorAll(".hitem[data-key]").forEach(el=>el.onclick=()=>{
      const k = el.dataset.key; checked.has(k)?checked.delete(k):checked.add(k);
      el.classList.toggle("on", checked.has(k));
      $("hCount").textContent = checked.size ? `将清理 ${checked.size} 项` : "";
    });
    $("hRe").onclick = scan;
    $("hClean").onclick = ()=>{
      if(!checked.size){ toast("未勾选任何清理项"); return; }
      confirmDlg({title:"确认清理", msg:`将清理 ${checked.size} 项死条目 / 孤儿文件。清理不影响仍有效的笔记。`, ok:"执行清理", gold:true,
        then:()=>runProgress("清理", [...checked], ()=>{
          health.items = health.items.filter(x=>!checked.has(x.key));
          if(health.items.length) report();
          else { closeDlg(); renderHealthSec(); renderAll(); }
          toast("清理完成");
        })});
    };
  };
  scan();
}

/* ================= 正文预览（Markdown 渲染，关窗即清） ================= */
function mdRender(src){
  const lines = String(src).split("\n");
  let html = "", ul = false, ol = false;
  const closeLists = ()=>{ if(ul){html+="</ul>";ul=false;} if(ol){html+="</ol>";ol=false;} };
  const inline = s=>esc(s)
    .replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
    .replace(/`([^`]+)`/g,"<code>$1</code>");
  for(const line of lines){
    let m;
    if((m = line.match(/^(#{1,3})\s+(.*)$/))){ closeLists(); const l=m[1].length; html += `<h${l}>${inline(m[2])}</h${l}>`; }
    else if(/^\s*[-*]\s+/.test(line)){ if(ol){html+="</ol>";ol=false;} if(!ul){html+="<ul>";ul=true;} html += `<li>${inline(line.replace(/^\s*[-*]\s+/,""))}</li>`; }
    else if(/^\s*\d+\.\s+/.test(line)){ if(ul){html+="</ul>";ul=false;} if(!ol){html+="<ol>";ol=true;} html += `<li>${inline(line.replace(/^\s*\d+\.\s+/,""))}</li>`; }
    else if(/^>\s?/.test(line)){ closeLists(); html += `<blockquote>${inline(line.replace(/^>\s?/,""))}</blockquote>`; }
    else if(/^-{3,}$/.test(line.trim())){ closeLists(); html += "<hr>"; }
    else if(line.trim()===""){ closeLists(); }
    else { closeLists(); html += `<p>${inline(line)}</p>`; }
  }
  closeLists();
  return html;
}
function openPreview(n){
  $("pvTitle").textContent = n.title;
  $("pvMeta").textContent = `柜位 ${n.no} · 存入 ${n.date} · ${n.words.toLocaleString()} 字 · ${n.size}`;
  // MarkdownRenderer.render 是追加语义：渲染前容器必须为空（原型里先清空再渲染）
  $("pvBody").innerHTML = mdRender(BODY[n.no] || "（正文密文样本）");
  $("pvMask").classList.add("open");
}
$("pvClose").onclick = ()=>$("pvMask").classList.remove("open");
$("pvMask").addEventListener("click",e=>{ if(e.target===e.currentTarget) $("pvMask").classList.remove("open"); });

/* ================= 附件灯箱 ================= */
function openLightbox(note, att){
  if(!SET.previewEnabled){ toast("附件预览层已关闭，请还原后查看"); return; }
  $("lbTitle").textContent = `${att.n} · 柜位 ${note.no}`;
  $("lbTag").textContent = "预览层 · 384px 低分辨率";
  $("lbPh").className = "ph";
  $("lbOrig").style.display = att.t==="img" ? "" : "none";
  if(att.t==="doc") $("lbTag").textContent = "文档类型仅存档 · 还原后可打开";
  $("lbOrig").onclick = ()=>{
    if(SET.autoLoadOriginal){ $("lbPh").className="ph orig"; $("lbTag").textContent="原图 · 全尺寸"; return; }
    confirmDlg({title:"载入原图", msg:"将解密全尺寸原图（更大暴露面）。可在设置中开启「自动载入原图」。", ok:"解密载入", gold:true,
      then:()=>{ $("lbPh").className="ph orig"; $("lbTag").textContent="原图 · 全尺寸"; }});
  };
  $("lb").classList.add("open");
}
$("lbClose").onclick = ()=>$("lb").classList.remove("open");
$("lb").addEventListener("click",e=>{ if(e.target===e.currentTarget) $("lb").classList.remove("open"); });

/* ================= 右键菜单 ================= */
const cmenu = $("cmenu");
function showMenu(x,y,items){
  cmenu.innerHTML = items.map((it,i)=>`${i>0?'<div class="sep"></div>':""}<button data-i="${i}" class="${it.danger?"dgr":""}">${it.label}</button>`).join("");
  cmenu.classList.add("open");
  const r = cmenu.getBoundingClientRect();
  cmenu.style.left = Math.max(4, Math.min(x, innerWidth - r.width - 8))+"px";
  cmenu.style.top  = Math.max(4, Math.min(y, innerHeight - r.height - 8))+"px";
  cmenu.querySelectorAll("button").forEach(btn=>btn.onclick=()=>{ hideMenu(); items[+btn.dataset.i].fn(); });
}
function hideMenu(){ cmenu.classList.remove("open"); }
document.addEventListener("click", hideMenu);
document.addEventListener("contextmenu", e=>{
  if(!unlocked) return;
  if(e.target.closest(".mask")||e.target.closest(".lb")||e.target.closest("#lock")) return;
  const rowEl = e.target.closest(".nrow");
  const detEl = e.target.closest("#detail");
  const n = rowEl ? notes.find(x=>x.id===+rowEl.dataset.id) : (detEl ? notes.find(x=>x.id===selId) : null);
  if(n){
    e.preventDefault();
    if(selId!==n.id){ selId = n.id; renderAll(); }
    const items = [];
    if(n.atts.length) items.push({label:`解密预览附件（${n.atts.length}）`, fn:()=>openLightbox(n, n.atts[0])});
    // 正文开/关互斥：按状态只出一条
    items.push({label:"解密预览正文", fn:()=>openPreview(n)});
    items.push({label:"取出还原", fn:()=>outNote(n)});
    items.push({label:"销毁", danger:true, fn:()=>destroyNote(n)});
    showMenu(e.clientX, e.clientY, items);
    return;
  }
  if(e.target.closest("#desk")){
    // 空白处：只挂有内容的菜单（设置入口收在这里）
    e.preventDefault();
    showMenu(e.clientX, e.clientY, [{label:"保险库设置", fn:openSettings}]);
  }
});

renderHealthSec();
